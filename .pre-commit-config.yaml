repos:
  - repo: local
    hooks:
      - id: ruff
        name: Python fatal-error lint (sw)
        entry: ruff check sw
        language: python
        additional_dependencies: [ruff==0.16.8]
        pass_filenames: false
        files: ^(sw/.*\.py|pyproject\.toml)$
      - id: mypy
        name: Golden model and pilot driver types
        entry: mypy
        language: python
        additional_dependencies: [mypy==2.3.1]
        pass_filenames: false
        files: ^(sw/(golden|pilotlink)/.*\.py|pyproject\.toml)$
      - id: spdx
        name: SPDX distribution policy
        entry: python3 scripts/spdx_check.py
        language: system
        pass_filenames: false
        always_run: true
      - id: peripheral-registers
        name: Generated peripheral register consistency
        entry: python regmap/generate_peripherals.py --check
        language: python
        additional_dependencies: [PyYAML==6.0.3]
        pass_filenames: false
        files: ^(regmap/|hw/soc/rtl/|hw/soc/tb/sw/soc_reg_offsets\.h|sw/golden/peripheral_regs_gen\.py)
      - id: soc-verilator
        name: Prepared whole-SoC Verilator diagnostic gate
        entry: python3 scripts/precommit_soc_lint.py
        language: system
        stages: [manual]
        pass_filenames: false
        always_run: true
