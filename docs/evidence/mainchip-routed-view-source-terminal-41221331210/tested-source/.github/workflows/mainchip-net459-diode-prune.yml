name: Source controls for routed view and parasitic coverage admission
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Source-only controls; native export and RC/STA are disabled
        type: choice
        required: true
        default: controls
        options: [controls]
permissions:
  contents: read
  actions: read
concurrency:
  group: routed-view-source-${{ github.ref }}
  cancel-in-progress: false
env:
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  source-controls:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Bind exact branch and protected inherited sources
        env:
          SELECTED_MODE: ${{ inputs.mode }}
        run: |
          python3 -B - <<'PY'
          import ast,hashlib,json,os,subprocess,sys
          from pathlib import Path
          out=Path('routed-view-controls');out.mkdir(exist_ok=False)
          e=os.environ
          assert e['GITHUB_REPOSITORY']=='Melihakbulut221/nssoc'
          assert e['GITHUB_EVENT_NAME']=='workflow_dispatch' and e['GITHUB_RUN_ATTEMPT']=='1'
          assert e['GITHUB_REF']=='refs/heads/codex/mainchip-routed-view-admission'
          assert e['SELECTED_MODE']=='controls'
          assert subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()==e['GITHUB_SHA']
          sys.path.insert(0,'scripts')
          import mainchip_routed_view_admission as a
          raw=Path(a.MANIFEST).read_bytes()
          assert hashlib.sha256(raw).hexdigest()=='e76021a05dabc5b06c644c74f4f78b7e622b6c028a61b91deba7127597694244'
          manifest=a.source_gate()
          assert manifest==json.loads(raw) and manifest['terminal_binding'] is None
          for path in manifest['new_python']:ast.parse(Path(path).read_bytes(),filename=path)
          (out/'manifest.json').write_bytes(raw)
          context=dict(source=e['GITHUB_SHA'],run_id=int(e['GITHUB_RUN_ID']),attempt=1,
            source_controls_only=True,mode='controls',native_export_authorized=False,
            native_acquisition=False,native_executed=False,physical_acceptance=False,timing_accepted=False,full_phy_accepted=False,
            manifest_sha256=hashlib.sha256(raw).hexdigest(),
            workflow_sha256=hashlib.sha256(Path('.github/workflows/mainchip-net459-diode-prune.yml').read_bytes()).hexdigest(),
            inherited_qualified_controls=373,inherited_tested_source='c6132e91884c796bfdb5c38f9b4c1bb015ccc74d',
            inherited_proof='ae4e05018e4f88943b45e56b76daf620ca1b9497',
            synthetic_only=True,native_tool_modules_loaded=False)
          (out/'context.json').write_text(json.dumps(context,sort_keys=True,indent=2)+'\n')
          PY
          command -v tclsh
      - name: Exercise real admission and coverage code with complete synthetic inventories
        run: |
          set -o pipefail
          python3 -B scripts/check_mainchip_routed_view_admission.py 2>&1 | tee routed-view-controls/controls.log
      - name: Require complete meaningful source controls
        run: |
          python3 -B - <<'PY'
          import json,os
          from pathlib import Path
          r=json.loads(Path('routed-view-controls/controls.json').read_bytes())
          assert r['source']==os.environ['GITHUB_SHA'] and r['run_id']==int(os.environ['GITHUB_RUN_ID']) and r['attempt']==1
          assert r['status']=='PASS' and r['tests']==25 and r['failures']==r['errors']==r['skipped']==[]
          assert r['environment_unchanged'] is True
          assert all(r[k] is False for k in ('native_acquisition','native_executed','physical_acceptance','timing_accepted','full_phy_accepted'))
          s=r['synthetic']
          assert s['full_lineage'] and s['complete_nine_capture_collect'] and s['complete_inventory_nonmutation']
          assert s['complete_saved_capsule_audit'] and s['original17command_audit_used']
          assert s['actual_tcl_render_executed_with_synthetic_api'] and s['native_bytes_generated'] is False
          assert {k:s[k] for k in ('baseline_instances','added_diodes','final_instances','nets','mutable_nets','protected_nets')}==dict(baseline_instances=153129,added_diodes=1351,final_instances=154480,nets=143820,mutable_nets=608,protected_nets=1691)
          PY
      - name: Always emit every source output including failures
        if: always()
        run: |
          python3 -B - <<'PY'
          import base64,hashlib,json
          from pathlib import Path
          for name in ('context.json','manifest.json','controls.json','controls.log'):
              p=Path('routed-view-controls')/name
              assert not p.is_symlink()
              present=p.is_file();raw=p.read_bytes() if present else b''
              chunks=[raw[i:i+6000] for i in range(0,len(raw),6000)]
              print('ROUTED_VIEW_INDEX '+json.dumps(dict(path=name,present=present,bytes=len(raw),sha256=hashlib.sha256(raw).hexdigest(),chunks=len(chunks)),sort_keys=True))
              for i,b in enumerate(chunks):
                  print('ROUTED_VIEW_CHUNK '+json.dumps(dict(path=name,index=i,base64=base64.b64encode(b).decode()),sort_keys=True))
          PY
      - name: Preserve all source records
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: routed-view-controls-${{ github.run_id }}-${{ github.run_attempt }}
          path: routed-view-controls
          if-no-files-found: error
          retention-days: 90
  preserve-job-log:
    needs: source-controls
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Preserve full source job log and metadata
        run: |
          python3 -B - <<'PY'
          import hashlib,json,os,subprocess
          from pathlib import Path
          out=Path('job-logs');out.mkdir()
          e=os.environ
          assert e['GITHUB_REPOSITORY']=='Melihakbulut221/nssoc' and e['GITHUB_RUN_ATTEMPT']=='1'
          prefix='repos/'+e['GITHUB_REPOSITORY']+'/'
          def read(path,name):
              raw=subprocess.check_output(['gh','api',prefix+path]);(out/name).write_bytes(raw);return json.loads(raw)
          run=read('actions/runs/'+e['GITHUB_RUN_ID'],'run.json')
          assert run['head_sha']==e['GITHUB_SHA'] and run['run_attempt']==1
          jobs=read('actions/runs/'+e['GITHUB_RUN_ID']+'/attempts/1/jobs?per_page=100','jobs.json')
          rows=[j for j in jobs['jobs'] if j['name']=='source-controls'];assert len(rows)==1
          job=read('actions/jobs/'+str(rows[0]['id']),'job.json')
          assert job['head_sha']==e['GITHUB_SHA'] and job['run_id']==int(e['GITHUB_RUN_ID'])
          raw=subprocess.check_output(['gh','api','--allow-escape-sequences',prefix+'actions/jobs/'+str(job['id'])+'/logs'])
          assert raw;(out/'job.log').write_bytes(raw)
          receipt=dict(source=e['GITHUB_SHA'],run_id=int(e['GITHUB_RUN_ID']),attempt=1,job_id=job['id'],
            job_conclusion=job['conclusion'],api_status=job['status'],full_raw_job_log=True,
            bytes=len(raw),sha256=hashlib.sha256(raw).hexdigest(),native_acquisition=False,native_executed=False)
          (out/'receipt.json').write_text(json.dumps(receipt,sort_keys=True,indent=2)+'\n')
          print(json.dumps(receipt,sort_keys=True))
          PY
      - name: Preserve complete source job log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: routed-view-source-job-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: job-logs
          if-no-files-found: error
          retention-days: 90
