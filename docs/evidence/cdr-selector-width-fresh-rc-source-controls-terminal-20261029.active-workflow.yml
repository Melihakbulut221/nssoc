name: CDR current width fresh RC adapter source controls
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: cdr-width-fresh-rc-input-evidence-controls-${{ github.ref }}
  cancel-in-progress: false
env:
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  source-controls:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Require first cloud attempt and exact source checkout
        run: |
          python3 -B - <<'PY'
          import json,os,re,subprocess,sys
          from pathlib import Path
          e=os.environ
          assert e['GITHUB_ACTIONS']=='true' and e['RUNNER_OS']=='Linux'
          assert e['GITHUB_REPOSITORY']=='Melihakbulut221/nssoc'
          assert e['GITHUB_EVENT_NAME']=='workflow_dispatch' and e['GITHUB_RUN_ATTEMPT']=='1'
          assert e['GITHUB_REF']=='refs/heads/codex/cdr-selector-width-fresh-rc-stage'
          assert re.fullmatch('[0-9a-f]{40}',e['GITHUB_SHA'])
          assert re.fullmatch('[1-9][0-9]*',e['GITHUB_RUN_ID'])
          assert subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()==e['GITHUB_SHA']
          assert sys.version_info[:2]==(3,12)
          sys.path.insert(0,'scripts')
          import cdr_selector_width_fresh_rc_admission as source
          method=source.methods()
          assert method['source_controls_authorized'] is True and method['controller_readiness'] is False
          assert all(method[n] is False for n in source.NATIVE_FLAGS+source.FALSE)
          row=dict(source=e['GITHUB_SHA'],run_id=int(e['GITHUB_RUN_ID']),attempt=1,
            branch=e['GITHUB_REF'],event=e['GITHUB_EVENT_NAME'],python=sys.version,
            source_controls_only=True,native_authorized=False)
          Path('width-fresh-rc-control-context.json').write_text(json.dumps(row,sort_keys=True,indent=2)+'\n')
          PY
      - name: Authenticate complete native width proof and exact current RC inputs
        run: |
          python3 -B scripts/check_cdr_width_rc_input_evidence.py --output width-fresh-rc-controls.json > width-fresh-rc-controls.stdout 2> width-fresh-rc-controls.stderr
          python3 -B - <<'PY'
          import json,os
          from pathlib import Path
          r=json.loads(Path('width-fresh-rc-controls.json').read_bytes())
          assert r['status']=='PASS_READ_ONLY_WIDTH_RC_INPUT_EVIDENCE_CONTROLS'
          assert (r['positive_count'],r['refusal_count'])==(4,36)
          assert r['current_source']==os.environ['GITHUB_SHA'] and r['current_run']==os.environ['GITHUB_RUN_ID']
          assert r['current_attempt']=='1' and r['metadata_only'] is True
          assert all(r[k] is False for k in ('native_execution','archive_acquired','extraction_executed','simulation_executed','full_phy_accepted'))
          PY
      - name: Exercise actual restore code and current75 adapter boundaries
        run: |
          python3 -B scripts/check_cdr_selector_width_fresh_rc_source.py --output width-fresh-rc-adapter-controls.json > width-fresh-rc-adapter-controls.stdout 2> width-fresh-rc-adapter-controls.stderr
          python3 -B - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          r=json.loads(Path('width-fresh-rc-adapter-controls.json').read_bytes())
          assert r['status']=='PASS_FRESH_WIDTH_RC_ADMISSION_ADAPTER_SOURCE_CONTROLS_ONLY'
          assert (r['tests'],r['failures'],r['errors'])==(8,0,0)
          assert (r['positive_records'],r['refusal_records'])==(5,43)
          assert (r['source_head'],r['run_id'],r['run_attempt'])==(os.environ['GITHUB_SHA'],int(os.environ['GITHUB_RUN_ID']),1)
          assert r['method_sha256']==hashlib.sha256(Path('scripts/cdr-selector-width-fresh-rc-methods.json').read_bytes()).hexdigest()
          assert all(r[k] is False for k in ('native_execution','native_payload_acquired','archive_downloaded',
            'real_archive_restoration_qualified','numerical_RC_executed','controller_readiness',
            'physical_accepted','electrical_accepted','qualified_pex','full_phy_accepted'))
          PY
      - name: Always emit complete exact source control records
        if: always()
        run: |
          python3 -B - <<'PY'
          import base64,hashlib,json
          from pathlib import Path
          for name in ('width-fresh-rc-control-context.json','width-fresh-rc-controls.json','width-fresh-rc-controls.stdout','width-fresh-rc-controls.stderr','width-fresh-rc-adapter-controls.json','width-fresh-rc-adapter-controls.stdout','width-fresh-rc-adapter-controls.stderr'):
              p=Path(name);present=p.is_file() and not p.is_symlink();raw=p.read_bytes() if present else b''
              chunks=[raw[i:i+6000] for i in range(0,len(raw),6000)]
              print('WIDTH_RC_INPUT_CONTROL_INDEX '+json.dumps(dict(path=name,present=present,bytes=len(raw),sha256=hashlib.sha256(raw).hexdigest(),chunks=len(chunks))))
              for i,b in enumerate(chunks):
                  print('WIDTH_RC_INPUT_CONTROL_CHUNK '+json.dumps(dict(path=name,index=i,base64=base64.b64encode(b).decode())))
          PY
      - name: Preserve complete report and command streams
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: width-fresh-rc-input-source-controls-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            width-fresh-rc-control-context.json
            width-fresh-rc-controls.json
            width-fresh-rc-controls.stdout
            width-fresh-rc-controls.stderr
            width-fresh-rc-adapter-controls.json
            width-fresh-rc-adapter-controls.stdout
            width-fresh-rc-adapter-controls.stderr
          if-no-files-found: error
          retention-days: 90
  preserve-source-job-log:
    needs: source-controls
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Preserve the completed source job full raw log and provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -B - <<'PY'
          import hashlib,json,os,subprocess
          from pathlib import Path
          e=os.environ;repo=e['GITHUB_REPOSITORY'];run_id=e['GITHUB_RUN_ID'];attempt=e['GITHUB_RUN_ATTEMPT']
          assert repo=='Melihakbulut221/nssoc' and e['GITHUB_ACTIONS']=='true'
          assert e['GITHUB_EVENT_NAME']=='workflow_dispatch' and attempt=='1'
          def read(endpoint,name):
              raw=subprocess.check_output(['gh','api','repos/'+repo+'/'+endpoint])
              Path(name).write_bytes(raw);return json.loads(raw)
          run=read('actions/runs/'+run_id,'width-fresh-rc-run.json')
          jobs=read('actions/runs/'+run_id+'/attempts/'+attempt+'/jobs?per_page=100','width-fresh-rc-jobs.json')
          assert run['id']==int(run_id) and run['head_sha']==e['GITHUB_SHA'] and run['run_attempt']==1
          matches=[j for j in jobs['jobs'] if j['name']=='source-controls']
          assert len(matches)==1
          j=matches[0]
          assert j['run_id']==int(run_id) and j['head_sha']==e['GITHUB_SHA'] and j['run_attempt']==1 and j['status']=='completed'
          read('actions/jobs/'+str(j['id']),'width-fresh-rc-source-job.json')
          log=subprocess.check_output(['gh','api','--allow-escape-sequences','repos/'+repo+'/actions/jobs/'+str(j['id'])+'/logs'])
          assert log
          Path('width-fresh-rc-source-job.log').write_bytes(log)
          names=('width-fresh-rc-run.json','width-fresh-rc-jobs.json','width-fresh-rc-source-job.json','width-fresh-rc-source-job.log')
          files={name:dict(bytes=Path(name).stat().st_size,sha256=hashlib.sha256(Path(name).read_bytes()).hexdigest()) for name in names}
          receipt=dict(source=e['GITHUB_SHA'],run_id=int(run_id),attempt=1,source_job_id=j['id'],
            source_job_conclusion=j['conclusion'],full_source_job_log=True,files=files,
            native_authorized=False,metadata_only=True)
          Path('width-fresh-rc-source-job-log-receipt.json').write_text(json.dumps(receipt,sort_keys=True,indent=2)+'\n')
          print(json.dumps(receipt,sort_keys=True))
          PY
      - name: Preserve full completed source job log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: width-fresh-rc-input-full-source-job-log-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            width-fresh-rc-run.json
            width-fresh-rc-jobs.json
            width-fresh-rc-source-job.json
            width-fresh-rc-source-job.log
            width-fresh-rc-source-job-log-receipt.json
          if-no-files-found: error
          retention-days: 90
