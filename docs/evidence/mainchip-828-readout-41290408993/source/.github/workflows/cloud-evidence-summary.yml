name: Read stopped 828-net router output without native CAD rerun
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  readout:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/cloud_route_terminal_readout.py
            /scripts/cloud-route-terminal-readout-pins.json
            /.github/workflows/cloud-evidence-summary.yml
      - name: Qualify source bytes before archive acquisition
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 -B - <<'PY'
          import hashlib,json,pathlib
          for name,pin in json.loads(pathlib.Path("scripts/cloud-route-terminal-readout-pins.json").read_text()).items():
              raw=pathlib.Path(name).read_bytes()
              assert len(raw)==pin["bytes"] and hashlib.sha256(raw).hexdigest()==pin["sha256"]
              if name.endswith(".py"):compile(raw,name,"exec")
          PY
      - name: Authenticate all archived members and expose exact router logs and Tcl only
        run: python3 -B scripts/cloud_route_terminal_readout.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: stopped-route-readout-${{ github.run_id }}
          path: cloud-route-terminal-readout
          retention-days: 90
          if-no-files-found: error
