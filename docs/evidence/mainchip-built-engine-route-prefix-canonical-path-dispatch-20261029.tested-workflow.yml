name: Built engine shared routing prefix
on:
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: mainchip-built-engine-route-prefix-${{ github.ref }}
  cancel-in-progress: false
env:
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  source-controls:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Exact source admission and lifecycle refusal controls
        run: python3 -B scripts/check_mainchip_built_engine_route_prefix.py > route-prefix-controls.json
      - name: Preserve complete controls in job log
        if: always()
        run: |
          python3 - <<'PY'
          import base64,hashlib,json
          from pathlib import Path
          p=Path("route-prefix-controls.json");b=p.read_bytes() if p.is_file() else b""
          pieces=[b[i:i+6000] for i in range(0,len(b),6000)]
          print("ROUTE_PREFIX_RECORD_INDEX "+json.dumps(dict(path=p.name,present=p.is_file(),bytes=len(b),sha256=hashlib.sha256(b).hexdigest(),chunks=len(pieces))))
          for i,v in enumerate(pieces):print("ROUTE_PREFIX_RECORD_CHUNK "+json.dumps(dict(path=p.name,index=i,base64=base64.b64encode(v).decode())))
          PY
  native-prefix:
    needs: source-controls
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Repeat source controls before any native restoration
        run: python3 -B scripts/check_mainchip_built_engine_route_prefix.py > route-prefix-controls.json
      - name: Preserve complete controls in job log
        if: always()
        run: |
          python3 - <<'PY'
          import base64,hashlib,json
          from pathlib import Path
          p=Path("route-prefix-controls.json");b=p.read_bytes() if p.is_file() else b""
          pieces=[b[i:i+6000] for i in range(0,len(b),6000)]
          print("ROUTE_PREFIX_RECORD_INDEX "+json.dumps(dict(path=p.name,present=p.is_file(),bytes=len(b),sha256=hashlib.sha256(b).hexdigest(),chunks=len(pieces))))
          for i,v in enumerate(pieces):print("ROUTE_PREFIX_RECORD_CHUNK "+json.dumps(dict(path=p.name,index=i,base64=base64.b64encode(v).decode())))
          PY
      - name: Restore exact ELF and preserve the prepared native routing prefix
        id: probe
        run: python3 -B scripts/cloud_mainchip_built_engine_route_prefix.py probe
      - name: Permanently preserve all available terminal evidence
        if: ${{ always() && steps.probe.outcome != 'skipped' }}
        run: python3 -B scripts/cloud_mainchip_built_engine_route_prefix.py publish
      - name: Artifact fallback for available cloud evidence
        if: ${{ always() && steps.probe.outcome != 'skipped' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: built-engine-route-prefix-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/mainchip-built-engine-route-prefix-${{ github.run_id }}-${{ github.run_attempt }}/out/
          if-no-files-found: error
          retention-days: 90
          compression-level: 1
