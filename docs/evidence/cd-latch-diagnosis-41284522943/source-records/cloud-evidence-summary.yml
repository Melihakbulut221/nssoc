name: Mixed20 C D latch snapshots and clock emitter connectivity
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cd-latch-diagnosis-${{ github.ref }}
  cancel-in-progress: false
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/cd_latch_diagnosis.py
            /scripts/cd-latch-diagnosis-inputs.json
            /.github/workflows/cloud-evidence-summary.yml
      - name: Authenticate actual latch topology and same-time derived observations
        run: python3 -B scripts/cd_latch_diagnosis.py
      - name: Preserve exact source
        if: always()
        run: |
          mkdir source-records
          cp scripts/cd_latch_diagnosis.py scripts/cd-latch-diagnosis-inputs.json .github/workflows/cloud-evidence-summary.yml source-records/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: cd-latch-diagnosis-${{ github.run_id }}
          path: |
            cloud-cd-latch-diagnosis
            source-records
          if-no-files-found: error
          retention-days: 90

