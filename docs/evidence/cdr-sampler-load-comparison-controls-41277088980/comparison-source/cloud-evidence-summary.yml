name: Original-master q15 buffer/load original-gate comparison
on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [controls, compare]
        default: controls
permissions:
  contents: read
concurrency:
  group: sampler-load-comparison-${{ github.ref }}
  cancel-in-progress: false
jobs:
  comparison:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/cdr_sampler_load_comparison.py
            /scripts/cdr-sampler-load-comparison-inputs.json
            /.github/workflows/cloud-evidence-summary.yml
      - name: Original-gate comparison corruption controls on authenticated baseline
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$GITHUB_RUN_ATTEMPT" = "1"
          python3 -B scripts/cdr_sampler_load_comparison.py --controls
      - name: Compare actual candidate against all original metrics
        if: ${{ inputs.mode == 'compare' }}
        run: python3 -B scripts/cdr_sampler_load_comparison.py
      - name: Preserve complete comparison sources
        if: always()
        run: |
          mkdir -p comparison-source
          cp scripts/cdr_sampler_load_comparison.py scripts/cdr-sampler-load-comparison-inputs.json .github/workflows/cloud-evidence-summary.yml comparison-source/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: sampler-load-comparison-${{ github.run_id }}
          path: |
            cloud-sampler-load-comparison-controls
            cloud-sampler-load-comparison
            comparison-source
          if-no-files-found: error
          retention-days: 90
