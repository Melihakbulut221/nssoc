name: Physical divider wire shortcuts
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: cdr-wire-shortcuts-${{ github.ref }}
  cancel-in-progress: false
env:
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  source-controls:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/cloud_cdr_wire_shortcuts.py
            /scripts/cloud_cdr_wire_geometry_acquire.py
            /scripts/cdr-wire-shortcuts-inputs.json
            /scripts/cdr-wire-shortcuts-pins.json
            /.github/workflows/cloud-evidence-summary.yml
            /docs/cdr-wire-shortcuts.md
      - run: python3 -m pip install --disable-pip-version-check --no-cache-dir numpy==2.3.3 scipy==1.16.2 klayout==0.30.4.post1
      - name: Qualify original numerical controls and new geometry refusals
        run: python3 -B scripts/cloud_cdr_wire_shortcuts.py --controls
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: wire-shortcuts-controls-${{ github.run_id }}
          path: wire-shortcuts
          if-no-files-found: error
          retention-days: 90
  native-geometry:
    needs: source-controls
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/cloud_cdr_wire_shortcuts.py
            /scripts/cloud_cdr_wire_geometry_acquire.py
            /scripts/cdr-wire-shortcuts-inputs.json
            /scripts/cdr-wire-shortcuts-pins.json
            /.github/workflows/cloud-evidence-summary.yml
            /docs/cdr-wire-shortcuts.md
      - run: python3 -m pip install --disable-pip-version-check --no-cache-dir numpy==2.3.3 scipy==1.16.2 klayout==0.30.4.post1
      - name: Require independent empty exact-source release reservation
        id: reserve
        run: |
          python3 -B - <<'PY'
          import json,os,subprocess,time
          e=os.environ;tag='cloud-results-'+e['GITHUB_RUN_ID']+'-1-cdr-wire-shortcuts'
          for i in range(120):
              p=subprocess.run(['gh','api','repos/Melihakbulut221/nssoc/releases/tags/'+tag],capture_output=True,text=True)
              if p.returncode==0:
                  r=json.loads(p.stdout);break
              assert 'HTTP 404'in p.stderr,p.stderr
              time.sleep(2)
          else:raise RuntimeError('missing independent reservation')
          assert r['target_commitish']==e['GITHUB_SHA']and not r['assets']
          ref=json.loads(subprocess.check_output(['gh','api','repos/Melihakbulut221/nssoc/git/ref/tags/'+tag]))
          assert ref['object']['sha']==e['GITHUB_SHA']
          PY
      - name: Authenticate original physical capsule and generate guarded shortcuts
        run: python3 -B scripts/cloud_cdr_wire_shortcuts.py --generate
      - name: Preserve actual success or failure and candidate GDS permanently
        if: always() && steps.reserve.outcome == 'success'
        run: python3 -B scripts/cloud_cdr_wire_shortcuts.py --publish
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: wire-shortcuts-derived-${{ github.run_id }}
          path: wire-shortcuts
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: wire-shortcuts-native-fallback-${{ github.run_id }}
          path: |
            wire-shortcuts-native
            wire-shortcuts-publication
          if-no-files-found: warn
          retention-days: 90
