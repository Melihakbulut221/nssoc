name: Current Via2 M3 loaded screen
on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [controls, loaded]
        default: controls
        required: true
      approved_source:
        type: string
        required: true
permissions:
  contents: read
  actions: read
concurrency:
  group: cdr-via2-m3-loaded-${{ inputs.mode == 'loaded' && github.ref || format('{0}-{1}', github.sha, github.run_id) }}
  cancel-in-progress: false
env:
  PYTHONDONTWRITEBYTECODE: '1'
  REQUESTED_MODE: ${{ inputs.mode }}
  APPROVED_SOURCE: ${{ inputs.approved_source }}
jobs:
  source-controls:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/cdr-via2-m3-loaded-adapter-pins.json
      - name: Materialize only exact source and derived JSON closure
        run: |
          python3 -B - <<'PY'
          import json,subprocess
          from pathlib import Path
          manifest='scripts/cdr-via2-m3-loaded-adapter-pins.json'
          p=json.loads(Path(manifest).read_bytes())
          names=sorted(set(p['files'])|{manifest})
          assert all(not n.startswith('/')and '..'not in Path(n).parts and not any(c in n for c in '*?[!\\\n\r')for n in names)
          subprocess.run(['git','sparse-checkout','set','--no-cone','--stdin'],input=''.join('/'+n+'\n'for n in names),text=True,check=True,timeout=600)
          PY
      - name: Bind exact source and source-only job boundary
        run: |
          python3 -B - <<'PY'
          import ast,sys
          from pathlib import Path
          sys.path.insert(0,'scripts')
          import cdr_via2_m3_loaded_admission as c
          ctx=c.context(__import__('os').environ);method,producer=c.source_guard(ctx)
          assert method['loaded_execution_authorized'] is True and method['generation_authorized'] is False and method['fresh_rc_execution_authorized'] is False
          for p in ["scripts/cdr_via2_m3_loaded_admission.py","scripts/cdr_via2_m3_loaded_native.py","scripts/cloud_cdr_via2_m3_loaded.py","scripts/check_cdr_via2_m3_loaded_adapter.py"]:ast.parse(Path(p).read_text())
          PY
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install pinned source-fixture numerical package
        run: python3 -m pip install --disable-pip-version-check numpy==2.3.3
      - name: Run all integrated source and explicit synthetic controls
        run: python3 -B scripts/check_cdr_via2_m3_loaded_adapter.py > loaded-controls.stdout 2> loaded-controls.stderr
      - name: Preserve all synthetic results and failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cdr-via2-m3-loaded-controls-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            loaded-controls
            loaded-controls.stdout
            loaded-controls.stderr
          if-no-files-found: error
          retention-days: 90
      - name: Always emit complete derived source-control records
        if: always()
        run: |
          python3 -B - <<'PY'
          import base64,hashlib,json,sys
          from pathlib import Path
          def emit(p,prefix):
              assert p.is_file()and not p.is_symlink()
              raw=p.read_bytes();raw.decode('utf-8',errors='strict')
              chunks=[raw[i:i+24000]for i in range(0,len(raw),24000)]or[b'']
              print(prefix+'_INDEX '+json.dumps(dict(path=str(p),bytes=len(raw),sha256=hashlib.sha256(raw).hexdigest(),chunks=len(chunks)),sort_keys=True))
              for i,chunk in enumerate(chunks):print(prefix+'_CHUNK '+json.dumps(dict(path=str(p),index=i,base64=base64.b64encode(chunk).decode()),sort_keys=True))
          for name in ('loaded-controls.stdout','loaded-controls.stderr','loaded-controls/result.json'):
              p=Path(name)
              if p.exists():emit(p,'VIA2_M3_LOADED_CONTROL')
          PY
  preserve-job-log:
    needs: source-controls
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Preserve full actual source job log and metadata
        run: |
          python3 -B - <<'PY'
          import hashlib,json,os,subprocess
          from pathlib import Path
          root=Path('job-logs');root.mkdir()
          e=os.environ
          assert e['GITHUB_REPOSITORY']=='Melihakbulut221/nssoc' and e['GITHUB_RUN_ATTEMPT']=='1'
          prefix='repos/'+e['GITHUB_REPOSITORY']+'/'
          def read(path,name):
              b=subprocess.check_output(['gh','api',prefix+path],timeout=60);(root/name).write_bytes(b);return json.loads(b)
          run=read('actions/runs/'+e['GITHUB_RUN_ID'],'run.json')
          assert run['head_sha']==e['GITHUB_SHA'] and run['run_attempt']==1
          jobs=read('actions/runs/'+e['GITHUB_RUN_ID']+'/attempts/1/jobs?per_page=100','jobs.json')
          selected=[j for j in jobs['jobs'] if j['name']=='source-controls'];assert len(selected)==1
          j=selected[0];assert j['status']=='completed' and j['head_sha']==e['GITHUB_SHA']
          read('actions/jobs/'+str(j['id']),'job.json')
          b=subprocess.check_output(['gh','api','--allow-escape-sequences',prefix+'actions/jobs/'+str(j['id'])+'/logs'],timeout=60)
          assert b;(root/'job.log').write_bytes(b)
          receipt=dict(source=e['GITHUB_SHA'],run_id=int(e['GITHUB_RUN_ID']),attempt=1,
            job_id=j['id'],job_conclusion=j['conclusion'],full_raw_job_log=True,
            log_bytes=len(b),log_sha256=hashlib.sha256(b).hexdigest(),native_acquisition=False)
          (root/'receipt.json').write_text(json.dumps(receipt,sort_keys=True,indent=2)+'\n')
          print(json.dumps(receipt,sort_keys=True))
          PY
      - name: Preserve complete actual logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cdr-via2-m3-loaded-source-job-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: job-logs
          if-no-files-found: error
          retention-days: 90

  loaded:
    permissions:
      contents: write
      actions: read
    needs: [source-controls, preserve-job-log]
    if: ${{ inputs.mode == 'loaded' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/cdr-via2-m3-loaded-adapter-pins.json
      - name: Materialize exact source and derived proof closure
        run: |
          python3 -B - <<'PY'
          import json,subprocess
          from pathlib import Path
          manifest='scripts/cdr-via2-m3-loaded-adapter-pins.json'
          pins=json.loads(Path(manifest).read_bytes())
          names=sorted(set(pins['files'])|{manifest})
          assert all(not n.startswith('/')and '..'not in Path(n).parts and not any(c in n for c in '*?[!\\\n\r')for n in names)
          subprocess.run(['git','sparse-checkout','set','--no-cone','--stdin'],input=''.join('/'+n+'\n'for n in names),text=True,check=True,timeout=600)
          PY
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Require independent empty exact-source result reservation
        id: reserve
        run: |
          python3 -B - <<'PY'
          import json,os,subprocess,sys,time
          from pathlib import Path
          sys.path.insert(0,'scripts')
          import cdr_via2_m3_loaded_admission as a
          with a.phase_budget(300)as budget:
              ctx=a.context(os.environ);c,p=a.source_guard(ctx,budget=budget);a.authorize_native(ctx,c)
              tag='cloud-results-'+ctx['token']+'-'+ctx['group'];prefix='repos/Melihakbulut221/nssoc/'
              for attempt in range(120):
                  completed=subprocess.run(['gh','api',prefix+'releases/tags/'+tag],capture_output=True,text=True,timeout=budget.timeout(60))
                  if completed.returncode==0:info=json.loads(completed.stdout);break
                  assert 'HTTP 404'in completed.stderr,completed.stderr
                  time.sleep(min(2,budget.timeout(2)))
              else:raise RuntimeError('Independent exact-source reservation missing; no native acquisition')
              ref=a.api('git/ref/tags/'+tag,budget)
              proof=dict(tag=tag,tested_source=ctx['source'],release_id=info['id'],target_verified=True,assets_overwritten=False,externally_reserved=True,creation_attempted=False,existing_assets=[],read_attempts=attempt+1)
              a.q.reservation(ctx,proof,info,ref)
              for name,value in [('release-reservation.json',proof),('release-empty.json',info),('release-tag.json',ref)]:
                  a.q.write_new(Path(name),a.encode(value))
          PY
      - name: Authenticate same-run complete source controls
        run: python3 -B scripts/cloud_cdr_via2_m3_loaded.py --authenticate-controls --output loaded-native-admission
      - name: Install the original loaded engine shared libraries and numerical package
        timeout-minutes: 15
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends tcl8.6 libsndfile1 libsamplerate0 libreadline8t64 libxaw7 libxt6 libxft2 libfontconfig1
          python3 -m pip install --disable-pip-version-check --no-cache-dir numpy==2.3.3
      - name: Original nominal_late on the complete current RC model
        id: native
        run: python3 -B scripts/cloud_cdr_via2_m3_loaded.py --loaded --output hw/soc/out/cloud-cdr-via2-m3-loaded --reservation release-reservation.json --controls-proof loaded-native-admission/records/loaded-controls/result.json > via2-m3-loaded.stdout 2> via2-m3-loaded.stderr
      - name: Publish complete success or failure outputs
        if: always() && steps.reserve.outcome == 'success'
        run: python3 -B scripts/publish_cdr_via2_m3_loaded.py --case nominal_late --output hw/soc/out/cloud-cdr-via2-m3-loaded --publication hw/soc/out/cloud-cdr-via2-m3-loaded-publication --reservation release-reservation.json > via2-m3-publication.stdout 2> via2-m3-publication.stderr
      - name: Preserve all original and partial native bytes in the cloud
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cdr-via2-m3-loaded-${{ github.run_id }}-${{ github.run_attempt }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
          path: |
            hw/soc/out/cloud-cdr-via2-m3-loaded
            hw/soc/out/cloud-cdr-via2-m3-fresh-rc
            hw/soc/out/cloud-cdr-via2-m3-loaded-publication
            loaded-native-admission
            via2-m3-loaded.stdout
            via2-m3-loaded.stderr
            via2-m3-publication.stdout
            via2-m3-publication.stderr
            release-reservation.json
            release-empty.json
            release-tag.json
      - name: Emit only complete derived records for cloud continuation
        if: always()
        run: |
          python3 -B - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0,'scripts')
          import cloud_cdr_via2_m3_loaded as h
          p=Path('loaded-native-admission')
          if p.is_dir():h.emit_derived(p)
          for name in ('via2-m3-loaded.stdout','via2-m3-loaded.stderr','via2-m3-publication.stdout','via2-m3-publication.stderr'):
              p=Path(name)
              if p.is_file():sys.stdout.buffer.write(p.read_bytes());sys.stdout.buffer.write(b'\n')
          PY
