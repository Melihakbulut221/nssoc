name: cdr-resistor-provenance-build
on:
  workflow_dispatch:
    inputs:
      source:
        description: Exact immutable source SHA
        required: true
        type: string
      execute:
        description: Full pinned Magic build and current-input trace equivalence
        required: true
        default: false
        type: boolean
      operation:
        description: Exact operation; diagnose reads the preserved failed capsule without build or CAD
        required: true
        default: diagnose
        type: choice
        options: [diagnose, build]
permissions:
  contents: read
concurrency:
  group: cdr-resistor-provenance-build-${{ github.ref }}
  cancel-in-progress: false
env:
  PYTHONDONTWRITEBYTECODE: '1'
  PINS_SHA256: ecfad414b66e870fb2ac3aacf6c61bc82479e05a9bfa6e2d0f0494b1d083bc05
jobs:
  source-controls:
    if: github.run_attempt == 1 && github.ref == 'refs/heads/codex/cdr-resistor-provenance-build'
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: '${{ inputs.source }}'
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Exact source and actual controller source controls
        env:
          EXPECTED_SOURCE: '${{ inputs.source }}'
        run: |
          test "$GITHUB_SHA" = "$EXPECTED_SOURCE"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE"
          mkdir cloud-magic-build-controls
          cp scripts/cdr-resistor-provenance-build-pins.json cloud-magic-build-controls/source-manifest.json
          python -B - <<'PY'
          import os,sys
          from pathlib import Path
          sys.path.insert(0,"scripts")
          import cloud_magic_resistor_provenance_build as b
          c=b.context(os.environ);b.source_guard(os.environ["PINS_SHA256"])
          b.write(Path("cloud-magic-build-controls/context.json"),b.encode(c))
          PY
          set +e
          python -B scripts/check_magic_resistor_provenance_build.py --pins-sha256 "$PINS_SHA256" --output cloud-magic-build-controls/controls.json >cloud-magic-build-controls/controls.stdout 2>cloud-magic-build-controls/controls.stderr
          code=$?
          printf '%s\n' "$code" >cloud-magic-build-controls/returncode.txt
          cat cloud-magic-build-controls/controls.stdout cloud-magic-build-controls/controls.stderr
          exit "$code"
      - name: Preserve complete indexed source records
        if: always()
        run: |
          python -B - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0,"scripts")
          import cloud_cdr_current_rc_contacts as f
          f.emit(Path("cloud-magic-build-controls"))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: magic-build-source-controls-${{ github.run_id }}
          path: cloud-magic-build-controls/
          if-no-files-found: error
          retention-days: 30
  preserve-source-job-log:
    needs: source-controls
    if: always()
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Preserve full source job and run metadata
        env:
          GH_TOKEN: '${{ github.token }}'
        run: |
          mkdir cloud-magic-build-source-job
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >cloud-magic-build-source-job/run.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/1/jobs?per_page=100" >cloud-magic-build-source-job/jobs.json
          jid=$(python -c 'import json; a=[x["id"] for x in json.load(open("cloud-magic-build-source-job/jobs.json"))["jobs"] if x["name"]=="source-controls"]; assert len(a)==1; print(a[0])')
          gh api --allow-escape-sequences "repos/$GITHUB_REPOSITORY/actions/jobs/$jid/logs" >cloud-magic-build-source-job/full-job.log
          python - <<'PY'
          import base64,hashlib,json,zlib
          from pathlib import Path
          for p in sorted(Path("cloud-magic-build-source-job").iterdir()):
            raw=p.read_bytes()
            print("MAGIC_BUILD_JOB_FILE "+json.dumps(dict(name=p.name,bytes=len(raw),sha256=hashlib.sha256(raw).hexdigest(),encoding="zlib+base64",data=base64.b64encode(zlib.compress(raw)).decode())))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: magic-build-source-job-log-${{ github.run_id }}
          path: cloud-magic-build-source-job/
          if-no-files-found: error
          retention-days: 30
  native-build:
    needs: [source-controls, preserve-source-job-log]
    if: inputs.execute && needs.source-controls.result == 'success' && needs.preserve-source-job-log.result == 'success'
    runs-on: ubuntu-22.04
    timeout-minutes: 300
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: '${{ inputs.source }}'
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Repeat controls and require fresh external reservation before dependencies
        env:
          GH_TOKEN: '${{ github.token }}'
          EXPECTED_SOURCE: '${{ inputs.source }}'
        run: |
          test "$GITHUB_SHA" = "$EXPECTED_SOURCE"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE"
          mkdir cloud-magic-build-host
          python -B scripts/check_magic_resistor_provenance_build.py --pins-sha256 "$PINS_SHA256" --output cloud-magic-build-host/controls.json >cloud-magic-build-host/controls.stdout 2>cloud-magic-build-host/controls.stderr
          cat cloud-magic-build-host/controls.stdout cloud-magic-build-host/controls.stderr
          python -B - <<'PY'
          import os,sys,time
          from pathlib import Path
          sys.path.insert(0,"scripts")
          import cloud_magic_resistor_provenance_build as b
          ctx=b.context(os.environ);b.source_guard(os.environ["PINS_SHA256"])
          tag="cloud-results-"+ctx["token"]+"-"+b.GROUP
          deadline=time.monotonic()+600
          while True:
            try:
              release=b.frozen.api("releases/tags/"+tag);ref=b.frozen.api("git/ref/tags/"+tag)
              receipt=dict(tag=tag,tested_source=ctx["source"],release_id=release["id"],target_verified=True,
                assets_overwritten=False,externally_reserved=True,creation_attempted=False,existing_assets=[])
              b.frozen.reservation(ctx,receipt,release,ref)
              break
            except Exception:
              if time.monotonic()>=deadline:raise
              time.sleep(5)
          b.write(Path("cloud-magic-build-host/reservation.json"),b.encode(receipt))
          PY
          python -B scripts/cloud_magic_resistor_provenance_build.py --mode preflight --pins-sha256 "$PINS_SHA256" --reservation cloud-magic-build-host/reservation.json --controls cloud-magic-build-host/controls.json --output cloud-magic-build >cloud-magic-build-host/preflight.json
      - name: Original build dependencies after reservation
        if: inputs.operation == 'build'
        run: |
          sudo apt-get update -qq >cloud-magic-build-host/apt-update.stdout 2>cloud-magic-build-host/apt-update.stderr
          sudo apt-get install -y --no-install-recommends tcl8.6 tk8.6 tcl-dev tk-dev build-essential m4 autoconf libreadline-dev libx11-dev libxext-dev libxpm-dev libxt-dev libcairo2-dev libgl1-mesa-dev libglu1-mesa-dev >cloud-magic-build-host/apt-install.stdout 2>cloud-magic-build-host/apt-install.stderr
      - name: Exact reserved operation
        env:
          OPERATION: '${{ inputs.operation }}'
          GH_TOKEN: '${{ github.token }}'
        run: |
          set +e
          if [ "$OPERATION" = diagnose ]; then
            python -B scripts/magic_resistor_equivalence_diagnosis.py --pins-sha256 "$PINS_SHA256" --reservation cloud-magic-build-host/reservation.json --controls cloud-magic-build-host/controls.json --output cloud-magic-build >cloud-magic-build-host/native.stdout 2>cloud-magic-build-host/native.stderr
          elif [ "$OPERATION" = build ]; then
            python -B scripts/cloud_magic_resistor_provenance_build.py --mode native --pins-sha256 "$PINS_SHA256" --reservation cloud-magic-build-host/reservation.json --controls cloud-magic-build-host/controls.json --output cloud-magic-build >cloud-magic-build-host/native.stdout 2>cloud-magic-build-host/native.stderr
          else
            exit 2
          fi
          code=$?
          printf '%s\n' "$code" >cloud-magic-build-host/native.returncode.txt
          cat cloud-magic-build-host/native.stdout cloud-magic-build-host/native.stderr
          exit "$code"
      - name: Preserve complete success or failure in exact reserved release
        id: publish
        if: always()
        env:
          GH_TOKEN: '${{ github.token }}'
        run: |
          if [ ! -f cloud-magic-build-host/reservation.json ]; then exit 1; fi
          if [ ! -d cloud-magic-build ]; then
            mkdir cloud-magic-build
            printf '%s\n' '{"status":"FAIL_NATIVE_CONTROLLER_NOT_STARTED","physical_acceptance":false,"electrical_acceptance":false,"full_phy_accepted":false}' >cloud-magic-build/result.json
          fi
          mkdir cloud-magic-build/host-records
          cp -a cloud-magic-build-host/. cloud-magic-build/host-records/
          python -B scripts/cloud_magic_resistor_provenance_build.py --mode publish --pins-sha256 "$PINS_SHA256" --reservation cloud-magic-build-host/reservation.json --controls cloud-magic-build-host/controls.json --output cloud-magic-build >cloud-magic-build-host/publication.stdout 2>cloud-magic-build-host/publication.stderr
          cat cloud-magic-build-host/publication.stdout cloud-magic-build-host/publication.stderr
      - name: Emit only derived terminal metadata
        if: always()
        run: |
          mkdir cloud-magic-build-terminal
          python -B - <<'PY'
          import shutil,sys
          from pathlib import Path
          sys.path.insert(0,"scripts")
          import cloud_cdr_current_rc_contacts as f
          for p in sorted(Path("cloud-magic-build").glob("*.json")):
            shutil.copyfile(p,Path("cloud-magic-build-terminal")/p.name)
          f.emit(Path("cloud-magic-build-terminal"))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: magic-build-derived-and-host-records-${{ github.run_id }}
          path: |
            cloud-magic-build-host/
            cloud-magic-build-terminal/
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && steps.publish.outcome != 'success'
        with:
          name: magic-build-complete-failure-fallback-${{ github.run_id }}
          path: |
            cloud-magic-build/
            cloud-magic-build-parts/
          if-no-files-found: error
          retention-days: 30
  preserve-terminal-job-logs:
    needs: [source-controls, preserve-source-job-log, native-build]
    if: always()
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Preserve full actual source and native job logs
        env:
          GH_TOKEN: '${{ github.token }}'
        run: |
          mkdir cloud-magic-build-terminal-jobs
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >cloud-magic-build-terminal-jobs/run.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/1/jobs?per_page=100" >cloud-magic-build-terminal-jobs/jobs.json
          python - <<'PY'
          import json,os,subprocess
          from pathlib import Path
          d=Path("cloud-magic-build-terminal-jobs")
          for j in json.loads((d/"jobs.json").read_text())["jobs"]:
            if j["name"]not in ("source-controls","preserve-source-job-log","native-build")or j["conclusion"]=="skipped":continue
            with (d/(str(j["id"])+".log")).open("wb")as f:
              subprocess.run(["gh","api","--allow-escape-sequences","repos/"+os.environ["GITHUB_REPOSITORY"]+"/actions/jobs/"+str(j["id"])+"/logs"],stdout=f,check=True)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: magic-build-complete-job-logs-${{ github.run_id }}
          path: cloud-magic-build-terminal-jobs/
          if-no-files-found: error
          retention-days: 30
