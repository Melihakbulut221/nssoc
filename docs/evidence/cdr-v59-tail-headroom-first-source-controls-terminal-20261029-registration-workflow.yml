name: Register CDR tail headroom source-control workflow
on:
  push:
    branches: [codex/register-cdr-v59-tail-headroom]
  workflow_dispatch:
    inputs:
      readback:
        type: boolean
        required: true
        default: false
permissions:
  contents: read
jobs:
  register-only:
    runs-on: ubuntu-24.04
    steps:
      - name: Harmless workflow registration only
        run: printf '%s\n' 'Registration only. No checkout, test, archive, readback, or native execution.'
