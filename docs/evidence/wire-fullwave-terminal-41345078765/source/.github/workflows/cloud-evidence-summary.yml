name: Diagnose actual full native rejected waveform
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: cdr-wire-wave-diagnosis-${{ github.ref }}
  cancel-in-progress: false
env:
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  classify:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/cdr-wire-wave-diagnosis-pins.json
      - name: Materialize exact classifier source
        run: |
          python3 -B - <<'PY'
          import json,subprocess
          from pathlib import Path
          m='scripts/cdr-wire-wave-diagnosis-pins.json'
          names=sorted(set(json.loads(Path(m).read_bytes())['files'])|{m})
          assert all(not n.startswith('/')and '..'not in Path(n).parts and not any(c in n for c in '*?[!\\\n\r')for n in names)
          subprocess.run(['git','sparse-checkout','set','--no-cone','--stdin'],input=''.join('/'+n+'\n'for n in names),text=True,check=True)
          PY
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python3 -m pip install --disable-pip-version-check --no-cache-dir numpy==2.3.3
      - name: Check exact frozen full-wave parser refusals
        run: python3 -B scripts/cloud_cdr_wire_wave_diagnosis.py --controls
      - name: Authenticate all native members and diagnose complete original waveform
        run: python3 -B scripts/cloud_cdr_wire_wave_diagnosis.py --diagnose
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: wire-wave-diagnosis-${{ github.run_id }}
          path: wire-wave-diagnosis
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
