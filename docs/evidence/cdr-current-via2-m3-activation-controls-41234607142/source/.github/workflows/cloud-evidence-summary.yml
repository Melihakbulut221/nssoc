name: Current Via2 M3 source controls and explicit physical candidate
on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [controls, candidate]
        default: controls
        required: true
      approved_source:
        type: string
        required: true
permissions:
  contents: read
  actions: read
concurrency:
  group: cdr-via2-m3-adapter-controls-${{ github.ref }}
  cancel-in-progress: false
env:
  PYTHONDONTWRITEBYTECODE: '1'
  REQUESTED_MODE: ${{ inputs.mode }}
  APPROVED_SOURCE: ${{ inputs.approved_source }}
jobs:
  source-controls:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/cdr-current-via2-m3-physical-source-pins.json
      - name: Materialize only exact source and derived JSON closure
        run: |
          python3 -B - <<'PY'
          import json,subprocess
          from pathlib import Path
          manifest='scripts/cdr-current-via2-m3-physical-source-pins.json'
          p=json.loads(Path(manifest).read_bytes())
          names=sorted(set(p['files'])|{manifest})
          assert all(not n.startswith('/')and '..'not in Path(n).parts and not any(c in n for c in '*?[!\\\n\r')for n in names)
          subprocess.run(['git','sparse-checkout','set','--no-cone','--stdin'],input=''.join('/'+n+'\n'for n in names),text=True,check=True)
          PY
      - name: Bind exact source and source-only job boundary
        run: |
          python3 -B - <<'PY'
          import ast,sys
          from pathlib import Path
          sys.path.insert(0,'scripts')
          import cdr_current_via2_m3_physical_admission as c
          ctx=c.context(__import__('os').environ);method=c.source_guard(ctx)
          assert method['generation_authorized'] is True and method['physical_verification_authorized'] is True
          for p in('scripts/cdr_current_via2_m3_physical_admission.py','scripts/cdr_current_via2_m3_physical_native.py','scripts/cloud_cdr_current_via2_m3_physical.py','scripts/check_cdr_current_via2_m3_physical.py'):ast.parse(Path(p).read_text())
          PY
      - name: Acquire and verify original immutable native AppImage for pinned geometry fixtures
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libfuse2 tcl8.6 uidmap
          curl --fail --location --retry 2 --output "$RUNNER_TEMP/current-tail-physical.AppImage" https://github.com/librelane/librelane/releases/download/3.0.5/librelane-devshell-x86_64.AppImage
          python3 -B - <<'PY'
          import hashlib,os
          from pathlib import Path
          path=Path(os.environ['RUNNER_TEMP'])/'current-tail-physical.AppImage'
          with path.open('rb')as f:assert hashlib.file_digest(f,'sha256').hexdigest()=='d6a349ec65be11456e96c4981d35f63ca34d3c85daf79a51e1ccb907bb5d7466'
          path.chmod(0o755)
          PY
      - name: Admit only the pinned runtime to hosted AppArmor user namespaces
        run: |
          python3 -B - <<'PY'
          import hashlib,json,os,re,subprocess
          from pathlib import Path
          e=os.environ
          assert e['GITHUB_ACTIONS']=='true' and e['GITHUB_REPOSITORY']=='Melihakbulut221/nssoc'
          assert e['GITHUB_REF']=='refs/heads/codex/cdr-current-via2-m3-physical-adapter' and e['GITHUB_RUN_ATTEMPT']=='1'
          assert re.fullmatch('[1-9][0-9]*',e['GITHUB_RUN_ID']) and re.fullmatch('[0-9a-f]{40}',e['GITHUB_SHA'])
          app=Path(e['RUNNER_TEMP'])/'current-tail-physical.AppImage'
          assert app==Path('/home/runner/work/_temp/current-tail-physical.AppImage') and app.is_file() and not app.is_symlink()
          with app.open('rb')as f:digest=hashlib.file_digest(f,'sha256').hexdigest()
          assert digest=='d6a349ec65be11456e96c4981d35f63ca34d3c85daf79a51e1ccb907bb5d7466'
          key=Path('/proc/sys/kernel/apparmor_restrict_unprivileged_userns')
          before=key.read_text().strip()
          name='nssoc-cdr-runtime-'+e['GITHUB_RUN_ID']+'-1'
          target=Path('/etc/apparmor.d')/name
          assert not target.exists() and not target.is_symlink()
          policy='abi <abi/4.0>,\ninclude <tunables/global>\nprofile '+name+' "'+str(app)+'" flags=(unconfined) {\n  userns,\n}\n'
          installed=subprocess.run(['sudo','tee',str(target)],input=policy.encode(),capture_output=True,check=True)
          assert installed.stdout==policy.encode() and target.read_text()==policy
          loaded=subprocess.run(['sudo','apparmor_parser','-a',str(target)],capture_output=True,check=True)
          profiles=subprocess.check_output(['sudo','cat','/sys/kernel/security/apparmor/profiles'],text=True).splitlines()
          active=[line for line in profiles if line.startswith(name+' (')]
          assert len(active)==1 and key.read_text().strip()==before
          proof=dict(source=e['GITHUB_SHA'],run_id=int(e['GITHUB_RUN_ID']),attempt=1,
            appimage=str(app),appimage_sha256=digest,profile=str(target),profile_text=policy,
            profile_sha256=hashlib.sha256(policy.encode()).hexdigest(),loaded=True,active=active,
            restriction_before=before,restriction_after=key.read_text().strip(),global_policy_changed=False,
            parser_stdout=loaded.stdout.decode(),parser_stderr=loaded.stderr.decode(),
            native_geometry_executed=False,scope='Exact pinned executable on this ephemeral GitHub runner only')
          Path('current-cdr-runtime-policy.json').write_text(json.dumps(proof,sort_keys=True,indent=2)+'\n')
          print(json.dumps(proof,sort_keys=True))
          PY
      - name: Run real pinned Pya only on synthetic geometry and source JSON
        run: |
          "$RUNNER_TEMP/current-tail-physical.AppImage" python -B scripts/check_cdr_current_via2_m3_physical.py > via2-m3-adapter-controls.stdout 2> via2-m3-adapter-controls.stderr
      - name: Always emit complete derived source-control records
        if: always()
        run: |
          python3 -B - <<'PY'
          import base64,hashlib,json
          from pathlib import Path
          paths=[Path('via2-m3-adapter-controls.stdout'),Path('via2-m3-adapter-controls.stderr'),Path('current-cdr-runtime-policy.json')]
          root=Path('cdr-via2-m3-adapter-controls')
          if root.is_dir():paths+=sorted(p for p in root.rglob('*')if p.is_file())
          for p in paths:
              if not p.is_file():continue
              b=p.read_bytes();chunks=[b[i:i+24000]for i in range(0,len(b),24000)]or[b'']
              print('VIA2_M3_ADAPTER_CONTROL_INDEX '+json.dumps(dict(path=str(p),bytes=len(b),sha256=hashlib.sha256(b).hexdigest(),chunks=len(chunks)),sort_keys=True))
              for i,chunk in enumerate(chunks):print('VIA2_M3_ADAPTER_CONTROL_CHUNK '+json.dumps(dict(path=str(p),index=i,base64=base64.b64encode(chunk).decode()),sort_keys=True))
          PY
      - name: Preserve all synthetic results and failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cdr-via2-m3-adapter-controls-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            cdr-via2-m3-adapter-controls
            via2-m3-adapter-controls.stdout
            via2-m3-adapter-controls.stderr
            current-cdr-runtime-policy.json
          if-no-files-found: error
          retention-days: 90
  preserve-job-log:
    needs: source-controls
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Preserve full actual source job log and metadata
        run: |
          python3 -B - <<'PY'
          import hashlib,json,os,subprocess
          from pathlib import Path
          root=Path('job-logs');root.mkdir()
          e=os.environ
          assert e['GITHUB_REPOSITORY']=='Melihakbulut221/nssoc' and e['GITHUB_RUN_ATTEMPT']=='1'
          prefix='repos/'+e['GITHUB_REPOSITORY']+'/'
          def read(path,name):
              b=subprocess.check_output(['gh','api',prefix+path]);(root/name).write_bytes(b);return json.loads(b)
          run=read('actions/runs/'+e['GITHUB_RUN_ID'],'run.json')
          assert run['head_sha']==e['GITHUB_SHA'] and run['run_attempt']==1
          jobs=read('actions/runs/'+e['GITHUB_RUN_ID']+'/attempts/1/jobs?per_page=100','jobs.json')
          selected=[j for j in jobs['jobs'] if j['name']=='source-controls'];assert len(selected)==1
          j=selected[0];assert j['status']=='completed' and j['head_sha']==e['GITHUB_SHA']
          read('actions/jobs/'+str(j['id']),'job.json')
          b=subprocess.check_output(['gh','api','--allow-escape-sequences',prefix+'actions/jobs/'+str(j['id'])+'/logs'])
          assert b;(root/'job.log').write_bytes(b)
          receipt=dict(source=e['GITHUB_SHA'],run_id=int(e['GITHUB_RUN_ID']),attempt=1,
            job_id=j['id'],job_conclusion=j['conclusion'],full_raw_job_log=True,
            log_bytes=len(b),log_sha256=hashlib.sha256(b).hexdigest(),native_acquisition=False)
          (root/'receipt.json').write_text(json.dumps(receipt,sort_keys=True,indent=2)+'\n')
          print(json.dumps(receipt,sort_keys=True))
          PY
      - name: Preserve complete actual logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cdr-via2-m3-adapter-source-job-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: job-logs
          if-no-files-found: error
          retention-days: 90

  candidate:
    permissions:
      contents: write
      actions: read
    needs: [source-controls, preserve-job-log]
    if: ${{ inputs.mode == 'candidate' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/cdr-current-via2-m3-physical-source-pins.json
      - name: Materialize only exact source and derived JSON closure
        run: |
          python3 -B - <<'PY'
          import json,subprocess
          from pathlib import Path
          manifest='scripts/cdr-current-via2-m3-physical-source-pins.json'
          p=json.loads(Path(manifest).read_bytes())
          names=sorted(set(p['files'])|{manifest})
          assert all(not n.startswith('/')and '..'not in Path(n).parts and not any(c in n for c in '*?[!\\\n\r')for n in names)
          subprocess.run(['git','sparse-checkout','set','--no-cone','--stdin'],input=''.join('/'+n+'\n'for n in names),text=True,check=True)
          PY
      - name: Bind explicit current-source candidate authority
        run: |
          python3 -B - <<'PY'
          import os,sys
          sys.path.insert(0,'scripts')
          import cdr_current_via2_m3_physical_admission as a
          ctx=a.context(os.environ);c=a.source_guard(ctx);a.authorize_native(ctx,c)
          PY
      - name: Require independent empty exact-source result reservation
        id: reserve
        run: |
          python3 -B - <<'PY'
          import json,os,subprocess,sys,time
          from pathlib import Path
          sys.path.insert(0,'scripts')
          import cdr_current_via2_m3_physical_admission as a
          ctx=a.context(os.environ);c=a.source_guard(ctx);a.authorize_native(ctx,c)
          tag='cloud-results-'+ctx['token']+'-'+ctx['group'];prefix='repos/Melihakbulut221/nssoc/'
          for attempt in range(120):
              p=subprocess.run(['gh','api',prefix+'releases/tags/'+tag],capture_output=True,text=True)
              if p.returncode==0:info=json.loads(p.stdout);break
              assert 'HTTP 404' in p.stderr,p.stderr
              time.sleep(2)
          else:raise RuntimeError('Independent exact-source reservation missing; no design archive acquisition')
          ref=json.loads(subprocess.check_output(['gh','api',prefix+'git/ref/tags/'+tag]))
          proof=dict(tag=tag,tested_source=ctx['source'],release_id=info['id'],target_verified=True,assets_overwritten=False,externally_reserved=True,creation_attempted=False,existing_assets=[],read_attempts=attempt+1)
          a.q.reservation(ctx,proof,info,ref)
          Path('release-reservation.json').write_bytes(a.encode(proof))
          Path('release-empty.json').write_bytes(a.encode(info));Path('release-tag.json').write_bytes(a.encode(ref))
          PY
      - name: Authenticate full same-run source job metadata and raw log
        run: python3 -B scripts/cloud_cdr_current_via2_m3_physical.py --authenticate-controls --output cdr-via2-m3-native-admission
      - name: Acquire and verify original immutable native AppImage for pinned geometry fixtures
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libfuse2 tcl8.6 uidmap
          curl --fail --location --retry 2 --output "$RUNNER_TEMP/current-tail-physical.AppImage" https://github.com/librelane/librelane/releases/download/3.0.5/librelane-devshell-x86_64.AppImage
          python3 -B - <<'PY'
          import hashlib,os
          from pathlib import Path
          path=Path(os.environ['RUNNER_TEMP'])/'current-tail-physical.AppImage'
          with path.open('rb')as f:assert hashlib.file_digest(f,'sha256').hexdigest()=='d6a349ec65be11456e96c4981d35f63ca34d3c85daf79a51e1ccb907bb5d7466'
          path.chmod(0o755)
          PY
      - name: Admit only the pinned runtime to hosted AppArmor user namespaces
        run: |
          python3 -B - <<'PY'
          import hashlib,json,os,re,subprocess
          from pathlib import Path
          e=os.environ
          assert e['GITHUB_ACTIONS']=='true' and e['GITHUB_REPOSITORY']=='Melihakbulut221/nssoc'
          assert e['GITHUB_REF']=='refs/heads/codex/cdr-current-via2-m3-physical-adapter' and e['GITHUB_RUN_ATTEMPT']=='1'
          assert re.fullmatch('[1-9][0-9]*',e['GITHUB_RUN_ID']) and re.fullmatch('[0-9a-f]{40}',e['GITHUB_SHA'])
          app=Path(e['RUNNER_TEMP'])/'current-tail-physical.AppImage'
          assert app==Path('/home/runner/work/_temp/current-tail-physical.AppImage') and app.is_file() and not app.is_symlink()
          with app.open('rb')as f:digest=hashlib.file_digest(f,'sha256').hexdigest()
          assert digest=='d6a349ec65be11456e96c4981d35f63ca34d3c85daf79a51e1ccb907bb5d7466'
          key=Path('/proc/sys/kernel/apparmor_restrict_unprivileged_userns')
          before=key.read_text().strip()
          name='nssoc-cdr-runtime-'+e['GITHUB_RUN_ID']+'-1'
          target=Path('/etc/apparmor.d')/name
          assert not target.exists() and not target.is_symlink()
          policy='abi <abi/4.0>,\ninclude <tunables/global>\nprofile '+name+' "'+str(app)+'" flags=(unconfined) {\n  userns,\n}\n'
          installed=subprocess.run(['sudo','tee',str(target)],input=policy.encode(),capture_output=True,check=True)
          assert installed.stdout==policy.encode() and target.read_text()==policy
          loaded=subprocess.run(['sudo','apparmor_parser','-a',str(target)],capture_output=True,check=True)
          profiles=subprocess.check_output(['sudo','cat','/sys/kernel/security/apparmor/profiles'],text=True).splitlines()
          active=[line for line in profiles if line.startswith(name+' (')]
          assert len(active)==1 and key.read_text().strip()==before
          proof=dict(source=e['GITHUB_SHA'],run_id=int(e['GITHUB_RUN_ID']),attempt=1,
            appimage=str(app),appimage_sha256=digest,profile=str(target),profile_text=policy,
            profile_sha256=hashlib.sha256(policy.encode()).hexdigest(),loaded=True,active=active,
            restriction_before=before,restriction_after=key.read_text().strip(),global_policy_changed=False,
            parser_stdout=loaded.stdout.decode(),parser_stderr=loaded.stderr.decode(),
            native_geometry_executed=False,scope='Exact pinned executable on this ephemeral GitHub runner only')
          Path('current-cdr-runtime-policy.json').write_text(json.dumps(proof,sort_keys=True,indent=2)+'\n')
          print(json.dumps(proof,sort_keys=True))
          PY
      - name: Generate exact sixteen shapes and run unchanged full physical gates
        id: native
        run: python3 -B scripts/cloud_cdr_current_via2_m3_physical.py --candidate --output cloud-cdr-current-via2-m3-physical --reservation release-reservation.json --controls-proof cdr-via2-m3-native-admission/records/cdr-via2-m3-adapter-controls/result.json > via2-m3-physical.stdout 2> via2-m3-physical.stderr
      - name: Publish all success or failure outputs to independent reserved release
        if: always() && steps.reserve.outcome == 'success'
        run: python3 -B scripts/publish_cdr_current_via2_m3_physical.py --case nominal_late --output cloud-cdr-current-via2-m3-physical --publication cloud-cdr-current-via2-m3-physical-publication --reservation release-reservation.json > via2-m3-publication.stdout 2> via2-m3-publication.stderr
      - name: Always emit complete derived admission and native outcome records
        if: always()
        run: |
          python3 -B - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0,'scripts')
          import cloud_cdr_current_via2_m3_physical as h
          for name in ('cdr-via2-m3-native-admission',):
              p=Path(name)
              if p.is_dir():h.emit_derived(p)
          for name in ('via2-m3-physical.stdout','via2-m3-physical.stderr','via2-m3-publication.stdout','via2-m3-publication.stderr'):
              p=Path(name)
              if p.is_file():sys.stdout.buffer.write(p.read_bytes());sys.stdout.buffer.write(b'\n')
          PY
      - name: Retain all native candidate failures and complete publication transport in cloud
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cdr-current-via2-m3-physical-${{ github.run_id }}-${{ github.run_attempt }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
          path: |
            cloud-cdr-current-via2-m3-physical
            cloud-cdr-current-via2-m3-physical-publication
            cdr-via2-m3-native-admission
            via2-m3-physical.stdout
            via2-m3-physical.stderr
            via2-m3-publication.stdout
            via2-m3-publication.stderr
            release-reservation.json
            release-empty.json
            release-tag.json
            current-cdr-runtime-policy.json
