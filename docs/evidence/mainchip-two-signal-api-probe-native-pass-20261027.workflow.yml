# SPDX-License-Identifier: Apache-2.0
name: mainchip-two-signal-api-probe-cloud
on:
  workflow_dispatch:
    inputs:
      execute:
        type: boolean
        required: true
        default: false
        description: Read-only API and identity census of exact saved ODB; no routing or database writes
permissions:
  contents: read
  actions: read
concurrency:
  group: mainchip-two-signal-api-probe-${{ github.ref }}
  cancel-in-progress: false
jobs:
  controls:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Actual synthetic API census, partial failure preservation and qualified driver controls
        run: python3 scripts/check_mainchip_two_signal_api_probe.py
      - name: Actual isolated full import and three original JSON readers
        run: python3 scripts/check_mainchip_two_signal_api_probe_imports.py > cloud-mainchip-two-signal-api-controls/import-controls.json
      - name: Complete source-control records
        if: always()
        run: |
          PYTHONPATH=scripts python3 - <<'PYCODE'
          from pathlib import Path
          from check_mainchip_original_clock_restoration_driver import emit
          for name in ('api-controls.json','import-controls.json'):
              path=Path('cloud-mainchip-two-signal-api-controls')/name
              if path.is_file():
                  print('API_PROBE_CONTROL_FILE '+name,flush=True)
                  emit(path.resolve())
          PYCODE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: api-probe-controls-${{ github.run_id }}
          path: cloud-mainchip-two-signal-api-controls/
          retention-days: 90
  native:
    if: inputs.execute
    needs: controls
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Exact source and separate read-only API execution authorization
        run: |
          PYTHONPATH=scripts python3 - <<'PYCODE'
          import mainchip_two_signal_api_probe as s
          m=s.methods()
          for key in ('cloud_restore_authorized','native_execution_authorized','native_api_probe_authorized'):
              assert m[key] is True
          PYCODE
      - name: Read-only exact-source reserved prerelease wait
        timeout-minutes: 6
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/wait_cloud_tested_source_release.py --group mainchip-two-signal-api-probe
      - name: Qualified Ubuntu22.04 FUSE dependency
        timeout-minutes: 10
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libfuse2
      - name: Read-only API and identity census with complete failure diagnostics
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUD_APPIMAGE: ${{ github.workspace }}/hw/soc/tools/physical/librelane-3.0.5-x86_64.AppImage
        run: python3 scripts/cloud_mainchip_two_signal_api_probe.py
      - name: Full bounded result log reconstruction
        if: always()
        run: |
          PYTHONPATH=scripts python3 - <<'PYCODE'
          from pathlib import Path
          from check_mainchip_original_clock_restoration_driver import emit
          p=Path('cloud-mainchip-two-signal-api-probe/result.json').resolve()
          if p.is_file(): emit(p)
          else: print('API_PROBE_RESULT_MISSING_NO_ACCEPTANCE',flush=True)
          PYCODE
      - name: Permanent complete summary and authenticated archive publication
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/cloud_mainchip_two_signal_api_probe.py --publish
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: api-probe-native-${{ github.run_id }}
          path: |
            cloud-mainchip-two-signal-api-probe/
            publication-mainchip-two-signal-api-probe/
          retention-days: 90
