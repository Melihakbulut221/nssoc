# SPDX-License-Identifier: Apache-2.0
name: tx-phase-reset334-tail-m4-loaded-cloud
on:
  workflow_dispatch:
    inputs:
      native:
        description: "Run only four original zero-OPs on exact fresh P/N tail-M4 RC; no transient"
        type: boolean
        default: false
        required: true
permissions:
  contents: read
  actions: read
defaults:
  run:
    shell: bash
concurrency:
  group: tx-phase-reset334-tail-m4-loaded-${{ github.ref }}
  cancel-in-progress: false
jobs:
  source-controls:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Actual isolated import and import-time JSON closure
        run: |
          set -euo pipefail
          python3 -m pip install networkx==3.4.2 numpy==2.3.3
          python3 scripts/check_tx_phase_reset334_tail_m4_loaded_imports.py | tee import-controls.json
      - name: Original source gates and actual controller runtime failure fixtures
        run: |
          set -euo pipefail
          if bash -o pipefail -c '(exit 7) | tee /dev/null'; then exit 1; fi
          python3 -m pip install networkx==3.4.2 numpy==2.3.3
          python3 scripts/cloud_tx_phase_reset334_tail_m4_loaded.py --controls | tee wrapper-controls.json
      - name: Actual reserved-only publication program and bounded waiter controls
        run: |
          set -euo pipefail
          python3 scripts/check_tx_phase_reset334_tail_m4_loaded_publication.py | tee publication-controls.json
          python3 scripts/wait_cloud_tested_source_release.py --controls | tee wait-controls.json
      - name: Require complete source and runtime records
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("wrapper-controls.json").read_bytes())
          assert r["status"]=="PASS_TAIL_M4_FRESH_FOUR_OP_SOURCE_CONTROLS_NO_NATIVE"
          assert r['actual_controller_imported']and r['all_original_function_code_objects_identical']and r['original_module_globals_unchanged']
          assert len(r['RC_faults'])==24 and len(r['metadata_faults'])==20 and len(r['context_faults'])==13
          assert len(r['actual_main_entry_positives'])==2 and len(r['actual_post_preparation_main'])==2
          assert all(x['actual_finally_result_written']for x in r['actual_main_entry_positives'])
          assert len(r['actual_prepare_completion'])==2 and r['actual_prepare_completion'][1]['rejected']
          assert len(r['inherited_preparation']['rejected'])==15
          assert len(r['inherited_initialization']['negative_controls'])==30
          assert len(r['inherited_zero_OP']['negative_controls'])==12
          assert len(r['archive_controls']['rejected'])==13 and r['archive_controls']['inherited_parts_controls']['negative_controls']==6
          assert r['original_failed_HBT_count']==17 and r['prior_four_failed_HBT_count']==4
          assert r['outer_native_view']['complete_outer_members']==3181 and r['outer_native_view']['complete_consumed_native_members']==3165
          assert r['outer_native_view']['exact_full_set_equality']and len(r['outer_native_view']['rejected'])==24
          assert len(r['native_result_controls']['rejected'])==24
          assert len(r['authorization']['positive'])==2 and len(r['authorization']['rejected'])==7
          assert len(r['child_preflight']['positive'])==1 and len(r['child_preflight']['refused'])==6
          assert len(r['finalization']['actual_controller_main_finally'])==6
          assert len(r['owned_child_terminal']['cases'])==6 and r['owned_child_terminal']['all_terminal_actions_attempted_after_earlier_failure']
          assert len(r['workflow']['rejected'])==4
          assert len(r['workflow']['control_evidence']['positive'])==2 and len(r['workflow']['control_evidence']['refused'])==2
          assert len(r['runtime']['supervisor']['controls'])==13
          assert r['native_executed']is r['simulation_executed']is r['extraction_executed']is r['actual_fresh_model_binding_executed']is False
          aux={k:json.loads(Path(p).read_bytes())for k,p in [
            ('publication','publication-controls.json'),('imports','import-controls.json'),('wait','wait-controls.json')]}
          assert len(aux['publication']['positive_cases'])==2 and len(aux['publication']['rejected'])==13
          assert len(aux['imports']['positive'])==2 and len(aux['imports']['rejected'])==7
          assert len(aux['imports']['closure']['import_time_data'])==3
          assert len(aux['wait']['positive_cases'])==3 and len(aux['wait']['rejected'])==4
          r['completed_auxiliary_controls']=aux
          b=json.dumps(r,indent=2,allow_nan=False)+'\n';Path('source-controls.json').write_text(b);print(b,flush=True)
          PY
      - name: Emit exact complete or partial control bytes
        if: always()
        run: |
          python3 - <<'PYCONTROL'
          import ast,base64,hashlib,json
          from pathlib import Path
          source=Path('scripts/cloud_cdr_v59_binding_rc.py')
          assert source.is_file() and not source.is_symlink()
          raw=source.read_bytes()
          assert hashlib.sha256(raw).hexdigest()=='647af19c78158045739b2589d61a2962bbff69e230b593ccb33019550edbd709'
          nodes=[n for n in ast.parse(raw.decode()).body if isinstance(n,ast.FunctionDef) and n.name=='emit']
          assert len(nodes)==1
          scope=dict(base64=base64,hashlib=hashlib,json=json)
          exec(compile(ast.Module(body=nodes,type_ignores=[]),str(source),'exec'),scope)
          names=('wrapper-controls','import-controls','publication-controls','wait-controls','source-controls')
          assert len(names)==len(set(names))==5
          emitted=[];missing=[];failures=[]
          for name in names:
              path=Path(name+'.json')
              if not path.exists() and not path.is_symlink():
                  missing.append(path.name)
                  continue
              try:
                  assert path.is_file() and not path.is_symlink(),str(path)
                  before=path.read_bytes()
                  scope['emit'](path,'TAIL_M4_LOADED_CONTROL_'+name.upper().replace('-','_'))
                  assert path.read_bytes()==before,'Control record changed during emission'
                  emitted.append(dict(name=path.name,bytes=len(before),sha256=hashlib.sha256(before).hexdigest()))
              except Exception as error:failures.append(dict(name=path.name,error=repr(error)))
          print('TAIL_M4_LOADED_CONTROL_FILE_CENSUS '+json.dumps(dict(emitted=emitted,missing=missing,failures=failures,missing_files_created=False),sort_keys=True),flush=True)
          assert not failures,failures
          PYCONTROL
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: tail-m4-loaded-source-controls
          path: |
            source-controls.json
            wrapper-controls.json
            import-controls.json
            publication-controls.json
            wait-controls.json
          if-no-files-found: error
          retention-days: 90
  fresh-four-original-zero-OPs:
    needs: source-controls
    if: github.event_name == 'workflow_dispatch' && inputs.native
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Wait read-only for exact-source reserved release before dependencies
        run: |
          python3 scripts/wait_cloud_tested_source_release.py --group tx-phase-reset334-tail-m4-loaded
          python3 - <<'PY'
          import os,sys
          sys.path.insert(0,"scripts")
          import ensure_cloud_tested_source_release as p
          tag,source=p.context("tx-phase-reset334-tail-m4-loaded",os.environ)
          proof=p.validate_release(p.api("releases/tags/"+tag),p.api("git/ref/tags/"+tag),tag,source)
          assert not proof["existing_assets"],"Never reuse or overwrite a production capsule"
          print(proof)
          PY
      - name: Install exact Python runtime dependencies and original OP runtime libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libsndfile1 libsamplerate0 libreadline8t64 libxaw7 libxt6 libxft2 libfontconfig1
          python3 -m pip install networkx==3.4.2 numpy==2.3.3
      - name: Fresh current3181 capsule/native3165 model binding and four original OFF zero-OPs in owned process
        run: python3 scripts/cloud_tx_phase_reset334_tail_m4_loaded.py
      - name: Preserve complete result even after a rejected original zero-OP gate
        if: always()
        run: |
          python3 - <<'PY'
          import base64,hashlib,json
          from pathlib import Path
          p=Path("hw/soc/out/cloud-tx-phase-reset334-tail-m4-loaded/result.json")
          if not p.exists():
              p.parent.mkdir(parents=True,exist_ok=True)
              p.write_text(json.dumps(dict(status="FAIL_MISSING_REPORT",source_head=__import__("os").environ["GITHUB_SHA"],run_id=__import__("os").environ["GITHUB_RUN_ID"],electrical_accepted=False,full_phy_accepted=False))+"\n")
          b=p.read_bytes()
          print("RESULT_SHA256",hashlib.sha256(b).hexdigest());print("RESULT_BYTES",len(b))
          if len(b)<=16_000_000:
              s=base64.b64encode(b).decode();parts=[s[i:i+4096]for i in range(0,len(s),4096)]
              for i,c in enumerate(parts):print(f"RESULT_BASE64 {i}/{len(parts)} {c}")
          else:print("COMPLETE_RESULT_RETAINED_IN_PUBLICATION_AND_FALLBACK",p)
          PY
      - name: Publish all original and new evidence using reserved-only release binding
        if: always()
        id: publish
        run: |
          set -euo pipefail
          python3 scripts/wait_cloud_tested_source_release.py --group tx-phase-reset334-tail-m4-loaded
          root=hw/soc/out/cloud-tx-phase-reset334-tail-m4-loaded
          group=tx-phase-reset334-tail-m4-loaded
          stem="$group-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          cp "$root/result.json" "$stem.summary.json"
          python3 scripts/cloud_chunked_results.py --directory "$root" --stem "$stem"
          python3 - "$stem" "$group" "$root" <<'PYCODE'
          import json,pathlib,sys,os
          sys.path.insert(0,'scripts')
          import ensure_cloud_tested_source_release as guard
          import migrate_outputs_to_cloud as migration
          import publish_cloud_results as publisher
          stem,group,root_arg=sys.argv[1:]
          assert group=='tx-phase-reset334-tail-m4-loaded'
          expected,source=guard.context(group,os.environ)
          assert stem==group+'-'+os.environ['GITHUB_RUN_ID']+'-'+os.environ['GITHUB_RUN_ATTEMPT']
          root=pathlib.Path(root_arg)
          part_file=pathlib.Path(stem+'.parts.json')
          manifest=json.loads(part_file.read_text())
          part_names=[p['name'] for p in manifest['parts']]
          assert part_names and len(part_names)==len(set(part_names))
          assert all(pathlib.Path(n).name==n and '\\' not in n and n not in ('.','..') for n in part_names)
          separate=sorted(str(p) for p in root.glob('*.json') if p.name!='result.json')
          paths=[stem+'.summary.json',str(part_file),*separate,*part_names]
          assert len(paths)==len(set(paths))
          assert len({pathlib.Path(p).name for p in paths})==len(paths)
          assert all(pathlib.Path(p).is_file() and not pathlib.Path(p).is_symlink() for p in paths)
          def readonly_release(tag):
              assert tag==expected
              info=guard.api('releases/tags/'+tag)
              guard.validate_release(info,guard.api('git/ref/tags/'+tag),tag,source)
              return info
          migration.release=readonly_release
          assert publisher.publish is migration.publish
          assert publisher.publish.__globals__['release'] is readonly_release
          readonly_release(expected)
          result=publisher.publish_results(group,paths)
          assert result['tag']==expected and len(result['assets'])==len(paths)
          assert [x['name'] for x in result['assets']]==[pathlib.Path(p).name for p in paths]
          readonly_release(expected)
          print(json.dumps(result,sort_keys=True),flush=True)
          PYCODE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && steps.publish.outcome != 'success'
        with:
          name: tail-m4-loaded-complete-evidence
          path: hw/soc/out/cloud-tx-phase-reset334-tail-m4-loaded/
          if-no-files-found: error
          retention-days: 90
