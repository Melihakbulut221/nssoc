# SPDX-License-Identifier: Apache-2.0
# Source-only reviewed template; no registration or dispatch is implied.
name: pll-first-latch-crossing-order-cloud
on:
  workflow_dispatch:
    inputs:
      observe_cache:
        type: boolean
        default: false
        description: Read only the existing qualified131-column cache after controls
permissions:
  contents: read
  actions: read
defaults:
  run:
    shell: bash
concurrency:
  group: pll-first-latch-crossing-order
  cancel-in-progress: false
jobs:
  controls:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Retain original46 transport controls and fixed crossing fixtures
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if bash -o pipefail -c '(exit 7) | tee /dev/null'; then exit 1; fi
          python3 -m pip install numpy==2.3.3
          python3 -u scripts/cloud_pll_first_latch_crossing_order.py --controls
          python3 - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('cloud-pll-first-latch-crossing-order/result.json').read_text())
          assert r['status']=='PASS_FIRST_LATCH_CROSSING_ORDER_CONTROLS_NO_NATIVE_ANALYSIS'
          assert len(r['controls']['original']['rejected'])==46
          n=r['controls']['crossing_order']
          assert n['status']=='PASS_FIXED_CROSSING_ORDER_AND20_FAULTS_NO_NATIVE_DATA'
          assert len(n['rejected'])==20
          assert r['native_activation_performed'] is r['full_capture_reread'] is r['full_phy_accepted'] is False
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: pll-crossing-order-controls-${{ github.run_id }}
          path: cloud-pll-first-latch-crossing-order/*.json
          retention-days: 90
  existing-cache-observation:
    needs: controls
    if: github.event_name == 'workflow_dispatch' && inputs.observe_cache && github.ref_name == 'codex/pll-latch-crossing-order'
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Authenticate existing selected cache and reproduce original rejection first
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 -m pip install numpy==2.3.3
          python3 -u scripts/cloud_pll_first_latch_crossing_order.py --replay
      - name: Preserve exact small summary and complete crossing observations in hosted log
        if: always()
        run: |
          python3 - <<'PY'
          import base64,hashlib,json
          from pathlib import Path
          root=Path('cloud-pll-first-latch-crossing-order')
          for name in ('result.json','crossing-order.json'):
              p=root/name
              if not p.exists():
                  print('MISSING_DIAGNOSTIC_FILE',name);continue
              b=p.read_bytes();assert len(b)<=16_000_000
              s=base64.b64encode(b).decode();parts=[s[i:i+4096]for i in range(0,len(s),4096)]
              print('CROSSING_ORDER_FILE '+json.dumps(dict(name=name,bytes=len(b),sha256=hashlib.sha256(b).hexdigest(),chunks=len(parts))))
              for i,c in enumerate(parts):print('CROSSING_ORDER_CHUNK '+name+' '+str(i)+' '+c)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: pll-crossing-order-observation-${{ github.run_id }}
          path: cloud-pll-first-latch-crossing-order/*.json
          retention-days: 90
# No simulator, circuit edits, original full5106 capture download, cache publication or release tag.
