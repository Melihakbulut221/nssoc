# SPDX-License-Identifier: Apache-2.0
# NONREGISTERED TEMPLATE. Register only after exact codec proof and TX source review.
name: pcie-gen12-tx-raw32-cloud
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: pcie-gen12-tx-raw32-${{ github.ref }}
  cancel-in-progress: false
jobs:
  transport-native-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install native RTL and synthesis tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends iverilog verilator yosys
      - name: Exact prerequisite, independent serial queue and18 compiling faults
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/check_pcie_gen12_tx_raw32.py
      - name: Preserve complete native proof including rejection
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pcie-gen12-tx-raw32-${{ github.run_id }}-${{ github.run_attempt }}
          path: hw/soc/out/cloud-pcie-gen12-tx-raw32/
          retention-days: 90
