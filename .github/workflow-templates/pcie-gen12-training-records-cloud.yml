name: PCIe Gen1/2 candidate-record cloud proof
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: pcie-gen12-training-records-cloud
  cancel-in-progress: false
jobs:
  composed-native-proof:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Require exact completed transport proofs and reviewed source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 -c "import sys; sys.path.insert(0,'scripts'); import check_pcie_gen12_training_records as m; print(m.prerequisites()[1])"
      - name: Install hosted RTL tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y iverilog verilator yosys
      - name: Independent composed stream proof and real compiling faults
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 scripts/check_pcie_gen12_training_records.py | tee training-records-console.log
          python3 - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('hw/soc/out/cloud-pcie-gen12-training-records/result.json').read_text())
          assert r['status']=='PASS_COMPOSED_CANDIDATE16_TRANSPORT_AND22_COMPILED_FAULTS'
          assert len(r['negative_controls'])==22
          assert r['protocol_TS_acceptance'] is False and r['full_PHY_accepted'] is False
          PY
      - name: Preserve complete small result in authenticated job log
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64,hashlib,json
          from pathlib import Path
          p=Path('hw/soc/out/cloud-pcie-gen12-training-records/result.json')
          if p.exists():
              b=p.read_bytes();s=base64.b64encode(b).decode();chunks=[s[i:i+4096] for i in range(0,len(s),4096)]
              print('TRAINING_RECORD_RESULT '+json.dumps({'bytes':len(b),'sha256':hashlib.sha256(b).hexdigest(),'chunks':len(chunks)}))
              for i,c in enumerate(chunks):print('TRAINING_RECORD_RESULT_CHUNK '+str(i)+' '+c)
          else:
              print('NO_RESULT_BECAUSE_PREREQUISITE_OR_SETUP_DID_NOT_COMPLETE')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pcie-gen12-training-records-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            hw/soc/out/cloud-pcie-gen12-training-records
            training-records-console.log
          retention-days: 90
          if-no-files-found: warn
