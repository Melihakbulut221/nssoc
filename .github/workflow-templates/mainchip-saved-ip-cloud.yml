# SPDX-License-Identifier: Apache-2.0
name: mainchip-saved-ip-cloud
on:
  workflow_dispatch:
    inputs:
      diagnose:
        description: Decode the authenticated saved instruction pointers without running OpenROAD
        type: boolean
        default: false
        required: true
permissions:
  contents: read
  actions: read
concurrency:
  group: mainchip-saved-ip-${{ github.ref }}
  cancel-in-progress: false
jobs:
  controls:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Validate source and synthetic address mapping
        run: |
          python3 -m py_compile scripts/cloud_mainchip_saved_ip.py
          python3 scripts/cloud_mainchip_saved_ip.py --controls > cloud-saved-ip-controls.json
          cat cloud-saved-ip-controls.json
          sha256sum cloud-saved-ip-controls.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: mainchip-saved-ip-controls
          path: cloud-saved-ip-controls.json
          retention-days: 90
  saved-instruction-readback:
    needs: controls
    if: github.event_name == 'workflow_dispatch' && inputs.diagnose
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Check exact source release before archive access
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ensure_cloud_tested_source_release.py --group mainchip-saved-ip
      - name: Build only the pinned CRIU image decoder
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends protobuf-compiler python3-protobuf python3-setuptools pkg-config libprotobuf-c-dev protobuf-c-compiler libbsd-dev binutils
          git init "$RUNNER_TEMP/criu-src"
          git -C "$RUNNER_TEMP/criu-src" remote add origin https://github.com/checkpoint-restore/criu.git
          git -C "$RUNNER_TEMP/criu-src" fetch --depth 1 origin 9539417f3e3cfa4eb84c319cd71f4d52f1f08645
          git -C "$RUNNER_TEMP/criu-src" checkout --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/criu-src" rev-parse HEAD)" = 9539417f3e3cfa4eb84c319cd71f4d52f1f08645
          make -C "$RUNNER_TEMP/criu-src" -j2 lib PYTHON=/usr/bin/python3
          PYTHONPATH="$RUNNER_TEMP/criu-src/lib" /usr/bin/python3 -c 'from pycriu import images; print(images.__file__)'
      - name: Decode the latest saved process and its exact runtime instructions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          export NSSOC_CRIU_SOURCE="$RUNNER_TEMP/criu-src"
          export PYTHONPATH="$RUNNER_TEMP/criu-src/lib"
          /usr/bin/python3 scripts/cloud_mainchip_saved_ip.py
      - name: Publish decoded evidence without copying runtime or process pages
        if: always()
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PYCODE'
          import pathlib,shutil
          src=pathlib.Path('cloud-mainchip-saved-ip');out=pathlib.Path('cloud-mainchip-saved-ip-evidence');out.mkdir(exist_ok=False)
          if src.exists():
              for p in src.iterdir():
                  if p.is_file():shutil.copyfile(p,out/p.name)
              if (src/'saved').exists():shutil.copytree(src/'saved',out/'saved')
          if not (out/'result.json').exists():
              (out/'result.json').write_text('{"status":"FAIL_MISSING_RESULT","routing_complete":false,"final_timing_complete":false}\n')
          PYCODE
          stem="mainchip-saved-ip-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          cp cloud-mainchip-saved-ip-evidence/result.json "$stem.summary.json"
          python3 scripts/ensure_cloud_tested_source_release.py --group mainchip-saved-ip
          python3 scripts/cloud_chunked_results.py --directory cloud-mainchip-saved-ip-evidence --stem "$stem"
          python3 - "$stem" <<'PYCODE'
          import json,subprocess,sys
          stem=sys.argv[1];m=json.load(open(stem+'.parts.json'))
          subprocess.run([sys.executable,'scripts/publish_cloud_results.py','--group','mainchip-saved-ip',stem+'.summary.json',stem+'.parts.json',*[x['name']for x in m['parts']]],check=True)
          PYCODE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && steps.publish.outcome == 'failure'
        with:
          name: mainchip-saved-ip-evidence
          path: cloud-mainchip-saved-ip-evidence/
          retention-days: 90
