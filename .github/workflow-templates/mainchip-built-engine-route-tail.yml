name: Built engine observer off on route tails
on:
  workflow_dispatch:
    inputs:
      native:
        type: boolean
        required: true
        default: false
        description: Run two separately restored tails only after independent authorization
permissions:
  contents: read
concurrency:
  group: mainchip-built-engine-route-tail-${{ github.ref }}
  cancel-in-progress: false
env:
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  source-controls:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Preserve qualified shared-prefix controls
        run: |
          python3 -B scripts/check_mainchip_built_engine_route_prefix.py > route-prefix-controls.json
      - name: Actual tail source admission and synthetic boundary controls
        run: |
          python3 -B scripts/check_mainchip_built_engine_route_tail.py > route-tail-controls.json
      - name: Always emit complete exact control records
        if: always()
        run: |
          python3 - <<'PY'
          import base64,hashlib,json
          from pathlib import Path
          for name in ("route-prefix-controls.json","route-tail-controls.json"):
              p=Path(name);raw=p.read_bytes() if p.is_file() else b""
              chunks=[raw[i:i+6000] for i in range(0,len(raw),6000)]
              print("ROUTE_TAIL_RECORD_INDEX "+json.dumps(dict(path=name,present=p.is_file(),bytes=len(raw),sha256=hashlib.sha256(raw).hexdigest(),chunks=len(chunks))))
              for i,b in enumerate(chunks):
                  print("ROUTE_TAIL_RECORD_CHUNK "+json.dumps(dict(path=name,index=i,base64=base64.b64encode(b).decode())))
          PY
      - name: Preserve source controls
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: route-tail-source-controls-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            route-prefix-controls.json
            route-tail-controls.json
          if-no-files-found: error
          retention-days: 90
  route-tail:
    # A later reviewed source must activate both this condition and the new method.
    if: ${{ false && inputs.native }}
    needs: source-controls
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        mode: ["off", "on"]
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      NSSOC_ROUTE_TAIL_MODE: ${{ matrix.mode }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Repeat exact source controls before dependencies or native work
        run: |
          python3 -B scripts/check_mainchip_built_engine_route_prefix.py > route-prefix-controls.json
          python3 -B scripts/check_mainchip_built_engine_route_tail.py > route-tail-controls.json
      - name: Require all three externally reserved releases before downloads
        run: |
          python3 -B scripts/wait_cloud_tested_source_release.py --group mainchip-built-engine-route-tail-off
          python3 -B scripts/wait_cloud_tested_source_release.py --group mainchip-built-engine-route-tail-on
          python3 -B scripts/wait_cloud_tested_source_release.py --group mainchip-built-engine-route-tail-compare
      - name: Execute one owned route tail from the complete frozen prefix
        id: tail
        run: |
          python3 -B scripts/cloud_mainchip_built_engine_route_tail.py probe
      - name: Permanently preserve complete success or failure evidence
        if: ${{ always() && steps.tail.outcome != 'skipped' }}
        run: |
          python3 -B scripts/cloud_mainchip_built_engine_route_tail.py publish
      - name: Always emit complete terminal and repeated-control records
        if: always()
        run: |
          python3 - <<'PY'
          import base64,hashlib,json,os
          from pathlib import Path
          out=Path(os.environ["RUNNER_TEMP"])/("mainchip-built-engine-route-tail-"+os.environ["NSSOC_ROUTE_TAIL_MODE"]+"-"+os.environ["GITHUB_RUN_ID"]+"-"+os.environ["GITHUB_RUN_ATTEMPT"])/"out"
          paths=[Path("route-prefix-controls.json"),Path("route-tail-controls.json")]
          paths += [out/name for name in ("host-result.json","inner-result.json","case-result.json","observer-diagnosis.json","writer-raw.json","prefix-restoration.json","publication.json")]
          for p in paths:
              raw=p.read_bytes() if p.is_file() else b"";chunks=[raw[i:i+6000] for i in range(0,len(raw),6000)]
              print("ROUTE_TAIL_RECORD_INDEX "+json.dumps(dict(path=str(p),present=p.is_file(),bytes=len(raw),sha256=hashlib.sha256(raw).hexdigest(),chunks=len(chunks))))
              for i,b in enumerate(chunks):
                  print("ROUTE_TAIL_RECORD_CHUNK "+json.dumps(dict(path=str(p),index=i,base64=base64.b64encode(b).decode())))
          PY
      - name: Complete native output artifact fallback
        if: ${{ always() && steps.tail.outcome != 'skipped' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: route-tail-${{ matrix.mode }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/mainchip-built-engine-route-tail-${{ matrix.mode }}-${{ github.run_id }}-${{ github.run_attempt }}/out/
          if-no-files-found: error
          retention-days: 90
          compression-level: 1
  comparison:
    if: ${{ false && inputs.native }}
    needs: [source-controls, route-tail]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      NSSOC_ROUTE_TAIL_MODE: compare
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Compare complete authenticated off and on outputs
        run: |
          python3 -B scripts/cloud_mainchip_built_engine_route_tail.py compare
      - name: Preserve complete comparison evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: route-tail-comparison-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/mainchip-built-engine-route-tail-compare-${{ github.run_id }}-${{ github.run_attempt }}/
          if-no-files-found: error
          retention-days: 90
