# Source only. Registration and native extraction require separate reviewed activation.
# SPDX-License-Identifier: Apache-2.0
name: cdr-v59-mim-precision-cloud
on:
  workflow_dispatch:
    inputs:
      execute:
        description: Extract the exact recovered current v59 MIM circuit after controls
        type: boolean
        required: true
        default: false
permissions:
  contents: read
concurrency:
  group: cdr-v59-mim-precision
  cancel-in-progress: false
env:
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  controls:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Actual source, frozen derivations and small archive controls
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p hw/soc/out/cdr-v59-mim-controls
          PYTHONPATH=scripts python3 scripts/check_cdr_v59_mim_source.py | tee hw/soc/out/cdr-v59-mim-controls/source.json
          python3 - <<'PY'
          import json
          r=json.load(open('hw/soc/out/cdr-v59-mim-controls/source.json'))
          assert r['status']=='PASS_CURRENT_V59_MIM_SOURCE_CONTROLS_NO_NATIVE'
          assert len(r['rejected'])==79 and len(r['positive']['derivations'])==5
          assert r['source_controls_only'] and not r['archives_downloaded']
          assert not r['native_extraction_executed'] and not r['simulation_executed'] and not r['geometry_regenerated']
          PY
      - name: Original shared publication and reservation controls
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=scripts python3 scripts/cloud_cdr_v59_binding_rc.py --publication-controls | tee hw/soc/out/cdr-v59-mim-controls/publication.json
          PYTHONPATH=scripts python3 scripts/ensure_cloud_tested_source_release.py --controls | tee hw/soc/out/cdr-v59-mim-controls/release.json
          python3 - <<'PY'
          import json
          r=json.load(open('hw/soc/out/cdr-v59-mim-controls/publication.json'))
          assert len(r['rejected'])==8 and len(r['file_list_controls']['rejected'])==14
          assert r['file_list_controls']['actual_shared_function_executed'] and not r['release_creation_possible']
          assert json.load(open('hw/soc/out/cdr-v59-mim-controls/release.json'))['status'].startswith('PASS')
          PY
      - name: Emit complete named source control records
        if: always()
        shell: bash
        run: |
          PYTHONPATH=scripts python3 - <<'PY'
          from pathlib import Path
          from cloud_cdr_v59_binding_rc import emit
          for p in sorted(Path('hw/soc/out/cdr-v59-mim-controls').glob('*.json')):
              print('CONTROL_FILE '+p.name,flush=True)
              emit(p,'CDR_V59_MIM_CONTROLS_'+p.stem.upper())
          PY
      - name: Retain source controls
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cdr-v59-mim-controls-${{ github.run_id }}-${{ github.run_attempt }}
          path: hw/soc/out/cdr-v59-mim-controls/
          retention-days: 90
          if-no-files-found: warn
  native:
    needs: controls
    if: github.event_name == 'workflow_dispatch' && inputs.execute
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Require reviewed native activation and exact-source prerelease before dependencies
        env:
          GH_TOKEN: ${{ github.token }}
        run: PYTHONPATH=scripts python3 scripts/cloud_cdr_v59_mim_stage.py --preflight
      - name: Restore the original pinned native runtime and dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libfuse2 tcl8.6 tk8.6 tcl-dev tk-dev build-essential m4 autoconf libreadline-dev libx11-dev libxext-dev libxpm-dev libxt-dev libcairo2-dev libgl1-mesa-dev libglu1-mesa-dev
          python3 -m pip install networkx==3.4.2
          curl --fail --location --retry 4 https://github.com/librelane/librelane/releases/download/3.0.5/librelane-devshell-x86_64.AppImage -o "$RUNNER_TEMP/librelane.AppImage"
          echo "d6a349ec65be11456e96c4981d35f63ca34d3c85daf79a51e1ccb907bb5d7466  $RUNNER_TEMP/librelane.AppImage" | sha256sum --check
          chmod +x "$RUNNER_TEMP/librelane.AppImage"
          echo "CLOUD_APPIMAGE=$RUNNER_TEMP/librelane.AppImage" >> "$GITHUB_ENV"
      - name: Current seven-MIM geometry, both native orders and full composition
        env:
          GH_TOKEN: ${{ github.token }}
        run: PYTHONPATH=scripts python3 scripts/cloud_cdr_v59_mim_stage.py
      - name: Publish complete native evidence or rejection exactly once
        id: publish
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: PYTHONPATH=scripts python3 scripts/cloud_cdr_v59_mim_stage.py --publish-only
      - name: Preserve complete or partial evidence after publication failure
        if: always() && steps.publish.outcome == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cdr-v59-mim-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            hw/soc/out/cloud-cdr-v59-mim-precision/
            hw/soc/out/cloud-cdr-v59-font-recovery/
            hw/soc/out/cloud-cdr-v59-mim-evidence/
            hw/soc/out/cloud-cdr-v59-mim-publication/
          include-hidden-files: true
          retention-days: 90
          if-no-files-found: warn
