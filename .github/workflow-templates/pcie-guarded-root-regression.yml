name: Verify guarded PCIe suites through the root runner
on:
  workflow_dispatch:
    inputs:
      approved_source:
        description: Exact source commit to verify
        required: true
        type: string
permissions:
  contents: read
  actions: read
env:
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  source-and-rtl:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/pcie-guarded-root-methods.json
            /scripts/pcie-gen12-record-cdc-root-integration-methods.json
      - name: Bind approved source and materialize complete protected closure
        env:
          APPROVED_SOURCE: ${{ inputs.approved_source }}
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$APPROVED_SOURCE" = "$GITHUB_SHA"
          python3 -B - <<'PY'
          import json,subprocess
          from pathlib import Path
          methods=['scripts/pcie-guarded-root-methods.json','scripts/pcie-gen12-record-cdc-root-integration-methods.json']
          names=set(methods)
          for p in methods:names.update(json.loads(Path(p).read_bytes())['protected'])
          names.add('.github/workflows/cloud-evidence-summary.yml')
          assert all(not p.startswith('/')and '..'not in Path(p).parts for p in names)
          patterns=''.join('/'+p+'\n'for p in sorted(names))+'/hw/soc/tb/**\n'
          subprocess.run(['git','sparse-checkout','set','--no-cone','--stdin'],input=patterns,text=True,check=True)
          PY
          cmp .github/workflows/cloud-evidence-summary.yml .github/workflow-templates/pcie-guarded-root-regression.yml
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Guarded source, XML refusal and existing Gen12 root controls
        id: controls
        run: |
          set -o pipefail
          mkdir -p hw/soc/out/guarded-root-validation
          python3 -B scripts/check_pcie_guarded_root_controls.py 2>&1 | tee hw/soc/out/guarded-root-validation/controls.log
          python3 -B scripts/check_pcie_gen12_record_cdc_root_controls.py 2>&1 | tee hw/soc/out/guarded-root-validation/gen12-controls.log
          bash -n scripts/run_cocotb.sh
      - name: Install Icarus for actual RTL
        id: tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends iverilog
      - name: Run all shared-front named cases through root discovery
        run: |
          set -o pipefail
          PY=python3 bash scripts/run_cocotb.sh pcie_shared_serial_front 2>&1 | tee hw/soc/out/guarded-root-validation/shared.log
      - name: Run all epoch-ingress named cases through root discovery
        if: always() && steps.controls.outcome == 'success' && steps.tools.outcome == 'success'
        run: |
          set -o pipefail
          PY=python3 bash scripts/run_cocotb.sh pcie_training_epoch_ingress 2>&1 | tee hw/soc/out/guarded-root-validation/epoch.log
      - name: Collect derived text separately from compiled simulator images
        if: always()
        run: |
          python3 -B - <<'PY'
          import hashlib,json,shutil
          from pathlib import Path
          root=Path('hw/soc/out');dest=Path('guarded-root-derived');dest.mkdir()
          rows={}
          for directory in ['cocotb','guarded-root-controls','guarded-root-validation']:
              base=root/directory
              if not base.exists():continue
              for p in sorted(base.rglob('*')):
                  if p.is_file()and not p.is_symlink()and p.suffix in ('.json','.xml','.stdout','.stderr','.log','.txt'):
                      assert p.stat().st_size<=16*1024**2
                      n=p.relative_to(root);q=dest/n;q.parent.mkdir(parents=True,exist_ok=True);shutil.copyfile(p,q)
                      rows[str(n)]=dict(bytes=q.stat().st_size,sha256=hashlib.sha256(q.read_bytes()).hexdigest())
          (dest/'derived-index.json').write_text(json.dumps(rows,sort_keys=True,indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: guarded-root-derived-${{ github.run_id }}
          path: guarded-root-derived
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: guarded-root-native-${{ github.run_id }}
          path: hw/soc/out
          if-no-files-found: warn
          retention-days: 90
