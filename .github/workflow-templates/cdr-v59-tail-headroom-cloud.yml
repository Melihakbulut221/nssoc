name: CDR current tail six PVT saved headroom rows
on:
  workflow_dispatch:
    inputs:
      readback:
        description: Analyze the six immutable existing PVT captures after source controls
        type: boolean
        required: true
        default: false
permissions:
  contents: read
  actions: read
concurrency:
  group: cdr-v59-tail-headroom-${{ github.ref }}
  cancel-in-progress: false
env:
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  source-controls:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Exact source pins and diagnostic scope before dependency setup
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path,PurePosixPath
          m=json.loads(Path('scripts/cdr-v59-tail-headroom-methods.json').read_bytes())
          assert m['source_controls_authorized'] is True
          for flag in ('simulation_authorized','native_execution_authorized','extraction_authorized','geometry_authorized','accepted','cdr_accepted','qualified_pex','full_phy_accepted','electrical_acceptance','automatic_native_retry'):
              assert m[flag] is False
          for name,digest in m['protected_sha256'].items():
              p=PurePosixPath(name)
              assert str(p)==name and not p.is_absolute() and '..' not in p.parts
              path=Path('.')
              for part in p.parts:
                  path/=part
                  assert not path.is_symlink()
              assert path.is_file() and hashlib.sha256(path.read_bytes()).hexdigest()==digest,name
          Path('hw/soc/out/cdr-tail-headroom-controls').mkdir(parents=True,exist_ok=False)
          PY
      - name: Exact existing numerical array runtime
        run: python -m pip install numpy==2.3.3
      - name: Six real saved reports and actual admission lifecycle paths
        run: python scripts/check_cdr_v59_tail_headroom_admission.py > hw/soc/out/cdr-tail-headroom-controls/admission.json
      - name: Actual current topology diagnostic and frame writer with synthetic waves
        run: python scripts/check_cdr_v59_tail_headroom_rows.py --output hw/soc/out/cdr-tail-headroom-controls/rows.json
      - name: Actual archive and permanent publisher with explicit fake remote
        run: python scripts/check_cdr_v59_tail_headroom_publication.py > hw/soc/out/cdr-tail-headroom-controls/publication.json
      - name: Require complete independent control records
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('hw/soc/out/cdr-tail-headroom-controls')
          a=json.loads((root/'admission.json').read_bytes())
          assert a['status']=='PASS_CURRENT_TAIL_HEADROOM_SOURCE_CONTROLS_NOT_CAPTURE_ANALYSIS'
          assert a['positive_count']==6 and a['refusal_count']>=40
          assert a['actual_six_original_reports_authenticated'] is True
          assert a['actual_capture_read'] is False and a['simulator_executed'] is False
          r=json.loads((root/'rows.json').read_bytes())
          assert r['status']=='PASS_SYNTHETIC_HEADROOM_ROW_CONTROLS'
          assert (r['positive_count'],r['refusal_count'])==(4,38)
          assert r['original_waveform_acquired'] is False and r['native_executed'] is False
          p=json.loads((root/'publication.json').read_bytes())
          assert p['status']=='PASS_ACTUAL_TAIL_HEADROOM_PUBLICATION_SOURCE_CONTROLS'
          assert (p['positive_count'],p['refusal_count'])==(3,5) and len(p['cases'])==8
          assert all(x['partial_evidence_retained'] for x in p['cases'])
          assert p['actual_capture_read'] is False and p['simulator_executed'] is False
          PY
      - name: Preserve complete or partial exact control bytes in the full job log
        if: always()
        run: |
          python - <<'PY'
          import base64,hashlib,json
          from pathlib import Path
          root=Path('hw/soc/out/cdr-tail-headroom-controls')
          for name in ('admission','rows','publication'):
              path=root/(name+'.json')
              assert not path.is_symlink()
              if not path.exists():
                  print('CDR_TAIL_HEADROOM_RECORD_INDEX '+json.dumps(dict(path=path.name,present=False)),flush=True)
                  continue
              raw=path.read_bytes();encoded=base64.b64encode(raw).decode()
              chunks=[encoded[i:i+24000] for i in range(0,len(encoded),24000)]
              print('CDR_TAIL_HEADROOM_RECORD_INDEX '+json.dumps(dict(path=path.name,present=True,bytes=len(raw),sha256=hashlib.sha256(raw).hexdigest(),chunks=len(chunks))),flush=True)
              for i,part in enumerate(chunks):
                  print('CDR_TAIL_HEADROOM_RECORD_CHUNK '+json.dumps(dict(path=path.name,index=i,base64=part)),flush=True)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: cdr-tail-headroom-controls-${{ github.run_id }}-${{ github.run_attempt }}
          path: hw/soc/out/cdr-tail-headroom-controls
          include-hidden-files: true
          retention-days: 90
          if-no-files-found: warn
  readback:
    needs: source-controls
    if: ${{ inputs.readback }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: write
      actions: read
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        case: [nominal_early, nominal_late, hot_early, hot_late, cold_early, cold_late]
    env:
      GH_TOKEN: ${{ github.token }}
      PVT_CASE: ${{ matrix.case }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Require separately reviewed readback authorization
        run: |
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          m=json.loads(Path('scripts/cdr-v59-tail-headroom-methods.json').read_bytes())
          assert m['source_controls_authorized'] is True and m['readback_authorized'] is True
          assert os.environ['GITHUB_RUN_ATTEMPT']=='1'
          for flag in ('simulation_authorized','native_execution_authorized','extraction_authorized','geometry_authorized','accepted','cdr_accepted','qualified_pex','full_phy_accepted','electrical_acceptance','automatic_native_retry'):
              assert m[flag] is False
          for name,digest in m['protected_sha256'].items():
              path=Path(name);assert path.is_file() and not path.is_symlink()
              assert hashlib.sha256(path.read_bytes()).hexdigest()==digest,name
          PY
      - name: Exact-source permanent reservation before dependencies or archives
        run: python scripts/wait_cloud_tested_source_release.py --group "cdr-v59-tail-headroom-$PVT_CASE"
      - name: Exact existing numerical array runtime
        run: python -m pip install numpy==2.3.3
      - name: Authenticate current capture and replay every original measurement
        run: python scripts/cloud_cdr_v59_tail_headroom_readback.py --case "$PVT_CASE" --readback
      - name: Permanently preserve complete or partial diagnosis
        if: always()
        run: python scripts/cloud_cdr_v59_tail_headroom_readback.py --case "$PVT_CASE" --publish
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: cdr-tail-headroom-${{ matrix.case }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            cloud-cdr-v59-tail-headroom-${{ matrix.case }}
            hw/soc/out/cdr-v59-tail-headroom-${{ matrix.case }}-publication
          include-hidden-files: true
          retention-days: 90
          if-no-files-found: warn
