name: CDR v59 additive tail-wire physical
on:
  workflow_dispatch:
    inputs:
      execute:
        description: Run the separately authorized physical qualification after source controls
        type: boolean
        default: false
        required: true
permissions:
  contents: write
  actions: read
concurrency:
  group: cdr-v59-tail-access-physical-${{ github.ref }}
  cancel-in-progress: false
env:
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  source-controls:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Actual import closure and isolated imports
        run: python scripts/check_cdr_v59_tail_access_imports.py --output hw/soc/out/cdr-tail-controls/imports.json
      - name: Exact generator source and actual metadata seams
        run: |
          python scripts/check_cdr_v59_tail_access_source.py | tee hw/soc/out/cdr-tail-controls/source.json
          python - <<'PY'
          import json
          x=json.load(open('hw/soc/out/cdr-tail-controls/source.json'))
          assert x['status']=='PASS_TAIL_ACCESS_SOURCE_CONTROLS_ONLY'
          assert x['metadata_faults_rejected']==19 and x['actual_import_positive']==1
          assert x['actual_snapshot_call_signatures_positive']==1 and x['actual_missing_dependency_rejected']==1
          assert len(x['actual_output_assignment_probe_positives'])==2 and len(x['output_metadata_faults'])==3
          PY
      - name: All-device and terminal-partition source controls
        run: |
          python scripts/check_cdr_v59_tail_access_topology.py | tee hw/soc/out/cdr-tail-controls/topology.json
          python - <<'PY'
          import json
          x=json.load(open('hw/soc/out/cdr-tail-controls/topology.json'))
          assert x['status']=='PASS_FULL_SAVED_TOPOLOGY_SOURCE_CONTROLS_ONLY'
          assert x['positives']==2 and x['refusals']==16
          PY
      - name: Actual controller derivation, command and failure paths
        run: python scripts/check_cdr_v59_tail_access_physical.py --section physical --output hw/soc/out/cdr-tail-controls/physical.json
      - name: Qualified owned-process and real launcher finally fixtures
        run: python scripts/check_cdr_v59_tail_access_physical.py --section runtime --output hw/soc/out/cdr-tail-controls/runtime.json
      - name: Actual pack, complete member and reserved publisher fixtures
        run: python scripts/check_cdr_v59_tail_access_physical.py --section publication --output hw/soc/out/cdr-tail-controls/publication.json
      - name: Admit all six complete control records
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          b=Path('hw/soc/out/cdr-tail-controls')
          x=json.loads((b/'imports.json').read_text())
          assert x['status']=='PASS_ACTUAL_TAIL_DRIVER_INITIAL_IMPORT_CONTROLS'
          assert (x['positive_count'],x['refusal_count'])==(3,9) and len(x['closure']['modules'])==35
          x=json.loads((b/'physical.json').read_text())
          assert x['status']=='PASS_TAIL_PHYSICAL_DRIVER_SOURCE_CONTROLS_ONLY'
          assert (x['positive_count'],x['refusal_count'])==(17,22)
          x=json.loads((b/'runtime.json').read_text())
          assert x['status']=='PASS_QUALIFIED_RUNTIME_AND_WRITER_DEPENDENCY_CONTROLS'
          assert len(x['supervisor']['controls'])==13
          assert len(x['launcher']['positive'])==2 and len(x['launcher']['rejected'])==9
          assert len(x['all11_launcher_results_saved'])==11
          assert x['original_missing_writer_reproduced']['result_missing'] is True
          assert x['corrected_exit127_saved']['returncode']==127
          x=json.loads((b/'publication.json').read_text())
          assert x['status']=='PASS_ACTUAL_TAIL_PUBLISHER_AND_PACK_CONTROLS'
          assert (x['positive_count'],x['refusal_count'])==(3,15)
          assert x['inherited_publication_controls']['status']=='PASS_READ_ONLY_RELEASE_LOOKUP_AND_STREAM_COPY_8_FAULTS'
          assert len(x['inherited_publication_controls']['rejected'])==8
          assert {p.name for p in b.glob('*.json')}=={'imports.json','source.json','topology.json','physical.json','runtime.json','publication.json'}
          PY
      - name: Preserve every complete control result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cdr-tail-source-controls-${{ github.run_id }}-${{ github.run_attempt }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
          path: hw/soc/out/cdr-tail-controls
  physical:
    if: ${{ inputs.execute }}
    needs: source-controls
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Read-only exact-source prerelease wait before dependencies
        run: python scripts/cloud_cdr_v59_tail_access_physical.py --preflight
      - name: Qualified pinned AppImage
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libfuse2 tcl8.6
          curl --fail --location --retry 4 https://github.com/librelane/librelane/releases/download/3.0.5/librelane-devshell-x86_64.AppImage -o "$RUNNER_TEMP/librelane.AppImage"
          echo "d6a349ec65be11456e96c4981d35f63ca34d3c85daf79a51e1ccb907bb5d7466  $RUNNER_TEMP/librelane.AppImage" | sha256sum --check
          chmod +x "$RUNNER_TEMP/librelane.AppImage"
          echo "CLOUD_APPIMAGE=$RUNNER_TEMP/librelane.AppImage" >> "$GITHUB_ENV"
      - name: Complete additive physical qualification and evidence publication
        run: python scripts/cloud_cdr_v59_tail_access_physical.py
      - name: Preserve pre-driver or partial failure truthfully
        if: always()
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          out=Path('hw/soc/out/cloud-cdr-v59-tail-access-physical')
          out.mkdir(parents=True,exist_ok=True)
          p=out/'result.json'
          if not p.exists():
              p.write_text(json.dumps(dict(status='FAIL_BEFORE_PHYSICAL_DRIVER_RESULT',
                source_head=os.environ['GITHUB_SHA'],run_id=int(os.environ['GITHUB_RUN_ID']),
                run_attempt=int(os.environ['GITHUB_RUN_ATTEMPT']),accepted=False,
                native_physical_qualification_passed=False,simulation_executed=False,
                wire_rc_extracted=False,automatic_retry=False),indent=2)+'\n')
          PY
      - name: Complete or partial physical evidence fallback
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cdr-tail-physical-full-${{ github.run_id }}-${{ github.run_attempt }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
          path: |
            hw/soc/out/cloud-cdr-v59-tail-access-physical
            hw/soc/out/cloud-cdr-v59-tail-access-physical-publication
            hw/soc/out/cloud-cdr-v59-font-recovery
