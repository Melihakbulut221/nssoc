name: Fixed NEARDRC full engine build candidate
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: fixed-engine-build-${{ github.ref }}
  cancel-in-progress: false
env:
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  source-controls:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Exact first manual hosted source
        run: |
          python3 -B - <<'PY'
          import os,subprocess,sys
          sys.path.insert(0,'scripts')
          import mainchip_fixed_engine_build_contract as c
          ctx=c.context(os.environ)
          assert subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()==ctx['source']
          assert sys.version_info[:2]==(3,12)
          assert c.method(__import__('pathlib').Path.cwd())['source_controls_authorized'] is True
          PY
      - name: Actual new host lifecycle and source publication controls
        run: |
          python3 -B scripts/check_mainchip_fixed_engine_build.py --output fixed-engine-controls.json > fixed-engine-controls.stdout 2> fixed-engine-controls.stderr
          python3 -B scripts/check_mainchip_two_signal_internal_witness.py > internal-witness-controls.json
          python3 -B - <<'PY'
          import json,os
          from pathlib import Path
          r=json.loads(Path('fixed-engine-controls.json').read_bytes())
          assert r['status']=='PASS_FIXED_ENGINE_BUILD_SOURCE_CONTROLS'
          assert r['current_source']==os.environ['GITHUB_SHA'] and r['current_token']==os.environ['GITHUB_RUN_ID']+'-1'
          assert len(r['lifecycle']['current_control_provenance_refusals'])==4
          assert (len(r['authority']['refusals']),len(r['derivation']['refusals']),r['lifecycle']['count'],r['publication']['count'])==(28,7,10,6)
          old=r['unchanged_build_controls']
          assert old['status']=='PASS_ENGINE_BUILD_SOURCE_CONTROLS'
          assert (old['positive_count'],old['refusal_count'],old['lifecycle']['count'])==(7,45,25)
          assert all(r[k] is False for k in ('actual_engine_compilation','native_payload_acquired','runtime_qualified','routing_qualified','physical_acceptance'))
          Path('engine-build-controls.json').write_text(json.dumps(old,sort_keys=True,indent=2)+'\n')
          PY
      - name: Always emit exact complete source controls
        if: always()
        run: |
          python3 -B - <<'PY'
          import base64,hashlib,json
          from pathlib import Path
          for name in ('fixed-engine-controls.json','fixed-engine-controls.stdout','fixed-engine-controls.stderr','engine-build-controls.json','internal-witness-controls.json'):
              p=Path(name);present=p.is_file() and not p.is_symlink();raw=p.read_bytes() if present else b''
              chunks=[raw[i:i+6000] for i in range(0,len(raw),6000)]
              print('FIXED_ENGINE_CONTROL_INDEX '+json.dumps(dict(path=name,present=present,bytes=len(raw),sha256=hashlib.sha256(raw).hexdigest(),chunks=len(chunks))))
              for i,b in enumerate(chunks):
                  print('FIXED_ENGINE_CONTROL_CHUNK '+json.dumps(dict(path=name,index=i,base64=base64.b64encode(b).decode())))
          PY
      - name: Preserve all source control reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fixed-engine-source-controls-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            fixed-engine-controls.json
            fixed-engine-controls.stdout
            fixed-engine-controls.stderr
            engine-build-controls.json
            internal-witness-controls.json
          if-no-files-found: error
          retention-days: 90
  engine-build:
    # Disabled pending independent review and actual exact-source controls.
    if: ${{ false }}
    needs: source-controls
    runs-on: ubuntu-24.04
    timeout-minutes: 250
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Repeat exact new source controls before transport
        run: |
          python3 -B scripts/check_mainchip_fixed_engine_build.py --output fixed-engine-controls.json
          python3 -B scripts/check_mainchip_two_signal_internal_witness.py > internal-witness-controls.json
          python3 -B - <<'PY'
          import json,os,subprocess
          from pathlib import Path
          r=json.loads(Path('fixed-engine-controls.json').read_bytes())
          assert r['status']=='PASS_FIXED_ENGINE_BUILD_SOURCE_CONTROLS' and r['current_source']==os.environ['GITHUB_SHA']
          assert subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()==r['current_source']
          Path('engine-build-controls.json').write_text(json.dumps(r['unchanged_build_controls'],sort_keys=True,indent=2)+'\n')
          PY
      - name: New reserved-source build only
        # build() validates new typed authority and empty exact-source release
        # before Docker image or upstream acquisition. It runs no chip or router.
        run: python3 -B scripts/mainchip_fixed_engine_build.py build
      - name: Permanently retain complete success or failure evidence
        if: always()
        run: python3 -B scripts/mainchip_fixed_engine_build.py publish
      - name: Full cloud-only build evidence fallback
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fixed-engine-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/mainchip-fixed-neardrc-engine-build-${{ github.run_id }}-${{ github.run_attempt }}/out/
          if-no-files-found: error
          retention-days: 90
          compression-level: 1
  preserve-source-job-log:
    needs: source-controls
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Preserve the completed source job full raw log and provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -B - <<'PY'
          import hashlib,json,os,subprocess
          from pathlib import Path
          e=os.environ;repo=e['GITHUB_REPOSITORY'];run_id=e['GITHUB_RUN_ID'];attempt=e['GITHUB_RUN_ATTEMPT']
          assert repo=='Melihakbulut221/nssoc' and e['GITHUB_ACTIONS']=='true'
          assert e['GITHUB_EVENT_NAME']=='workflow_dispatch' and attempt=='1'
          def read(endpoint,name):
              raw=subprocess.check_output(['gh','api','repos/'+repo+'/'+endpoint])
              Path(name).write_bytes(raw);return json.loads(raw)
          run=read('actions/runs/'+run_id,'fixed-engine-run.json')
          jobs=read('actions/runs/'+run_id+'/attempts/'+attempt+'/jobs?per_page=100','fixed-engine-jobs.json')
          assert run['id']==int(run_id) and run['head_sha']==e['GITHUB_SHA'] and run['run_attempt']==1
          matches=[j for j in jobs['jobs'] if j['name']=='source-controls']
          assert len(matches)==1
          j=matches[0]
          assert j['run_id']==int(run_id) and j['head_sha']==e['GITHUB_SHA'] and j['run_attempt']==1 and j['status']=='completed'
          read('actions/jobs/'+str(j['id']),'fixed-engine-source-job.json')
          log=subprocess.check_output(['gh','api','--allow-escape-sequences','repos/'+repo+'/actions/jobs/'+str(j['id'])+'/logs'])
          assert log
          Path('fixed-engine-source-job.log').write_bytes(log)
          names=('fixed-engine-run.json','fixed-engine-jobs.json','fixed-engine-source-job.json','fixed-engine-source-job.log')
          files={name:dict(bytes=Path(name).stat().st_size,sha256=hashlib.sha256(Path(name).read_bytes()).hexdigest()) for name in names}
          receipt=dict(source=e['GITHUB_SHA'],run_id=int(run_id),attempt=1,source_job_id=j['id'],
            source_job_conclusion=j['conclusion'],full_source_job_log=True,files=files,
            native_authorized=False,metadata_only=True)
          Path('fixed-engine-source-job-log-receipt.json').write_text(json.dumps(receipt,sort_keys=True,indent=2)+'\n')
          print(json.dumps(receipt,sort_keys=True))
          PY
      - name: Preserve full completed source job log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fixed-engine-full-source-job-log-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            fixed-engine-run.json
            fixed-engine-jobs.json
            fixed-engine-source-job.json
            fixed-engine-source-job.log
            fixed-engine-source-job-log-receipt.json
          if-no-files-found: error
          retention-days: 90
