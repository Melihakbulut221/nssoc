# SPDX-License-Identifier: Apache-2.0
# Source-only candidate. Existing archive JSON bytes only; no numerical analysis.
name: cdr-v59-headroom-json-recovery-cloud
on:
  workflow_dispatch:
    inputs:
      recover:
        type: boolean
        required: true
        default: false
        description: Expose exact saved JSON members after reviewed controls
permissions:
  contents: read
  actions: read
concurrency:
  group: cdr-v59-headroom-json-recovery
  cancel-in-progress: false
env:
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  controls:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Exact protected source before imports
        run: |
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          m=json.loads(Path('scripts/cdr-v59-headroom-json-recovery-methods.json').read_bytes())
          assert m['source_controls_authorized'] is True
          for n,h in m['protected'].items():
              p=Path(n);assert p.is_file() and not p.is_symlink()
              assert hashlib.sha256(p.read_bytes()).hexdigest()==h,n
          for k in ('native_authorized','simulation_authorized','analysis_authorized','geometry_authorized','extraction_authorized','accepted'):
              assert m[k] is False
          PY
      - name: Actual complete synthetic archives and qualified publisher controls
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p hw/soc/out/cdr-headroom-json-controls
          python3 scripts/check_cdr_v59_headroom_json_recovery.py | tee hw/soc/out/cdr-headroom-json-controls/recovery.json
          python3 scripts/ensure_cloud_tested_source_release.py --controls | tee hw/soc/out/cdr-headroom-json-controls/release.json
          python3 scripts/wait_cloud_tested_source_release.py --controls | tee hw/soc/out/cdr-headroom-json-controls/wait.json
          python3 - <<'PY'
          import json
          r=json.load(open('hw/soc/out/cdr-headroom-json-controls/recovery.json'))
          assert r['status']=='PASS_SYNTHETIC_EXISTING_JSON_RECOVERY_CONTROLS'
          assert len(r['positive'])==6 and len(r['rejected'])==32
          assert not any(r[k] for k in ('original_archive_downloaded','new_analysis','simulation','native'))
          r=json.load(open('hw/soc/out/cdr-headroom-json-controls/release.json'))
          assert len(r['rejected'])==17
          r=json.load(open('hw/soc/out/cdr-headroom-json-controls/wait.json'))
          assert len(r['positive_cases'])==3 and len(r['rejected'])==4 and not r['creation_attempted']
          PY
      - name: Preserve complete source-control records
        if: always()
        run: |
          PYTHONPATH=scripts python3 - <<'PY'
          from pathlib import Path
          from cloud_cdr_v59_headroom_json_recovery import emit
          for p in sorted(Path('hw/soc/out/cdr-headroom-json-controls').glob('*.json')):
              emit(p,'CDR_HEADROOM_JSON_CONTROLS_'+p.stem.upper())
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: cdr-headroom-json-controls-${{ github.run_id }}-${{ github.run_attempt }}
          path: hw/soc/out/cdr-headroom-json-controls/
          include-hidden-files: true
          retention-days: 90
          if-no-files-found: warn
  recover:
    needs: controls
    if: inputs.recover
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Protected source and explicit recovery authorization before archive access
        run: |
          PYTHONPATH=scripts python3 - <<'PY'
          import cloud_cdr_v59_headroom_json_recovery as c
          c.guard(c.methods(),'recovery')
          PY
      - name: Read-only exact-source reservation before recovery
        run: python3 scripts/wait_cloud_tested_source_release.py --group cdr-v59-headroom-json-recovery
      - name: Verify complete existing archive and export unchanged JSON bytes
        run: python3 scripts/cloud_cdr_v59_headroom_json_recovery.py --recover
      - name: Publish complete or failed receipt without changing original release
        if: always()
        run: python3 scripts/cloud_cdr_v59_headroom_json_recovery.py --publish
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: cdr-headroom-recovered-json-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            cloud-cdr-v59-headroom-json-recovery/json/
            cloud-cdr-v59-headroom-json-recovery/result.json
            cloud-cdr-v59-headroom-json-recovery/publication.json
          include-hidden-files: true
          retention-days: 90
          if-no-files-found: warn
