name: Mainchip pinned observer engine build
on:
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: mainchip-internal-witness-engine-build-${{ github.ref }}
  cancel-in-progress: false
env:
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  source-controls:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Source admission and independent observer controls
        run: |
          python3 -B scripts/check_mainchip_witness_engine_build.py > engine-build-controls.json
          python3 -B scripts/check_mainchip_two_signal_internal_witness.py > internal-witness-controls.json
          cat engine-build-controls.json
          cat internal-witness-controls.json
      - name: Preserve available control records in full job log
        if: always()
        run: |
          python3 - <<'PY'
          import base64,hashlib,json
          from pathlib import Path
          for name in ("engine-build-controls.json","internal-witness-controls.json"):
              p=Path(name);b=p.read_bytes() if p.is_file() else b""
              pieces=[b[i:i+6000] for i in range(0,len(b),6000)]
              print("ENGINE_BUILD_RECORD_INDEX "+json.dumps(dict(path=name,present=p.is_file(),bytes=len(b),sha256=hashlib.sha256(b).hexdigest(),chunks=len(pieces))))
              for i,v in enumerate(pieces):
                  print("ENGINE_BUILD_RECORD_CHUNK "+json.dumps(dict(path=name,index=i,base64=base64.b64encode(v).decode())))
          PY
  engine-build:
    needs: source-controls
    runs-on: ubuntu-24.04
    timeout-minutes: 250
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Repeat exact source controls before native work
        run: |
          python3 -B scripts/check_mainchip_witness_engine_build.py > engine-build-controls.json
          python3 -B scripts/check_mainchip_two_signal_internal_witness.py > internal-witness-controls.json
          cat engine-build-controls.json
          cat internal-witness-controls.json
      - name: Build complete pinned engine under owned cgroup
        run: python3 -B scripts/mainchip_witness_engine_build.py build
      - name: Permanently preserve available success or failure evidence
        if: always()
        run: python3 -B scripts/mainchip_witness_engine_build.py publish
      - name: Artifact fallback for complete cloud evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mainchip-observer-engine-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/mainchip-internal-witness-engine-build-${{ github.run_id }}-${{ github.run_attempt }}/out/
          if-no-files-found: error
          retention-days: 90
          compression-level: 1
