name: routed-geometry-cloud
on:
  push:
    branches: [codex/complete-open-work]
    paths: [.github/workflows/routed-geometry-cloud.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: routed-geometry-${{ github.ref }}
  cancel-in-progress: false
jobs:
  geometry-and-antenna:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Restore exact native runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libfuse2
          curl --fail --location --retry 4 https://github.com/librelane/librelane/releases/download/3.0.5/librelane-devshell-x86_64.AppImage -o "$RUNNER_TEMP/librelane.AppImage"
          echo "d6a349ec65be11456e96c4981d35f63ca34d3c85daf79a51e1ccb907bb5d7466  $RUNNER_TEMP/librelane.AppImage" | sha256sum --check
          chmod +x "$RUNNER_TEMP/librelane.AppImage"
          echo "CLOUD_APPIMAGE=$RUNNER_TEMP/librelane.AppImage" >> "$GITHUB_ENV"
      - name: Pinned decoder geometry checker and fault controls
        run: |
          python3 -m pip install shapely==2.1.2
          python3 -m py_compile scripts/run_cloud_routed_geometry.py scripts/export_cloud_routed_shapes.py scripts/check_cloud_routed_shapes.py
          python3 scripts/check_cloud_routed_shapes.py --controls-only
      - name: Check exact saved native route geometry and antennas
        timeout-minutes: 240
        run: python3 scripts/run_cloud_routed_geometry.py
      - name: Preserve source and all native geometry observations
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p cloud-routed-geometry
          if [ ! -f cloud-routed-geometry/result.json ]; then
            printf '%s\n' '{"status":"FAIL_MISSING_REPORT","accepted":false}' > cloud-routed-geometry/result.json
          fi
          stem="routed-geometry-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          cp cloud-routed-geometry/result.json "$stem.summary.json"
          python3 scripts/cloud_chunked_results.py --directory cloud-routed-geometry --stem "$stem"
          python3 - "$stem" <<'PYCODE'
          import json,subprocess,sys
          stem=sys.argv[1];manifest=stem+'.parts.json';m=json.load(open(manifest))
          subprocess.run([sys.executable,'scripts/publish_cloud_results.py','--group','routed-geometry',stem+'.summary.json',manifest,*[p['name']for p in m['parts']]],check=True)
          PYCODE
