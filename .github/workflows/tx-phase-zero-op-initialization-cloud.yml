# SPDX-License-Identifier: Apache-2.0
name: tx-phase-zero-op-initialization-cloud
on:
  push:
    branches: [codex/tx-clock-phase-parent]
    paths:
      - scripts/cloud_tx_phase_zero_op_initialization.py
      - scripts/tx-phase-zero-op-initialization-methods.json
      - .github/workflows/tx-phase-zero-op-initialization-cloud.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
defaults:
  run:
    shell: bash
concurrency:
  group: tx-phase-zero-op-initialization
  cancel-in-progress: false
jobs:
  source-controls:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify OP-only deck and every native flag refusal
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -m pip install numpy==2.3.3
          python3 scripts/cloud_tx_phase_zero_op_initialization.py --controls | tee controls.json
          python3 - <<'PYCODE'
          import json
          d=json.load(open('controls.json'))
          assert d['status']=='PASS_UNIFORM106_OFF_OP_ONLY_SOURCE_CONTROLS_NO_NATIVE'
          assert len(d['negative_controls'])==11 and not d['native_execution']
          PYCODE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: phase-zero-op-controls-${{ github.run_id }}
          path: controls.json
          retention-days: 30
  compare-original-zero-op-only:
    if: github.event_name == 'workflow_dispatch'
    needs: source-controls
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Compare original default and uniform initialization with no transient
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libsndfile1 libsamplerate0 libreadline8t64 libxaw7 libxt6 libxft2 libfontconfig1
          python3 -m pip install numpy==2.3.3
          python3 scripts/cloud_tx_phase_zero_op_initialization.py --native-op
      - name: Preserve native OP and every failure
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PYCODE'
          import json,os,pathlib,subprocess,sys
          root=pathlib.Path('hw/soc/out/cloud-tx-phase-zero-op-initialization');root.mkdir(parents=True,exist_ok=True)
          p=root/'result.json'
          if not p.exists():p.write_text(json.dumps(dict(status='FAIL_MISSING_OP_RESULT',full_PHY_accepted=False))+'\n')
          group='tx-phase-zero-op-initialization';stem=group+'-'+os.environ['GITHUB_RUN_ID']+'-'+os.environ['GITHUB_RUN_ATTEMPT']
          summary=pathlib.Path(stem+'.summary.json');summary.write_bytes(p.read_bytes())
          subprocess.run([sys.executable,'scripts/cloud_chunked_results.py','--directory',str(root),'--stem',stem],check=True)
          parts=pathlib.Path(stem+'.parts.json');manifest=json.loads(parts.read_text())
          subprocess.run([sys.executable,'scripts/publish_cloud_results.py','--group',group,str(summary),str(parts),*[p['name']for p in manifest['parts']]],check=True)
          PYCODE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: phase-zero-op-evidence-${{ github.run_id }}
          path: hw/soc/out/cloud-tx-phase-zero-op-initialization/
          retention-days: 30
