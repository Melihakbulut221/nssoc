name: tx-output8088-branch-tail-feed-cloud
on:
  push:
    branches: [codex/tx-via3-rail-diagnosis]
    paths: [.github/workflows/tx-output8088-branch-tail-feed-cloud.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tx-output8088-branch-tail-feed-${{ github.ref }}
  cancel-in-progress: false
jobs:
  diagnose:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Build and check actual same-net driver pin feeds
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libfuse2 tcl8.6
          curl -fL --retry 3 https://github.com/librelane/librelane/releases/download/3.0.5/librelane-devshell-x86_64.AppImage -o "$RUNNER_TEMP/librelane.AppImage"
          echo "d6a349ec65be11456e96c4981d35f63ca34d3c85daf79a51e1ccb907bb5d7466  $RUNNER_TEMP/librelane.AppImage" | sha256sum -c
          chmod +x "$RUNNER_TEMP/librelane.AppImage"
          export CLOUD_APPIMAGE="$RUNNER_TEMP/librelane.AppImage"
          python3 -m py_compile scripts/cloud_tx_output8088_branch_tail_feed.py
          python3 scripts/cloud_tx_output8088_branch_tail_feed.py
      - name: Preserve diagnostic evidence and failures
        if: always()
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          root=cloud-tx-output8088-branch-tail-feed
          mkdir -p "$root"
          if [ ! -f "$root/result.json" ]; then
            printf '%s\n' '{"status":"FAIL_MISSING_REPORT","accepted":false}' > "$root/result.json"
          fi
          stem="tx-output8088-branch-tail-feed-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          cp "$root/result.json" "$stem.summary.json"
          python3 scripts/cloud_chunked_results.py --directory "$root" --stem "$stem"
          python3 - "$stem" <<'PYCODE'
          import json,subprocess,sys
          stem=sys.argv[1];m=json.load(open(stem+'.parts.json'))
          subprocess.run([sys.executable,'scripts/publish_cloud_results.py','--group','tx-output8088-branch-tail-feed',stem+'.summary.json',stem+'.parts.json',*[p['name']for p in m['parts']]],check=True)
          PYCODE
      - name: Retain evidence if release publication fails
        if: always() && steps.publish.outcome == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tx-output8088-branch-tail-feed-${{ github.run_id }}
          path: cloud-tx-output8088-branch-tail-feed/
          retention-days: 30





