name: tx-metal-resistance-cloud
on:
  push:
    branches: ['codex/complete-open-work']
    paths:
      - .github/workflows/tx-metal-resistance-cloud.yml
      - scripts/analyze_cloud_metal_resistance.py
      - sw/tests/test_cloud_metal_resistance.py
  workflow_dispatch:
    inputs:
      profiles:
        description: Source-bound geometry comparison; avoid repeating prior studies
        type: choice
        options: [legacy, dense_comparison, signal_comparison, m3_comparison, v8_tail_comparison, local_return_comparison, prestage_supply_feed, final_supply_feed, final_internal_routes, prestage_supply_direct]
        default: legacy
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        profile: ${{ fromJSON(inputs.profiles == 'prestage_supply_direct' && '["cascade14-kelvin-supply-direct"]' || inputs.profiles == 'final_internal_routes' && '["v8-kelvin-local-internal"]' || inputs.profiles == 'final_supply_feed' && '["v8-kelvin-local-supply"]' || inputs.profiles == 'prestage_supply_feed' && '["cascade14-kelvin-supply-feed"]' || inputs.profiles == 'local_return_comparison' && '["v8-kelvin-local-tail","v8-kelvin-local-return","cascade14-kelvin-dense-wide"]' || inputs.profiles == 'v8_tail_comparison' && '["v8-kelvin-dense-wide","v8-kelvin-tail-paths"]' || inputs.profiles == 'm3_comparison' && '["kelvin-dense-wide","kelvin-m3-10"]' || inputs.profiles == 'signal_comparison' && '["kelvin-dense-wide","kelvin-signal-trunks"]' || inputs.profiles == 'dense_comparison' && '["kelvin-dense","kelvin-dense-wide"]' || '["kelvin","kelvin-short","kelvin-short-vias"]') }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify analytical networks and corruption controls
        run: |
          python3 -m pip install numpy==2.3.3 pytest==8.4.2
          python3 -m pytest -q sw/tests/test_cloud_metal_resistance.py
      - name: Diagnose exact native metal graph
        run: python3 scripts/analyze_cloud_metal_resistance.py --profile '${{ matrix.profile }}'
      - name: Preserve complete diagnosis and failures
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f cloud-metal-resistance/result.json ]; then
            summary='tx-metal-resistance-${{ matrix.profile }}-${{ github.run_id }}-${{ github.run_attempt }}.json'
            cp cloud-metal-resistance/result.json "$summary"
            python3 scripts/publish_cloud_results.py --group 'metal-dc-${{ matrix.profile }}' "$summary"
          fi
