name: cdr-xor-v15-latch-timing-cloud
on:
  push:
    branches: [codex/complete-open-work]
    paths: [.github/workflows/cdr-xor-v15-latch-timing-cloud.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cdr-xor-v15-latch-timing-${{ github.ref }}
  cancel-in-progress: false
jobs:
  native-physical:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        case: [nominal_early, nominal_late]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install pinned numerical reader dependency
        run: python3 -m pip install numpy==2.3.3
      - name: Compile source-bound diagnosis in cloud
        run: |
          python3 scripts/check_cdr_xor_v15_latch_sources.py
          python3 -m py_compile scripts/cloud_cdr_xor_v15_latch_timing.py
          PYTHONPATH=scripts python3 -c "from cloud_cdr_xor_v15_latch_timing import controls,parallel_controls; print(controls()); print(parallel_controls())"
      - name: Reconstruct actual master-slave latch graph and measure original data transfer windows
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/cloud_cdr_xor_v15_latch_timing.py --case ${{ matrix.case }}
      - name: Preserve physical results and failures
        if: always()
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          root=cloud-cdr-xor-v15-latch-timing-${{ matrix.case }}
          mkdir -p "$root"
          if [ ! -f "$root/result.json" ]; then
            printf '%s\n' '{"status":"FAIL_MISSING_REPORT","accepted":false}' > "$root/result.json"
          fi
          stem="cdr-xor-v15-latch-timing-${{ matrix.case }}-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          cp "$root/result.json" "$stem.summary.json"
          python3 scripts/cloud_chunked_results.py --directory "$root" --stem "$stem"
          python3 - "$stem" <<'PYCODE'
          import json,subprocess,sys
          stem=sys.argv[1];manifest=stem+'.parts.json';m=json.load(open(manifest))
          subprocess.run([sys.executable,'scripts/publish_cloud_results.py','--group','cdr-xor-v15-latch-timing-${{ matrix.case }}',stem+'.summary.json',manifest,*[p['name']for p in m['parts']]],check=True)
          PYCODE
      - name: Retain evidence after publication failure
        if: always() && steps.publish.outcome == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cdr-xor-v15-latch-timing-${{ matrix.case }}-${{ github.run_id }}
          path: cloud-cdr-xor-v15-latch-timing-${{ matrix.case }}/
          retention-days: 30

# Read only both original failed full CDR captures. The large immutable waveforms
# stay in their original releases; publish only this new diagnostic and source pins.

# Retain all physical parallel clock-selector base combinations; no representative averaging.
