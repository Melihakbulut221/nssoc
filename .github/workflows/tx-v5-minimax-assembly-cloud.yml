name: tx-v5-minimax-assembly-cloud
on:
  push:
    branches: [codex/complete-open-work]
    paths: [.github/workflows/tx-v5-minimax-assembly-cloud.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tx-v5-minimax-assembly-${{ github.ref }}
  cancel-in-progress: false
jobs:
  native-physical:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Compile exact physical methods in the cloud
        run: python3 -m py_compile scripts/cloud_tx_v5_minimax_assembly.py scripts/check_tx_v5_fast_stage_isolated_geometry.py scripts/check_tx_v5_minimax_geometry.py scripts/plan_tx_v5_minimax_rows.py
      - name: Verify exact physical source adaptation
        run: |
          python3 - <<'PYCODE'
          import hashlib,json
          from pathlib import Path
          p=json.loads(Path('scripts/tx-v5-columns-source-delta.json').read_text())
          b=Path(p['baseline_path']).read_bytes();assert hashlib.sha256(b).hexdigest()==p['baseline_sha256'];s=b.decode()
          for e in p['edits']:
              assert s.count(e['before'])==e['count'];s=s.replace(e['before'],e['after'])
          c=Path(p['candidate_path']).read_bytes();assert c==s.encode()and hashlib.sha256(c).hexdigest()==p['candidate_sha256']
          PYCODE
      - name: Verify exact diagnosed AVSS geometry changes
        run: |
          python3 - <<'PYCODE'
          import hashlib,json
          from pathlib import Path
          p=json.loads(Path('scripts/tx-v5-return-repair-source-delta.json').read_text())
          b=Path(p['baseline_path']).read_bytes();assert hashlib.sha256(b).hexdigest()==p['baseline_sha256'];s=b.decode()
          for e in p['edits']:
              assert s.count(e['before'])==e['count'];s=s.replace(e['before'],e['after'])
          c=Path(p['candidate_path']).read_bytes();assert c==s.encode()and hashlib.sha256(c).hexdigest()==p['candidate_sha256']
          PYCODE
      - name: Verify exact six-row layout delta and original physical gates
        run: |
          python3 scripts/check_tx_v5_fast_stage_sources.py
          python3 scripts/check_tx_v5_fast_stage_isolated_sources.py
          python3 scripts/check_tx_v5_final_strap6_sources.py
          python3 scripts/check_tx_v5_minimax_sources.py
      - name: Install topology dependency and exercise source selection before CAD
        run: |
          python3 -m pip install numpy==2.3.3 scipy==1.16.2
          python3 - <<'PYCODE'
          import sys
          sys.path.insert(0,'scripts')
          from plan_tx_v5_minimax_rows import controls
          print(controls())
          from cloud_tx_v5_minimax_assembly import topology
          p=topology()
          assert len(p['nodes'])==31 and len(p['ports'])==162 and p['selection_fault_rejected']
          print('Native tree selection preflight passed')
          import json
          from pathlib import Path
          from plan_tx_v5_minimax_rows import plan_candidate
          plan=plan_candidate(json.loads(Path('docs/evidence/tx-v5-final-strap6-physical-pass-20261019.json').read_text())['report']['layout'])
          Path('minimax-preflight-plan.json').write_text(json.dumps(plan,indent=2)+'\n')
          print(json.dumps({k:plan[k]for k in ('maximum_before_um','maximum_after_um','sum_before_um','sum_after_um','solver','row_targets_um')}))
          PYCODE
      - name: Restore pinned native CAD runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libfuse2 tcl8.6
          curl --fail --location --retry 4 https://github.com/librelane/librelane/releases/download/3.0.5/librelane-devshell-x86_64.AppImage -o "$RUNNER_TEMP/librelane.AppImage"
          echo "d6a349ec65be11456e96c4981d35f63ca34d3c85daf79a51e1ccb907bb5d7466  $RUNNER_TEMP/librelane.AppImage" | sha256sum --check
          chmod +x "$RUNNER_TEMP/librelane.AppImage"
          echo "CLOUD_APPIMAGE=$RUNNER_TEMP/librelane.AppImage" >> "$GITHUB_ENV"
      - name: Assemble actual31macro v5 tree and verify native1674device DRC LVS faults
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/cloud_tx_v5_minimax_assembly.py
      - name: Preserve physical results and failures
        if: always()
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          root=hw/soc/out/cloud-tx-v5-minimax-assembly
          mkdir -p "$root"
          if [ ! -f "$root/result.json" ]; then
            printf '%s\n' '{"status":"FAIL_MISSING_REPORT","accepted":false}' > "$root/result.json"
          fi
          stem="tx-v5-minimax-assembly-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          cp "$root/result.json" "$stem.summary.json"
          python3 scripts/cloud_chunked_results.py --directory "$root" --stem "$stem"
          python3 - "$stem" <<'PYCODE'
          import json,subprocess,sys
          stem=sys.argv[1];manifest=stem+'.parts.json';m=json.load(open(manifest))
          subprocess.run([sys.executable,'scripts/publish_cloud_results.py','--group','tx-v5-minimax-assembly',stem+'.summary.json',manifest,*[p['name']for p in m['parts']]],check=True)
          PYCODE
      - name: Retain evidence after publication failure
        if: always() && steps.publish.outcome == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tx-v5-minimax-assembly-${{ github.run_id }}
          path: hw/soc/out/cloud-tx-v5-minimax-assembly/
          retention-days: 30

