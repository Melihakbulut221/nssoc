name: fixed-wire-control-cloud
# Update route encoding without reconnecting any existing terminals; retain exact DEF and shape equality.
on:
  push:
    branches: [codex/complete-open-work]
    paths: [.github/workflows/fixed-wire-control-cloud.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: fixed-wire-control-${{ github.ref }}
  cancel-in-progress: false
jobs:
  native-fixed-route-control:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Restore exact native runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libfuse2
          curl --fail --location --retry 4 https://github.com/librelane/librelane/releases/download/3.0.5/librelane-devshell-x86_64.AppImage -o "$RUNNER_TEMP/librelane.AppImage"
          echo "d6a349ec65be11456e96c4981d35f63ca34d3c85daf79a51e1ccb907bb5d7466  $RUNNER_TEMP/librelane.AppImage" | sha256sum --check
          chmod +x "$RUNNER_TEMP/librelane.AppImage"
          echo "CLOUD_APPIMAGE=$RUNNER_TEMP/librelane.AppImage" >> "$GITHUB_ENV"
      - name: Compile controllers and reject corrupted route conversions
        run: |
          python3 -m py_compile scripts/run_cloud_fixed_wire_control.py scripts/snapshot_cloud_fixed_wires.py
          python3 scripts/run_cloud_fixed_wire_control.py --controls-only
      - name: Verify encoded fixed routes and exact unchanged native geometry
        timeout-minutes: 240
        run: python3 scripts/run_cloud_fixed_wire_control.py
      - name: Preserve source and all native geometry observations
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p cloud-fixed-wire-control
          if [ ! -f cloud-fixed-wire-control/result.json ]; then
            printf '%s\n' '{"status":"FAIL_MISSING_REPORT","accepted":false}' > cloud-fixed-wire-control/result.json
          fi
          stem="fixed-wire-control-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          cp cloud-fixed-wire-control/result.json "$stem.summary.json"
          python3 scripts/cloud_chunked_results.py --directory cloud-fixed-wire-control --stem "$stem"
          python3 - "$stem" <<'PYCODE'
          import json,subprocess,sys
          stem=sys.argv[1];manifest=stem+'.parts.json';m=json.load(open(manifest))
          subprocess.run([sys.executable,'scripts/publish_cloud_results.py','--group','fixed-wire-control',stem+'.summary.json',manifest,*[p['name']for p in m['parts']]],check=True)
          PYCODE
