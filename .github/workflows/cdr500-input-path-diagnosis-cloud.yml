# SPDX-License-Identifier: Apache-2.0
name: cdr500-input-path-diagnosis-cloud
on:
  push:
    branches: [codex/cdr500-floating-wire-diagnosis]
    paths: [.github/workflows/cdr500-input-path-diagnosis-cloud.yml, scripts/cloud_cdr500_input_path_diagnosis.py, scripts/cdr500_input_path_geometry.py, scripts/cdr500-input-path-diagnosis-methods.json]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cdr500-existing-input-path-${{ github.ref }}
  cancel-in-progress: false
jobs:
  existing-rc-and-geometry:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify source and prepare native geometry reader
        run: |
          python3 -m pip install numpy==2.3.3 scipy==1.16.2
          python3 -m py_compile scripts/cloud_cdr500_input_path_diagnosis.py scripts/cdr500_input_path_geometry.py
          PYTHONPATH=scripts python3 -c 'from cloud_cdr500_input_path_diagnosis import check; check()'
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libfuse2
          curl --fail --location --retry 4 https://github.com/librelane/librelane/releases/download/3.0.5/librelane-devshell-x86_64.AppImage -o "$RUNNER_TEMP/librelane.AppImage"
          echo "d6a349ec65be11456e96c4981d35f63ca34d3c85daf79a51e1ccb907bb5d7466  $RUNNER_TEMP/librelane.AppImage" | sha256sum --check
          chmod +x "$RUNNER_TEMP/librelane.AppImage"
          echo "CLOUD_APPIMAGE=$RUNNER_TEMP/librelane.AppImage" >> "$GITHUB_ENV"
      - name: Read existing complete native R graph and actual owned geometry paths
        id: diagnosis
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/cloud_cdr500_input_path_diagnosis.py
      - name: Preserve diagnosis failures
        if: always() && steps.diagnosis.outcome == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cdr500-input-path-${{ github.run_id }}
          path: cloud-cdr500-input-path-diagnosis/
          retention-days: 30
