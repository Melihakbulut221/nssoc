# SPDX-License-Identifier: Apache-2.0
name: cdr500-loaded-rejection-readback-cloud
on:
  push:
    branches: [codex/cdr500-floating-wire-diagnosis]
    paths: [.github/workflows/cdr500-loaded-rejection-readback-cloud.yml, scripts/cloud_cdr500_loaded_rejection_readback.py, scripts/cdr500-loaded-rejection-readback-methods.json]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cdr500-existing-loaded-readback-${{ github.ref }}
  cancel-in-progress: false
jobs:
  readback:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        case: [nominal_early, nominal_late]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify readback source without installing a simulator
        run: |
          python3 -m pip install numpy==2.3.3
          python3 -m py_compile scripts/cloud_cdr500_loaded_rejection_readback.py
          PYTHONPATH=scripts python3 -c 'from cloud_cdr500_loaded_rejection_readback import check; check()'
      - name: Verify all published native bytes and reproduce original rejection before diagnosis
        id: readback
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/cloud_cdr500_loaded_rejection_readback.py --case ${{ matrix.case }}
      - name: Preserve readback failure evidence
        if: always() && steps.readback.outcome == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cdr500-readback-${{ matrix.case }}-${{ github.run_id }}
          path: cloud-cdr500-loaded-readback-${{ matrix.case }}/
          retention-days: 30
