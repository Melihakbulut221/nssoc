name: mainchip-repair-deep-triage-cloud
on:
  push:
    branches: [codex/complete-open-work]
    paths: [.github/workflows/mainchip-repair-deep-triage-cloud.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mainchip-repair-deep-triage-${{ github.ref }}
  cancel-in-progress: false
jobs:
  exact-native-report-diagnosis:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Prepare exact native report reader
        run: |
          python3 -m py_compile scripts/cloud_mainchip_repair_deep_triage.py
          python3 - <<'PYCODE'
          import hashlib,json
          from pathlib import Path
          d=json.loads(Path('scripts/mainchip-repair-deep-triage-source-delta.json').read_text())
          before=Path(d['baseline_path']).read_bytes()
          assert hashlib.sha256(before).hexdigest()==d['baseline_sha256']
          s=before.decode()
          for e in d['edits']:
              assert s.count(e['before'])==e['count']
              s=s.replace(e['before'],e['after'])
          after=Path(d['candidate_path']).read_bytes()
          assert after==s.encode() and hashlib.sha256(after).hexdigest()==d['candidate_sha256']
          assert hashlib.sha256(Path('scripts/map_mainchip_candidate_timing.py').read_bytes()).hexdigest()==d['mapping_helper_sha256']
          print('Exact source-bound native report adaptation verified')
          PYCODE
          python3 -m pip install networkx==3.4.2
      - name: Read exact candidate placement timing reports without changing route or clocks
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/cloud_mainchip_repair_deep_triage.py
      - name: Publish physical success or failure evidence
        if: always()
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p hw/soc/out/cloud-mainchip-repair-deep-triage
          if [ ! -f hw/soc/out/cloud-mainchip-repair-deep-triage/result.json ]; then
            printf '%s\n' '{"status":"FAIL_MISSING_REPORT","accepted":false}' > hw/soc/out/cloud-mainchip-repair-deep-triage/result.json
          fi
          stem="mainchip-repair-deep-triage-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          cp hw/soc/out/cloud-mainchip-repair-deep-triage/result.json "$stem.summary.json"
          python3 scripts/cloud_chunked_results.py --directory hw/soc/out/cloud-mainchip-repair-deep-triage --stem "$stem"
          python3 - "$stem" <<'PYCODE'
          import json,subprocess,sys
          stem=sys.argv[1];manifest=stem+'.parts.json';m=json.load(open(manifest))
          subprocess.run([sys.executable,'scripts/publish_cloud_results.py','--group','mainchip-repair-deep-triage',stem+'.summary.json',manifest,*[p['name']for p in m['parts']]],check=True)
          PYCODE
      - name: Retain evidence after publication failure
        if: always() && steps.publish.outcome == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mainchip-repair-deep-triage-${{ github.run_id }}
          retention-days: 30
          path: hw/soc/out/cloud-mainchip-repair-deep-triage/

