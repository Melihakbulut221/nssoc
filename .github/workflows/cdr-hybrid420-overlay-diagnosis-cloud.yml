name: cdr-hybrid420-overlay-diagnosis-cloud
on:
  push:
    branches: [codex/complete-open-work]
    paths: [.github/workflows/cdr-hybrid420-overlay-diagnosis-cloud.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cdr-hybrid420-overlay-diagnosis-${{ github.ref }}
  cancel-in-progress: false
jobs:
  native-marker-readback:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Restore exact failed marker report and actual supply geometry metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/cloud_cdr_hybrid420_overlay_diagnosis.py
      - name: Preserve exact diagnostic report
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          root=cloud-cdr-hybrid420-overlay-diagnosis
          mkdir -p "$root"
          if [ ! -f "$root/result.json" ]; then
            printf '%s\n' '{"status":"FAIL_MISSING_REPORT","accepted":false}' > "$root/result.json"
          fi
          stem="cdr-hybrid420-overlay-diagnosis-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          cp "$root/result.json" "$stem.summary.json"
          python3 scripts/cloud_chunked_results.py --directory "$root" --stem "$stem"
          python3 - "$stem" <<'PYCODE'
          import json,subprocess,sys
          stem=sys.argv[1];manifest=stem+'.parts.json';m=json.load(open(manifest))
          subprocess.run([sys.executable,'scripts/publish_cloud_results.py','--group','cdr-hybrid420-overlay-diagnosis',stem+'.summary.json',manifest,*[p['name']for p in m['parts']]],check=True)
          PYCODE
