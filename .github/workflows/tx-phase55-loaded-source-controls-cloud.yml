# SPDX-License-Identifier: Apache-2.0
name: tx-phase55-loaded-source-controls-cloud
on:
  push:
    branches: [codex/tx-clock-phase-parent]
    paths:
      - scripts/tx_phase55_loaded_contract.py
      - scripts/check_tx_phase55_loaded_contract.py
      - scripts/tx-phase55-loaded-source-methods.json
      - hw/soc/analog/pcie/clock_div2_reset_feedback_candidate_v1.spice
      - .github/workflows/tx-phase55-loaded-source-controls-cloud.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tx-phase55-loaded-source-controls-${{ github.ref }}
  cancel-in-progress: false
jobs:
  source-controls:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Check source contracts; no native electrical run
        run: |
          python3 -m pip install numpy==2.1.3
          python3 -m py_compile scripts/tx_phase55_loaded_contract.py scripts/check_tx_phase55_loaded_contract.py
          python3 scripts/check_tx_phase55_loaded_contract.py | tee phase55-source-controls.json
      - name: Preserve source-control receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: phase55-source-controls-${{ github.run_id }}
          path: phase55-source-controls.json
          retention-days: 30
