name: pcie-hbt-geometry-source-cloud
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pcie-hbt-geometry-source-${{ github.ref }}
  cancel-in-progress: false
jobs:
  frozen-native-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Inspect exact frozen PDK and current final-stage source
        run: python3 scripts/audit_cloud_hbt_geometry.py
      - name: Preserve source inspection separately from physical acceptance
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/publish_cloud_results.py --group hbt-geometry-source hbt-geometry-source-summary.json
