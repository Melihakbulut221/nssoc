name: cdr-mim-parent-audit-v2-cloud
on:
  push:
    branches: [codex/complete-open-work]
    paths: [.github/workflows/cdr-mim-parent-audit-v2-cloud.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cdr-mim-parent-audit-v2-${{ github.ref }}
  cancel-in-progress: false
jobs:
  native-planes:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Compile native reference-plane binding in the cloud
        run: python3 -m py_compile scripts/cloud_cdr_mim_parent_audit_v2.py
      - name: Install pinned audit graph dependency
        run: python3 -m pip install networkx==3.4.2
      - name: Audit actual MIM source and replacement devices plus native wire RC and22corruptions
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/cloud_cdr_mim_parent_audit_v2.py
      - name: Preserve physical results and failures
        if: always()
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          root=hw/soc/out/cloud-cdr-mim-parent-audit-v2
          mkdir -p "$root"
          if [ ! -f "$root/result.json" ]; then
            printf '%s\n' '{"status":"FAIL_MISSING_REPORT","accepted":false}' > "$root/result.json"
          fi
          stem="cdr-mim-parent-audit-v2-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          cp "$root/result.json" "$stem.summary.json"
          python3 scripts/cloud_chunked_results.py --directory "$root" --stem "$stem"
          python3 - "$stem" <<'PYCODE'
          import json,subprocess,sys
          stem=sys.argv[1];manifest=stem+'.parts.json';m=json.load(open(manifest))
          subprocess.run([sys.executable,'scripts/publish_cloud_results.py','--group','cdr-mim-parent-audit-v2',stem+'.summary.json',manifest,*[p['name']for p in m['parts']]],check=True)
          PYCODE
      - name: Retain evidence after publication failure
        if: always() && steps.publish.outcome == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cdr-mim-parent-audit-v2-${{ github.run_id }}
          path: hw/soc/out/cloud-cdr-mim-parent-audit-v2/
          retention-days: 30
