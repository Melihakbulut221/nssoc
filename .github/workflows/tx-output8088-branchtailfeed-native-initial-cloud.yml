# Registry bootstrap only; no checkout, native controller, artifact or capsule.
name: tx-output8088-branchtailfeed-native-initial-cloud
on:
  push:
    branches: [codex/tx-branchtailfeed-native-registration]
    paths: [.github/workflows/tx-output8088-branchtailfeed-native-initial-cloud.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tx-branchtailfeed-register-initial
  cancel-in-progress: false
jobs:
  register-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Register workflow filename without native execution
        run: printf '%s\n' 'Registration only. No checkout, native simulation, model or process capsule.'
