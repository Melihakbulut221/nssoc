name: protected-contact-eco-cloud
on:
  push:
    branches: [codex/complete-open-work]
    paths: [.github/workflows/protected-contact-eco-cloud.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: protected-contact-eco-${{ github.ref }}
  cancel-in-progress: false
jobs:
  protected-load-batch-physical-eco:
    runs-on: ubuntu-22.04
    env:
      NSSOC_CRITICAL_LOAD_PROFILE: protected_load_batch
      NSSOC_RELEASE_CONTACT_NETS: "1"
    timeout-minutes: 360
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify source-bound50target recipe and all legacy profile contracts
        run: |
          python3 - <<'PYCODE'
          import importlib.util,os
          for profile,count,directory in [('two_buffer',2,'cloud-critical-load-eco'),('control_three_buffer',3,'cloud-control-load-eco'),('measured_load_batch',50,'cloud-measured-load-eco'),('protected_load_batch',50,'cloud-protected-load-eco')]:
              os.environ['NSSOC_CRITICAL_LOAD_PROFILE']=profile
              spec=importlib.util.spec_from_file_location('targets','scripts/critical_load_targets.py');m=importlib.util.module_from_spec(spec);spec.loader.exec_module(m)
              assert m.COUNT==count and m.DIRECTORY==directory and len({r[0] for r in m.TARGETS})==count
              print(profile,count,m.SELECTION)
          PYCODE
      - name: Restore exact native runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libfuse2
          curl --fail --location --retry 4 https://github.com/librelane/librelane/releases/download/3.0.5/librelane-devshell-x86_64.AppImage -o "$RUNNER_TEMP/librelane.AppImage"
          echo "d6a349ec65be11456e96c4981d35f63ca34d3c85daf79a51e1ccb907bb5d7466  $RUNNER_TEMP/librelane.AppImage" | sha256sum --check
          chmod +x "$RUNNER_TEMP/librelane.AppImage"
          echo "CLOUD_APPIMAGE=$RUNNER_TEMP/librelane.AppImage" >> "$GITHUB_ENV"
      - name: Compile exact source-bound buffer repair controllers
        run: |
          python3 -m py_compile scripts/critical_load_targets.py scripts/prepare_cloud_protected_load_eco.py scripts/run_cloud_protected_load_eco.py scripts/cloud_verified_alias_payload.py
          python3 scripts/cloud_verified_alias_payload.py
          python3 scripts/cloud_contact_release.py
      - name: Release eight measured intersecting nets, reroute108nets and recheck all original timing corners
        timeout-minutes: 330
        run: python3 scripts/run_cloud_protected_load_eco.py
      - name: Preserve exact sources, extracted RC and native timing observations
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p cloud-protected-load-eco
          if [ ! -f cloud-protected-load-eco/result.json ]; then
            printf '%s\n' '{"status":"FAIL_MISSING_REPORT","accepted":false}' > cloud-protected-load-eco/result.json
          fi
          stem="protected-load-eco-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          cp cloud-protected-load-eco/result.json "$stem.summary.json"
          python3 scripts/cloud_chunked_results.py --directory cloud-protected-load-eco --stem "$stem"
          python3 - "$stem" <<'PYCODE'
          import json,subprocess,sys
          stem=sys.argv[1];manifest=stem+'.parts.json';m=json.load(open(manifest))
          subprocess.run([sys.executable,'scripts/publish_cloud_results.py','--group','protected-load-eco',stem+'.summary.json',manifest,*[p['name']for p in m['parts']]],check=True)
          PYCODE
      - name: Require the physical experiment report after preserving evidence
        if: always()
        run: |
          python3 - <<'PYCODE'
          import json, os
          from pathlib import Path
          p = Path('cloud-protected-load-eco/result.json')
          assert p.is_file(), 'Physical experiment report missing'
          result = json.loads(p.read_text())
          assert result.get('source_head') == os.environ['GITHUB_SHA'], 'Wrong source revision'
          assert result.get('status') == 'COMPLETE_PROTECTED_LOAD_BATCH_ROUTED_NOMINAL_TIMING_EXPERIMENT_NOT_SIGNOFF', result.get('status')
          assert result.get('profile') == 'protected_load_batch' and result.get('buffer_count') == 50
          assert result.get('protected_source_unchanged') is True
          assert result.get('native_drt_drvs') == 0
          assert result['protected_route_proof']['status'] == 'PASS_UNCHANGED_NATIVE_FIXED_WIRES_AFTER_DETAILED_ROUTE'
          assert result['protected_route_proof']['protected_wired_nets'] == 113498
          assert result['protected_route_proof']['selected_routed_nets'] == 108
          import sys
          sys.path.insert(0,'scripts')
          from cloud_contact_release import validate_route_proof
          assert validate_route_proof(result['protected_route_proof'],result)
          assert result.get('routed_timing'), 'Actual routed timing missing'
          print('Experiment completed; this is not timing or production acceptance.')
          PYCODE
# Broader search for added cells only after source38821357967 DPL-0036; original cells remain fixed.
