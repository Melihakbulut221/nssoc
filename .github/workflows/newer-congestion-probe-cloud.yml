name: newer-congestion-probe-cloud
on:
  push:
    branches: ['codex/complete-open-work']
    paths:
      - scripts/probe_cloud_newer_congestion.py
      - .github/workflows/newer-congestion-probe-cloud.yml
  workflow_dispatch:
    inputs:
      source_profile:
        description: Exact failed native route to diagnose
        type: choice
        options: [baseline, local_optimize, reserved_m5, local_optimize_buffers]
        default: baseline
permissions:
  contents: read
jobs:
  trace:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Exact native runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libfuse2
          curl --fail --location --retry 4 https://github.com/librelane/librelane/releases/download/3.0.5/librelane-devshell-x86_64.AppImage -o "$RUNNER_TEMP/librelane.AppImage"
          echo "d6a349ec65be11456e96c4981d35f63ca34d3c85daf79a51e1ccb907bb5d7466  $RUNNER_TEMP/librelane.AppImage" | sha256sum --check
          chmod +x "$RUNNER_TEMP/librelane.AppImage"
          echo "CLOUD_APPIMAGE=$RUNNER_TEMP/librelane.AppImage" >> "$GITHUB_ENV"
      - name: Resolve every marker and reported signal to native geometry
        run: python3 scripts/probe_cloud_newer_congestion.py --source-profile '${{ inputs.source_profile || 'baseline' }}'
      - name: Check all eight orientations independently of native placed-bbox checks
        run: |
          python3 -m pip install pytest==8.4.2
          python3 -m pytest -q sw/tests/test_cloud_pin_geometry.py
      - name: Preserve diagnosis and complete failure inputs
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          archive='newer-congestion-probe-${{ github.run_id }}-${{ github.run_attempt }}.tar.gz'
          tar -czf "$archive" cloud-congestion-probe
          sha256sum "$archive" > "$archive.sha256"
          if [ -f cloud-congestion-probe/diagnosis.json ]; then
            cp cloud-congestion-probe/diagnosis.json "${archive%.tar.gz}.json"
          else
            cp cloud-congestion-probe/result.json "${archive%.tar.gz}.json"
          fi
          python3 scripts/publish_cloud_results.py --group 'congestion-${{ inputs.source_profile || 'baseline' }}' "$archive" "$archive.sha256" "${archive%.tar.gz}.json"
