name: Current width original loaded electrical matrix
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Source controls, preparation, or original ten loaded cases
        type: choice
        required: true
        default: controls
        options: [controls, preparation, loaded]
permissions:
  contents: read
  actions: read
concurrency:
  group: current-width-loaded-matrix-${{ github.ref }}
  cancel-in-progress: false
env:
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  source-controls:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Original exact source import dependencies
        run: python3 -m pip install numpy==2.3.3 networkx==3.4.2
      - name: Bind exact source and explicit mode authority
        id: binding
        env:
          REQUESTED_MODE: ${{ inputs.mode }}
        run: |
          python3 -B - <<'PY'
          import hashlib,json,os,subprocess,sys
          from pathlib import Path
          sys.path.insert(0,'scripts')
          import cdr_width_loaded_execution_admission as a
          c=a.context();m=a.methods();a.worker_proof()
          assert subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()==c['source']
          assert sys.version_info[:2]==(3,12)
          assert m['source_controls_authorized'] is True
          assert all(m[k] is False for k in a.ALWAYS_FALSE)
          assert a.worker_derivation(Path(a.WORKER).read_bytes())['execution_adapter_installed'] is True
          mode=os.environ['REQUESTED_MODE'];assert mode in ('controls','preparation','loaded')
          if mode!='controls':a.authorize(mode=='preparation')
          out=Path('width-loaded-current-controls');out.mkdir(exist_ok=False)
          a.write(out/'context.json',dict(**c,method_sha256=hashlib.sha256(Path(a.METHOD).read_bytes()).hexdigest(),source_controls_only=True,native_authorized=m['native_execution_authorized'],requested_mode=mode))
          PY
      - name: Actual execution admission and stage source controls
        run: |
          python3 -B scripts/check_cdr_width_loaded_execution.py --output width-loaded-current-controls/execution.json > width-loaded-current-controls/execution.stdout 2> width-loaded-current-controls/execution.stderr
      - name: Actual failure publication and primary error controls
        if: ${{ !cancelled() && steps.binding.outcome == 'success' }}
        run: |
          python3 -B scripts/check_cdr_width_loaded_publication.py --output width-loaded-current-controls/publication.json > width-loaded-current-controls/publication.stdout 2> width-loaded-current-controls/publication.stderr
      - name: Actual isolated current worker import closure
        if: ${{ !cancelled() && steps.binding.outcome == 'success' }}
        run: |
          python3 -B scripts/check_cdr_width_loaded_imports.py --output width-loaded-current-controls/imports.json > width-loaded-current-controls/imports.stdout 2> width-loaded-current-controls/imports.stderr
      - name: Require all source reports without transferring acceptance
        run: |
          python3 -B - <<'PY'
          import json,os
          from pathlib import Path
          r=json.loads(Path('width-loaded-current-controls/execution.json').read_bytes())
          assert r['status']=='PASS_WIDTH_LOADED_EXECUTION_SOURCE_CONTROLS'
          assert r['current_context']==dict(source=os.environ['GITHUB_SHA'],run_id=int(os.environ['GITHUB_RUN_ID']),attempt=1,source_controls_only=True,native_executed=False)
          assert all(r[k] is False for k in ('native_acquisition_performed','native_restore_qualified','numerical_worker_imported','numerical_worker_executed','simulator_executed','electrical_accepted','full_phy_accepted'))
          p=json.loads(Path('width-loaded-current-controls/publication.json').read_bytes())
          assert p['status']=='PASS_WIDTH_LOADED_FAILURE_PUBLICATION_SOURCE_CONTROLS'
          assert (p['publication_cases'],p['actual_lifecycle_cases'])==(15,2)
          assert p['current_context']==r['current_context']
          assert all(p[k] is False for k in ('real_native_archive_restored','native_worker_executed','simulator_executed','electrical_accepted','physical_accepted','full_phy_accepted'))
          i=json.loads(Path('width-loaded-current-controls/imports.json').read_bytes())
          assert i['status']=='PASS_WIDTH_LOADED_ACTUAL_IMPORT_SOURCE_CONTROLS'
          assert (i['positive'],i['refusal'],i['initial_modules'],i['initial_data'],i['copied_files'])==(2,6,52,3,55)
          assert i['current_context']==r['current_context']
          assert i['worker_sha256']=='ebf92a9842280587a437de161425f49f6ce4a82c9d76a0ce2532075d0e309bf5'
          assert all(i[k] is False for k in ('native_executed','native_functions_called','native_acquisition_performed','simulator_executed','electrical_accepted','physical_accepted','full_phy_accepted'))
          PY
      - name: Always emit complete source control records
        if: always()
        run: |
          python3 -B - <<'PY'
          import base64,hashlib,json
          from pathlib import Path
          root=Path('width-loaded-current-controls')
          for n in ('context.json','execution.json','execution.stdout','execution.stderr','publication.json','publication.stdout','publication.stderr','imports.json','imports.stdout','imports.stderr'):
              p=root/n;present=p.is_file() and not p.is_symlink();raw=p.read_bytes() if present else b''
              chunks=[raw[i:i+6000] for i in range(0,len(raw),6000)]
              print('WIDTH_CURRENT_LOADED_INDEX '+json.dumps(dict(path=n,present=present,bytes=len(raw),sha256=hashlib.sha256(raw).hexdigest(),chunks=len(chunks)),sort_keys=True))
              for i,b in enumerate(chunks):
                  print('WIDTH_CURRENT_LOADED_CHUNK '+json.dumps(dict(path=n,index=i,base64=base64.b64encode(b).decode()),sort_keys=True))
          PY
      - name: Preserve all source control bytes
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: width-loaded-current-controls-${{ github.run_id }}-${{ github.run_attempt }}
          path: width-loaded-current-controls
          if-no-files-found: error
          retention-days: 90
  preserve-job-log:
    needs: source-controls
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Preserve full actual source job log and metadata
        run: |
          python3 -B - <<'PY'
          import hashlib,json,os,subprocess
          from pathlib import Path
          root=Path('job-logs');root.mkdir()
          e=os.environ
          assert e['GITHUB_REPOSITORY']=='Melihakbulut221/nssoc' and e['GITHUB_RUN_ATTEMPT']=='1'
          prefix='repos/'+e['GITHUB_REPOSITORY']+'/'
          def read(path,name):
              b=subprocess.check_output(['gh','api',prefix+path]);(root/name).write_bytes(b);return json.loads(b)
          run=read('actions/runs/'+e['GITHUB_RUN_ID'],'run.json')
          assert run['head_sha']==e['GITHUB_SHA'] and run['run_attempt']==1
          jobs=read('actions/runs/'+e['GITHUB_RUN_ID']+'/attempts/1/jobs?per_page=100','jobs.json')
          selected=[j for j in jobs['jobs'] if j['name']=='source-controls'];assert len(selected)==1
          j=selected[0];assert j['status']=='completed' and j['head_sha']==e['GITHUB_SHA']
          read('actions/jobs/'+str(j['id']),'job.json')
          b=subprocess.check_output(['gh','api','--allow-escape-sequences',prefix+'actions/jobs/'+str(j['id'])+'/logs'])
          assert b;(root/'job.log').write_bytes(b)
          receipt=dict(source=e['GITHUB_SHA'],run_id=int(e['GITHUB_RUN_ID']),attempt=1,
            job_id=j['id'],job_conclusion=j['conclusion'],full_raw_job_log=True,
            log_bytes=len(b),log_sha256=hashlib.sha256(b).hexdigest(),native_acquisition=False)
          (root/'receipt.json').write_text(json.dumps(receipt,sort_keys=True,indent=2)+'\n')
          print(json.dumps(receipt,sort_keys=True))
          PY
      - name: Preserve complete actual logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: width-loaded-current-job-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: job-logs
          if-no-files-found: error
          retention-days: 90

  prepare:
    needs: [source-controls, preserve-job-log]
    if: ${{ inputs.mode != 'controls' }}
    permissions:
      contents: write
      actions: read
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    env:
      GH_TOKEN: ${{ github.token }}
      LOADED_CASE: nominal_early
      PREPARE_ONLY: 'true'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Require all eleven exact-source reservations before native dependencies
        run: python3 -B scripts/cloud_cdr_width_loaded_stage.py --case "$LOADED_CASE" --prepare-only --preflight
      - name: Original loaded simulator dependencies
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends tcl8.6 libsndfile1 libsamplerate0 libreadline8t64 libxaw7 libxt6 libxft2 libfontconfig1
          python3 -m pip install numpy==2.3.3 networkx==3.4.2
      - name: Original complete loaded binding without transient
        id: native
        run: python3 -B scripts/cloud_cdr_width_loaded_stage.py --case "$LOADED_CASE" --prepare-only
      - name: Preserve raw failure evidence when publication has not started
        if: always()
        run: |
          python3 -B - <<'PY'
          import os,subprocess,sys
          from pathlib import Path
          prepare=os.environ['PREPARE_ONLY']=='true';case=os.environ['LOADED_CASE']
          assert case in ('nominal_early','nominal_late','hot_early','hot_late','cold_early','cold_late','constant_zero','constant_one','clock_stopped','vi_bias_off')
          assert not prepare or case=='nominal_early'
          suffix='preparation' if prepare else case
          transport=Path('hw/soc/out')/('cloud-cdr-width-loaded-'+suffix+'-publication')
          assert not transport.is_symlink()
          if transport.exists():
              assert transport.is_dir()
              print('Existing publication transport retained; no publication retry or overwrite.')
          else:
              argv=[sys.executable,'-B','scripts/cloud_cdr_width_loaded_stage.py','--case',case,'--publish-only']
              if prepare:argv.append('--prepare-only')
              subprocess.run(argv,check=True)
          PY
      - name: Always emit exact terminal and publication metadata
        if: always()
        run: |
          python3 -B - <<'PY'
          import base64,hashlib,json,os
          from pathlib import Path
          prepare=os.environ['PREPARE_ONLY']=='true';case=os.environ['LOADED_CASE']
          suffix='preparation' if prepare else case
          out=Path('cloud-cdr-width-loaded-evidence-'+suffix)
          transport=Path('hw/soc/out')/('cloud-cdr-width-loaded-'+suffix+'-publication')
          stem='cdr-width-loaded-'+suffix+'-'+os.environ['GITHUB_RUN_ID']+'-1'
          paths=[out/'result.json',out/'publication-source-check.json',out/'direct-publication-plan.json',
            transport/'publication.json',transport/(stem+'.summary.json'),transport/(stem+'.parts.json')]
          for p in paths:
              assert not p.is_symlink()
              present=p.is_file();raw=p.read_bytes() if present else b''
              chunks=[raw[i:i+6000]for i in range(0,len(raw),6000)]
              print('WIDTH_CURRENT_NATIVE_INDEX '+json.dumps(dict(path=str(p),present=present,bytes=len(raw),sha256=hashlib.sha256(raw).hexdigest(),chunks=len(chunks)),sort_keys=True))
              for i,b in enumerate(chunks):
                  print('WIDTH_CURRENT_NATIVE_CHUNK '+json.dumps(dict(path=str(p),index=i,base64=base64.b64encode(b).decode()),sort_keys=True))
          PY
      - name: Preserve complete worker output and partial publication
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: current-width-loaded-preparation-full-${{ github.run_id }}-${{ github.run_attempt }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
          compression-level: 1
          path: |
            cloud-cdr-width-loaded-evidence-preparation
            cloud-cdr-width-loaded-nominal_early
            hw/soc/out/cloud-cdr-width-loaded-preparation-publication

  loaded:
    needs: [source-controls, prepare]
    if: ${{ inputs.mode == 'loaded' }}
    permissions:
      contents: write
      actions: read
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        case: [nominal_early, nominal_late, hot_early, hot_late, cold_early, cold_late, constant_zero, constant_one, clock_stopped, vi_bias_off]
    env:
      GH_TOKEN: ${{ github.token }}
      LOADED_CASE: ${{ matrix.case }}
      PREPARE_ONLY: 'false'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Require all eleven exact-source reservations before native dependencies
        run: python3 -B scripts/cloud_cdr_width_loaded_stage.py --case "$LOADED_CASE"  --preflight
      - name: Original loaded simulator dependencies
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends tcl8.6 libsndfile1 libsamplerate0 libreadline8t64 libxaw7 libxt6 libxft2 libfontconfig1
          python3 -m pip install numpy==2.3.3 networkx==3.4.2
      - name: Original OFF operating point and full loaded transient
        id: native
        run: python3 -B scripts/cloud_cdr_width_loaded_stage.py --case "$LOADED_CASE" 
      - name: Preserve raw failure evidence when publication has not started
        if: always()
        run: |
          python3 -B - <<'PY'
          import os,subprocess,sys
          from pathlib import Path
          prepare=os.environ['PREPARE_ONLY']=='true';case=os.environ['LOADED_CASE']
          assert case in ('nominal_early','nominal_late','hot_early','hot_late','cold_early','cold_late','constant_zero','constant_one','clock_stopped','vi_bias_off')
          assert not prepare or case=='nominal_early'
          suffix='preparation' if prepare else case
          transport=Path('hw/soc/out')/('cloud-cdr-width-loaded-'+suffix+'-publication')
          assert not transport.is_symlink()
          if transport.exists():
              assert transport.is_dir()
              print('Existing publication transport retained; no publication retry or overwrite.')
          else:
              argv=[sys.executable,'-B','scripts/cloud_cdr_width_loaded_stage.py','--case',case,'--publish-only']
              if prepare:argv.append('--prepare-only')
              subprocess.run(argv,check=True)
          PY
      - name: Always emit exact terminal and publication metadata
        if: always()
        run: |
          python3 -B - <<'PY'
          import base64,hashlib,json,os
          from pathlib import Path
          prepare=os.environ['PREPARE_ONLY']=='true';case=os.environ['LOADED_CASE']
          suffix='preparation' if prepare else case
          out=Path('cloud-cdr-width-loaded-evidence-'+suffix)
          transport=Path('hw/soc/out')/('cloud-cdr-width-loaded-'+suffix+'-publication')
          stem='cdr-width-loaded-'+suffix+'-'+os.environ['GITHUB_RUN_ID']+'-1'
          paths=[out/'result.json',out/'publication-source-check.json',out/'direct-publication-plan.json',
            transport/'publication.json',transport/(stem+'.summary.json'),transport/(stem+'.parts.json')]
          for p in paths:
              assert not p.is_symlink()
              present=p.is_file();raw=p.read_bytes() if present else b''
              chunks=[raw[i:i+6000]for i in range(0,len(raw),6000)]
              print('WIDTH_CURRENT_NATIVE_INDEX '+json.dumps(dict(path=str(p),present=present,bytes=len(raw),sha256=hashlib.sha256(raw).hexdigest(),chunks=len(chunks)),sort_keys=True))
              for i,b in enumerate(chunks):
                  print('WIDTH_CURRENT_NATIVE_CHUNK '+json.dumps(dict(path=str(p),index=i,base64=base64.b64encode(b).decode()),sort_keys=True))
          PY
      - name: Preserve complete worker output and partial publication
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: current-width-loaded-${{ matrix.case }}-full-${{ github.run_id }}-${{ github.run_attempt }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
          compression-level: 1
          path: |
            cloud-cdr-width-loaded-evidence-${{ matrix.case }}
            cloud-cdr-width-loaded-${{ matrix.case }}
            hw/soc/out/cloud-cdr-width-loaded-${{ matrix.case }}-publication
