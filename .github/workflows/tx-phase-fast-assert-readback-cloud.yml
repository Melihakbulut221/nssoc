# SPDX-License-Identifier: Apache-2.0
name: tx-phase-fast-assert-readback-cloud
on:
  push:
    branches: [codex/tx-clock-phase-parent]
    paths:
      - scripts/cloud_tx_phase_fast_assert_readback.py
      - scripts/tx-phase-fast-assert-readback-methods.json
      - .github/workflows/tx-phase-fast-assert-readback-cloud.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
defaults:
  run:
    shell: bash
concurrency:
  group: tx-phase-fast-assert-readback
  cancel-in-progress: false
jobs:
  source-controls:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Reject altered exact244 failure and preserve original raw/archive controls
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -m pip install numpy==2.3.3
          python3 scripts/cloud_tx_phase_fast_assert_readback.py --controls | tee controls.json
          python3 - <<'PYCODE'
          import json
          d=json.load(open('controls.json'))
          assert d['status']=='PASS244_EXACT_REJECTED_READBACK_CONTROLS_NO_SIMULATOR'
          assert len(d['exact_new_summary_faults'])==8 and len(d['prior_transport_and_archive_controls']['negative_controls'])==13
          assert not d['native_execution'] and not d['original244_accepted']
          PYCODE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: phase-fast-assert-readback-controls-${{ github.run_id }}
          path: controls.json
          retention-days: 30
  exact-reset-path-readback:
    if: github.event_name == 'workflow_dispatch'
    needs: source-controls
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Read every original byte and column then inspect fixed reset path
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -m pip install numpy==2.3.3
          python3 scripts/cloud_tx_phase_fast_assert_readback.py --readback
      - name: Publish exact diagnostic JSON and retain the original rejected captures
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PYCODE'
          import json,os,pathlib,subprocess,sys
          root=pathlib.Path('hw/soc/out/cloud-tx-phase-fast-assert-readback');root.mkdir(parents=True,exist_ok=True)
          p=root/'result.json'
          if not p.exists():p.write_text(json.dumps(dict(status='FAIL_MISSING_READBACK',original244_accepted=False,full_PHY_accepted=False))+'\n')
          group='tx-phase-fast-assert-readback';stem=group+'-'+os.environ['GITHUB_RUN_ID']+'-'+os.environ['GITHUB_RUN_ATTEMPT']
          summary=pathlib.Path(stem+'.summary.json');summary.write_bytes(p.read_bytes())
          subprocess.run([sys.executable,'scripts/cloud_chunked_results.py','--directory',str(root),'--stem',stem],check=True)
          parts=pathlib.Path(stem+'.parts.json');d=json.loads(parts.read_text())
          subprocess.run([sys.executable,'scripts/publish_cloud_results.py','--group',group,str(summary),str(parts),*[p['name']for p in d['parts']]],check=True)
          PYCODE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: phase-fast-assert-readback-${{ github.run_id }}
          path: hw/soc/out/cloud-tx-phase-fast-assert-readback/
          retention-days: 30
