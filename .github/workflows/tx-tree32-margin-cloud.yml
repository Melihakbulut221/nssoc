name: tx-tree32-margin-cloud
on:
  push:
    branches: [codex/complete-open-work]
    paths: [.github/workflows/tx-tree32-margin-cloud.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tx-tree32-margin-${{ github.ref }}
  cancel-in-progress: false
jobs:
  controls:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify actual native candidate geometry and unchanged emitter budget
        run: |
          python3 -m pip install numpy==2.3.3
          python3 -m py_compile scripts/cloud_tx_tree32_margin.py
          python3 scripts/cloud_tx_tree32_margin.py --controls
  native-full32:
    needs: controls
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - {variant: budget_drive_v3, fault: none, condition: nominal}
          - {variant: budget_drive_v3, fault: none, condition: hot_low}
          - {variant: budget_drive_v3, fault: none, condition: cold_high}
          - {variant: budget_drive_v3, fault: swap_leaf_select, condition: nominal}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Native simulator dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libsndfile1 libsamplerate0 libreadline8t64 libxaw7 libxt6 libxft2 libfontconfig1
          python3 -m pip install numpy==2.3.3
      - name: Complete native full32 tree and actual deepest-selector fault
        run: |
          python3 -m py_compile scripts/cloud_tx_tree32_margin.py
          python3 scripts/cloud_tx_tree32_margin.py --variant ${{ matrix.variant }} --fault ${{ matrix.fault }} --condition ${{ matrix.condition }}
      - name: Preserve complete native captures and every failure
        if: always()
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          root=cloud-tx-tree32-margin-${{ matrix.variant }}-${{ matrix.fault }}
          if [ "${{ matrix.condition }}" != nominal ]; then root="$root-${{ matrix.condition }}"; fi
          mkdir -p "$root"
          if [ ! -f "$root/result.json" ]; then
            printf '%s\n' '{"status":"FAIL_MISSING_REPORT","accepted":false}' > "$root/result.json"
          fi
          stem="tx-tree32-margin-${{ matrix.condition }}-${{ matrix.fault }}-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          cp "$root/result.json" "$stem.summary.json"
          python3 scripts/cloud_chunked_results.py --directory "$root" --stem "$stem"
          python3 - "$stem" <<'PYCODE'
          import json,subprocess,sys
          stem=sys.argv[1];manifest=stem+'.parts.json';m=json.load(open(manifest))
          subprocess.run([sys.executable,'scripts/publish_cloud_results.py','--group','tx-tree32-margin-${{ matrix.condition }}-${{ matrix.fault }}',stem+'.summary.json',manifest,*[p['name']for p in m['parts']]],check=True)
          PYCODE
      - name: Retain evidence after publication failure
        if: always() && steps.publish.outcome == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tx-tree32-margin-${{ matrix.condition }}-${{ matrix.fault }}-${{ github.run_id }}
          path: cloud-tx-tree32-margin-${{ matrix.variant }}-${{ matrix.fault }}*/
          retention-days: 30
