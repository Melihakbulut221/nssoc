# SPDX-License-Identifier: Apache-2.0
name: onehot-critical-data-path-review-cloud
on:
  push:
    branches: [codex/complete-open-work]
    paths: [.github/workflows/onehot-critical-data-path-review-cloud.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: onehot-critical-data-path-review
  cancel-in-progress: false
jobs:
  native-reports:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Read immutable routed native timing reports and preserve original regressions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -m py_compile scripts/cloud_onehot_critical_data_path_review.py
          python3 - <<'PYCODE'
          import hashlib,json
          from pathlib import Path
          d=json.loads(Path('scripts/onehot-critical-data-path-review-source-delta.json').read_text())
          raw=Path(d['baseline_path']).read_bytes()
          assert hashlib.sha256(raw).hexdigest()==d['baseline_sha256']
          s=raw.decode()
          for e in d['edits']:
              assert s.count(e['before'])==e['count'];s=s.replace(e['before'],e['after'])
          actual=Path(d['candidate_path']).read_bytes()
          assert actual==s.encode() and hashlib.sha256(actual).hexdigest()==d['candidate_sha256']
          print('PASS_SAME_NATIVE_REPORT_PARSER_AND_ALL_CORNER_METRICS')
          PYCODE
          python3 scripts/cloud_onehot_critical_data_path_review.py
      - name: Publish complete reports and review failures
        if: always()
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          root=hw/soc/out/cloud-onehot-critical-data-path-review
          mkdir -p "$root"
          if [ ! -f "$root/result.json" ]; then
            printf '%s\n' '{"status":"FAIL_MISSING_REPORT","accepted":false}' > "$root/result.json"
          fi
          stem="onehot-critical-data-path-review-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          cp "$root/result.json" "$stem.summary.json"
          python3 scripts/cloud_chunked_results.py --directory "$root" --stem "$stem"
          python3 - "$stem" <<'PYCODE'
          import json,subprocess,sys
          stem=sys.argv[1];manifest=stem+'.parts.json';m=json.load(open(manifest))
          subprocess.run([sys.executable,'scripts/publish_cloud_results.py','--group','onehot-critical-data-path-review',stem+'.summary.json',manifest,*[p['name']for p in m['parts']]],check=True)
          PYCODE
      - name: Preserve unpublished evidence
        if: always() && steps.publish.outcome == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: onehot-critical-data-path-review-${{ github.run_id }}
          path: hw/soc/out/cloud-onehot-critical-data-path-review/
          retention-days: 30
