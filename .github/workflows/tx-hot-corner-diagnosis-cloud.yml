name: tx-hot-corner-diagnosis-cloud
on:
  push:
    branches: [codex/complete-open-work]
    paths: [.github/workflows/tx-hot-corner-diagnosis-cloud.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tx-hot-corner-diagnosis-${{ github.ref }}
  cancel-in-progress: false
jobs:
  replay-native-capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # Read the completed hot-corner capture; do not start another simulator.
        case: [hot_low]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Independently replay every gate and locate HBT worst samples
        run: |
          python3 -m pip install numpy==2.3.3
          python3 -m py_compile scripts/cloud_tx_hot_corner_diagnosis.py
          python3 scripts/cloud_tx_hot_corner_diagnosis.py --case ${{ matrix.case }}
      - name: Publish derived diagnosis with immutable source handles
        if: always()
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p cloud-tx-hot-corner-diagnosis
          if [ ! -f cloud-tx-hot-corner-diagnosis/result.json ]; then
            printf '%s\n' '{"status":"FAIL_MISSING_REPORT","accepted":false}' > cloud-tx-hot-corner-diagnosis/result.json
          fi
          stem="tx-hot-corner-diagnosis-${{ matrix.case }}-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          cp cloud-tx-hot-corner-diagnosis/result.json "$stem.summary.json"
          python3 scripts/cloud_chunked_results.py --directory cloud-tx-hot-corner-diagnosis --stem "$stem"
          python3 - "$stem" <<'PYCODE'
          import json,subprocess,sys
          stem=sys.argv[1];manifest=stem+'.parts.json';m=json.load(open(manifest))
          subprocess.run([sys.executable,'scripts/publish_cloud_results.py','--group','tx-hot-corner-diagnosis-${{ matrix.case }}',stem+'.summary.json',manifest,*[p['name']for p in m['parts']]],check=True)
          PYCODE
      - name: Retain diagnosis if publication failed
        if: always() && steps.publish.outcome == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tx-hot-corner-diagnosis-${{ matrix.case }}-${{ github.run_id }}
          path: cloud-tx-hot-corner-diagnosis/
          retention-days: 30
      - name: Require full replay and missing-probe rejection
        if: always()
        run: |
          python3 - <<'PYCODE'
          import json,os
          r=json.load(open('cloud-tx-hot-corner-diagnosis/result.json'))
          assert r['source_head']==os.environ['GITHUB_SHA']
          assert r['status']=='COMPLETE_EXACT_CAPTURE_REPLAY_AND_HBT_MINIMA_NOT_PHY_ACCEPTANCE',r.get('error')
          assert r['all_original_engineering_fields_reproduced'] and r['source_unchanged']
          assert r['missing_current_probe_control']=='REJECTED'
          assert not r['accepted'] and not r['physical_change']
          PYCODE
