name: startup-wave-diagnosis-cloud
on:
  push:
    branches: [codex/complete-open-work]
    paths: [.github/workflows/startup-wave-diagnosis-cloud.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: startup-wave-diagnosis-${{ github.ref }}
  cancel-in-progress: false
jobs:
  existing-capture-analysis:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python3 -m pip install numpy==2.3.3 matplotlib==3.10.7
      - name: Read original native captures and locate first divergence
        run: python3 scripts/cloud_startup_wave_diagnosis.py
      - name: Preserve full native inputs, plots and diagnosis
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p cloud-startup-wave-diagnosis
          if [ ! -f cloud-startup-wave-diagnosis/result.json ]; then
            printf '%s\n' '{"status":"FAIL_MISSING_REPORT","accepted":false}' > cloud-startup-wave-diagnosis/result.json
          fi
          archive="startup-wave-diagnosis-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.tar.gz"
          tar -czf "$archive" cloud-startup-wave-diagnosis
          sha256sum "$archive" > "$archive.sha256"
          cp cloud-startup-wave-diagnosis/result.json "${archive%.tar.gz}.summary.json"
          assets=("$archive" "$archive.sha256" "${archive%.tar.gz}.summary.json")
          if [ -f cloud-startup-wave-diagnosis/startup-native-comparison.png ]; then assets+=(cloud-startup-wave-diagnosis/startup-native-comparison.png); fi
          python3 scripts/publish_cloud_results.py --group startup-wave-diagnosis "${assets[@]}"
