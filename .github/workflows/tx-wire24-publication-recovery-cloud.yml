# SPDX-License-Identifier: Apache-2.0
name: tx-wire24-publication-recovery-cloud
on:
  push:
    branches: [codex/complete-open-work]
    paths: [.github/workflows/tx-wire24-publication-recovery-cloud.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: tx-wire24-publication-recovery
  cancel-in-progress: false
jobs:
  recover:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Recover pinned artifact and publish unchanged native results
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -m py_compile scripts/cloud_tx_wire24_publication_recovery.py
          python3 scripts/cloud_tx_wire24_publication_recovery.py
      - name: Retain recovery evidence on publication failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tx-wire24-publication-recovery-${{ github.run_id }}
          path: |
            tx-wire24-publication-recovery.json
            tx-fast-wire24-extraction-39340687625-1.*
            hw/soc/out/cloud-tx-fast-wire24-physical/
          retention-days: 30
