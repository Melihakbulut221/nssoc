name: Current width loaded execution source controls
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: current-width-loaded-execution-controls-${{ github.ref }}
  cancel-in-progress: false
env:
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  source-controls:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Original parser dependency
        run: python3 -m pip install networkx==3.4.2
      - name: Bind exact source and disabled native authority
        id: binding
        run: |
          python3 -B - <<'PY'
          import hashlib,json,os,subprocess,sys
          from pathlib import Path
          sys.path.insert(0,'scripts')
          import cdr_width_loaded_execution_admission as a
          c=a.context();m=a.methods();a.worker_proof()
          assert subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()==c['source']
          assert sys.version_info[:2]==(3,12)
          assert m['source_controls_authorized'] is True
          assert all(m[k] is False for k in a.AUTH if k!='source_controls_authorized')
          assert all(m[k] is False for k in a.ALWAYS_FALSE)
          assert m['controller_readiness'] is False
          assert a.worker_derivation(Path(a.WORKER).read_bytes())['execution_adapter_installed'] is False
          out=Path('width-loaded-execution-controls');out.mkdir(exist_ok=False)
          a.write(out/'context.json',dict(**c,method_sha256=hashlib.sha256(Path(a.METHOD).read_bytes()).hexdigest(),source_controls_only=True,native_authorized=False))
          PY
      - name: Actual execution admission and stage source controls
        run: |
          python3 -B scripts/check_cdr_width_loaded_execution.py --output width-loaded-execution-controls/execution.json > width-loaded-execution-controls/execution.stdout 2> width-loaded-execution-controls/execution.stderr
      - name: Actual failure publication and primary error controls
        if: ${{ !cancelled() && steps.binding.outcome == 'success' }}
        run: |
          python3 -B scripts/check_cdr_width_loaded_publication.py --output width-loaded-execution-controls/publication.json > width-loaded-execution-controls/publication.stdout 2> width-loaded-execution-controls/publication.stderr
      - name: Require both source reports without transferring acceptance
        run: |
          python3 -B - <<'PY'
          import json,os
          from pathlib import Path
          r=json.loads(Path('width-loaded-execution-controls/execution.json').read_bytes())
          assert r['status']=='PASS_WIDTH_LOADED_EXECUTION_SOURCE_CONTROLS'
          assert r['current_context']==dict(source=os.environ['GITHUB_SHA'],run_id=int(os.environ['GITHUB_RUN_ID']),attempt=1,source_controls_only=True,native_executed=False)
          assert all(r[k] is False for k in ('native_acquisition_performed','native_restore_qualified','numerical_worker_imported','numerical_worker_executed','simulator_executed','electrical_accepted','full_phy_accepted'))
          p=json.loads(Path('width-loaded-execution-controls/publication.json').read_bytes())
          assert p['status']=='PASS_WIDTH_LOADED_FAILURE_PUBLICATION_SOURCE_CONTROLS'
          assert (p['publication_cases'],p['actual_lifecycle_cases'])==(15,2)
          assert p['current_context']==r['current_context']
          assert all(p[k] is False for k in ('real_native_archive_restored','native_worker_executed','simulator_executed','electrical_accepted','physical_accepted','full_phy_accepted'))
          PY
      - name: Always emit complete source control records
        if: always()
        run: |
          python3 -B - <<'PY'
          import base64,hashlib,json
          from pathlib import Path
          root=Path('width-loaded-execution-controls')
          for n in ('context.json','execution.json','execution.stdout','execution.stderr','publication.json','publication.stdout','publication.stderr'):
              p=root/n;present=p.is_file() and not p.is_symlink();raw=p.read_bytes() if present else b''
              chunks=[raw[i:i+6000] for i in range(0,len(raw),6000)]
              print('WIDTH_LOADED_EXECUTION_INDEX '+json.dumps(dict(path=n,present=present,bytes=len(raw),sha256=hashlib.sha256(raw).hexdigest(),chunks=len(chunks)),sort_keys=True))
              for i,b in enumerate(chunks):
                  print('WIDTH_LOADED_EXECUTION_CHUNK '+json.dumps(dict(path=n,index=i,base64=base64.b64encode(b).decode()),sort_keys=True))
          PY
      - name: Preserve all source control bytes
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: width-loaded-execution-controls-${{ github.run_id }}-${{ github.run_attempt }}
          path: width-loaded-execution-controls
          if-no-files-found: error
          retention-days: 90
  preserve-job-log:
    needs: source-controls
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Preserve full actual source job log and metadata
        run: |
          python3 -B - <<'PY'
          import hashlib,json,os,subprocess
          from pathlib import Path
          root=Path('job-logs');root.mkdir()
          e=os.environ
          assert e['GITHUB_REPOSITORY']=='Melihakbulut221/nssoc' and e['GITHUB_RUN_ATTEMPT']=='1'
          prefix='repos/'+e['GITHUB_REPOSITORY']+'/'
          def read(path,name):
              b=subprocess.check_output(['gh','api',prefix+path]);(root/name).write_bytes(b);return json.loads(b)
          run=read('actions/runs/'+e['GITHUB_RUN_ID'],'run.json')
          assert run['head_sha']==e['GITHUB_SHA'] and run['run_attempt']==1
          jobs=read('actions/runs/'+e['GITHUB_RUN_ID']+'/attempts/1/jobs?per_page=100','jobs.json')
          selected=[j for j in jobs['jobs'] if j['name']=='source-controls'];assert len(selected)==1
          j=selected[0];assert j['status']=='completed' and j['head_sha']==e['GITHUB_SHA']
          read('actions/jobs/'+str(j['id']),'job.json')
          b=subprocess.check_output(['gh','api','--allow-escape-sequences',prefix+'actions/jobs/'+str(j['id'])+'/logs'])
          assert b;(root/'job.log').write_bytes(b)
          receipt=dict(source=e['GITHUB_SHA'],run_id=int(e['GITHUB_RUN_ID']),attempt=1,
            job_id=j['id'],job_conclusion=j['conclusion'],full_raw_job_log=True,
            log_bytes=len(b),log_sha256=hashlib.sha256(b).hexdigest(),native_acquisition=False)
          (root/'receipt.json').write_text(json.dumps(receipt,sort_keys=True,indent=2)+'\n')
          print(json.dumps(receipt,sort_keys=True))
          PY
      - name: Preserve complete actual logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: width-loaded-execution-job-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: job-logs
          if-no-files-found: error
          retention-days: 90
