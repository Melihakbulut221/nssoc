name: tx-cmos-driver-cloud
on:
  push:
    branches: ['codex/complete-open-work']
    paths:
      - .github/workflows/tx-cmos-driver-cloud.yml
      - scripts/cloud_tx_data_driver.py
      - sw/tests/test_cloud_tx_original_bits.py
      - hw/soc/analog/pcie/tx_cmos_resistive_input_v1.inc
      - hw/soc/analog/pcie/tx_cmos_hv_resistive_input_v2.inc
      - hw/soc/analog/pcie/tx_cmos_hv_resistive_input_v3.inc
      - hw/soc/analog/pcie/tx_cmos_hv_current_input_v4.inc
      - hw/soc/analog/pcie/tx_cmos_hv_resistive_input_v5.inc
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tx-cmos-driver-cloud-${{ github.ref }}
  cancel-in-progress: false
jobs:
  native-transient:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        condition: [nominal, quarter_step, hot_low, cold_high, mos_ss, mos_ff, lv_ss_hv_ff, lv_ff_hv_ss, mos_sf, mos_fs]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Restore exact native simulator with hosted dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libsndfile1 libsamplerate0 libreadline8t64 libxaw7 libxt6 libxft2 libfontconfig1
          python3 -m pip install numpy==2.3.3 pytest==8.4.2
          curl --fail --location --retry 4 'https://deb.debian.org/debian/pool/main/n/ngspice/ngspice_47+ds-1~bpo13+1_amd64.deb' -o "$RUNNER_TEMP/ngspice.deb"
          echo "400d2ebaefc1dcaaaf9693ac4731535d910fa2c0544552736970aa9ebaad760b  $RUNNER_TEMP/ngspice.deb" | sha256sum --check
          dpkg-deb -x "$RUNNER_TEMP/ngspice.deb" "$RUNNER_TEMP/ngspice"
          echo "CLOUD_NGSPICE=$RUNNER_TEMP/ngspice/usr/bin/ngspice" >> "$GITHUB_ENV"
      - name: Reject source-bit corruption and incomplete output captures
        run: python3 -m pytest -q sw/tests/test_cloud_tx_original_bits.py
      - name: Run fixed-oracle native study and independent complete-wave review
        run: python3 scripts/run_cloud_tx_operating_point.py --point clock_small --kind compact --data-driver cmos_hv_fast --data-launch inactive_half_cycle --condition '${{ matrix.condition }}'
      - name: Preserve all successful and failed native captures permanently
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          archive='tx-cmos-driver-fast-corners-${{ matrix.condition }}-${{ github.run_id }}-${{ github.run_attempt }}.tar.gz'
          tar -czf "$archive" cloud-tx-operating-point
          sha256sum "$archive" > "$archive.sha256"
          summary="${archive%.tar.gz}.summary.json"
          cp cloud-tx-operating-point/result.json "$summary"
          gh release upload cloud-migration-20261012-000 "$archive" "$archive.sha256" "$summary"
