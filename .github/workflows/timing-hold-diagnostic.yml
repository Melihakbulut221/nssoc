name: timing-hold-diagnostic
on:
  push:
    paths:
      - .github/workflows/timing-hold-diagnostic.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: timing-hold-diagnostic-${{ github.ref }}
  cancel-in-progress: false
jobs:
  diagnose:
    runs-on: ubuntu-22.04
    timeout-minutes: 360 # Hosted platform ceiling; no native elapsed watchdog.
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      CLOUD_OUTPUT: ${{ github.workspace }}/hold-diagnostic-result
      CLOUD_WORK: ${{ github.workspace }}/hold-diagnostic-input
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install only AppImage runtime prerequisite
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libfuse2
      - name: Start pinned native controls followed by isolated C10 diagnostic
        id: launch
        run: |
          python3 scripts/run_cloud_hold_diagnostic.py start \
            --manifest docs/evidence/timing-cloud-input-20260930.json \
            --output "$CLOUD_OUTPUT" --work "$CLOUD_WORK"
      - name: Observe startup without stopping the worker
        if: always() && steps.launch.outcome == 'success'
        run: python3 scripts/run_cloud_hold_diagnostic.py wait --output "$CLOUD_OUTPUT" --seconds 60
      - name: Preserve startup evidence
        if: always()
        continue-on-error: true
        run: |
          python3 scripts/run_cloud_hold_diagnostic.py capture --output "$CLOUD_OUTPUT" \
            --destination hold-diagnostic-startup
      - name: Upload startup evidence promptly
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: hold-diagnostic-startup-${{ github.run_attempt }}
          path: hold-diagnostic-startup/
          if-no-files-found: error
          compression-level: 1
          retention-days: 30
      - name: Observe first interval without a native timeout
        id: first
        if: always() && steps.launch.outcome == 'success'
        run: |
          python3 scripts/run_cloud_hold_diagnostic.py wait --output "$CLOUD_OUTPUT" \
            --seconds 9000 --github-output "$GITHUB_OUTPUT"
      - name: Capture first immutable progress
        if: always()
        continue-on-error: true
        run: |
          python3 scripts/run_cloud_hold_diagnostic.py capture --output "$CLOUD_OUTPUT" \
            --destination hold-diagnostic-first
      - name: Upload first progress before the platform deadline
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: hold-diagnostic-first-${{ github.run_attempt }}
          path: hold-diagnostic-first/
          if-no-files-found: error
          compression-level: 1
          retention-days: 30
      - name: Observe second interval without a native timeout
        id: second
        if: always() && steps.launch.outcome == 'success' && steps.first.outputs.terminal != 'true'
        run: |
          python3 scripts/run_cloud_hold_diagnostic.py wait --output "$CLOUD_OUTPUT" \
            --seconds 7200 --github-output "$GITHUB_OUTPUT"
      - name: Capture second immutable progress
        if: always() && steps.launch.outcome == 'success' && steps.first.outputs.terminal != 'true'
        continue-on-error: true
        run: |
          python3 scripts/run_cloud_hold_diagnostic.py capture --output "$CLOUD_OUTPUT" \
            --destination hold-diagnostic-second
      - name: Upload second progress before the platform deadline
        if: always() && steps.launch.outcome == 'success' && steps.first.outputs.terminal != 'true'
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: hold-diagnostic-second-${{ github.run_attempt }}
          path: hold-diagnostic-second/
          if-no-files-found: error
          compression-level: 1
          retention-days: 30
      - name: Wait for healthy native work to finish
        if: always() && steps.launch.outcome == 'success' && steps.first.outputs.terminal != 'true' && steps.second.outputs.terminal != 'true'
        run: python3 scripts/run_cloud_hold_diagnostic.py wait --output "$CLOUD_OUTPUT"
      - name: Capture final diagnostic or explicit failure evidence
        if: always()
        run: |
          python3 scripts/run_cloud_hold_diagnostic.py capture --output "$CLOUD_OUTPUT" \
            --destination hold-diagnostic-final
      - name: Preserve outputs even when native controls or chip diagnosis fail
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: hold-diagnostic-final-${{ github.run_attempt }}
          path: hold-diagnostic-final/
          if-no-files-found: error
          compression-level: 1
          retention-days: 30
      - name: Require diagnostic completion without granting timing acceptance
        if: always()
        run: |
          python3 scripts/run_cloud_hold_diagnostic.py validate \
            --directory hold-diagnostic-final \
            --manifest docs/evidence/timing-cloud-input-20260930.json
