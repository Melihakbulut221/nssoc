# SPDX-License-Identifier: Apache-2.0
# TEMPLATE ONLY: no registered workflow; root review precedes any activation/dispatch.
name: mainchip-proc-observer-controls-cloud
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mainchip-proc-observer-controls
  cancel-in-progress: false
jobs:
  native-self-controls:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify source and real hosted self-process observations with corruption controls
        run: |
          python3 scripts/check_mainchip_proc_observer.py --controls
      - name: Preserve complete source/self-observation failure or success
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mainchip-read-only-proc-observer-controls
          path: cloud-mainchip-proc-observer/result.json
          if-no-files-found: error
          retention-days: 90
