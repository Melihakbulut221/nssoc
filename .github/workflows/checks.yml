name: checks

# Correction, 2026-09-20: the checks job wraps ci_local.sh; RTL,
# formal-and-boot and opt-in native-boot also run separate hardware drivers.
# The earlier wrapper-only description below predates those added jobs.
# THIS WORKFLOW IS A WRAPPER AND NOTHING ELSE. Every check it runs is
# defined in scripts/ci_local.sh, which is also how they are run on the
# developer's machine.
#
# It replaces three workflows -- licence, docs and paper -- whose steps
# were written inline. That was a second copy of every gate, and a gate
# that exists twice disagrees with itself eventually. It also means the
# checks no longer depend on the runner.
#
# CORRECTED 2026-09-10, AND THE CORRECTION IS THE POINT. An earlier
# version of this comment said every run since 2026-09-03 had been
# "refused before starting" -- "nine non-starts, not nine failures". The
# API says otherwise: 53 of the 61 runs since that date EXECUTED. Only
# the eight from 2026-09-10 are non-starts, on
#
#   (the exact wording is the owner's account status and is
#    not published; it names a billing condition on the account)
#
# IN THIS MIRROR that history is the DEVELOPMENT repository's and
# not this one's: this repository has its own runner, its own
# billing and no run history at all at the moment of generation.
# The paragraph is kept rather than deleted because it is why the
# checks live in a script instead of in this file, and that reason
# holds wherever the file is.
#
# The rest failed for real reasons, and one was in this file: the licence
# job failed eight times on 09-08 and 09-09 with ModuleNotFoundError: No
# module named 'yaml', because it installed pytest and ci_local.sh
# re-runs regmap/generate.py, which imports yaml. Fixed below.
#
# The earlier claim came from reading today's annotation and applying it
# backwards across a week -- a red result read wider than what it looked
# at, which is the shape this project keeps finding, committed here in
# the commit that announced finding it elsewhere.
#
# The fix is not to wait for the runner. It is to make the runner
# unnecessary: scripts/ci_local.sh is the definition, this file calls
# it, and the result is the same either way. When the runner comes back
# this file adds independent re-execution, which is the one thing local
# running cannot provide and the only reason to want CI at all.
#
# The two environment differences are handled by the script, which
# SKIPS with a stated reason rather than passing silently: pandoc and a
# TeX distribution exist here and not on the developer's machine, so the
# pandoc site build and the paper build run only in this job.

on:
  push:
  pull_request:
  schedule:
    - cron: "17 2 * * *" # UTC; all normal hardware jobs, native boot remains opt-in
  workflow_dispatch:
    inputs:
      native_boot:
        description: Run the long four-state whole-netlist boot with native IHP cells
        type: boolean
        default: false
      full_interfaces:
        description: Explicitly fetch and verify LGPL SpaceWire and CAN in the full profile
        type: boolean
        default: false

env:
  SOC_INTERFACE_PROFILE: ${{ github.event_name == 'workflow_dispatch' && inputs.full_interfaces && 'full' || 'base' }}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}-${{ inputs.full_interfaces && 'full' || 'base' }}
  cancel-in-progress: true

jobs:
  python-quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: sw/requirements-dev.txt
      - name: Install pinned development checks
        run: python3 -m pip install -r sw/requirements-dev.txt
      - name: Python fatal errors and golden-model/driver types
        run: |
          python3 -m ruff check sw
          python3 -m mypy
          python3 -m pre_commit validate-config

  native-boot:
    if: github.event_name == 'workflow_dispatch' && inputs.native_boot
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            sw/requirements.txt
            hw/requirements.txt
      - uses: YosysHQ/setup-oss-cad-suite@aefa8397bbf8fc6670a0a62af9805a89738f3cde # v3 (peeled commit)
        with:
          version: '2026-08-04'
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Prepare pinned processor, interfaces and firmware tools
        run: |
          echo "OSS_CAD_SUITE=$(dirname "$(dirname "$(command -v yosys)")")" >> "$GITHUB_ENV"
          python3 -m pip install -r sw/requirements.txt
          make soc-prepare
      - name: Build and boot the same immutable image in RTL and native gates
        run: bash scripts/check_soc_native_boot.sh
      - name: Retain successful or failed native boot evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-boot-results
          path: |
            hw/soc/out/native-boot/**/*.log
            hw/soc/out/native-boot/**/*.json
            hw/soc/out/native-boot/synthesis/soc_top.netlist.v
            hw/soc/out/native-boot/synthesis/area.rpt
            hw/soc/out/native-boot/rtl/test_soc.bin
            hw/soc/out/native-boot/rtl/app.elf
            hw/soc/out/native-boot/rtl/flash0.hex
          retention-days: 30

  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            sw/requirements.txt
            hw/requirements.txt

      - name: Tools the developer's machine does not have
        run: |
          # PyYAML too: ci_local.sh re-runs regmap/generate.py, which
          # imports yaml, and its absence is why the licence job failed
          # eight times on 09-08 and 09-09 with ModuleNotFoundError. Not
          # a billing failure -- a real one, in this file.
          python3 -m pip install --disable-pip-version-check -r sw/requirements.txt
          sudo apt-get update -qq
          # texlive-science carries siunitx; texlive-latex-extra does not.
          # lmodern.sty is in `lmodern`, which texlive-base only Recommends
          # and --no-install-recommends therefore drops.
          # The route-guide guard tests execute Tcl itself. Yosys only
          # requires the Tcl library, which does not provide tclsh.
          sudo apt-get install -y --no-install-recommends \
            pandoc texlive-latex-recommended texlive-latex-extra \
            texlive-fonts-recommended texlive-science lmodern tcl

      - name: Every check, from the same script the developer runs
        run: scripts/ci_local.sh all

      - name: The paper must have built here, even though it cannot there
        run: |
          test -s paper/main.pdf
          test -s paper/main.bbl

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: paper-and-site
          path: |
            paper/main.pdf
            _site
          retention-days: 30

  memory-parity:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: hw/requirements.txt
      - uses: YosysHQ/setup-oss-cad-suite@aefa8397bbf8fc6670a0a62af9805a89738f3cde # v3
        with:
          version: '2026-08-04'
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install memory simulation dependencies
        run: |
          python3 -m venv hw/.venv
          hw/.venv/bin/pip install -r hw/requirements.txt
      - name: Compare array and native SRAM models, including a negative control
        run: bash scripts/check_soc_memory_parity.sh
      - name: Mapped UART serial contracts with untouched IHP cell models
        run: bash scripts/check_uart_native.sh
      - name: Retain every parity result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: memory-parity-results
          path: |
            hw/soc/out/memory-parity/**/*.log
            hw/soc/out/memory-parity/**/*.json
            hw/soc/out/memory-parity/**/*.xml
            hw/soc/out/uart-native/**/*.log
            hw/soc/out/uart-native/**/*.json
            hw/soc/out/uart-native/**/*.xml
            hw/soc/out/uart-native/netlist.v
            hw/soc/out/uart-native/area.rpt
          retention-days: 30

  rtl:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            sw/requirements.txt
            hw/requirements.txt
      - name: Install the simulation dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends iverilog
          python3 -m venv hw/.venv
          hw/.venv/bin/pip install -r hw/requirements.txt
      - name: Prepare pinned interface IP
        run: make soc-interfaces-prepare
      - name: Run every non-frozen RTL suite
        run: scripts/run_cocotb.sh
      - name: Retain simulator diagnostics, including failed runs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rtl-results
          path: |
            hw/soc/out/cocotb/
            hw/tb/results*.xml
            hw/soc/tb/cocotb/results*.xml
            tt/test/results.xml
          retention-days: 30

  formal-sweep:
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: sw/requirements.txt
      - uses: YosysHQ/setup-oss-cad-suite@aefa8397bbf8fc6670a0a62af9805a89738f3cde # v3
        with:
          version: '2026-08-04'
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Prepare pinned RTL for the complete formal regression
        run: |
          echo "OSS_CAD_SUITE=$(dirname "$(dirname "$(command -v yosys)")")" >> "$GITHUB_ENV"
          python3 -m pip install -r sw/requirements.txt
          make soc-rtl-prepare
      - name: All declared pilot and SoC regression proofs with fresh source checks
        run: python3 scripts/check_formal_sweep.py
      - name: Retain every verdict and any incomplete formal run
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: formal-sweep-results
          path: |
            hw/soc/out/formal-sweep/
            formal/*/config.sby
            formal/*/logfile.txt
            formal/*/status
            formal/*/src/
            formal/*/engine_*/trace*
            hw/soc/formal/*/config.sby
            hw/soc/formal/*/logfile.txt
            hw/soc/formal/*/status
            hw/soc/formal/*/src/
            hw/soc/formal/*/engine_*/trace*
            hw/soc/out/regfile-contract-checks/
            hw/soc/out/peripheral-contracts/
          retention-days: 30

  formal-and-boot:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            sw/requirements.txt
            hw/requirements.txt
      - uses: YosysHQ/setup-oss-cad-suite@aefa8397bbf8fc6670a0a62af9805a89738f3cde # v3 (peeled commit)
        with:
          version: '2026-08-04'
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Prepare the pinned processor and firmware tools
        run: |
          echo "OSS_CAD_SUITE=$(dirname "$(dirname "$(command -v yosys)")")" >> "$GITHUB_ENV"
          python3 -m venv .venv
          .venv/bin/pip install -r sw/requirements.txt -r hw/requirements.txt
          make soc-prepare
      - name: Prepared upstream compatibility and whole-SoC elaboration
        run: make soc-prepared-guards
      - name: Whole-SoC lint with exact diagnostic inventory
        run: PY=.venv/bin/python bash scripts/ci_local.sh lint
      - name: Real-codec contract, counterexamples and upstream equivalence
        run: make rf-contract rf-equivalence
      - name: CPU interface and interrupt regression
        run: make soc-interfaces-sim
      - name: Physical-source RTL lint with compiled fixed ROM and SYNPRE register file
        run: PY=.venv/bin/python bash scripts/lint.sh --memory sram-logic --rom-image hw/soc/out/interfaces-cpu/test_soc.bin --output hw/soc/out/lint-sram-logic
      - name: External IRQ, WFI and interrupt context regression
        run: |
          python3 hw/soc/flow/external_irq_probe.py --prepare hw/soc/out/external-irq
          bash hw/soc/out/external-irq/run_rtl.sh
          python3 hw/soc/flow/external_irq_probe.py --prepare hw/soc/out/external-irq-negative --legacy-t0
          bash hw/soc/out/external-irq-negative/run_rtl.sh
      - name: CPU Gigabit Ethernet packet and interrupt regression
        run: |
          SOC_MEM_RDREG=1 SOC_REQ_REG=1 SOC_RF_SYNPRE=1 \
            SW_DEFINES=-DETHERNET_DEMO \
            bash hw/soc/flow/sim_soc.sh hw/soc/out/ethernet-demo
      - name: CPU UART reception, WFI and corrupted serial data control
        run: |
          python3 hw/soc/flow/uart_rx_probe.py --prepare hw/soc/out/uart-rx
          bash hw/soc/out/uart-rx/run_rtl.sh
          python3 hw/soc/flow/uart_rx_probe.py --prepare hw/soc/out/uart-rx-negative --corrupt-byte
          bash hw/soc/out/uart-rx-negative/run_rtl.sh
      - name: APB timeout, retained telemetry and NPU reset proofs
        run: make -C hw/soc/formal busstat apb npu
      - name: Whole-SoC stalled peripheral and crash recovery
        run: |
          SOC_MEM_RDREG=1 SOC_REQ_REG=1 SOC_RF_SYNPRE=1 \
            SW_DEFINES=-DAPB_TIMEOUT_DEMO SOC_VVP_ARGS=+apb_timeout_demo \
            bash hw/soc/flow/sim_soc.sh hw/soc/out/apb-timeout-demo
          SOC_MEM_RDREG=1 SOC_REQ_REG=1 SOC_RF_SYNPRE=1 \
            SW_DEFINES=-DCRASH_DUMP_DEMO SOC_VVP_ARGS=+allow_double_fault \
            bash hw/soc/flow/sim_soc.sh hw/soc/out/crash-demo
      - name: Observe CPU double-fault recovery through APB with cocotb
        run: |
          COCOTB_CONFIG="$PWD/.venv/bin/cocotb-config" \
            COCOTB_PYTHON="$PWD/.venv/bin/python" \
            bash scripts/check_soc_crash_cocotb.sh hw/soc/out/crash-demo
      - name: Boot geometry proof and counterexamples
        run: |
          curl -fLsS --retry 3 -o hw/soc/tools/cbmc.deb https://github.com/diffblue/cbmc/releases/download/cbmc-6.11.0/ubuntu-22.04-cbmc-6.11.0-Linux.deb
          echo 'de9fa1cc4cf51c493e708a1c7608b192ad4956717b684d9c4501e22fd22d88a0  hw/soc/tools/cbmc.deb' | sha256sum -c -
          dpkg-deb -x hw/soc/tools/cbmc.deb hw/soc/tools/cbmc
          make boot-proof
      - name: Whole-SoC fixed logic-ROM boot and geometry fallback
        run: SOC_BOOT_ROM=logic make soc-boot-regression
      - name: Retain formal and boot evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: formal-and-boot-results
          path: |
            hw/soc/formal/regfile_contract_*/logfile.txt
            hw/soc/formal/regfile_contract_*/status
            hw/soc/formal/regfile_equivalence_*/logfile.txt
            hw/soc/formal/regfile_equivalence_*/status
            hw/soc/out/regfile-contract-checks/
            hw/soc/out/boot-geometry/
            hw/soc/out/apb-timeout-demo/sim.log
            hw/soc/out/crash-demo/sim.log
            hw/soc/out/crash-demo/crash-cocotb*
            hw/soc/out/ethernet-demo/sim.log
            hw/soc/out/lint-*/
            hw/soc/out/external-irq/rtl-run.log
            hw/soc/out/external-irq/source-hashes.json
            hw/soc/out/external-irq-negative/rtl-run.log
            hw/soc/out/external-irq-negative/source-hashes.json
            hw/soc/formal/soc_busstat_*/status
            hw/soc/formal/soc_apb_bridge_*/status
            hw/soc/formal/soc_npu_*/status
            hw/soc/out/boot-regression/**/*.log
            hw/soc/out/boot-regression/**/boot-rom/manifest.json
          retention-days: 30
