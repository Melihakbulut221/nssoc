name: timing-alu-hard-bits (four exact equations through ABC; no candidate adoption)
on:
  push:
    paths:
      - .github/workflows/timing-alu-hard-bits.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: timing-alu-hard-bits-${{ github.ref }}
  cancel-in-progress: false
jobs:
  prove:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Verify exact source, input map, verdict and incomplete-coverage guards
        run: |
          python3 -m pip install pytest==8.4.2
          python3 -m pytest -q sw/tests/test_alu_hard_bits.py sw/tests/test_alu_remaining_bits.py sw/tests/test_alu_state_bit_benchmark.py
      - name: Install exact AppImage prerequisite
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libfuse2
      - name: Replay original evidence and native controls before exporting four unchanged equations
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/prove_alu_hard_bits.py prepare --output "$GITHUB_WORKSPACE/alu-hard-common" --work "$RUNNER_TEMP/alu-hard-work"
      - name: Preserve immutable source gates and all four native exports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: alu-hard-common-${{ github.run_attempt }}
          path: alu-hard-common/
          include-hidden-files: true
          if-no-files-found: error
          compression-level: 1
          retention-days: 30
      - name: Solve original hard equation 0 and replay any complete counterexample
        if: always() && steps.prepare.outcome == 'success'
        run: |
          python3 scripts/prove_alu_hard_bits.py bit --bundle "$GITHUB_WORKSPACE/alu-hard-common" --index 0 --output "$GITHUB_WORKSPACE/hard-bit-0"
      - name: Preserve immutable equation 0 outcome even after a native failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: alu-hard-bit-0-${{ github.run_attempt }}
          path: hard-bit-0/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30
      - name: Solve original hard equation 1 and replay any complete counterexample
        if: always() && steps.prepare.outcome == 'success'
        run: |
          python3 scripts/prove_alu_hard_bits.py bit --bundle "$GITHUB_WORKSPACE/alu-hard-common" --index 1 --output "$GITHUB_WORKSPACE/hard-bit-1"
      - name: Preserve immutable equation 1 outcome even after a native failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: alu-hard-bit-1-${{ github.run_attempt }}
          path: hard-bit-1/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30
      - name: Solve original hard equation 2 and replay any complete counterexample
        if: always() && steps.prepare.outcome == 'success'
        run: |
          python3 scripts/prove_alu_hard_bits.py bit --bundle "$GITHUB_WORKSPACE/alu-hard-common" --index 2 --output "$GITHUB_WORKSPACE/hard-bit-2"
      - name: Preserve immutable equation 2 outcome even after a native failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: alu-hard-bit-2-${{ github.run_attempt }}
          path: hard-bit-2/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30
      - name: Solve original hard equation 3 and replay any complete counterexample
        if: always() && steps.prepare.outcome == 'success'
        run: |
          python3 scripts/prove_alu_hard_bits.py bit --bundle "$GITHUB_WORKSPACE/alu-hard-common" --index 3 --output "$GITHUB_WORKSPACE/hard-bit-3"
      - name: Preserve immutable equation 3 outcome even after a native failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: alu-hard-bit-3-${{ github.run_attempt }}
          path: hard-bit-3/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30
      - name: Reparse all four native outcomes without adopting the candidate
        if: always() && steps.prepare.outcome == 'success'
        run: |
          python3 scripts/prove_alu_hard_bits.py aggregate --bundle "$GITHUB_WORKSPACE/alu-hard-common" --bit-root "$GITHUB_WORKSPACE" --output alu-hard-verdict.json
      - name: Preserve final complete or explicitly incomplete verdict
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: alu-hard-verdict-${{ github.run_attempt }}
          path: alu-hard-verdict.json
          if-no-files-found: warn
          retention-days: 30
