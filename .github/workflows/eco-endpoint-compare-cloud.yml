name: eco-endpoint-compare-cloud
on:
  push:
    branches: [codex/complete-open-work]
    paths: [.github/workflows/eco-endpoint-compare-cloud.yml]
  workflow_dispatch:
    inputs:
      profile:
        description: Completed physical candidate profile
        type: choice
        options: [two_buffer, control_three_buffer, measured_load_batch, protected_load_batch, measured_hold_batch, expanded_load_batch]
        required: true
      run:
        description: Completed physical ECO run ID
        type: string
        required: true
      summary_sha:
        description: Exact completed result SHA256
        type: string
        required: true
      parts_sha:
        description: Exact ordered archive manifest SHA256
        type: string
        required: true
      hold_paths:
        description: Also trace every negative hold endpoint and all original-corner setup conflicts
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: eco-endpoint-compare-${{ github.ref }}-${{ inputs.run }}-${{ inputs.hold_paths }}
  cancel-in-progress: false
jobs:
  controls:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Reject missing evidence, changed endpoints and hidden regressions
        run: |
          python3 -m py_compile scripts/compare_cloud_routed_endpoints.py scripts/critical_load_targets.py scripts/expanded_load_targets.py scripts/prepare_cloud_critical_load_eco.py scripts/run_cloud_critical_load_eco.py
          python3 scripts/expanded_load_targets.py --verify-published
          python3 scripts/compare_cloud_routed_endpoints.py --controls-only
  full-comparison:
    if: github.event_name == 'workflow_dispatch'
    needs: controls
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Restore exact native runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libfuse2
          curl --fail --location --retry 4 https://github.com/librelane/librelane/releases/download/3.0.5/librelane-devshell-x86_64.AppImage -o "$RUNNER_TEMP/librelane.AppImage"
          echo "d6a349ec65be11456e96c4981d35f63ca34d3c85daf79a51e1ccb907bb5d7466  $RUNNER_TEMP/librelane.AppImage" | sha256sum --check
          chmod +x "$RUNNER_TEMP/librelane.AppImage"
          echo "CLOUD_APPIMAGE=$RUNNER_TEMP/librelane.AppImage" >> "$GITHUB_ENV"
      - name: Remeasure all actual routed endpoints against the immutable baseline
        env:
          PROFILE: ${{ inputs.profile }}
          SOURCE_RUN: ${{ inputs.run }}
          SUMMARY_SHA: ${{ inputs.summary_sha }}
          PARTS_SHA: ${{ inputs.parts_sha }}
          HOLD_PATHS: ${{ inputs.hold_paths }}
        run: |
          args=()
          if [ "$HOLD_PATHS" = "true" ]; then args+=(--hold-paths); fi
          python3 scripts/compare_cloud_routed_endpoints.py --profile "$PROFILE" --run "$SOURCE_RUN" --summary-sha "$SUMMARY_SHA" --parts-sha "$PARTS_SHA" "${args[@]}"
      - name: Preserve all raw endpoint measurements and comparison failures
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p cloud-eco-endpoint-compare
          if [ ! -f cloud-eco-endpoint-compare/result.json ]; then
            printf '%s\n' '{"status":"FAIL_MISSING_REPORT","accepted":false}' > cloud-eco-endpoint-compare/result.json
          fi
          stem="eco-endpoint-compare-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          cp cloud-eco-endpoint-compare/result.json "$stem.summary.json"
          python3 scripts/cloud_chunked_results.py --directory cloud-eco-endpoint-compare --stem "$stem"
          python3 - "$stem" <<'PYCODE'
          import json,subprocess,sys
          stem=sys.argv[1];manifest=stem+'.parts.json';m=json.load(open(manifest))
          subprocess.run([sys.executable,'scripts/publish_cloud_results.py','--group','eco-endpoint-compare',stem+'.summary.json',manifest,*[p['name'] for p in m['parts']]],check=True)
          PYCODE
      - name: Require complete independent comparison without adopting the candidate
        if: always()
        run: |
          python3 - <<'PYCODE'
          import json,os
          r=json.load(open('cloud-eco-endpoint-compare/result.json'))
          assert r['source_head']==os.environ['GITHUB_SHA']
          assert r['status']=='COMPLETE_ALL_ENDPOINT_ROUTED_ECO_COMPARISON_NOT_SIGNOFF',r.get('error')
          assert r['source_unchanged'] and r['candidate_routed_timing_reproduced']
          assert r['endpoint_count']==22544 and r['endpoint_corner_delay_rows']==135264
          print(r['comparison'])
          PYCODE
# Frozen ECO outputs omit nested result.json; logic receipt is embedded in pinned summary.

# Sequential SRAM hold candidates compare every endpoint to both original and exact parent; target setup loss and missing hold constraints are rejected.
