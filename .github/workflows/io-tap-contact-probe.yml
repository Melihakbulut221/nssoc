name: io-tap-contact-probe
on:
  push:
    paths:
      - .github/workflows/io-tap-contact-probe.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: io-tap-contact-probe
  cancel-in-progress: false
jobs:
  seven-cell-contact-diagnostic:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      QT_QPA_PLATFORM: offscreen
      OMP_NUM_THREADS: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Pure capture, source and failure-gate tests
        run: |
          python3 -m pip install -r sw/requirements.txt
          python3 -m pytest -q sw/tests/test_io_tap_contact_probe.py
      - name: Prepare checksum-pinned native runtime and unchanged rule sources
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libfuse2
          python3 scripts/bootstrap_flow.py
          python3 scripts/bootstrap_flow.py --check
          python3 hw/soc/flow/prepare_ihp_lvs.py
          python3 hw/soc/flow/prepare_ihp_drc.py
      - name: Tiny native controls before exact seven-cell contact attribution
        run: >-
          python3 scripts/run_io_tap_contact_probe.py
          --output hw/soc/out/github-io-tap-contact-probe
      - name: Preserve source pins, every contact and failed gates
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: io-tap-contact-probe-${{ github.run_attempt }}
          path: hw/soc/out/github-io-tap-contact-probe/
          if-no-files-found: error
          retention-days: 30
          compression-level: 1
