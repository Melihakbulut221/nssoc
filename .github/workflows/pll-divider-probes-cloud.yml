name: pll-divider-probes-cloud
on:
  push:
    branches: [codex/complete-open-work]
    paths: [.github/workflows/pll-divider-probes-cloud.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pll-divider-probes-${{ github.ref }}
  cancel-in-progress: false
jobs:
  native-paths:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Restore analysis dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libsndfile1 libsamplerate0 libreadline8t64 libxaw7 libxt6 libxft2 libfontconfig1
          python3 -m pip install numpy==2.3.3
      - name: Run separate bounded divider diagnostic with all102 HBT terminal probes
        run: |
          python3 -m py_compile scripts/cloud_pll_divider_probes.py
          python3 scripts/cloud_pll_divider_probes.py
      - name: Preserve native results and failures
        if: always()
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p cloud-pll-divider-probes
          if [ ! -f cloud-pll-divider-probes/result.json ]; then
            printf '%s\n' '{"status":"FAIL_MISSING_REPORT","accepted":false}' > cloud-pll-divider-probes/result.json
          fi
          stem="pll-divider-probes-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          cp cloud-pll-divider-probes/result.json "$stem.summary.json"
          python3 scripts/cloud_chunked_results.py --directory cloud-pll-divider-probes --stem "$stem"
          python3 - "$stem" <<'PYCODE'
          import json,subprocess,sys
          stem=sys.argv[1];manifest=stem+'.parts.json';m=json.load(open(manifest))
          subprocess.run([sys.executable,'scripts/publish_cloud_results.py','--group','pll-divider-probes',stem+'.summary.json',manifest,*[p['name']for p in m['parts']]],check=True)
          PYCODE
      - name: Retain evidence after publication failure
        if: always() && steps.publish.outcome == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pll-divider-probes-${{ github.run_id }}
          retention-days: 30
          path: cloud-pll-divider-probes/
