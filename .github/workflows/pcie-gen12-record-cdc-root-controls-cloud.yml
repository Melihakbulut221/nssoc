# SPDX-License-Identifier: Apache-2.0
# Isolated candidate branch only; registered dispatch path reused intentionally.
name: Shared serial front v1 focused digital integration
on:
  workflow_dispatch:
    inputs:
      execute_rtl:
        type: boolean
        default: false
        description: Run source-gated dual-simulator RTL and production hierarchy checks
permissions:
  contents: read
defaults:
  run:
    shell: bash
concurrency:
  group: pcie-shared-serial-front-v1-${{ github.ref }}
  cancel-in-progress: false
env:
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  source-controls:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Exact source, frozen oracle and consumer derivation controls
        run: |
          set -euo pipefail
          python3 -u scripts/check_pcie_shared_serial_front.py --source-controls | tee shared-front-source-controls.json
      - name: Preserve complete source control output
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: shared-front-source-controls-${{ github.run_id }}-${{ github.run_attempt }}
          path: shared-front-source-controls.json
          if-no-files-found: warn
          retention-days: 90
  focused-rtl:
    needs: source-controls
    if: inputs.execute_rtl
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Recheck source and await independent exact-source reservation
        run: |
          set -euo pipefail
          python3 -u scripts/check_pcie_shared_serial_front.py --source-controls
          python3 -u scripts/wait_cloud_tested_source_release.py --group pcie-shared-serial-front-v1
      - name: Provision qualified digital RTL tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends iverilog yosys build-essential autoconf flex bison libfl-dev zlib1g-dev help2man python3-venv
          build="$RUNNER_TEMP/shared-front-verilator"
          prefix="$RUNNER_TEMP/shared-front-tools"
          mkdir "$build"
          git -C "$build" init
          git -C "$build" fetch --depth=1 https://github.com/verilator/verilator.git 51cdf52d0f3a3e59b51fd87762646a851e9f4aff
          git -C "$build" checkout --detach FETCH_HEAD
          test "$(git -C "$build" rev-parse HEAD)" = 51cdf52d0f3a3e59b51fd87762646a851e9f4aff
          test -z "$(git -C "$build" status --porcelain)"
          cd "$build"
          autoconf
          ./configure --prefix="$prefix"
          make -j2
          make install
          echo "$prefix/bin" >> "$GITHUB_PATH"
      - name: Independent record oracle, normal consumers and compiled mutations
        run: |
          set -euo pipefail
          python3 -u scripts/check_pcie_shared_serial_front.py --out hw/soc/out/pcie-shared-serial-front-v1 \
            | tee shared-front-rtl.log
      - name: Print complete terminal digital result
        if: always()
        run: |
          if test -f hw/soc/out/pcie-shared-serial-front-v1/result.json; then
            cat hw/soc/out/pcie-shared-serial-front-v1/result.json
          fi
      - name: Publish all output bytes, including failed native cases, without replacing assets
        if: always()
        run: |
          set -euo pipefail
          if test -d hw/soc/out/pcie-shared-serial-front-v1; then
            python3 -u scripts/check_pcie_shared_serial_front.py \
              --publish hw/soc/out/pcie-shared-serial-front-v1 \
              --destination "$RUNNER_TEMP/shared-front-publication"
          fi
      - name: Preserve every compile log, XML, hierarchy and terminal result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: shared-front-focused-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            shared-front-rtl.log
            hw/soc/out/pcie-shared-serial-front-v1/
            ${{ runner.temp }}/shared-front-publication/
          if-no-files-found: warn
          retention-days: 90
