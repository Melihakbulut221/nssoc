name: pll-first-latch-native-sampling-controls-cloud
on:
  push:
    branches: [codex/pll-first-latch-endpoint-sampling]
    paths: [scripts/pll_first_latch_native_sampling.py, .github/workflows/pll-first-latch-native-sampling-controls-cloud.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  endpoint-controls:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: |
          python3 -m pip install numpy==2.3.3
          python3 scripts/pll_first_latch_native_sampling.py --controls
