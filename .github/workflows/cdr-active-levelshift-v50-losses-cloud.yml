name: cdr-active-levelshift-v50-losses-cloud
on:
  push:
    branches: [codex/complete-open-work]
    paths:
      - .github/workflows/cdr-active-levelshift-v50-losses-cloud.yml
      - scripts/cloud_cdr_active_levelshift_v50_losses.py
      - scripts/cdr-active-levelshift-v50-losses-method.json
      - docs/evidence/cdr-active-levelshift-v50-extracted-results-20261024.json
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cdr-active-levelshift-v50-losses
  cancel-in-progress: false
jobs:
  controls:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: |
          python3 -m pip install numpy==2.3.3
          python3 -m py_compile scripts/cloud_cdr_active_levelshift_v50_losses.py
          PYTHONPATH=scripts python3 -c "from cloud_cdr_active_levelshift_v50_losses import check; print(check())"
  native:
    needs: controls
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        case: [nominal, hot_low, cold_high]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install full waveform reader
        run: |
          python3 -m pip install numpy==2.3.3
      - name: Diagnose actual failed native full wave without resimulation
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/cloud_cdr_active_levelshift_v50_losses.py --case ${{ matrix.case }}
      - name: Preserve complete component evidence including all failures
        if: always()
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          root=cloud-cdr-active-levelshift-v50-losses-${{ matrix.case }}
          mkdir -p "$root"
          if [ ! -f "$root/result.json" ]; then
            printf '%s\n' '{"status":"FAIL_MISSING_REPORT","full_phy_accepted":false}' > "$root/result.json"
          fi
          stem="cdr-active-levelshift-v50-losses-${{ matrix.case }}-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          cp "$root/result.json" "$stem.summary.json"
          python3 scripts/cloud_chunked_results.py --directory "$root" --stem "$stem"
          python3 - "$stem" <<'PYCODE'
          import json,subprocess,sys
          stem=sys.argv[1];m=json.load(open(stem+'.parts.json'))
          subprocess.run([sys.executable,'scripts/publish_cloud_results.py','--group','cdr-active-levelshift-v50-losses-${{ matrix.case }}',stem+'.summary.json',stem+'.parts.json',*[p['name']for p in m['parts']]],check=True)
          PYCODE
      - name: Retain evidence after publication failure
        if: always() && steps.publish.outcome == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cdr-active-levelshift-v50-losses-${{ matrix.case }}-${{ github.run_id }}
          path: cloud-cdr-active-levelshift-v50-losses-${{ matrix.case }}/
          retention-days: 30
