name: ethernet-delay-independent-review-cloud
on:
  push:
    branches: [codex/complete-open-work]
    paths: [.github/workflows/ethernet-delay-independent-review-cloud.yml]
  workflow_dispatch:
    inputs:
      run:
        description: Completed actual single Ethernet delay replacement route run
        type: string
        required: true
      summary_sha:
        description: Exact published candidate summary SHA256
        type: string
        required: true
      parts_sha:
        description: Exact ordered archive manifest SHA256
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: ethernet-delay-independent-review-${{ github.ref }}-${{ inputs.run }}
  cancel-in-progress: false
jobs:
  controls:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Compile the independent actual single-delay master census and reviewer
        run: |
          python3 -m py_compile scripts/review_ethernet_delay_candidate.py scripts/audit_ethernet_delay_candidate_native.py
      - name: Verify geometry and annotation diagnostics reject missing physical evidence
        run: |
          python3 -m pip install shapely==2.1.2 numpy==2.3.3
          python3 scripts/check_cloud_routed_shapes.py --controls-only
          python3 scripts/check_cloud_signal_contacts.py --controls-only
          python3 - <<'PYCODE'
          import sys,json
          sys.path.insert(0,'scripts')
          from audit_cloud_route_annotation import controls,name_controls,SUPPORTED_ADDED_COUNTS
          assert 240 in SUPPORTED_ADDED_COUNTS and 239 not in SUPPORTED_ADDED_COUNTS
          print(json.dumps(dict(annotation=controls(),names=name_controls())))
          PYCODE
  review:
    if: github.event_name == 'workflow_dispatch'
    needs: controls
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        kind: [geometry, annotation]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Restore exact native runtime and geometry libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libfuse2
          python3 -m pip install shapely==2.1.2 numpy==2.3.3
          curl --fail --location --retry 4 https://github.com/librelane/librelane/releases/download/3.0.5/librelane-devshell-x86_64.AppImage -o "$RUNNER_TEMP/librelane.AppImage"
          echo "d6a349ec65be11456e96c4981d35f63ca34d3c85daf79a51e1ccb907bb5d7466  $RUNNER_TEMP/librelane.AppImage" | sha256sum --check
          chmod +x "$RUNNER_TEMP/librelane.AppImage"
          echo "CLOUD_APPIMAGE=$RUNNER_TEMP/librelane.AppImage" >> "$GITHUB_ENV"
      - name: Inspect every actual source and candidate cell then independently measure candidate
        env:
          SOURCE_RUN: ${{ inputs.run }}
          SUMMARY_SHA: ${{ inputs.summary_sha }}
          PARTS_SHA: ${{ inputs.parts_sha }}
          KIND: ${{ matrix.kind }}
        run: >-
          python3 scripts/review_ethernet_delay_candidate.py --kind "$KIND"
          --run "$SOURCE_RUN" --summary-sha "$SUMMARY_SHA" --parts-sha "$PARTS_SHA"
      - name: Preserve all actual geometry, annotation and failures
        if: always()
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          KIND: ${{ matrix.kind }}
        run: |
          directory="cloud-ethernet-delay-$KIND"
          mkdir -p "$directory"
          if [ ! -f "$directory/result.json" ]; then
            printf '%s\n' '{"status":"FAIL_MISSING_REPORT","accepted":false}' > "$directory/result.json"
          fi
          stem="ethernet-delay-$KIND-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          cp "$directory/result.json" "$stem.summary.json"
          python3 scripts/cloud_chunked_results.py --directory "$directory" --stem "$stem"
          python3 - "$stem" "$KIND" <<'PYCODE'
          import json,subprocess,sys
          stem,kind=sys.argv[1:];manifest=stem+'.parts.json';m=json.load(open(manifest))
          subprocess.run([sys.executable,'scripts/publish_cloud_results.py','--group','ethernet-delay-'+kind,stem+'.summary.json',manifest,*[p['name']for p in m['parts']]],check=True)
          PYCODE
      - name: Retain evidence after publication failure
        if: always() && steps.publish.outcome == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ethernet-delay-${{ matrix.kind }}-${{ github.run_id }}
          retention-days: 30
          path: cloud-ethernet-delay-${{ matrix.kind }}/
      - name: Require complete independent measurement, not signoff
        if: always()
        env:
          KIND: ${{ matrix.kind }}
        run: |
          python3 - <<'PYCODE'
          import json,os
          kind=os.environ['KIND'];r=json.load(open('cloud-ethernet-delay-'+kind+'/result.json'))
          assert r['source_head']==os.environ['GITHUB_SHA']
          assert r['status']=='COMPLETE_INDEPENDENT_ETHERNET_DELAY_'+kind.upper()+'_SCREEN_NOT_SIGNOFF',r.get('error')
          assert r['source_unchanged'] and r['native_census']['negative_control']['rejected']
          assert not r['accepted'] and not r['final_timing_complete']
          print(r.get('classification',{}))
          print(r.get('antenna_report_lines',[]))
          PYCODE
