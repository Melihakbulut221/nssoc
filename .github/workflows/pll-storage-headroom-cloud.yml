# SPDX-License-Identifier: Apache-2.0
name: pll-storage-headroom-cloud
on:
  push:
    branches: [codex/complete-open-work]
    paths: [.github/workflows/pll-storage-headroom-cloud.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pll-storage-headroom-${{ github.ref }}
  cancel-in-progress: false
jobs:
  capacity:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Recover named disposable SDK space and verify protected tools without native activation
        run: python3 scripts/cloud_pll_storage_headroom.py
      - name: Preserve capacity evidence
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          root=cloud-pll-storage-headroom
          test -f "$root/result.json"
          stem="pll-storage-headroom-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          cp "$root/result.json" "$stem.summary.json"
          python3 scripts/cloud_chunked_results.py --directory "$root" --stem "$stem"
          python3 - "$stem" <<'PYCODE'
          import json,subprocess,sys
          stem=sys.argv[1];m=json.load(open(stem+'.parts.json'))
          subprocess.run([sys.executable,'scripts/publish_cloud_results.py','--group','pll-storage-headroom',stem+'.summary.json',stem+'.parts.json',*[p['name']for p in m['parts']]],check=True)
          PYCODE
