name: chip-irq-full-native
on:
  push:
    paths:
      - .github/workflows/chip-irq-full-native.yml
      - docs/evidence/chip-irq-full-native-input-assets-20260928.json
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: chip-irq-full-native-${{ github.ref }}
  cancel-in-progress: false
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        group: [feol_devices, geometry_pin_forbidden, geometry_grid, geometry_angle, beol, density]
    runs-on: ubuntu-22.04
    # Hosted job maximum; there is no native process elapsed-time watchdog.
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Prepare pinned physical executable
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libfuse2
          python3 scripts/bootstrap_flow.py
          python3 scripts/bootstrap_flow.py --check
      - name: Verify exact chip bundle and run unchanged native rules
        env:
          CHIP_GROUP: ${{ matrix.group }}
        run: >-
          python3 scripts/run_chip_native_shard.py --group "$CHIP_GROUP"
          --manifest docs/evidence/chip-irq-full-native-input-assets-20260928.json
          --output hw/soc/out/github-irq-full-checks
      - name: Preserve measurements, including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: chip-irq-full-native-${{ matrix.group }}
          path: |
            hw/soc/out/github-irq-full-checks/${{ matrix.group }}/*.json
            hw/soc/out/github-irq-full-checks/${{ matrix.group }}/*.log
            hw/soc/out/github-irq-full-checks/${{ matrix.group }}/*.lyrdb
          retention-days: 30
      - name: Require zero markers and complete category coverage
        env:
          CHIP_GROUP: ${{ matrix.group }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          result = json.loads((Path('hw/soc/out/github-irq-full-checks') / os.environ['CHIP_GROUP'] / 'result.json').read_text())
          assert result['status'] == 'PASS' and result.get('category_inventory'), result['status']
          if os.environ["CHIP_GROUP"] == "density":
              assert result["density_coverage"]["executed_rule_count"] == 37
          PY
