# SPDX-License-Identifier: Apache-2.0
name: mainchip-postroute-geometry-cloud
on:
  push:
    branches: [codex/complete-open-work]
    paths: [.github/workflows/mainchip-postroute-geometry-cloud.yml]
  workflow_dispatch:
    inputs:
      source_checkpoint:
        description: Exact completed native DRT descriptor, empty for saved-global preflight
        required: false
        default: ''
        type: string
permissions:
  contents: read
concurrency:
  group: mainchip-postroute-geometry-${{ github.ref }}
  cancel-in-progress: false
jobs:
  native-geometry:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Prepare exact native CAD runtime
        run: |
          python3 -m py_compile scripts/cloud_mainchip_postroute_geometry.py
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libfuse2
          python3 scripts/bootstrap_flow.py
          echo "CLOUD_APPIMAGE=$GITHUB_WORKSPACE/hw/soc/tools/physical/librelane-3.0.5-x86_64.AppImage" >> "$GITHUB_ENV"
      - name: Audit all native instance pin geometry and original fixed clock without routing
        env:
          GH_TOKEN: ${{ github.token }}
          NSSOC_COMPLETED_DRT: ${{ inputs.source_checkpoint }}
        run: python3 scripts/cloud_mainchip_postroute_geometry.py
      - name: Retain native proof and every rejection
        if: always()
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          root=cloud-mainchip-postroute-geometry
          mkdir -p "$root"
          if [ ! -f "$root/result.json" ]; then
            printf '%s\n' '{"status":"FAIL_MISSING_REPORT","accepted":false}' > "$root/result.json"
          fi
          stem="mainchip-postroute-geometry-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          cp "$root/result.json" "$stem.summary.json"
          python3 scripts/cloud_chunked_results.py --directory "$root" --stem "$stem"
          python3 - "$stem" <<'PYCODE'
          import json,subprocess,sys
          stem=sys.argv[1];manifest=stem+'.parts.json';m=json.load(open(manifest))
          subprocess.run([sys.executable,'scripts/publish_cloud_results.py','--group','mainchip-postroute-geometry',stem+'.summary.json',manifest,*[p['name']for p in m['parts']]],check=True)
          PYCODE
      - name: Preserve failed publication
        if: always() && steps.publish.outcome == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mainchip-postroute-geometry
          path: cloud-mainchip-postroute-geometry/
          retention-days: 30
