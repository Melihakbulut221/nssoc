name: tx-clock-reference-rc-cloud
on:
  push:
    branches: [codex/complete-open-work]
    paths: [.github/workflows/tx-clock-reference-rc-cloud.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tx-clock-reference-rc-${{ github.ref }}
  cancel-in-progress: false
jobs:
  actual-full-driver-wire-rc:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        variant: [l6p5, l6p2]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Restore exact native CAD runtime
        run: |
          python3 -m py_compile scripts/cloud_tx_clock_reference_rc.py
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libfuse2 tcl8.6 tk8.6
          python3 -m pip install networkx==3.4.2
      - name: Extract all actual full driver wires and reject thirteen raw corruptions
        run: python3 scripts/cloud_tx_clock_reference_rc.py --variant ${{ matrix.variant }}
      - name: Publish physical success or failure evidence
        if: always()
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p hw/soc/out/cloud-tx-clock-reference-rc-${{ matrix.variant }}
          if [ ! -f hw/soc/out/cloud-tx-clock-reference-rc-${{ matrix.variant }}/result.json ]; then
            printf '%s\n' '{"status":"FAIL_MISSING_REPORT","accepted":false}' > hw/soc/out/cloud-tx-clock-reference-rc-${{ matrix.variant }}/result.json
          fi
          stem="tx-clock-reference-rc-${{ matrix.variant }}-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          cp hw/soc/out/cloud-tx-clock-reference-rc-${{ matrix.variant }}/result.json "$stem.summary.json"
          python3 scripts/cloud_chunked_results.py --directory hw/soc/out/cloud-tx-clock-reference-rc-${{ matrix.variant }} --stem "$stem"
          python3 - "$stem" <<'PYCODE'
          import json,subprocess,sys
          stem=sys.argv[1];manifest=stem+'.parts.json';m=json.load(open(manifest))
          subprocess.run([sys.executable,'scripts/publish_cloud_results.py','--group','tx-clock-reference-rc-${{ matrix.variant }}',stem+'.summary.json',manifest,*[p['name']for p in m['parts']]],check=True)
          PYCODE
      - name: Retain evidence after publication failure
        if: always() && steps.publish.outcome == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tx-clock-reference-rc-${{ matrix.variant }}-${{ github.run_id }}
          retention-days: 30
          path: hw/soc/out/cloud-tx-clock-reference-rc-${{ matrix.variant }}/
