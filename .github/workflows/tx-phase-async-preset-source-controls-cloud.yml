# SPDX-License-Identifier: Apache-2.0
name: tx-phase-async-preset-source-controls-cloud
on:
  push:
    branches: [codex/tx-clock-phase-parent]
    paths:
      - scripts/build_tx_phase_async_preset_source.py
      - scripts/check_tx_phase_async_preset_source.py
      - scripts/tx-phase-async-preset-source-methods.json
      - hw/soc/analog/pcie/clock_div2_async_preset_firstfall_v2.spice
      - .github/workflows/tx-phase-async-preset-source-controls-cloud.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tx-phase-async-preset-source-controls-${{ github.ref }}
  cancel-in-progress: false
jobs:
  source-topology-controls:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Check real-device source and exact original core preservation
        run: |
          python3 -m py_compile scripts/build_tx_phase_async_preset_source.py scripts/check_tx_phase_async_preset_source.py
          python3 scripts/check_tx_phase_async_preset_source.py | tee phase-async-preset-source-controls.json
      - name: Preserve source-only report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: phase-async-preset-source-controls-${{ github.run_id }}
          path: phase-async-preset-source-controls.json
          retention-days: 30
