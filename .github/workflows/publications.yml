name: publications
on:
  push:
    paths:
      - .github/workflows/publications.yml
      - paper-soc/**
      - paper-design/**
      - paper-residual/**
      - thesis/**
      - scripts/check_publications.py
      - scripts/tex_lint.py
      - scripts/pdf_overlap_check.py
      - paper/check_claims.py
      - docs/evidence/publications-current.json
      - docs/evidence/s83ant/metrics.json
      - docs/evidence/s83romecc5/metrics.json
      - sw/requirements.txt
      - sw/tests/test_publication_gates.py
  pull_request:
    paths:
      - .github/workflows/publications.yml
      - paper-soc/**
      - paper-design/**
      - paper-residual/**
      - thesis/**
      - scripts/check_publications.py
      - scripts/tex_lint.py
      - scripts/pdf_overlap_check.py
      - paper/check_claims.py
      - docs/evidence/publications-current.json
      - docs/evidence/s83ant/metrics.json
      - docs/evidence/s83romecc5/metrics.json
      - sw/requirements.txt
      - sw/tests/test_publication_gates.py
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: publications-${{ github.ref }}
  cancel-in-progress: true
jobs:
  manuscripts:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      TECTONIC_CACHE_DIR: ${{ github.workspace }}/.cache/tectonic
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install verified Tectonic 0.17.0 and PDF checker
        run: |
          python3 -m pip install -r sw/requirements.txt
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends poppler-utils
          mkdir -p hw/soc/tools/publications
          curl --fail --location --retry 3 'https://github.com/tectonic-typesetting/tectonic/releases/download/tectonic%400.17.0/tectonic-0.17.0-x86_64-unknown-linux-musl.tar.gz' -o hw/soc/tools/publications/tectonic.tar.gz
          echo '8533d07f9ccbd7a65824b9e0459041bca34af1eb33daba48f59215593753a3b7  hw/soc/tools/publications/tectonic.tar.gz' | sha256sum --check
          tar -xzf hw/soc/tools/publications/tectonic.tar.gz -C hw/soc/tools/publications tectonic
          hw/soc/tools/publications/tectonic --version
      - name: Restore Tectonic dependency cache only
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .cache/tectonic
          key: ${{ runner.os }}-tectonic-0.17.0-v1-${{ hashFiles('paper-soc/**/*.tex', 'paper-soc/refs.bib', 'paper-design/**/*.tex', 'paper-design/refs.bib', 'paper-residual/**/*.tex', 'paper-residual/refs.bib', 'thesis/**/*.tex', 'thesis/refs.bib') }}
          restore-keys: |
            ${{ runner.os }}-tectonic-0.17.0-v1-
      - name: Warm dependencies in scratch copies before the unchanged build gate
        # Cold-cache package downloads exceeded the final build's 300s limit.
        # https://tectonic-typesetting.github.io/book/latest/getting-started/first-document.html#cache
        # These preliminary PDFs are never accepted or copied to final outputs.
        run: |
          python3 - <<'PY'
          import json, os, shutil, subprocess, sys, time
          from pathlib import Path
          sys.path.insert(0, str(Path('scripts').resolve()))
          import check_publications as publications

          root = Path.cwd()
          tool = root / 'hw/soc/tools/publications/tectonic'
          out = root / 'hw/soc/out/publication-cache-warmup'
          out.mkdir(parents=True, exist_ok=False)
          record = {'status': 'FAIL', 'scope': 'CACHE_PREPARATION_ONLY',
                    'accepted_deliverables': False, 'total_timeout_seconds': 900,
                    'cache_directory': os.environ['TECTONIC_CACHE_DIR'], 'documents': {}}
          started = time.monotonic()
          try:
              record['tool_sha256'] = publications.sha(tool)
              for name in publications.DOCUMENTS:
                  row = {'inputs': publications.inputs(root, name), 'returncode': None}
                  record['documents'][name] = row
                  directory = out / name
                  directory.mkdir()
                  for relative, expected in row['inputs'].items():
                      if relative.startswith(name + '/'):
                          target = out / relative
                          target.parent.mkdir(parents=True, exist_ok=True)
                          shutil.copyfile(root / relative, target)
                          if publications.sha(target) != expected:
                              raise ValueError('Scratch input hash mismatch: ' + relative)
                  command = [str(tool), '-X', 'compile', 'main.tex', '--outdir', '.',
                             '--keep-logs', '--keep-intermediates']
                  row['command'] = command
                  remaining = 900 - (time.monotonic() - started)
                  if remaining <= 0:
                      raise ValueError('Total dependency warmup time budget exhausted')
                  row['timeout_seconds'] = remaining
                  log = out / (name + '.log')
                  try:
                      with log.open('x') as stream:
                          result = subprocess.run(command, cwd=directory, stdout=stream,
                              stderr=subprocess.STDOUT, timeout=remaining,
                              env={**os.environ, 'SOURCE_DATE_EPOCH': '1789776000'})
                      row['returncode'] = result.returncode
                  except subprocess.TimeoutExpired:
                      row['timed_out'] = True
                      raise
                  finally:
                      row['log_sha256'] = publications.sha(log)
                  if result.returncode:
                      raise ValueError('Dependency warmup failed without retry: ' + name)
              for name, row in record['documents'].items():
                  if row['inputs'] != publications.inputs(root, name):
                      raise ValueError('Sources changed during dependency warmup: ' + name)
              if publications.sha(tool) != record['tool_sha256']:
                  raise ValueError('Tectonic changed during dependency warmup')
              record['status'] = 'PASS'
          except (OSError, ValueError, subprocess.SubprocessError) as error:
              record['error'] = str(error)
          record['elapsed_seconds'] = time.monotonic() - started
          (out / 'result.json').write_text(json.dumps(record, indent=2) + '\n')
          print(json.dumps(record))
          raise SystemExit(0 if record['status'] == 'PASS' else 1)
          PY
      - name: Verify tracked freshness then build all four manuscripts from source
        run: |
          python3 scripts/check_publications.py --check
          python3 scripts/check_publications.py --out hw/soc/out/publications --tectonic "$PWD/hw/soc/tools/publications/tectonic" --compare-thesis
      - name: Retain PDFs, source archives and success or failure diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: publication-results
          path: |
            hw/soc/out/publications/**/*.pdf
            hw/soc/out/publications/**/*.bbl
            hw/soc/out/publications/**/*.log
            hw/soc/out/publications/**/*.json
            hw/soc/out/publications/**/*.tar.gz
            hw/soc/out/publication-cache-warmup/**/*.log
            hw/soc/out/publication-cache-warmup/result.json
          retention-days: 30
