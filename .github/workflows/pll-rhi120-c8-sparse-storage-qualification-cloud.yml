name: pll-rhi120-c8-sparse-storage-qualification-cloud
on:
  push:
    branches: [codex/complete-open-work]
    paths: [.github/workflows/pll-rhi120-c8-sparse-storage-qualification-cloud.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pll-rhi120-c8-sparse-storage-qualification
  cancel-in-progress: false
jobs:
  observe:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify exact RHI120 archived prefix losslessly without native activation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -m pip install numpy==2.3.3
          python3 scripts/check_pll_rhi120_c8_sparse_sources.py
          python3 scripts/cloud_pll_rhi120_c8_sparse_qualification.py
      - name: Publish bounded observation without claiming a complete native checkpoint
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p cloud-pll-rhi120-c8-sparse-qualification
          if [ ! -f cloud-pll-rhi120-c8-sparse-qualification/result.json ]; then
            printf '%s\n' '{"status":"FAIL_MISSING_OBSERVATION","native_activation_allowed":false}' > cloud-pll-rhi120-c8-sparse-qualification/result.json
          fi
          stem="pll-rhi120-c8-sparse-storage-qualification-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          cp cloud-pll-rhi120-c8-sparse-qualification/result.json "$stem.summary.json"
          python3 scripts/cloud_chunked_results.py --directory cloud-pll-rhi120-c8-sparse-qualification --stem "$stem"
          python3 - "$stem" <<'PYCODE'
          import json,subprocess,sys
          s=sys.argv[1];m=json.load(open(s+'.parts.json'))
          subprocess.run([sys.executable,'scripts/publish_cloud_results.py','--group','pll-rhi120-c8-sparse-storage-qualification',s+'.summary.json',s+'.parts.json',*[x['name']for x in m['parts']]],check=True)
          PYCODE
