name: ethernet-compatible-rc-cloud
on:
  push:
    branches: [codex/complete-open-work]
    paths: [.github/workflows/ethernet-compatible-rc-cloud.yml]
  workflow_dispatch:
    inputs:
      geometry_run:
        description: Completed passing preserved-route native geometry run
        type: string
        required: true
      geometry_summary:
        description: Exact published geometry summary SHA256
        type: string
        required: true
      geometry_parts:
        description: Exact published geometry archive manifest SHA256
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: ethernet-compatible-rc-${{ github.ref }}-${{ inputs.geometry_run }}
  cancel-in-progress: false
jobs:
  controls:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Compile exact preserved-route extraction controller
        run: python3 -m py_compile scripts/run_cloud_ethernet_compatible_rc.py
  fresh-rc:
    if: github.event_name == 'workflow_dispatch'
    needs: controls
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Restore pinned native extraction runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libfuse2
          python3 -m pip install numpy==2.3.3
          curl --fail --location --retry 4 https://github.com/librelane/librelane/releases/download/3.0.5/librelane-devshell-x86_64.AppImage -o "$RUNNER_TEMP/librelane.AppImage"
          echo "d6a349ec65be11456e96c4981d35f63ca34d3c85daf79a51e1ccb907bb5d7466  $RUNNER_TEMP/librelane.AppImage" | sha256sum --check
          chmod +x "$RUNNER_TEMP/librelane.AppImage"
          echo "CLOUD_APPIMAGE=$RUNNER_TEMP/librelane.AppImage" >> "$GITHUB_ENV"
      - name: Require actual geometry pass then extract fresh RC and measure all original endpoints
        env:
          GH_TOKEN: ${{ github.token }}
          GEOMETRY_RUN: ${{ inputs.geometry_run }}
          GEOMETRY_SUMMARY: ${{ inputs.geometry_summary }}
          GEOMETRY_PARTS: ${{ inputs.geometry_parts }}
        run: python3 scripts/run_cloud_ethernet_compatible_rc.py --geometry-run "$GEOMETRY_RUN" --geometry-summary "$GEOMETRY_SUMMARY" --geometry-parts "$GEOMETRY_PARTS"
      - name: Preserve full extraction and timing evidence including failures
        if: always()
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          root=cloud-ethernet-compatible-rc
          mkdir -p "$root"
          if [ ! -f "$root/result.json" ]; then
            printf '%s\n' '{"status":"FAIL_MISSING_REPORT","accepted":false}' > "$root/result.json"
          fi
          stem="ethernet-compatible-rc-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          cp "$root/result.json" "$stem.summary.json"
          python3 scripts/cloud_chunked_results.py --directory "$root" --stem "$stem"
          python3 - "$stem" <<'PYCODE'
          import json,subprocess,sys
          stem=sys.argv[1];manifest=stem+'.parts.json';m=json.load(open(manifest))
          subprocess.run([sys.executable,'scripts/publish_cloud_results.py','--group','ethernet-compatible-rc',stem+'.summary.json',manifest,*[p['name']for p in m['parts']]],check=True)
          PYCODE
      - name: Retain evidence after publication failure
        if: always() && steps.publish.outcome == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ethernet-compatible-rc-${{ github.run_id }}
          path: cloud-ethernet-compatible-rc/
          retention-days: 30
