# SPDX-License-Identifier: Apache-2.0
name: logical-native-archive-cloud
on:
  push:
    branches: [codex/complete-open-work]
    paths: [.github/workflows/logical-native-archive-cloud.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: logical-native-archive-${{ github.ref }}
  cancel-in-progress: false
jobs:
  qualification:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        case: [controls, native-prefix]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Compile source and install unchanged original-reader dependency
        run: |
          python3 -m py_compile scripts/cloud_logical_native_archive.py scripts/cloud_logical_native_archive_controls.py
          python3 -m pip install numpy==2.3.3
      - name: Qualify actual logical archive, unchanged source and failure rejection
        id: native
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/cloud_logical_native_archive_controls.py --case ${{ matrix.case }}
      - name: Preserve complete storage evidence and failures
        if: always()
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          root=cloud-logical-native-archive-${{ matrix.case }}
          mkdir -p "$root"
          if [ ! -f "$root/result.json" ]; then
            printf '%s\n' '{"status":"FAIL_MISSING_REPORT","full_capture_accepted":false,"full_phy_accepted":false}' > "$root/result.json"
          fi
          stem="logical-native-archive-${{ matrix.case }}-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          cp "$root/result.json" "$stem.summary.json"
          python3 scripts/cloud_chunked_results.py --directory "$root" --stem "$stem"
          python3 - "$stem" <<'PYCODE'
          import json,subprocess,sys
          stem=sys.argv[1];manifest=stem+'.parts.json';m=json.load(open(manifest))
          subprocess.run([sys.executable,'scripts/publish_cloud_results.py','--group','logical-native-archive-${{ matrix.case }}',stem+'.summary.json',manifest,*[p['name']for p in m['parts']]],check=True)
          PYCODE
      - name: Preserve failed cloud publication
        if: always() && steps.publish.outcome == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: logical-native-archive-${{ matrix.case }}
          path: cloud-logical-native-archive-${{ matrix.case }}/
          retention-days: 30

# Preserve the first failed upload and require exactly one publication attempt.
