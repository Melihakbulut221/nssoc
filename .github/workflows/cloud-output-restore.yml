name: cloud-output-restore
run-name: cloud-output-restore ${{ inputs.request_id || github.run_id }}
on:
  push:
    branches: ['codex/complete-open-work']
    paths:
      - .github/workflows/cloud-output-restore.yml
      - scripts/verify_cloud_output_restore.py
      - sw/tests/test_cloud_restore_hardlinks.py
  workflow_dispatch:
    inputs:
      request_id:
        description: Durable reconstruction request identifier
        type: string
        required: false
      archive_scope:
        description: Published archive family to reconstruct
        type: choice
        options: [all, outputs, pnr-runs]
        default: all
permissions:
  contents: read
jobs:
  reconstruct:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        group: [0, 1, 2, 3]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify hardlink restoration and reject corrupt targets
        run: |
          python3 -m pip install pytest==8.4.2
          python3 -m pytest -q sw/tests/test_cloud_restore_hardlinks.py sw/tests/test_cloud_output_migration.py
      - name: Reconstruct every original byte from complete published batches
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/verify_cloud_output_restore.py --group '${{ matrix.group }}' --archive-scope '${{ inputs.archive_scope || 'all' }}'
      - name: Preserve readback results
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          archive='cloud-output-restore-${{ matrix.group }}-${{ github.run_id }}-${{ github.run_attempt }}.tar.gz'
          tar -czf "$archive" cloud-output-restore
          sha256sum "$archive" > "$archive.sha256"
          python3 scripts/publish_cloud_results.py --group 'restore-${{ matrix.group }}' "$archive" "$archive.sha256"
