# SPDX-License-Identifier: Apache-2.0
name: cdr-readonly-source-validation-cloud
on:
  push:
    branches: [codex/complete-open-work]
    paths: [.github/workflows/cdr-readonly-source-validation-cloud.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  readonly-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install pinned parser dependency
        run: python3 -m pip install numpy==2.3.3
      - name: Validate every distinct original checker and reject three real source corruptions
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 scripts/prove_cdr_readonly_source_validation.py
      - name: Publish proof and rejected cases
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          root=cloud-cdr-readonly-source-validation
          mkdir -p "$root"
          if [ ! -f "$root/result.json" ]; then printf '%s\n' '{"status":"FAIL_MISSING_REPORT","native_started":false}' > "$root/result.json"; fi
          stem="cdr-readonly-source-validation-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          cp "$root/result.json" "$stem.summary.json"
          python3 scripts/cloud_chunked_results.py --directory "$root" --stem "$stem"
          python3 - "$stem" <<'PYCODE'
          import json,subprocess,sys
          s=sys.argv[1];m=json.load(open(s+'.parts.json'))
          subprocess.run([sys.executable,'scripts/publish_cloud_results.py','--group','cdr-readonly-source-validation',s+'.summary.json',s+'.parts.json',*[p['name']for p in m['parts']]],check=True)
          PYCODE
