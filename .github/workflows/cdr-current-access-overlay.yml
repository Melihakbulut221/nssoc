name: Existing CDR capture replay with complete cloud evidence
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Source controls or replay two existing rejected captures; no new simulation
        type: choice
        required: true
        default: controls
        options: [controls, readback]
permissions:
  contents: read
  actions: read
concurrency:
  group: cdr-drain-wave-replay-${{ github.ref }}
  cancel-in-progress: false
env:
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  source-controls:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Bind complete exact source for hosted replay
        run: |
          python3 -B - <<'PY'
          import ast,hashlib,json,os,subprocess
          from pathlib import Path
          e=os.environ
          assert e['GITHUB_REPOSITORY']=='Melihakbulut221/nssoc'
          assert e['GITHUB_EVENT_NAME']=='workflow_dispatch' and e['GITHUB_RUN_ATTEMPT']=='1'
          assert e['GITHUB_REF']=='refs/heads/codex/cdr-drain-m1-loaded-electrical'
          assert subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()==e['GITHUB_SHA']
          raw=Path('scripts/cdr-drain-m1-wave-replay-source-pins.json').read_bytes()
          assert hashlib.sha256(raw).hexdigest()=='744e473c9d45fd533a949e0cf95193644685f18fb7206080cc28624cf8c40e38'
          m=json.loads(raw);assert len(m['files'])==73 and m['readback_authorized'] is True
          for name,pin in m['files'].items():
              p=Path(name);assert p.is_file() and not p.is_symlink()
              b=p.read_bytes();assert len(b)==pin['bytes'] and hashlib.sha256(b).hexdigest()==pin['sha256']
          c=json.loads(Path('scripts/cdr-drain-m1-wave-replay-inputs.json').read_bytes())
          assert c['source_controls_authorized'] is True and c['readback_authorized'] is True
          for name in ('scripts/cloud_cdr_drain_m1_wave_replay.py','scripts/check_cdr_drain_m1_wave_replay.py','scripts/publish_cdr_drain_wave_replay.py','scripts/check_cdr_drain_wave_publication.py'):ast.parse(Path(name).read_text())
          out=Path('cdr-drain-wave-source-controls');out.mkdir()
          (out/'context.json').write_text(json.dumps(dict(source=e['GITHUB_SHA'],run_id=int(e['GITHUB_RUN_ID']),attempt=1,native_acquisition=False,readback_authorized=True,pins=m['files']),sort_keys=True,indent=2)+'\n')
          PY
      - name: Install exact original numerical runtime for synthetic source controls
        run: python3 -B -m pip install --disable-pip-version-check --no-cache-dir numpy==2.3.3
      - name: Exercise original parser, measurements, refusals and failure preservation on synthetic inputs
        run: python3 -B scripts/check_cdr_drain_m1_wave_replay.py --output cdr-drain-wave-source-controls/controls.json > cdr-drain-wave-source-controls/controls.stdout 2> cdr-drain-wave-source-controls/controls.stderr
      - name: Require complete actual source controls
        run: |
          python3 -B - <<'PY'
          import json,os
          from pathlib import Path
          r=json.loads(Path('cdr-drain-wave-source-controls/controls.json').read_bytes())
          assert r['status']=='PASS_DRAIN_M1_WAVE_REPLAY_SOURCE_CONTROLS' and r['passed'] is True
          assert r['counts']==dict(groups=8,refusals=47,lifecycle=4) and r['failures']==[]
          assert r['completed_groups']==['source','metadata','live','archives','raw','binding_scalar','full_rows','lifecycle']
          assert r['current_context']==dict(source=os.environ['GITHUB_SHA'],run_id=int(os.environ['GITHUB_RUN_ID']),attempt=1,source_controls_only=True,native_executed=False)
          assert r['actual_capture_replayed'] is False and r['native_executed'] is False and r['physical_acceptance'] is False
          PY
      - name: Exercise complete archive publication and failure retention on synthetic outputs
        run: python3 -B scripts/check_cdr_drain_wave_publication.py --output cdr-drain-wave-source-controls/publication-controls.json > cdr-drain-wave-source-controls/publication-controls.stdout 2> cdr-drain-wave-source-controls/publication-controls.stderr
      - name: Require complete publication controls
        run: |
          python3 -B - <<'PY'
          import json,os
          from pathlib import Path
          r=json.loads(Path('cdr-drain-wave-source-controls/publication-controls.json').read_bytes())
          assert r['status']=='PASS_COMPLETE_REPLAY_PUBLICATION_CONTROLS' and r['passed'] is True
          assert r['counts']==dict(positive=7,refusals=33,lifecycle=4)
          assert r['current_context']['source']==os.environ['GITHUB_SHA']
          assert r['current_context']['run']==int(os.environ['GITHUB_RUN_ID']) and r['current_context']['attempt']==1
          assert r['synthetic_inputs_only'] is True
          assert all(r[k] is False for k in ('actual_native_capture_acquired','actual_release_mutated','physical_acceptance','timing_accepted','full_phy_accepted'))
          PY
      - name: Always preserve complete source records
        if: always()
        run: |
          python3 -B - <<'PY'
          import base64,hashlib,json
          from pathlib import Path
          for name in ('context.json','controls.json','controls.stdout','controls.stderr','publication-controls.json','publication-controls.stdout','publication-controls.stderr'):
              p=Path('cdr-drain-wave-source-controls')/name
              assert not p.is_symlink()
              raw=p.read_bytes() if p.is_file() else b''
              pieces=[raw[i:i+6000] for i in range(0,len(raw),6000)]
              print('CDR_DRAIN_WAVE_SOURCE_INDEX '+json.dumps(dict(path=name,present=p.is_file(),bytes=len(raw),sha256=hashlib.sha256(raw).hexdigest(),chunks=len(pieces)),sort_keys=True))
              for i,b in enumerate(pieces):
                  print('CDR_DRAIN_WAVE_SOURCE_CHUNK '+json.dumps(dict(path=name,index=i,base64=base64.b64encode(b).decode()),sort_keys=True))
          PY
      - name: Preserve full outputs including failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cdr-drain-wave-source-controls-${{ github.run_id }}-${{ github.run_attempt }}
          path: cdr-drain-wave-source-controls
          if-no-files-found: error
          retention-days: 90
  preserve-job-log:
    needs: source-controls
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Preserve full actual source job log and metadata
        run: |
          python3 -B - <<'PY'
          import hashlib,json,os,subprocess
          from pathlib import Path
          root=Path('job-logs');root.mkdir()
          e=os.environ
          assert e['GITHUB_REPOSITORY']=='Melihakbulut221/nssoc' and e['GITHUB_RUN_ATTEMPT']=='1'
          prefix='repos/'+e['GITHUB_REPOSITORY']+'/'
          def read(path,name):
              b=subprocess.check_output(['gh','api',prefix+path]);(root/name).write_bytes(b);return json.loads(b)
          run=read('actions/runs/'+e['GITHUB_RUN_ID'],'run.json')
          assert run['head_sha']==e['GITHUB_SHA'] and run['run_attempt']==1
          jobs=read('actions/runs/'+e['GITHUB_RUN_ID']+'/attempts/1/jobs?per_page=100','jobs.json')
          selected=[j for j in jobs['jobs'] if j['name']=='source-controls'];assert len(selected)==1
          listed=selected[0]
          j=read('actions/jobs/'+str(listed['id']),'job.json')
          assert j['id']==listed['id'] and j['name']=='source-controls'
          assert j['head_sha']==e['GITHUB_SHA'] and j['run_id']==int(e['GITHUB_RUN_ID'])
          b=subprocess.check_output(['gh','api','--allow-escape-sequences',prefix+'actions/jobs/'+str(j['id'])+'/logs'])
          assert b;(root/'job.log').write_bytes(b)
          receipt=dict(source=e['GITHUB_SHA'],run_id=int(e['GITHUB_RUN_ID']),attempt=1,
            job_id=j['id'],job_conclusion=j['conclusion'],api_status=j['status'],api_metadata_claims_terminal=j['status']=='completed',execution_dependency_finished=True,full_raw_job_log=True,
            log_bytes=len(b),log_sha256=hashlib.sha256(b).hexdigest(),native_acquisition=False)
          (root/'receipt.json').write_text(json.dumps(receipt,sort_keys=True,indent=2)+'\n')
          print(json.dumps(receipt,sort_keys=True))
          PY
      - name: Preserve complete actual logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cdr-drain-wave-source-job-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: job-logs
          if-no-files-found: error
          retention-days: 90

  readback:
    needs: [source-controls, preserve-job-log]
    if: ${{ inputs.mode == 'readback' }}
    permissions:
      contents: write
      actions: read
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        case: [nominal_early, constant_one]
    env:
      REPLAY_CASE: ${{ matrix.case }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Bind complete exact source before acquisition
        id: bind
        run: |
          python3 -B - <<'PY'
          import ast,hashlib,json,os,subprocess
          from pathlib import Path
          e=os.environ
          assert e['GITHUB_REPOSITORY']=='Melihakbulut221/nssoc'
          assert e['GITHUB_EVENT_NAME']=='workflow_dispatch' and e['GITHUB_RUN_ATTEMPT']=='1'
          assert e['GITHUB_REF']=='refs/heads/codex/cdr-drain-m1-loaded-electrical'
          assert subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()==e['GITHUB_SHA']
          raw=Path('scripts/cdr-drain-m1-wave-replay-source-pins.json').read_bytes()
          assert hashlib.sha256(raw).hexdigest()=='744e473c9d45fd533a949e0cf95193644685f18fb7206080cc28624cf8c40e38'
          m=json.loads(raw);assert len(m['files'])==73 and m['readback_authorized'] is True
          for name,pin in m['files'].items():
              p=Path(name);assert p.is_file() and not p.is_symlink()
              b=p.read_bytes();assert len(b)==pin['bytes'] and hashlib.sha256(b).hexdigest()==pin['sha256']
          c=json.loads(Path('scripts/cdr-drain-m1-wave-replay-inputs.json').read_bytes())
          assert c['source_controls_authorized'] is True and c['readback_authorized'] is True
          for name in ('scripts/cloud_cdr_drain_m1_wave_replay.py','scripts/check_cdr_drain_m1_wave_replay.py','scripts/publish_cdr_drain_wave_replay.py','scripts/check_cdr_drain_wave_publication.py'):ast.parse(Path(name).read_text())
          out=Path('cdr-drain-wave-source-controls');out.mkdir()
          Path('replay-bundle').mkdir()
          (out/'context.json').write_text(json.dumps(dict(source=e['GITHUB_SHA'],run_id=int(e['GITHUB_RUN_ID']),attempt=1,native_acquisition=False,readback_authorized=True,pins=m['files']),sort_keys=True,indent=2)+'\n')
          PY
      - name: Require independently reserved empty exact-source release
        id: reservation
        run: |
          python3 -B - <<'PY'
          import json,os,subprocess,time
          from pathlib import Path
          e=os.environ;tag='cloud-results-'+e['GITHUB_RUN_ID']+'-1-cdr-drain-m1-wave-replay-'+e['REPLAY_CASE']
          prefix='repos/Melihakbulut221/nssoc/'
          for attempt in range(120):
              r=subprocess.run(['gh','api',prefix+'releases/tags/'+tag],capture_output=True,text=True)
              if r.returncode==0:
                  d=json.loads(r.stdout);break
              assert 'HTTP 404' in r.stderr,r.stderr
              time.sleep(2)
          else:raise RuntimeError('Independent reservation absent; archive acquisition prohibited')
          ref=json.loads(subprocess.check_output(['gh','api',prefix+'git/ref/tags/'+tag]))
          assert d['tag_name']==tag and d['target_commitish']==e['GITHUB_SHA']
          assert d['draft'] is False and d['prerelease'] is True and d['assets']==[]
          assert ref['object']['type']=='commit' and ref['object']['sha']==e['GITHUB_SHA']
          proof=dict(tag=tag,tested_source=e['GITHUB_SHA'],release_id=d['id'],existing_assets=[],target_verified=True,assets_overwritten=False,externally_reserved=True,creation_attempted=False,read_attempts=attempt+1)
          Path('replay-bundle/release-reservation.json').write_text(json.dumps(proof,sort_keys=True,indent=2)+'\n')
          PY
      - name: Install exact original numerical runtime for synthetic source controls
        run: python3 -B -m pip install --disable-pip-version-check --no-cache-dir numpy==2.3.3
      - name: Exercise original parser, measurements, refusals and failure preservation on synthetic inputs
        run: python3 -B scripts/check_cdr_drain_m1_wave_replay.py --output cdr-drain-wave-source-controls/controls.json > cdr-drain-wave-source-controls/controls.stdout 2> cdr-drain-wave-source-controls/controls.stderr
      - name: Require complete actual source controls
        run: |
          python3 -B - <<'PY'
          import json,os
          from pathlib import Path
          r=json.loads(Path('cdr-drain-wave-source-controls/controls.json').read_bytes())
          assert r['status']=='PASS_DRAIN_M1_WAVE_REPLAY_SOURCE_CONTROLS' and r['passed'] is True
          assert r['counts']==dict(groups=8,refusals=47,lifecycle=4) and r['failures']==[]
          assert r['completed_groups']==['source','metadata','live','archives','raw','binding_scalar','full_rows','lifecycle']
          assert r['current_context']==dict(source=os.environ['GITHUB_SHA'],run_id=int(os.environ['GITHUB_RUN_ID']),attempt=1,source_controls_only=True,native_executed=False)
          assert r['actual_capture_replayed'] is False and r['native_executed'] is False and r['physical_acceptance'] is False
          PY
      - name: Exercise complete archive publication and failure retention on synthetic outputs
        run: python3 -B scripts/check_cdr_drain_wave_publication.py --output cdr-drain-wave-source-controls/publication-controls.json > cdr-drain-wave-source-controls/publication-controls.stdout 2> cdr-drain-wave-source-controls/publication-controls.stderr
      - name: Require complete publication controls
        run: |
          python3 -B - <<'PY'
          import json,os
          from pathlib import Path
          r=json.loads(Path('cdr-drain-wave-source-controls/publication-controls.json').read_bytes())
          assert r['status']=='PASS_COMPLETE_REPLAY_PUBLICATION_CONTROLS' and r['passed'] is True
          assert r['counts']==dict(positive=7,refusals=33,lifecycle=4)
          assert r['current_context']['source']==os.environ['GITHUB_SHA']
          assert r['current_context']['run']==int(os.environ['GITHUB_RUN_ID']) and r['current_context']['attempt']==1
          assert r['synthetic_inputs_only'] is True
          assert all(r[k] is False for k in ('actual_native_capture_acquired','actual_release_mutated','physical_acceptance','timing_accepted','full_phy_accepted'))
          PY
      - name: Replay authenticated existing capture on hosted runner
        id: replay
        run: python3 -B scripts/cloud_cdr_drain_m1_wave_replay.py --readback --case "$REPLAY_CASE" --output replay-bundle/derived --reservation replay-bundle/release-reservation.json --controls-proof cdr-drain-wave-source-controls/controls.json > replay-bundle/reader.stdout 2> replay-bundle/reader.stderr
      - name: Always retain repeated controls and source context
        if: always()
        run: |
          python3 -B - <<'PY'
          import json,os,shutil
          from pathlib import Path
          out=Path('replay-bundle');out.mkdir(exist_ok=True)
          controls=Path('cdr-drain-wave-source-controls')
          if controls.is_dir():shutil.copytree(controls,out/'source-controls')
          names=['scripts/cloud_cdr_drain_m1_wave_replay.py','scripts/check_cdr_drain_m1_wave_replay.py','scripts/publish_cdr_drain_wave_replay.py','scripts/check_cdr_drain_wave_publication.py','scripts/cloud_chunked_results.py','scripts/cdr-drain-m1-wave-replay-inputs.json','scripts/cdr-drain-m1-wave-replay-source-pins.json','.github/workflows/cdr-current-access-overlay.yml']
          for name in names:
              src=Path(name)
              if src.is_file() and not src.is_symlink():
                  dst=out/'tested-source'/name;dst.parent.mkdir(parents=True,exist_ok=True);shutil.copyfile(src,dst)
          (out/'workflow-context.json').write_text(json.dumps(dict(source=os.environ['GITHUB_SHA'],run=int(os.environ['GITHUB_RUN_ID']),attempt=1,case=os.environ['REPLAY_CASE'],physical_acceptance=False,timing_accepted=False,full_phy_accepted=False),sort_keys=True,indent=2)+'\n')
          PY
      - name: Always emit complete ordinary replay evidence
        if: always()
        run: |
          python3 -B - <<'PY'
          import sys
          from pathlib import Path
          for name in ('reader.stdout','reader.stderr'):
              p=Path('replay-bundle')/name
              if p.is_file():
                  with p.open('rb') as f:
                      while b:=f.read(65536):sys.stdout.buffer.write(b)
                  sys.stdout.buffer.write(b'\n')
          PY
      - name: Preserve full derived outputs before release publication
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cdr-drain-wave-replay-full-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.case }}
          path: replay-bundle
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
      - name: Publish complete success or failure evidence to reserved release
        if: ${{ always() && steps.bind.outcome == 'success' && steps.reservation.outcome == 'success' }}
        run: python3 -B scripts/publish_cdr_drain_wave_replay.py --case "$REPLAY_CASE" --output replay-bundle --publication replay-publication --reservation replay-bundle/release-reservation.json > replay-publication.stdout 2> replay-publication.stderr
      - name: Always emit full publication outcome
        if: always()
        run: |
          python3 -B - <<'PY'
          import base64,hashlib,json,sys
          from pathlib import Path
          for name in ('replay-publication.stdout','replay-publication.stderr'):
              p=Path(name)
              if p.is_file():sys.stdout.buffer.write(p.read_bytes()+b'\n')
          out=Path('replay-publication')
          if out.is_dir():
              for p in sorted(out.rglob('*')):
                  if not p.is_file():continue
                  if '.tar.gz.part' in p.name:continue
                  b=p.read_bytes();parts=[b[i:i+6000]for i in range(0,len(b),6000)]
                  print('CDR_DRAIN_PUBLICATION_INDEX '+json.dumps(dict(path=p.relative_to(out).as_posix(),bytes=len(b),sha256=hashlib.sha256(b).hexdigest(),chunks=len(parts)),sort_keys=True),flush=True)
                  for i,raw in enumerate(parts):print('CDR_DRAIN_PUBLICATION_CHUNK '+json.dumps(dict(path=p.relative_to(out).as_posix(),index=i,base64=base64.b64encode(raw).decode()),sort_keys=True),flush=True)
          PY
      - name: Preserve full publication streams and partial transport
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cdr-drain-wave-publication-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.case }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
          path: |
            replay-publication
            replay-publication.stdout
            replay-publication.stderr
  preserve-replay-job-logs:
    needs: [source-controls, preserve-job-log, readback]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Preserve every finished dependency raw log
        run: |
          python3 -B - <<'PY'
          import hashlib,json,os,subprocess
          from pathlib import Path
          root=Path('replay-job-logs');root.mkdir()
          e=os.environ;prefix='repos/'+e['GITHUB_REPOSITORY']+'/'
          assert e['GITHUB_REPOSITORY']=='Melihakbulut221/nssoc' and e['GITHUB_RUN_ATTEMPT']=='1'
          def read(path,name):
              b=subprocess.check_output(['gh','api',prefix+path]);(root/name).write_bytes(b);return json.loads(b)
          run=read('actions/runs/'+e['GITHUB_RUN_ID'],'run.json')
          assert run['head_sha']==e['GITHUB_SHA'] and run['run_attempt']==1
          jobs=read('actions/runs/'+e['GITHUB_RUN_ID']+'/attempts/1/jobs?per_page=100','jobs.json')
          receipts=[]
          names=('source-controls','preserve-job-log','readback','readback (nominal_early)','readback (constant_one)')
          selected=[j for j in jobs['jobs'] if j['name'] in names]
          assert len(selected) in (3,4)
          for row in selected:
              j=read('actions/jobs/'+str(row['id']),str(row['id'])+'.json')
              assert j['head_sha']==e['GITHUB_SHA'] and j['run_id']==int(e['GITHUB_RUN_ID'])
              if j['conclusion']=='skipped':
                  receipts.append(dict(id=j['id'],name=j['name'],skipped=True));continue
              b=subprocess.check_output(['gh','api','--allow-escape-sequences',prefix+'actions/jobs/'+str(j['id'])+'/logs'])
              assert b;(root/(str(j['id'])+'.log')).write_bytes(b)
              receipts.append(dict(id=j['id'],name=j['name'],api_status=j['status'],api_conclusion=j['conclusion'],dependency_finished=True,full_raw_job_log=True,bytes=len(b),sha256=hashlib.sha256(b).hexdigest()))
          (root/'receipt.json').write_text(json.dumps(dict(source=e['GITHUB_SHA'],run_id=int(e['GITHUB_RUN_ID']),attempt=1,jobs=receipts),sort_keys=True,indent=2)+'\n')
          print(json.dumps(receipts,sort_keys=True))
          PY
      - name: Preserve full dependency logs including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cdr-drain-wave-replay-job-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: replay-job-logs
          if-no-files-found: error
          retention-days: 90
