  preserve-native-job-logs:
    needs: [source-controls, preserve-job-log, prepare, loaded]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Preserve every terminal actual job log including failed cases
        run: |
          python3 -B - <<'PY'
          import hashlib,json,os,subprocess,traceback
          from pathlib import Path
          root=Path('all-job-logs');root.mkdir()
          e=os.environ;prefix='repos/'+e['GITHUB_REPOSITORY']+'/'
          assert e['GITHUB_REPOSITORY']=='Melihakbulut221/nssoc' and e['GITHUB_RUN_ATTEMPT']=='1'
          def read(path):return subprocess.check_output(['gh','api','--allow-escape-sequences',prefix+path])
          raw=read('actions/runs/'+e['GITHUB_RUN_ID']);run=json.loads(raw);(root/'run.json').write_bytes(raw)
          assert run['head_sha']==e['GITHUB_SHA'] and run['run_attempt']==1
          raw=read('actions/runs/'+e['GITHUB_RUN_ID']+'/attempts/1/jobs?per_page=100')
          jobs=json.loads(raw);(root/'jobs.json').write_bytes(raw)
          assert len(jobs['jobs'])==jobs['total_count']<=20
          rows=[];errors=[]
          for j in jobs['jobs']:
              if j['name']=='preserve-native-job-logs':continue
              assert j['status']=='completed' and j['head_sha']==e['GITHUB_SHA']
              if j['conclusion']=='skipped':continue
              try:
                  raw=read('actions/jobs/'+str(j['id'])+'/logs');assert raw
                  (root/('job-'+str(j['id'])+'.log')).write_bytes(raw)
                  rows.append(dict(id=j['id'],name=j['name'],conclusion=j['conclusion'],bytes=len(raw),sha256=hashlib.sha256(raw).hexdigest()))
              except BaseException as error:
                  errors.append(dict(id=j['id'],name=j['name'],error=repr(error),traceback=traceback.format_exc()))
          receipt=dict(source=e['GITHUB_SHA'],run=run['id'],attempt=1,records=rows,errors=errors,full_raw_logs=True,native_acquisition=False)
          (root/'receipt.json').write_text(json.dumps(receipt,sort_keys=True,indent=2)+'\n')
          print(json.dumps(receipt))
          assert not errors
          PY
      - name: Retain complete actual logs and any collector failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cdr-current-eight-drain-loaded-all-job-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: all-job-logs
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
