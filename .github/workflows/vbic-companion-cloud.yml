name: vbic-companion-cloud
on:
  push:
    branches: [codex/complete-open-work]
    paths: [.github/workflows/vbic-companion-cloud.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: vbic-companion-${{ github.ref }}
  cancel-in-progress: false
jobs:
  source-paired-native-counterexample:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install build tools and source-pinned packaged control
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends build-essential autoconf automake libtool bison flex libreadline-dev libncurses-dev libsndfile1 libsamplerate0 libxaw7 libxt6 libxft2 libfontconfig1
          python3 -m pip install numpy==2.3.3
          mkdir -p cloud-vbic-companion/runtime
          curl --fail --location --retry 4 'https://deb.debian.org/debian/pool/main/n/ngspice/ngspice_47+ds-1~bpo13+1_amd64.deb' -o "$RUNNER_TEMP/ngspice.deb"
          echo "400d2ebaefc1dcaaaf9693ac4731535d910fa2c0544552736970aa9ebaad760b  $RUNNER_TEMP/ngspice.deb" | sha256sum --check
          dpkg-deb -x "$RUNNER_TEMP/ngspice.deb" "$RUNNER_TEMP/packaged"
          echo "eaca52dad06845779fed4f50420a6a0cf4a32776e6a572432275f350002b87b8  $RUNNER_TEMP/packaged/usr/bin/ngspice" | sha256sum --check
          cp "$RUNNER_TEMP/packaged/usr/bin/ngspice" cloud-vbic-companion/runtime/packaged-ngspice
      - name: Measure original packaged constant-bias error and zero-charge controls
        run: python3 scripts/cloud_vbic_companion.py --variant packaged --exe cloud-vbic-companion/runtime/packaged-ngspice
      - name: Build exact pristine upstream revision
        run: |
          set -o pipefail
          git init "$RUNNER_TEMP/ngspice-source"
          git -C "$RUNNER_TEMP/ngspice-source" remote add origin https://github.com/imr/ngspice.git
          git -C "$RUNNER_TEMP/ngspice-source" fetch --depth 1 origin a80f6e3e95d51534905b1f23410a951802666656
          git -C "$RUNNER_TEMP/ngspice-source" checkout --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/ngspice-source" rev-parse HEAD)" = a80f6e3e95d51534905b1f23410a951802666656
          echo "ae2fca22ca7178bce26f31b4e433307945cafa9d8661d55007eed8fc096ff866  $RUNNER_TEMP/ngspice-source/src/spicelib/devices/vbic/vbicload.c" | sha256sum --check
          git -C "$RUNNER_TEMP/ngspice-source" archive HEAD | gzip > cloud-vbic-companion/upstream-source.tar.gz
          (cd "$RUNNER_TEMP/ngspice-source" && ./autogen.sh) 2>&1 | tee cloud-vbic-companion/autogen.log
          mkdir "$RUNNER_TEMP/ngspice-build"
          (cd "$RUNNER_TEMP/ngspice-build" && "$RUNNER_TEMP/ngspice-source/configure" --without-x --with-readline=no --disable-openmp CFLAGS='-O2 -fno-fast-math -ffp-contract=off') 2>&1 | tee cloud-vbic-companion/configure.log
          make -C "$RUNNER_TEMP/ngspice-build" -j2 2>&1 | tee cloud-vbic-companion/build-pristine.log
          cp "$RUNNER_TEMP/ngspice-build/src/ngspice" cloud-vbic-companion/runtime/pristine-ngspice
          gcc --version > cloud-vbic-companion/compiler.txt
          cp "$RUNNER_TEMP/ngspice-build/config.log" cloud-vbic-companion/config.log
      - name: Verify same error using pristine source build
        run: python3 scripts/cloud_vbic_companion.py --variant pristine --exe cloud-vbic-companion/runtime/pristine-ngspice
      - name: Apply only the charge companion RHS correction and rebuild
        run: |
          set -o pipefail
          python3 scripts/cloud_vbic_companion.py --patch "$RUNNER_TEMP/ngspice-source/src/spicelib/devices/vbic/vbicload.c"
          git -C "$RUNNER_TEMP/ngspice-source" diff -- src/spicelib/devices/vbic/vbicload.c > cloud-vbic-companion/companion.patch
          make -C "$RUNNER_TEMP/ngspice-build" -j2 2>&1 | tee cloud-vbic-companion/build-patched.log
          cp "$RUNNER_TEMP/ngspice-build/src/ngspice" cloud-vbic-companion/runtime/patched-ngspice
      - name: Measure patched result with identical native decks
        run: python3 scripts/cloud_vbic_companion.py --variant patched --exe cloud-vbic-companion/runtime/patched-ngspice
      - name: Compare controls and record remaining limitations
        run: python3 scripts/cloud_vbic_companion.py --compare
      - name: Preserve both runtimes, source, patch and every native observation
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p cloud-vbic-companion
          if [ ! -f cloud-vbic-companion/result.json ]; then
            printf '%s\n' '{"status":"FAIL_INCOMPLETE_RUNTIME_COMPARISON","accepted":false}' > cloud-vbic-companion/result.json
          fi
          archive="vbic-companion-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.tar.gz"
          tar -czf "$archive" cloud-vbic-companion
          sha256sum "$archive" > "$archive.sha256"
          cp cloud-vbic-companion/result.json "${archive%.tar.gz}.summary.json"
          python3 scripts/publish_cloud_results.py --group vbic-companion "$archive" "$archive.sha256" "${archive%.tar.gz}.summary.json"
