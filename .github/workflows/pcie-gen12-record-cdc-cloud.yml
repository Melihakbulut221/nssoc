# Registration only; not RTL qualification.
name: PCIe record CDC registration only
on:
  push:
    branches: [codex/gen12-record-cdc-register]
    paths: [.github/workflows/pcie-gen12-record-cdc-cloud.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  registration-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - name: Register workflow path only
        run: printf '%s\n' 'Registration only. No checkout, source inputs, RTL or native qualification.'
