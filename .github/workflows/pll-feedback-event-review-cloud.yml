name: pll-feedback-event-review-cloud
on:
  push:
    branches: [codex/pll-feedback-cycle-diagnosis]
    paths: [.github/workflows/pll-feedback-event-review-cloud.yml, scripts/cloud_pll_feedback_event_review.py, scripts/pll-feedback-event-review-methods.json]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: pll-existing-cache-event-review
  cancel-in-progress: false
jobs:
  controls:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify source, original rejection, finite event ordering and half-open timing controls
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -m pip install numpy==2.3.3
          python3 scripts/cloud_pll_feedback_event_review.py --controls
  review:
    if: github.event_name == 'workflow_dispatch' && github.ref_name == 'codex/pll-feedback-cycle-diagnosis'
    needs: controls
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Revalidate exact existing cloud cache and diagnose every divider transition
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -m pip install numpy==2.3.3
          python3 scripts/cloud_pll_feedback_event_review.py --review
      - name: Preserve event evidence without duplicating original native waveform
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p cloud-pll-feedback-event-review
          if [ ! -f cloud-pll-feedback-event-review/result.json ]; then
            printf '%s\n' '{"status":"FAIL_MISSING_EVENT_REPORT","acquisition_accepted":false,"full_phy_accepted":false}' > cloud-pll-feedback-event-review/result.json
          fi
          stem="pll-feedback-event-review-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          cp cloud-pll-feedback-event-review/result.json "$stem.summary.json"
          python3 scripts/cloud_chunked_results.py --directory cloud-pll-feedback-event-review --stem "$stem"
          python3 - "$stem" <<'PYCODE'
          import json,subprocess,sys
          s=sys.argv[1];m=json.load(open(s+'.parts.json'))
          subprocess.run([sys.executable,'scripts/publish_cloud_results.py','--group','pll-feedback-event-review',s+'.summary.json',s+'.parts.json',*[x['name']for x in m['parts']]],check=True)
          PYCODE
