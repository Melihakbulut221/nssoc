# SPDX-License-Identifier: Apache-2.0
name: tx-role-parameter-failure-readback-cloud
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
defaults:
  run:
    shell: bash
concurrency:
  group: tx-role-parameter-failure-readback
  cancel-in-progress: false
jobs:
  controls:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Validate failed metadata and 27 transport and rejection corruptions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/read_tx_role_parameter_failure.py --controls
          python3 - <<'PYCODE'
          import json
          s=json.load(open('cloud-tx-role-parameter-failure-readback/result.json'))
          assert s['status']=='PASS_EXACT_FAILED_METADATA_AND27_CORRUPTIONS'
          assert len(s['faults'])==27 and all(x['rejected']for x in s['faults'])
          assert all(s[k]is False for k in ('native_execution','native_role_accepted','electrical_accepted','full_phy_accepted'))
          PYCODE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: role-parameter-failure-controls
          path: cloud-tx-role-parameter-failure-readback/
          if-no-files-found: error
  readback:
    needs: controls
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Authenticate the exact 24447-byte artifact and preserve original failure
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/read_tx_role_parameter_failure.py
          python3 - <<'PYCODE'
          import json
          s=json.load(open('cloud-tx-role-parameter-failure-readback/result.json'))
          assert s['status']=='PASS_EXACT_REJECTED_OBSERVER_LOG_READBACK_NOT_ROLE_ACCEPTANCE'
          assert s['original_rejection_unchanged'] and len(s['members'])==5
          assert all(s[k]is False for k in ('native_execution','native_role_accepted','electrical_accepted','full_phy_accepted'))
          PYCODE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: exact-role-parameter-failure
          path: cloud-tx-role-parameter-failure-readback/
          if-no-files-found: error
          retention-days: 90
