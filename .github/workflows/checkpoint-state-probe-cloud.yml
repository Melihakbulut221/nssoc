# Use default checkpoint storage and host network for the documented Docker28 restore limitations.
name: checkpoint-state-probe-cloud
on:
  push:
    branches: [codex/complete-open-work]
    paths: [.github/workflows/checkpoint-state-probe-cloud.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checkpoint-state-probe-${{ github.ref }}
  cancel-in-progress: false
jobs:
  isolated-process-checkpoint:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install cloud-only checkpoint dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends build-essential pkg-config libprotobuf-dev libprotobuf-c-dev protobuf-c-compiler protobuf-compiler python3-protobuf uuid-dev libbsd-dev libcap-dev libnet1-dev libnl-3-dev
          git init "$RUNNER_TEMP/criu-src"
          git -C "$RUNNER_TEMP/criu-src" remote add origin https://github.com/checkpoint-restore/criu.git
          git -C "$RUNNER_TEMP/criu-src" fetch --depth 1 origin 9539417f3e3cfa4eb84c319cd71f4d52f1f08645
          git -C "$RUNNER_TEMP/criu-src" checkout --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/criu-src" rev-parse HEAD)" = 9539417f3e3cfa4eb84c319cd71f4d52f1f08645
          make -C "$RUNNER_TEMP/criu-src" -j2 criu PYTHON=/usr/bin/python3 2>&1 | tee "$RUNNER_TEMP/criu-build.log"
          sudo install -m 755 "$RUNNER_TEMP/criu-src/criu/criu" /usr/sbin/criu
          python3 - <<'PYCODE'
          import hashlib,json,os,pathlib,subprocess
          p=pathlib.Path('/usr/sbin/criu')
          d=dict(source_repository='https://github.com/checkpoint-restore/criu',source_tag='v4.2.1',source_commit='9539417f3e3cfa4eb84c319cd71f4d52f1f08645',binary_sha256=hashlib.sha256(p.read_bytes()).hexdigest(),version=subprocess.check_output([str(p),'--version'],text=True),libraries=subprocess.check_output(['ldd',str(p)],text=True))
          (pathlib.Path(os.environ['RUNNER_TEMP'])/'criu-build.json').write_text(json.dumps(d,indent=2)+'\n')
          PYCODE
          python3 -m py_compile scripts/cloud_checkpoint_state_probe.py scripts/cloud_checkpoint_state_worker.py
      - name: Check exact state across restore into a separate container
        run: python3 scripts/cloud_checkpoint_state_probe.py
      - name: Preserve capability failures and complete checkpoint evidence
        if: always()
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p cloud-checkpoint-state-probe
          if [ -f "$RUNNER_TEMP/criu-build.log" ]; then cp "$RUNNER_TEMP/criu-build.log" cloud-checkpoint-state-probe/criu-build.log; fi
          if [ -f "$RUNNER_TEMP/criu-build.json" ]; then cp "$RUNNER_TEMP/criu-build.json" cloud-checkpoint-state-probe/criu-build.json; fi
          if [ ! -f cloud-checkpoint-state-probe/result.json ]; then
            printf '%s\n' '{"status":"FAIL_MISSING_REPORT","simulator_checkpoint_proven":false}' > cloud-checkpoint-state-probe/result.json
          fi
          stem="checkpoint-state-probe-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          cp cloud-checkpoint-state-probe/result.json "$stem.summary.json"
          python3 scripts/cloud_chunked_results.py --directory cloud-checkpoint-state-probe --stem "$stem"
          python3 - "$stem" <<'PYCODE'
          import json,subprocess,sys
          stem=sys.argv[1];manifest=stem+'.parts.json';m=json.load(open(manifest))
          subprocess.run([sys.executable,'scripts/publish_cloud_results.py','--group','checkpoint-state-probe',stem+'.summary.json',manifest,*[p['name']for p in m['parts']]],check=True)
          PYCODE
      - name: Retain evidence after publication failure
        if: always() && steps.publish.outcome == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: checkpoint-state-probe-${{ github.run_id }}
          retention-days: 30
          path: cloud-checkpoint-state-probe/
