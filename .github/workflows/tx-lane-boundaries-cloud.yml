# SPDX-License-Identifier: Apache-2.0
name: tx-lane-boundaries-cloud
on:
  push:
    branches: [codex/complete-open-work]
    paths: [.github/workflows/tx-lane-boundaries-cloud.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tx-lane-boundaries-${{ github.ref }}
  cancel-in-progress: false
jobs:
  inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Bind remaining physical boundaries to actual saved nominal deck
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/cloud_tx_lane_boundaries.py
      - name: Preserve actual source inventory and failures
        if: always()
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          root=cloud-tx-lane-boundaries
          mkdir -p "$root"
          if [ ! -f "$root/result.json" ]; then
            printf '%s\n' '{"status":"FAIL_MISSING_REPORT","full_phy_accepted":false}' > "$root/result.json"
          fi
          stem="tx-lane-boundaries-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          cp "$root/result.json" "$stem.summary.json"
          python3 scripts/cloud_chunked_results.py --directory "$root" --stem "$stem"
          python3 - "$stem" <<'PYCODE'
          import json,subprocess,sys
          stem=sys.argv[1];manifest=stem+'.parts.json';m=json.load(open(manifest))
          subprocess.run([sys.executable,'scripts/publish_cloud_results.py','--group','tx-lane-boundaries',stem+'.summary.json',manifest,*[p['name']for p in m['parts']]],check=True)
          PYCODE
      - name: Retain evidence if release publication fails
        if: always() && steps.publish.outcome == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tx-lane-boundaries-${{ github.run_id }}
          path: cloud-tx-lane-boundaries/
          retention-days: 30
