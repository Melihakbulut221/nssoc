name: tx-tree32-high3-pvt-cloud
on:
  push:
    branches: [codex/complete-open-work]
    paths: [.github/workflows/tx-tree32-high3-pvt-cloud.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tx-tree32-high3-pvt-${{ github.ref }}
  cancel-in-progress: false
jobs:
  controls:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Check exact physical scaling and malformed parameter rejection
        run: |
          python3 -m py_compile scripts/cloud_tx_tree32_budget.py
          python3 -m pip install numpy==2.3.3
          python3 - <<'PYCODE'
          import sys,json
          from fractions import Fraction
          sys.path.insert(0,'scripts')
          from cloud_tx_tree32_budget import resized,records,SOURCE
          original=SOURCE.read_text();source={r[0]:r for r in records(original)}
          proofs={}
          for nx in (1,2,3,4):
              text,proof=resized(original,nx)
              assert len(proof['actual_parameter_faults_rejected'])==4
              assert proof['emitters']==1+18*nx
              for row in records(text):
                  if 'rppd'not in row:continue
                  prior={k:Fraction(v[:-1])for k,v in (t.split('=')for t in source[row[0]][5:])if k in ('w','l')}
                  new={k:Fraction(v[:-1])for k,v in (t.split('=')for t in row[5:])if k in ('w','l')}
                  assert new['l']/new['w']/(prior['l']/prior['w'])==Fraction(8,nx)
              proofs[nx]=dict(emitters=proof['emitters'],faults=proof['actual_parameter_faults_rejected'])
          assert 28*19+2*55+77==719
          print(json.dumps(proofs))
          PYCODE
  native-full32:
    needs: controls
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        condition: [hot_low, cold_high]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Native simulator dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libsndfile1 libsamplerate0 libreadline8t64 libxaw7 libxt6 libxft2 libfontconfig1
          python3 -m pip install numpy==2.3.3
      - name: Measure unchanged full32 Nx3 circuit at fixed native PVT corners
        run: |
          python3 -m py_compile scripts/cloud_tx_tree32_budget.py
          python3 scripts/cloud_tx_tree32_budget.py --variant budget_high3 --fault none --condition ${{ matrix.condition }}
      - name: Preserve complete native captures and every failure
        if: always()
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          root=cloud-tx-tree32-budget-budget_high3-none-${{ matrix.condition }}
          mkdir -p "$root"
          if [ ! -f "$root/result.json" ]; then
            printf '%s\n' '{"status":"FAIL_MISSING_REPORT","accepted":false}' > "$root/result.json"
          fi
          stem="tx-tree32-high3-pvt-${{ matrix.condition }}-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          cp "$root/result.json" "$stem.summary.json"
          python3 scripts/cloud_chunked_results.py --directory "$root" --stem "$stem"
          python3 - "$stem" <<'PYCODE'
          import json,subprocess,sys
          stem=sys.argv[1];manifest=stem+'.parts.json';m=json.load(open(manifest))
          subprocess.run([sys.executable,'scripts/publish_cloud_results.py','--group','tx-tree32-high3-pvt-${{ matrix.condition }}',stem+'.summary.json',manifest,*[p['name']for p in m['parts']]],check=True)
          PYCODE
      - name: Retain evidence after publication failure
        if: always() && steps.publish.outcome == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tx-tree32-high3-pvt-${{ matrix.condition }}-${{ github.run_id }}
          path: cloud-tx-tree32-budget-budget_high3-none-${{ matrix.condition }}/
          retention-days: 30
