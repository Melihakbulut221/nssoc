name: regfile-corrpre-cloud
on:
  push:
    branches: [codex/complete-open-work]
    paths: [.github/workflows/regfile-corrpre-cloud.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: regfile-corrpre-${{ github.ref }}
  cancel-in-progress: false
jobs:
  native-paths:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: YosysHQ/setup-oss-cad-suite@aefa8397bbf8fc6670a0a62af9805a89738f3cde
        with:
          version: '2026-08-04'
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install pinned simulation and library inputs
        run: |
          python3 -m pip install cocotb==2.0.1
          git clone --filter=blob:none --no-checkout https://github.com/IHP-GmbH/IHP-Open-PDK.git "$RUNNER_TEMP/ihp-corrpre"
          git -C "$RUNNER_TEMP/ihp-corrpre" checkout c4b8b4e5e7a05f375cca3815d51b3a37721fbf5c -- ihp-sg13g2/libs.ref/sg13g2_stdcell/lib
          echo "CORRPRE_LIBDIR=$RUNNER_TEMP/ihp-corrpre/ihp-sg13g2/libs.ref/sg13g2_stdcell/lib" >> "$GITHUB_ENV"
      - name: Restore pinned native CAD runtime
        run: |
          python3 -m py_compile scripts/cloud_regfile_corrpre.py
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libfuse2
          curl --fail --location --retry 4 https://github.com/librelane/librelane/releases/download/3.0.5/librelane-devshell-x86_64.AppImage -o "$RUNNER_TEMP/librelane.AppImage"
          echo "d6a349ec65be11456e96c4981d35f63ca34d3c85daf79a51e1ccb907bb5d7466  $RUNNER_TEMP/librelane.AppImage" | sha256sum --check
          chmod +x "$RUNNER_TEMP/librelane.AppImage"
          echo "CLOUD_APPIMAGE=$RUNNER_TEMP/librelane.AppImage" >> "$GITHUB_ENV"
      - name: Prove correction candidate, inject faults and measure mapped timing
        run: python3 scripts/cloud_regfile_corrpre.py
      - name: Preserve native results and failures
        if: always()
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p cloud-regfile-corrpre
          if [ ! -f cloud-regfile-corrpre/result.json ]; then
            printf '%s\n' '{"status":"FAIL_MISSING_REPORT","accepted":false}' > cloud-regfile-corrpre/result.json
          fi
          stem="regfile-corrpre-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          cp cloud-regfile-corrpre/result.json "$stem.summary.json"
          python3 scripts/cloud_chunked_results.py --directory cloud-regfile-corrpre --stem "$stem"
          python3 - "$stem" <<'PYCODE'
          import json,subprocess,sys
          stem=sys.argv[1];manifest=stem+'.parts.json';m=json.load(open(manifest))
          subprocess.run([sys.executable,'scripts/publish_cloud_results.py','--group','regfile-corrpre',stem+'.summary.json',manifest,*[p['name']for p in m['parts']]],check=True)
          PYCODE
      - name: Retain evidence after publication failure
        if: always() && steps.publish.outcome == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: regfile-corrpre-${{ github.run_id }}
          retention-days: 30
          path: cloud-regfile-corrpre/
