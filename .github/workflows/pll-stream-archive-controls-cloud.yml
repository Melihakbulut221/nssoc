# SPDX-License-Identifier: Apache-2.0
name: pll-stream-archive-controls-cloud
on:
  push:
    branches: [codex/complete-open-work]
    paths: [.github/workflows/pll-stream-archive-controls-cloud.yml, scripts/cloud_streamed_native_archive.py]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pll-stream-archive-controls-${{ github.ref }}
  cancel-in-progress: false
jobs:
  storage-controls:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Exact archive roundtrip and twelve corruptions
        run: |
          python3 -m py_compile scripts/cloud_streamed_native_archive.py
          python3 scripts/cloud_streamed_native_archive.py
      - name: Real hosted publication and independently downloaded exact roundtrip
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/cloud_streamed_native_archive.py --hosted-smoke
      - name: Preserve storage fixture on any failed check
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pll-stream-storage-failure-${{ github.run_id }}
          path: ${{ runner.temp }}/streamed-evidence-smoke/
          retention-days: 30
