name: replay-onehot-cloud
on:
  push:
    branches: [codex/complete-open-work]
    paths: [.github/workflows/replay-onehot-cloud.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: replay-onehot-${{ github.ref }}
  cancel-in-progress: false
jobs:
  native-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: d2-b18, depth: 2, max_bytes: 18, ports: ''}
          - {name: d3-b38, depth: 3, max_bytes: 38, ports: ''}
          - {name: d4-b38, depth: 4, max_bytes: 38, ports: '--ports'}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: YosysHQ/setup-oss-cad-suite@aefa8397bbf8fc6670a0a62af9805a89738f3cde
        with:
          version: '2026-08-04'
          github-token: ${{ github.token }}
      - name: Prepare original port-test dependencies
        run: |
          python3 -m venv hw/soc/tools/replay-onehot-venv
          hw/soc/tools/replay-onehot-venv/bin/pip install -r hw/requirements.txt
          echo "$PWD/hw/soc/tools/replay-onehot-venv/bin" >> "$GITHUB_PATH"
      - name: Prove registered address invariant, arbitrary memory reads and full sequential behavior
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -m py_compile scripts/cloud_replay_onehot_candidate.py
          python3 scripts/cloud_replay_onehot_candidate.py --depth ${{ matrix.depth }} --max-bytes ${{ matrix.max_bytes }} ${{ matrix.ports }}
      - name: Preserve all native proofs and counterexamples
        if: always()
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          root=cloud-replay-onehot-${{ matrix.name }}
          mkdir -p "$root"
          if [ ! -f "$root/result.json" ]; then
            printf '%s\n' '{"status":"FAIL_MISSING_REPORT","accepted":false}' > "$root/result.json"
          fi
          stem="replay-onehot-${{ matrix.name }}-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          cp "$root/result.json" "$stem.summary.json"
          python3 scripts/cloud_chunked_results.py --directory "$root" --stem "$stem"
          python3 - "$stem" <<'PYCODE'
          import json,subprocess,sys
          stem=sys.argv[1];manifest=stem+'.parts.json';m=json.load(open(manifest))
          subprocess.run([sys.executable,'scripts/publish_cloud_results.py','--group','replay-onehot-${{ matrix.name }}',stem+'.summary.json',manifest,*[p['name']for p in m['parts']]],check=True)
          PYCODE
      - name: Preserve results on release failure
        if: always() && steps.publish.outcome == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: replay-onehot-${{ matrix.name }}-${{ github.run_id }}
          path: cloud-replay-onehot-${{ matrix.name }}/
          retention-days: 30

# Candidate only: canonical RTL remains unchanged until all native proofs pass.

# Revalidate exact adopted RTL against the immutable pre-onehot fixture.
