name: tx-tree-wave-diagnosis-cloud
on:
  push:
    branches: ['codex/complete-open-work']
    paths:
      - .github/workflows/tx-tree-wave-diagnosis-cloud.yml
      - scripts/analyze_cloud_tx_tree_wave.py
      - sw/tests/test_cloud_tx_stage_delay.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        case: [hot_fixed, hot_native, cold_native, nominal_native]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Check timing diagnosis against known delays and ambiguous events
        run: |
          python3 -m pip install numpy==2.3.3 pytest==8.4.2
          python3 -m pytest -q sw/tests/test_cloud_tx_stage_delay.py
      - name: Read exact full native waves and diagnose stage delay
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/analyze_cloud_tx_tree_wave.py --case '${{ matrix.case }}'
      - name: Preserve full diagnosis and failed records
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          archive='tx-tree-wave-${{ matrix.case }}-${{ github.run_id }}-${{ github.run_attempt }}.tar.gz'
          tar -czf "$archive" cloud-tx-tree-wave-diagnosis
          sha256sum "$archive" > "$archive.sha256"
          summary="${archive%.tar.gz}.summary.json"
          cp cloud-tx-tree-wave-diagnosis/result.json "$summary"
          gh release upload cloud-migration-20261012-000 "$archive" "$archive.sha256" "$summary"
