name: tree32-step-compare-cloud
on:
  push:
    branches: [codex/complete-open-work]
    paths: [.github/workflows/tree32-step-compare-cloud.yml]
  workflow_dispatch:
    inputs:
      backend:
        description: Backend shared by both passing full captures
        type: choice
        options: [klu, sparse]
      coarse_run:
        description: Original0.5ps full capture run ID
        required: true
        type: string
      coarse_sha:
        description: Original full summary SHA256
        required: true
        type: string
      coarse_parts_sha:
        description: Original ordered parts manifest SHA256
        required: true
        type: string
      fine_run:
        description: Refined0.25ps full capture run ID
        required: true
        type: string
      fine_sha:
        description: Refined full summary SHA256
        required: true
        type: string
      fine_parts_sha:
        description: Refined ordered parts manifest SHA256
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: tree32-step-compare-${{ github.ref }}-${{ inputs.coarse_run }}-${{ inputs.fine_run }}
  cancel-in-progress: false
jobs:
  controls:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Validate lossless native evidence restore and reject corrupt archives
        run: |
          python3 -m pip install numpy==2.3.3 networkx==3.5 pytest==8.4.2
          python3 -m py_compile scripts/cloud_tree32_step_compare.py scripts/cloud_verified_parts.py
          python3 scripts/cloud_tree32_step_compare.py --controls-only
          python3 -m pytest -q sw/tests/test_cloud_tx_stream.py sw/tests/test_cloud_tx_original_bits.py
  full-comparison:
    if: github.event_name == 'workflow_dispatch'
    needs: controls
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Native memory-mapped observation dependencies
        run: python3 -m pip install numpy==2.3.3 networkx==3.5
      - name: Require exact provenance and all original full waveform gates
        env:
          BACKEND: ${{ inputs.backend }}
          COARSE_RUN: ${{ inputs.coarse_run }}
          COARSE_SHA: ${{ inputs.coarse_sha }}
          COARSE_PARTS_SHA: ${{ inputs.coarse_parts_sha }}
          FINE_RUN: ${{ inputs.fine_run }}
          FINE_SHA: ${{ inputs.fine_sha }}
          FINE_PARTS_SHA: ${{ inputs.fine_parts_sha }}
        run: >-
          python3 scripts/cloud_tree32_step_compare.py --backend "$BACKEND"
          --coarse-run "$COARSE_RUN" --coarse-sha "$COARSE_SHA" --coarse-parts-sha "$COARSE_PARTS_SHA"
          --fine-run "$FINE_RUN" --fine-sha "$FINE_SHA" --fine-parts-sha "$FINE_PARTS_SHA"
      - name: Publish exact comparison with source and waveform hashes
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p cloud-tree32-step-compare
          if [ ! -f cloud-tree32-step-compare/result.json ]; then
            printf '%s\n' '{"status":"FAIL_MISSING_REPORT","accepted":false}' > cloud-tree32-step-compare/result.json
          fi
          stem="tree32-step-compare-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          cp cloud-tree32-step-compare/result.json "$stem.summary.json"
          python3 scripts/publish_cloud_results.py --group tree32-step-compare "$stem.summary.json"
