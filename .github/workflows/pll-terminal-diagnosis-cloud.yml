name: pll-terminal-diagnosis-cloud
on:
  push:
    branches: [codex/complete-open-work]
    paths: [.github/workflows/pll-terminal-diagnosis-cloud.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pll-terminal-diagnosis-${{ github.ref }}
  cancel-in-progress: false
jobs:
  native-paths:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Restore analysis dependencies
        run: python3 -m pip install numpy==2.3.3
      - name: Review original completed native capture without a new simulation
        run: |
          python3 -m py_compile scripts/cloud_pll_terminal_diagnosis.py
          python3 scripts/cloud_pll_terminal_diagnosis.py
      - name: Preserve native results and failures
        if: always()
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p cloud-pll-terminal-diagnosis
          if [ ! -f cloud-pll-terminal-diagnosis/result.json ]; then
            printf '%s\n' '{"status":"FAIL_MISSING_REPORT","accepted":false}' > cloud-pll-terminal-diagnosis/result.json
          fi
          stem="pll-terminal-diagnosis-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          cp cloud-pll-terminal-diagnosis/result.json "$stem.summary.json"
          python3 scripts/cloud_chunked_results.py --directory cloud-pll-terminal-diagnosis --stem "$stem"
          python3 - "$stem" <<'PYCODE'
          import json,subprocess,sys
          stem=sys.argv[1];manifest=stem+'.parts.json';m=json.load(open(manifest))
          subprocess.run([sys.executable,'scripts/publish_cloud_results.py','--group','pll-terminal-diagnosis',stem+'.summary.json',manifest,*[p['name']for p in m['parts']]],check=True)
          PYCODE
      - name: Retain evidence after publication failure
        if: always() && steps.publish.outcome == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pll-terminal-diagnosis-${{ github.run_id }}
          retention-days: 30
          path: cloud-pll-terminal-diagnosis/
