name: failed-guide-drt-cloud
on:
  push:
    branches: [codex/complete-open-work]
    paths: [.github/workflows/failed-guide-drt-cloud.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: failed-guide-drt-${{ github.ref }}
  cancel-in-progress: false
jobs:
  detailed-route-diagnosis:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Restore exact native runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libfuse2
          curl --fail --location --retry 4 https://github.com/librelane/librelane/releases/download/3.0.5/librelane-devshell-x86_64.AppImage -o "$RUNNER_TEMP/librelane.AppImage"
          echo "d6a349ec65be11456e96c4981d35f63ca34d3c85daf79a51e1ccb907bb5d7466  $RUNNER_TEMP/librelane.AppImage" | sha256sum --check
          chmod +x "$RUNNER_TEMP/librelane.AppImage"
          echo "CLOUD_APPIMAGE=$RUNNER_TEMP/librelane.AppImage" >> "$GITHUB_ENV"
      - name: Reject corrupted guide inputs
        run: python3 scripts/run_cloud_failed_guide_drt.py --controls-only
      - name: Verify original geometry and NDR then diagnose full detailed routing
        timeout-minutes: 330
        run: python3 scripts/run_cloud_failed_guide_drt.py
      - name: Preserve original failed gate and every new physical diagnostic
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p cloud-failed-guide-drt
          if [ ! -f cloud-failed-guide-drt/result.json ]; then
            printf '%s\n' '{"status":"FAIL_MISSING_SUMMARY_INSPECT_LOGS","accepted":false}' > cloud-failed-guide-drt/result.json
          fi
          archive="failed-guide-drt-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.tar.gz"
          tar -czf "$archive" cloud-failed-guide-drt
          sha256sum "$archive" > "$archive.sha256"
          cp cloud-failed-guide-drt/result.json "${archive%.tar.gz}.summary.json"
          python3 scripts/publish_cloud_results.py --group failed-guide-drt "$archive" "$archive.sha256" "${archive%.tar.gz}.summary.json"
