name: vbic-coupled-replay-cloud
on:
  push:
    branches: [codex/complete-open-work]
    paths: [.github/workflows/vbic-coupled-replay-cloud.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: vbic-coupled-replay-${{ github.ref }}
  cancel-in-progress: false
jobs:
  paired-coupled-transient:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Native runtime dependencies and unchanged parser controls
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libsndfile1 libsamplerate0 libreadline8t64 libxaw7 libxt6 libxft2 libfontconfig1
          python3 -m pip install numpy==2.3.3
          python3 scripts/cloud_tx_step_factorial.py --controls-only
      - name: Pristine provenance replay before paired patched coupled simulation
        run: python3 scripts/cloud_tx_companion_replay.py
      - name: Preserve all runtime, circuit and waveform evidence
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p cloud-vbic-coupled-replay
          if [ ! -f cloud-vbic-coupled-replay/result.json ]; then
            printf '%s\n' '{"status":"FAIL_MISSING_REPORT","accepted":false}' > cloud-vbic-coupled-replay/result.json
          fi
          archive="vbic-coupled-replay-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.tar.gz"
          tar -czf "$archive" cloud-vbic-coupled-replay
          sha256sum "$archive" > "$archive.sha256"
          cp cloud-vbic-coupled-replay/result.json "${archive%.tar.gz}.summary.json"
          python3 scripts/publish_cloud_results.py --group vbic-coupled-replay "$archive" "$archive.sha256" "${archive%.tar.gz}.summary.json"
