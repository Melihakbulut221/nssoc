# SPDX-License-Identifier: Apache-2.0
name: pll845-complete-terminal-envelopes-cloud
on:
  push:
    branches: [codex/complete-open-work]
    paths: [.github/workflows/pll845-complete-terminal-envelopes-cloud.yml]
  workflow_dispatch:
    inputs:
      source_checkpoint:
        description: Exact terminal completed native capture descriptor; saved or partial source is rejected
        type: string
        required: true
permissions:
  contents: read
  actions: read
concurrency:
  group: pll845-complete-terminal-envelopes
  cancel-in-progress: false
jobs:
  controls:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Compile full reader wrapper and verify terminal envelope controls
        run: |
          python3 -m pip install numpy==2.3.3
          python3 -m py_compile scripts/cloud_pll845_complete_terminal_envelopes.py
          PYTHONPATH=scripts python3 -c "from pll845_terminal_envelopes import controls; print(controls())"
  complete-reader:
    needs: controls
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/
            /docs/evidence/native-preallocated-btrfs-proof-20261021.json
            /docs/evidence/pll845-streamed-latest-continuation-20261021.json
            /docs/evidence/pll845-logical-native-capsule-pass-20261022.json
            /docs/evidence/logical-native-archive-qualified-20261022.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify terminal source native stage without treating another reader failure as lost waveform
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_CHECKPOINT: ${{ inputs.source_checkpoint }}
        run: |
          python3 - <<'PYCODE'
          import json,os,subprocess
          spec=json.loads(os.environ['SOURCE_CHECKPOINT'])
          assert set(spec)=={'run','attempt','stage','summary_sha256','parts_sha256'}
          repo='repos/'+os.environ['GITHUB_REPOSITORY']+'/actions/runs/'+str(spec['run'])
          run=json.loads(subprocess.check_output(['gh','api',repo]))
          assert run['status']=='completed' and run['run_attempt']==int(spec['attempt'])
          jobs=json.loads(subprocess.check_output(['gh','api',repo+'/jobs?per_page=100']))['jobs']
          native=[j for j in jobs if j['name']==spec['stage']]
          assert len(native)==1 and native[0]['conclusion']=='success'
          PYCODE
      - name: Prepare separate ordinary full-capture reader capacity
        run: |
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test -z "$(docker ps -aq)"
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          docker image prune --all --force
          sudo apt-get clean
          python3 -m pip install numpy==2.3.3
          python3 scripts/cloud_pll_storage_headroom.py
          df -B1 "$GITHUB_WORKSPACE"
          python3 - <<'PYCODE'
          import hashlib,json,pathlib,shutil,subprocess
          from sys import path
          path.insert(0,'scripts')
          from cloud_pll845_sparse_disk import source_contract
          root=pathlib.Path.cwd()
          _,methods=source_contract(root)
          assert not (root/'hw').exists()
          wanted={'docs/evidence/native-preallocated-btrfs-proof-20261021.json','docs/evidence/pll845-streamed-latest-continuation-20261021.json','docs/evidence/pll845-logical-native-capsule-pass-20261022.json','docs/evidence/logical-native-archive-qualified-20261022.json'}
          actual={str(p.relative_to(root))for p in (root/'docs').rglob('*')if p.is_file()}
          assert actual==wanted,('Unexpected reader checkout proof set',actual)
          out=root/'cloud-pll845-reader-capacity';out.mkdir()
          report=dict(scope='Static full-reader checkout only; all native waveform columns, original methods and4GiB reserve retained',
              free_bytes=shutil.disk_usage(root).free,
              source_methods_verified=methods,
              retained_proofs={p:hashlib.sha256((root/p).read_bytes()).hexdigest()for p in sorted(wanted)},
              source_checkout='scripts and exact four required immutable proof receipts',
              original_capacity_guard_unchanged=True,native_activation=False)
          (out/'result.json').write_text(json.dumps(report,indent=2)+'\n')
          print(json.dumps(report))
          PYCODE
      - name: Validate every original column and both frozen acquisition windows
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_CHECKPOINT: ${{ inputs.source_checkpoint }}
        run: python3 scripts/cloud_pll845_complete_terminal_envelopes.py
      - name: Preserve original full-reader and acquisition results or failures
        if: always()
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          root=cloud-pll845-complete-terminal-envelopes
          mkdir -p "$root"
          if [ -f cloud-pll845-reader-capacity/result.json ]; then cp cloud-pll845-reader-capacity/result.json "$root/reader-capacity-before-download.json"; fi
          if [ ! -f "$root/result.json" ]; then printf '%s\n' '{"status":"FAIL_MISSING_REPORT","full_phy_accepted":false}' > "$root/result.json"; fi
          stem="pll845-complete-terminal-envelopes-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          cp "$root/result.json" "$stem.summary.json"
          python3 scripts/cloud_chunked_results.py --directory "$root" --stem "$stem"
          python3 - "$stem" <<'PYCODE'
          import json,subprocess,sys
          s=sys.argv[1];m=json.load(open(s+'.parts.json'))
          subprocess.run([sys.executable,'scripts/publish_cloud_results.py','--group','pll845-complete-terminal-envelopes',s+'.summary.json',s+'.parts.json',*[p['name']for p in m['parts']]],check=True)
          PYCODE
      - name: Retain reader report after publication failure
        if: always() && steps.publish.outcome == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pll845-complete-terminal-envelopes-${{ github.run_id }}
          path: cloud-pll845-complete-terminal-envelopes/
          retention-days: 30
