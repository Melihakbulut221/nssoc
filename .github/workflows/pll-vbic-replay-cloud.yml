name: pll-vbic-replay-cloud
on:
  push:
    branches: [codex/complete-open-work]
    paths: [.github/workflows/pll-vbic-replay-cloud.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pll-vbic-replay-${{ github.ref }}
  cancel-in-progress: false
jobs:
  actual845-paired-engines:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Native dependencies and strict original parser controls
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libsndfile1 libsamplerate0 libreadline8t64 libxaw7 libxt6 libxft2 libfontconfig1
          python3 -m pip install numpy==2.3.3 networkx==3.5
          python3 -m py_compile scripts/cloud_pll_vbic_replay.py
          python3 scripts/cloud_vbic_tree32_backend.py --controls-only
          python3 scripts/cloud_chunked_results.py --self-test
      - name: Unchanged actual PLL provenance before patched50ns observation
        run: python3 scripts/cloud_pll_vbic_replay.py
      - name: Preserve complete native parent/model/runtime/waveform evidence
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p cloud-pll-vbic-replay
          if [ ! -f cloud-pll-vbic-replay/result.json ]; then
            printf '%s\n' '{"status":"FAIL_MISSING_REPORT","accepted":false}' > cloud-pll-vbic-replay/result.json
          fi
          stem="pll-vbic-replay-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          cp cloud-pll-vbic-replay/result.json "$stem.summary.json"
          python3 scripts/cloud_chunked_results.py --directory cloud-pll-vbic-replay --stem "$stem"
          python3 - "$stem" <<'PYCODE'
          import json,subprocess,sys
          stem=sys.argv[1];manifest=stem+'.parts.json';m=json.load(open(manifest))
          subprocess.run([sys.executable,'scripts/publish_cloud_results.py','--group','pll-vbic-replay',stem+'.summary.json',manifest,*[p['name']for p in m['parts']]],check=True)
          PYCODE
