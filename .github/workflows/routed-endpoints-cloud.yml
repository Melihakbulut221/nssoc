name: routed-endpoints-cloud
on:
  push:
    branches: [codex/complete-open-work]
    paths: [.github/workflows/routed-endpoints-cloud.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: routed-endpoints-${{ github.ref }}
  cancel-in-progress: false
jobs:
  nominal-rc-and-sta:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Restore exact native runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libfuse2
          curl --fail --location --retry 4 https://github.com/librelane/librelane/releases/download/3.0.5/librelane-devshell-x86_64.AppImage -o "$RUNNER_TEMP/librelane.AppImage"
          echo "d6a349ec65be11456e96c4981d35f63ca34d3c85daf79a51e1ccb907bb5d7466  $RUNNER_TEMP/librelane.AppImage" | sha256sum --check
          chmod +x "$RUNNER_TEMP/librelane.AppImage"
          echo "CLOUD_APPIMAGE=$RUNNER_TEMP/librelane.AppImage" >> "$GITHUB_ENV"
      - name: Compile complete routed endpoint controller
        run: python3 -m py_compile scripts/audit_cloud_routed_endpoints.py
      - name: Enumerate all native setup and hold endpoints on original extracted RC
        timeout-minutes: 240
        run: python3 scripts/audit_cloud_routed_endpoints.py
      - name: Preserve exact sources, extracted RC and native timing observations
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p cloud-routed-endpoints
          if [ ! -f cloud-routed-endpoints/result.json ]; then
            printf '%s\n' '{"status":"FAIL_MISSING_REPORT","accepted":false}' > cloud-routed-endpoints/result.json
          fi
          stem="routed-endpoints-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          cp cloud-routed-endpoints/result.json "$stem.summary.json"
          python3 scripts/cloud_chunked_results.py --directory cloud-routed-endpoints --stem "$stem"
          python3 - "$stem" <<'PYCODE'
          import json,subprocess,sys
          stem=sys.argv[1];manifest=stem+'.parts.json';m=json.load(open(manifest))
          subprocess.run([sys.executable,'scripts/publish_cloud_results.py','--group','routed-endpoints',stem+'.summary.json',manifest,*[p['name']for p in m['parts']]],check=True)
          PYCODE
      - name: Require complete endpoint census and reproduced original timing
        if: always()
        run: |
          python3 - <<'PYCODE'
          import json, os
          r = json.load(open('cloud-routed-endpoints/result.json'))
          assert r['source_head'] == os.environ['GITHUB_SHA']
          assert r['status'] == 'COMPLETE_ACTUAL_ROUTED_ENDPOINT_CENSUS_NOT_TIMING_ACCEPTANCE', r.get('error')
          assert r['source_unchanged'] and r['original_routed_timing_reproduced']
          assert r['endpoint_corner_delay_rows'] == 6*r['endpoint_count']
          print(r['summary'], r['hold_target_categories'])
          PYCODE
