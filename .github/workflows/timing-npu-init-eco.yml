name: timing-npu-init-eco
on:
  push:
    paths:
      - .github/workflows/timing-npu-init-eco.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: timing-npu-init-eco-${{ github.ref }}
  cancel-in-progress: false
jobs:
  boot:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Verify strict transformation and unchanged boot contract
        run: |
          python3 -m pip install pytest==8.4.2
          python3 -m pytest -q sw/tests/test_npu_reconvergence_eco.py sw/tests/test_alu_qualification.py
      - name: Prepare source-pinned ECO and actual native four-state controls
        run: |
          python3 scripts/run_cloud_npu_init_eco.py prepare \
            --output "$GITHUB_WORKSPACE/npu-init-eco" \
            --work "$RUNNER_TEMP/npu-init-eco-work"
      - name: Preserve original preparation, exact ECO and native controls
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: npu-init-eco-startup-${{ github.run_attempt }}
          path: npu-init-eco/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
      - name: Require real power-on MBIST and all28 firmware checks
        run: |
          python3 scripts/run_cloud_npu_init_eco.py run \
            --output "$GITHUB_WORKSPACE/npu-init-eco"
      - name: Preserve complete native boot result including failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: npu-init-eco-final-${{ github.run_attempt }}
          path: npu-init-eco/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
