name: physical-tools
on:
  push:
    paths:
      - .github/workflows/physical-tools.yml
      - scripts/bootstrap_flow.py
      - scripts/check_flow_smoke.py
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: physical-tools-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ihp-devshell:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install AppImage runtime prerequisite
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libfuse2
      - name: Download and verify the immutable devshell
        run: |
          mkdir -p hw/soc/out/physical-bootstrap-download
          python3 scripts/bootstrap_flow.py 2>&1 | tee hw/soc/out/physical-bootstrap-download/install.log
          python3 scripts/bootstrap_flow.py --check
      - name: Fresh full IHP kit and retained upstream SPM example
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: hw/soc/tools/physical/librelane-3.0.5-x86_64.AppImage python3 scripts/check_flow_smoke.py
      - name: Retain bootstrap success or failure diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: physical-bootstrap-results
          path: |
            hw/soc/out/physical-bootstrap-download/*.log
            hw/soc/out/physical-bootstrap/**/*.log
            hw/soc/out/physical-bootstrap/**/*.json
          retention-days: 30
