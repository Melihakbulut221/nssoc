name: ci-prepared-rtl-lint-20261018-cloud
on:
  push:
    branches: [codex/complete-open-work]
    paths: [.github/workflows/ci-prepared-rtl-lint-20261018-cloud.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-prepared-rtl-lint-20261018-${{ github.ref }}
  cancel-in-progress: false
jobs:
  native-planes:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Compile native reference-plane binding in the cloud
        run: python3 -m py_compile scripts/cloud_ci_prepared_rtl_lint_20261018.py
      - uses: YosysHQ/setup-oss-cad-suite@aefa8397bbf8fc6670a0a62af9805a89738f3cde
        with:
          version: '2026-08-04'
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Prepare the same pinned CPU and interface RTL as the corrected CI job
        run: |
          echo "OSS_CAD_SUITE=$(dirname "$(dirname "$(command -v yosys)")")" >> "$GITHUB_ENV"
          python3 -m pip install -r sw/requirements.txt
          python3 -m venv hw/.venv
          hw/.venv/bin/pip install -r hw/requirements.txt
          make soc-rtl-prepare INTERFACE_PYTHON="$PWD/hw/.venv/bin/python"
          make soc-interfaces-prepare SOC_INTERFACE_PROFILE=full INTERFACE_PYTHON="$PWD/hw/.venv/bin/python"
      - name: Run base and full lint plus actual asynchronous PCIe and Ethernet traffic
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/cloud_ci_prepared_rtl_lint_20261018.py
      - name: Preserve physical results and failures
        if: always()
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          root=hw/soc/out/cloud-ci-prepared-rtl-lint-20261018
          mkdir -p "$root"
          if [ ! -f "$root/result.json" ]; then
            printf '%s\n' '{"status":"FAIL_MISSING_REPORT","accepted":false}' > "$root/result.json"
          fi
          stem="ci-prepared-rtl-lint-20261018-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          cp "$root/result.json" "$stem.summary.json"
          python3 scripts/cloud_chunked_results.py --directory "$root" --stem "$stem"
          python3 - "$stem" <<'PYCODE'
          import json,subprocess,sys
          stem=sys.argv[1];manifest=stem+'.parts.json';m=json.load(open(manifest))
          subprocess.run([sys.executable,'scripts/publish_cloud_results.py','--group','ci-prepared-rtl-lint-20261018',stem+'.summary.json',manifest,*[p['name']for p in m['parts']]],check=True)
          PYCODE
      - name: Retain evidence after publication failure
        if: always() && steps.publish.outcome == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ci-prepared-rtl-lint-20261018-${{ github.run_id }}
          path: hw/soc/out/cloud-ci-prepared-rtl-lint-20261018/
          retention-days: 30
