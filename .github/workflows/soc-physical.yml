name: soc-physical
on:
  push:
    paths:
      - .github/workflows/soc-physical.yml
      - hw/soc/flow/implement_interfaces.sh
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: soc-physical-${{ github.ref }}
  cancel-in-progress: false
jobs:
  full-core:
    runs-on: ubuntu-22.04
    timeout-minutes: 330
    env:
      SOC_INTERFACE_PROFILE: full
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: sw/requirements.txt
      - uses: YosysHQ/setup-oss-cad-suite@aefa8397bbf8fc6670a0a62af9805a89738f3cde # v3
        with:
          version: '2026-08-04'
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Prepare pinned digital inputs
        run: |
          echo "OSS_CAD_SUITE=$(dirname "$(dirname "$(command -v yosys)")")" >> "$GITHUB_ENV"
          echo "INTERFACE_PYTHON=$(command -v python3)" >> "$GITHUB_ENV"
          python3 -m pip install -r sw/requirements.txt
          make soc-prepare
          mkdir -p hw/soc/out/current-physical-tools
          yosys -V > hw/soc/out/current-physical-tools/mapping-yosys.log
          hw/soc/tools/rvgcc/bin/riscv-none-elf-gcc --version > hw/soc/out/current-physical-tools/firmware-gcc.log
      - name: Verify physical devshell and install runtime prerequisite
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libfuse2
          mkdir -p hw/soc/out/physical-bootstrap-download
          python3 scripts/bootstrap_flow.py 2>&1 | tee hw/soc/out/physical-bootstrap-download/install.log
          python3 scripts/bootstrap_flow.py --check
      - name: Verify tools and full IHP kit with retained upstream control
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: hw/soc/tools/physical/librelane-3.0.5-x86_64.AppImage python3 scripts/check_flow_smoke.py
      - name: Implement current full-interface core with immutable loader
        env:
          FLOW_TOOL_MODE: environment
        run: |
          export PDK_ROOT="$PWD/hw/soc/tools/pdk-bootstrap"
          hw/soc/tools/physical/librelane-3.0.5-x86_64.AppImage bash hw/soc/flow/implement_interfaces.sh current-full
      - name: Retain source identities and physical success or failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: soc-physical-full-results
          path: |
            hw/soc/out/current-physical-tools/*.log
            hw/soc/out/physical-bootstrap-download/*.log
            hw/soc/out/physical-bootstrap/**/*.log
            hw/soc/out/physical-bootstrap/**/*.json
            hw/soc/out/current-full/**/*.log
            hw/soc/out/current-full/**/*.json
            hw/soc/out/current-full/synthesis/soc_top.netlist.v
            hw/soc/out/current-full/synthesis/area.rpt
            hw/soc/out/current-full/synthesis/boot-rom/
            hw/soc/out/current-full/firmware/test_soc.bin
            hw/soc/out/current-full/firmware/app.elf
            hw/soc/out/current-full/firmware/flash0.hex
            hw/soc/pnr/state/current-full.json
            hw/soc/pnr/config.resolved*.json
            hw/soc/pnr/runs/current-full/**/*.log
            hw/soc/pnr/runs/current-full/**/*.rpt
            hw/soc/pnr/runs/current-full/**/*.json
            hw/soc/pnr/runs/current-full/final/
          retention-days: 30
