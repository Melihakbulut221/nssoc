# SPDX-License-Identifier: Apache-2.0
name: tx-phase-fast-assert-preparation-cloud
on:
  push:
    branches: [codex/tx-clock-phase-parent]
    paths:
      - scripts/tx_phase_fast_assert_diagnostic.py
      - scripts/check_tx_phase_fast_assert_preparation.py
      - scripts/tx-phase-fast-assert-preparation-methods.json
      - .github/workflows/tx-phase-fast-assert-preparation-cloud.yml
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  prepare-four244-cases:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Reproduce original phase and safety observers on all four new source preparations
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -m pip install numpy==2.3.3
          python3 scripts/check_tx_phase_fast_assert_preparation.py | tee controls.json
          python3 - <<'PYCODE'
          import json
          d=json.load(open('controls.json'))
          assert d['status']=='PASS_FAST_ASSERT244_ALL_FOUR_PREPARED_ORIGINAL_PHASE_AND_SAFETY_NOT_NATIVE'
          assert len(d['positive_cases'])==4 and len(d['negative_controls'])==8 and not d['native_execution']
          PYCODE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: phase-fast-assert-preparation-${{ github.run_id }}
          path: controls.json
          retention-days: 30
