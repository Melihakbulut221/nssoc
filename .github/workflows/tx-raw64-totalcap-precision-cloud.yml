name: tx-raw64-totalcap-precision-cloud
on:
  push:
    branches: [codex/complete-open-work]
    paths: [.github/workflows/tx-raw64-totalcap-precision-cloud.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tx-raw64-totalcap-precision-${{ github.ref }}
  cancel-in-progress: false
jobs:
  native-producer-precision:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Restore exact native CAD runtime
        run: |
          python3 -m py_compile scripts/cloud_tx_raw64_totalcap_precision.py
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libfuse2 tcl8.6 tk8.6 tcl-dev tk-dev build-essential m4 autoconf libreadline-dev libx11-dev libxext-dev libxpm-dev libxt-dev libcairo2-dev libgl1-mesa-dev libglu1-mesa-dev
          python3 -m pip install networkx==3.4.2
      - name: Rebuild baseline and double-total producer then run original full8074 RC gates
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/cloud_tx_raw64_totalcap_precision.py
      - name: Publish physical success or failure evidence
        if: always()
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p hw/soc/out/cloud-tx-raw64-totalcap-precision
          if [ ! -f hw/soc/out/cloud-tx-raw64-totalcap-precision/result.json ]; then
            printf '%s\n' '{"status":"FAIL_MISSING_REPORT","accepted":false}' > hw/soc/out/cloud-tx-raw64-totalcap-precision/result.json
          fi
          stem="tx-raw64-totalcap-precision-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          cp hw/soc/out/cloud-tx-raw64-totalcap-precision/result.json "$stem.summary.json"
          python3 scripts/cloud_chunked_results.py --directory hw/soc/out/cloud-tx-raw64-totalcap-precision --stem "$stem"
          python3 - "$stem" <<'PYCODE'
          import json,subprocess,sys
          stem=sys.argv[1];manifest=stem+'.parts.json';m=json.load(open(manifest))
          subprocess.run([sys.executable,'scripts/publish_cloud_results.py','--group','tx-raw64-totalcap-precision',stem+'.summary.json',manifest,*[p['name']for p in m['parts']]],check=True)
          PYCODE
      - name: Retain evidence after publication failure
        if: always() && steps.publish.outcome == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tx-raw64-totalcap-precision-${{ github.run_id }}
          retention-days: 30
          path: hw/soc/out/cloud-tx-raw64-totalcap-precision/

# Restore historical HBT/tap/ESD producer overlays before either full rebuild.
