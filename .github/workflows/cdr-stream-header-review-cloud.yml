name: cdr-stream-header-review-cloud
on:
  push:
    branches: [codex/complete-open-work]
    paths: [.github/workflows/cdr-stream-header-review-cloud.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cdr-stream-header-review-${{ github.ref }}
  cancel-in-progress: false
jobs:
  native-planes:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Check exact native model and RC census adaptations
        run: |
          python3 - <<'PYCODE'
          import json,hashlib
          from pathlib import Path
          d=json.loads(Path('scripts/cdr-hybrid-v2-mim-composition-source-delta.json').read_text())
          s=Path(d['source']).read_text()
          assert hashlib.sha256(s.encode()).hexdigest()==d['original_sha256']
          for e in d['edits']:
              assert e['before'] in s
              s=s.replace(e['before'],e['after'])
          assert s==Path(d['target']).read_text()
          assert hashlib.sha256(s.encode()).hexdigest()==d['adapted_sha256']
          PYCODE
      - name: Verify new484 exact native census and wire composition delta
        run: python3 scripts/check_cdr_via_rich_v7_loaded_sources.py
      - name: Compile native reference-plane binding in the cloud
        run: python3 -m py_compile scripts/cloud_cdr_stream_header_review.py
      - name: Install pinned sparse linear solver
        run: python3 -m pip install numpy==2.3.3 scipy==1.16.2
      - name: Inspect every actual raw header vector and compare original requested samples
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/cloud_cdr_stream_header_review.py
      - name: Preserve physical results and failures
        if: always()
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          root=cloud-cdr-stream-header-review
          mkdir -p "$root"
          if [ ! -f "$root/result.json" ]; then
            printf '%s\n' '{"status":"FAIL_MISSING_REPORT","accepted":false}' > "$root/result.json"
          fi
          stem="cdr-stream-header-review-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          cp "$root/result.json" "$stem.summary.json"
          python3 scripts/cloud_chunked_results.py --directory "$root" --stem "$stem"
          python3 - "$stem" <<'PYCODE'
          import json,subprocess,sys
          stem=sys.argv[1];manifest=stem+'.parts.json';m=json.load(open(manifest))
          subprocess.run([sys.executable,'scripts/publish_cloud_results.py','--group','cdr-stream-header-review',stem+'.summary.json',manifest,*[p['name']for p in m['parts']]],check=True)
          PYCODE
      - name: Retain evidence after publication failure
        if: always() && steps.publish.outcome == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cdr-stream-header-review-${{ github.run_id }}
          path: cloud-cdr-stream-header-review/
          retention-days: 30
