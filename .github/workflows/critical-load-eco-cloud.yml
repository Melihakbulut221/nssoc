name: critical-load-eco-cloud
on:
  push:
    branches: [codex/complete-open-work]
    paths: [.github/workflows/critical-load-eco-cloud.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: critical-load-eco-${{ github.ref }}
  cancel-in-progress: false
jobs:
  two-buffer-physical-eco:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Restore exact native runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libfuse2
          curl --fail --location --retry 4 https://github.com/librelane/librelane/releases/download/3.0.5/librelane-devshell-x86_64.AppImage -o "$RUNNER_TEMP/librelane.AppImage"
          echo "d6a349ec65be11456e96c4981d35f63ca34d3c85daf79a51e1ccb907bb5d7466  $RUNNER_TEMP/librelane.AppImage" | sha256sum --check
          chmod +x "$RUNNER_TEMP/librelane.AppImage"
          echo "CLOUD_APPIMAGE=$RUNNER_TEMP/librelane.AppImage" >> "$GITHUB_ENV"
      - name: Compile exact source-bound buffer repair controllers
        run: python3 -m py_compile scripts/prepare_cloud_critical_load_eco.py scripts/run_cloud_critical_load_eco.py
      - name: Prove restricted buffer insertion, reroute full chip, reextract and measure
        timeout-minutes: 330
        run: python3 scripts/run_cloud_critical_load_eco.py
      - name: Preserve exact sources, extracted RC and native timing observations
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p cloud-critical-load-eco
          if [ ! -f cloud-critical-load-eco/result.json ]; then
            printf '%s\n' '{"status":"FAIL_MISSING_REPORT","accepted":false}' > cloud-critical-load-eco/result.json
          fi
          stem="critical-load-eco-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          cp cloud-critical-load-eco/result.json "$stem.summary.json"
          python3 scripts/cloud_chunked_results.py --directory cloud-critical-load-eco --stem "$stem"
          python3 - "$stem" <<'PYCODE'
          import json,subprocess,sys
          stem=sys.argv[1];manifest=stem+'.parts.json';m=json.load(open(manifest))
          subprocess.run([sys.executable,'scripts/publish_cloud_results.py','--group','critical-load-eco',stem+'.summary.json',manifest,*[p['name']for p in m['parts']]],check=True)
          PYCODE
      - name: Require the physical experiment report after preserving evidence
        if: always()
        run: |
          python3 - <<'PYCODE'
          import json, os
          from pathlib import Path
          p = Path('cloud-critical-load-eco/result.json')
          assert p.is_file(), 'Physical experiment report missing'
          result = json.loads(p.read_text())
          assert result.get('source_head') == os.environ['GITHUB_SHA'], 'Wrong source revision'
          assert result.get('status') == 'COMPLETE_TWO_BUFFER_ROUTED_NOMINAL_TIMING_EXPERIMENT_NOT_SIGNOFF', result.get('status')
          assert result.get('protected_source_unchanged') is True
          assert result.get('native_drt_drvs') == 0
          assert result.get('routed_timing'), 'Actual routed timing missing'
          print('Experiment completed; this is not timing or production acceptance.')
          PYCODE
