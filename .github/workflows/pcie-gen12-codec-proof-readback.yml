name: pcie-gen12-codec-proof-readback
on:
  push:
    branches: [codex/pcie-gen12-training]
    paths:
      - .github/workflows/pcie-gen12-codec-proof-readback.yml
      - scripts/read_pcie_gen12_codec_proof.py
      - scripts/pcie-gen12-codec-proof-readback-methods.json
  workflow_dispatch:
permissions:
  actions: read
  contents: write
defaults:
  run:
    shell: bash
concurrency:
  group: pcie-gen12-codec-proof-readback-40102483214-aa8afbb7
  cancel-in-progress: false
jobs:
  exact-existing-proof:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Check exact-source release metadata controls
        run: python3 scripts/ensure_cloud_tested_source_release.py --controls
      - name: Verify exact existing artifact in cloud RAM without simulation
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/read_pcie_gen12_codec_proof.py
      - name: Preserve exact small proof bytes in hosted log
        if: always()
        run: |
          python3 - <<'PYCODE'
          import base64,hashlib,json
          from pathlib import Path
          p=Path('hw/soc/out/pcie-gen12-codec-proof-readback/codec-proof.json')
          data=p.read_bytes();assert 0<len(data)<2*1024*1024
          json.loads(data)
          print('CODEC_PROOF_SHA256 '+hashlib.sha256(data).hexdigest())
          print('CODEC_PROOF_BYTES '+str(len(data)))
          text=base64.b64encode(data).decode();chunks=[text[i:i+4096]for i in range(0,len(text),4096)]
          for i,chunk in enumerate(chunks):print('CODEC_PROOF_BASE64 '+str(i)+'/'+str(len(chunks))+' '+chunk)
          PYCODE
      - name: Preserve proof or readback rejection
        if: always()
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test -f hw/soc/out/pcie-gen12-codec-proof-readback/codec-proof.json
          python3 scripts/ensure_cloud_tested_source_release.py --group gen12-codec-readback
          tag="cloud-results-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-gen12-codec-readback"
          gh release upload "$tag" hw/soc/out/pcie-gen12-codec-proof-readback/codec-proof.json hw/soc/out/pcie-gen12-codec-proof-readback/codec-proof.sha256
      - name: Preserve small proof if publication fails
        if: always() && steps.publish.outcome == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: codec-readback-publication-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: hw/soc/out/pcie-gen12-codec-proof-readback/
          retention-days: 90
