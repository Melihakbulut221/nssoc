name: tx-balanced-v5-loaded-wave-cloud
on:
  push:
    branches: [codex/complete-open-work]
    paths: [.github/workflows/tx-balanced-v5-loaded-wave-cloud.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  # A failed predecessor may still publish its evidence; isolate source revisions.
  group: tx-balanced-v5-loaded-wave-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false
jobs:
  controls:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Parse source-bound continuation controller
        run: |
          python3 -m py_compile scripts/cloud_tx_balanced_v5_clock_adapter.py scripts/cloud_tx_balanced_v5_wave.py scripts/bind_tx_balanced_v5_interfaces.py scripts/cloud_tx_balanced_v5_builder.py scripts/check_tx_balanced_v5_builder.py
          python3 scripts/check_tx_balanced_v5_builder.py
  native-full32:
    needs: controls
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - {mode: compact, condition: nominal, fault: none}
          - {mode: compact, condition: hot_low, fault: none}
          - {mode: compact, condition: cold_high, fault: none}
          - {mode: compact, condition: nominal, fault: swap_leaf_select}
          - {mode: wire, condition: nominal, fault: none}
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Native simulator dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libfuse2t64 tcl8.6 libsndfile1 libsamplerate0 libreadline8t64 libxaw7 libxt6 libxft2 libfontconfig1
          python3 -m pip install numpy==2.3.3
          curl --fail --location --retry 4 https://github.com/librelane/librelane/releases/download/3.0.5/librelane-devshell-x86_64.AppImage -o "$RUNNER_TEMP/librelane.AppImage"
          echo "d6a349ec65be11456e96c4981d35f63ca34d3c85daf79a51e1ccb907bb5d7466  $RUNNER_TEMP/librelane.AppImage" | sha256sum --check
          chmod +x "$RUNNER_TEMP/librelane.AppImage"
          echo "CLOUD_APPIMAGE=$RUNNER_TEMP/librelane.AppImage" >> "$GITHUB_ENV"
          sudo env -u LD_LIBRARY_PATH "$RUNNER_TEMP/librelane.AppImage" python -c "import pya; print(pya.__version__)"
      - name: Simulate all eleven physical clock macros loaded by actual full32 tree
        run: |
          python3 -m py_compile scripts/cloud_tx_balanced_v5_clock_adapter.py scripts/cloud_tx_balanced_v5_builder.py scripts/check_tx_balanced_v5_builder.py scripts/run_cloud_tx_mux4.py scripts/bind_tx_balanced_v5_interfaces.py scripts/cloud_tx_balanced_v5_wave.py scripts/cloud_tx_tree32_clock_adapter.py scripts/cloud_tx_tree32_firstclock.py
          python3 scripts/cloud_tx_balanced_v5_wave.py --mode ${{ matrix.mode }} --fault ${{ matrix.fault }} --placement-pitch original --return-rail original --physical-clock --first-clock-l5p7 --variant budget_balanced_v5 --condition ${{ matrix.condition }}
      - name: Preserve complete native captures and every failure
        if: always()
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          root=cloud-tx-balanced-v5-wave-${{ matrix.mode }}-${{ matrix.condition }}-${{ matrix.fault }}
          mkdir -p "$root"
          if [ ! -f "$root/result.json" ]; then
            printf '%s\n' '{"status":"FAIL_MISSING_REPORT","accepted":false}' > "$root/result.json"
          fi
          stem="tx-balanced-v5-wave-${{ matrix.mode }}-${{ matrix.condition }}-${{ matrix.fault }}-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          cp "$root/result.json" "$stem.summary.json"
          python3 scripts/cloud_chunked_results.py --directory "$root" --stem "$stem"
          python3 - "$stem" <<'PYCODE'
          import json,subprocess,sys
          stem=sys.argv[1];manifest=stem+'.parts.json';m=json.load(open(manifest))
          subprocess.run([sys.executable,'scripts/publish_cloud_results.py','--group','tx-balanced-v5-wave-${{ matrix.mode }}-${{ matrix.condition }}-${{ matrix.fault }}',stem+'.summary.json',manifest,*[p['name']for p in m['parts']]],check=True)
          PYCODE
      - name: Retain evidence after publication failure
        if: always() && steps.publish.outcome == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tx-balanced-v5-wave-${{ matrix.mode }}-${{ matrix.condition }}-${{ matrix.fault }}-${{ github.run_id }}
          path: cloud-tx-balanced-v5-wave-${{ matrix.mode }}-${{ matrix.condition }}-${{ matrix.fault }}/
          retention-days: 30
