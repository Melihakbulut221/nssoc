name: cdr-via-rich-stream-control-cloud
on:
  push:
    branches: [codex/complete-open-work]
    paths: [.github/workflows/cdr-via-rich-stream-control-cloud.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cdr-via-rich-stream-control-${{ github.ref }}
  cancel-in-progress: false
jobs:
  native-planes:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Recover exact failed native log in the cloud
        run: |
          python3 - <<'PYCODE'
          import hashlib,io,json,tarfile,urllib.request
          from pathlib import Path
          p=json.loads(Path('docs/evidence/cdr-via-rich-stream-control-first-failure-20261019.json').read_text())
          url='https://github.com/Melihakbulut221/nssoc/releases/download/cloud-results-39166618949-1-cdr-via-rich-stream-control/cdr-via-rich-stream-control-39166618949-1.tar.gz.part0000'
          raw=urllib.request.urlopen(url).read()
          assert hashlib.sha256(raw).hexdigest()=='c74fb0d4b9908938dbb402d078cac18bc883f73243e5d3591f56d3be00180e5b'
          with tarfile.open(fileobj=io.BytesIO(raw),mode='r:gz')as tar:
              names=[n for n in tar.getnames()if n.endswith('/legacy/native.log')]
              assert len(names)==1
              log=tar.extractfile(names[0]).read()
          assert hashlib.sha256(log).hexdigest()==p['report']['outputs']['legacy/native.log']
          print(log.decode(),flush=True)
          PYCODE
      - name: Check exact native model and RC census adaptations
        run: |
          python3 - <<'PYCODE'
          import json,hashlib
          from pathlib import Path
          d=json.loads(Path('scripts/cdr-hybrid-v2-mim-composition-source-delta.json').read_text())
          s=Path(d['source']).read_text()
          assert hashlib.sha256(s.encode()).hexdigest()==d['original_sha256']
          for e in d['edits']:
              assert e['before'] in s
              s=s.replace(e['before'],e['after'])
          assert s==Path(d['target']).read_text()
          assert hashlib.sha256(s.encode()).hexdigest()==d['adapted_sha256']
          PYCODE
      - name: Verify new484 exact native census and wire composition delta
        run: python3 scripts/check_cdr_via_rich_v7_loaded_sources.py
      - name: Compile native reference-plane binding in the cloud
        run: python3 -m py_compile scripts/cloud_cdr_via_rich_stream_control.py
      - name: Install native simulator and pinned waveform reader dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends tcl8.6 libsndfile1 libsamplerate0 libreadline8t64 libxaw7 libxt6 libxft2 libfontconfig1
          python3 -m pip install numpy==2.3.3
      - name: Verify same physical CDR model and every sample in streamed transport
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/cloud_cdr_via_rich_stream_control.py
      - name: Preserve physical results and failures
        if: always()
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          root=cloud-cdr-via-rich-stream-control
          mkdir -p "$root"
          if [ ! -f "$root/result.json" ]; then
            printf '%s\n' '{"status":"FAIL_MISSING_REPORT","accepted":false}' > "$root/result.json"
          fi
          stem="cdr-via-rich-stream-control-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          cp "$root/result.json" "$stem.summary.json"
          python3 scripts/cloud_chunked_results.py --directory "$root" --stem "$stem"
          python3 - "$stem" <<'PYCODE'
          import json,subprocess,sys
          stem=sys.argv[1];manifest=stem+'.parts.json';m=json.load(open(manifest))
          subprocess.run([sys.executable,'scripts/publish_cloud_results.py','--group','cdr-via-rich-stream-control',stem+'.summary.json',manifest,*[p['name']for p in m['parts']]],check=True)
          PYCODE
      - name: Retain evidence after publication failure
        if: always() && steps.publish.outcome == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cdr-via-rich-stream-control-${{ github.run_id }}
          path: cloud-cdr-via-rich-stream-control/
          retention-days: 30
