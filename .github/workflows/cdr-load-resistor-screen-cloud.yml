name: cdr-load-resistor-screen-cloud
on:
  push:
    branches: [codex/complete-open-work]
    paths: [.github/workflows/cdr-load-resistor-screen-cloud.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cdr-load-resistor-screen-${{ github.ref }}
  cancel-in-progress: false
jobs:
  syntax-controls:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Require exact original test adaptation with native MOS model and safety gates
        run: |
          python3 - <<'PYCODE'
          import hashlib,json
          from pathlib import Path
          p=json.loads(Path('scripts/cdr-hybrid-v2-loaded-source-delta.json').read_text())
          original=Path(p['baseline_path']).read_bytes()
          assert hashlib.sha256(original).hexdigest()==p['baseline_sha256']
          text=original.decode()
          for e in p['edits']:
              assert text.count(e['before'])==e['count']
              text=text.replace(e['before'],e['after'])
          candidate=Path(p['candidate_path']).read_bytes()
          assert candidate==text.encode()
          assert hashlib.sha256(candidate).hexdigest()==p['candidate_sha256']
          print('PASS: original waveform and acceptance gates preserved; same gates with native select and XOR MOS tails')
          PYCODE
      - name: Verify exact PD484 model, count and physical parallel-tail adaptation
        run: python3 scripts/check_cdr_load_resistor_screen_sources.py
      - name: Compile controller before starting any native corner
        run: python3 -m py_compile scripts/cloud_cdr_load_resistor_screen.py
  native-current:
    needs: syntax-controls
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        case: [nominal_early, nominal_late]
        length: ['1.2', '1.6']
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Restore native simulator dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends tcl8.6 libsndfile1 libsamplerate0 libreadline8t64 libxaw7 libxt6 libxft2 libfontconfig1
          python3 -m pip install numpy==2.3.3
      - name: Screen native load dimensions on frozen wiring with unchanged bit and device gates; no candidate-layout claim
        run: |
          python3 -m py_compile scripts/cloud_cdr_load_resistor_screen.py
          python3 scripts/cloud_cdr_load_resistor_screen.py --case ${{ matrix.case }} --load-length-um ${{ matrix.length }}
      - name: Preserve native results and failures
        if: always()
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          root=cloud-cdr-load-resistor-screen-${{ matrix.length }}-${{ matrix.case }}
          mkdir -p "$root"
          if [ ! -f "$root/result.json" ]; then
            printf '%s\n' '{"status":"FAIL_MISSING_REPORT","accepted":false}' > "$root/result.json"
          fi
          stem="cdr-load-resistor-screen-${{ matrix.length }}-${{ matrix.case }}-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          cp "$root/result.json" "$stem.summary.json"
          python3 scripts/cloud_chunked_results.py --directory "$root" --stem "$stem"
          python3 - "$stem" <<'PYCODE'
          import json,subprocess,sys
          stem=sys.argv[1];manifest=stem+'.parts.json';m=json.load(open(manifest))
          subprocess.run([sys.executable,'scripts/publish_cloud_results.py','--group','cdr-load-resistor-screen-${{ matrix.length }}-${{ matrix.case }}',stem+'.summary.json',manifest,*[p['name']for p in m['parts']]],check=True)
          PYCODE
      - name: Retain evidence after publication failure
        if: always() && steps.publish.outcome == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cdr-load-resistor-screen-${{ matrix.length }}-${{ matrix.case }}-${{ github.run_id }}
          path: cloud-cdr-load-resistor-screen-${{ matrix.length }}-${{ matrix.case }}/
          retention-days: 30


# Preserve individual existing XOR tail gates; aggregate only four new sampler MOS per stage.

# Replace only explicit RC census fields; verify all original dependency SHA256 literals remain unchanged.
