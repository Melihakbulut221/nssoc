name: cdr-active-levelshift-v57-extracted-cloud
on:
  push:
    branches: [codex/complete-open-work]
    paths:
      - .github/workflows/cdr-active-levelshift-v57-extracted-cloud.yml
      - scripts/cloud_cdr_active_levelshift_v57_extracted.py
      - scripts/cdr-active-levelshift-v57-extracted-method.json
      - docs/evidence/cdr-active-levelshift-v57-composition-pass-20261024.json
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cdr-active-levelshift-v57-extracted
  cancel-in-progress: false
jobs:
  controls:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: |
          python3 -m pip install numpy==2.3.3
          python3 -m py_compile scripts/cloud_cdr_active_levelshift_v57_extracted.py
          PYTHONPATH=scripts python3 -c "from cloud_cdr_active_levelshift_v57_extracted import source_check; print(source_check())"
      - name: Verify unchanged original loaded waveform acceptance gates
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path
          old=Path('scripts/cloud_cdr_active_levelshift_v49.py').read_text()
          new=Path('scripts/cloud_cdr_active_levelshift_v57_extracted.py').read_text()
          def region(text):
              return text[text.index('  active=t>=START'):text.index(' except BaseException as error:')]
          expected=region(old).replace("tail=sum(w['@n.xgain.xt'+str(i)+'.nsg13_lv_nmos[ids]']for i in range(2))","tail=sum(w['@n.'+name+'.nsg13_lv_nmos[ids]']for name in bound['tails'])")
          expected=expected.replace('PASS_NATIVE_ACTIVE_LEVELSHIFT_FAULT_DETECTION_NOT_ACCEPTANCE','PASS_NATIVE_EXTRACTED_LEVELSHIFT_FAULT_DETECTION_NOT_ACCEPTANCE').replace('PASS_NATIVE_ACTIVE_LEVELSHIFT_COMPONENT_ONLY_REQUIRES_PARENT_PHYSICAL_AND_FULL_CDR','PASS_NATIVE_EXTRACTED_LEVELSHIFT_LEAF_REQUIRES_PARENT_AND_FULL_CDR').replace('REJECTED_NATIVE_ACTIVE_LEVELSHIFT_COMPONENT','REJECTED_NATIVE_EXTRACTED_LEVELSHIFT_LEAF')
          assert region(new)==expected
          assert "UI=125e-12;START=2e-9;STOP=START+258*UI;STEP=.3125e-12" in new
          print('PASS_ORIGINAL_DEVICE_SIGNAL_COMMONMODE_GATES_UNCHANGED')
          PYCODE
  native:
    needs: controls
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        case: [nominal, hot_low, cold_high, swap_output, bias_off]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Restore native simulator dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends tcl8.6 libsndfile1 libsamplerate0 libreadline8t64 libxaw7 libxt6 libxft2 libfontconfig1
          python3 -m pip install numpy==2.3.3
      - name: Test actual18device1244R835C leaf with original full source and load stress
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/cloud_cdr_active_levelshift_v57_extracted.py --case ${{ matrix.case }}
      - name: Preserve complete component evidence including all failures
        if: always()
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          root=cloud-cdr-active-levelshift-v57-extracted-${{ matrix.case }}
          mkdir -p "$root"
          if [ ! -f "$root/result.json" ]; then
            printf '%s\n' '{"status":"FAIL_MISSING_REPORT","full_phy_accepted":false}' > "$root/result.json"
          fi
          stem="cdr-active-levelshift-v57-extracted-${{ matrix.case }}-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          cp "$root/result.json" "$stem.summary.json"
          python3 scripts/cloud_chunked_results.py --directory "$root" --stem "$stem"
          python3 - "$stem" <<'PYCODE'
          import json,subprocess,sys
          stem=sys.argv[1];m=json.load(open(stem+'.parts.json'))
          subprocess.run([sys.executable,'scripts/publish_cloud_results.py','--group','cdr-active-levelshift-v57-extracted-${{ matrix.case }}',stem+'.summary.json',stem+'.parts.json',*[p['name']for p in m['parts']]],check=True)
          PYCODE
      - name: Retain evidence after publication failure
        if: always() && steps.publish.outcome == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cdr-active-levelshift-v57-extracted-${{ matrix.case }}-${{ github.run_id }}
          path: cloud-cdr-active-levelshift-v57-extracted-${{ matrix.case }}/
          retention-days: 30
