name: cdr-v36-v37-transfer-cloud
on:
  push:
    branches: [codex/complete-open-work]
    paths: [.github/workflows/cdr-v36-v37-transfer-cloud.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cdr-v36-v37-transfer-${{ github.ref }}
  cancel-in-progress: false
jobs:
  native-physical:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        case: [nominal_early, nominal_late]
        variant: [slave_drive15_load12, cdbias15]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install pinned numerical reader dependency
        run: python3 -m pip install numpy==2.3.3
      - name: Compile source-bound diagnosis in cloud
        run: |
          python3 scripts/check_cdr_v36_v37_transfer_sources.py
          python3 -m py_compile scripts/cloud_cdr_v36_v37_transfer.py scripts/cdr_capture_windows.py scripts/cdr_candidate_input_bias_observation.py
          PYTHONPATH=scripts python3 -c "from cloud_cdr_v36_v37_transfer import controls,parallel_controls,window_controls,bias; print(controls()); print(parallel_controls()); print(window_controls()); print(bias.controls())"
      - name: Observe actual C/D input-divider terminals and master headroom with original full checks
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/cloud_cdr_v36_v37_transfer.py --variant ${{ matrix.variant }} --case ${{ matrix.case }}
      - name: Preserve physical results and failures
        if: always()
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          root=cloud-cdr-v36-v37-transfer-${{ matrix.variant }}-${{ matrix.case }}
          mkdir -p "$root"
          if [ ! -f "$root/result.json" ]; then
            printf '%s\n' '{"status":"FAIL_MISSING_REPORT","accepted":false}' > "$root/result.json"
          fi
          stem="cdr-v36-v37-transfer-${{ matrix.variant }}-${{ matrix.case }}-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          cp "$root/result.json" "$stem.summary.json"
          python3 scripts/cloud_chunked_results.py --directory "$root" --stem "$stem"
          python3 - "$stem" <<'PYCODE'
          import json,subprocess,sys
          stem=sys.argv[1];manifest=stem+'.parts.json';m=json.load(open(manifest))
          subprocess.run([sys.executable,'scripts/publish_cloud_results.py','--group','cdr-v36-v37-transfer-${{ matrix.variant }}-${{ matrix.case }}',stem+'.summary.json',manifest,*[p['name']for p in m['parts']]],check=True)
          PYCODE
      - name: Retain evidence after publication failure
        if: always() && steps.publish.outcome == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cdr-v36-v37-transfer-${{ matrix.variant }}-${{ matrix.case }}-${{ github.run_id }}
          path: cloud-cdr-v36-v37-transfer-${{ matrix.variant }}-${{ matrix.case }}/
          retention-days: 30

# Compare actual original full v36/v37 recordings only. No new native simulation, acceptance gate, ideal divider or waveform trimming.
