name: cloud-migration-checks
run-name: cloud-migration-checks ${{ inputs.request_id || github.run_id }}
on:
  push:
    branches: ['codex/complete-open-work']
    paths:
      - scripts/finish_cloud_output_migration.py
      - scripts/clean_cloud_output_links.py
      - sw/tests/test_cloud_output_links.py
      - sw/tests/test_cloud_result_publication.py
      - scripts/publish_cloud_results.py
      - sw/tests/test_cloud_migration_finalization.py
      - scripts/migrate_outputs_to_cloud.py
      - sw/tests/test_cloud_output_migration.py
      - scripts/verify_cloud_output_restore.py
      - sw/tests/test_cloud_restore_hardlinks.py
      - .github/workflows/cloud-migration-checks.yml
  workflow_dispatch:
    inputs:
      request_id:
        type: string
      verification_tag:
        type: string
      verification_manifest:
        type: string
permissions:
  contents: read
jobs:
  archive-readback:
    if: ${{ inputs.verification_tag != '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Verify every preserved byte without executing archive contents
        env:
          GH_TOKEN: ${{ github.token }}
          ARCHIVE_TAG: ${{ inputs.verification_tag }}
          ARCHIVE_MANIFEST: ${{ inputs.verification_manifest }}
        run: python3 scripts/cloud_archive_readback.py --tag "$ARCHIVE_TAG" --manifest "$ARCHIVE_MANIFEST"
  deletion-and-resume:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install pytest reuse numpy==2.3.3
      - run: python scripts/spdx_check.py
      - run: python scripts/licence_inventory.py --check
      - run: python -m reuse lint
      - run: python -m pytest -q sw/tests/test_cloud_output_migration.py sw/tests/test_cloud_restore_hardlinks.py sw/tests/test_cloud_migration_finalization.py sw/tests/test_cloud_output_links.py sw/tests/test_cloud_result_publication.py sw/tests/test_cloud_transient_migration.py sw/tests/test_cloud_checkout_retirement.py
      - name: Verify cloud-native capture commands and complete serializer source census
        run: python -m pytest -q sw/tests/test_cloud_tx_mux4.py sw/tests/test_cloud_tx_original_bits.py
