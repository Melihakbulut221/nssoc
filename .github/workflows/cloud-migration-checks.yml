name: cloud-migration-checks
on:
  push:
    branches: ['codex/complete-open-work']
    paths:
      - scripts/migrate_outputs_to_cloud.py
      - sw/tests/test_cloud_output_migration.py
      - .github/workflows/cloud-migration-checks.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deletion-and-resume:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install pytest reuse
      - run: python scripts/spdx_check.py
      - run: python scripts/licence_inventory.py --check
      - run: python -m reuse lint
      - run: python -m pytest -q sw/tests/test_cloud_output_migration.py
