name: tx-return64-diagnosis-cloud
on:
  push:
    branches: [codex/complete-open-work]
    paths: [.github/workflows/tx-return64-diagnosis-cloud.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tx-return64-diagnosis-${{ github.ref }}
  cancel-in-progress: false
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Reproduce original rejection and diagnose actual all-leg samples
        run: |
          python3 -m pip install numpy==2.3.3
          python3 -m py_compile scripts/cloud_tx_return64_diagnosis.py
          python3 scripts/cloud_tx_return64_diagnosis.py
      - name: Preserve diagnostic evidence and failures
        if: always()
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          root=cloud-tx-return64-diagnosis
          mkdir -p "$root"
          if [ ! -f "$root/result.json" ]; then
            printf '%s\n' '{"status":"FAIL_MISSING_REPORT","accepted":false}' > "$root/result.json"
          fi
          stem="tx-return64-diagnosis-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          cp "$root/result.json" "$stem.summary.json"
          python3 scripts/cloud_chunked_results.py --directory "$root" --stem "$stem"
          python3 - "$stem" <<'PYCODE'
          import json,subprocess,sys
          stem=sys.argv[1];m=json.load(open(stem+'.parts.json'))
          subprocess.run([sys.executable,'scripts/publish_cloud_results.py','--group','tx-return64-diagnosis',stem+'.summary.json',stem+'.parts.json',*[p['name']for p in m['parts']]],check=True)
          PYCODE
      - name: Retain evidence if release publication fails
        if: always() && steps.publish.outcome == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tx-return64-diagnosis-${{ github.run_id }}
          path: cloud-tx-return64-diagnosis/
          retention-days: 30
