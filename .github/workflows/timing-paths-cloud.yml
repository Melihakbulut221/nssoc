name: timing-paths-cloud
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-paths:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Exact native runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libfuse2
          curl --fail --location --retry 4 https://github.com/librelane/librelane/releases/download/3.0.5/librelane-devshell-x86_64.AppImage -o "$RUNNER_TEMP/librelane.AppImage"
          echo "d6a349ec65be11456e96c4981d35f63ca34d3c85daf79a51e1ccb907bb5d7466  $RUNNER_TEMP/librelane.AppImage" | sha256sum --check
          chmod +x "$RUNNER_TEMP/librelane.AppImage"
          echo "CLOUD_APPIMAGE=$RUNNER_TEMP/librelane.AppImage" >> "$GITHUB_ENV"
      - name: Resolve actual worst paths to native signal names
        run: python3 scripts/trace_cloud_timing_paths.py
      - name: Preserve complete trace and failures
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          archive='timing-paths-cloud-${{ github.run_id }}-${{ github.run_attempt }}.tar.gz'
          tar -czf "$archive" cloud-timing-paths
          sha256sum "$archive" > "$archive.sha256"
          gh release upload cloud-migration-20261012-000 "$archive" "$archive.sha256"
          if [ -f cloud-timing-paths/paths.json ]; then
            cp cloud-timing-paths/paths.json "${archive%.tar.gz}.json"
            gh release upload cloud-migration-20261012-000 "${archive%.tar.gz}.json"
          fi
