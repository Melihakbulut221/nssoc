name: timing-alu-prefix
on:
  push:
    paths:
      - .github/workflows/timing-alu-prefix.yml
  workflow_dispatch:
    inputs:
      phase:
        description: Fresh all-output ALU proof, optionally followed by matched C10 synthesis
        required: true
        default: synthesis
        type: choice
        options:
          - proof
          - synthesis
permissions:
  contents: read
concurrency:
  group: timing-alu-prefix-${{ github.ref }}
  cancel-in-progress: false
jobs:
  experiment:
    runs-on: ubuntu-22.04
    timeout-minutes: 360 # Hosted ceiling; no native elapsed-time watchdog.
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PHASE: ${{ inputs.phase || 'synthesis' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Pure source, recipe and failed-proof guards
        run: |
          python3 -m pip install pytest==8.4.2
          python3 -m pytest -q sw/tests/test_alu_prefix_experiment.py
      - name: Install AppImage runtime prerequisite
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libfuse2
      - name: Prove complete ALU and optionally synthesize matched current profile
        run: |
          python3 scripts/run_cloud_alu_prefix.py --phase "$PHASE" \
            --output "$GITHUB_WORKSPACE/alu-prefix-result" --work "$GITHUB_WORKSPACE/alu-prefix-work"
      - name: Preserve exact inputs, recipes, proofs and any failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: alu-prefix-${{ env.PHASE }}-${{ github.run_attempt }}
          path: alu-prefix-result/
          include-hidden-files: true
          if-no-files-found: error
          compression-level: 1
          retention-days: 30
