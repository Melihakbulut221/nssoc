name: corrpre-targeted-paths-cloud
on:
  push:
    branches: [codex/complete-open-work]
    paths: [.github/workflows/corrpre-targeted-paths-cloud.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: corrpre-targeted-paths-${{ github.ref }}
  cancel-in-progress: false
jobs:
  native-physical:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Inspect exact completed banked repair paths and preserve violations
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -m py_compile scripts/cloud_corrpre_targeted_paths.py
          python3 scripts/cloud_corrpre_targeted_paths.py
      - name: Preserve original-source receipt and complete native trial
        if: always()
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          root=cloud-corrpre-targeted-paths
          mkdir -p "$root"
          if [ ! -f "$root/result.json" ]; then
            printf '%s\n' '{"status":"FAIL_MISSING_REPORT","accepted":false}' > "$root/result.json"
          fi
          stem="corrpre-targeted-paths-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          cp "$root/result.json" "$stem.summary.json"
          python3 scripts/cloud_chunked_results.py --directory "$root" --stem "$stem"
          python3 - "$stem" <<'PYCODE'
          import json,subprocess,sys
          stem=sys.argv[1];manifest=stem+'.parts.json';m=json.load(open(manifest))
          subprocess.run([sys.executable,'scripts/publish_cloud_results.py','--group','corrpre-targeted-paths',stem+'.summary.json',manifest,*[p['name']for p in m['parts']]],check=True)
          PYCODE
      - name: Retain evidence after publication failure
        if: always() && steps.publish.outcome == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: corrpre-targeted-paths-${{ github.run_id }}
          path: cloud-corrpre-targeted-paths/
          retention-days: 30
