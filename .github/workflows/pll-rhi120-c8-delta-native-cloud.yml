name: pll-rhi120-c8-delta-native-cloud
on:
  push:
    branches: [codex/pll-lossless-prefix-publication, codex/complete-open-work]
    paths:
      - scripts/cloud_native_prefix_delta.py
      - scripts/check_pll_lossless_prefix_delta.py
      - scripts/pll-lossless-prefix-delta-method.json
      - scripts/cloud_pll_rhi120_c8_delta_adapter.py
      - scripts/check_pll_rhi120_c8_delta_adapter.py
      - scripts/pll-rhi120-c8-delta-adapter-method.json
      - .github/workflows/pll-rhi120-c8-delta-native-cloud.yml
  workflow_dispatch:
    inputs:
      source_checkpoint:
        description: Exact audited run40001626503 same-process descriptor only
        required: true
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: pll-rhi120-c8-native-sparse
  cancel-in-progress: false
jobs:
  controls:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Qualify transport and unchanged native gates before any activation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -m pip install numpy==2.3.3
          python3 -m py_compile scripts/cloud_native_prefix_delta.py scripts/cloud_pll_rhi120_c8_delta_adapter.py scripts/check_pll_rhi120_c8_delta_adapter.py
          python3 scripts/check_pll_lossless_prefix_delta.py
          python3 scripts/check_pll_rhi120_c8_delta_adapter.py
      - name: Preserve adapter and transport controls including rejections
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PYCODE'
          import json,os,pathlib,subprocess,sys
          for group in ['pll-lossless-prefix-delta-controls','pll-rhi120-c8-delta-adapter-controls']:
            out=pathlib.Path('cloud-'+group);out.mkdir(exist_ok=True)
            report=out/'result.json'
            if not report.exists():report.write_text(json.dumps(dict(status='FAIL_MISSING_CONTROLS',full_capture_accepted=False))+'\n')
            stem=group+'-'+os.environ['GITHUB_RUN_ID']+'-'+os.environ['GITHUB_RUN_ATTEMPT']
            pathlib.Path(stem+'.summary.json').write_bytes(report.read_bytes())
            subprocess.run([sys.executable,'scripts/cloud_chunked_results.py','--directory',str(out),'--stem',stem],check=True)
            parts=json.load(open(stem+'.parts.json'))
            subprocess.run([sys.executable,'scripts/publish_cloud_results.py','--group',group,stem+'.summary.json',stem+'.parts.json',*[p['name']for p in parts['parts']]],check=True)
          PYCODE
  native:
    if: github.event_name == 'workflow_dispatch' && github.ref_name == 'codex/complete-open-work'
    needs: controls
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Bind the only permitted same-process source before restoring it
        env:
          SOURCE_CHECKPOINT: ${{ inputs.source_checkpoint }}
        run: |
          python3 - <<'PYCODE'
          import json,os
          expected=dict(run=40001626503,attempt=1,stage='sparse',summary_sha256='1f990f8de03976caf21be8592e6584f9b4e6906306133f6b729a171e51534509',parts_sha256='ca9a995433ce65fba448e081a5b00e5a012ac3fd829869c553d90f83aad08974')
          assert json.loads(os.environ['SOURCE_CHECKPOINT'])==expected
          assert os.environ['GITHUB_REF_NAME']=='codex/complete-open-work'
          assert os.environ['GITHUB_RUN_ATTEMPT']=='1'
          PYCODE
      - name: Install cloud-only checkpoint dependencies
        run: |
          # Hosted disposable image SDKs are unrelated to this CAD job.
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          df -h "$GITHUB_WORKSPACE"
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends btrfs-progs btrfs-compsize build-essential pkg-config libprotobuf-dev libprotobuf-c-dev protobuf-c-compiler protobuf-compiler python3-protobuf uuid-dev libbsd-dev libcap-dev libnet1-dev libnl-3-dev libsndfile1 libsamplerate0 libreadline8t64 libxaw7 libxt6 libxft2 libfontconfig1
          git init "$RUNNER_TEMP/criu-src"
          git -C "$RUNNER_TEMP/criu-src" remote add origin https://github.com/checkpoint-restore/criu.git
          git -C "$RUNNER_TEMP/criu-src" fetch --depth 1 origin 9539417f3e3cfa4eb84c319cd71f4d52f1f08645
          git -C "$RUNNER_TEMP/criu-src" checkout --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/criu-src" rev-parse HEAD)" = 9539417f3e3cfa4eb84c319cd71f4d52f1f08645
          make -C "$RUNNER_TEMP/criu-src" -j2 criu PYTHON=/usr/bin/python3 2>&1 | tee "$RUNNER_TEMP/criu-build.log"
          sudo install -m 755 "$RUNNER_TEMP/criu-src/criu/criu" /usr/sbin/criu
          python3 - <<'PYCODE'
          import hashlib,json,os,pathlib,subprocess
          p=pathlib.Path('/usr/sbin/criu')
          d=dict(source_repository='https://github.com/checkpoint-restore/criu',source_tag='v4.2.1',source_commit='9539417f3e3cfa4eb84c319cd71f4d52f1f08645',binary_sha256=hashlib.sha256(p.read_bytes()).hexdigest(),version=subprocess.check_output([str(p),'--version'],text=True),libraries=subprocess.check_output(['ldd',str(p)],text=True))
          (pathlib.Path(os.environ['RUNNER_TEMP'])/'criu-build.json').write_text(json.dumps(d,indent=2)+'\n')
          PYCODE
          python3 -m pip install numpy==2.3.3
          python3 -m py_compile scripts/cloud_pll_rhi120_c8_sparse.py
      - name: Reclaim proven disposable SDK headroom before restoring any native capsule
        run: |
          python3 scripts/cloud_pll_storage_headroom.py
      - name: Reclaim only unused hosted image and package caches before allocating storage
        run: |
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test -z "$(docker ps -aq)"
          df -B1 "$GITHUB_WORKSPACE"
          docker image prune --all --force
          sudo apt-get clean
          df -B1 "$GITHUB_WORKSPACE"
      - name: Continue only the completed saved RHI120 process with lossless sparse storage
        id: native
        env:
          SOURCE_CHECKPOINT: ${{ inputs.source_checkpoint }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/check_pll_rhi120_c8_sparse_resume_sources.py
          python3 scripts/cloud_pll_rhi120_c8_sparse.py --stage sparse --seconds 7200
      - name: Publish exact prefix-bound delta without retransmitting the immutable prefix
        if: always()
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          CAPSULE_STAGE: sparse
          NATIVE_OUTCOME: ${{ steps.native.outcome }}
        run: python3 scripts/cloud_pll_rhi120_c8_delta_adapter.py --publish
      - name: Retain unqualified sparse physical working files if publication fails
        if: always() && steps.publish.outcome == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: unqualified-pll-physical-sparse-working-${{ github.run_id }}
          path: |
            cloud-pll-rhi120-c8-native/
            cloud-pll-rhi120-c8-native-delta/
            cloud-pll-rhi120-c8-delta-publication/
          compression-level: 1
          retention-days: 30
