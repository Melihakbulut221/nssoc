name: pcie-closure-cloud
on:
  push:
    branches: ['codex/complete-open-work']
    paths:
      - .github/workflows/pcie-closure-cloud.yml
      - scripts/run_cloud_ack_delta.py
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pcie-closure-cloud-${{ github.ref }}
  cancel-in-progress: false
jobs:
  ack-proof-and-ports:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: YosysHQ/setup-oss-cad-suite@aefa8397bbf8fc6670a0a62af9805a89738f3cde
        with:
          version: '2026-08-04'
          github-token: ${{ github.token }}
      - name: Prepare hosted simulator environment
        run: |
          python3 -m venv hw/.venv
          hw/.venv/bin/pip install -r hw/requirements.txt
      - name: Verify frozen candidate, complete combinational proof and actual replay ports
        run: hw/.venv/bin/python scripts/run_cloud_ack_delta.py
      - name: Preserve failures as well as passing evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ack-delta-cloud-${{ github.run_id }}-${{ github.run_attempt }}
          path: cloud-ack-result/
          if-no-files-found: error
          retention-days: 30
      - name: Keep a permanent copy with its checksum
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test -f cloud-ack-result/result.json
          archive="ack-delta-cloud-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.tar.gz"
          tar -czf "$archive" cloud-ack-result
          sha256sum "$archive" > "$archive.sha256"
          gh release upload evidence-20261006-pcie-closure "$archive" "$archive.sha256"
