name: pll845-reader-migration-cloud
on:
  push:
    branches: [codex/complete-open-work]
    paths: [.github/workflows/pll845-reader-migration-cloud.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pll845-reader-migration
  cancel-in-progress: false
jobs:
  observe:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install pinned header reader dependency
        run: python3 -m pip install numpy==2.3.3
      - name: Qualify exact reader-only integration and original checkpoint method contracts
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/check_pll845_reader_migration.py
      - name: Publish reader migration controls without native activation
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p cloud-pll845-reader-migration
          if [ ! -f cloud-pll845-reader-migration/result.json ]; then
            printf '%s\n' '{"status":"FAIL_MISSING_OBSERVATION","native_activation_allowed":false}' > cloud-pll845-reader-migration/result.json
          fi
          stem="pll845-reader-migration-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          cp cloud-pll845-reader-migration/result.json "$stem.summary.json"
          python3 scripts/cloud_chunked_results.py --directory cloud-pll845-reader-migration --stem "$stem"
          python3 - "$stem" <<'PYCODE'
          import json,subprocess,sys
          s=sys.argv[1];m=json.load(open(s+'.parts.json'))
          subprocess.run([sys.executable,'scripts/publish_cloud_results.py','--group','pll845-reader-migration',s+'.summary.json',s+'.parts.json',*[x['name']for x in m['parts']]],check=True)
          PYCODE
