name: Built engine observer off on route tails
on:
  workflow_dispatch:
    inputs:
      native:
        type: boolean
        required: true
        default: false
        description: Run separately reserved route and audit stages only after source authorization
permissions:
  contents: read
  actions: read
defaults:
  run:
    shell: bash
concurrency:
  group: mainchip-built-engine-route-tail-${{ github.ref }}
  cancel-in-progress: false
env:
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  source-controls:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Preserve qualified shared-prefix controls
        run: |
          python3 -B scripts/check_mainchip_built_engine_route_prefix.py > route-prefix-controls.json
      - name: Actual tail source admission and synthetic boundary controls
        run: |
          python3 -B scripts/check_mainchip_built_engine_route_tail.py > route-tail-controls.json
      - name: Always emit complete exact control records
        if: always()
        run: |
          python3 - <<'PY'
          import base64,hashlib,json
          from pathlib import Path
          for name in ("route-prefix-controls.json","route-tail-controls.json"):
              p=Path(name);raw=p.read_bytes() if p.is_file() else b""
              chunks=[raw[i:i+6000] for i in range(0,len(raw),6000)]
              print("ROUTE_TAIL_RECORD_INDEX "+json.dumps(dict(path=name,present=p.is_file(),bytes=len(raw),sha256=hashlib.sha256(raw).hexdigest(),chunks=len(chunks))))
              for i,b in enumerate(chunks):
                  print("ROUTE_TAIL_RECORD_CHUNK "+json.dumps(dict(path=name,index=i,base64=base64.b64encode(b).decode())))
          PY
      - name: Preserve source controls
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: route-tail-source-controls-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            route-prefix-controls.json
            route-tail-controls.json
          if-no-files-found: error
          retention-days: 90
  route-only:
    if: ${{ inputs.native }}
    needs: source-controls
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        mode: ["off", "on"]
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      NSSOC_ROUTE_TAIL_MODE: ${{ matrix.mode }}
      NSSOC_ROUTE_TAIL_STAGE: route
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Repeat exact controls before transport or native work
        run: |
          python3 -B scripts/check_mainchip_built_engine_route_prefix.py > route-prefix-controls.json
          python3 -B scripts/check_mainchip_built_engine_route_tail.py > route-tail-controls.json
      - name: Require all five independently reserved releases before downloads
        run: |
          python3 -B scripts/wait_cloud_tested_source_release.py --group mainchip-built-engine-route-tail-off-route
          python3 -B scripts/wait_cloud_tested_source_release.py --group mainchip-built-engine-route-tail-on-route
          python3 -B scripts/wait_cloud_tested_source_release.py --group mainchip-built-engine-route-tail-off-audit
          python3 -B scripts/wait_cloud_tested_source_release.py --group mainchip-built-engine-route-tail-on-audit
          python3 -B scripts/wait_cloud_tested_source_release.py --group mainchip-built-engine-route-tail-compare
      - name: Execute one separately owned route stage
        id: native
        run: |
          python3 -B scripts/cloud_mainchip_built_engine_route_tail.py probe
      - name: Freeze the full route workspace after successful owned cleanup
        if: ${{ success() && steps.native.outcome == 'success' }}
        run: |
          python3 -B scripts/cloud_mainchip_built_engine_route_tail.py handoff
      - name: Permanently preserve complete success or failure evidence
        if: ${{ always() && steps.native.outcome != 'skipped' }}
        run: |
          python3 -B scripts/cloud_mainchip_built_engine_route_tail.py publish
      - name: Always emit exact terminal and repeated-control records
        if: always()
        run: |
          python3 - <<'PY'
          import base64,hashlib,json,os
          from pathlib import Path
          group='mainchip-built-engine-route-tail-'+os.environ['NSSOC_ROUTE_TAIL_MODE']+'-'+os.environ['NSSOC_ROUTE_TAIL_STAGE']
          out=Path(os.environ['RUNNER_TEMP'])/(group+'-'+os.environ['GITHUB_RUN_ID']+'-'+os.environ['GITHUB_RUN_ATTEMPT'])/'out'
          paths=[Path('route-prefix-controls.json'),Path('route-tail-controls.json')]
          paths += [out/name for name in ('host-result.json','inner-result.json','case-result.json','observer-diagnosis.json','writer-raw.json','prefix-restoration.json','route-handoff.json','route-handoff-inventory.json','route-source-envelope.json','route-restoration.json','publication.json')]
          for p in paths:
              raw=p.read_bytes() if p.is_file() else b'';chunks=[raw[i:i+6000] for i in range(0,len(raw),6000)]
              print('ROUTE_TAIL_RECORD_INDEX '+json.dumps(dict(path=str(p),present=p.is_file(),bytes=len(raw),sha256=hashlib.sha256(raw).hexdigest(),chunks=len(chunks))))
              for i,b in enumerate(chunks):
                  print('ROUTE_TAIL_RECORD_CHUNK '+json.dumps(dict(path=str(p),index=i,base64=base64.b64encode(b).decode())))
          PY
      - name: Complete native output artifact fallback
        if: ${{ always() && steps.native.outcome != 'skipped' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: route-tail-route-${{ matrix.mode }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/mainchip-built-engine-route-tail-${{ matrix.mode }}-route-${{ github.run_id }}-${{ github.run_attempt }}/out/
          if-no-files-found: error
          retention-days: 90
          compression-level: 1
  audit-only:
    if: ${{ inputs.native }}
    needs: [source-controls, route-only]
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        mode: ["off", "on"]
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      NSSOC_ROUTE_TAIL_MODE: ${{ matrix.mode }}
      NSSOC_ROUTE_TAIL_STAGE: audit
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Repeat exact controls before transport or native work
        run: |
          python3 -B scripts/check_mainchip_built_engine_route_prefix.py > route-prefix-controls.json
          python3 -B scripts/check_mainchip_built_engine_route_tail.py > route-tail-controls.json
      - name: Require all five independently reserved releases before downloads
        run: |
          python3 -B scripts/wait_cloud_tested_source_release.py --group mainchip-built-engine-route-tail-off-route
          python3 -B scripts/wait_cloud_tested_source_release.py --group mainchip-built-engine-route-tail-on-route
          python3 -B scripts/wait_cloud_tested_source_release.py --group mainchip-built-engine-route-tail-off-audit
          python3 -B scripts/wait_cloud_tested_source_release.py --group mainchip-built-engine-route-tail-on-audit
          python3 -B scripts/wait_cloud_tested_source_release.py --group mainchip-built-engine-route-tail-compare
      - name: Execute one separately owned audit stage
        id: native
        run: |
          python3 -B scripts/cloud_mainchip_built_engine_route_tail.py probe

      - name: Permanently preserve complete success or failure evidence
        if: ${{ always() && steps.native.outcome != 'skipped' }}
        run: |
          python3 -B scripts/cloud_mainchip_built_engine_route_tail.py publish
      - name: Always emit exact terminal and repeated-control records
        if: always()
        run: |
          python3 - <<'PY'
          import base64,hashlib,json,os
          from pathlib import Path
          group='mainchip-built-engine-route-tail-'+os.environ['NSSOC_ROUTE_TAIL_MODE']+'-'+os.environ['NSSOC_ROUTE_TAIL_STAGE']
          out=Path(os.environ['RUNNER_TEMP'])/(group+'-'+os.environ['GITHUB_RUN_ID']+'-'+os.environ['GITHUB_RUN_ATTEMPT'])/'out'
          paths=[Path('route-prefix-controls.json'),Path('route-tail-controls.json')]
          paths += [out/name for name in ('host-result.json','inner-result.json','case-result.json','observer-diagnosis.json','writer-raw.json','prefix-restoration.json','route-handoff.json','route-handoff-inventory.json','route-source-envelope.json','route-restoration.json','publication.json')]
          for p in paths:
              raw=p.read_bytes() if p.is_file() else b'';chunks=[raw[i:i+6000] for i in range(0,len(raw),6000)]
              print('ROUTE_TAIL_RECORD_INDEX '+json.dumps(dict(path=str(p),present=p.is_file(),bytes=len(raw),sha256=hashlib.sha256(raw).hexdigest(),chunks=len(chunks))))
              for i,b in enumerate(chunks):
                  print('ROUTE_TAIL_RECORD_CHUNK '+json.dumps(dict(path=str(p),index=i,base64=base64.b64encode(b).decode())))
          PY
      - name: Complete native output artifact fallback
        if: ${{ always() && steps.native.outcome != 'skipped' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: route-tail-audit-${{ matrix.mode }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/mainchip-built-engine-route-tail-${{ matrix.mode }}-audit-${{ github.run_id }}-${{ github.run_attempt }}/out/
          if-no-files-found: error
          retention-days: 90
          compression-level: 1
  comparison:
    if: ${{ inputs.native }}
    needs: [source-controls, audit-only]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      NSSOC_ROUTE_TAIL_MODE: compare
      NSSOC_ROUTE_TAIL_STAGE: compare
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Recheck source before comparison
        run: |
          python3 -B scripts/check_mainchip_built_engine_route_tail.py > route-tail-controls.json
      - name: Compare complete authenticated audit outputs
        run: |
          python3 -B scripts/cloud_mainchip_built_engine_route_tail.py compare
      - name: Preserve complete comparison evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: route-tail-comparison-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/mainchip-built-engine-route-tail-compare-${{ github.run_id }}-${{ github.run_attempt }}/
          if-no-files-found: error
          retention-days: 90
