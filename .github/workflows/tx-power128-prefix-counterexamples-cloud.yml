# SPDX-License-Identifier: Apache-2.0
name: tx-power128-prefix-counterexamples-cloud
on:
  push:
    branches: [codex/complete-open-work]
    paths: [.github/workflows/tx-power128-prefix-counterexamples-cloud.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tx-power128-prefix-counterexamples-${{ github.ref }}
  cancel-in-progress: false
jobs:
  observe-native-prefix:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Prepare cloud-only prefix observer
        run: |
          python3 -m pip install numpy==2.3.3
          python3 -m py_compile scripts/cloud_tx_power128_prefix_counterexamples.py
          PYTHONPATH=scripts python3 -c "import json;from cloud_tx_power128_prefix_rails import controls;print(json.dumps(controls()))"
      - name: Check original electrical gates only where native prefix contains their full sample window
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/cloud_tx_power128_prefix_counterexamples.py
      - name: Retain native proof and every rejection
        if: always()
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          root=cloud-tx-power128-prefix-counterexamples
          mkdir -p "$root"
          if [ ! -f "$root/result.json" ]; then
            printf '%s\n' '{"status":"FAIL_MISSING_REPORT","accepted":false}' > "$root/result.json"
          fi
          stem="tx-power128-prefix-counterexamples-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          cp "$root/result.json" "$stem.summary.json"
          python3 scripts/cloud_chunked_results.py --directory "$root" --stem "$stem"
          python3 - "$stem" <<'PYCODE'
          import json,subprocess,sys
          stem=sys.argv[1];manifest=stem+'.parts.json';m=json.load(open(manifest))
          subprocess.run([sys.executable,'scripts/publish_cloud_results.py','--group','tx-power128-prefix-counterexamples',stem+'.summary.json',manifest,*[p['name']for p in m['parts']]],check=True)
          PYCODE
      - name: Preserve failed publication
        if: always() && steps.publish.outcome == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tx-power128-prefix-counterexamples
          path: cloud-tx-power128-prefix-counterexamples/
          retention-days: 30
