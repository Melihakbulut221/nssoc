name: newer-postcts-cloud
on:
  push:
    branches: ['codex/complete-open-work']
    paths:
      - .github/workflows/newer-postcts-cloud.yml
      - scripts/route_cloud_newer_postcts.py
      - docs/evidence/cloud-newer-postcts-input-20261013.json
  workflow_dispatch:
permissions:
  contents: read
jobs:
  route:
    strategy:
      fail-fast: false
      matrix:
        grid_profile: [half_x, half_y, half_xy]
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Exact native runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libfuse2
          curl --fail --location --retry 4 https://github.com/librelane/librelane/releases/download/3.0.5/librelane-devshell-x86_64.AppImage -o "$RUNNER_TEMP/librelane.AppImage"
          echo "d6a349ec65be11456e96c4981d35f63ca34d3c85daf79a51e1ccb907bb5d7466  $RUNNER_TEMP/librelane.AppImage" | sha256sum --check
          chmod +x "$RUNNER_TEMP/librelane.AppImage"
          echo "CLOUD_APPIMAGE=$RUNNER_TEMP/librelane.AppImage" >> "$GITHUB_ENV"
      - name: Reproduce exact newer postCTS then route all domains
        run: python3 scripts/route_cloud_newer_postcts.py --grid-profile '${{ matrix.grid_profile }}'
      - name: Preserve complete source-bound routing and failures
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          archive='newer-postcts-cloud-${{ matrix.grid_profile }}-${{ github.run_id }}-${{ github.run_attempt }}.tar.gz'
          tar -czf "$archive" cloud-newer-postcts
          sha256sum "$archive" > "$archive.sha256"
          gh release upload cloud-migration-20261012-000 "$archive" "$archive.sha256"
          if [ -f cloud-newer-postcts/result.json ]; then
            cp cloud-newer-postcts/result.json "${archive%.tar.gz}.json"
            gh release upload cloud-migration-20261012-000 "${archive%.tar.gz}.json"
          fi
