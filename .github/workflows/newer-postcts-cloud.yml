name: newer-postcts-cloud
on:
  push:
    branches: ['codex/complete-open-work']
    paths:
      - .github/workflows/newer-postcts-cloud.yml
      - scripts/route_cloud_newer_postcts.py
      - scripts/repair_cloud_macro_channels.py
      - docs/evidence/cloud-newer-postcts-input-20261013.json
  workflow_dispatch:
    inputs:
      packet_clusters:
        description: Group only the193 diagnosed congested PCIe packet read cones before fresh placement and CTS
        type: boolean
        default: false
      resume_fresh_cts:
        description: Verify exact saved fresh CTS after native identity check correction; do not rerun placement
        type: boolean
        default: false
      cugr_empty_net_cleanup:
        description: Remove only three independently verified zero-terminal database declarations
        type: boolean
        default: false
      router_solver:
        description: Exact same-placement native solver comparison, experimental CUGR is not signoff
        type: choice
        options: [fast_route, cugr]
        default: fast_route
      grid_profile:
        description: Guide offset fixed at zero; frozen runtime does not shift the routing partition
        type: choice
        options: [baseline]
        default: baseline
      routing_seed:
        description: Native net ordering only; capacity perturbation remains zero
        type: choice
        options: ['0', '13']
        default: '0'
      critical_nets_percentage:
        description: Native timing-critical net preference on exact saved buffer placement
        type: choice
        options: ['0', '30']
        default: '0'
      placement_profile:
        description: Source-bound local placement repair selection
        type: choice
        options: [local_optimize, local_optimize_buffers, local_data_endpoints, routability_data, prects_grt]
        default: local_optimize
      ethernet_hold_depth:
        description: Source-bound proven GMII delay chain to include before fresh routing
        type: choice
        options: ['0', '2']
        default: '0'
      macro_routing_profile:
        description: Conservative routing restriction from exact SRAM pin diagnosis
        type: choice
        options: [baseline, reserve_m5, halo1]
        default: baseline
permissions:
  contents: read
jobs:
  route:
    if: github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        placement_profile: ["${{ inputs.placement_profile || 'local_optimize' }}"]
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Exact native runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libfuse2
          curl --fail --location --retry 4 https://github.com/librelane/librelane/releases/download/3.0.5/librelane-devshell-x86_64.AppImage -o "$RUNNER_TEMP/librelane.AppImage"
          echo "d6a349ec65be11456e96c4981d35f63ca34d3c85daf79a51e1ccb907bb5d7466  $RUNNER_TEMP/librelane.AppImage" | sha256sum --check
          chmod +x "$RUNNER_TEMP/librelane.AppImage"
          echo "CLOUD_APPIMAGE=$RUNNER_TEMP/librelane.AppImage" >> "$GITHUB_ENV"
      - name: Check controller syntax before native replay
        run: |
          python3 -m py_compile scripts/route_cloud_newer_postcts.py scripts/repair_cloud_macro_channels.py
          python3 scripts/route_cloud_newer_postcts.py --self-test
      - name: Reproduce exact newer postCTS then route all domains
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/route_cloud_newer_postcts.py ${{ inputs.packet_clusters && '--packet-clusters' || '' }} ${{ inputs.resume_fresh_cts && '--resume-fresh-cts' || '' }} ${{ inputs.cugr_empty_net_cleanup && '--cugr-empty-net-cleanup' || '' }} --router-solver '${{ inputs.router_solver || 'fast_route' }}' --placement-profile '${{ matrix.placement_profile }}' --ethernet-hold-depth '${{ inputs.ethernet_hold_depth || '0' }}' --macro-routing-profile '${{ inputs.macro_routing_profile || 'baseline' }}' --critical-nets-percentage '${{ inputs.critical_nets_percentage || '0' }}' --routing-seed '${{ inputs.routing_seed || '0' }}' --grid-profile '${{ inputs.grid_profile || 'baseline' }}'
      - name: Preserve complete source-bound routing and failures
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ ! -d cloud-newer-postcts ]; then
            mkdir cloud-newer-postcts
            cp scripts/route_cloud_newer_postcts.py cloud-newer-postcts/failed-source.py
            python3 -c 'import json,os; from pathlib import Path; Path("cloud-newer-postcts/result.json").write_text(json.dumps(dict(status="FAILED_BEFORE_NATIVE_OUTPUT_DIRECTORY_CREATED", source_head=os.environ["GITHUB_SHA"], native_results_available=False))+"\n")'
          fi
          archive='newer-postcts-placement-${{ matrix.placement_profile }}-${{ github.run_id }}-${{ github.run_attempt }}.tar.gz'
          tar -czf "$archive" cloud-newer-postcts
          sha256sum "$archive" > "$archive.sha256"
          python3 scripts/publish_cloud_results.py --group 'route-${{ matrix.placement_profile }}' "$archive" "$archive.sha256"
          if [ -f cloud-newer-postcts/result.json ]; then
            cp cloud-newer-postcts/result.json "${archive%.tar.gz}.json"
            python3 scripts/publish_cloud_results.py --group 'route-${{ matrix.placement_profile }}' "${archive%.tar.gz}.json"
          fi
