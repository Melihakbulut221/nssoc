name: TX phase assertion offset preparation
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: tx-phase-assert-offset-preparation-${{ github.ref }}
  cancel-in-progress: false
jobs:
  preparation-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Prove single physical delta and prepare every original case
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if bash -o pipefail -c 'exit 7 | tee rejected-pipeline.txt'; then exit 1; fi
          python3 -m pip install numpy==2.3.3
          python3 scripts/check_tx_phase_assert_offset_source.py | tee source-controls.json
          python3 scripts/check_tx_phase_assert_offset_preparation.py | tee preparation.json
          python3 - <<'PY'
          import json
          s=json.load(open('source-controls.json'));r=json.load(open('preparation.json'))
          assert s['status']=='PASS_ASSERT_OFFSET244_SOURCE_ONLY_NOT_ELECTRICAL'
          assert len(s['negative_controls'])==14
          assert r['status']=='PASS_ASSERT_OFFSET244_FOUR_PREPARED_UNCHANGED_ORACLE_NOT_NATIVE'
          assert len(r['positive_cases'])==4 and len(r['negative_controls'])==8
          assert all(c['exact_old_deck'] and c['exact_old_vectors_HBT_oracle_limits'] for c in r['positive_cases'].values())
          assert not any(r[k] for k in ('original244_accepted','native_execution','reset_hardware_qualified','layout_RC_included','PLL_connected','full_PHY_accepted'))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: assert-offset-preparation
          path: |
            source-controls.json
            preparation.json
          if-no-files-found: error
          retention-days: 90
