name: tx-strap6-clock-summary-cloud
on:
  push:
    branches: [codex/complete-open-work]
    paths: [.github/workflows/tx-strap6-clock-summary-cloud.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tx-strap6-clock-summary-${{ github.ref }}
  cancel-in-progress: false
jobs:
  syntax-controls:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify unchanged review and engineering gates
        run: python3 scripts/check_tx_v5_final_strap6_path_review_source.py
      - name: Compile read-only native path review
        run: python3 -m py_compile scripts/cloud_tx_strap6_clock_summary.py
  native-current:
    needs: syntax-controls
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install waveform reader
        run: |
          python3 -m pip install numpy==2.3.3
      - name: Summarize verified native edge brackets without rerunning simulation or full-wave review
        run: |
          python3 -m py_compile scripts/cloud_tx_strap6_clock_summary.py
          python3 scripts/cloud_tx_strap6_clock_summary.py
      - name: Preserve native results and failures
        if: always()
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          root=cloud-tx-strap6-clock-summary
          mkdir -p "$root"
          if [ ! -f "$root/result.json" ]; then
            printf '%s\n' '{"status":"FAIL_MISSING_REPORT","accepted":false}' > "$root/result.json"
          fi
          stem="tx-strap6-clock-summary-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          cp "$root/result.json" "$stem.summary.json"
          python3 scripts/cloud_chunked_results.py --directory "$root" --stem "$stem"
          python3 - "$stem" <<'PYCODE'
          import json,subprocess,sys
          stem=sys.argv[1];manifest=stem+'.parts.json';m=json.load(open(manifest))
          subprocess.run([sys.executable,'scripts/publish_cloud_results.py','--group','tx-strap6-clock-summary',stem+'.summary.json',manifest,*[p['name']for p in m['parts']]],check=True)
          PYCODE
      - name: Retain evidence after publication failure
        if: always() && steps.publish.outcome == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tx-strap6-clock-summary-${{ github.run_id }}
          path: cloud-tx-strap6-clock-summary/
          retention-days: 30

