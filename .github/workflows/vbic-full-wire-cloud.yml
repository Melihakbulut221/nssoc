name: vbic-full-wire-cloud
on:
  push:
    branches: [codex/complete-open-work]
    paths: [.github/workflows/vbic-full-wire-cloud.yml]
  workflow_dispatch:
    inputs:
      compact_summary_sha256:
        description: SHA256 of the passing original full-window compact run38796689216 summary
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: vbic-full-wire-${{ github.ref }}
  cancel-in-progress: false
jobs:
  full-window-extracted-wire:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Native runtime dependencies and unchanged parser controls
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libsndfile1 libsamplerate0 libreadline8t64 libxaw7 libxt6 libxft2 libfontconfig1
          python3 -m pip install numpy==2.3.3 networkx==3.5
          python3 scripts/cloud_tx_step_factorial.py --controls-only
      - name: Require passing compact capture then replay pristine and patched physical wire model
        env:
          COMPACT_SUMMARY_SHA256: ${{ inputs.compact_summary_sha256 || 'd0ea24db033fa1f5964b5cae3f12ed2831af3fbd241074638a7d38073534c6f4' }}
        run: python3 scripts/cloud_tx_companion_replay.py --full-window --mode wire --compact-summary-sha256 "$COMPACT_SUMMARY_SHA256"
      - name: Preserve all runtime, circuit and waveform evidence
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p cloud-vbic-full-wire
          if [ ! -f cloud-vbic-full-wire/result.json ]; then
            printf '%s\n' '{"status":"FAIL_MISSING_REPORT","accepted":false}' > cloud-vbic-full-wire/result.json
          fi
          archive="vbic-full-wire-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.tar.gz"
          tar -czf "$archive" cloud-vbic-full-wire
          sha256sum "$archive" > "$archive.sha256"
          cp cloud-vbic-full-wire/result.json "${archive%.tar.gz}.summary.json"
          python3 scripts/publish_cloud_results.py --group vbic-full-wire "$archive" "$archive.sha256" "${archive%.tar.gz}.summary.json"
