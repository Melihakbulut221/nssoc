name: chip-fill-archive
on:
  push:
    paths:
      - .github/workflows/chip-fill-archive.yml
  workflow_dispatch:
permissions:
  actions: read
  contents: write
concurrency:
  group: chip-fill-archive-${{ github.ref }}
  cancel-in-progress: false
jobs:
  archive:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Publish exact raw fill artifacts and verify public bytes
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/archive_chip_fill.py
      - name: Preserve archival receipt even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: chip-fill-archive-receipt
          path: hw/soc/out/cloud-fill-archive/*.json
          retention-days: 30
