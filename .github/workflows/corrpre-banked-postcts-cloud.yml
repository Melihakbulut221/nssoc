name: corrpre-banked-postcts-cloud
on:
  push:
    branches: [codex/complete-open-work]
    paths:
      - .github/workflows/corrpre-banked-postcts-cloud.yml
      - scripts/cloud_corrpre_banked_postcts.py
      - scripts/check_corrpre_banked_resume.py
      - hw/soc/pnr/corrpre_banked_flow.py
  workflow_dispatch:
    inputs:
      placement_run:
        description: Completed NEW banked placement run ID
        required: true
        type: string
      summary_sha256:
        description: SHA256 of original placement summary release asset
        required: true
        type: string
      parts_sha256:
        description: SHA256 of original placement parts manifest release asset
        required: true
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: corrpre-banked-postcts-${{ github.ref }}
  cancel-in-progress: false
jobs:
  controls:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Check source identity rejection and complete archive roundtrip controls
        run: |
          python3 -m py_compile scripts/cloud_corrpre_banked_postcts.py scripts/check_corrpre_banked_resume.py hw/soc/pnr/corrpre_banked_flow.py
          python3 scripts/check_corrpre_banked_resume.py
  native-physical:
    if: github.event_name == 'workflow_dispatch'
    needs: controls
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Prepare pinned native runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libfuse2
          python3 scripts/bootstrap_flow.py
          echo "CLOUD_APPIMAGE=$GITHUB_WORKSPACE/hw/soc/tools/physical/librelane-3.0.5-x86_64.AppImage" >> "$GITHUB_ENV"
      - name: Verify NEW source and measure native repair at all three corners
        env:
          GH_TOKEN: ${{ github.token }}
          PLACEMENT_RUN: ${{ inputs.placement_run }}
          SUMMARY_SHA256: ${{ inputs.summary_sha256 }}
          PARTS_SHA256: ${{ inputs.parts_sha256 }}
        run: |
          python3 scripts/cloud_corrpre_banked_postcts.py --placement-run "$PLACEMENT_RUN" --summary-sha256 "$SUMMARY_SHA256" --parts-sha256 "$PARTS_SHA256"
      - name: Preserve completed native states and every failure
        if: always()
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          root=hw/soc/out/cloud-corrpre-banked-postcts
          mkdir -p "$root"
          if [ ! -f "$root/result.json" ]; then
            printf '%s\n' '{"status":"FAIL_MISSING_REPORT","accepted":false}' > "$root/result.json"
          fi
          stem="corrpre-banked-postcts-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          cp "$root/result.json" "$stem.summary.json"
          python3 scripts/cloud_chunked_results.py --directory "$root" --stem "$stem"
          python3 - "$stem" <<'PYCODE'
          import json,subprocess,sys
          stem=sys.argv[1]; manifest=stem+'.parts.json'; m=json.load(open(manifest))
          subprocess.run([sys.executable,'scripts/publish_cloud_results.py','--group','corrpre-banked-postcts',stem+'.summary.json',manifest,*[p['name'] for p in m['parts']]],check=True)
          PYCODE
      - name: Retain states if release publication fails
        if: always() && steps.publish.outcome == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: corrpre-banked-postcts-${{ github.run_id }}
          path: hw/soc/out/cloud-corrpre-banked-postcts/
          retention-days: 30
