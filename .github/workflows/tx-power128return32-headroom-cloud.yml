# SPDX-License-Identifier: Apache-2.0
name: tx-power128return32-headroom-cloud
on:
  push:
    branches: [codex/complete-open-work]
    paths: [.github/workflows/tx-power128return32-headroom-cloud.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tx-power128return32-headroom-${{ github.ref }}
  cancel-in-progress: false
jobs:
  source-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Compile complete original TX waveform diagnosis
        run: |
          python3 -m pip install numpy==2.3.3
          python3 -m py_compile scripts/cloud_tx_power128return32_headroom.py
      - name: Reproduce all original HBT gates from every retained native waveform sample
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PYCODE'
          import hashlib,json
          from pathlib import Path
          d=json.loads(Path('scripts/tx-power128return32-headroom-source-delta.json').read_text())
          s=Path(d['baseline_path']).read_text()
          assert hashlib.sha256(s.encode()).hexdigest()==d['baseline_sha256']
          for e in d['edits']:
              assert s.count(e['before'])==e['count']
              s=s.replace(e['before'],e['after'])
          actual=Path(d['candidate_path']).read_bytes()
          assert actual==s.encode() and hashlib.sha256(actual).hexdigest()==d['candidate_sha256']
          print('Original all-HBT measurements and headroom equations retained')
          PYCODE
          python3 scripts/cloud_tx_power128return32_headroom.py
      - name: Publish audit and failure evidence
        if: always()
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          root=cloud-tx-power128return32-headroom
          mkdir -p "$root"
          if [ ! -f "$root/result.json" ]; then
            printf '%s\n' '{"status":"FAIL_MISSING_REPORT","native_activation_permitted":false}' > "$root/result.json"
          fi
          stem="tx-power128return32-headroom-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          cp "$root/result.json" "$stem.summary.json"
          python3 scripts/cloud_chunked_results.py --directory "$root" --stem "$stem"
          python3 - "$stem" <<'PYCODE'
          import json,subprocess,sys
          stem=sys.argv[1];p=stem+'.parts.json';m=json.load(open(p))
          subprocess.run([sys.executable,'scripts/publish_cloud_results.py','--group','tx-power128return32-headroom',stem+'.summary.json',p,*[x['name']for x in m['parts']]],check=True)
          PYCODE
      - name: Retain publication failure
        if: always() && steps.publish.outcome == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tx-power128return32-headroom-${{ github.run_id }}
          path: cloud-tx-power128return32-headroom/
          retention-days: 30
