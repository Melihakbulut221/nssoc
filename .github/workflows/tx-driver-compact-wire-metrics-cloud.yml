name: tx-driver-compact-wire-metrics-cloud
on:
  push:
    branches: [codex/complete-open-work]
    paths: [.github/workflows/tx-driver-compact-wire-metrics-cloud.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tx-driver-compact-wire-metrics-${{ github.ref }}
  cancel-in-progress: false
jobs:
  source-bound-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Solve the actual pinned conductor networks and retain native terminal identities
        run: |
          python3 -m pip install numpy==2.3.3
          python3 -m py_compile scripts/cloud_tx_driver_compact_wire_metrics.py
          python3 scripts/cloud_tx_driver_compact_wire_metrics.py
      - name: Preserve diagnosis including failures
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p cloud-tx-driver-compact-wire-metrics
          if [ ! -f cloud-tx-driver-compact-wire-metrics/result.json ]; then
            printf '%s\n' '{"status":"FAIL_MISSING_REPORT","accepted":false}' > cloud-tx-driver-compact-wire-metrics/result.json
          fi
          cp cloud-tx-driver-compact-wire-metrics/result.json "tx-driver-compact-wire-metrics-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.summary.json"
          python3 scripts/publish_cloud_results.py --group tx-driver-compact-wire-metrics "tx-driver-compact-wire-metrics-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.summary.json"
