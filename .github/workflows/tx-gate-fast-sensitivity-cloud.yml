name: tx-gate-fast-sensitivity-cloud
on:
  push:
    branches: [codex/complete-open-work]
    paths: [.github/workflows/tx-gate-fast-sensitivity-cloud.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tx-gate-fast-sensitivity-${{ github.ref }}
  cancel-in-progress: false
jobs:
  raw-driver-loaded-physical-tree:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        variant: [l2p4-series-l6p2]
        condition: [hot_low, cold_high]
        gate_length: [3]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Native simulator dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libsndfile1 libsamplerate0 libreadline8t64 libxaw7 libxt6 libxft2 libfontconfig1
          python3 -m pip install numpy==2.3.3
      - name: Measure gate3 settling and cold overshoot against unchanged electrical limits
        run: |
          python3 -m py_compile scripts/cloud_tx_gate_corner_sensitivity.py scripts/cloud_tx_clock_loaded_adapter.py
          python3 scripts/cloud_tx_gate_corner_sensitivity.py --variant ${{ matrix.variant }} --condition ${{ matrix.condition }} --gate-length ${{ matrix.gate_length }}
      - name: Preserve every physical gate and fault including failed geometry
        if: always()
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p hw/soc/out/cloud-tx-gate-corner-sensitivity-${{ matrix.variant }}-${{ matrix.condition }}-g${{ matrix.gate_length }}u
          if [ ! -f hw/soc/out/cloud-tx-gate-corner-sensitivity-${{ matrix.variant }}-${{ matrix.condition }}-g${{ matrix.gate_length }}u/result.json ]; then
            printf '%s\n' '{"status":"FAIL_MISSING_REPORT","accepted":false}' > hw/soc/out/cloud-tx-gate-corner-sensitivity-${{ matrix.variant }}-${{ matrix.condition }}-g${{ matrix.gate_length }}u/result.json
          fi
          stem="tx-gate-corner-sensitivity-${{ matrix.variant }}-${{ matrix.condition }}-g${{ matrix.gate_length }}u-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          cp hw/soc/out/cloud-tx-gate-corner-sensitivity-${{ matrix.variant }}-${{ matrix.condition }}-g${{ matrix.gate_length }}u/result.json "$stem.summary.json"
          python3 scripts/cloud_chunked_results.py --directory hw/soc/out/cloud-tx-gate-corner-sensitivity-${{ matrix.variant }}-${{ matrix.condition }}-g${{ matrix.gate_length }}u --stem "$stem"
          python3 - "$stem" <<'PYCODE'
          import json,subprocess,sys
          stem=sys.argv[1];manifest=stem+'.parts.json';m=json.load(open(manifest))
          subprocess.run([sys.executable,'scripts/publish_cloud_results.py','--group','tx-gate-corner-sensitivity-${{ matrix.variant }}-${{ matrix.condition }}-g${{ matrix.gate_length }}u',stem+'.summary.json',manifest,*[p['name']for p in m['parts']]],check=True)
          PYCODE
      - name: Retain evidence after publication failure
        if: always() && steps.publish.outcome == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tx-gate-corner-sensitivity-${{ matrix.variant }}-${{ matrix.condition }}-g${{ matrix.gate_length }}u-${{ github.run_id }}
          retention-days: 30
          path: hw/soc/out/cloud-tx-gate-corner-sensitivity-${{ matrix.variant }}-${{ matrix.condition }}-g${{ matrix.gate_length }}u/

# Activate this new workflow by its path-filtered push before manual dispatch is available.
