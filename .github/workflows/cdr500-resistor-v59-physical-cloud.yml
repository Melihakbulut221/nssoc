# SPDX-License-Identifier: Apache-2.0
name: cdr500-resistor-v59-physical-cloud
on:
  workflow_dispatch:
    inputs:
      physical:
        type: boolean
        default: false
        description: Execute one reviewed native physical arm after source controls
      arm:
        type: choice
        options: [cd_shunt, ab_hold]
        default: cd_shunt
        description: One isolated resistor candidate; no combined arm
permissions:
  contents: read
concurrency:
  group: cdr500-resistor-v59-${{ github.ref }}-${{ inputs.arm }}
  cancel-in-progress: false
jobs:
  controls:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Exact source controls and preserved fault hooks
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/check_cdr500_resistor_v59_source.py | tee source-controls.json
          python3 scripts/cloud_cdr500_resistor_v59_physical.py --arm '${{ inputs.arm }}' --source-controls | tee derivation-controls.json
          python3 scripts/ensure_cloud_tested_source_release.py --controls | tee publication-controls.json
          python3 - <<'PY'
          import json
          a=json.load(open('source-controls.json'));b=json.load(open('derivation-controls.json'));c=json.load(open('publication-controls.json'))
          assert a['status']=='PASS_CDR_V59_ISOLATED_SOURCE_CONTROLS' and len(a['controls'])==26 and len(a['reference_fixtures'])==4
          assert b['status']=='PASS_CDR_V59_PHYSICAL_DERIVATION_CONTROLS' and len(b['controls'])==6 and not b['native_executed']
          assert c['status']=='PASS_EXACT_TESTED_SOURCE_RELEASE_AND17_CONTROLS' and len(c['rejected'])==17
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: cdr500-resistor-v59-controls-${{ github.run_id }}
          path: "*-controls.json"
          retention-days: 90
  native-physical-and-wires:
    if: github.event_name == 'workflow_dispatch' && inputs.physical == true
    needs: controls
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Require the reserved exact-source evidence release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PYTHONPATH=scripts python3 - <<'PY'
          from cloud_cdr500_resistor_v59_physical import precreated
          print(precreated('cdr500-resistor-v59-${{ inputs.arm }}',wait=True))
          PY
      - name: Restore pinned native CAD runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libfuse2 tcl8.6
          curl --fail --location --retry 4 https://github.com/librelane/librelane/releases/download/3.0.5/librelane-devshell-x86_64.AppImage -o "$RUNNER_TEMP/librelane.AppImage"
          echo "d6a349ec65be11456e96c4981d35f63ca34d3c85daf79a51e1ccb907bb5d7466  $RUNNER_TEMP/librelane.AppImage" | sha256sum --check
          chmod +x "$RUNNER_TEMP/librelane.AppImage"
          echo "CLOUD_APPIMAGE=$RUNNER_TEMP/librelane.AppImage" >> "$GITHUB_ENV"
      - name: Original full physical gates and fresh strict wires for one arm
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/cloud_cdr500_resistor_v59_physical.py --arm '${{ inputs.arm }}'
      - name: Preserve every original native result and rejection
        if: always()
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          V59_ARM: ${{ inputs.arm }}
        shell: bash
        run: |
          set -euo pipefail
          root="hw/soc/out/cloud-cdr500-resistor-v59-$V59_ARM"
          mkdir -p "$root"
          if [ ! -f "$root/result.json" ]; then
            printf '%s\n' '{"status":"FAIL_MISSING_REPORT","accepted":false,"full_phy_accepted":false}' > "$root/result.json"
          fi
          stem="cdr500-resistor-v59-$V59_ARM-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          cp "$root/result.json" "$stem.summary.json"
          python3 scripts/cloud_chunked_results.py --directory "$root" --stem "$stem"
          python3 - "$stem" <<'PY'
          import json,os,subprocess,sys
          sys.path.insert(0,'scripts')
          from cloud_cdr500_resistor_v59_physical import precreated
          group='cdr500-resistor-v59-'+os.environ['V59_ARM'];precreated(group)
          stem=sys.argv[1];m=json.load(open(stem+'.parts.json'))
          subprocess.run([sys.executable,'scripts/publish_cloud_results.py','--group',group,stem+'.summary.json',stem+'.parts.json',*[p['name']for p in m['parts']]],check=True)
          PY
      - name: Preserve capsule even when release publication fails
        if: always() && steps.publish.outcome == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cdr500-resistor-v59-${{ inputs.arm }}-${{ github.run_id }}
          path: hw/soc/out/cloud-cdr500-resistor-v59-${{ inputs.arm }}/
          retention-days: 90
