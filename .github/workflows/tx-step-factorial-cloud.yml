name: tx-step-factorial-cloud
on:
  push:
    branches: [codex/complete-open-work]
    paths: [.github/workflows/tx-step-factorial-cloud.yml]
  workflow_dispatch:
    inputs:
      study:
        description: Separate TSTEP/TMAX or refine TMAX and compare integration methods
        type: choice
        options: [factorial, refinement, matrix_solver]
        default: matrix_solver
permissions:
  contents: read
concurrency:
  group: tx-step-factorial-${{ github.ref }}
  cancel-in-progress: false
jobs:
  startup-diagnosis:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Restore exact native simulator
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libsndfile1 libsamplerate0 libreadline8t64 libxaw7 libxt6 libxft2 libfontconfig1
          python3 -m pip install numpy==2.3.3
          curl --fail --location --retry 4 'https://deb.debian.org/debian/pool/main/n/ngspice/ngspice_47+ds-1~bpo13+1_amd64.deb' -o "$RUNNER_TEMP/ngspice.deb"
          echo "400d2ebaefc1dcaaaf9693ac4731535d910fa2c0544552736970aa9ebaad760b  $RUNNER_TEMP/ngspice.deb" | sha256sum --check
          dpkg-deb -x "$RUNNER_TEMP/ngspice.deb" "$RUNNER_TEMP/ngspice"
          echo "CLOUD_NGSPICE=$RUNNER_TEMP/ngspice/usr/bin/ngspice" >> "$GITHUB_ENV"
      - name: Reject altered analyses and corrupt waveform comparison
        run: python3 scripts/cloud_tx_step_factorial.py --controls-only
      - name: Verify KLU native availability before matrix experiment
        if: inputs.study == 'matrix_solver' || github.event_name == 'push'
        run: |
          python3 - <<'PYKLU'
          import pathlib,os,subprocess
          out=pathlib.Path('cloud-tx-step-preflight').resolve();out.mkdir()
          (out/'spinit').write_text('set num_threads=1\n')
          (out/'bench.cir').write_text('KLU availability control\nV1 a 0 1\nR1 a b 1000\nC1 b 0 1p\n.options klu\n.control\ntran 1p 2p\noption\nquit\n.endc\n.end\n')
          p=subprocess.run([os.environ['CLOUD_NGSPICE'],'-n','-b','bench.cir'],cwd=out,env=dict(os.environ,SPICE_SCRIPTS=str(out)),text=True,capture_output=True)
          log=p.stdout+p.stderr;(out/'run.log').write_text(log);print(log)
          assert p.returncode==0 and 'KLU' in log and 'Sparse 1.3' not in log
          PYKLU
      - name: Isolate TSTEP and TMAX on unchanged native startup circuit
        run: python3 scripts/cloud_tx_step_factorial.py --study '${{ inputs.study || 'matrix_solver' }}'
      - name: Preserve all diagnostic captures and failure evidence
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p cloud-tx-step-factorial
          if [ -d cloud-tx-step-preflight ]; then cp -r cloud-tx-step-preflight cloud-tx-step-factorial/preflight; fi
          if [ ! -f cloud-tx-step-factorial/result.json ]; then
            printf '%s\n' '{"status":"FAIL_BEFORE_DIAGNOSIS","accepted":false}' > cloud-tx-step-factorial/result.json
          fi
          archive="tx-step-factorial-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.tar.gz"
          tar -czf "$archive" cloud-tx-step-factorial
          sha256sum "$archive" > "$archive.sha256"
          cp cloud-tx-step-factorial/result.json "${archive%.tar.gz}.summary.json"
          python3 scripts/publish_cloud_results.py --group tree-step-factorial "$archive" "$archive.sha256" "${archive%.tar.gz}.summary.json"
      - name: Retain evidence if publication fails
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: step-factorial-${{ github.run_id }}-${{ github.run_attempt }}
          path: cloud-tx-step-factorial/
          if-no-files-found: warn
