name: candidate-annotation-cloud
on:
  push:
    branches: [codex/complete-open-work]
    paths: [.github/workflows/candidate-annotation-cloud.yml]
  workflow_dispatch:
    inputs:
      profile:
        description: Completed physical candidate profile
        type: choice
        options: [two_buffer, control_three_buffer, measured_load_batch, protected_load_batch, measured_hold_batch, expanded_load_batch, refined_load_batch, refined_hold_batch]
        required: true
      run:
        description: Completed physical ECO run ID
        type: string
        required: true
      summary_sha:
        description: Exact completed result SHA256
        type: string
        required: true
      parts_sha:
        description: Exact ordered archive manifest SHA256
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: candidate-annotation-${{ github.ref }}-${{ inputs.run }}
  cancel-in-progress: false
jobs:
  controls:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify refined source-measured target and all legacy profile contracts
        run: |
          python3 scripts/refined_load_targets.py --verify-published
          python3 scripts/refined_hold_targets.py
          python3 - <<'PYCODE'
          import importlib.util,os,sys
          sys.path.insert(0,'scripts')
          for profile,count in [('two_buffer',2),('control_three_buffer',3),('measured_load_batch',50),('protected_load_batch',50),('expanded_load_batch',110),('refined_load_batch',141)]:
              os.environ['NSSOC_CRITICAL_LOAD_PROFILE']=profile
              spec=importlib.util.spec_from_file_location('native_targets','scripts/critical_load_targets.py');m=importlib.util.module_from_spec(spec);spec.loader.exec_module(m)
              assert m.COUNT==count and len({r[0]for r in m.TARGETS})==count
          PYCODE
      - name: Verify native annotation parser and exact SPEF name controls
        run: |
          python3 -m py_compile scripts/run_cloud_candidate_annotation.py scripts/audit_cloud_route_annotation.py
          python3 - <<'PYCODE'
          import sys,json
          sys.path.insert(0,'scripts')
          from audit_cloud_route_annotation import controls,name_controls
          print(json.dumps(dict(annotation=controls(),spef_names=name_controls())))
          PYCODE
  full-annotation:
    if: github.event_name == 'workflow_dispatch'
    needs: controls
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Restore exact native runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libfuse2
          curl --fail --location --retry 4 https://github.com/librelane/librelane/releases/download/3.0.5/librelane-devshell-x86_64.AppImage -o "$RUNNER_TEMP/librelane.AppImage"
          echo "d6a349ec65be11456e96c4981d35f63ca34d3c85daf79a51e1ccb907bb5d7466  $RUNNER_TEMP/librelane.AppImage" | sha256sum --check
          chmod +x "$RUNNER_TEMP/librelane.AppImage"
          echo "CLOUD_APPIMAGE=$RUNNER_TEMP/librelane.AppImage" >> "$GITHUB_ENV"
      - name: Classify all native candidate drivers against exact routed SPEF
        env:
          PROFILE: ${{ inputs.profile }}
          SOURCE_RUN: ${{ inputs.run }}
          SUMMARY_SHA: ${{ inputs.summary_sha }}
          PARTS_SHA: ${{ inputs.parts_sha }}
        run: >-
          python3 scripts/run_cloud_candidate_annotation.py --profile "$PROFILE"
          --run "$SOURCE_RUN" --summary-sha "$SUMMARY_SHA" --parts-sha "$PARTS_SHA"
      - name: Preserve all candidate RC source files and native classification failures
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p cloud-candidate-annotation
          if [ ! -f cloud-candidate-annotation/result.json ]; then
            printf '%s\n' '{"status":"FAIL_MISSING_REPORT","accepted":false}' > cloud-candidate-annotation/result.json
          fi
          stem="candidate-annotation-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          cp cloud-candidate-annotation/result.json "$stem.summary.json"
          python3 scripts/cloud_chunked_results.py --directory cloud-candidate-annotation --stem "$stem"
          python3 - "$stem" <<'PYCODE'
          import json,subprocess,sys
          stem=sys.argv[1];manifest=stem+'.parts.json';m=json.load(open(manifest))
          subprocess.run([sys.executable,'scripts/publish_cloud_results.py','--group','candidate-annotation',stem+'.summary.json',manifest,*[p['name'] for p in m['parts']]],check=True)
          PYCODE
      - name: Require complete measurement without adopting the candidate
        if: always()
        run: |
          python3 - <<'PYCODE'
          import json,os
          r=json.load(open('cloud-candidate-annotation/result.json'))
          assert r['source_head']==os.environ['GITHUB_SHA']
          assert r['status']=='COMPLETE_CANDIDATE_NATIVE_RC_ANNOTATION_DIAGNOSIS_NOT_COVERAGE_ACCEPTANCE',r.get('error')
          assert r['source_unchanged']
          print(r['classification'])
          PYCODE
