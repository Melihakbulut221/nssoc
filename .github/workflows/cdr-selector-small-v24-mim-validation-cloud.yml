name: cdr-selector-small-v24-mim-validation-cloud
on:
  push:
    branches: [codex/complete-open-work]
    paths: [.github/workflows/cdr-selector-small-v24-mim-validation-cloud.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cdr-selector-small-v24-mim-validation-${{ github.ref }}
  cancel-in-progress: false
jobs:
  mim-parent-audit:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Compile and verify original raw and composition gates
        run: |
          python3 -m pip install networkx==3.4.2
          python3 -m py_compile scripts/cloud_cdr_selector_small_v24_mim_stage.py scripts/cloud_cdr_selector_small_v24_mim_parent_audit.py scripts/cloud_cdr_selector_small_v24_mim_composition.py scripts/audit_cdr_selector_small_v24_mim_intrinsic.py
          python3 scripts/check_cdr_selector_small_v24_mim_sources.py
      - name: Native evidence validation and immutable publication
        id: native
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/cloud_cdr_selector_small_v24_mim_stage.py --stage mim-parent-audit
      - name: Preserve raw failed stage
        if: always() && steps.native.outcome == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cdr-selector-small-v24-mim-parent-audit-${{ github.run_id }}
          path: |
            hw/soc/out/cloud-cdr-selector-small-v24-*/
            cdr-selector-small-v24-*.json
          retention-days: 30
  mim-composition:
    needs: mim-parent-audit
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Compile and verify original raw and composition gates
        run: |
          python3 -m pip install networkx==3.4.2
          python3 -m py_compile scripts/cloud_cdr_selector_small_v24_mim_stage.py scripts/cloud_cdr_selector_small_v24_mim_parent_audit.py scripts/cloud_cdr_selector_small_v24_mim_composition.py scripts/audit_cdr_selector_small_v24_mim_intrinsic.py
          python3 scripts/check_cdr_selector_small_v24_mim_sources.py
      - name: Native evidence validation and immutable publication
        id: native
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/cloud_cdr_selector_small_v24_mim_stage.py --stage mim-composition
      - name: Preserve raw failed stage
        if: always() && steps.native.outcome == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cdr-selector-small-v24-mim-composition-${{ github.run_id }}
          path: |
            hw/soc/out/cloud-cdr-selector-small-v24-*/
            cdr-selector-small-v24-*.json
          retention-days: 30
