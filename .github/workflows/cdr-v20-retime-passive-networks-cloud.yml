name: cdr-v20-retime-passive-networks-cloud
on:
  push:
    branches: [codex/complete-open-work]
    paths: [.github/workflows/cdr-v20-retime-passive-networks-cloud.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cdr-v20-retime-passive-networks-${{ github.ref }}
  cancel-in-progress: false
jobs:
  syntax-controls:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify unchanged review and engineering gates
        run: python3 scripts/check_cdr_v20_retime_passive_sources.py
      - name: Install passive-network solver for controls
        run: python3 -m pip install numpy==2.3.3 scipy==1.16.2
      - name: Exercise exact passive-network controls
        run: python3 -c "from scripts.review_tx_minimax_data_networks import controls; print(controls())"
      - name: Compile read-only native path review
        run: python3 -m py_compile scripts/cloud_cdr_v20_retime_passive_networks.py
  native-current:
    needs: syntax-controls
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install waveform reader
        run: |
          python3 -m pip install numpy==2.3.3 scipy==1.16.2
      - name: Measure actual data wiring and native boundary loads without resimulating
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -m py_compile scripts/cloud_cdr_v20_retime_passive_networks.py
          python3 scripts/cloud_cdr_v20_retime_passive_networks.py
      - name: Preserve native results and failures
        if: always()
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          root=cloud-cdr-v20-retime-passive-networks
          mkdir -p "$root"
          if [ ! -f "$root/result.json" ]; then
            printf '%s\n' '{"status":"FAIL_MISSING_REPORT","accepted":false}' > "$root/result.json"
          fi
          stem="cdr-v20-retime-passive-networks-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          cp "$root/result.json" "$stem.summary.json"
          python3 scripts/cloud_chunked_results.py --directory "$root" --stem "$stem"
          python3 - "$stem" <<'PYCODE'
          import json,subprocess,sys
          stem=sys.argv[1];manifest=stem+'.parts.json';m=json.load(open(manifest))
          subprocess.run([sys.executable,'scripts/publish_cloud_results.py','--group','cdr-v20-retime-passive-networks',stem+'.summary.json',manifest,*[p['name']for p in m['parts']]],check=True)
          PYCODE
      - name: Retain evidence after publication failure
        if: always() && steps.publish.outcome == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cdr-v20-retime-passive-networks-${{ github.run_id }}
          path: cloud-cdr-v20-retime-passive-networks/
          retention-days: 30

