# c5r3k copy of pll-rhi120-c8-raw-audit-cloud.yml: pinned to the c5r3k RC review and capture; publication falls back to retained chunked files.
name: pll-c5r3k-raw-audit-cloud
on:
  push:
    branches: [analysis/pll-layout-c5r3k]
    paths: [.github/workflows/pll-c5r3k-raw-audit-cloud.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pll-c5r3k-raw-audit-${{ github.ref }}
  cancel-in-progress: false
jobs:
  native-planes:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install pinned graph audit dependency
        run: python3 -m pip install networkx==3.4.2
      - name: Compile whole PLL native input and capture checks
        run: |
          python3 -m py_compile scripts/cloud_pll_c5r3k_raw_audit.py scripts/audit_pll_c5r3k_mim_intrinsic.py scripts/check_pll_c5r3k_whole_rc_capture.py
          python3 - <<'PYCODE'
          import hashlib,json,pathlib
          spec=json.loads(pathlib.Path('scripts/pll-c5r3k-raw-audit-source-delta.json').read_text())
          for m in spec['methods']:
              s=pathlib.Path(m['baseline_path']).read_text()
              assert hashlib.sha256(s.encode()).hexdigest()==m['baseline_sha256'],m['baseline_path']
              for e in m['edits']:
                  assert s.count(e['before'])==e['count'],(m['candidate_path'],e['before'][:80])
                  s=s.replace(e['before'],e['after'])
              actual=pathlib.Path(m['candidate_path']).read_text()
              assert s==actual and hashlib.sha256(actual.encode()).hexdigest()==m['candidate_sha256'],m['candidate_path']
          PYCODE
      - name: Audit every native R edge value and C point with22 actual corruption controls
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/cloud_pll_c5r3k_raw_audit.py
      - name: Chunk evidence and publish it as a release when the token allows
        if: always()
        id: publish
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          root=hw/soc/out/cloud-pll-c5r3k-raw-audit
          mkdir -p "$root" release
          if [ ! -f "$root/result.json" ]; then
            printf '%s\n' '{"status":"FAIL_MISSING_REPORT","accepted":false}' > "$root/result.json"
          fi
          stem="pll-c5r3k-raw-audit-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          cp "$root/result.json" "release/$stem.summary.json"
          (cd release && python3 ../scripts/cloud_chunked_results.py --directory "../$root" --stem "$stem")
          cd release && python3 - "$stem" <<'PYCODE'
          import json,subprocess,sys
          stem=sys.argv[1];manifest=stem+'.parts.json';m=json.load(open(manifest))
          subprocess.run([sys.executable,'../scripts/publish_cloud_results.py','--group','pll-c5r3k-raw-audit',stem+'.summary.json',manifest,*[p['name']for p in m['parts']]],check=True)
          PYCODE
      - name: Retain the chunked release files
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pll-c5r3k-raw-audit-release-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 30
          path: release/
      - name: Retain the raw output directory
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pll-c5r3k-raw-audit-out-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 30
          path: hw/soc/out/cloud-pll-c5r3k-raw-audit/
