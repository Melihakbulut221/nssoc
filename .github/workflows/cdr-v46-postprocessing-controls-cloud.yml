name: cdr-v46-postprocessing-controls-cloud
on:
  push:
    branches: [codex/complete-open-work]
    paths: [.github/workflows/cdr-v46-postprocessing-controls-cloud.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  controls:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: |
          python3 -m pip install numpy==2.3.3
          python3 -m py_compile scripts/cdr_v46_clock_response.py scripts/cloud_cdr_v46_intrinsic_mutator.py scripts/cloud_cdr_v46_intrinsic_screen.py
          python3 scripts/check_cdr_v46_clock_response.py
