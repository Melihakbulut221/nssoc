# SPDX-License-Identifier: Apache-2.0
name: tx-raw8074-loaded-attribution-cloud
on:
  push:
    branches: [codex/complete-open-work]
    paths: [.github/workflows/tx-raw8074-loaded-attribution-cloud.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tx-raw8074-loaded-attribution
  cancel-in-progress: false
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Read the complete rejected capture and independently reproduce original gates
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -m pip install numpy==2.3.3 scipy==1.16.2 networkx==3.4.2
          python3 scripts/cloud_tx_raw8074_loaded_attribution.py
      - name: Preserve diagnosis and original-source identities
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          root=cloud-tx-raw8074-loaded-attribution
          mkdir -p "$root"
          if [ ! -f "$root/result.json" ]; then
            printf '%s\n' '{"status":"FAIL_MISSING_REPORT","electrical_accepted":false}' > "$root/result.json"
          fi
          stem="tx-raw8074-loaded-attribution-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          cp "$root/result.json" "$stem.summary.json"
          python3 scripts/cloud_chunked_results.py --directory "$root" --stem "$stem"
          python3 - "$stem" <<'PYCODE'
          import json,subprocess,sys
          s=sys.argv[1];m=json.load(open(s+'.parts.json'))
          subprocess.run([sys.executable,'scripts/publish_cloud_results.py','--group','tx-raw8074-loaded-attribution',s+'.summary.json',s+'.parts.json',*[p['name']for p in m['parts']]],check=True)
          PYCODE
