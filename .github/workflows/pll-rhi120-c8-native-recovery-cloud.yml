# SPDX-License-Identifier: Apache-2.0
name: pll-rhi120-c8-native-recovery-cloud
on:
  push:
    branches: [codex/complete-open-work]
    paths: [.github/workflows/pll-rhi120-c8-native-recovery-cloud.yml, scripts/cloud_pll_rhi120_c8_recovery.py]
  workflow_dispatch:
    inputs:
      source_checkpoint:
        description: Exact audited initial or successful recovery process descriptor with immutable hashes
        type: string
        required: true
permissions:
  contents: read
  actions: read
concurrency:
  group: pll-rhi120-c8-native-recovery
  cancel-in-progress: false
jobs:
  controls:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify exact source changes and original native control families
        run: |
          python3 -m pip install numpy==2.3.3
          python3 scripts/check_pll_rhi120_c8_recovery_sources.py
          python3 -m py_compile scripts/cloud_pll_rhi120_c8_recovery.py
          python3 scripts/cloud_pll_rhi120_c8_recovery.py --controls
  initial:
    if: github.event_name == 'workflow_dispatch'
    needs: controls
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install cloud-only checkpoint dependencies
        run: |
          # Hosted disposable image SDKs are unrelated to this CAD job.
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          df -h "$GITHUB_WORKSPACE"
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends btrfs-progs btrfs-compsize build-essential pkg-config libprotobuf-dev libprotobuf-c-dev protobuf-c-compiler protobuf-compiler python3-protobuf uuid-dev libbsd-dev libcap-dev libnet1-dev libnl-3-dev libsndfile1 libsamplerate0 libreadline8t64 libxaw7 libxt6 libxft2 libfontconfig1
          git init "$RUNNER_TEMP/criu-src"
          git -C "$RUNNER_TEMP/criu-src" remote add origin https://github.com/checkpoint-restore/criu.git
          git -C "$RUNNER_TEMP/criu-src" fetch --depth 1 origin 9539417f3e3cfa4eb84c319cd71f4d52f1f08645
          git -C "$RUNNER_TEMP/criu-src" checkout --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/criu-src" rev-parse HEAD)" = 9539417f3e3cfa4eb84c319cd71f4d52f1f08645
          make -C "$RUNNER_TEMP/criu-src" -j2 criu PYTHON=/usr/bin/python3 2>&1 | tee "$RUNNER_TEMP/criu-build.log"
          sudo install -m 755 "$RUNNER_TEMP/criu-src/criu/criu" /usr/sbin/criu
          python3 - <<'PYCODE'
          import hashlib,json,os,pathlib,subprocess
          p=pathlib.Path('/usr/sbin/criu')
          d=dict(source_repository='https://github.com/checkpoint-restore/criu',source_tag='v4.2.1',source_commit='9539417f3e3cfa4eb84c319cd71f4d52f1f08645',binary_sha256=hashlib.sha256(p.read_bytes()).hexdigest(),version=subprocess.check_output([str(p),'--version'],text=True),libraries=subprocess.check_output(['ldd',str(p)],text=True))
          (pathlib.Path(os.environ['RUNNER_TEMP'])/'criu-build.json').write_text(json.dumps(d,indent=2)+'\n')
          PYCODE
          python3 -m pip install numpy==2.3.3
          python3 -m py_compile scripts/cloud_pll_rhi120_c8_recovery.py
      - name: Reclaim proven disposable SDK headroom before restoring any native capsule
        run: |
          python3 scripts/cloud_pll_storage_headroom.py
      - name: Reclaim only unused hosted image and package caches before allocating storage
        run: |
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test -z "$(docker ps -aq)"
          df -B1 "$GITHUB_WORKSPACE"
          docker image prune --all --force
          sudo apt-get clean
          df -B1 "$GITHUB_WORKSPACE"
      - name: Recover only the audited saved RHI120 process with exact qualified tables
        id: native
        env:
          SOURCE_CHECKPOINT: ${{ inputs.source_checkpoint }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/check_pll_rhi120_c8_recovery_sources.py
          python3 scripts/cloud_pll_rhi120_c8_recovery.py --stage recovery --seconds 7200
      - name: Preserve every native byte and checkpoint including failed evidence
        if: always()
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          root=cloud-pll-rhi120-c8-native
          mkdir -p "$root"
          if [ ! -f "$root/result.json" ]; then printf '%s\n' '{"status":"FAIL_MISSING_REPORT","checkpoint_saved":false,"full_phy_accepted":false}' > "$root/result.json"; fi
          stem="pll-rhi120-c8-native-recovery-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          cp "$root/result.json" "$stem.summary.json"
          python3 scripts/cloud_chunked_results.py --directory "$root" --stem "$stem"
          python3 - "$stem" <<'PYCODE'
          import json,subprocess,sys
          stem=sys.argv[1];m=json.load(open(stem+'.parts.json'))
          subprocess.run([sys.executable,'scripts/publish_cloud_results.py','--group','pll-rhi120-c8-native-recovery',stem+'.summary.json',stem+'.parts.json',*[p['name']for p in m['parts']]],check=True)
          PYCODE
      - name: Retain complete evidence if publication fails
        if: always() && steps.publish.outcome == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pll-rhi120-c8-native-recovery-${{ github.run_id }}
          path: cloud-pll-rhi120-c8-native/
          retention-days: 30
