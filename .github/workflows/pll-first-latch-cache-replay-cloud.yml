name: pll-first-latch-cache-replay-cloud
on:
  push:
    branches: [codex/pll-first-latch-cache-replay]
    paths:
      - .github/workflows/pll-first-latch-cache-replay-cloud.yml
      - scripts/cloud_pll_first_latch_cache_replay.py
      - scripts/pll-first-latch-cache-replay-methods.json
      - scripts/pll_first_latch_native_sampling.py
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: pll-first-latch-cache-replay
  cancel-in-progress: false
jobs:
  controls:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Check exact source metadata transport cache and endpoint controls
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -m pip install numpy==2.3.3
          python3 scripts/cloud_pll_first_latch_cache_replay.py --controls
  replay:
    if: github.event_name == 'workflow_dispatch' && github.ref_name == 'codex/pll-first-latch-cache-replay'
    needs: controls
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Restore only selected cache and reproduce exact original endpoint assertion
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -m pip install numpy==2.3.3
          python3 scripts/cloud_pll_first_latch_cache_replay.py --replay
      - name: Preserve small diagnosis and receipts without republishing native cache
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p cloud-pll-first-latch-cache-replay
          if [ ! -f cloud-pll-first-latch-cache-replay/result.json ]; then
            printf '%s\n' '{"status":"FAIL_MISSING_CACHE_REPLAY","acquisition_accepted":false,"full_phy_accepted":false,"large_cache_republished":false}' > cloud-pll-first-latch-cache-replay/result.json
          fi
          stem="pll-first-latch-cache-replay-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          cp cloud-pll-first-latch-cache-replay/result.json "$stem.summary.json"
          python3 scripts/publish_cloud_results.py --group pll-first-latch-cache-replay "$stem.summary.json" cloud-pll-first-latch-cache-replay/*.json
