name: tx-layout-extraction-cloud
on:
  workflow_dispatch:
    inputs:
      circuit_profile:
        description: Proven physical circuit to extract
        type: choice
        options: [baseline, cascade14, cascade16, cascade158, final_drive_v5, final_drive_v6, final_drive_v7, final_drive_v8, final_drive_v9, final_drive_v10, final_drive_v11]
        default: baseline
      variant:
        description: Source-bound physical routing variant
        type: choice
        options: [baseline, topmetal_trunks, topmetal_trunks_narrow_bus, critical_buses, critical_buses_wide_escape, critical_buses_supply_escape, critical_buses_power_trunks, critical_buses_power_trunks_vias, critical_buses_interleaved_resistors, critical_buses_kelvin_return, critical_buses_kelvin_short, critical_buses_kelvin_short_vias, critical_buses_kelvin_dense, critical_buses_kelvin_dense_wide, critical_buses_kelvin_supply_feed, critical_buses_kelvin_supply_direct, critical_buses_kelvin_tail_paths, critical_buses_kelvin_local_tail, critical_buses_kelvin_local_return, critical_buses_kelvin_local_supply, critical_buses_kelvin_local_internal, critical_buses_kelvin_compact_internal, critical_buses_kelvin_low_internal, critical_buses_kelvin_low_critical, critical_buses_kelvin_low_selects, critical_buses_kelvin_low_selects_m3, critical_buses_kelvin_low_selects_rows, critical_buses_kelvin_low_ports, critical_buses_kelvin_low_ports_deep, critical_buses_kelvin_low_ports_loads, critical_buses_kelvin_low_ports_shunts, critical_buses_kelvin_low_ports_loads_shunts, critical_buses_kelvin_low_ports_loads_shunts_series, critical_buses_kelvin_low_ports_loads_shunts_series_direct, critical_buses_kelvin_signal_trunks, critical_buses_kelvin_m3_10]
        default: baseline
permissions:
  contents: read
concurrency:
  group: tx-layout-extraction-cloud-${{ github.ref }}
  cancel-in-progress: false
jobs:
  native-extraction:
    strategy:
      fail-fast: false
      matrix:
        variant: ["${{ inputs.variant || 'baseline' }}"]
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify exact native runtime on hosted runner
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libfuse2 tcl8.6
          python3 -m pip install networkx==3.5
          curl --fail --location --retry 4 https://github.com/librelane/librelane/releases/download/3.0.5/librelane-devshell-x86_64.AppImage -o "$RUNNER_TEMP/librelane.AppImage"
          echo "d6a349ec65be11456e96c4981d35f63ca34d3c85daf79a51e1ccb907bb5d7466  $RUNNER_TEMP/librelane.AppImage" | sha256sum --check
          chmod +x "$RUNNER_TEMP/librelane.AppImage"
          echo "CLOUD_APPIMAGE=$RUNNER_TEMP/librelane.AppImage" >> "$GITHUB_ENV"
      - name: Extract new geometry and check every native RC edge and thirteen fault controls
        run: python3 scripts/run_cloud_tx_layout_extraction.py --variant '${{ matrix.variant }}' --circuit-profile '${{ inputs.circuit_profile || 'baseline' }}'
      - name: Keep full geometry, timing, proof and failure evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tx-layout-extraction-cloud-${{ matrix.variant }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: hw/soc/out/cloud-tx-layout-repair/
          compression-level: 1
          retention-days: 30
          if-no-files-found: error
      - name: Preserve complete evidence permanently
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          archive='tx-layout-extraction-cloud-${{ inputs.circuit_profile || 'baseline' }}-${{ matrix.variant }}-${{ github.run_id }}-${{ github.run_attempt }}.tar.gz'
          tar -czf "$archive" hw/soc/out/cloud-tx-layout-repair
          sha256sum "$archive" > "$archive.sha256"
          summary="${archive%.tar.gz}.summary.json"
          cp hw/soc/out/cloud-tx-layout-repair/extraction-result.json "$summary"
          python3 scripts/publish_cloud_results.py --group 'extract-${{ inputs.circuit_profile || 'baseline' }}-${{ matrix.variant }}' "$archive" "$archive.sha256" "$summary"
