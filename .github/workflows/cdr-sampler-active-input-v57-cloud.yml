name: cdr-sampler-active-input-v57-cloud
on:
  push:
    branches: [codex/complete-open-work]
    paths:
      - .github/workflows/cdr-sampler-active-input-v57-cloud.yml
      - scripts/cloud_cdr_sampler_active_input_v57.py
      - scripts/cdr-sampler-active-input-v57-method.json
      - hw/soc/analog/pcie/rx_sampler_active_input_v57.spice
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cdr-sampler-active-input-v57
  cancel-in-progress: false
jobs:
  controls:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: |
          python3 -m pip install numpy==2.3.3
          python3 -m py_compile scripts/cloud_cdr_sampler_active_input_v57.py
          PYTHONPATH=scripts python3 -c "from check_cdr_sampler_active_input_v57 import check; print(check())"
      - name: Verify original sampler waveform and device gates plus gain-tail current
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path
          old=Path('scripts/cloud_cdr_sampler_parallel_drive.py').read_text()
          new=Path('scripts/cloud_cdr_sampler_active_input_v57.py').read_text()
          def region(text):return text[text.index('        def v(n):'):text.index("        r.update(samples=")]
          actual=region(new)
          added="        tails['xsamp.gain']=float(sum(d['@n.xsamp.xgt'+str(i)+'.nsg13_lv_nmos[ids]']for i in range(2))[active].min())"
          assert actual.count(added)==1
          assert actual.replace(added+'\n','')==region(old)
          assert "'CQP qp 0 1p','CQN qn 0 1p'" in new
          print('PASS_ORIGINAL_SAMPLER_GATES_AND_OUTPUT_STRESS_RETAINED_EXTRA_GAIN_TAIL_CHECK')
          PYCODE

  native:
    needs: controls
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        case: [nominal, hot_low, cold_high, swap_output, clock_stopped, bias_off]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Restore native simulator dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends tcl8.6 libsndfile1 libsamplerate0 libreadline8t64 libxaw7 libxt6 libxft2 libfontconfig1
          python3 -m pip install numpy==2.3.3
      - name: Test actual shared-reference active-input sampler with full source and native transistor checks
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/cloud_cdr_sampler_active_input_v57.py --case ${{ matrix.case }}
      - name: Preserve complete component evidence including all failures
        if: always()
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          root=cloud-cdr-sampler-active-input-v57-${{ matrix.case }}
          mkdir -p "$root"
          if [ ! -f "$root/result.json" ]; then
            printf '%s\n' '{"status":"FAIL_MISSING_REPORT","full_phy_accepted":false}' > "$root/result.json"
          fi
          stem="cdr-sampler-active-input-v57-${{ matrix.case }}-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          cp "$root/result.json" "$stem.summary.json"
          python3 scripts/cloud_chunked_results.py --directory "$root" --stem "$stem"
          python3 - "$stem" <<'PYCODE'
          import json,subprocess,sys
          stem=sys.argv[1];m=json.load(open(stem+'.parts.json'))
          subprocess.run([sys.executable,'scripts/publish_cloud_results.py','--group','cdr-sampler-active-input-v57-${{ matrix.case }}',stem+'.summary.json',stem+'.parts.json',*[p['name']for p in m['parts']]],check=True)
          PYCODE
      - name: Retain evidence after publication failure
        if: always() && steps.publish.outcome == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cdr-sampler-active-input-v57-${{ matrix.case }}-${{ github.run_id }}
          path: cloud-cdr-sampler-active-input-v57-${{ matrix.case }}/
          retention-days: 30
