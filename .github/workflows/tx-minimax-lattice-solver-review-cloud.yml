# SPDX-License-Identifier: Apache-2.0
name: tx-minimax-lattice-solver-review-cloud
on:
  push:
    branches: [codex/complete-open-work]
    paths: [.github/workflows/tx-minimax-lattice-solver-review-cloud.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python3 -m pip install numpy==2.3.3 scipy==1.16.2
      - run: python3 scripts/diagnose_tx_minimax_lattice_solver.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: exact-original-lattice-solver-diagnosis
          path: solver-diagnosis.json
          retention-days: 30
