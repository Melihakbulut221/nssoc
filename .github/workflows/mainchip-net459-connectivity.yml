name: Current net459 derived connectivity observation
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: net459-connectivity-${{ github.ref }}
  cancel-in-progress: false
env:
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  observe:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Bind exact source and complete existing derived input
        run: |
          python3 -B - <<'PY'
          import hashlib,json,os,subprocess
          from pathlib import Path
          e=os.environ
          assert e['GITHUB_ACTIONS']=='true' and e['RUNNER_OS']=='Linux'
          assert e['GITHUB_REPOSITORY']=='Melihakbulut221/nssoc' and e['GITHUB_EVENT_NAME']=='workflow_dispatch'
          assert e['GITHUB_REF']=='refs/heads/codex/mainchip-net459-connectivity' and e['GITHUB_RUN_ATTEMPT']=='1'
          assert subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()==e['GITHUB_SHA']
          raw=Path('scripts/mainchip-net459-connectivity-pins.json').read_bytes()
          assert hashlib.sha256(raw).hexdigest()=='4ac71688cc00e66bf75b5ca7d44a04feb052eb1ece14340a7ecacd61cbb5f549'
          pins=json.loads(raw)
          for name,pin in pins['files'].items():
              p=Path(name);assert p.is_file() and not p.is_symlink()
              b=p.read_bytes();assert len(b)==pin['bytes'] and hashlib.sha256(b).hexdigest()==pin['sha256']
          out=Path('connectivity-evidence');out.mkdir()
          (out/'context.json').write_text(json.dumps(dict(source=e['GITHUB_SHA'],run=int(e['GITHUB_RUN_ID']),attempt=1,pins=pins,native_acquisition=False),sort_keys=True,indent=2)+'\n')
          PY
      - name: Exercise connectivity and refusal controls
        run: python3 -B scripts/mainchip_net459_connectivity.py --mode controls --output connectivity-evidence/controls.json > connectivity-evidence/controls.stdout 2> connectivity-evidence/controls.stderr
      - name: Require complete actual controls
        run: |
          python3 -B - <<'PY'
          import json,os
          from pathlib import Path
          r=json.loads(Path('connectivity-evidence/controls.json').read_bytes())
          assert r['status']=='PASS_NET459_CONNECTIVITY_SOURCE_CONTROLS'
          assert (r['positive_count'],r['refusal_count'])==(11,10)
          assert r['computed_control_networks_synthetic'] is True
          assert (r['context']['source'],r['context']['run'],r['context']['attempt'])==(os.environ['GITHUB_SHA'],int(os.environ['GITHUB_RUN_ID']),1)
          PY
      - name: Observe the complete current net459 graph in both explicit contact modes
        run: python3 -B scripts/mainchip_net459_connectivity.py --mode inspect --output connectivity-evidence/observation.json > connectivity-evidence/observation.stdout 2> connectivity-evidence/observation.stderr
      - name: Require complete graph observations without physical acceptance
        run: |
          python3 -B - <<'PY'
          import json,os
          from pathlib import Path
          r=json.loads(Path('connectivity-evidence/observation.json').read_bytes())
          assert r['status']=='PASS_NET459_DERIVED_CONNECTIVITY_OBSERVATION_ONLY'
          assert (r['context']['source'],r['context']['run'],r['context']['attempt'])==(os.environ['GITHUB_SHA'],int(os.environ['GITHUB_RUN_ID']),1)
          assert set(r['cases'])=={'positive_area','closed_boundary'}
          for mode,cases in r['cases'].items():
              assert set(cases)=={'original','exclude_short_rectangle'}
              for label,c in cases.items():
                  assert c['mode']==mode and len(c['source_shapes'])==139 and len(c['source_pins'])==5
                  assert c['removed_shape_indices']==([] if label=='original' else [21])
                  assert all(c[k] is False for k in ('physical_acceptance','timing_accepted','full_phy_accepted','geometry_changed','native_acquisition','native_executed','pin_internal_connectivity_inferred'))
          print(json.dumps(dict(finding=r['finding'],physical_acceptance=False),sort_keys=True))
          PY
      - name: Always emit every derived byte and failure output
        if: always()
        run: |
          python3 -B - <<'PY'
          import base64,hashlib,json,zlib
          from pathlib import Path
          root=Path('connectivity-evidence')
          for p in sorted(root.rglob('*')):
              assert not p.is_symlink()
              if not p.is_file():continue
              assert p.suffix in ('.json','.stdout','.stderr')
              raw=p.read_bytes();name=p.relative_to(root).as_posix()
              packed=zlib.compress(raw,9);chunks=[packed[i:i+12000]for i in range(0,len(packed),12000)]
              pin=dict(name=name,bytes=len(raw),sha256=hashlib.sha256(raw).hexdigest(),chunks=len(chunks))
              print('NET459_COMPLETE_INDEX '+json.dumps(pin,sort_keys=True))
              for i,b in enumerate(chunks):
                  print('NET459_COMPLETE_CHUNK '+json.dumps(dict(**pin,index=i,encoding='zlib-base64',base64=base64.b64encode(b).decode()),sort_keys=True))
          PY
      - name: Preserve all derived output and complete command streams
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: net459-connectivity-${{ github.run_id }}-${{ github.run_attempt }}
          path: connectivity-evidence
          if-no-files-found: error
          retention-days: 90
