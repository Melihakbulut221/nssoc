# SPDX-License-Identifier: Apache-2.0
name: pll845-storage-capacity-cloud
on:
  push:
    branches: [codex/complete-open-work]
    paths: [.github/workflows/pll845-storage-capacity-cloud.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pll845-storage-capacity-${{ github.ref }}
  cancel-in-progress: false
jobs:
  inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Apply existing bounded disposable hosted SDK cleanup
        run: python3 scripts/cloud_pll_storage_headroom.py
      - name: Measure separate filesystems and remaining capacity without downloading a capsule
        run: python3 scripts/cloud_pll845_storage_capacity.py
      - name: Preserve actual measurements and failures
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          root=cloud-pll845-storage-capacity
          mkdir -p "$root"
          if [ ! -f "$root/result.json" ]; then
            printf '%s\n' '{"status":"FAIL_MISSING_REPORT","full_phy_accepted":false}' > "$root/result.json"
            if [ -d cloud-pll-storage-headroom ]; then cp -a cloud-pll-storage-headroom "$root/"; fi
          fi
          stem="pll845-storage-capacity-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          cp "$root/result.json" "$stem.summary.json"
          python3 scripts/cloud_chunked_results.py --directory "$root" --stem "$stem"
          python3 - "$stem" <<'PYCODE'
          import json,subprocess,sys
          stem=sys.argv[1];m=json.load(open(stem+'.parts.json'))
          subprocess.run([sys.executable,'scripts/publish_cloud_results.py','--group','pll845-storage-capacity',stem+'.summary.json',stem+'.parts.json',*[p['name']for p in m['parts']]],check=True)
          PYCODE

# Extend read-only inventory to shared resources and checkout storage before any additional reclamation.
