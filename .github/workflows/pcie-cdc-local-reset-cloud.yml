name: pcie-cdc-local-reset-cloud
on:
  push:
    branches: [codex/complete-open-work]
    paths: [.github/workflows/pcie-cdc-local-reset-cloud.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pcie-cdc-local-reset-${{ github.ref }}
  cancel-in-progress: false
jobs:
  source-diagnosis:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: YosysHQ/setup-oss-cad-suite@aefa8397bbf8fc6670a0a62af9805a89738f3cde
        with:
          version: '2026-08-04'
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Prepare pinned native IHP functional models
        run: |
          python3 -m pip install pytest==8.4.2
          python3 hw/soc/flow/prepare_ihp_native_boot.py
      - name: Verify event equivalence, stopped-clock behavior and mapped reset topology
        run: |
          python3 -m py_compile scripts/cloud_pcie_cdc_local_reset.py
          python3 scripts/cloud_pcie_cdc_local_reset.py
      - name: Preserve original-source receipt and complete native trial
        if: always()
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          root=cloud-pcie-cdc-local-reset
          mkdir -p "$root"
          if [ ! -f "$root/result.json" ]; then
            printf '%s\n' '{"status":"FAIL_MISSING_REPORT","accepted":false}' > "$root/result.json"
          fi
          stem="pcie-cdc-local-reset-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          cp "$root/result.json" "$stem.summary.json"
          python3 scripts/cloud_chunked_results.py --directory "$root" --stem "$stem"
          python3 - "$stem" <<'PYCODE'
          import json,subprocess,sys
          stem=sys.argv[1];manifest=stem+'.parts.json';m=json.load(open(manifest))
          subprocess.run([sys.executable,'scripts/publish_cloud_results.py','--group','pcie-cdc-local-reset',stem+'.summary.json',manifest,*[p['name']for p in m['parts']]],check=True)
          PYCODE
      - name: Retain evidence after publication failure
        if: always() && steps.publish.outcome == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pcie-cdc-local-reset-${{ github.run_id }}
          path: cloud-pcie-cdc-local-reset/
          retention-days: 30
