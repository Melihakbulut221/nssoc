# Parent source requires corrected qp2/qn2 boundaries and seven actual corruption controls.
name: pll-divider-load3p2v2-diagnostic-cloud
on:
  push:
    branches: [codex/complete-open-work]
    paths: [.github/workflows/pll-divider-load3p2v2-diagnostic-cloud.yml]
  workflow_dispatch:
    inputs:
      parent_report:
        description: Exact completed parent run/head/summary/parts/model JSON receipt
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: pll-divider-load3p2v2-diagnostic-${{ github.ref }}
  cancel-in-progress: false
jobs:
  source-syntax:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - run: python3 -m py_compile scripts/cloud_pll_divider_load3p2v2_diagnostic.py
  native-paths:
    if: github.event_name == 'workflow_dispatch'
    env:
      PARENT_REPORT: ${{ inputs.parent_report }}
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Restore analysis dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libsndfile1 libsamplerate0 libreadline8t64 libxaw7 libxt6 libxft2 libfontconfig1
          python3 -m pip install numpy==2.3.3
      - name: Measure corrected native divider RC in PLL with all102 HBT probes
        run: |
          python3 -m py_compile scripts/cloud_pll_divider_load3p2v2_diagnostic.py
          python3 scripts/cloud_pll_divider_load3p2v2_diagnostic.py
      - name: Preserve native results and failures
        if: always()
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p cloud-pll-divider-load3p2v2-diagnostic
          if [ ! -f cloud-pll-divider-load3p2v2-diagnostic/result.json ]; then
            printf '%s\n' '{"status":"FAIL_MISSING_REPORT","accepted":false}' > cloud-pll-divider-load3p2v2-diagnostic/result.json
          fi
          stem="pll-divider-load3p2v2-diagnostic-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          cp cloud-pll-divider-load3p2v2-diagnostic/result.json "$stem.summary.json"
          python3 scripts/cloud_chunked_results.py --directory cloud-pll-divider-load3p2v2-diagnostic --stem "$stem"
          python3 - "$stem" <<'PYCODE'
          import json,subprocess,sys
          stem=sys.argv[1];manifest=stem+'.parts.json';m=json.load(open(manifest))
          subprocess.run([sys.executable,'scripts/publish_cloud_results.py','--group','pll-divider-load3p2v2-diagnostic',stem+'.summary.json',manifest,*[p['name']for p in m['parts']]],check=True)
          PYCODE
      - name: Retain evidence after publication failure
        if: always() && steps.publish.outcome == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pll-divider-load3p2v2-diagnostic-${{ github.run_id }}
          retention-days: 30
          path: cloud-pll-divider-load3p2v2-diagnostic/
