name: soc-physical-resume
on:
  push:
    paths:
      - .github/workflows/soc-physical-resume.yml
      - scripts/resume_physical.py
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: soc-physical-resume-${{ github.ref }}
  cancel-in-progress: false
jobs:
  full-core:
    runs-on: ubuntu-22.04
    timeout-minutes: 330
    env:
      SOC_INTERFACE_PROFILE: full
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: sw/requirements.txt
      - uses: YosysHQ/setup-oss-cad-suite@aefa8397bbf8fc6670a0a62af9805a89738f3cde # v3
        with:
          version: '2026-08-04'
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Prepare pinned digital inputs
        run: |
          echo "OSS_CAD_SUITE=$(dirname "$(dirname "$(command -v yosys)")")" >> "$GITHUB_ENV"
          echo "INTERFACE_PYTHON=$(command -v python3)" >> "$GITHUB_ENV"
          python3 -m pip install -r sw/requirements.txt
          make soc-prepare
          mkdir -p hw/soc/out/current-physical-tools
          yosys -V > hw/soc/out/current-physical-tools/mapping-yosys.log
          hw/soc/tools/rvgcc/bin/riscv-none-elf-gcc --version > hw/soc/out/current-physical-tools/firmware-gcc.log
      - name: Verify physical devshell and install runtime prerequisite
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libfuse2
          mkdir -p hw/soc/out/physical-bootstrap-download
          python3 scripts/bootstrap_flow.py 2>&1 | tee hw/soc/out/physical-bootstrap-download/install.log
          python3 scripts/bootstrap_flow.py --check
      - name: Verify tools and full IHP kit with retained upstream control
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: hw/soc/tools/physical/librelane-3.0.5-x86_64.AppImage python3 scripts/check_flow_smoke.py
      - name: Download and verify pinned restart archive
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p hw/soc/out/route-resume-download
          artifact_id=$(python3 -c 'import json; print(json.load(open("docs/evidence/physical-route-checkpoint-20260922.json"))["artifact_id"])')
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip" > hw/soc/out/route-resume-download/source.zip
          python3 scripts/resume_physical.py --archive hw/soc/out/route-resume-download/source.zip
      - name: Resume detailed routing and physical checks
        timeout-minutes: 300
        run: |
          export PDK_ROOT="$PWD/hw/soc/tools/pdk-bootstrap"
          hw/soc/tools/physical/librelane-3.0.5-x86_64.AppImage \
            python3 hw/soc/pnr/interface_flow.py --flow Interfaces --pdk ihp-sg13g2 --scl sg13g2_stdcell \
            --run-tag route-resume -F OpenROAD.DetailedRouting \
            -i hw/soc/out/route-resume/checkpoint/state.local.json \
            hw/soc/pnr/config.resolved.route-resume.json
      - name: Capture restart files from the last completed physical step
        if: always()
        run: |
          if [ -d hw/soc/pnr/runs/route-resume ]; then
            python3 scripts/collect_physical_checkpoint.py capture --run hw/soc/pnr/runs/route-resume --out hw/soc/out/route-resume-checkpoint
          else
            echo 'No physical run directory exists; no restart checkpoint can be captured.'
          fi
      - name: Retain source identities and physical success or failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: soc-physical-resume-results
          path: |
            hw/soc/out/current-physical-tools/*.log
            hw/soc/out/physical-bootstrap-download/*.log
            hw/soc/out/physical-bootstrap/**/*.log
            hw/soc/out/physical-bootstrap/**/*.json
            hw/soc/out/route-resume/restore.json
            hw/soc/out/route-resume/soc_logic_boot_rom.v
            hw/soc/out/route-resume-checkpoint/
            hw/soc/pnr/config.resolved.route-resume.json
            hw/soc/pnr/runs/route-resume/**/*.log
            hw/soc/pnr/runs/route-resume/**/*.rpt
            hw/soc/pnr/runs/route-resume/**/*.json
            hw/soc/pnr/runs/route-resume/final/
          retention-days: 30
