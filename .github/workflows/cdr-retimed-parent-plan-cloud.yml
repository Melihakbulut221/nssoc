name: cdr-retimed-parent-plan-cloud
on:
  push:
    branches: [codex/complete-open-work]
    paths: [.github/workflows/cdr-retimed-parent-plan-cloud.yml, scripts/cdr_retimed_parent_plan.py]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cdr-retimed-parent-plan-${{ github.sha }}
  cancel-in-progress: false
jobs:
  source-binding:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Check every native source card and actual parent macro mapping
        run: |
          python3 -m py_compile scripts/cdr_retimed_parent_plan.py
          python3 scripts/cdr_retimed_parent_plan.py > cdr-retimed-parent-plan.json
      - name: Preserve exact hierarchy controls
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/publish_cloud_results.py --group cdr-retimed-parent-plan cdr-retimed-parent-plan.json
