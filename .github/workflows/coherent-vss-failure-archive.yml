name: coherent-vss-failure-archive
on:
  push:
    paths:
      - .github/workflows/coherent-vss-failure-archive.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: coherent-vss-failure-archive
  cancel-in-progress: false
jobs:
  archive:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Fetch only exact failed producer source
        run: git fetch --no-tags --depth=1 origin fb3f7492ea94c8e6a3c98cebbf4dbc4892cfe4f9
      - name: Verify complete original failure and publish unchanged ZIP without native rerun
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: >-
          python3 scripts/archive_coherent_vss_failure.py --publish
          --output "$RUNNER_TEMP/coherent-vss-failure-archive"
      - name: Preserve compact verification and publication receipts even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coherent-vss-failure-archive-receipt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/coherent-vss-failure-archive/review/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
          compression-level: 1
