# SPDX-License-Identifier: Apache-2.0
name: pll845-sparse-reader-cloud
on:
  push:
    branches: [codex/complete-open-work]
    paths: [.github/workflows/pll845-sparse-reader-cloud.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pll845-sparse-reader-${{ github.ref }}
  cancel-in-progress: false
jobs:
  sparse-reader:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install pinned reader dependency and compile cloud sources
        run: |
          python3 -m pip install numpy==2.3.3
          python3 -m py_compile scripts/cloud_pll845_sparse_reader.py
      - name: Run sparse-reader without restoring the real PLL process
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/cloud_pll845_sparse_reader.py
      - name: Publish original reader or capacity evidence including failures
        if: always()
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          root=cloud-pll845-sparse-reader
          mkdir -p "$root"
          if [ ! -f "$root/result.json" ]; then
            printf '%s\n' '{"status":"FAIL_MISSING_REPORT","full_capture_accepted":false}' > "$root/result.json"
          fi
          stem="pll845-sparse-reader-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          cp "$root/result.json" "$stem.summary.json"
          python3 scripts/cloud_chunked_results.py --directory "$root" --stem "$stem"
          python3 - "$stem" <<'PYCODE'
          import json,subprocess,sys
          s=sys.argv[1];m=json.load(open(s+'.parts.json'))
          subprocess.run([sys.executable,'scripts/publish_cloud_results.py','--group','pll845-sparse-reader',s+'.summary.json',s+'.parts.json',*[x['name']for x in m['parts']]],check=True)
          PYCODE
      - name: Preserve publication failure evidence
        if: always() && steps.publish.outcome == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pll845-sparse-reader-${{ github.run_id }}
          path: cloud-pll845-sparse-reader/
          retention-days: 30
  reader-host-capacity:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          sparse-checkout: scripts
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install pinned reader dependency and compile cloud sources
        run: |
          python3 -m pip install numpy==2.3.3
          python3 -m py_compile scripts/cloud_pll845_reader_host_capacity.py
      - name: Run reader-host-capacity without restoring the real PLL process
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/cloud_pll845_reader_host_capacity.py
      - name: Publish original reader or capacity evidence including failures
        if: always()
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          root=cloud-pll845-reader-host-capacity
          mkdir -p "$root"
          if [ ! -f "$root/result.json" ]; then
            printf '%s\n' '{"status":"FAIL_MISSING_REPORT","full_capture_accepted":false}' > "$root/result.json"
          fi
          stem="pll845-reader-host-capacity-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          cp "$root/result.json" "$stem.summary.json"
          python3 scripts/cloud_chunked_results.py --directory "$root" --stem "$stem"
          python3 - "$stem" <<'PYCODE'
          import json,subprocess,sys
          s=sys.argv[1];m=json.load(open(s+'.parts.json'))
          subprocess.run([sys.executable,'scripts/publish_cloud_results.py','--group','pll845-reader-host-capacity',s+'.summary.json',s+'.parts.json',*[x['name']for x in m['parts']]],check=True)
          PYCODE
      - name: Preserve publication failure evidence
        if: always() && steps.publish.outcome == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pll845-reader-host-capacity-${{ github.run_id }}
          path: cloud-pll845-reader-host-capacity/
          retention-days: 30
