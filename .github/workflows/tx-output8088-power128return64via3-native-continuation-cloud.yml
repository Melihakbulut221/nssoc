# SPDX-License-Identifier: Apache-2.0
name: tx-output8088-power128return64via3-native-continuation-cloud
on:
  push:
    branches: [codex/complete-open-work]
    paths: [.github/workflows/tx-output8088-power128return64via3-native-continuation-cloud.yml]
  workflow_dispatch:
    inputs:
      source_checkpoint:
        description: Exact successful latest native process descriptor and immutable hashes
        required: true
        type: string
      case:
        description: Prepared original electrical case
        required: true
        type: choice
        options: [none, swap_leaf_select]
      seconds:
        description: Native work seconds before preserving the same process
        required: true
        default: '3600'
        type: string
permissions:
  contents: read
concurrency:
  group: tx-output8088-power128return64via3-native-cross-${{ github.ref }}-${{ inputs.case }}
  cancel-in-progress: false
jobs:
  controls:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Check exact sources and reject changed checkpoint descriptors and native prefixes
        run: |
          python3 -m pip install numpy==2.3.3 scipy==1.16.2 networkx==3.4.2
          python3 scripts/check_tx_output8088_power128return64via3_native_sources.py
          PYTHONPATH=scripts python3 -c "import json; from cloud_tx_output8088_power128return64via3_native import controls; print(json.dumps(controls()))"
  native:
    if: github.event_name == 'workflow_dispatch'
    needs: controls
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify exact full-transient controller
        run: python3 scripts/check_tx_output8088_power128return64via3_native_sources.py
      - name: Install cloud-only native and checkpoint dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends build-essential pkg-config libprotobuf-dev libprotobuf-c-dev protobuf-c-compiler protobuf-compiler python3-protobuf uuid-dev libbsd-dev libcap-dev libnet1-dev libnl-3-dev tcl8.6 libsndfile1 libsamplerate0 libreadline8t64 libxaw7 libxt6 libxft2 libfontconfig1
          python3 -m pip install numpy==2.3.3 scipy==1.16.2 networkx==3.4.2
          git init "$RUNNER_TEMP/criu-src"
          git -C "$RUNNER_TEMP/criu-src" remote add origin https://github.com/checkpoint-restore/criu.git
          git -C "$RUNNER_TEMP/criu-src" fetch --depth 1 origin 9539417f3e3cfa4eb84c319cd71f4d52f1f08645
          git -C "$RUNNER_TEMP/criu-src" checkout --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/criu-src" rev-parse HEAD)" = 9539417f3e3cfa4eb84c319cd71f4d52f1f08645
          make -C "$RUNNER_TEMP/criu-src" -j2 criu PYTHON=/usr/bin/python3 2>&1 | tee "$RUNNER_TEMP/criu-build.log"
          sudo install -m 755 "$RUNNER_TEMP/criu-src/criu/criu" /usr/sbin/criu
          python3 - <<'PYCODE'
          import hashlib,json,os,pathlib,subprocess
          p=pathlib.Path('/usr/sbin/criu')
          d=dict(source_commit='9539417f3e3cfa4eb84c319cd71f4d52f1f08645',binary_sha256=hashlib.sha256(p.read_bytes()).hexdigest(),version=subprocess.check_output([str(p),'--version'],text=True),libraries=subprocess.check_output(['ldd',str(p)],text=True))
          (pathlib.Path(os.environ['RUNNER_TEMP'])/'criu-build.json').write_text(json.dumps(d,indent=2)+'\n')
          PYCODE
      - name: Restore latest actual native process with exact runtime and complete original capture
        env:
          GH_TOKEN: ${{ github.token }}
          NSSOC_TX_SOURCE: ${{ inputs.source_checkpoint }}
          NSSOC_TX_SECONDS: ${{ inputs.seconds }}
        run: python3 scripts/cloud_tx_output8088_power128return64via3_native.py --stage cross --case ${{ inputs.case }}
      - name: Publish exact native process and every raw failure byte
        if: always()
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          root=cloud-tx-output8088-power128return64via3-native-cross-${{ inputs.case }}
          mkdir -p "$root"
          if [ -f "$RUNNER_TEMP/criu-build.log" ]; then cp "$RUNNER_TEMP/criu-build.log" "$root/criu-build.log"; fi
          if [ ! -f "$root/result.json" ]; then
            printf '%s\n' '{"status":"FAIL_MISSING_REPORT","full_capture":false,"electrical_screen_passed":false}' > "$root/result.json"
          fi
          stem="tx-output8088-power128return64via3-native-cross-${{ inputs.case }}-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          cp "$root/result.json" "$stem.summary.json"
          python3 scripts/cloud_chunked_results.py --directory "$root" --stem "$stem"
          python3 - "$stem" <<'PYCODE'
          import json,subprocess,sys
          stem=sys.argv[1];manifest=stem+'.parts.json';m=json.load(open(manifest))
          subprocess.run([sys.executable,'scripts/publish_cloud_results.py','--group','tx-output8088-power128return64via3-native-cross-${{ inputs.case }}',stem+'.summary.json',manifest,*[p['name']for p in m['parts']]],check=True)
          PYCODE
      - name: Preserve failed publication
        if: always() && steps.publish.outcome == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tx-output8088-power128return64via3-native-cross-${{ inputs.case }}
          path: cloud-tx-output8088-power128return64via3-native-cross-${{ inputs.case }}/
          retention-days: 30
