name: tx-mux4-cloud
on:
  push:
    branches: ['codex/complete-open-work']
    paths:
      - .github/workflows/tx-mux4-cloud.yml
      - scripts/run_cloud_tx_mux4.py
      - sw/tests/test_cloud_tx_mux4.py
      - hw/soc/analog/pcie/tx_mux2_hbt_cascade_v1.spice
      - hw/soc/analog/pcie/tx_mux2_hbt_cascade_v2.spice
      - hw/soc/analog/pcie/tx_cmos_hv_resistive_input_v6.inc
      - hw/soc/analog/pcie/tx_clock_common_bias_v1.spice
      - hw/soc/analog/pcie/tx_cmos_hv_resistive_input_v7.inc
      - hw/soc/analog/pcie/tx_mux2_hbt_passive_drive_v2.spice
      - hw/soc/analog/pcie/tx_mux54_passive_drive_v3.spice
      - hw/soc/analog/pcie/tx_mux54_passive_drive_v4.spice
      - hw/soc/analog/pcie/tx_pre_bias_res_v1.inc
      - hw/soc/analog/pcie/tx_clock_bias_feed_v1.inc
      - hw/soc/analog/pcie/tx_output_bias_feeds_v1.inc
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tx-mux4-cloud-${{ github.ref }}
  cancel-in-progress: false
jobs:
  native-transient:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        streams: [4, 8, 32]
        condition: [nominal]
        fault: [none]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Restore exact native simulator with hosted dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libsndfile1 libsamplerate0 libreadline8t64 libxaw7 libxt6 libxft2 libfontconfig1
          python3 -m pip install numpy==2.3.3 pytest==8.4.2
          curl --fail --location --retry 4 'https://deb.debian.org/debian/pool/main/n/ngspice/ngspice_47+ds-1~bpo13+1_amd64.deb' -o "$RUNNER_TEMP/ngspice.deb"
          echo "400d2ebaefc1dcaaaf9693ac4731535d910fa2c0544552736970aa9ebaad760b  $RUNNER_TEMP/ngspice.deb" | sha256sum --check
          dpkg-deb -x "$RUNNER_TEMP/ngspice.deb" "$RUNNER_TEMP/ngspice"
          echo "CLOUD_NGSPICE=$RUNNER_TEMP/ngspice/usr/bin/ngspice" >> "$GITHUB_ENV"
      - name: Reject source-bit corruption and incomplete output captures
        run: python3 -m pytest -q sw/tests/test_cloud_tx_original_bits.py sw/tests/test_cloud_tx_mux4.py
      - name: Run actual complete tree and full-wave engineering screen
        run: python3 scripts/run_cloud_tx_mux4.py --condition '${{ matrix.condition }}' --streams '${{ matrix.streams }}' --prestage divider14 --frontend damped_strong --clock-bias native_res --final-drive double_taps_guard --pre-bias native_res --output-bias native_res --fault '${{ matrix.fault }}'
      - name: Preserve all successful and failed native captures permanently
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          archive='tx-serializer-${{ matrix.streams }}-${{ matrix.condition }}-${{ matrix.fault }}-${{ github.run_id }}-${{ github.run_attempt }}.tar.gz'
          tar -czf "$archive" cloud-tx-mux4
          sha256sum "$archive" > "$archive.sha256"
          summary="${archive%.tar.gz}.summary.json"
          cp cloud-tx-mux4/result.json "$summary"
          gh release upload cloud-migration-20261012-000 "$archive" "$archive.sha256" "$summary"
