# SPDX-License-Identifier: Apache-2.0
name: tx-raw8074-interfaces-cloud
on:
  push:
    branches: [codex/complete-open-work]
    paths: [.github/workflows/tx-raw8074-interfaces-cloud.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tx-raw8074-interfaces-${{ github.ref }}
  cancel-in-progress: false
jobs:
  native-interfaces:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Check frozen full-parent interface methods
        run: |
          python3 - <<'PYCODE'
          import hashlib,json
          from pathlib import Path
          for p,h in json.loads(Path('scripts/tx-raw8074-interface-methods.json').read_text()).items():
              assert hashlib.sha256(Path(p).read_bytes()).hexdigest()==h,p
          PYCODE
          python3 -m py_compile scripts/cloud_tx_raw8074_interfaces.py scripts/bind_tx_raw8074_interfaces.py
      - name: Restore exact cloud native layout runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libfuse2 tcl8.6 tk8.6
          curl --fail --location --retry 4 https://github.com/librelane/librelane/releases/download/3.0.5/librelane-devshell-x86_64.AppImage -o "$RUNNER_TEMP/librelane.AppImage"
          echo "d6a349ec65be11456e96c4981d35f63ca34d3c85daf79a51e1ccb907bb5d7466  $RUNNER_TEMP/librelane.AppImage" | sha256sum --check
          chmod +x "$RUNNER_TEMP/librelane.AppImage"
          echo "CLOUD_APPIMAGE=$RUNNER_TEMP/librelane.AppImage" >> "$GITHUB_ENV"
      - name: Bind actual8074 native terminals and real driver core handoffs
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/cloud_tx_raw8074_interfaces.py
      - name: Preserve complete native evidence and failures
        if: always()
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          root=hw/soc/out/cloud-tx-raw8074-interfaces
          mkdir -p "$root"
          if [ ! -f "$root/result.json" ]; then
            printf '%s\n' '{"status":"FAIL_MISSING_REPORT","loaded_electrical_passed":false}' > "$root/result.json"
          fi
          stem="tx-raw8074-interfaces-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          cp "$root/result.json" "$stem.summary.json"
          python3 scripts/cloud_chunked_results.py --directory "$root" --stem "$stem"
          python3 - "$stem" <<'PYCODE'
          import json,subprocess,sys
          stem=sys.argv[1];manifest=stem+'.parts.json';m=json.load(open(manifest))
          subprocess.run([sys.executable,'scripts/publish_cloud_results.py','--group','tx-raw8074-interfaces',stem+'.summary.json',manifest,*[p['name']for p in m['parts']]],check=True)
          PYCODE
      - name: Preserve failed publication
        if: always() && steps.publish.outcome == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tx-raw8074-interfaces
          path: hw/soc/out/cloud-tx-raw8074-interfaces/
          retention-days: 30
