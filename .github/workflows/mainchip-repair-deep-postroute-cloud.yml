# SPDX-License-Identifier: Apache-2.0
name: mainchip-repair-deep-postroute-cloud
on:
  push:
    branches: [codex/complete-open-work]
    paths: [.github/workflows/mainchip-repair-deep-postroute-cloud.yml, scripts/cloud_mainchip_repair_deep_postroute.py, scripts/cloud_mainchip_repair_deep_postroute_geometry.py, scripts/check_mainchip_repair_deep_completed_source.py, scripts/check_mainchip_repair_deep_routed_topology.py, scripts/export_mainchip_repair_deep_completed_def.py, scripts/check_mainchip_repair_deep_postroute_sources.py, scripts/mainchip-repair-deep-postroute-methods.json, scripts/mainchip-repair-deep-postroute-delta.json, hw/soc/pnr/mainchip_completed_postroute_flow.py]
  workflow_dispatch:
    inputs:
      source_checkpoint:
        description: Exact successfully completed native DRT descriptor
        required: true
        type: string
      input_package:
        description: Exact passed postroute-input package descriptor
        required: true
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: mainchip-repair-deep-postroute-${{ github.ref }}
  cancel-in-progress: false
jobs:
  controls:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Bound methods and reject invalid physical or timing decisions
        run: |
          python3 scripts/check_mainchip_repair_deep_postroute_sources.py
          python3 scripts/check_mainchip_postroute_inputs_sources.py
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libfuse2
          python3 scripts/bootstrap_flow.py
          app="$GITHUB_WORKSPACE/hw/soc/tools/physical/librelane-3.0.5-x86_64.AppImage"
          "$app" python scripts/check_onehot_routed_extraction_native.py
          PYTHONPATH=hw/soc/pnr "$app" python - <<'PYCODE'
          from mainchip_completed_postroute_flow import MainchipCompletedPostroute
          from librelane.steps import OpenROAD,Odb
          from librelane.state import DesignFormat
          from replay_onehot_routed_extraction_flow import AuditedRCX,AuditedRoutedSTA
          assert MainchipCompletedPostroute.Steps==[OpenROAD.CheckAntennas,Odb.ReportDisconnectedPins,AuditedRCX,AuditedRoutedSTA]
          assert AuditedRCX.inputs==[DesignFormat.DEF]
          print('PASS_ACTUAL_NATIVE_POSTROUTE_STEP_CONTRACT_NO_ROUTE_EXECUTED')
          PYCODE
  native:
    if: github.event_name == 'workflow_dispatch'
    needs: controls
    runs-on: ubuntu-22.04
    timeout-minutes: 350
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Prepare exact native CAD runtime and immutable methods
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libfuse2
          python3 scripts/bootstrap_flow.py
          python3 scripts/check_mainchip_repair_deep_postroute_sources.py
          echo "CLOUD_APPIMAGE=$GITHUB_WORKSPACE/hw/soc/tools/physical/librelane-3.0.5-x86_64.AppImage" >> "$GITHUB_ENV"
      - name: Analyze only the explicitly completed repaired native route
        env:
          GH_TOKEN: ${{ github.token }}
          NSSOC_COMPLETED_DRT: ${{ inputs.source_checkpoint }}
          NSSOC_INPUT_PACKAGE: ${{ inputs.input_package || '{"run":39635867954,"group":"mainchip-postroute-inputs","source_head":"d37ef5a4358933a7b9b106ef7f9c6724a4e71f3b","controller_sha256":"b4ea0290387bd9891559c146b88aab274da60f180cad4b356bd53b986398382a","summary_sha256":"069978a77028b77bc5a59534a241bb97b4d5ef3a13c3b72621133a64eb0cfd73","parts_sha256":"256db094424d4c4f35afac9592a0339a241a615c9de6c4a636650e2ba215c716","attempt":1}' }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            python3 scripts/cloud_mainchip_repair_deep_postroute.py --preflight-inputs
          else
            python3 scripts/cloud_mainchip_repair_deep_postroute.py
          fi
      - name: Preserve all measured results and any rejection
        if: always()
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          root=cloud-mainchip-repair-deep-postroute
          mkdir -p "$root"
          python3 - "$root" <<'PYCODE'
          import hashlib,json,pathlib,sys
          p=pathlib.Path(sys.argv[1]);f=p/'result.json'
          r=json.loads(f.read_text())if f.is_file()else dict(status='FAIL_MISSING_REPORT',accepted=False)
          if r['status'].startswith('RUNNING'):r.update(status='INTERRUPTED_NATIVE_ANALYSIS_NOT_ACCEPTED',accepted=False)
          r['outputs']={str(x.relative_to(p)):hashlib.file_digest(x.open('rb'),'sha256').hexdigest()for x in p.rglob('*')if x.is_file()and x!=f}
          f.write_text(json.dumps(r,indent=2)+'\n')
          PYCODE
          stem="mainchip-repair-deep-postroute-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          cp "$root/result.json" "$stem.summary.json"
          python3 scripts/cloud_chunked_results.py --directory "$root" --stem "$stem"
          python3 - "$stem" <<'PYCODE'
          import json,subprocess,sys
          stem=sys.argv[1];manifest=stem+'.parts.json';m=json.load(open(manifest))
          subprocess.run([sys.executable,'scripts/publish_cloud_results.py','--group','mainchip-repair-deep-postroute',stem+'.summary.json',manifest,*[p['name']for p in m['parts']]],check=True)
          PYCODE
      - name: Preserve evidence if permanent publication fails
        if: always() && steps.publish.outcome == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mainchip-repair-deep-postroute-${{ github.run_id }}
          path: cloud-mainchip-repair-deep-postroute/
          retention-days: 30
