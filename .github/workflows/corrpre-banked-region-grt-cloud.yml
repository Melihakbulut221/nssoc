name: corrpre-banked-region-grt-cloud
on:
  push:
    branches: [codex/complete-open-work]
    paths: [.github/workflows/corrpre-banked-region-grt-cloud.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: corrpre-banked-region-grt-${{ github.ref }}
  cancel-in-progress: false
jobs:
  wait-for-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 310
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Wait for actual source-bound banked logic proof without restarting it
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -m py_compile scripts/cloud_corrpre_banked_region_grt.py hw/soc/pnr/corrpre_banked_clock200_grt_flow.py
          python3 scripts/cloud_corrpre_banked_region_grt.py --wait
      - name: Retain observed source state including wait failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: banked-grt-source-wait-${{ github.run_id }}
          path: hw/soc/out/cloud-corrpre-banked-region-grt/
          retention-days: 30
  native-global-route:
    needs: wait-for-proof
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Prepare pinned physical runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libfuse2
          python3 scripts/bootstrap_flow.py
          echo "CLOUD_APPIMAGE=$GITHUB_WORKSPACE/hw/soc/tools/physical/librelane-3.0.5-x86_64.AppImage" >> "$GITHUB_ENV"
      - name: Restore exact proof and physical states before native global routing
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/cloud_corrpre_banked_region_grt.py
      - name: Preserve every native state and any rejection
        if: always()
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          root=hw/soc/out/cloud-corrpre-banked-region-grt
          mkdir -p "$root"
          python3 - "$root" <<'PYCODE'
          import hashlib,json,pathlib,sys
          p=pathlib.Path(sys.argv[1]);f=p/'result.json'
          r=json.loads(f.read_text()) if f.is_file() else {'accepted':False,'status':'FAIL_MISSING_REPORT'}
          if r['status'].startswith(('RUNNING','RESTORING')):
              r.update(status='INTERRUPTED_NATIVE_STAGE_RETAINED_NOT_ACCEPTED',accepted=False)
          r['outputs']={str(x.relative_to(p)):hashlib.file_digest(x.open('rb'),'sha256').hexdigest()for x in p.rglob('*')if x.is_file()and x!=f}
          f.write_text(json.dumps(r,indent=2)+'\n')
          PYCODE
          stem="corrpre-banked-region-grt-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          cp "$root/result.json" "$stem.summary.json"
          python3 scripts/cloud_chunked_results.py --directory "$root" --stem "$stem"
          python3 - "$stem" <<'PYCODE'
          import json,subprocess,sys
          stem=sys.argv[1];manifest=stem+'.parts.json';m=json.load(open(manifest))
          subprocess.run([sys.executable,'scripts/publish_cloud_results.py','--group','corrpre-banked-region-grt',stem+'.summary.json',manifest,*[p['name']for p in m['parts']]],check=True)
          PYCODE
      - name: Retain states if permanent publication fails
        if: always() && steps.publish.outcome == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: corrpre-banked-region-grt-${{ github.run_id }}
          path: hw/soc/out/cloud-corrpre-banked-region-grt/
          retention-days: 30
