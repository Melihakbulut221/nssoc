name: CDR selector width geometry generation only
on:
  workflow_dispatch:
    inputs:
      generate:
        description: Reserved geometry-only execution after independent authorization
        type: boolean
        default: false
        required: true
permissions:
  contents: read
  actions: read
concurrency:
  group: cdr-selector-width-native-${{ github.ref }}
  cancel-in-progress: false
env:
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  source-controls:
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Protected source admission before dependency download
        run: |
          python3 -B scripts/cdr_v59_selector_column_width_native.py source-preflight
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Hash-pinned synthetic geometry dependency
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir --only-binary=:all: --no-deps --require-hashes -r scripts/cdr-v59-selector-column-width-controls-requirements.txt
      - name: Original width controls with original disabled method
        run: |
          mkdir -p hw/soc/out/cdr-selector-width-native-controls
          python -B scripts/check_cdr_v59_selector_column_width.py --output hw/soc/out/cdr-selector-width-native-controls/width.json
      - name: Actual restore adapter lifecycle publication and isolated-source controls
        run: |
          python -B scripts/check_cdr_v59_selector_column_width_native.py --output hw/soc/out/cdr-selector-width-native-controls/wrapper.json
      - name: Unchanged qualified supervisor launcher and loader controls
        run: |
          python -B scripts/check_cdr_v59_tail_fresh_rc_runtime.py --out hw/soc/out/cdr-selector-width-native-controls/runtime.json
      - name: Exact source control assertions
        run: |
          python - <<'PY'
          import json,pathlib
          root=pathlib.Path("hw/soc/out/cdr-selector-width-native-controls")
          r=json.loads((root/"width.json").read_bytes())
          assert r["status"]=="PASS_SOURCE_CONTROLS_ONLY"
          assert (r["source"]["positive"],r["source"]["refusals"])==(3,15)
          assert (r["component"]["positive"],r["component"]["refusals"])==(1,6)
          assert (r["geometry"]["positive"],r["geometry"]["refusals"])==(3,7)
          assert r["lifecycle"]["count"]==4 and r["disabled_native"]["rejected"] is True
          r=json.loads((root/"wrapper.json").read_bytes())
          assert r["status"]=="PASS_GEOMETRY_WRAPPER_SOURCE_CONTROLS_ONLY"
          assert len(r["authorization"]["positive"])==2 and len(r["authorization"]["refusals"])==28
          assert len(r["adapter"])==2 and len(r["restore"])==2 and len(r["candidate"])==10
          assert len(r["lifecycle"])==12 and len(r["commands"])==6 and len(r["publication"])==10
          assert len(r["isolated"]["rows"])==4 and r["isolated"]["actual_isolated_subprocess"] is True
          assert all(r[k] is False for k in ("native_archive_acquired","native_geometry_executed","physical_accepted","electrical_accepted"))
          r=json.loads((root/"runtime.json").read_bytes())
          assert r["status"]=="PASS_QUALIFIED_RUNTIME_AND_WRITER_DEPENDENCY_CONTROLS"
          assert len(r["supervisor"]["controls"])==13
          assert len(r["launcher"]["positive"])==2 and len(r["launcher"]["rejected"])==9
          assert len(r["frozen_loader_controls"]["positive"])==1 and len(r["frozen_loader_controls"]["refusals"])==10
          assert r["actual_appimage_executed"] is r["native_executed"] is False
          PY
      - name: Emit every available complete control byte stream
        if: always()
        run: |
          python - <<'PY'
          import ast,base64,hashlib,json
          from pathlib import Path
          p=Path("scripts/cloud_cdr_v59_binding_rc.py");raw=p.read_bytes()
          assert hashlib.sha256(raw).hexdigest()=="647af19c78158045739b2589d61a2962bbff69e230b593ccb33019550edbd709"
          nodes=[n for n in ast.parse(raw).body if isinstance(n,ast.FunctionDef) and n.name=="emit"]
          assert len(nodes)==1
          scope=dict(base64=base64,hashlib=hashlib,json=json)
          exec(compile(ast.Module(body=nodes,type_ignores=[]),str(p),"exec"),scope)
          out=Path("hw/soc/out/cdr-selector-width-native-controls")
          for name in ("width","wrapper","runtime"):
              path=out/(name+".json")
              assert not path.is_symlink()
              if path.exists():
                  assert path.is_file()
                  scope["emit"](path,"CDR_SELECTOR_NATIVE_CONTROL_"+name.upper())
              else:
                  print("CDR_SELECTOR_NATIVE_ABSENT "+name,flush=True)
          PY
      - name: Preserve all source control evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cdr-selector-native-controls-${{ github.run_id }}-${{ github.run_attempt }}
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 90
          path: hw/soc/out/cdr-selector-width-native-controls
  geometry:
    # Geometry only; original controls and this exact source gate must pass first.
    if: ${{ inputs.generate }}
    needs: source-controls
    permissions:
      contents: write
      actions: read
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Exact source admission and reserved release before dependencies
        run: |
          python3 -B scripts/cloud_cdr_v59_selector_column_width_native.py --preflight
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Qualified immutable AppImage runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libfuse2 tcl8.6
          curl --fail --location --retry 4 https://github.com/librelane/librelane/releases/download/3.0.5/librelane-devshell-x86_64.AppImage -o "$RUNNER_TEMP/librelane.AppImage"
          echo "d6a349ec65be11456e96c4981d35f63ca34d3c85daf79a51e1ccb907bb5d7466  $RUNNER_TEMP/librelane.AppImage" | sha256sum --check
          chmod +x "$RUNNER_TEMP/librelane.AppImage"
          echo "CLOUD_APPIMAGE=$RUNNER_TEMP/librelane.AppImage" >> "$GITHUB_ENV"
      - name: Complete restore and original additive generation with serialized reread
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p hw/soc/out/cdr-selector-width-native-driver-logs
          python -B scripts/cloud_cdr_v59_selector_column_width_native.py 2>&1 | tee hw/soc/out/cdr-selector-width-native-driver-logs/driver.log
      - name: Publish full available success or failure evidence exactly once
        if: always()
        run: |
          python -B scripts/cloud_cdr_v59_selector_column_width_native.py --publish-only
      - name: Preserve complete native and publication evidence fallback
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cdr-selector-native-full-${{ github.run_id }}-${{ github.run_attempt }}
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 90
          path: |
            hw/soc/out/cloud-cdr-v59-selector-column-width-native
            hw/soc/out/cloud-cdr-v59-selector-column-width-native-publication
            hw/soc/out/cdr-selector-width-native-driver-logs
