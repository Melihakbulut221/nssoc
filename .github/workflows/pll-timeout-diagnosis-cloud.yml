name: pll-timeout-diagnosis-cloud
on:
  push:
    branches: [codex/complete-open-work]
    paths: [.github/workflows/pll-timeout-diagnosis-cloud.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pll-timeout-diagnosis-${{ github.ref }}
  cancel-in-progress: false
jobs:
  retained-prefix-diagnosis:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        size: [9, 11]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Read actual retained interrupted native waveforms in cloud
        run: |
          python3 -m pip install numpy==2.3.3
          python3 -m py_compile scripts/cloud_pll_timeout_diagnosis.py
          python3 scripts/cloud_pll_timeout_diagnosis.py --size ${{ matrix.size }}
      - name: Preserve diagnosis including failures
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p cloud-pll-timeout-diagnosis
          if [ ! -f cloud-pll-timeout-diagnosis/result.json ]; then
            printf '%s\n' '{"status":"FAIL_MISSING_REPORT","accepted":false}' > cloud-pll-timeout-diagnosis/result.json
          fi
          cp cloud-pll-timeout-diagnosis/result.json "pll-timeout-diagnosis-${{ matrix.size }}-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.summary.json"
          python3 scripts/publish_cloud_results.py --group pll-timeout-diagnosis-${{ matrix.size }} "pll-timeout-diagnosis-${{ matrix.size }}-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.summary.json"
