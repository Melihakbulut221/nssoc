name: tx-stage-repair-controls-cloud
on:
  push:
    branches: [codex/complete-open-work]
    paths: [.github/workflows/tx-stage-repair-controls-cloud.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tx-stage-repair-controls-${{ github.ref }}
  cancel-in-progress: false
jobs:
  source-bound-stage-repair-controls:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify source-bound resistor hypotheses and reject undeclared changes
        run: |
          python3 -m py_compile scripts/cloud_tx_driver_stage_repair.py
          python3 scripts/cloud_tx_driver_stage_repair.py
      - name: Publish source-bound inventory including failures
        if: always()
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p cloud-tx-stage-repair-controls
          if [ ! -f cloud-tx-stage-repair-controls/result.json ]; then
            printf '%s\n' '{"status":"FAIL_MISSING_REPORT","accepted":false}' > cloud-tx-stage-repair-controls/result.json
          fi
          stem="tx-stage-repair-controls-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          cp cloud-tx-stage-repair-controls/result.json "$stem.summary.json"
          python3 scripts/cloud_chunked_results.py --directory cloud-tx-stage-repair-controls --stem "$stem"
          python3 - "$stem" <<'PYCODE'
          import json,subprocess,sys
          stem=sys.argv[1];manifest=stem+'.parts.json';m=json.load(open(manifest))
          subprocess.run([sys.executable,'scripts/publish_cloud_results.py','--group','tx-stage-repair-controls',stem+'.summary.json',manifest,*[p['name']for p in m['parts']]],check=True)
          PYCODE
      - name: Retain diagnosis if publication failed
        if: always() && steps.publish.outcome == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tx-stage-repair-controls-${{ github.run_id }}
          path: cloud-tx-stage-repair-controls/
          retention-days: 30
