name: timing-core-ack-protocol
on:
  push:
    paths:
      - .github/workflows/timing-core-ack-protocol.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: timing-core-ack-protocol-${{ github.ref }}
  cancel-in-progress: false
jobs:
  actual-core-directed:
    runs-on: ubuntu-22.04
    timeout-minutes: 360 # Hosted ceiling; RTL has its explicit cycle/liveness bound.
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install RTL and bare-metal firmware tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends iverilog gcc-riscv64-unknown-elf binutils-riscv64-unknown-elf
          python3 -m pip install pytest==8.4.2
      - name: Pure source and evidence rejection tests
        run: python3 -m pytest -q sw/tests/test_core_ack_protocol.py sw/tests/test_core_ack_register.py
      - name: Prepare exact source-bound actual-core experiment
        run: python3 scripts/run_core_ack_protocol.py prepare --output "$GITHUB_WORKSPACE/core-ack-prepared"
      - name: Check compiler opcodes and run actual core protocol cases
        run: |
          python3 scripts/run_core_ack_protocol.py run --prepared "$GITHUB_WORKSPACE/core-ack-prepared" \
            --output "$GITHUB_WORKSPACE/core-ack-result"
      - name: Preserve source selection, firmware, raw results and any failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: core-ack-protocol-${{ github.run_attempt }}
          path: |
            core-ack-prepared/
            core-ack-result/
          include-hidden-files: true
          if-no-files-found: error
          compression-level: 1
          retention-days: 30
