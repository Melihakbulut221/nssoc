name: pgo-configure-diagnosis-cloud
on:
  push:
    branches: [codex/complete-open-work]
    paths: [.github/workflows/pgo-configure-diagnosis-cloud.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pgo-configure-diagnosis-${{ github.ref }}
  cancel-in-progress: false
jobs:
  reproduce-profile-configure-collision:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify strict numerical guards and original stream transport
        run: |
          python3 -m pip install numpy==2.3.3 pytest==8.4.2
          python3 -m py_compile scripts/cloud_tree32_pgo.py
          python3 scripts/cloud_tree32_pgo.py --controls-only
          python3 -m pytest -q sw/tests/test_cloud_tx_stream.py sw/tests/test_cloud_tx_original_bits.py
      - name: Install native compiler dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends build-essential autoconf automake libtool bison flex libreadline-dev libncurses-dev libsndfile1 libsamplerate0 libxaw7 libxt6 libxft2 libfontconfig1
      - name: Reproduce failed configure and isolate only its own profiles
        run: python3 scripts/diagnose_cloud_pgo_configure.py
      - name: Preserve failed and corrected configure logs and exact quarantined profiles
        id: publish
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p cloud-pgo-configure-diagnosis
          if [ ! -f cloud-pgo-configure-diagnosis/result.json ]; then
            printf '%s\n' '{"status":"FAIL_MISSING_PAIRED_REPORT","accepted":false}' > cloud-pgo-configure-diagnosis/result.json
          fi
          stem="pgo-configure-diagnosis-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          cp cloud-pgo-configure-diagnosis/result.json "$stem.summary.json"
          python3 scripts/cloud_chunked_results.py --directory cloud-pgo-configure-diagnosis --stem "$stem"
          python3 - "$stem" <<'PYCODE'
          import json,subprocess,sys
          stem=sys.argv[1];m=json.load(open(stem+'.parts.json'))
          subprocess.run([sys.executable,'scripts/publish_cloud_results.py','--group','pgo-configure-diagnosis',stem+'.summary.json',stem+'.parts.json',*[p['name']for p in m['parts']]],check=True)
          PYCODE
      - name: Retain evidence after publication failure
        if: always() && steps.publish.outcome == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pgo-configure-diagnosis-${{ github.run_id }}-fallback
          retention-days: 30
          compression-level: 0
          path: |
            pgo-configure-diagnosis-*.json
            pgo-configure-diagnosis-*.tar.gz*
            cloud-pgo-configure-diagnosis/result.json
            cloud-pgo-configure-diagnosis/training.json
            cloud-pgo-configure-diagnosis/*.log
