name: cloud-archive-index
on:
  workflow_dispatch:
  push:
    branches: ['codex/complete-open-work']
    paths:
      - .github/workflows/cloud-archive-index.yml
      - scripts/index_cloud_archives.py
permissions:
  contents: read
concurrency:
  group: cloud-archive-index-${{ github.ref }}
  cancel-in-progress: false
jobs:
  catalog:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        group: [0, 1, 2, 3]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Read and hash complete published archives on hosted runner
        run: python3 scripts/index_cloud_archives.py --group '${{ matrix.group }}'
      - name: Preserve accepted catalog and any incomplete coverage
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cloud-archive-index-${{ matrix.group }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: cloud-archive-index/
          if-no-files-found: error
          retention-days: 30
      - name: Publish durable content catalog
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          archive='cloud-archive-index-${{ matrix.group }}-${{ github.run_id }}-${{ github.run_attempt }}.tar.gz'
          tar -czf "$archive" cloud-archive-index
          sha256sum "$archive" > "$archive.sha256"
          gh release upload cloud-migration-20261012-000 "$archive" "$archive.sha256"
