name: route234-guide-diagnosis-cloud
on:
  push:
    branches: [codex/complete-open-work]
    paths: [.github/workflows/route234-guide-diagnosis-cloud.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect-source-bound-rejected-guides:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Inspect original published guide bytes
        run: |
          python3 scripts/diagnose_route234_guides.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: route234-guide-diagnosis-${{ github.run_id }}
          path: cloud-route234-guide-diagnosis/
          retention-days: 30
