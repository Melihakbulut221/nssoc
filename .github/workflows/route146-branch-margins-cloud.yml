name: route146-branch-margins-cloud
on:
  push:
    branches: [codex/complete-open-work]
    paths: [.github/workflows/route146-branch-margins-cloud.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: route146-branch-margins-${{ github.ref }}
  cancel-in-progress: false
jobs:
  full-driver-physical-composition:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Restore exact native OpenROAD runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libfuse2
          python3 -m pip install numpy==2.3.3
          curl --fail --location --retry 4 https://github.com/librelane/librelane/releases/download/3.0.5/librelane-devshell-x86_64.AppImage -o "$RUNNER_TEMP/librelane.AppImage"
          echo "d6a349ec65be11456e96c4981d35f63ca34d3c85daf79a51e1ccb907bb5d7466  $RUNNER_TEMP/librelane.AppImage" | sha256sum --check
          chmod +x "$RUNNER_TEMP/librelane.AppImage"
          echo "CLOUD_APPIMAGE=$RUNNER_TEMP/librelane.AppImage" >> "$GITHUB_ENV"
      - name: Resolve physical short-path branches and measure original three-corner margins
        run: |
          python3 -m py_compile scripts/cloud_route146_branch_margins.py
          python3 scripts/cloud_route146_branch_margins.py
      - name: Preserve every physical gate and fault including failed geometry
        if: always()
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p cloud-route146-branch-margins
          if [ ! -f cloud-route146-branch-margins/result.json ]; then
            printf '%s\n' '{"status":"FAIL_MISSING_REPORT","accepted":false}' > cloud-route146-branch-margins/result.json
          fi
          stem="route146-branch-margins-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          cp cloud-route146-branch-margins/result.json "$stem.summary.json"
          python3 scripts/cloud_chunked_results.py --directory cloud-route146-branch-margins --stem "$stem"
          python3 - "$stem" <<'PYCODE'
          import json,subprocess,sys
          stem=sys.argv[1];manifest=stem+'.parts.json';m=json.load(open(manifest))
          subprocess.run([sys.executable,'scripts/publish_cloud_results.py','--group','route146-branch-margins',stem+'.summary.json',manifest,*[p['name']for p in m['parts']]],check=True)
          PYCODE
      - name: Retain evidence after publication failure
        if: always() && steps.publish.outcome == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: route146-branch-margins-${{ github.run_id }}
          retention-days: 30
          path: cloud-route146-branch-margins/
