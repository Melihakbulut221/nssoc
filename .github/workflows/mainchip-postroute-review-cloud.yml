# SPDX-License-Identifier: Apache-2.0
name: mainchip-postroute-review-cloud
on:
  push:
    branches: [codex/complete-open-work]
    paths: [.github/workflows/mainchip-postroute-review-cloud.yml, scripts/cloud_mainchip_postroute_review.py, scripts/export_mainchip_completed_def.py, hw/soc/pnr/mainchip_completed_postroute_flow.py, scripts/check_mainchip_postroute_review_sources.py]
  workflow_dispatch:
    inputs:
      source_checkpoint:
        description: Exact successfully completed native DRT descriptor
        required: true
        type: string
      input_package:
        description: Exact passed postroute-input package descriptor
        required: true
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: mainchip-postroute-review-${{ github.ref }}
  cancel-in-progress: false
jobs:
  controls:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Bound methods and reject invalid physical or timing decisions
        run: |
          python3 scripts/check_mainchip_postroute_review_sources.py
          python3 scripts/check_mainchip_postroute_inputs_sources.py
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libfuse2
          python3 scripts/bootstrap_flow.py
          app="$GITHUB_WORKSPACE/hw/soc/tools/physical/librelane-3.0.5-x86_64.AppImage"
          "$app" python scripts/check_onehot_routed_extraction_native.py
          PYTHONPATH=hw/soc/pnr "$app" python - <<'PYCODE'
          from mainchip_completed_postroute_flow import MainchipCompletedPostroute
          from librelane.steps import OpenROAD,Odb
          from librelane.state import DesignFormat
          from replay_onehot_routed_extraction_flow import AuditedRCX,AuditedRoutedSTA
          assert MainchipCompletedPostroute.Steps==[OpenROAD.CheckAntennas,Odb.ReportDisconnectedPins,AuditedRCX,AuditedRoutedSTA]
          assert AuditedRCX.inputs==[DesignFormat.DEF]
          print('PASS_ACTUAL_NATIVE_POSTROUTE_STEP_CONTRACT_NO_ROUTE_EXECUTED')
          PYCODE
  native:
    if: github.event_name == 'workflow_dispatch'
    needs: controls
    runs-on: ubuntu-22.04
    timeout-minutes: 350
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Prepare exact native CAD runtime and immutable methods
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libfuse2
          python3 scripts/bootstrap_flow.py
          python3 scripts/check_mainchip_postroute_review_sources.py
          echo "CLOUD_APPIMAGE=$GITHUB_WORKSPACE/hw/soc/tools/physical/librelane-3.0.5-x86_64.AppImage" >> "$GITHUB_ENV"
      - name: Analyze completed route without restarting native routing
        env:
          GH_TOKEN: ${{ github.token }}
          NSSOC_COMPLETED_DRT: ${{ inputs.source_checkpoint }}
          NSSOC_INPUT_PACKAGE: ${{ inputs.input_package }}
        run: python3 scripts/cloud_mainchip_postroute_review.py
      - name: Preserve all measured results and any rejection
        if: always()
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          root=cloud-mainchip-postroute-review
          mkdir -p "$root"
          python3 - "$root" <<'PYCODE'
          import hashlib,json,pathlib,sys
          p=pathlib.Path(sys.argv[1]);f=p/'result.json'
          r=json.loads(f.read_text())if f.is_file()else dict(status='FAIL_MISSING_REPORT',accepted=False)
          if r['status'].startswith('RUNNING'):r.update(status='INTERRUPTED_NATIVE_ANALYSIS_NOT_ACCEPTED',accepted=False)
          r['outputs']={str(x.relative_to(p)):hashlib.file_digest(x.open('rb'),'sha256').hexdigest()for x in p.rglob('*')if x.is_file()and x!=f}
          f.write_text(json.dumps(r,indent=2)+'\n')
          PYCODE
          stem="mainchip-postroute-review-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          cp "$root/result.json" "$stem.summary.json"
          python3 scripts/cloud_chunked_results.py --directory "$root" --stem "$stem"
          python3 - "$stem" <<'PYCODE'
          import json,subprocess,sys
          stem=sys.argv[1];manifest=stem+'.parts.json';m=json.load(open(manifest))
          subprocess.run([sys.executable,'scripts/publish_cloud_results.py','--group','mainchip-postroute-review',stem+'.summary.json',manifest,*[p['name']for p in m['parts']]],check=True)
          PYCODE
      - name: Preserve evidence if permanent publication fails
        if: always() && steps.publish.outcome == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mainchip-postroute-review-${{ github.run_id }}
          path: cloud-mainchip-postroute-review/
          retention-days: 30
