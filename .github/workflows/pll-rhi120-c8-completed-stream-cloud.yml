name: pll-rhi120-c8-completed-stream-cloud
on:
  push:
    branches: [codex/complete-open-work]
    paths:
      - .github/workflows/pll-rhi120-c8-completed-stream-cloud.yml
      - scripts/cloud_pll_rhi120_c8_completed_stream.py
      - scripts/pll-rhi120-c8-completed-stream-method.json
  workflow_dispatch:
    inputs:
      checkpoint:
        description: Completed successful sparse publisher descriptor JSON; never a saved or live source
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: pll-rhi120-c8-completed-stream
  cancel-in-progress: false
jobs:
  controls:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Reject real saved source and qualify unchanged acquisition with exact stream cache
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -m pip install numpy==2.3.3
          python3 -m py_compile scripts/cloud_pll_rhi120_c8_completed_stream.py
          python3 scripts/cloud_pll_rhi120_c8_completed_stream.py --controls
      - name: Preserve controls including failures
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p cloud-pll-rhi120-c8-completed-stream
          if [ ! -f cloud-pll-rhi120-c8-completed-stream/result.json ]; then
            printf '%s\n' '{"status":"FAIL_MISSING_CONTROLS","full_phy_accepted":false}' > cloud-pll-rhi120-c8-completed-stream/result.json
          fi
          stem="pll-rhi120-c8-completed-stream-controls-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          cp cloud-pll-rhi120-c8-completed-stream/result.json "$stem.summary.json"
          python3 scripts/cloud_chunked_results.py --directory cloud-pll-rhi120-c8-completed-stream --stem "$stem"
          python3 - "$stem" <<'PYCODE'
          import json,subprocess,sys
          s=sys.argv[1];m=json.load(open(s+'.parts.json'))
          subprocess.run([sys.executable,'scripts/publish_cloud_results.py','--group','pll-rhi120-c8-completed-stream-controls',s+'.summary.json',s+'.parts.json',*[x['name']for x in m['parts']]],check=True)
          PYCODE
  completed-reader:
    if: github.event_name == 'workflow_dispatch'
    needs: controls
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify whole logical archive and every native column before original acquisition gates
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_CHECKPOINT: ${{ inputs.checkpoint }}
        run: |
          python3 -m pip install numpy==2.3.3
          python3 scripts/cloud_pll_rhi120_c8_completed_stream.py
      - name: Preserve complete review or rejection
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p cloud-pll-rhi120-c8-completed-stream
          if [ ! -f cloud-pll-rhi120-c8-completed-stream/result.json ]; then
            printf '%s\n' '{"status":"FAIL_MISSING_REVIEW","full_phy_accepted":false}' > cloud-pll-rhi120-c8-completed-stream/result.json
          fi
          stem="pll-rhi120-c8-completed-stream-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          cp cloud-pll-rhi120-c8-completed-stream/result.json "$stem.summary.json"
          python3 scripts/cloud_chunked_results.py --directory cloud-pll-rhi120-c8-completed-stream --stem "$stem"
          python3 - "$stem" <<'PYCODE'
          import json,subprocess,sys
          s=sys.argv[1];m=json.load(open(s+'.parts.json'))
          subprocess.run([sys.executable,'scripts/publish_cloud_results.py','--group','pll-rhi120-c8-completed-stream',s+'.summary.json',s+'.parts.json',*[x['name']for x in m['parts']]],check=True)
          PYCODE
