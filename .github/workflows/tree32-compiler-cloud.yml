name: tree32-compiler-cloud
on:
  push:
    branches: [codex/complete-open-work]
    paths: [.github/workflows/tree32-compiler-cloud.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tree32-compiler-${{ github.ref }}
  cancel-in-progress: false
jobs:
  paired-fine-step-compiler-study:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Compile and test unchanged data transport and numerical guards
        run: |
          python3 -m pip install numpy==2.3.3 pytest==8.4.2
          python3 -m py_compile scripts/cloud_tree32_compiler.py
          python3 scripts/cloud_tree32_compiler.py --controls-only
          python3 -m pytest -q sw/tests/test_cloud_tx_stream.py sw/tests/test_cloud_tx_original_bits.py
      - name: Install exact source build prerequisites
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends build-essential autoconf automake libtool bison flex libreadline-dev libncurses-dev libsndfile1 libsamplerate0 libxaw7 libxt6 libxft2 libfontconfig1
      - name: Build same patched upstream with strict O3 and no floating contraction
        run: |
          set -o pipefail
          mkdir -p cloud-tree32-compiler/build-runtime
          git init "$RUNNER_TEMP/tree32-compiler-source"
          git -C "$RUNNER_TEMP/tree32-compiler-source" remote add origin https://github.com/imr/ngspice.git
          git -C "$RUNNER_TEMP/tree32-compiler-source" fetch --depth 1 origin a80f6e3e95d51534905b1f23410a951802666656
          git -C "$RUNNER_TEMP/tree32-compiler-source" checkout --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/tree32-compiler-source" rev-parse HEAD)" = a80f6e3e95d51534905b1f23410a951802666656
          git -C "$RUNNER_TEMP/tree32-compiler-source" archive HEAD | gzip > cloud-tree32-compiler/upstream-source.tar.gz
          python3 - <<'PYCODE'
          import json,os,sys
          from pathlib import Path
          sys.path.insert(0,'scripts')
          from cloud_vbic_companion import patch
          result=patch(Path(os.environ['RUNNER_TEMP'])/'tree32-compiler-source/src/spicelib/devices/vbic/vbicload.c')
          Path('cloud-tree32-compiler/patch.json').write_text(json.dumps(result,indent=2)+'\n')
          PYCODE
          git -C "$RUNNER_TEMP/tree32-compiler-source" diff -- src/spicelib/devices/vbic/vbicload.c > cloud-tree32-compiler/companion.patch
          (cd "$RUNNER_TEMP/tree32-compiler-source" && ./autogen.sh) 2>&1 | tee cloud-tree32-compiler/autogen.log
          mkdir "$RUNNER_TEMP/tree32-compiler-build"
          (cd "$RUNNER_TEMP/tree32-compiler-build" && "$RUNNER_TEMP/tree32-compiler-source/configure" --without-x --with-readline=no --disable-openmp CFLAGS='-O3 -fno-fast-math -ffp-contract=off -march=x86-64-v3 -mtune=generic') 2>&1 | tee cloud-tree32-compiler/configure.log
          make -C "$RUNNER_TEMP/tree32-compiler-build" -j2 V=1 2>&1 | tee cloud-tree32-compiler/build.log
          cp "$RUNNER_TEMP/tree32-compiler-build/src/ngspice" cloud-tree32-compiler/build-runtime/optimized-ngspice
          cp "$RUNNER_TEMP/tree32-compiler-build/config.log" cloud-tree32-compiler/config.log
          gcc --version > cloud-tree32-compiler/compiler.txt
          lscpu > cloud-tree32-compiler/cpu.txt
          python3 - <<'PYCODE'
          import hashlib,json,sys
          from pathlib import Path
          sys.path.insert(0,'scripts')
          from cloud_tree32_compiler import FLAGS
          root=Path('cloud-tree32-compiler')
          report=dict(upstream='a80f6e3e95d51534905b1f23410a951802666656',flags=FLAGS,configure_options=['--without-x','--with-readline=no','--disable-openmp'],optimized_sha256=hashlib.sha256((root/'build-runtime/optimized-ngspice').read_bytes()).hexdigest())
          (root/'build.json').write_text(json.dumps(report,indent=2)+'\n')
          PYCODE
      - name: Compare complete original fine-step prefix and native CPU cost
        run: python3 scripts/cloud_tree32_compiler.py
      - name: Preserve runtimes, full vectors, build provenance and every failure
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p cloud-tree32-compiler
          if [ ! -f cloud-tree32-compiler/result.json ]; then
            printf '%s\n' '{"status":"FAIL_MISSING_REPORT","accepted":false}' > cloud-tree32-compiler/result.json
          fi
          stem="tree32-compiler-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          cp cloud-tree32-compiler/result.json "$stem.summary.json"
          python3 scripts/cloud_chunked_results.py --directory cloud-tree32-compiler --stem "$stem"
          python3 - "$stem" <<'PYCODE'
          import json,subprocess,sys
          stem=sys.argv[1];manifest=stem+'.parts.json';m=json.load(open(manifest))
          subprocess.run([sys.executable,'scripts/publish_cloud_results.py','--group','tree32-compiler',stem+'.summary.json',manifest,*[p['name'] for p in m['parts']]],check=True)
          PYCODE
