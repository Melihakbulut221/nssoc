name: pll845-loaded-preparation-cloud
on:
  push:
    branches: [codex/complete-open-work]
    paths: [.github/workflows/pll845-loaded-preparation-cloud.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pll845-loaded-preparation-${{ github.ref }}
  cancel-in-progress: false
jobs:
  native-planes:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install source-deck dependency
        run: python3 -m pip install numpy==2.3.3
      - name: Compile hosted whole845 stimulus preparation
        run: python3 -m py_compile scripts/cloud_pll845_loaded_preparation.py
      - name: Bind original1us stimuli to845 native devices and4 actual body contacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/cloud_pll845_loaded_preparation.py
      - name: Preserve physical results and failures
        if: always()
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          root=hw/soc/out/cloud-pll845-loaded-preparation
          mkdir -p "$root"
          if [ ! -f "$root/result.json" ]; then
            printf '%s\n' '{"status":"FAIL_MISSING_REPORT","accepted":false}' > "$root/result.json"
          fi
          stem="pll845-loaded-preparation-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          cp "$root/result.json" "$stem.summary.json"
          python3 scripts/cloud_chunked_results.py --directory "$root" --stem "$stem"
          python3 - "$stem" <<'PYCODE'
          import json,subprocess,sys
          stem=sys.argv[1];manifest=stem+'.parts.json';m=json.load(open(manifest))
          subprocess.run([sys.executable,'scripts/publish_cloud_results.py','--group','pll845-loaded-preparation',stem+'.summary.json',manifest,*[p['name']for p in m['parts']]],check=True)
          PYCODE
      - name: Retain evidence after publication failure
        if: always() && steps.publish.outcome == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pll845-loaded-preparation-${{ github.run_id }}
          path: hw/soc/out/cloud-pll845-loaded-preparation/
          retention-days: 30

