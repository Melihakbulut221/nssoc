name: pll845-compressed-continuation-cloud
on:
  push:
    branches: [codex/complete-open-work]
    paths: [.github/workflows/pll845-compressed-continuation-cloud.yml]
  workflow_dispatch:
    inputs:
      seconds:
        description: Native host seconds for one saved-process stage; original simulation remains full1us
        type: string
        default: '1800'
      source_checkpoint:
        description: Required exact saved whole845 process; no cold restart
        type: string
        required: true
permissions:
  contents: read
  actions: read
concurrency:
  group: pll845-compressed-acquisition-${{ github.ref }}
  cancel-in-progress: false
jobs:
  controls:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Full-terminal reader, frozen acquisition gates and native prefix controls
        run: |
          python3 -m pip install numpy==2.3.3
          python3 -m py_compile scripts/cloud_pll845_compressed_acquisition.py scripts/read_pll845_full_native_transient.py
          python3 scripts/check_pll845_compressed_acquisition_sources.py
          python3 scripts/cloud_pll845_compressed_acquisition.py --controls
          python3 scripts/cloud_pll845_compressed_disk.py
          python3 scripts/cloud_streamed_native_archive.py
          python3 scripts/publish_pll845_compressed_checkpoint.py --controls
  initial:
    if: github.event_name == 'workflow_dispatch'
    needs: controls
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    permissions:
      contents: write
      actions: read
    outputs:
      pending: ${{ steps.publish.outputs.pending }}
      checkpoint: ${{ steps.publish.outputs.checkpoint }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install cloud-only checkpoint dependencies
        run: |
          # Hosted disposable image SDKs are unrelated to this CAD job.
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          df -h "$GITHUB_WORKSPACE"
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends btrfs-progs btrfs-compsize build-essential pkg-config libprotobuf-dev libprotobuf-c-dev protobuf-c-compiler protobuf-compiler python3-protobuf uuid-dev libbsd-dev libcap-dev libnet1-dev libnl-3-dev libsndfile1 libsamplerate0 libreadline8t64 libxaw7 libxt6 libxft2 libfontconfig1
          git init "$RUNNER_TEMP/criu-src"
          git -C "$RUNNER_TEMP/criu-src" remote add origin https://github.com/checkpoint-restore/criu.git
          git -C "$RUNNER_TEMP/criu-src" fetch --depth 1 origin 9539417f3e3cfa4eb84c319cd71f4d52f1f08645
          git -C "$RUNNER_TEMP/criu-src" checkout --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/criu-src" rev-parse HEAD)" = 9539417f3e3cfa4eb84c319cd71f4d52f1f08645
          make -C "$RUNNER_TEMP/criu-src" -j2 criu PYTHON=/usr/bin/python3 2>&1 | tee "$RUNNER_TEMP/criu-build.log"
          sudo install -m 755 "$RUNNER_TEMP/criu-src/criu/criu" /usr/sbin/criu
          python3 - <<'PYCODE'
          import hashlib,json,os,pathlib,subprocess
          p=pathlib.Path('/usr/sbin/criu')
          d=dict(source_repository='https://github.com/checkpoint-restore/criu',source_tag='v4.2.1',source_commit='9539417f3e3cfa4eb84c319cd71f4d52f1f08645',binary_sha256=hashlib.sha256(p.read_bytes()).hexdigest(),version=subprocess.check_output([str(p),'--version'],text=True),libraries=subprocess.check_output(['ldd',str(p)],text=True))
          (pathlib.Path(os.environ['RUNNER_TEMP'])/'criu-build.json').write_text(json.dumps(d,indent=2)+'\n')
          PYCODE
          python3 -m pip install numpy==2.3.3
          python3 -m py_compile scripts/cloud_pll845_compressed_acquisition.py scripts/read_pll845_full_native_transient.py
          python3 scripts/check_pll845_compressed_acquisition_sources.py
      - name: Require the explicitly selected source run to be terminal
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_CHECKPOINT: ${{ inputs.source_checkpoint }}
        run: |
          python3 - <<'PYCODE'
          import json,os,subprocess
          spec=json.loads(os.environ['SOURCE_CHECKPOINT'])
          assert set(spec)=={'run','attempt','stage','summary_sha256','parts_sha256'}
          assert str(spec['run']).isdigit()and str(spec['attempt']).isdigit()
          r=json.loads(subprocess.check_output(['gh','api','repos/'+os.environ['GITHUB_REPOSITORY']+'/actions/runs/'+str(spec['run'])]))
          assert r['status']=='completed'and r['conclusion']=='success','Never fork a live or failed native continuation'
          assert r['run_attempt']==int(spec['attempt'])
          PYCODE
      - name: Run whole845+4-contact full1us with every physical terminal or resume exact native capsule
        id: native
        env:
          SOURCE_CHECKPOINT: ${{ inputs.source_checkpoint }}
          NATIVE_SECONDS: ${{ inputs.seconds || '1800' }}
        run: |
          test -n "$SOURCE_CHECKPOINT"
          python3 scripts/cloud_pll845_compressed_acquisition.py --stage initial --seconds "$NATIVE_SECONDS"
      - name: Publish every native byte and durable next-stage descriptor
        if: always()
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          NATIVE_OUTCOME: ${{ steps.native.outcome }}
          CAPSULE_STAGE: initial
        run: |
          mkdir -p cloud-pll845-native-acquisition
          if [ -d "$RUNNER_TEMP/nssoc-pll845-preallocated-storage/logs" ]; then cp -a "$RUNNER_TEMP/nssoc-pll845-preallocated-storage/logs" cloud-pll845-native-acquisition/storage-initialization-logs; fi
          if [ -f "$RUNNER_TEMP/nssoc-pll845-preallocated-storage/state.json" ]; then cp "$RUNNER_TEMP/nssoc-pll845-preallocated-storage/state.json" cloud-pll845-native-acquisition/storage-initialization-state.json; fi
          python3 scripts/publish_pll845_compressed_checkpoint.py
      - name: Retain evidence after publication failure
        if: always() && steps.publish.outcome == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pll845-native-acquisition-initial-${{ github.run_id }}
          retention-days: 30
          path: cloud-pll845-native-acquisition/
