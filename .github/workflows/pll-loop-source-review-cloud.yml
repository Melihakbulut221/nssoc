name: pll-loop-source-review-cloud
on:
  push:
    branches: [codex/complete-open-work]
    paths: [.github/workflows/pll-loop-source-review-cloud.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pll-loop-source-review-${{ github.ref }}
  cancel-in-progress: false
jobs:
  inspect-exact-physical-pll-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Inspect exact physical devices and failing original acquisition windows
        run: |
          python3 -m py_compile scripts/review_cloud_pll_loop.py
          python3 scripts/review_cloud_pll_loop.py
      - name: Preserve exact source and diagnosis or failure
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p cloud-pll-loop-source
          if [ ! -f cloud-pll-loop-source/result.json ]; then
            printf '%s\n' '{"status":"FAIL_MISSING_REPORT","accepted":false}' > cloud-pll-loop-source/result.json
          fi
          stem="pll-loop-source-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          cp cloud-pll-loop-source/result.json "$stem.summary.json"
          python3 scripts/cloud_chunked_results.py --directory cloud-pll-loop-source --stem "$stem"
          python3 - "$stem" <<'PYCODE'
          import json,subprocess,sys
          stem=sys.argv[1];manifest=stem+'.parts.json';m=json.load(open(manifest))
          subprocess.run([sys.executable,'scripts/publish_cloud_results.py','--group','pll-loop-source',stem+'.summary.json',manifest,*[p['name'] for p in m['parts']]],check=True)
          PYCODE
