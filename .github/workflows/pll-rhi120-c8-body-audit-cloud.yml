name: pll-rhi120-c8-body-audit-cloud
on:
  push:
    branches: [codex/complete-open-work]
    paths: [.github/workflows/pll-rhi120-c8-body-audit-cloud.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pll-rhi120-c8-body-audit-${{ github.ref }}
  cancel-in-progress: false
jobs:
  native-planes:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install pinned graph audit dependency
        run: python3 -m pip install networkx==3.4.2
      - name: Compile whole PLL native input and capture checks
        run: |
          python3 -m py_compile scripts/cloud_pll_rhi120_c8_body_audit.py scripts/audit_pll_rhi120_c8_body_mim_intrinsic.py scripts/check_pll845_whole_rc_capture.py
          python3 - <<'PYCODE'
          import json,hashlib,pathlib
          spec=json.loads(pathlib.Path('scripts/pll-rhi120-c8-body-audit-source-delta.json').read_text())
          for p,h in spec['unchanged_methods'].items():
              assert hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest()==h,p
          for m in spec['methods']:
              s=pathlib.Path(m['baseline_path']).read_text()
              assert hashlib.sha256(s.encode()).hexdigest()==m['baseline_sha256']
              for e in m['edits']:
                  assert s.count(e['before'])==e['count']
                  s=s.replace(e['before'],e['after'])
              actual=pathlib.Path(m['candidate_path']).read_text()
              assert s==actual and hashlib.sha256(actual.encode()).hexdigest()==m['candidate_sha256']
          PYCODE
      - name: Audit every native R edge value and C point with25 actual corruption controls
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/cloud_pll_rhi120_c8_body_audit.py
      - name: Preserve physical results and failures
        if: always()
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          root=hw/soc/out/cloud-pll-rhi120-c8-body-audit
          mkdir -p "$root"
          if [ ! -f "$root/result.json" ]; then
            printf '%s\n' '{"status":"FAIL_MISSING_REPORT","accepted":false}' > "$root/result.json"
          fi
          stem="pll-rhi120-c8-body-audit-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          cp "$root/result.json" "$stem.summary.json"
          python3 scripts/cloud_chunked_results.py --directory "$root" --stem "$stem"
          python3 - "$stem" <<'PYCODE'
          import json,subprocess,sys
          stem=sys.argv[1];manifest=stem+'.parts.json';m=json.load(open(manifest))
          subprocess.run([sys.executable,'scripts/publish_cloud_results.py','--group','pll-rhi120-c8-body-audit',stem+'.summary.json',manifest,*[p['name']for p in m['parts']]],check=True)
          PYCODE
      - name: Retain evidence after publication failure
        if: always() && steps.publish.outcome == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pll-rhi120-c8-body-audit-${{ github.run_id }}
          path: hw/soc/out/cloud-pll-rhi120-c8-body-audit/
          retention-days: 30


