# SPDX-License-Identifier: Apache-2.0
name: mainchip-portable-runtime-cloud
on:
  push:
    branches: [codex/complete-open-work]
    paths: [.github/workflows/mainchip-portable-runtime-cloud.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mainchip-portable-runtime
  cancel-in-progress: false
jobs:
  exact-native-runtime:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify controller bytes in cloud
        run: |
          echo '6647d0806401d315fad1b152cf742ee176b99d264fa774000c57553d854bc29c  scripts/cloud_mainchip_portable_runtime.py' | sha256sum --check
          python3 -m py_compile scripts/cloud_mainchip_portable_runtime.py
      - name: Restore pinned native runtime
        run: |
          # Disposable hosted-runner SDKs are not inputs to this pinned CAD runtime.
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/share/dotnet
          df -h /
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libfuse2
          curl --fail --location --retry 4 https://github.com/librelane/librelane/releases/download/3.0.5/librelane-devshell-x86_64.AppImage -o "$RUNNER_TEMP/librelane.AppImage"
          echo "d6a349ec65be11456e96c4981d35f63ca34d3c85daf79a51e1ccb907bb5d7466  $RUNNER_TEMP/librelane.AppImage" | sha256sum --check
          chmod +x "$RUNNER_TEMP/librelane.AppImage"
          echo "CLOUD_APPIMAGE=$RUNNER_TEMP/librelane.AppImage" >> "$GITHUB_ENV"
      - name: Capture real loaded OpenROAD ELF and prove isolated saved-DB equivalence
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/cloud_mainchip_portable_runtime.py
      - name: Publish preserved evidence
        if: always()
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          root=cloud-mainchip-portable-runtime
          mkdir -p "$root"
          if [ ! -f "$root/result.json" ]; then
            printf '%s\n' '{"status":"FAIL_MISSING_REPORT","accepted":false}' > "$root/result.json"
          fi
          stem="mainchip-portable-runtime-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          cp "$root/result.json" "$stem.summary.json"
          python3 scripts/cloud_chunked_results.py --directory "$root" --stem "$stem"
          python3 - "$stem" <<'PYCODE'
          import json,subprocess,sys
          stem=sys.argv[1];manifest=stem+'.parts.json';m=json.load(open(manifest))
          subprocess.run([sys.executable,'scripts/publish_cloud_results.py','--group','mainchip-portable-runtime',stem+'.summary.json',manifest,*[p['name']for p in m['parts']]],check=True)
          PYCODE
      - name: Retain evidence if publication fails
        if: always() && steps.publish.outcome == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mainchip-portable-runtime
          path: cloud-mainchip-portable-runtime/
          retention-days: 30
