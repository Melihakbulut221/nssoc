# c5r3k copy of pll-rhi120-c8-body-rc-cloud.yml: pinned to the c5r3k terminals and body access; publication falls back to retained chunked files.
name: pll-c5r3k-body-rc-cloud
on:
  push:
    branches: [analysis/pll-layout-c5r3k]
    paths: [.github/workflows/pll-c5r3k-body-rc-cloud.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pll-c5r3k-body-rc-${{ github.ref }}
  cancel-in-progress: false
jobs:
  native-planes:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Compile whole PLL native input and capture checks
        run: |
          python3 -m py_compile scripts/cloud_pll_c5r3k_body_rc.py scripts/pll_c5r3k_body_rc_inputs_native.py scripts/check_pll_c5r3k_body_rc_capture.py
          python3 - <<'PYCODE'
          import hashlib,json,pathlib
          spec=json.loads(pathlib.Path('scripts/pll-c5r3k-body-rc-source-delta.json').read_text())
          for m in spec['methods']:
              s=pathlib.Path(m['baseline_path']).read_text()
              assert hashlib.sha256(s.encode()).hexdigest()==m['baseline_sha256'],m['baseline_path']
              for e in m['edits']:
                  assert s.count(e['before'])==e['count'],(m['candidate_path'],e['before'][:80])
                  s=s.replace(e['before'],e['after'])
              actual=pathlib.Path(m['candidate_path']).read_text()
              assert s==actual and hashlib.sha256(actual.encode()).hexdigest()==m['candidate_sha256'],m['candidate_path']
          PYCODE
      - name: Restore pinned native CAD runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libfuse2 tcl8.6 tk8.6
          curl --fail --location --retry 4 https://github.com/librelane/librelane/releases/download/3.0.5/librelane-devshell-x86_64.AppImage -o "$RUNNER_TEMP/librelane.AppImage"
          echo "d6a349ec65be11456e96c4981d35f63ca34d3c85daf79a51e1ccb907bb5d7466  $RUNNER_TEMP/librelane.AppImage" | sha256sum --check
          chmod +x "$RUNNER_TEMP/librelane.AppImage"
          echo "CLOUD_APPIMAGE=$RUNNER_TEMP/librelane.AppImage" >> "$GITHUB_ENV"
      - name: Capture236 actual PLL conductors at1612 physical points including2 proven body contacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/cloud_pll_c5r3k_body_rc.py
      - name: Chunk evidence and publish it as a release when the token allows
        if: always()
        id: publish
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          root=hw/soc/out/cloud-pll-c5r3k-body-rc
          mkdir -p "$root" release
          if [ ! -f "$root/result.json" ]; then
            printf '%s\n' '{"status":"FAIL_MISSING_REPORT","accepted":false}' > "$root/result.json"
          fi
          stem="pll-c5r3k-body-rc-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          cp "$root/result.json" "release/$stem.summary.json"
          (cd release && python3 ../scripts/cloud_chunked_results.py --directory "../$root" --stem "$stem")
          cd release && python3 - "$stem" <<'PYCODE'
          import json,subprocess,sys
          stem=sys.argv[1];manifest=stem+'.parts.json';m=json.load(open(manifest))
          subprocess.run([sys.executable,'../scripts/publish_cloud_results.py','--group','pll-c5r3k-body-rc',stem+'.summary.json',manifest,*[p['name']for p in m['parts']]],check=True)
          PYCODE
      - name: Retain the chunked release files
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pll-c5r3k-body-rc-release-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 30
          path: release/
      - name: Retain the raw output directory
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pll-c5r3k-body-rc-out-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 30
          path: hw/soc/out/cloud-pll-c5r3k-body-rc/
