name: Qualified multilayer antenna physical trial
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Source controls or the exact qualified physical trial
        type: choice
        required: true
        default: controls
        options: [controls, trial]
permissions:
  contents: read
  actions: read
concurrency:
  group: net459-diode-prune-${{ github.ref }}
  cancel-in-progress: false
env:
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  source-controls:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Bind exact source without acquiring native payloads
        run: |
          python3 -B - <<'PY'
          import hashlib,json,os,subprocess
          from pathlib import Path
          e=os.environ
          assert e['GITHUB_REPOSITORY']=='Melihakbulut221/nssoc'
          assert e['GITHUB_EVENT_NAME']=='workflow_dispatch' and e['GITHUB_RUN_ATTEMPT']=='1'
          assert e['GITHUB_REF']=='refs/heads/codex/mainchip-net459-diode-prune'
          assert subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()==e['GITHUB_SHA']
          new_manifest=Path("scripts/mainchip-multilayer-antenna-trial-pins.json").read_bytes()
          assert hashlib.sha256(new_manifest).hexdigest()=='6f6951939239cf7d6220db46c0ed11acbd68050671a905608ec8c785e25d6cd9'
          current=json.loads(new_manifest)
          assert current['native_execution_enabled'] is True and len(current['files'])==194
          for name,pin in current['files'].items():
              p=Path(name);assert p.is_file() and not p.is_symlink()
              raw=p.read_bytes();assert len(raw)==pin['bytes'] and hashlib.sha256(raw).hexdigest()==pin['sha256']
          for name in ['scripts/mainchip_multilayer_antenna_trial.py', 'scripts/check_mainchip_multilayer_antenna_trial.py', 'scripts/mainchip_multilayer_antenna_trial_native.py', 'scripts/mainchip_multilayer_antenna_trial_inner.py', 'scripts/cloud_mainchip_multilayer_antenna_trial.py']:compile(Path(name).read_text(),name,'exec')
          manifest=Path("scripts/mainchip-net459-diode-prune-pins.json").read_bytes()
          assert hashlib.sha256(manifest).hexdigest()=="56e1531fb2b5c6c2fca72e3c92d7f43824cb6a83795c18f5095040ecb9eb2610"
          pins={k:v["sha256"]for k,v in json.loads(manifest)["files"].items()}
          for name,digest in pins.items():
              p=Path(name);assert p.is_file() and not p.is_symlink()
              assert hashlib.sha256(p.read_bytes()).hexdigest()==digest
          out=Path('net459-diode-prune-controls');out.mkdir(exist_ok=True)
          (out/'context.json').write_text(json.dumps(dict(source=e['GITHUB_SHA'],run=int(e['GITHUB_RUN_ID']),attempt=1,source_controls_only=True,native_acquisition=False,physical_acceptance=False,timing_accepted=False,full_phy_accepted=False,sha256=pins),sort_keys=True,indent=2)+'\n')
          PY
      - name: Exercise archive refusal and failure preservation controls
        run: python3 -B scripts/check_mainchip_net459_diode_prune.py --output net459-diode-prune-controls/controls.json > net459-diode-prune-controls/controls.stdout 2> net459-diode-prune-controls/controls.stderr
      - name: Require actual complete candidate control results
        run: |
          python3 -B - <<'PY'
          import json,os
          from pathlib import Path
          r=json.loads(Path('net459-diode-prune-controls/controls.json').read_bytes())
          assert r['status']=='PASS_NET459_DIODE_PRUNE_SOURCE_CONTROLS'
          assert (r['positive_count'],r['refusal_count'])==(8,25)
          assert r['current_context']['source']==os.environ['GITHUB_SHA']
          assert r['current_context']['run_id']==int(os.environ['GITHUB_RUN_ID'])
          assert r['authentic_plan']['shape_count']==85 and r['authentic_plan']['paths']==43
          assert (r['graph_controls']['positive_count'],r['graph_controls']['refusal_count'])==(11,10)
          inherited=r['inherited_controls']
          assert (inherited['positive_count'],inherited['refusal_count'],inherited['lifecycle_count'])==(3,17,13)
          assert all(r[k] is False for k in ('native_executed','physical_acceptance','timing_accepted','full_phy_accepted'))
          PY
      - name: Bind and exercise full antenna readback source controls
        run: |
          python3 -B - <<'PY'
          import hashlib
          from pathlib import Path
          raw=Path('scripts/mainchip-full-antenna-readback-pins.json').read_bytes()
          assert hashlib.sha256(raw).hexdigest()=='70813988537889e2800e4da79fb45c221fc3067bb8270873c3eb654d1c08c0d1'
          PY
          python3 -B scripts/check_mainchip_full_antenna_readback.py --output net459-diode-prune-controls/antenna-controls.json > net459-diode-prune-controls/antenna-controls.stdout 2> net459-diode-prune-controls/antenna-controls.stderr
          python3 -B - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('net459-diode-prune-controls/antenna-controls.json').read_bytes())
          assert r['status']=='PASS_FULL_ANTENNA_READBACK_SOURCE_CONTROLS'
          assert (r['positive_count'],r['refusal_count'])==(17,42)
          assert r['native_executed'] is False
          PY
      - name: Bind and exercise complete antenna native-ownership source controls
        run: |
          python3 -B - <<'PY'
          import hashlib
          from pathlib import Path
          assert hashlib.sha256(Path('scripts/mainchip-antenna-ownership-pins.json').read_bytes()).hexdigest()=='8110fae03704d06e1fe453ab951b0b98fb013009da1457d8d79e44d340f8c771'
          PY
          python3 -B scripts/check_mainchip_antenna_ownership.py --output net459-diode-prune-controls/ownership-controls.json > net459-diode-prune-controls/ownership-controls.stdout 2> net459-diode-prune-controls/ownership-controls.stderr
          python3 -B - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('net459-diode-prune-controls/ownership-controls.json').read_bytes())
          assert r['status']=='PASS_ANTENNA_OWNERSHIP_SOURCE_CONTROLS'
          assert (r['positive_count'],r['refusal_count'])==(4,23)
          assert r['native_executed'] is False
          PY
      - name: Bind and exercise one-diode physical trial source controls
        run: |
          python3 -B - <<'PY'
          import hashlib
          from pathlib import Path
          assert hashlib.sha256(Path('scripts/mainchip-single-antenna-trial-pins.json').read_bytes()).hexdigest()=='c4d65b0cb4c47fcaffd6ea8bb76847dac0f74e5dd4b0d6836cc99ba2af706adc'
          PY
          python3 -B scripts/check_mainchip_single_antenna_trial.py --output net459-diode-prune-controls/trial-controls.json > net459-diode-prune-controls/trial-controls.stdout 2> net459-diode-prune-controls/trial-controls.stderr
          python3 -B - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('net459-diode-prune-controls/trial-controls.json').read_bytes())
          assert r['status']=='PASS_SINGLE_ANTENNA_TRIAL_SOURCE_CONTROLS'
          assert (r['positive_count'],r['refusal_count'])==(11,33)
          assert r['lifecycle_count']==4
          assert r['native_executed'] is False
          PY
      - name: Bind and exercise read-only escape-window source controls
        run: |
          python3 -B - <<'PY'
          import hashlib
          from pathlib import Path
          assert hashlib.sha256(Path('scripts/mainchip-antenna-escape-window-pins.json').read_bytes()).hexdigest()=='99df3bca630f20ee059d1d3f1ad17ab42b29b0943fb2fd9e2ec931d500fcc2eb'
          PY
          python3 -B scripts/check_mainchip_antenna_escape_window.py --output net459-diode-prune-controls/window-controls.json > net459-diode-prune-controls/window-controls.stdout 2> net459-diode-prune-controls/window-controls.stderr
          python3 -B - <<'PY'
          import json,os
          from pathlib import Path
          r=json.loads(Path('net459-diode-prune-controls/window-controls.json').read_bytes())
          assert r['status']=='PASS_ANTENNA_ESCAPE_WINDOW_SOURCE_CONTROLS'
          assert (r['positive_count'],r['refusal_count'])==(7,20)
          assert r['context']['source']==os.environ['GITHUB_SHA'] and r['context']['run_id']==int(os.environ['GITHUB_RUN_ID'])
          assert r['native_executed'] is False
          PY
      - name: Exercise existing-diode multilayer contract controls
        run: |
          python3 -B scripts/check_mainchip_multilayer_antenna_trial.py --output net459-diode-prune-controls/multilayer-controls.json > net459-diode-prune-controls/multilayer-controls.stdout 2> net459-diode-prune-controls/multilayer-controls.stderr
          python3 -B - <<'PY'
          import ast,json,os
          from pathlib import Path
          r=json.loads(Path('net459-diode-prune-controls/multilayer-controls.json').read_bytes())
          assert r['status']=='PASS_MULTILAYER_ANTENNA_TRIAL_SOURCE_CONTROLS'
          assert (r['positive_count'],r['refusal_count'],r['lifecycle_count'])==(13,68,4)
          o=r['def_import_order_controls'];assert o['status']=='PASS_STRICT_TARGET_ITERM_ORDER_SOURCE_CONTROLS'
          assert (o['positive_count'],o['refusal_count'])==(3,22) and o['full_native_DEF_replayed'] is False
          assert r['current_context']['source']==os.environ['GITHUB_SHA']
          assert r['current_context']['run_id']==int(os.environ['GITHUB_RUN_ID'])
          assert all(r[k] is False for k in ('native_executed','physical_acceptance','timing_accepted','full_phy_accepted'))
          def functions(path):
              raw=Path(path).read_text()
              return {n.name:ast.get_source_segment(raw,n)for n in ast.parse(raw).body if isinstance(n,ast.FunctionDef)}
          a=functions('scripts/mainchip_single_antenna_trial_inner.py');b=functions('scripts/mainchip_multilayer_antenna_trial_inner.py')
          assert a['run'].replace('"trial-','"multilayer-')==b['run']
          a=functions('scripts/cloud_mainchip_antenna_escape_window.py');b=functions('scripts/cloud_mainchip_multilayer_antenna_trial.py')
          for name in ('context','source_gate','reservation','acquire_current','derived_path','preserve_outputs','retained_workspace'):
              assert a[name].replace('antenna-escape-window','multilayer-antenna-trial')==b[name],name
          assert a['publish_capsule'].replace('antenna-escape-window','multilayer-antenna-trial').replace('"window-"','"multilayer-"')==b['publish_capsule']
          import sys
          sys.path.insert(0,'scripts')
          import mainchip_multilayer_antenna_trial as p
          import mainchip_antenna_escape_window as original
          import cloud_mainchip_multilayer_antenna_trial as host
          assert p.producer_binding is original.producer_binding
          assert (p.MEMBER,p.INPUT,p.RUN,p.SOURCE,p.RELEASE,p.TAG,p.ASSETS)==(original.MEMBER,original.INPUT,original.RUN,original.SOURCE,original.RELEASE,original.TAG,original.ASSETS)
          host.source_gate()
          print('Unchanged lifecycle, complete acquisition and complete permanent publication bodies verified.')
          PY
      - name: Always emit full source control records
        if: always()
        run: |
          python3 -B - <<'PY'
          import base64,hashlib,json
          from pathlib import Path
          for name in ('context.json','controls.json','controls.stdout','controls.stderr','antenna-controls.json','antenna-controls.stdout','antenna-controls.stderr','ownership-controls.json','ownership-controls.stdout','ownership-controls.stderr','trial-controls.json','trial-controls.stdout','trial-controls.stderr','window-controls.json','window-controls.stdout','window-controls.stderr','multilayer-controls.json','multilayer-controls.stdout','multilayer-controls.stderr'):
              p=Path('net459-diode-prune-controls')/name;assert not p.is_symlink()
              raw=p.read_bytes() if p.is_file() else b''
              chunks=[raw[i:i+6000]for i in range(0,len(raw),6000)]
              print('NET459_DIODE_PRUNE_CONTROL_INDEX '+json.dumps(dict(path=name,present=p.is_file(),bytes=len(raw),sha256=hashlib.sha256(raw).hexdigest(),chunks=len(chunks)),sort_keys=True))
              for i,b in enumerate(chunks):
                  print('NET459_DIODE_PRUNE_CONTROL_CHUNK '+json.dumps(dict(path=name,index=i,base64=base64.b64encode(b).decode()),sort_keys=True))
          PY
      - name: Preserve complete control records
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: net459-diode-prune-controls-${{ github.run_id }}-${{ github.run_attempt }}
          path: net459-diode-prune-controls
          if-no-files-found: error
          retention-days: 90
  preserve-job-log:
    needs: source-controls
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Preserve full actual source job log and metadata
        run: |
          python3 -B - <<'PY'
          import hashlib,json,os,subprocess
          from pathlib import Path
          root=Path('job-logs');root.mkdir()
          e=os.environ
          assert e['GITHUB_REPOSITORY']=='Melihakbulut221/nssoc' and e['GITHUB_RUN_ATTEMPT']=='1'
          prefix='repos/'+e['GITHUB_REPOSITORY']+'/'
          def read(path,name):
              b=subprocess.check_output(['gh','api',prefix+path]);(root/name).write_bytes(b);return json.loads(b)
          run=read('actions/runs/'+e['GITHUB_RUN_ID'],'run.json')
          assert run['head_sha']==e['GITHUB_SHA'] and run['run_attempt']==1
          jobs=read('actions/runs/'+e['GITHUB_RUN_ID']+'/attempts/1/jobs?per_page=100','jobs.json')
          selected=[j for j in jobs['jobs'] if j['name']=='source-controls'];assert len(selected)==1
          listed=selected[0]
          j=read('actions/jobs/'+str(listed['id']),'job.json')
          assert j['id']==listed['id'] and j['name']=='source-controls'
          assert j['head_sha']==e['GITHUB_SHA'] and j['run_id']==int(e['GITHUB_RUN_ID'])
          b=subprocess.check_output(['gh','api','--allow-escape-sequences',prefix+'actions/jobs/'+str(j['id'])+'/logs'])
          assert b;(root/'job.log').write_bytes(b)
          receipt=dict(source=e['GITHUB_SHA'],run_id=int(e['GITHUB_RUN_ID']),attempt=1,
            job_id=j['id'],job_conclusion=j['conclusion'],api_status=j['status'],api_metadata_claims_terminal=j['status']=='completed',execution_dependency_finished=True,full_raw_job_log=True,
            log_bytes=len(b),log_sha256=hashlib.sha256(b).hexdigest(),native_acquisition=False)
          (root/'receipt.json').write_text(json.dumps(receipt,sort_keys=True,indent=2)+'\n')
          print(json.dumps(receipt,sort_keys=True))
          PY
      - name: Preserve complete actual logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: net459-diode-prune-source-job-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: job-logs
          if-no-files-found: error
          retention-days: 90


  trial:
    needs: [source-controls, preserve-job-log]
    if: ${{ inputs.mode == 'trial' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Recheck exact selected source before acquisition
        run: |
          python3 -B - <<'PY'
          import hashlib,json,os,subprocess
          from pathlib import Path
          e=os.environ
          assert e['GITHUB_REPOSITORY']=='Melihakbulut221/nssoc'
          assert e['GITHUB_EVENT_NAME']=='workflow_dispatch' and e['GITHUB_RUN_ATTEMPT']=='1'
          assert e['GITHUB_REF']=='refs/heads/codex/mainchip-net459-diode-prune'
          assert subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()==e['GITHUB_SHA']
          manifest=Path("scripts/mainchip-multilayer-antenna-trial-pins.json").read_bytes()
          assert hashlib.sha256(manifest).hexdigest()=="6f6951939239cf7d6220db46c0ed11acbd68050671a905608ec8c785e25d6cd9"
          pins={k:v["sha256"]for k,v in json.loads(manifest)["files"].items()}
          for name,digest in pins.items():
              p=Path(name);assert p.is_file() and not p.is_symlink()
              assert hashlib.sha256(p.read_bytes()).hexdigest()==digest
          out=Path('multilayer-antenna-trial-controls');out.mkdir(exist_ok=True)
          (out/'context.json').write_text(json.dumps(dict(source=e['GITHUB_SHA'],run=int(e['GITHUB_RUN_ID']),attempt=1,source_controls_only=True,native_acquisition=False,physical_acceptance=False,timing_accepted=False,full_phy_accepted=False,sha256=pins),sort_keys=True,indent=2)+'\n')
          PY
      - name: Require full same-source successful controls before native acquisition
        run: |
          python3 -B - <<'PY'
          import base64,hashlib,json,os,subprocess
          from pathlib import Path
          e=os.environ;root=Path('multilayer-same-source-controls');root.mkdir()
          prefix='repos/Melihakbulut221/nssoc/'
          def read(path,name):
              raw=subprocess.check_output(['gh','api',prefix+path]);(root/name).write_bytes(raw);return json.loads(raw)
          jobs=read('actions/runs/'+e['GITHUB_RUN_ID']+'/attempts/1/jobs?per_page=100','jobs.json')
          found=[j for j in jobs['jobs']if j['name']=='source-controls'];assert len(found)==1
          j=read('actions/jobs/'+str(found[0]['id']),'job.json')
          assert j['status']=='completed'and j['conclusion']=='success'and j['head_sha']==e['GITHUB_SHA']and j['run_id']==int(e['GITHUB_RUN_ID'])
          raw=subprocess.check_output(['gh','api','--allow-escape-sequences',prefix+'actions/jobs/'+str(j['id'])+'/logs'])
          assert raw;(root/'source-controls.log').write_bytes(raw)
          idx={};chunks={}
          for line in raw.decode().splitlines():
              for marker,is_index in (('NET459_DIODE_PRUNE_CONTROL_INDEX ',True),('NET459_DIODE_PRUNE_CONTROL_CHUNK ',False)):
                  if marker not in line:continue
                  text=line.split(marker,1)[1]
                  if not text.startswith('{'):continue
                  d=json.loads(text);name=d['path']
                  assert '/'not in name and '\\'not in name and name not in ('.','..')
                  if is_index:assert name not in idx;idx[name]=d
                  else:
                      parts=chunks.setdefault(name,{})
                      assert type(d['index'])is int and d['index']not in parts;parts[d['index']]=d
          expected=['context.json']
          for name in ('controls','antenna-controls','ownership-controls','trial-controls','window-controls','multilayer-controls'):
              expected += [name+'.json',name+'.stdout',name+'.stderr']
          assert len(expected)==19 and set(idx)==set(expected)
          decoded={}
          for name,d in idx.items():
              assert d['present']is True
              parts=chunks.get(name,{});assert set(parts)==set(range(d['chunks']))
              data=b''.join(base64.b64decode(parts[i]['base64'],validate=True)for i in range(d['chunks']))
              assert len(data)==d['bytes']and hashlib.sha256(data).hexdigest()==d['sha256']
              (root/name).write_bytes(data)
              if name.endswith('.json'):decoded[name]=json.loads(data)
          context=decoded['context.json']
          assert context['source']==e['GITHUB_SHA']and context['run']==int(e['GITHUB_RUN_ID'])and context['attempt']==1
          for name,status,counts in (
            ('controls','PASS_NET459_DIODE_PRUNE_SOURCE_CONTROLS',(8,25)),
            ('antenna-controls','PASS_FULL_ANTENNA_READBACK_SOURCE_CONTROLS',(17,42)),
            ('ownership-controls','PASS_ANTENNA_OWNERSHIP_SOURCE_CONTROLS',(4,23)),
            ('trial-controls','PASS_SINGLE_ANTENNA_TRIAL_SOURCE_CONTROLS',(11,33)),
            ('window-controls','PASS_ANTENNA_ESCAPE_WINDOW_SOURCE_CONTROLS',(7,20)),
            ('multilayer-controls','PASS_MULTILAYER_ANTENNA_TRIAL_SOURCE_CONTROLS',(13,68))):
              r=decoded[name+'.json'];assert r['status']==status and (r['positive_count'],r['refusal_count'])==counts
              assert r['native_executed']is False
          r=decoded['multilayer-controls.json']
          o=r['def_import_order_controls']
          assert o['status']=='PASS_STRICT_TARGET_ITERM_ORDER_SOURCE_CONTROLS' and (o['positive_count'],o['refusal_count'])==(3,22)
          assert o['full_native_DEF_replayed'] is False
          assert r['lifecycle_count']==4 and r['current_context']['source']==e['GITHUB_SHA']and r['current_context']['run_id']==int(e['GITHUB_RUN_ID'])
          (root/'index.json').write_text(json.dumps(idx,sort_keys=True,indent=2)+'\n')
          (root/'admission.json').write_text(json.dumps(dict(source=e['GITHUB_SHA'],run=int(e['GITHUB_RUN_ID']),attempt=1,full_source_records=19,source_job=j['id'],full_log_sha256=hashlib.sha256(raw).hexdigest(),native_acquisition=False),sort_keys=True,indent=2)+'\n')
          PY
      - name: Reclaim only disposable hosted SDK storage
        run: |
          test "$GITHUB_ACTIONS" = true
          test "$RUNNER_OS" = Linux
          sudo rm -rf /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h .
      - name: Require independently created exact-source release
        run: |
          python3 -B - <<'PY'
          import json,os,subprocess,time
          from pathlib import Path
          e=os.environ;tag='cloud-results-'+e['GITHUB_RUN_ID']+'-1-mainchip-multilayer-antenna-trial'
          prefix='repos/Melihakbulut221/nssoc/'
          for attempt in range(120):
              p=subprocess.run(['gh','api',prefix+'releases/tags/'+tag],capture_output=True,text=True)
              if p.returncode==0:
                  d=json.loads(p.stdout);break
              assert 'HTTP 404' in p.stderr,p.stderr
              time.sleep(2)
          else:raise RuntimeError('Exact-source release reservation was not created; no archive acquisition')
          r=json.loads(subprocess.check_output(['gh','api',prefix+'git/ref/tags/'+tag]))
          assert d['tag_name']==tag and d['target_commitish']==e['GITHUB_SHA']
          assert d['draft'] is False and d['prerelease'] is True and d['assets']==[]
          assert r['object']['type']=='commit' and r['object']['sha']==e['GITHUB_SHA']
          receipt=dict(tag=tag,tested_source=e['GITHUB_SHA'],release_id=d['id'],existing_assets=[],target_verified=True,assets_overwritten=False,externally_reserved=True,creation_attempted=False,read_attempts=attempt+1)
          Path('release-reservation.json').write_text(json.dumps(receipt,sort_keys=True,indent=2)+'\n')
          PY
      - name: Route the existing diode across three metals; measure complete chip DRC and antennas
        run: python3 -B scripts/cloud_mainchip_multilayer_antenna_trial.py --output multilayer-antenna-trial-evidence --reservation release-reservation.json > multilayer-antenna-trial.stdout 2> multilayer-antenna-trial.stderr
      - name: Always emit full bounded evidence and failure output
        if: always()
        run: |
          python3 -B - <<'PY'
          import sys
          from pathlib import Path
          for name in ('multilayer-antenna-trial.stdout','multilayer-antenna-trial.stderr'):
              p=Path(name)
              if p.is_file():
                  sys.stdout.buffer.write(p.read_bytes());sys.stdout.buffer.write(b'\n')
          PY
      - name: Preserve complete derived evidence and retained output fallback
        id: preserved_artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: multilayer-antenna-trial-${{ github.run_id }}-${{ github.run_attempt }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
          path: |
            multilayer-antenna-trial-evidence
            release-reservation.json
            multilayer-antenna-trial.stdout
            multilayer-antenna-trial.stderr
            multilayer-antenna-trial-controls
            multilayer-same-source-controls
            ${{ runner.temp }}/mainchip-multilayer-antenna-trial-${{ github.run_id }}-1/owner.json
            ${{ runner.temp }}/mainchip-multilayer-antenna-trial-${{ github.run_id }}-1/candidate-outputs.json
            ${{ runner.temp }}/mainchip-multilayer-antenna-trial-${{ github.run_id }}-1/candidate-parts.json
            ${{ runner.temp }}/mainchip-multilayer-antenna-trial-${{ github.run_id }}-1/candidate-native.tar.gz.part*
            ${{ runner.temp }}/mainchip-multilayer-antenna-trial-${{ github.run_id }}-1/out/multilayer-*
            ${{ runner.temp }}/mainchip-multilayer-antenna-trial-${{ github.run_id }}-1/out/multilayer-antenna-trial
            ${{ runner.temp }}/mainchip-multilayer-antenna-trial-${{ github.run_id }}-1/out/work/multilayer-antenna-trial
      - name: Clean exact owned workspace only after complete artifact preservation
        if: ${{ always() && steps.preserved_artifact.outcome == 'success' }}
        run: |
          python3 -B - <<'PY'
          import hashlib,json,os,sys
          from pathlib import Path
          raw=Path('scripts/mainchip-multilayer-antenna-trial-pins.json').read_bytes()
          assert hashlib.sha256(raw).hexdigest()=='6f6951939239cf7d6220db46c0ed11acbd68050671a905608ec8c785e25d6cd9'
          for name,pin in json.loads(raw)['files'].items():
              p=Path(name);assert p.is_file() and not p.is_symlink()
              b=p.read_bytes();assert len(b)==pin['bytes'] and hashlib.sha256(b).hexdigest()==pin['sha256']
          sys.path.insert(0,'scripts')
          import cloud_mainchip_multilayer_antenna_trial as w
          print(json.dumps(w.cleanup_preserved_workspace(w.context(os.environ),Path("multilayer-antenna-trial-evidence")),sort_keys=True))
          PY


  preserve-antenna-job-logs:
    needs: [source-controls, preserve-job-log, trial]
    if: ${{ always() && inputs.mode == 'trial' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Preserve all complete terminal execution logs and metadata
        run: |
          python3 -B - <<'PY'
          import hashlib,json,os,subprocess
          from pathlib import Path
          e=os.environ;out=Path('antenna-job-logs');out.mkdir()
          prefix='repos/Melihakbulut221/nssoc/'
          def get(path,name):
              b=subprocess.check_output(['gh','api',prefix+path]);(out/name).write_bytes(b);return json.loads(b)
          r=get('actions/runs/'+e['GITHUB_RUN_ID'],'run.json')
          assert r['head_sha']==e['GITHUB_SHA'] and r['run_attempt']==1
          jobs=get('actions/runs/'+e['GITHUB_RUN_ID']+'/attempts/1/jobs?per_page=100','jobs.json')
          rows={}
          for j in jobs['jobs']:
              if j['name'] not in ('source-controls','preserve-job-log','trial'):continue
              j=get('actions/jobs/'+str(j['id']),str(j['id'])+'.json')
              assert j['head_sha']==e['GITHUB_SHA'] and j['run_id']==int(e['GITHUB_RUN_ID'])
              if j['conclusion']=='skipped':continue
              raw=subprocess.check_output(['gh','api','--allow-escape-sequences',prefix+'actions/jobs/'+str(j['id'])+'/logs'])
              assert raw;(out/(str(j['id'])+'.log')).write_bytes(raw)
              rows[j['name']]=dict(id=j['id'],conclusion=j['conclusion'],api_status=j['status'],api_metadata_claims_terminal=j['status']=='completed',execution_dependency_finished=True,bytes=len(raw),sha256=hashlib.sha256(raw).hexdigest())
          (out/'receipt.json').write_text(json.dumps(dict(source=e['GITHUB_SHA'],run=int(e['GITHUB_RUN_ID']),attempt=1,complete_raw_logs=rows),sort_keys=True,indent=2)+'\n')
          PY
      - name: Preserve complete actual logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: full-antenna-job-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: antenna-job-logs
          if-no-files-found: error
          retention-days: 90
