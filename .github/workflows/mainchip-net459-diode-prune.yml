            ${{ runner.temp }}/mainchip-single-antenna-trial-${{ github.run_id }}-1/candidate-outputs.json
            ${{ runner.temp }}/mainchip-single-antenna-trial-${{ github.run_id }}-1/candidate-parts.json
            ${{ runner.temp }}/mainchip-single-antenna-trial-${{ github.run_id }}-1/candidate-native.tar.gz.part*
            ${{ runner.temp }}/mainchip-single-antenna-trial-${{ github.run_id }}-1/out/trial-*
            ${{ runner.temp }}/mainchip-single-antenna-trial-${{ github.run_id }}-1/out/single-antenna-trial
            ${{ runner.temp }}/mainchip-single-antenna-trial-${{ github.run_id }}-1/out/work/single-antenna-trial
      - name: Clean exact owned workspace only after complete artifact preservation
        if: ${{ always() && steps.preserved_artifact.outcome == 'success' }}
        run: |
          python3 -B - <<'PY'
          import hashlib,json,os,sys
          from pathlib import Path
          raw=Path('scripts/mainchip-single-antenna-trial-pins.json').read_bytes()
          assert hashlib.sha256(raw).hexdigest()=='c4d65b0cb4c47fcaffd6ea8bb76847dac0f74e5dd4b0d6836cc99ba2af706adc'
          for name,pin in json.loads(raw)['files'].items():
              p=Path(name);assert p.is_file() and not p.is_symlink()
              b=p.read_bytes();assert len(b)==pin['bytes'] and hashlib.sha256(b).hexdigest()==pin['sha256']
          sys.path.insert(0,'scripts')
          import cloud_mainchip_single_antenna_trial as w
          print(json.dumps(w.cleanup_preserved_workspace(w.context(os.environ),Path("single-antenna-trial-evidence")),sort_keys=True))
          PY

