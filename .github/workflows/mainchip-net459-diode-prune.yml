      - name: Remove exact owned input copies after permanent output and artifact preservation
        if: ${{ always() && steps.preserved.outcome == 'success' }}
        run: |
          python3 -B - <<'PY'
          import json,os,shutil
          from pathlib import Path
          e=os.environ;p=Path('full-antenna-evidence/publication.json')
          if p.is_file():
              r=json.loads(p.read_bytes());ctx=r['context']
              assert r['status']=='COMPLETE_PERMANENT_DERIVED_PUBLICATION'
              assert ctx['source']==e['GITHUB_SHA'] and ctx['run']==int(e['GITHUB_RUN_ID']) and ctx['attempt']==1
              w=Path(e['RUNNER_TEMP'])/('mainchip-full-antenna-readback-'+e['GITHUB_RUN_ID']+'-1')
              assert w.is_dir() and not w.is_symlink()
              assert json.loads((w/'owner.json').read_bytes())==ctx
              shutil.rmtree(w);assert not w.exists()
              print('Owned input copies removed; original native capsule and complete derived evidence remain permanent.')
          PY

  preserve-antenna-job-logs:
    needs: [source-controls, preserve-job-log, antenna-readback, ownership, trial, window]
    if: ${{ always() && (inputs.mode == 'antenna' || inputs.mode == 'ownership' || inputs.mode == 'trial' || inputs.mode == 'window') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Preserve all complete terminal execution logs and metadata
        run: |
          python3 -B - <<'PY'
          import hashlib,json,os,subprocess
          from pathlib import Path
          e=os.environ;out=Path('antenna-job-logs');out.mkdir()
          prefix='repos/Melihakbulut221/nssoc/'
          def get(path,name):
              b=subprocess.check_output(['gh','api',prefix+path]);(out/name).write_bytes(b);return json.loads(b)
          r=get('actions/runs/'+e['GITHUB_RUN_ID'],'run.json')
          assert r['head_sha']==e['GITHUB_SHA'] and r['run_attempt']==1
          jobs=get('actions/runs/'+e['GITHUB_RUN_ID']+'/attempts/1/jobs?per_page=100','jobs.json')
          rows={}
          for j in jobs['jobs']:
              if j['name'] not in ('source-controls','preserve-job-log','antenna-readback','ownership','trial','window'):continue
              assert j['status']=='completed' and j['head_sha']==e['GITHUB_SHA']
              if j['conclusion']=='skipped':continue
              raw=subprocess.check_output(['gh','api','--allow-escape-sequences',prefix+'actions/jobs/'+str(j['id'])+'/logs'])
              assert raw;(out/(str(j['id'])+'.log')).write_bytes(raw)
              rows[j['name']]=dict(id=j['id'],conclusion=j['conclusion'],bytes=len(raw),sha256=hashlib.sha256(raw).hexdigest())
          (out/'receipt.json').write_text(json.dumps(dict(source=e['GITHUB_SHA'],run=int(e['GITHUB_RUN_ID']),attempt=1,complete_raw_logs=rows),sort_keys=True,indent=2)+'\n')
          PY
      - name: Preserve complete actual logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: full-antenna-job-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: antenna-job-logs
          if-no-files-found: error
          retention-days: 90
