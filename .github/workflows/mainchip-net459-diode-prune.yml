      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Authenticate source before whole-capsule readback
        run: |
          python3 -B - <<'PY'
          import hashlib,json,os,subprocess
          from pathlib import Path
          raw=Path('scripts/mainchip-full-antenna-readback-pins.json').read_bytes()
          assert hashlib.sha256(raw).hexdigest()=='70813988537889e2800e4da79fb45c221fc3067bb8270873c3eb654d1c08c0d1'
          for name,pin in json.loads(raw)['files'].items():
              p=Path(name);assert p.is_file() and not p.is_symlink()
              b=p.read_bytes();assert len(b)==pin['bytes'] and hashlib.sha256(b).hexdigest()==pin['sha256']
          assert subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()==os.environ['GITHUB_SHA']
          PY
      - name: Classify every antenna report entry and compare exact violation identities
        run: python3 -B scripts/cloud_mainchip_full_antenna_readback.py --output full-antenna-evidence > full-antenna.stdout 2> full-antenna.stderr
      - name: Always emit complete bounded derived evidence
        if: always()
        run: |
          python3 -B - <<'PY'
          import sys
          from pathlib import Path
          for name in ('full-antenna.stdout','full-antenna.stderr'):
              p=Path(name)
              if p.is_file():
                  sys.stdout.buffer.write(p.read_bytes());sys.stdout.buffer.write(b'\n')
          PY
      - name: Preserve every derived result and failure
        id: preserved
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: full-antenna-readback-${{ github.run_id }}-${{ github.run_attempt }}
