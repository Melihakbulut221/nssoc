name: Current bulk diode naming readback
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Qualified existing snapshot readback; no CAD or repair
        type: choice
        required: true
        default: controls
        options: [controls, readback]
permissions:
  contents: read
  actions: read
concurrency:
  group: net459-diode-prune-${{ github.ref }}
  cancel-in-progress: false
env:
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  source-controls:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Bind exact read-only source
        run: |
          python3 -B - <<'PY'
          import ast,hashlib,json,os,subprocess
          from pathlib import Path
          out=Path('bulk-diode-name-controls');out.mkdir()
          e=os.environ
          assert e['GITHUB_REPOSITORY']=='Melihakbulut221/nssoc'
          assert e['GITHUB_EVENT_NAME']=='workflow_dispatch' and e['GITHUB_RUN_ATTEMPT']=='1'
          assert e['GITHUB_REF']=='refs/heads/codex/mainchip-net459-diode-prune'
          assert subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()==e['GITHUB_SHA']
          raw=Path('scripts/mainchip-bulk-diode-name-audit-pins.json').read_bytes()
          assert hashlib.sha256(raw).hexdigest()=='46092df90ff8721dd259c9df9e8f3e89a5f3bc80e2a1b00862d445b4124079da'
          manifest=json.loads(raw)
          assert len(manifest['files'])==23 and manifest['native_CAD_authorized']is False
          for path,pin in manifest['files'].items():
              p=Path(path);assert p.is_file()and not p.is_symlink()
              b=p.read_bytes();assert len(b)==pin['bytes']and hashlib.sha256(b).hexdigest()==pin['sha256']
          ast.parse(Path('scripts/cloud_mainchip_bulk_diode_name_audit.py').read_bytes())
          cfg=Path('scripts/mainchip-bulk-diode-name-audit-inputs.json').read_bytes()
          assert json.loads(cfg)['readback_authorized']is True
          (out/'manifest.json').write_bytes(raw);(out/'inputs.json').write_bytes(cfg)
          (out/'context.json').write_text(json.dumps(dict(source=e['GITHUB_SHA'],run_id=int(e['GITHUB_RUN_ID']),attempt=1,native_acquisition=False,native_CAD_executed=False,readback_authorized=True),sort_keys=True,indent=2)+'\n')
          PY
      - name: Install pinned streaming JSON parser
        run: python3 -m pip install --disable-pip-version-check ijson==3.4.0
      - name: Exercise allocation boundaries and actual streaming parser
        run: |
          set +e
          python3 -B scripts/cloud_mainchip_bulk_diode_name_audit.py --controls --output bulk-diode-name-controls/controls.json > bulk-diode-name-controls/controls.stdout 2> bulk-diode-name-controls/controls.stderr
          rc=$?
          CONTROL_RC="$rc" python3 -B - <<'PY'
          import json,os
          from pathlib import Path
          e=os.environ
          (Path('bulk-diode-name-controls')/'execution.json').write_text(json.dumps(dict(source=e['GITHUB_SHA'],run_id=int(e['GITHUB_RUN_ID']),attempt=1,returncode=int(e['CONTROL_RC']),native_CAD_executed=False),sort_keys=True,indent=2)+'\n')
          PY
          exit "$rc"
      - name: Require complete source qualification
        run: |
          python3 -B - <<'PY'
          import json,os
          from pathlib import Path
          p=Path('bulk-diode-name-controls')
          r=json.loads((p/'controls.json').read_bytes())
          assert r['status']=='PASS_BULK_DIODE_NAME_AUDIT_SOURCE_CONTROLS' and r['count']==len(r['rows'])==15
          assert all(row['passed']is True for row in r['rows'])
          assert r['context']['source']==os.environ['GITHUB_SHA']and r['context']['run_id']==int(os.environ['GITHUB_RUN_ID'])and r['context']['attempt']==1
          assert r['native_CAD_executed']is False
          assert (p/'controls.stdout').read_bytes()==(p/'controls.json').read_bytes()
          PY
      - name: Always emit all source records
        if: always()
        run: |
          python3 -B - <<'PY'
          import base64,hashlib,json
          from pathlib import Path
          for name in ('context.json','manifest.json','inputs.json','controls.json','controls.stdout','controls.stderr','execution.json'):
              p=Path('bulk-diode-name-controls')/name;assert not p.is_symlink()
              present=p.is_file();raw=p.read_bytes()if present else b''
              parts=[raw[i:i+6000]for i in range(0,len(raw),6000)]
              print('DIODE_NAME_AUDIT_SOURCE_INDEX '+json.dumps(dict(path=name,present=present,bytes=len(raw),sha256=hashlib.sha256(raw).hexdigest(),chunks=len(parts)),sort_keys=True))
              for i,b in enumerate(parts):print('DIODE_NAME_AUDIT_SOURCE_CHUNK '+json.dumps(dict(path=name,index=i,base64=base64.b64encode(b).decode()),sort_keys=True))
          PY
      - name: Preserve complete source records
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bulk-diode-name-source-${{ github.run_id }}-${{ github.run_attempt }}
          path: bulk-diode-name-controls
          if-no-files-found: error
          retention-days: 90

  preserve-job-log:
    needs: source-controls
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Preserve full actual source job log and metadata
        run: |
          python3 -B - <<'PY'
          import hashlib,json,os,subprocess
          from pathlib import Path
          root=Path('job-logs');root.mkdir()
          e=os.environ
          assert e['GITHUB_REPOSITORY']=='Melihakbulut221/nssoc' and e['GITHUB_RUN_ATTEMPT']=='1'
          prefix='repos/'+e['GITHUB_REPOSITORY']+'/'
          def read(path,name):
              b=subprocess.check_output(['gh','api',prefix+path]);(root/name).write_bytes(b);return json.loads(b)
          run=read('actions/runs/'+e['GITHUB_RUN_ID'],'run.json')
          assert run['head_sha']==e['GITHUB_SHA'] and run['run_attempt']==1
          jobs=read('actions/runs/'+e['GITHUB_RUN_ID']+'/attempts/1/jobs?per_page=100','jobs.json')
          selected=[j for j in jobs['jobs'] if j['name']=='source-controls'];assert len(selected)==1
          listed=selected[0]
          j=read('actions/jobs/'+str(listed['id']),'job.json')
          assert j['id']==listed['id'] and j['name']=='source-controls'
          assert j['head_sha']==e['GITHUB_SHA'] and j['run_id']==int(e['GITHUB_RUN_ID'])
          b=subprocess.check_output(['gh','api','--allow-escape-sequences',prefix+'actions/jobs/'+str(j['id'])+'/logs'])
          assert b;(root/'job.log').write_bytes(b)
          receipt=dict(source=e['GITHUB_SHA'],run_id=int(e['GITHUB_RUN_ID']),attempt=1,
            job_id=j['id'],job_conclusion=j['conclusion'],api_status=j['status'],api_metadata_claims_terminal=j['status']=='completed',execution_dependency_finished=True,full_raw_job_log=True,
            log_bytes=len(b),log_sha256=hashlib.sha256(b).hexdigest(),native_acquisition=False)
          (root/'receipt.json').write_text(json.dumps(receipt,sort_keys=True,indent=2)+'\n')
          print(json.dumps(receipt,sort_keys=True))
          PY
      - name: Preserve complete actual logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bulk-postdrt-source-job-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: job-logs
          if-no-files-found: error
          retention-days: 90

  readback:
    needs: [source-controls, preserve-job-log]
    if: ${{ inputs.mode == 'readback' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify exact admitted read-only sources
        run: |
          python3 -B - <<'PY'
          import hashlib,json,os,subprocess
          from pathlib import Path
          assert subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()==os.environ['GITHUB_SHA']
          raw=Path('scripts/mainchip-bulk-diode-name-audit-pins.json').read_bytes()
          assert hashlib.sha256(raw).hexdigest()=='46092df90ff8721dd259c9df9e8f3e89a5f3bc80e2a1b00862d445b4124079da'
          manifest=json.loads(raw)
          assert len(manifest['files'])==23 and manifest['native_CAD_authorized']is False
          for name,pin in manifest['files'].items():
              p=Path(name);assert p.is_file()and not p.is_symlink()
              b=p.read_bytes();assert len(b)==pin['bytes']and hashlib.sha256(b).hexdigest()==pin['sha256']
          assert json.loads(Path('scripts/mainchip-bulk-diode-name-audit-inputs.json').read_bytes())['readback_authorized']is True
          PY
      - name: Install same pinned streaming parser
        run: python3 -m pip install --disable-pip-version-check ijson==3.4.0
      - name: Repeat all same-source controls before any input acquisition
        run: |
          python3 -B scripts/cloud_mainchip_bulk_diode_name_audit.py --controls --output bulk-diode-name-readback-controls.json > bulk-diode-name-readback-controls.stdout 2> bulk-diode-name-readback-controls.stderr
      - name: Require independently created exact-source release
        run: |
          python3 -B - <<'PY'
          import json,os,subprocess,time
          from pathlib import Path
          e=os.environ;tag='cloud-results-'+e['GITHUB_RUN_ID']+'-1-mainchip-bulk-postdrt-antenna'
          prefix='repos/Melihakbulut221/nssoc/'
          for attempt in range(120):
              p=subprocess.run(['gh','api',prefix+'releases/tags/'+tag],capture_output=True,text=True)
              if p.returncode==0:
                  d=json.loads(p.stdout);break
              assert 'HTTP 404' in p.stderr,p.stderr
              time.sleep(2)
          else:raise RuntimeError('Exact-source release reservation was not created; no archive acquisition')
          r=json.loads(subprocess.check_output(['gh','api',prefix+'git/ref/tags/'+tag]))
          assert d['tag_name']==tag and d['target_commitish']==e['GITHUB_SHA']
          assert d['draft'] is False and d['prerelease'] is True and d['assets']==[]
          assert r['object']['type']=='commit' and r['object']['sha']==e['GITHUB_SHA']
          receipt=dict(tag=tag,tested_source=e['GITHUB_SHA'],release_id=d['id'],existing_assets=[],target_verified=True,assets_overwritten=False,externally_reserved=True,creation_attempted=False,read_attempts=attempt+1)
          Path('release-reservation.json').write_text(json.dumps(receipt,sort_keys=True,indent=2)+'\n')
          PY
      - name: Authenticate every existing input member and audit current instance names
        run: |
          python3 -B scripts/cloud_mainchip_bulk_diode_name_audit.py --readback --output bulk-diode-name-readback-evidence --work "$RUNNER_TEMP/bulk-diode-name-audit-$GITHUB_RUN_ID-1" --reservation release-reservation.json --controls-proof bulk-diode-name-readback-controls.json > bulk-diode-name-readback.stdout 2> bulk-diode-name-readback.stderr
      - name: Always emit complete readback records and failures
        if: always()
        run: |
          python3 -B - <<'PY'
          import sys
          from pathlib import Path
          for name in ('bulk-diode-name-readback-controls.stdout','bulk-diode-name-readback-controls.stderr','bulk-diode-name-readback.stdout','bulk-diode-name-readback.stderr'):
              p=Path(name)
              if p.is_file():
                  sys.stdout.buffer.write(p.read_bytes());sys.stdout.buffer.write(b'\n')
          PY
      - name: Preserve all derived evidence and complete publication fallback
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bulk-diode-name-readback-${{ github.run_id }}-${{ github.run_attempt }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
          path: |
            bulk-diode-name-readback-evidence
            bulk-diode-name-readback-controls.json
            bulk-diode-name-readback-controls.stdout
            bulk-diode-name-readback-controls.stderr
            bulk-diode-name-readback.stdout
            bulk-diode-name-readback.stderr
            release-reservation.json
            ${{ runner.temp }}/bulk-diode-name-audit-${{ github.run_id }}-1/owner.json
            ${{ runner.temp }}/bulk-diode-name-audit-${{ github.run_id }}-1/candidate-outputs.json
            ${{ runner.temp }}/bulk-diode-name-audit-${{ github.run_id }}-1/candidate-parts.json
            ${{ runner.temp }}/bulk-diode-name-audit-${{ github.run_id }}-1/candidate-native.tar.gz.part*
            ${{ runner.temp }}/bulk-diode-name-audit-${{ github.run_id }}-1/publication

  preserve-antenna-job-logs:
    needs: [source-controls, preserve-job-log, readback]
    if: ${{ always() && inputs.mode == 'readback' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Preserve all complete terminal execution logs and metadata
        run: |
          python3 -B - <<'PY'
          import hashlib,json,os,subprocess
          from pathlib import Path
          e=os.environ;out=Path('antenna-job-logs');out.mkdir()
          prefix='repos/Melihakbulut221/nssoc/'
          def get(path,name):
              b=subprocess.check_output(['gh','api',prefix+path]);(out/name).write_bytes(b);return json.loads(b)
          r=get('actions/runs/'+e['GITHUB_RUN_ID'],'run.json')
          assert r['head_sha']==e['GITHUB_SHA'] and r['run_attempt']==1
          jobs=get('actions/runs/'+e['GITHUB_RUN_ID']+'/attempts/1/jobs?per_page=100','jobs.json')
          rows={}
          for j in jobs['jobs']:
              if j['name'] not in ('source-controls','preserve-job-log','readback'):continue
              j=get('actions/jobs/'+str(j['id']),str(j['id'])+'.json')
              assert j['head_sha']==e['GITHUB_SHA'] and j['run_id']==int(e['GITHUB_RUN_ID'])
              if j['conclusion']=='skipped':continue
              raw=subprocess.check_output(['gh','api','--allow-escape-sequences',prefix+'actions/jobs/'+str(j['id'])+'/logs'])
              assert raw;(out/(str(j['id'])+'.log')).write_bytes(raw)
              rows[j['name']]=dict(id=j['id'],conclusion=j['conclusion'],api_status=j['status'],api_metadata_claims_terminal=j['status']=='completed',execution_dependency_finished=True,bytes=len(raw),sha256=hashlib.sha256(raw).hexdigest())
          (out/'receipt.json').write_text(json.dumps(dict(source=e['GITHUB_SHA'],run=int(e['GITHUB_RUN_ID']),attempt=1,complete_raw_logs=rows),sort_keys=True,indent=2)+'\n')
          PY
      - name: Preserve complete actual logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: full-antenna-job-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: antenna-job-logs
          if-no-files-found: error
          retention-days: 90
