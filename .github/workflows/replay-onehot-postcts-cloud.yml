name: replay-onehot-postcts-cloud
run-name: "replay-onehot-postcts-cloud / placement 39059854681"
on:
  push:
    branches: [codex/complete-open-work]
    paths:
      - .github/workflows/replay-onehot-postcts-cloud.yml
      - scripts/cloud_replay_onehot_postcts.py
      - scripts/check_replay_onehot_resume.py
      - hw/soc/pnr/corrpre_banked_flow.py
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: replay-onehot-postcts-${{ github.ref }}
  cancel-in-progress: false
jobs:
  controls:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Check source identity rejection and complete archive roundtrip controls
        run: |
          python3 -m py_compile scripts/cloud_replay_onehot_postcts.py scripts/check_replay_onehot_resume.py hw/soc/pnr/corrpre_banked_flow.py
          python3 scripts/check_replay_onehot_resume.py
  source-ready:
    needs: controls
    runs-on: ubuntu-24.04
    timeout-minutes: 310
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Observe exact placement without restarting it
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -m py_compile scripts/cloud_replay_onehot_repair_handoff.py
          python3 scripts/cloud_replay_onehot_repair_handoff.py --wait
      - name: Preserve source observation including failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: replay-onehot-repair-source-${{ github.run_id }}
          path: cloud-replay-onehot-repair-source/
          retention-days: 30
  native-physical:
    needs: source-ready
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Prepare pinned native runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libfuse2
          python3 scripts/bootstrap_flow.py
          echo "CLOUD_APPIMAGE=$GITHUB_WORKSPACE/hw/soc/tools/physical/librelane-3.0.5-x86_64.AppImage" >> "$GITHUB_ENV"
      - name: Revalidate nine proofs and measure exact new CTS repair at all three corners
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/cloud_replay_onehot_repair_handoff.py
      - name: Preserve completed native states and every failure
        if: always()
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          root=hw/soc/out/cloud-replay-onehot-postcts
          mkdir -p "$root"
          if [ ! -f "$root/result.json" ]; then
            printf '%s\n' '{"status":"FAIL_MISSING_REPORT","accepted":false}' > "$root/result.json"
          fi
          stem="replay-onehot-postcts-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          cp "$root/result.json" "$stem.summary.json"
          python3 scripts/cloud_chunked_results.py --directory "$root" --stem "$stem"
          python3 - "$stem" <<'PYCODE'
          import json,subprocess,sys
          stem=sys.argv[1]; manifest=stem+'.parts.json'; m=json.load(open(manifest))
          subprocess.run([sys.executable,'scripts/publish_cloud_results.py','--group','replay-onehot-postcts',stem+'.summary.json',manifest,*[p['name'] for p in m['parts']]],check=True)
          PYCODE
      - name: Retain states if release publication fails
        if: always() && steps.publish.outcome == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: replay-onehot-postcts-${{ github.run_id }}
          path: hw/soc/out/cloud-replay-onehot-postcts/
          retention-days: 30
