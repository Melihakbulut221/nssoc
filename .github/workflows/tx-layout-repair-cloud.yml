name: tx-layout-repair-cloud
on:
  workflow_dispatch:
    inputs:
      boundary_policy:
        description: Actual metal pin-access side; paired nearest edges reduce long clock and bias extensions
        type: choice
        options: [left, nearest_pair]
        default: left
      boundary_pins:
        description: Extend all real TM2 public pins to macro boundary; fresh physical and RC gates required
        type: boolean
        default: false
      circuit_profile:
        description: Exact circuit to realize with native PCells
        type: choice
        options: [baseline, cascade14, cascade16, cascade158, final_drive_v5, final_drive_v6, final_drive_v7, final_drive_v8, final_drive_v9, final_drive_v10, final_drive_v11]
        default: baseline
      variant:
        description: Physical routing geometry
        type: choice
        options: [critical_buses_kelvin_m3_10, signal_escape_sweep, critical_buses_kelvin_signal_escape_08, critical_buses_kelvin_signal_escape_10, critical_buses_kelvin_signal_escape_12, critical_buses_kelvin_signal_trunks, critical_buses_kelvin_dense_wide, critical_buses_kelvin_supply_feed, critical_buses_kelvin_supply_direct, critical_buses_kelvin_supply_direct_low_outputs, critical_buses_kelvin_tail_paths, critical_buses_kelvin_local_tail, critical_buses_kelvin_local_return, critical_buses_kelvin_local_supply, critical_buses_kelvin_low_internal, critical_buses_kelvin_low_critical, critical_buses_kelvin_low_selects, critical_buses_kelvin_low_selects_m3, critical_buses_kelvin_low_selects_rows, critical_buses_kelvin_low_ports, critical_buses_kelvin_low_ports_deep, critical_buses_kelvin_low_ports_loads, critical_buses_kelvin_low_ports_shunts, critical_buses_kelvin_low_ports_loads_shunts, critical_buses_kelvin_low_ports_loads_shunts_series, critical_buses_kelvin_low_ports_loads_shunts_series_direct, critical_buses_kelvin_local_internal, critical_buses_kelvin_compact_internal, critical_buses_kelvin_dense4, critical_buses_kelvin_dense, critical_buses_power_trunks_vias, critical_buses_kelvin_short_vias, critical_buses_kelvin_short, critical_buses_kelvin_return, critical_buses_interleaved_resistors, critical_buses, critical_buses_wide_escape, critical_buses_supply_escape, critical_buses_power_trunks, baseline, topmetal_trunks, topmetal_trunks_narrow_bus]
        default: critical_buses
permissions:
  contents: read
concurrency:
  group: tx-layout-repair-cloud-${{ github.ref }}-${{ inputs.circuit_profile }}-${{ inputs.boundary_pins }}-${{ inputs.boundary_policy }}
  cancel-in-progress: false
jobs:
  physical-repair:
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ inputs.variant == 'signal_escape_sweep' && fromJSON('["critical_buses_kelvin_signal_escape_08","critical_buses_kelvin_signal_escape_10","critical_buses_kelvin_signal_escape_12"]') || fromJSON(format('["{0}"]', inputs.variant || 'critical_buses')) }}
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify source equivalence and reject native device and contact faults
        run: |
          python3 -m pip install pytest==8.4.2
          python3 -m pytest -q sw/tests/test_tx_final_layout_source.py
          python3 -m py_compile scripts/run_cloud_tx_layout_repair.py
      - name: Permanently retain failed boundary generator source and artifact
        if: ${{ inputs.boundary_pins && inputs.circuit_profile == 'final_drive_v10' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PYCODE'
          import hashlib, io, json, os, subprocess, zipfile
          from pathlib import Path
          repo='repos/'+os.environ['GITHUB_REPOSITORY']
          def api(p):
              return subprocess.check_output(['gh','api',repo+'/'+p])
          source=json.loads(api('actions/runs/38680055040'))
          assert source['status']=='completed' and source['conclusion']=='failure'
          assert source['head_sha']=='af836358f7a85bd0c8231f1d0aa719ed150b8f1d' and source['run_attempt']==1
          meta=json.loads(api('actions/artifacts/11947829260'))
          assert not meta['expired'] and meta['workflow_run']['id']==38680055040
          raw=api('actions/artifacts/11947829260/zip')
          digest=hashlib.sha256(raw).hexdigest()
          assert digest=='929624b1906214472f59794d7ce78e6f27798881d1dbfe3e1f06337104ce089a'
          assert meta['digest']=='sha256:'+digest
          with zipfile.ZipFile(io.BytesIO(raw)) as z:
              result=json.loads(z.read('result.json'))
              assert result['status']=='FAIL_OR_ERROR' and result['boundary_pins'] is True
          Path('failed-boundary-38680055040.zip').write_bytes(raw)
          Path('failed-boundary-38680055040.json').write_text(json.dumps(dict(
              status='PRESERVED_ORIGINAL_FAILED_CAPTURE_NOT_ACCEPTED',source_run=38680055040,
              source_head=source['head_sha'],artifact=meta,result=result),indent=2)+'\n')
          PYCODE
          python3 scripts/publish_cloud_results.py --group 'boundary-original-failure' failed-boundary-38680055040.zip failed-boundary-38680055040.json
      - name: Verify exact native runtime on hosted runner
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libfuse2
          curl --fail --location --retry 4 https://github.com/librelane/librelane/releases/download/3.0.5/librelane-devshell-x86_64.AppImage -o "$RUNNER_TEMP/librelane.AppImage"
          echo "d6a349ec65be11456e96c4981d35f63ca34d3c85daf79a51e1ccb907bb5d7466  $RUNNER_TEMP/librelane.AppImage" | sha256sum --check
          chmod +x "$RUNNER_TEMP/librelane.AppImage"
          echo "CLOUD_APPIMAGE=$RUNNER_TEMP/librelane.AppImage" >> "$GITHUB_ENV"
      - name: Generate actual layout and apply unchanged DRC LVS and physical fault controls
        run: python3 scripts/run_cloud_tx_layout_repair.py --variant '${{ matrix.variant }}' --circuit-profile '${{ inputs.circuit_profile || 'baseline' }}' ${{ inputs.boundary_pins && '--boundary-pins' || '' }} --boundary-policy '${{ inputs.boundary_policy || 'left' }}'
      - name: Keep full geometry, timing, proof and failure evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tx-layout-repair-cloud-${{ matrix.variant }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: hw/soc/out/cloud-tx-layout-repair/
          compression-level: 1
          retention-days: 30
          if-no-files-found: error
      - name: Preserve complete evidence permanently
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          archive='tx-layout-repair-cloud-${{ inputs.circuit_profile || 'baseline' }}-${{ matrix.variant }}-${{ github.run_id }}-${{ github.run_attempt }}.tar.gz'
          tar -czf "$archive" hw/soc/out/cloud-tx-layout-repair
          sha256sum "$archive" > "$archive.sha256"
          summary="${archive%.tar.gz}.summary.json"
          cp hw/soc/out/cloud-tx-layout-repair/result.json "$summary"
          python3 scripts/publish_cloud_results.py --group '${{ inputs.boundary_pins && inputs.boundary_policy == 'nearest_pair' && format('layout-boundary-nearest-{0}', inputs.circuit_profile) || inputs.boundary_pins && format('layout-boundary-{0}', inputs.circuit_profile) || format('layout-{0}-{1}', inputs.circuit_profile || 'baseline', matrix.variant) }}' "$archive" "$archive.sha256" "$summary"
