name: tx-output8088-driverpinfeed-precision-cloud
on:
  push:
    branches: [codex/tx-via3-rail-diagnosis]
    paths: [.github/workflows/tx-output8088-driverpinfeed-precision-cloud.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tx-output8088-driverpinfeed-precision-${{ github.ref }}
  cancel-in-progress: false
jobs:
  actual-full-parent-wire-rc:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Restore exact native CAD runtime
        run: |
          echo '0c2b9aa5fda9da0cc18069f8ee9a29d1933d4443b5bdbd942063ae18b59f8acf  scripts/cloud_tx_output8088_driverpinfeed_precision_launch.py' | sha256sum --check
          python3 -m py_compile scripts/cloud_tx_output8088_driverpinfeed_precision_launch.py scripts/tx_reverse_native_cap_order.py
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libfuse2 tcl8.6 tk8.6 tcl-dev tk-dev build-essential m4 autoconf libreadline-dev libx11-dev libxext-dev libxpm-dev libxt-dev libcairo2-dev libgl1-mesa-dev libglu1-mesa-dev
          python3 -m pip install networkx==3.4.2
      - name: Verify double-total producer on actual8088 geometry in both cap orders
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/cloud_tx_output8088_driverpinfeed_precision_launch.py
      - name: Publish physical success or failure evidence
        if: always()
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p hw/soc/out/cloud-tx-output8088-driverpinfeed-precision
          if [ ! -f hw/soc/out/cloud-tx-output8088-driverpinfeed-precision/result.json ]; then
            printf '%s\n' '{"status":"FAIL_MISSING_REPORT","accepted":false}' > hw/soc/out/cloud-tx-output8088-driverpinfeed-precision/result.json
          fi
          stem="tx-output8088-driverpinfeed-precision-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          cp hw/soc/out/cloud-tx-output8088-driverpinfeed-precision/result.json "$stem.summary.json"
          python3 scripts/cloud_chunked_results.py --directory hw/soc/out/cloud-tx-output8088-driverpinfeed-precision --stem "$stem"
          python3 - "$stem" <<'PYCODE'
          import json,subprocess,sys
          stem=sys.argv[1];manifest=stem+'.parts.json';m=json.load(open(manifest))
          subprocess.run([sys.executable,'scripts/publish_cloud_results.py','--group','tx-output8088-driverpinfeed-precision',stem+'.summary.json',manifest,*[p['name']for p in m['parts']]],check=True)
          PYCODE
      - name: Retain evidence after publication failure
        if: always() && steps.publish.outcome == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tx-output8088-driverpinfeed-precision-${{ github.run_id }}
          retention-days: 30
          path: hw/soc/out/cloud-tx-output8088-driverpinfeed-precision/
