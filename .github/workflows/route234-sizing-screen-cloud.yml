name: route234-sizing-screen-cloud
on:
  push:
    branches: [codex/complete-open-work]
    paths: [.github/workflows/route234-sizing-screen-cloud.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: route234-sizing-screen-${{ github.ref }}
  cancel-in-progress: false
jobs:
  frozen-rc-sizing-screen:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Restore exact native OpenROAD runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libfuse2
          python3 -m pip install numpy==2.3.3
          curl --fail --location --retry 4 https://github.com/librelane/librelane/releases/download/3.0.5/librelane-devshell-x86_64.AppImage -o "$RUNNER_TEMP/librelane.AppImage"
          echo "d6a349ec65be11456e96c4981d35f63ca34d3c85daf79a51e1ccb907bb5d7466  $RUNNER_TEMP/librelane.AppImage" | sha256sum --check
          chmod +x "$RUNNER_TEMP/librelane.AppImage"
          echo "CLOUD_APPIMAGE=$RUNNER_TEMP/librelane.AppImage" >> "$GITHUB_ENV"
      - name: Reproduce234 full census and measure14 real PDK size substitutions with frozen RC
        run: |
          python3 -m py_compile scripts/cloud_route234_sizing_screen.py scripts/prepare_route234_sizing_screen.py
          python3 scripts/cloud_route234_sizing_screen.py
      - name: Preserve full source-bound sizing estimate and all failures
        if: always()
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p cloud-route234-sizing-screen
          if [ ! -f cloud-route234-sizing-screen/result.json ]; then
            printf '%s\n' '{"status":"FAIL_MISSING_REPORT","accepted":false}' > cloud-route234-sizing-screen/result.json
          fi
          stem="route234-sizing-screen-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          cp cloud-route234-sizing-screen/result.json "$stem.summary.json"
          python3 scripts/cloud_chunked_results.py --directory cloud-route234-sizing-screen --stem "$stem"
          python3 - "$stem" <<'PYCODE'
          import json,subprocess,sys
          stem=sys.argv[1];manifest=stem+'.parts.json';m=json.load(open(manifest))
          subprocess.run([sys.executable,'scripts/publish_cloud_results.py','--group','route234-sizing-screen',stem+'.summary.json',manifest,*[p['name']for p in m['parts']]],check=True)
          PYCODE
      - name: Retain evidence after publication failure
        if: always() && steps.publish.outcome == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: route234-sizing-screen-${{ github.run_id }}
          retention-days: 30
          path: cloud-route234-sizing-screen/
      - name: Require complete measurement without accepting frozen RC as routed timing
        if: always()
        run: |
          python3 - <<'PYCODE'
          import json,os
          r=json.load(open('cloud-route234-sizing-screen/result.json'))
          assert r['source_head']==os.environ['GITHUB_SHA']
          assert r['status']=='COMPLETE_FOURTEEN_DRIVER_FROZEN_RC_SIZING_SCREEN_NOT_PHYSICAL_ACCEPTANCE',r.get('error')
          assert r['source_unchanged'] and r['baseline_all_endpoint_rows_reproduced']
          assert r['inversion_control']=='REJECTED' and r['logic']['status']=='PASS within scope'
          assert r['endpoint_count']==22544 and r['endpoint_corner_delay_rows']==135264
          assert not r['accepted'] and not r['physical_candidate'] and r['physical_validation_required']
          print(json.dumps({k:v['worst']for k,v in r['frozen_spef_comparison'].items()}))
          PYCODE
