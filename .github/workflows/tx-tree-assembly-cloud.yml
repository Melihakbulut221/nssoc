name: tx-tree-assembly-cloud
on:
  push:
    branches: [codex/complete-open-work]
    paths: [.github/workflows/tx-tree-assembly-cloud.yml]
  workflow_dispatch:
    inputs:
      stage:
        description: Native physical assembly, complete wire extraction or162-device composition
        type: choice
        options: [physical, extraction, composition, wave_diagnosis, step_comparison]
        default: physical
      solver_profile:
        description: Select exact pinned numerical profile
        type: choice
        options: [default, tight_trap, tight_gear2]
        default: default
      step_pair:
        description: Only timestep differs; original0.5/0.25ps or fine0.125/0.0625ps
        type: choice
        options: [original, fine]
        default: original
      placement_profile:
        description: Physical parent placement; compact_vertical preserves all child device geometry and shortens actual intermacro wires
        type: choice
        options: [baseline, compact_vertical, compact_m5_supply, compact_edge_supply]
        default: baseline
permissions:
  contents: read
concurrency:
  group: tx-tree-assembly-cloud-${{ github.ref }}
  cancel-in-progress: false
jobs:
  native-assembly:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify native runtime and controller syntax
        run: |
          python3 -m py_compile scripts/run_cloud_tx_tree_assembly.py scripts/run_cloud_tx_tree_extraction.py scripts/run_cloud_tx_tree_composition.py scripts/analyze_cloud_assembled_wave.py
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libfuse2 tcl8.6
          python3 -m pip install networkx==3.4.2 numpy==2.3.3
          curl --fail --location --retry 4 https://github.com/librelane/librelane/releases/download/3.0.5/librelane-devshell-x86_64.AppImage -o "$RUNNER_TEMP/librelane.AppImage"
          echo "d6a349ec65be11456e96c4981d35f63ca34d3c85daf79a51e1ccb907bb5d7466  $RUNNER_TEMP/librelane.AppImage" | sha256sum --check
          chmod +x "$RUNNER_TEMP/librelane.AppImage"
          echo "CLOUD_APPIMAGE=$RUNNER_TEMP/librelane.AppImage" >> "$GITHUB_ENV"
      - name: Assemble real GDS conductors and compare all162devices including81substrate contacts
        run: python3 scripts/${{ (inputs.stage == 'wave_diagnosis' || inputs.stage == 'step_comparison') && 'analyze_cloud_assembled_wave.py' || inputs.stage == 'composition' && 'run_cloud_tx_tree_composition.py' || inputs.stage == 'extraction' && 'run_cloud_tx_tree_extraction.py' || 'run_cloud_tx_tree_assembly.py' }} --placement-profile '${{ inputs.placement_profile || 'baseline' }}' ${{ inputs.stage == 'step_comparison' && '--compare-timestep' || '' }} ${{ (inputs.stage == 'wave_diagnosis' || inputs.stage == 'step_comparison') && format('--step-pair {0} --solver-profile {1}', inputs.step_pair || 'original', inputs.solver_profile || 'default') || '' }}
      - name: Preserve all physical successes and failures
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          archive="tx-tree-assembly-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.tar.gz"
          tar -czf "$archive" hw/soc/out/cloud-tx-tree-assembly
          sha256sum "$archive" > "$archive.sha256"
          summary_source=hw/soc/out/cloud-tx-tree-assembly/result.json
          if [ '${{ inputs.stage }}' = extraction ]; then
            summary_source=hw/soc/out/cloud-tx-tree-assembly/extraction-result.json
          elif [ '${{ inputs.stage }}' = step_comparison ]; then
            summary_source=hw/soc/out/cloud-tx-tree-assembly/step-comparison-result.json
          elif [ '${{ inputs.stage }}' = wave_diagnosis ]; then
            summary_source=hw/soc/out/cloud-tx-tree-assembly/diagnosis-result.json
          elif [ '${{ inputs.stage }}' = composition ]; then
            summary_source=hw/soc/out/cloud-tx-tree-assembly/composition-result.json
          fi
          cp "$summary_source" "${archive%.tar.gz}.summary.json"
          python3 scripts/publish_cloud_results.py --group 'tree-assembly-4${{ inputs.stage == 'step_comparison' && '-step-comparison' || inputs.stage == 'wave_diagnosis' && '-wave-diagnosis' || inputs.stage == 'composition' && '-composition' || inputs.stage == 'extraction' && '-extraction' || '' }}${{ inputs.placement_profile == 'compact_edge_supply' && '-compact-edge-supply' || inputs.placement_profile == 'compact_m5_supply' && '-compact-m5-supply' || inputs.placement_profile == 'compact_vertical' && '-compact-vertical' || '' }}' "$archive" "$archive.sha256" "${archive%.tar.gz}.summary.json"
      - name: Retain outputs if publication fails
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tree-assembly-${{ github.run_id }}-${{ github.run_attempt }}
          path: hw/soc/out/cloud-tx-tree-assembly/
          if-no-files-found: warn
