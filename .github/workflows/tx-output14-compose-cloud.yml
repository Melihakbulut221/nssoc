name: tx-output14-compose-cloud
on:
  push:
    branches: [codex/complete-open-work]
    paths: [.github/workflows/tx-output14-compose-cloud.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tx-output14-compose-${{ github.ref }}
  cancel-in-progress: false
jobs:
  compose:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Check composition controller syntax
        run: python3 -m py_compile scripts/cloud_tx_output14_compose.py scripts/tx_output14_intrinsic_model.py
      - name: Compose every native device and wire with11 corruption checks
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/cloud_tx_output14_compose.py
      - name: Preserve every physical gate and fault including failed geometry
        if: always()
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p hw/soc/out/cloud-tx-output14-compose
          if [ ! -f hw/soc/out/cloud-tx-output14-compose/result.json ]; then
            printf '%s\n' '{"status":"FAIL_MISSING_REPORT","accepted":false}' > hw/soc/out/cloud-tx-output14-compose/result.json
          fi
          stem="tx-output14-compose-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          cp hw/soc/out/cloud-tx-output14-compose/result.json "$stem.summary.json"
          python3 scripts/cloud_chunked_results.py --directory hw/soc/out/cloud-tx-output14-compose --stem "$stem"
          python3 - "$stem" <<'PYCODE'
          import json,subprocess,sys
          stem=sys.argv[1];manifest=stem+'.parts.json';m=json.load(open(manifest))
          subprocess.run([sys.executable,'scripts/publish_cloud_results.py','--group','tx-output14-compose',stem+'.summary.json',manifest,*[p['name']for p in m['parts']]],check=True)
          PYCODE
      - name: Retain evidence after publication failure
        if: always() && steps.publish.outcome == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tx-output14-compose-${{ github.run_id }}
          retention-days: 30
          path: hw/soc/out/cloud-tx-output14-compose/
