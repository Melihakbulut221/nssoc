name: pcie-ack-cloud-mapping
on:
  push:
    branches: ['codex/complete-open-work']
    paths:
      - .github/workflows/pcie-ack-cloud-mapping.yml
      - scripts/run_cloud_ack_mapping.py
      - docs/evidence/pcie-ack-map-cloud-input-20261012.json
  workflow_dispatch:
    inputs:
      study:
        type: choice
        options: [advert_bank_eop, advert_bank_commit, read_static_reports, advert_static_commit, trace_control_endpoints, read_control_reports, advert_control, ack, replay_idle, credit_verdict, advert_eop, ack_window, ack_window_eop, fc_refresh, fc_snapshot, advert_body, advert_factored, advert_reset, abc_delay, abc_slow_corner]
        default: ack
permissions:
  contents: read
concurrency:
  group: pcie-ack-cloud-mapping-${{ github.ref }}
  cancel-in-progress: false
jobs:
  map-and-screen:
    if: github.event_name == 'workflow_dispatch' && inputs.study != 'read_control_reports' && inputs.study != 'trace_control_endpoints' && inputs.study != 'read_static_reports'
    runs-on: ubuntu-22.04
    timeout-minutes: 360 # Hosted platform ceiling; no shorter native watchdog.
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        profile: ${{ fromJSON(inputs.study == 'advert_bank_eop' && '["physical_idle_credit","physical_idle_credit_bank_eop"]' || inputs.study == 'advert_bank_commit' && '["physical_idle_credit","physical_idle_credit_bank"]' || inputs.study == 'advert_static_commit' && '["physical_idle_credit","physical_idle_credit_static"]' || inputs.study == 'advert_control' && '["physical_idle_credit","physical_idle_credit_control"]' || inputs.study == 'abc_slow_corner' && '["physical_idle_credit_window_eop","physical_idle_credit_window_eop_slowmap"]' || inputs.study == 'abc_delay' && '["physical_idle_credit_window_eop","physical_idle_credit_window_eop_d2000"]' || inputs.study == 'advert_reset' && '["physical_idle_credit_window_eop","physical_idle_credit_window_reset"]' || inputs.study == 'advert_factored' && '["physical_idle_credit_window_eop","physical_idle_credit_window_factored"]' || inputs.study == 'advert_body' && '["physical_idle_credit_window_eop","physical_idle_credit_window_body"]' || inputs.study == 'fc_snapshot' && '["physical_idle_credit_window_eop","physical_idle_credit_window_eop_snapshot"]' || inputs.study == 'fc_refresh' && '["physical_idle_credit_window_eop","physical_idle_credit_window_eop_refresh"]' || inputs.study == 'ack_window_eop' && '["physical_idle_credit","physical_idle_credit_window_eop"]' || inputs.study == 'ack_window' && '["physical_idle_credit","physical_idle_credit_window"]' || inputs.study == 'advert_eop' && '["physical_idle_credit","physical_idle_credit_eop"]' || inputs.study == 'credit_verdict' && '["physical_idle","physical_idle_credit"]' || inputs.study == 'replay_idle' && '["physical_baseline","physical_idle"]' || '["baseline","ack"]') }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: YosysHQ/setup-oss-cad-suite@aefa8397bbf8fc6670a0a62af9805a89738f3cde
        with:
          version: '2026-08-04'
          github-token: ${{ github.token }}
      - name: Prepare exact physical runtime on hosted runner
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libfuse2
          curl --fail --location --retry 3 https://github.com/librelane/librelane/releases/download/3.0.5/librelane-devshell-x86_64.AppImage -o "$RUNNER_TEMP/librelane.AppImage"
          echo "d6a349ec65be11456e96c4981d35f63ca34d3c85daf79a51e1ccb907bb5d7466  $RUNNER_TEMP/librelane.AppImage" | sha256sum --check
          chmod +x "$RUNNER_TEMP/librelane.AppImage"
          echo "CLOUD_APPIMAGE=$RUNNER_TEMP/librelane.AppImage" >> "$GITHUB_ENV"
      - name: Prepare consistent Python and cocotb for joint port controls
        if: ${{ inputs.study == 'ack_window_eop' || inputs.study == 'fc_refresh' || inputs.study == 'fc_snapshot' || inputs.study == 'advert_body' || inputs.study == 'advert_factored' || inputs.study == 'advert_reset' || inputs.study == 'abc_delay' || inputs.study == 'abc_slow_corner' || inputs.study == 'advert_control' || inputs.study == 'advert_bank_eop' || inputs.study == 'advert_bank_commit' || inputs.study == 'advert_static_commit' }}
        run: |
          python3 -m venv hw/.venv
          hw/.venv/bin/pip install -r hw/requirements.txt
      - name: Exact input mapping and original three-corner screening
        run: |
          python3 -m py_compile scripts/run_cloud_ack_mapping.py scripts/run_cloud_replay_idle.py
          ${{ (inputs.study == 'ack_window_eop' || inputs.study == 'fc_refresh' || inputs.study == 'fc_snapshot' || inputs.study == 'advert_body' || inputs.study == 'advert_factored' || inputs.study == 'advert_reset' || inputs.study == 'abc_delay' || inputs.study == 'abc_slow_corner' || inputs.study == 'advert_control' || inputs.study == 'advert_bank_eop' || inputs.study == 'advert_bank_commit' || inputs.study == 'advert_static_commit') && 'hw/.venv/bin/python' || 'python3' }} scripts/run_cloud_ack_mapping.py --profile '${{ matrix.profile }}'
      - name: Keep complete success or failure evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ack-map-${{ matrix.profile }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: cloud-ack-map/
          retention-days: 30
          if-no-files-found: error
      - name: Permanently preserve result bytes
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test -f 'cloud-ack-map/${{ matrix.profile }}/result.json'
          archive='ack-map-${{ matrix.profile }}-${{ github.run_id }}-${{ github.run_attempt }}.tar.gz'
          tar -czf "$archive" cloud-ack-map
          sha256sum "$archive" > "$archive.sha256"
          cp 'cloud-ack-map/${{ matrix.profile }}/result.json' "${archive%.tar.gz}.json"
          python3 scripts/publish_cloud_results.py --group 'ack-map-${{ matrix.profile }}' "$archive" "$archive.sha256" "${archive%.tar.gz}.json"

  read-control-reports:
    if: github.event_name == 'workflow_dispatch' && (inputs.study == 'read_control_reports' || inputs.study == 'trace_control_endpoints' || inputs.study == 'read_static_reports')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Read exact preserved reports on hosted runner
        env:
          GH_TOKEN: ${{ github.token }}
          TRACE_ENDPOINTS: ${{ inputs.study }}
        run: |
          python3 - <<'PYCODE'
          import hashlib, io, json, os, re, subprocess, sys, tarfile
          from pathlib import Path
          sys.path.insert(0, 'scripts')
          from read_opensta_phase_slacks import parse_phases
          assert os.environ['GITHUB_ACTIONS'] == 'true'
          out=Path('cloud-control-reports'); out.mkdir()
          sources=[('physical_idle_credit',639167692,16843302,'60448a4513c527f11a17463ed8871f400b8f3d381bbc4daa22d2b3a60a615ca7',639167825,'935b57971096ec5778a08ccc802f07a93a3ff04cac3731eb571df3db8a8dbcfc'),('physical_idle_credit_control',639169881,17235476,'052f5f252e3cae645121861d190c384b270faf6dc41a7f9c37ec925c3b79ab66',639169985,'d448253d0fbb41ce68098328354b3c0467741525441eb18ebc565cd757a5853d')]
          source_run=38509087565
          candidate_profile='physical_idle_credit_control'
          if os.environ['TRACE_ENDPOINTS']=='read_static_reports':
              source_run=38513559584
              candidate_profile='physical_idle_credit_static'
              sources=[('physical_idle_credit',639277828,16843307,'202ef5517c9f1fc1487f5c581b5ed8a56be9f6bda002f7fa31a29cdfbbac1c54',639278022,'935b57971096ec5778a08ccc802f07a93a3ff04cac3731eb571df3db8a8dbcfc'),('physical_idle_credit_static',639278486,17196101,'182523238f0c2935201726859334b0b8faf580a32990c0c30a32ec52880cbba5',639278671,'53fbcfce106008b2951e45bf3db1bef6bcd4910a3bff9864bf497f544c3a2d56')]
          results={}
          def fetch(i):
              return subprocess.check_output(['gh','api',f'repos/{os.environ["GITHUB_REPOSITORY"]}/releases/assets/{i}','-H','Accept: application/octet-stream'])
          for profile,aid,size,digest,sid,logsha in sources:
              raw=fetch(aid)
              assert len(raw)==size and hashlib.sha256(raw).hexdigest()==digest
              summaryraw=fetch(sid); summary=json.loads(summaryraw)
              assert summary['profile']==profile and summary['status']=='COMPLETE_UNPLACED_SCREEN_NOT_TIMING_CLOSURE'
              assert summary['screen_result']['outputs']['screen.log']==logsha
              name=f'cloud-ack-map/{profile}/screen05/screen.log'
              with tarfile.open(fileobj=io.BytesIO(raw)) as tf:
                  hits=[m for m in tf if m.name==name]
                  assert len(hits)==1 and hits[0].isfile() and hits[0].size<20000000
                  log=tf.extractfile(hits[0]).read()
                  mapped_raw=None
                  if os.environ['TRACE_ENDPOINTS'] in ('trace_control_endpoints','read_static_reports'):
                      mapping_name=f'cloud-ack-map/{profile}/map/soc_top.mapped.json'
                      members=[m for m in tf if m.name==mapping_name]
                      assert len(members)==1 and members[0].isfile() and members[0].size<300000000
                      mapped_raw=tf.extractfile(members[0]).read()
              assert hashlib.sha256(log).hexdigest()==logsha
              (out/(profile+'.log')).write_bytes(log)
              text=log.decode()
              prefixes=[p for p in ('CORNER','PHASE') if re.search(r'^'+p+r'_\w+[ 	]*$',text,re.M)]
              assert len(prefixes)==1, prefixes
              phases=parse_phases(text,prefixes[0])
              assert len(phases)>=6
              assert {p['path_type'] for v in phases.values() for p in v['paths']}=={'min','max'}
              assert len({p['corner'] for v in phases.values() for p in v['paths']})==3
              results[profile]=dict(archive_asset=aid,archive_sha256=digest,summary_asset=sid,summary_sha256=hashlib.sha256(summaryraw).hexdigest(),log_sha256=logsha,mapped_cells=summary['mapped_cells'],phases=phases)
              if mapped_raw is not None:
                  mapped=json.loads(mapped_raw)['modules']['soc_top']
                  assert len(mapped['cells'])==summary['mapped_cells']
                  endpoint_names={p['endpoint'] for phase in phases.values() for p in phase['paths'] if p['group']=='pcie_clk_i'}
                  # Exact Yosys register names survive the saved OpenROAD repair.
                  # Never substitute fuzzy aliases or silently skip an endpoint.
                  endpoints={}
                  for name in sorted(endpoint_names):
                      assert name in mapped['cells'], ('Unbound reported endpoint',name)
                      cell=mapped['cells'][name]
                      assert cell['type'].startswith('sg13g2_df'), cell
                      connections=cell['connections']; bits={bit for row in connections.values() for bit in row if isinstance(bit,int)}
                      aliases={str(bit):[] for bit in bits}
                      for net,record in mapped['netnames'].items():
                          for index,bit in enumerate(record['bits']):
                              if bit in bits:
                                  aliases[str(bit)].append(dict(net=net,bit_index=index,attributes=record.get('attributes',{})))
                      assert all(aliases[str(bit)] for bit in bits)
                      endpoints[name]=dict(master=cell['type'],attributes=cell.get('attributes',{}),connections=connections,bit_aliases=aliases)
                  results[profile]['reported_pcie_endpoints']=endpoints
                  results[profile]['mapped_json_sha256']=hashlib.sha256(mapped_raw).hexdigest()
          base=results['physical_idle_credit']['phases']; cand=results[candidate_profile]['phases']
          assert base.keys()==cand.keys()
          differences={}
          for phase in base:
              assert base[phase]['groups'].keys()==cand[phase]['groups'].keys()
              differences[phase]={g:dict(baseline_ns=base[phase]['groups'][g]['worst_slack_ns'],candidate_ns=cand[phase]['groups'][g]['worst_slack_ns'],candidate_minus_baseline_ns=cand[phase]['groups'][g]['worst_slack_ns']-base[phase]['groups'][g]['worst_slack_ns']) for g in base[phase]['groups']}
          result=dict(status='COMPLETE_EXACT_PAIRED_REPORTED_SLACK_READBACK_NOT_SIGNOFF',source_run=source_run,timing_accepted=False,adopted=False,scope='Original unplaced three-corner reports only; all reported groups preserved. No routing or signoff acceptance.',sources=results,differences=differences)
          (out/'result.json').write_text(json.dumps(result,indent=2)+'\n')
          print(json.dumps(differences,indent=2))
          PYCODE
      - name: Retain original reports and readback
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: control-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: cloud-control-reports/
          if-no-files-found: error
      - name: Permanently preserve readback
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/publish_cloud_results.py --group '${{ inputs.study == 'read_static_reports' && 'static-reports' || inputs.study == 'trace_control_endpoints' && 'control-endpoints' || 'control-reports' }}' cloud-control-reports/result.json cloud-control-reports/*.log
