# SPDX-License-Identifier: Apache-2.0
# Nonregistered, manual-only template; controls never read the large archive.
name: mainchip-route12-recovery-publication-cloud
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: mainchip-route12-recovery-publication-${{ github.ref }}
  cancel-in-progress: false
jobs:
  controls:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify exact proofs and publication transport controls only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 scripts/cloud_mainchip_route12_recovery_publication.py --controls
          python3 - <<'PYCODE'
          import json
          from pathlib import Path
          r=json.loads(Path('cloud-mainchip-route12-recovery-publication/publication-repair.json').read_text())
          assert r['status']=='PASS_PUBLICATION_REPAIR_CONTROLS_NO_ARCHIVE_READ'
          assert r['publication_controls']['status']=='PASS_PUBLICATION_PLAN_OUTER_ARCHIVE_AND32_FAULTS'
          assert len(r['publication_controls']['rejected'])==32
          assert len(r['original_transport_controls']['rejected'])==29
          assert len(r['release_controls']['rejected'])==17
          assert r['native_execution'] is False and r['route_complete'] is False
          PYCODE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: mainchip-route12-publication-controls
          path: cloud-mainchip-route12-recovery-publication/publication-repair.json
          if-no-files-found: error
          retention-days: 90
  publication:
    needs: controls
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Require precreated exact-source release before any large read
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          PYTHONPATH=scripts python3 - <<'PYCODE'
          import json,os
          from ensure_cloud_tested_source_release import context,api,validate_release
          tag,sha=context('mainchip-route12-recovery-publication',os.environ)
          print(json.dumps(validate_release(api('releases/tags/'+tag),api('git/ref/tags/'+tag),tag,sha)))
          PYCODE
      - name: Republish exact recovered evidence and explicit empty-file inventory
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 scripts/cloud_mainchip_route12_recovery_publication.py --republish
          python3 - <<'PYCODE'
          import json
          from pathlib import Path
          r=json.loads(Path('cloud-mainchip-route12-recovery-publication/publication-repair.json').read_text())
          assert r['status']=='PASS_REPUBLISHED_EXACT65_MEMBER_ARCHIVE_AND_EMPTY_INVENTORY_ROUTING_STILL_REJECTED'
          assert r['outer_restore']['files']==40 and r['outer_restore']['all_outer_CRC_and_member_hashes_verified']
          assert r['original_archive_proof']['inner_process_image_not_decoded_or_rescanned']
          assert r['publication_plan']['empty_standalone_uploads']==0
          assert r['native_execution'] is False and r['route_complete'] is False
          PYCODE
      - name: Preserve exact small publication result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mainchip-route12-publication-result
          path: |
            cloud-mainchip-route12-recovery-publication/publication-repair.json
            cloud-mainchip-route12-recovery-publication/restored/empty-file-inventory.json
          if-no-files-found: error
          retention-days: 90
      - name: Preserve all restored bytes after any publication failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mainchip-route12-publication-fallback
          path: cloud-mainchip-route12-recovery-publication/
          if-no-files-found: error
          retention-days: 90
