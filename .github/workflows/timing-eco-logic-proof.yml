name: timing-eco-logic-proof
on:
  push:
    paths:
      - .github/workflows/timing-eco-logic-proof.yml
  workflow_dispatch:
    inputs:
      trial:
        description: Immutable completed candidate to prove against original C10
        required: true
        default: xor_36990647399
        type: choice
        options:
          - xor_36990647399
permissions:
  contents: read
  actions: read
concurrency:
  group: timing-eco-logic-proof-${{ github.ref }}
  cancel-in-progress: false
jobs:
  prove:
    runs-on: ubuntu-22.04
    timeout-minutes: 360 # Hosted ceiling; no native elapsed-time watchdog.
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      TRIAL: ${{ inputs.trial || 'xor_36990647399' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0 # Original captured validators are checked against their Git blobs.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Pure provenance and proof contract tests before large inputs
        run: |
          python3 -m pip install pytest==8.4.2
          python3 -m pytest -q sw/tests/test_cloud_eco_logic_proof.py sw/tests/test_check_eco_logic_clones.py sw/tests/test_eco_logic.py sw/tests/test_eco_logic_clones.py
      - name: Install AppImage runtime prerequisite
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libfuse2
      - name: Revalidate original capture and prove restricted logical ECO contract
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/run_cloud_eco_logic_proof.py --trial "$TRIAL" \
            --output "$GITHUB_WORKSPACE/eco-logic-result" --work "$GITHUB_WORKSPACE/eco-logic-work"
      - name: Preserve native proof, source pins and any failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: eco-logic-proof-${{ github.run_attempt }}
          path: eco-logic-result/
          include-hidden-files: true
          if-no-files-found: error
          compression-level: 1
          retention-days: 30
