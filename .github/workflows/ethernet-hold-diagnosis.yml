name: ethernet-hold-diagnosis
on:
  push:
    branches: ['codex/complete-open-work']
    paths:
      - .github/workflows/ethernet-hold-diagnosis.yml
      - scripts/diagnose_cloud_ethernet_hold.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Inspect exact rejected full-chip ECO connectivity
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/diagnose_cloud_ethernet_hold.py
