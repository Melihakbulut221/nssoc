name: replay-crc-placement-cloud
on:
  push:
    branches: [codex/complete-open-work]
    paths: [.github/workflows/replay-crc-placement-cloud.yml]
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: replay-crc-placement-${{ github.ref }}
  cancel-in-progress: false
jobs:
  source-ready:
    runs-on: ubuntu-24.04
    timeout-minutes: 310
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Wait for exact native sources without restarting them
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -m py_compile scripts/cloud_replay_crc_handoff.py scripts/check_pcie_residue_banked_boot_source.py scripts/preserve_replay_crc_boot_evidence.py
          python3 scripts/cloud_replay_crc_handoff.py --wait
      - name: Preserve exact observation including terminal failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: replay-crc-source-wait-${{ github.run_id }}
          path: cloud-replay-crc-handoff/
          retention-days: 30
  native-placement:
    needs: source-ready
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Revalidate exact source jobs, native proofs and actual boot artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/cloud_replay_crc_handoff.py
      - name: Publish original archive and source-bound receipt
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p cloud-corrpre-pcie-mbist-boot-evidence
          if [ ! -f cloud-corrpre-pcie-mbist-boot-evidence/result.json ]; then
            printf '%s\n' '{"status":"FAIL_MISSING_REPORT","accepted":false}' > cloud-corrpre-pcie-mbist-boot-evidence/result.json
          fi
          stem="replay-crc-boot-evidence-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          cp cloud-corrpre-pcie-mbist-boot-evidence/result.json "$stem.summary.json"
          python3 scripts/cloud_chunked_results.py --directory cloud-corrpre-pcie-mbist-boot-evidence --stem "$stem"
          python3 - "$stem" <<'PYCODE'
          import json,subprocess,sys
          stem=sys.argv[1];manifest=stem+'.parts.json';m=json.load(open(manifest))
          subprocess.run([sys.executable,'scripts/publish_cloud_results.py','--group','replay-crc-boot-evidence',stem+'.summary.json',manifest,*[p['name']for p in m['parts']]],check=True)
          PYCODE
      - name: Prepare exact physical runtime
        run: |
          python3 -m py_compile scripts/cloud_corrpre_mbist_placement.py
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libfuse2
          python3 scripts/bootstrap_flow.py
          echo "CLOUD_APPIMAGE=$GITHUB_WORKSPACE/hw/soc/tools/physical/librelane-3.0.5-x86_64.AppImage" >> "$GITHUB_ENV"
      - name: Native floorplan placement and CTS of exact boot-proven netlist
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/cloud_corrpre_mbist_placement.py --source-spec cloud-replay-crc-handoff/verified-boot-source.json
      - name: Preserve native stage and failures permanently
        if: always()
        id: publish_native
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p hw/soc/out/cloud-corrpre-mbist-placement
          if [ ! -f hw/soc/out/cloud-corrpre-mbist-placement/result.json ]; then
            printf '%s\n' '{"status":"FAIL_MISSING_REPORT","accepted":false}' > hw/soc/out/cloud-corrpre-mbist-placement/result.json
          fi
          stem="replay-crc-placement-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          cp hw/soc/out/cloud-corrpre-mbist-placement/result.json "$stem.summary.json"
          python3 scripts/cloud_chunked_results.py --directory hw/soc/out/cloud-corrpre-mbist-placement --stem "$stem"
          python3 - "$stem" <<'PYCODE'
          import json,subprocess,sys
          stem=sys.argv[1];manifest=stem+'.parts.json';m=json.load(open(manifest))
          subprocess.run([sys.executable,'scripts/publish_cloud_results.py','--group','replay-crc-placement',stem+'.summary.json',manifest,*[p['name']for p in m['parts']]],check=True)
          PYCODE
      - name: Retain evidence if permanent publication fails
        if: always() && steps.publish_native.outcome == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: corrpre-mbist-placement-${{ github.run_id }}
          retention-days: 30
          path: hw/soc/out/cloud-corrpre-mbist-placement/
