name: Current contact DC resistor network cloud screen
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Controls or complete DC-only contact screen of existing derived evidence
        type: choice
        required: true
        default: controls
        options: [controls, screen]
permissions:
  contents: read
  actions: read
concurrency:
  group: cdr-dc-contact-${{ github.ref }}
  cancel-in-progress: false
env:
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  source-controls:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Bind exact source and existing derived input
        run: |
          python3 -B - <<'PY'
          import hashlib,json,os,subprocess
          from pathlib import Path
          e=os.environ
          assert e['GITHUB_ACTIONS']=='true' and e['RUNNER_OS']=='Linux'
          assert e['GITHUB_REPOSITORY']=='Melihakbulut221/nssoc'
          assert e['GITHUB_EVENT_NAME']=='workflow_dispatch' and e['GITHUB_RUN_ATTEMPT']=='1'
          assert e['GITHUB_REF']=='refs/heads/codex/cdr-current-dc-contact-screen'
          assert subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()==e['GITHUB_SHA']
          pins=json.loads("{\"scripts/cdr_current_dc_contacts.py\":{\"bytes\":19906,\"sha256\":\"b22629a354544fd810a14dc0b11749d76fdc3fbeb0552f090fc925779f4a086f\"},\"scripts/check_cdr_current_dc_contacts.py\":{\"bytes\":15992,\"sha256\":\"d9e2dfd92468142063b5f7db25d737045adce881d14feb33e644f5504e033c8b\"},\"scripts/cdr-current-dc-contact-inputs.json\":{\"bytes\":9148,\"sha256\":\"990d9d58c8a1d8060ce02b6f0da6354c7b57cbe29244c8e5e6c63267368604da\"},\"docs/evidence/cdr-current-dc-contact-screen-source-review-20261029.json\":{\"bytes\":9141,\"sha256\":\"b8f0127f2ea7fab90ae2e4257deaa73be4f5446d8b16a920f5f817c27a44ad80\"}}")
          for name,pin in pins.items():
              p=Path(name);assert p.is_file() and not p.is_symlink()
              raw=p.read_bytes()
              assert dict(bytes=len(raw),sha256=hashlib.sha256(raw).hexdigest())==pin
          out=Path('dc-contact-controls');out.mkdir(exist_ok=True)
          (out/'context.json').write_text(json.dumps(dict(source=e['GITHUB_SHA'],run=int(e['GITHUB_RUN_ID']),attempt=1,native_acquisition=False,physical_acceptance=False,timing_accepted=False,full_phy_accepted=False,pins=pins),sort_keys=True,indent=2)+'\n')
          PY
      - name: Run analytic resistor network and failure controls
        run: python3 -B scripts/check_cdr_current_dc_contacts.py --output dc-contact-controls/controls.json > dc-contact-controls/controls.stdout 2> dc-contact-controls/controls.stderr
      - name: Require actual complete controls
        run: |
          python3 -B - <<'PY'
          import json,os
          from pathlib import Path
          r=json.loads(Path('dc-contact-controls/controls.json').read_bytes())
          assert r['status']=='PASS_CURRENT_DC_CONTACT_SOURCE_CONTROLS'
          assert r['counts']==dict(positive=10,refusal=52,lifecycle=5)
          assert r['authentic_input_bytes_verified'] is True
          assert r['all_computed_networks_synthetic'] is True and r['authentic_network_solve_executed'] is False
          assert r['current_context']['source']==os.environ['GITHUB_SHA']
          assert r['current_context']['run_id']==int(os.environ['GITHUB_RUN_ID']) and r['current_context']['attempt']==1
          assert all(r[k] is False for k in ('native_archive_acquired','native_CAD_executed','physical_acceptance','electrical_acceptance','full_phy_accepted'))
          PY
      - name: Always emit complete controls
        if: always()
        run: |
          python3 -B - <<'PY'
          import base64,hashlib,json
          from pathlib import Path
          for name in ('context.json','controls.json','controls.stdout','controls.stderr'):
              p=Path('dc-contact-controls')/name;assert not p.is_symlink()
              raw=p.read_bytes() if p.is_file() else b''
              chunks=[raw[i:i+6000]for i in range(0,len(raw),6000)]
              print('CURRENT_DC_CONTROL_INDEX '+json.dumps(dict(path=name,present=p.is_file(),bytes=len(raw),sha256=hashlib.sha256(raw).hexdigest(),chunks=len(chunks)),sort_keys=True))
              for i,b in enumerate(chunks):
                  print('CURRENT_DC_CONTROL_CHUNK '+json.dumps(dict(path=name,index=i,base64=base64.b64encode(b).decode()),sort_keys=True))
          PY
      - name: Preserve complete controls
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dc-contact-controls-${{ github.run_id }}-${{ github.run_attempt }}
          path: dc-contact-controls
          if-no-files-found: error
          retention-days: 90
  preserve-job-log:
    needs: source-controls
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Preserve full actual source job log and metadata
        run: |
          python3 -B - <<'PY'
          import hashlib,json,os,subprocess
          from pathlib import Path
          root=Path('job-logs');root.mkdir()
          e=os.environ
          assert e['GITHUB_REPOSITORY']=='Melihakbulut221/nssoc' and e['GITHUB_RUN_ATTEMPT']=='1'
          prefix='repos/'+e['GITHUB_REPOSITORY']+'/'
          def read(path,name):
              b=subprocess.check_output(['gh','api',prefix+path]);(root/name).write_bytes(b);return json.loads(b)
          run=read('actions/runs/'+e['GITHUB_RUN_ID'],'run.json')
          assert run['head_sha']==e['GITHUB_SHA'] and run['run_attempt']==1
          jobs=read('actions/runs/'+e['GITHUB_RUN_ID']+'/attempts/1/jobs?per_page=100','jobs.json')
          selected=[j for j in jobs['jobs'] if j['name']=='source-controls'];assert len(selected)==1
          j=selected[0];assert j['status']=='completed' and j['head_sha']==e['GITHUB_SHA']
          read('actions/jobs/'+str(j['id']),'job.json')
          b=subprocess.check_output(['gh','api','--allow-escape-sequences',prefix+'actions/jobs/'+str(j['id'])+'/logs'])
          assert b;(root/'job.log').write_bytes(b)
          receipt=dict(source=e['GITHUB_SHA'],run_id=int(e['GITHUB_RUN_ID']),attempt=1,
            job_id=j['id'],job_conclusion=j['conclusion'],full_raw_job_log=True,
            log_bytes=len(b),log_sha256=hashlib.sha256(b).hexdigest(),native_acquisition=False)
          (root/'receipt.json').write_text(json.dumps(receipt,sort_keys=True,indent=2)+'\n')
          print(json.dumps(receipt,sort_keys=True))
          PY
      - name: Preserve complete actual logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dc-contact-source-job-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: job-logs
          if-no-files-found: error
          retention-days: 90

  screen:
    needs: [source-controls, preserve-job-log]
    if: ${{ inputs.mode == 'screen' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Recheck source identity before derived-only computation
        run: |
          python3 -B - <<'PY'
          import hashlib,json,os,subprocess
          from pathlib import Path
          e=os.environ
          assert e['GITHUB_ACTIONS']=='true' and e['RUNNER_OS']=='Linux'
          assert e['GITHUB_REPOSITORY']=='Melihakbulut221/nssoc'
          assert e['GITHUB_EVENT_NAME']=='workflow_dispatch' and e['GITHUB_RUN_ATTEMPT']=='1'
          assert e['GITHUB_REF']=='refs/heads/codex/cdr-current-dc-contact-screen'
          assert subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()==e['GITHUB_SHA']
          pins=json.loads("{\"scripts/cdr_current_dc_contacts.py\":{\"bytes\":19906,\"sha256\":\"b22629a354544fd810a14dc0b11749d76fdc3fbeb0552f090fc925779f4a086f\"},\"scripts/check_cdr_current_dc_contacts.py\":{\"bytes\":15992,\"sha256\":\"d9e2dfd92468142063b5f7db25d737045adce881d14feb33e644f5504e033c8b\"},\"scripts/cdr-current-dc-contact-inputs.json\":{\"bytes\":9148,\"sha256\":\"990d9d58c8a1d8060ce02b6f0da6354c7b57cbe29244c8e5e6c63267368604da\"},\"docs/evidence/cdr-current-dc-contact-screen-source-review-20261029.json\":{\"bytes\":9141,\"sha256\":\"b8f0127f2ea7fab90ae2e4257deaa73be4f5446d8b16a920f5f817c27a44ad80\"}}")
          for name,pin in pins.items():
              p=Path(name);assert p.is_file() and not p.is_symlink()
              raw=p.read_bytes()
              assert dict(bytes=len(raw),sha256=hashlib.sha256(raw).hexdigest())==pin
          out=Path('dc-contact-controls');out.mkdir(exist_ok=True)
          (out/'context.json').write_text(json.dumps(dict(source=e['GITHUB_SHA'],run=int(e['GITHUB_RUN_ID']),attempt=1,native_acquisition=False,physical_acceptance=False,timing_accepted=False,full_phy_accepted=False,pins=pins),sort_keys=True,indent=2)+'\n')
          PY
      - name: Solve complete current DC contact networks
        run: python3 -B scripts/cdr_current_dc_contacts.py --output dc-contact-evidence > dc-contact.stdout 2> dc-contact.stderr
      - name: Require complete original networks and explicit DC scope
        run: |
          python3 -B - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          root=Path('dc-contact-evidence')
          r=json.loads((root/'result.json').read_bytes())
          assert r['status']=='PASS_CURRENT_DC_CONTACT_SCREEN_NOT_ELECTRICAL_ACCEPTANCE'
          assert r['context']['source']==os.environ['GITHUB_SHA'] and r['context']['run_id']==int(os.environ['GITHUB_RUN_ID'])
          assert r['context']['attempt']==1 and r['DC_analysis_only'] is True
          assert set(r['networks'])=={'28','124'}
          for key,pin in r['networks'].items():
              raw=(root/pin['file']).read_bytes();n=json.loads(raw)
              assert len(raw)==pin['bytes'] and hashlib.sha256(raw).hexdigest()==pin['sha256']
              assert (pin['node_count'],pin['contact_count'],pin['basis_count'],pin['pair_count'])==(102,8,7,28)
              assert len(n['capacitors_open_for_DC_only'])==114
              assert n['capacitor_omission_is_not_valid_for_original_transient'] is True and n['DC_analysis_only'] is True
              for case in n['reference_unit_injections']+n['pair_unit_injections']:
                  assert len(case['node_voltages_V'])==102 and len(case['edge_responses'])==145
              assert all(n[k] is False for k in ('native_archive_acquired','native_CAD_executed','geometry_changed','transient_recovery_proven','geometric_bridge_attribution_proven','physical_acceptance','electrical_acceptance','full_phy_accepted'))
          for name,pin in r['available_outputs'].items():
              raw=(root/name).read_bytes()
              assert len(raw)==pin['bytes'] and hashlib.sha256(raw).hexdigest()==pin['sha256']
          PY
      - name: Always emit complete results and failure output
        if: always()
        run: |
          python3 -B - <<'PY'
          import sys
          from pathlib import Path
          for name in ('dc-contact.stdout','dc-contact.stderr'):
              p=Path(name)
              if p.is_file():
                  sys.stdout.buffer.write(p.read_bytes());sys.stdout.buffer.write(b'\n')
          PY
      - name: Preserve complete derived outputs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dc-contact-screen-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 90
          path: |
            dc-contact-evidence
            dc-contact.stdout
            dc-contact.stderr
            dc-contact-controls
