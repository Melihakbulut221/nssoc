name: corrpre-boot-evidence-cloud
on:
  push:
    branches: [codex/complete-open-work]
    paths: [.github/workflows/corrpre-boot-evidence-cloud.yml]
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: corrpre-boot-evidence-${{ github.ref }}
  cancel-in-progress: false
jobs:
  archive-completed-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Preserve exact completed artifact and inspect actual verdicts
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/preserve_corrpre_boot_evidence.py
      - name: Publish original archive and source-bound receipt
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p cloud-corrpre-boot-evidence
          if [ ! -f cloud-corrpre-boot-evidence/result.json ]; then
            printf '%s\n' '{"status":"FAIL_MISSING_REPORT","accepted":false}' > cloud-corrpre-boot-evidence/result.json
          fi
          stem="corrpre-boot-evidence-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          cp cloud-corrpre-boot-evidence/result.json "$stem.summary.json"
          python3 scripts/cloud_chunked_results.py --directory cloud-corrpre-boot-evidence --stem "$stem"
          python3 - "$stem" <<'PYCODE'
          import json,subprocess,sys
          stem=sys.argv[1];manifest=stem+'.parts.json';m=json.load(open(manifest))
          subprocess.run([sys.executable,'scripts/publish_cloud_results.py','--group','corrpre-boot-evidence',stem+'.summary.json',manifest,*[p['name']for p in m['parts']]],check=True)
          PYCODE
