name: tx-phase-analysis-cloud
on:
  push:
    branches: ['codex/complete-open-work']
    paths:
      - .github/workflows/tx-phase-analysis-cloud.yml
      - scripts/analyze_cloud_tx_phases.py
      - docs/evidence/pcie-tx-cloud-phase-input-20261013.json
  workflow_dispatch:
permissions:
  contents: read
jobs:
  phase-diagnosis:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        variant: [baseline, topmetal_trunks, topmetal_trunks_narrow_bus]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python3 -m pip install numpy==2.3.3
      - name: Diagnose original failed samples and crossings without resampling acceptance
        run: python3 scripts/analyze_cloud_tx_phases.py --variant '${{ matrix.variant }}'
      - name: Preserve diagnostic report including failures
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          report='tx-phase-${{ matrix.variant }}-${{ github.run_id }}-${{ github.run_attempt }}.json'
          cp cloud-tx-phase-analysis/result.json "$report"
          sha256sum "$report" > "$report.sha256"
          gh release upload cloud-migration-20261012-000 "$report" "$report.sha256"
