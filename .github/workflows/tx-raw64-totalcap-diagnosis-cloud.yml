name: tx-raw64-totalcap-diagnosis-cloud
on:
  push:
    branches: [codex/complete-open-work]
    paths: [.github/workflows/tx-raw64-totalcap-diagnosis-cloud.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tx-raw64-totalcap-diagnosis-${{ github.ref }}
  cancel-in-progress: false
jobs:
  native-total-load-diagnosis:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Prepare immutable source evidence reader
        run: |
          python3 -m py_compile scripts/cloud_tx_raw64_totalcap_diagnosis.py
      - name: Reproduce native total-load arithmetic against immutable full8074 RC evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/cloud_tx_raw64_totalcap_diagnosis.py
      - name: Publish physical success or failure evidence
        if: always()
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p hw/soc/out/cloud-tx-raw64-totalcap-diagnosis
          if [ ! -f hw/soc/out/cloud-tx-raw64-totalcap-diagnosis/result.json ]; then
            printf '%s\n' '{"status":"FAIL_MISSING_REPORT","accepted":false}' > hw/soc/out/cloud-tx-raw64-totalcap-diagnosis/result.json
          fi
          stem="tx-raw64-totalcap-diagnosis-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          cp hw/soc/out/cloud-tx-raw64-totalcap-diagnosis/result.json "$stem.summary.json"
          python3 scripts/cloud_chunked_results.py --directory hw/soc/out/cloud-tx-raw64-totalcap-diagnosis --stem "$stem"
          python3 - "$stem" <<'PYCODE'
          import json,subprocess,sys
          stem=sys.argv[1];manifest=stem+'.parts.json';m=json.load(open(manifest))
          subprocess.run([sys.executable,'scripts/publish_cloud_results.py','--group','tx-raw64-totalcap-diagnosis',stem+'.summary.json',manifest,*[p['name']for p in m['parts']]],check=True)
          PYCODE
      - name: Retain evidence after publication failure
        if: always() && steps.publish.outcome == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tx-raw64-totalcap-diagnosis-${{ github.run_id }}
          retention-days: 30
          path: hw/soc/out/cloud-tx-raw64-totalcap-diagnosis/
