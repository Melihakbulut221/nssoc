# Activate once after independent source review of 5dfa08dbb09cf4ffb6c04461c24417991538943f.
# SPDX-License-Identifier: Apache-2.0
name: cdr500-v58-binding-rc-cloud
on:
  push:
    branches: [codex/cdr500-floating-wire-diagnosis]
    paths: [.github/workflows/cdr500-v58-binding-rc-cloud.yml, scripts/cloud_cdr500_v58_binding.py, scripts/cloud_cdr500_v58_rc.py, scripts/build_cdr500_cleaned_native_models.py, scripts/cdr500_v58_source.py, scripts/cdr500-v58-extraction-methods.json]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cdr500-v58-binding-rc-${{ github.ref }}
  cancel-in-progress: false
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        stage: [binding, rc]
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Compile and verify physically qualified v58 source and method contracts
        run: |
          python3 -m py_compile scripts/cdr500_v58_source.py scripts/build_cdr500_cleaned_native_models.py scripts/cloud_cdr500_v58_binding.py scripts/cloud_cdr500_v58_rc.py scripts/cloud_cdr500_v58_stage.py
          python3 scripts/cdr500_v58_source.py
      - name: Restore pinned native CAD runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libfuse2 tcl8.6 tk8.6
          python3 -m pip install networkx==3.4.2
          curl --fail --location --retry 4 https://github.com/librelane/librelane/releases/download/3.0.5/librelane-devshell-x86_64.AppImage -o "$RUNNER_TEMP/librelane.AppImage"
          echo "d6a349ec65be11456e96c4981d35f63ca34d3c85daf79a51e1ccb907bb5d7466  $RUNNER_TEMP/librelane.AppImage" | sha256sum --check
          chmod +x "$RUNNER_TEMP/librelane.AppImage"
          echo "CLOUD_APPIMAGE=$RUNNER_TEMP/librelane.AppImage" >> "$GITHUB_ENV"
      - name: Native bound stage and immutable publication
        id: native
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/cloud_cdr500_v58_stage.py --stage ${{ matrix.stage }}
      - name: Preserve stage after failure
        if: always() && steps.native.outcome == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cdr500-v58-${{ matrix.stage }}-${{ github.run_id }}
          path: |
            hw/soc/out/cloud-cdr500-*/
            cdr500-v58-*.json
          retention-days: 30
