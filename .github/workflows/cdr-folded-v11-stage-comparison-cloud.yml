# SPDX-License-Identifier: Apache-2.0
name: cdr-folded-v11-stage-comparison-cloud
on:
  push:
    branches: [codex/complete-open-work]
    paths: [.github/workflows/cdr-folded-v11-stage-comparison-cloud.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cdr-folded-v11-stage-comparison
  cancel-in-progress: false
jobs:
  native-reports:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Trace native sampler master slave selector and tail networks from saved reports
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -m py_compile scripts/cloud_cdr_folded_v11_stage_comparison.py
          python3 scripts/cloud_cdr_folded_v11_stage_comparison.py
      - name: Publish complete reports and review failures
        if: always()
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          root=hw/soc/out/cloud-cdr-folded-v11-stage-comparison
          mkdir -p "$root"
          if [ ! -f "$root/result.json" ]; then
            printf '%s\n' '{"status":"FAIL_MISSING_REPORT","accepted":false}' > "$root/result.json"
          fi
          stem="cdr-folded-v11-stage-comparison-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          cp "$root/result.json" "$stem.summary.json"
          python3 scripts/cloud_chunked_results.py --directory "$root" --stem "$stem"
          python3 - "$stem" <<'PYCODE'
          import json,subprocess,sys
          stem=sys.argv[1];manifest=stem+'.parts.json';m=json.load(open(manifest))
          subprocess.run([sys.executable,'scripts/publish_cloud_results.py','--group','cdr-folded-v11-stage-comparison',stem+'.summary.json',manifest,*[p['name']for p in m['parts']]],check=True)
          PYCODE
      - name: Preserve unpublished evidence
        if: always() && steps.publish.outcome == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cdr-folded-v11-stage-comparison-${{ github.run_id }}
          path: hw/soc/out/cloud-cdr-folded-v11-stage-comparison/
          retention-days: 30
