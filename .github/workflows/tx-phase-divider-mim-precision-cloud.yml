# SPDX-License-Identifier: Apache-2.0
name: tx-phase-divider-mim-precision-cloud
on:
  push:
    branches: [codex/tx-clock-phase-parent]
    paths: [.github/workflows/tx-phase-divider-mim-precision-cloud.yml, scripts/cloud_tx_phase_divider_mim_precision.py, scripts/audit_tx_phase55_mim_intrinsic.py, scripts/tx-phase-divider-mim-precision-methods.json]
  workflow_dispatch:
    inputs:
      source_summary_sha256:
        description: Exact successful native intrinsic/MIM run40084804265 summary SHA256
        required: true
        type: string
      source_parts_sha256:
        description: Exact complete publication parts SHA256 for the same run
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: tx-phase-divider-mim-precision-${{ github.ref }}
  cancel-in-progress: false
jobs:
  controls:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Check exact source derivations and retained conservation gates
        run: |
          python3 -m pip install networkx==3.4.2
          python3 -m py_compile scripts/cloud_tx_phase_divider_mim_precision.py scripts/audit_tx_phase55_mim_intrinsic.py
          python3 scripts/cloud_tx_phase_divider_mim_precision.py --controls
  native:
    if: github.event_name == 'workflow_dispatch'
    needs: controls
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Restore native runtime dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends tcl8.6 tk8.6 tcl-dev tk-dev build-essential m4 autoconf libreadline-dev libx11-dev libxext-dev libxpm-dev libxt-dev libcairo2-dev libgl1-mesa-dev libglu1-mesa-dev
          python3 -m pip install networkx==3.4.2
      - name: Verify prerequisite and run both native orders with raw and composition controls
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SUMMARY: ${{ inputs.source_summary_sha256 }}
          SOURCE_PARTS: ${{ inputs.source_parts_sha256 }}
        run: python3 scripts/cloud_tx_phase_divider_mim_precision.py --summary "$SOURCE_SUMMARY" --parts "$SOURCE_PARTS"
      - name: Publish every native result or rejection
        if: always()
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PYCODE'
          import json,os,pathlib,subprocess,sys
          root=pathlib.Path('hw/soc/out/cloud-tx-phase-divider-mim-precision');root.mkdir(parents=True,exist_ok=True)
          result=root/'result.json'
          if not result.exists():result.write_text(json.dumps(dict(status='FAIL_MISSING_REPORT',accepted=False,source_head=os.environ['GITHUB_SHA']))+'\n')
          group='tx-phase-divider-mim-precision';stem=group+'-'+os.environ['GITHUB_RUN_ID']+'-'+os.environ['GITHUB_RUN_ATTEMPT']
          summary=pathlib.Path(stem+'.summary.json');summary.write_bytes(result.read_bytes())
          subprocess.run([sys.executable,'scripts/cloud_chunked_results.py','--directory',str(root),'--stem',stem],check=True)
          manifest=pathlib.Path(stem+'.parts.json');parts=json.loads(manifest.read_text())
          subprocess.run([sys.executable,'scripts/publish_cloud_results.py','--group',group,str(summary),str(manifest),*[p['name']for p in parts['parts']]],check=True)
          PYCODE
      - name: Retain evidence if publication fails
        if: always() && steps.publish.outcome == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tx-phase-divider-mim-precision-${{ github.run_id }}
          path: hw/soc/out/cloud-tx-phase-divider-mim-precision/
          retention-days: 30
