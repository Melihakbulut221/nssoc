name: onehot-resize-report-review-cloud
on:
  push:
    branches: [codex/complete-open-work]
    paths: [.github/workflows/onehot-resize-report-review-cloud.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: onehot-resize-report-review-${{ github.ref }}
  cancel-in-progress: false
jobs:
  native-reports:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Compile read-only report reviewer
        run: python3 -m py_compile scripts/cloud_onehot_resize_report_review.py
      - name: Read exact saved native route logs and states
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/cloud_onehot_resize_report_review.py
      - name: Preserve physical results and failures
        if: always()
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          root=hw/soc/out/cloud-onehot-resize-report-review
          mkdir -p "$root"
          if [ ! -f "$root/result.json" ]; then
            printf '%s\n' '{"status":"FAIL_MISSING_REPORT","accepted":false}' > "$root/result.json"
          fi
          stem="onehot-resize-report-review-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          cp "$root/result.json" "$stem.summary.json"
          python3 scripts/cloud_chunked_results.py --directory "$root" --stem "$stem"
          python3 - "$stem" <<'PYCODE'
          import json,subprocess,sys
          stem=sys.argv[1];manifest=stem+'.parts.json';m=json.load(open(manifest))
          subprocess.run([sys.executable,'scripts/publish_cloud_results.py','--group','onehot-resize-report-review',stem+'.summary.json',manifest,*[p['name']for p in m['parts']]],check=True)
          PYCODE
      - name: Retain evidence after publication failure
        if: always() && steps.publish.outcome == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: onehot-resize-report-review-${{ github.run_id }}
          path: hw/soc/out/cloud-onehot-resize-report-review/
          retention-days: 30

