# Disabled source template. Registration and each execution require separate reviewed activation.
name: CDR v59 fresh tail binding RC and MIM
on:
  workflow_dispatch:
    inputs:
      extract:
        description: Run the separately authorized saved-geometry fresh binding and RC pipeline
        type: boolean
        required: true
        default: false
permissions:
  contents: read
  actions: read
concurrency:
  group: cdr-v59-tail-fresh-rc-${{ github.ref }}
  cancel-in-progress: false
env:
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  source-controls:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Require exact reviewed source-control activation
        run: |
          python - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0,'scripts')
          import cdr_v59_tail_fresh_rc_admission as s
          assert s.methods()['source_controls_authorized'] is True
          Path('hw/soc/out/cdr-v59-tail-fresh-rc-controls').mkdir(parents=True,exist_ok=False)
          PY
      - name: Install the original pinned parser dependency for isolated import controls
        run: python -m pip install networkx==3.4.2
      - name: Exact 63-module and three-data isolated imports with declared raw-parser imports
        run: python scripts/check_cdr_v59_tail_fresh_rc_imports.py --output hw/soc/out/cdr-v59-tail-fresh-rc-controls/imports.json
      - name: Actual acquired pair and unchanged late topology gates
        run: python scripts/check_cdr_v59_tail_fresh_rc_semantic.py --output hw/soc/out/cdr-v59-tail-fresh-rc-controls/semantic.json > hw/soc/out/cdr-v59-tail-fresh-rc-controls/semantic.stdout
      - name: Joint saved physical and typed-identity admission
        run: python scripts/check_cdr_v59_tail_fresh_rc_admission.py --output hw/soc/out/cdr-v59-tail-fresh-rc-controls/admission.json > hw/soc/out/cdr-v59-tail-fresh-rc-controls/admission.stdout
      - name: Exact numerical derivations and actual worker main entry controls
        run: python scripts/check_cdr_v59_tail_fresh_rc_workers.py --out hw/soc/out/cdr-v59-tail-fresh-rc-controls/workers.json
      - name: Actual outer lifecycle full-file publication and original pipeline controls
        run: python scripts/check_cdr_v59_tail_fresh_rc_outer.py --out hw/soc/out/cdr-v59-tail-fresh-rc-controls/outer.json
      - name: Qualified ownership and all launcher result persistence controls
        run: python scripts/check_cdr_v59_tail_fresh_rc_runtime.py --out hw/soc/out/cdr-v59-tail-fresh-rc-controls/runtime.json
      - name: Exact source reservation read-only waiter and shared file-list controls
        run: |
          python - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0,'scripts')
          import cdr_v59_tail_fresh_rc_admission as s
          import ensure_cloud_tested_source_release as release
          import wait_cloud_tested_source_release as waiter
          import cloud_cdr_v59_binding_rc as shared
          assert s.methods()['source_controls_authorized'] is True
          out=Path('hw/soc/out/cdr-v59-tail-fresh-rc-controls/release.json')
          result={'status':'RUNNING_RELEASE_CONTROLS'}
          s.write(out,result)
          try:
              result['reservation']=release.controls()
              result['waiter']=waiter.controls()
              result['publication']=shared.publication_controls()
              result['status']='PASS_SOURCE_RESERVATION_WAITER_AND_SHARED_PUBLICATION_CONTROLS'
          except BaseException as error:
              result.update(status='FAIL_RELEASE_CONTROLS',error=repr(error))
              raise
          finally:s.write(out,result)
          PY
      - name: Admit all seven complete source-control records
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('hw/soc/out/cdr-v59-tail-fresh-rc-controls')
          assert root.is_dir() and not root.is_symlink()
          def read(name):
              p=root/(name+'.json')
              assert p.is_file() and not p.is_symlink()
              return json.loads(p.read_bytes())
          x=read('imports')
          assert x['status']=='PASS_ACTUAL_FRESH_TAIL_INITIAL_AND_DECLARED_RAW_IMPORT_CONTROLS'
          assert (x['positive_count'],x['refusal_count'])==(6,37)
          assert len(x['closure']['modules'])==63 and len(x['closure']['data'])==3
          assert x['installed_external_allowlist']=={'networkx':'3.4.2'}
          assert len(x['deferred_raw_imports']['positive'])==1 and len(x['deferred_raw_imports']['refusals'])==5
          assert x['native_executed'] is False and x['all_deferred_CAD_runtime_validated'] is False
          x=read('semantic')
          assert x['status']=='PASS_COMPLETE_ACTUAL_PAIR_SEMANTIC_PROJECTION_SOURCE_CONTROLS'
          assert len(x['positives'])==3 and len(x['refusals'])==21
          assert x['CAD_or_extraction_executed'] is False and x['physical_accepted'] is False
          x=read('admission')
          assert x['status']=='PASS_JOINT_SAVED_RC_ADMISSION_SOURCE_CONTROLS'
          assert len(x['positives'])==7 and len(x['refusals'])==29
          assert x['native_archives_or_CAD_accessed'] is False
          x=read('workers')
          assert x['status']=='PASS_DISABLED_FRESH_NUMERICAL_DERIVATION_AND_SYNTHETIC_HANDOFF_CONTROLS'
          assert (x['positive_groups'],x['refusals'])==(10,41)
          assert len(x['derivation']['positive'])==5 and len(x['direct_finalizer'])==3
          assert len(x['MIM_entries']['positive'])==2 and len(x['MIM_entries']['negative'])==4
          assert x['RC_terminal']['original_failure_reproduced'] is True
          assert x['authored_native_execution'] is False and x['unfinished_entry_scopes']==[]
          x=read('outer')
          assert x['status']=='PASS_ACTUAL_FRESH_RC_OUTER_PIPELINE_LIFECYCLE_CONTROLS'
          assert (x['positive_groups'],x['refusals'])==(6,41)
          assert len(x['lifecycle']['cases'])==10 and x['lifecycle']['refusals']==9
          assert len(x['pipeline']['positive'])==1 and len(x['pipeline']['refusals'])==13
          assert len(x['publication']['positive'])==4 and len(x['publication']['refusals'])==19
          assert x['native_executed'] is False
          x=read('runtime')
          assert x['status']=='PASS_QUALIFIED_RUNTIME_AND_WRITER_DEPENDENCY_CONTROLS'
          assert len(x['supervisor']['controls'])==13
          assert len(x['launcher']['positive'])==2 and len(x['launcher']['rejected'])==9
          assert len(x['all11_launcher_results_saved'])==11
          assert len(x['frozen_loader_controls']['positive'])==1 and len(x['frozen_loader_controls']['refusals'])==10
          assert x['corrected_exit127_saved']['returncode']==127
          assert x['actual_appimage_executed'] is False and x['native_executed'] is False
          x=read('release')
          assert x['status']=='PASS_SOURCE_RESERVATION_WAITER_AND_SHARED_PUBLICATION_CONTROLS'
          assert len(x['reservation']['rejected'])==17
          assert len(x['waiter']['positive_cases'])==3 and len(x['waiter']['rejected'])==4
          assert len(x['publication']['rejected'])==8 and len(x['publication']['file_list_controls']['rejected'])==14
          PY
      - name: Emit exact complete or partial source-control bytes
        if: always()
        run: |
          python - <<'PY'
          import ast,base64,hashlib,json
          from pathlib import Path
          source=Path('scripts/cloud_cdr_v59_binding_rc.py')
          assert source.is_file() and not source.is_symlink()
          raw=source.read_bytes()
          assert hashlib.sha256(raw).hexdigest()=='647af19c78158045739b2589d61a2962bbff69e230b593ccb33019550edbd709'
          nodes=[n for n in ast.parse(raw.decode()).body if isinstance(n,ast.FunctionDef) and n.name=='emit']
          assert len(nodes)==1
          scope=dict(base64=base64,hashlib=hashlib,json=json)
          exec(compile(ast.Module(body=nodes,type_ignores=[]),str(source),'exec'),scope)
          root=Path('hw/soc/out/cdr-v59-tail-fresh-rc-controls')
          assert not root.is_symlink() and (not root.exists() or root.is_dir())
          names=('semantic','admission','workers','outer','imports','runtime','release')
          assert len(names)==len(set(names))==7
          emitted=[];missing=[]
          for name in names:
              path=root/(name+'.json')
              assert not path.is_symlink()
              if not path.exists():
                  missing.append(name)
                  continue
              assert path.is_file()
              scope['emit'](path,'CDR_TAIL_FRESH_RC_CONTROL_'+name.upper())
              emitted.append(dict(name=name,bytes=path.stat().st_size,sha256=hashlib.sha256(path.read_bytes()).hexdigest()))
          print('CDR_TAIL_FRESH_RC_CONTROL_CENSUS '+json.dumps(dict(emitted=emitted,missing=missing,missing_files_created=False),sort_keys=True),flush=True)
          PY
      - name: Preserve all source-control evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cdr-tail-fresh-rc-controls-${{ github.run_id }}-${{ github.run_attempt }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
          path: hw/soc/out/cdr-v59-tail-fresh-rc-controls
  fresh-RC:
    if: ${{ inputs.extract }}
    needs: source-controls
    permissions:
      contents: write
      actions: read
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Read-only exact-source reservation before native dependencies
        run: python scripts/cloud_cdr_v59_tail_fresh_rc.py --preflight
      - name: Original pinned native runtime and extraction dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libfuse2 tcl8.6 tk8.6 tcl-dev tk-dev build-essential m4 autoconf libreadline-dev libx11-dev libxext-dev libxpm-dev libxt-dev libcairo2-dev libgl1-mesa-dev libglu1-mesa-dev
          python -m pip install networkx==3.4.2
          curl --fail --location --retry 4 https://github.com/librelane/librelane/releases/download/3.0.5/librelane-devshell-x86_64.AppImage -o "$RUNNER_TEMP/librelane.AppImage"
          echo "d6a349ec65be11456e96c4981d35f63ca34d3c85daf79a51e1ccb907bb5d7466  $RUNNER_TEMP/librelane.AppImage" | sha256sum --check
          chmod +x "$RUNNER_TEMP/librelane.AppImage"
          echo "CLOUD_APPIMAGE=$RUNNER_TEMP/librelane.AppImage" >> "$GITHUB_ENV"
      - name: Supervised fresh binding wire RC and seven-MIM precision in both orders
        run: python scripts/cloud_cdr_v59_tail_fresh_rc.py
      - name: Preserve a pre-driver failure without overwriting existing evidence
        if: always()
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          out=Path('hw/soc/out/cloud-cdr-v59-tail-fresh-rc')
          assert not out.is_symlink()
          out.mkdir(parents=True,exist_ok=True)
          path=out/'result.json'
          assert not path.is_symlink()
          if not path.exists():
              value=dict(status='FAIL_BEFORE_FRESH_RC_DRIVER_RESULT',source_head=os.environ['GITHUB_SHA'],
                run_id=int(os.environ['GITHUB_RUN_ID']),run_attempt=int(os.environ['GITHUB_RUN_ATTEMPT']),
                original_physical_run=40369539200,typed_saved_readback_run=40542841034,
                original_physical_status='FAIL_ADDITIVE_TAIL_WIRE_PHYSICAL',original_failure_preserved=True,
                automatic_retry=False,binding_executed=False,extraction_executed=False,
                physical_geometry_regenerated=False,simulation_executed=False,physical_accepted=False,
                electrical_accepted=False,qualified_pex=False,full_phy_accepted=False,
                fresh_RC_pipeline_complete=False,terminal_finalization_complete=False)
              path.write_text(json.dumps(value,sort_keys=True,indent=2)+'\n')
          PY
      - name: Complete or partial native evidence fallback
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cdr-tail-fresh-rc-full-${{ github.run_id }}-${{ github.run_attempt }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
          path: |
            hw/soc/out/cloud-cdr-v59-tail-fresh-rc
            hw/soc/out/cloud-cdr-v59-tail-fresh-rc-publication
            hw/soc/out/cloud-cdr-v59-tail-access-physical/candidate
