name: vbic-tree32-backend-cloud
on:
  push:
    branches: [codex/complete-open-work]
    paths: [.github/workflows/vbic-tree32-backend-cloud.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: vbic-tree32-backend-${{ github.ref }}
  cancel-in-progress: false
jobs:
  source-bound-backend-comparison:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Runtime dependencies and original observation controls
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libsndfile1 libsamplerate0 libreadline8t64 libxaw7 libxt6 libxft2 libfontconfig1
          python3 -m pip install numpy==2.3.3 pytest==8.4.2
          python3 -m py_compile scripts/cloud_vbic_tree32_backend.py
          python3 -m pytest -q sw/tests/test_cloud_tx_stream.py sw/tests/test_cloud_tx_original_bits.py
      - name: Verify old failure and complete source then measure native backends
        run: python3 scripts/cloud_vbic_tree32_backend.py
      - name: Preserve source/runtime/native diagnostic evidence
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p cloud-vbic-tree32-backend
          if [ ! -f cloud-vbic-tree32-backend/result.json ]; then
            printf '%s\n' '{"status":"FAIL_MISSING_REPORT","accepted":false}' > cloud-vbic-tree32-backend/result.json
          fi
          archive="vbic-tree32-backend-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.tar.gz"
          tar -czf "$archive" cloud-vbic-tree32-backend
          sha256sum "$archive" > "$archive.sha256"
          cp cloud-vbic-tree32-backend/result.json "${archive%.tar.gz}.summary.json"
          python3 scripts/publish_cloud_results.py --group vbic-tree32-backend "$archive" "$archive.sha256" "${archive%.tar.gz}.summary.json"
