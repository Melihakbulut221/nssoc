# SPDX-License-Identifier: Apache-2.0
name: tx-phase-reset334-avss18-rc-cloud
on:
  workflow_dispatch:
    inputs:
      native:
        description: "Fresh measured both-order wire/MIM RC from exact passed AVSS18 physical capsule; no simulation"
        type: boolean
        default: false
        required: true
permissions:
  contents: read
  actions: read
defaults:
  run:
    shell: bash
concurrency:
  group: tx-phase-reset334-avss18-rc-${{ github.ref }}
  cancel-in-progress: false
jobs:
  source-controls:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Exact physical admission, frozen extraction derivations and guarded stage handoff
        run: |
          set -euo pipefail
          if bash -o pipefail -c '(exit 7) | tee /dev/null'; then exit 1; fi
          python3 -m pip install networkx==3.4.2 numpy==2.1.3
          python3 scripts/cloud_tx_phase_reset334_avss18_rc.py --controls | tee source-controls.json
          python3 - <<'PY'
          import json
          x=json.load(open("source-controls.json"))
          assert x["status"]=="PASS_AVSS18_FRESH_RC_SOURCE_CONTROLS_NO_NATIVE"
          assert x["actual_controller_imported"]
          assert len(x["source_derivations"])==3 and len(x["derivation_faults"])==6
          assert len(x["physical_faults"])==24 and len(x["metadata_faults"])==25
          assert len(x["handoff_faults"])==5 and len(x["relocation_faults"])==12
          assert x["relocation_fixture_is_synthetic_not_native"]
          assert len(x["archive_controls"]["rejected"])==13
          assert x["archive_controls"]["inherited_parts_controls"]["negative_controls"]==6
          assert len(x["inherited_intrinsic"]["physical_faults"])==16
          assert len(x["inherited_intrinsic"]["derivations"]["rejected"])==9
          assert len(x["inherited_precision"]["rejected"])==19
          assert len(x["inherited_precision"]["source_derivations"])==13
          assert len(x["inherited_precision"]["cap_order_controls"])==4
          assert x["native_execution"]is x["extraction_executed"]is x["simulation_executed"]is False
          PY
      - name: Actual reserved-only publication program and bounded waiter controls
        run: |
          set -euo pipefail
          python3 scripts/check_tx_phase_reset334_avss18_rc_publication.py | tee publication-controls.json
          python3 scripts/wait_cloud_tested_source_release.py --controls | tee wait-controls.json
          python3 - <<'PY'
          import json
          x=json.load(open("publication-controls.json"))
          assert len(x["positive_cases"])==2 and len(x["rejected"])==13
          assert x["actual_template_program_executed"]and x["real_file_list_assembly"]
          assert x["release_creation_executed"]is x["native_executed"]is False
          w=json.load(open("wait-controls.json"))
          assert len(w["positive_cases"])==3 and len(w["rejected"])==4
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: avss18-rc-source-controls
          path: |
            source-controls.json
            publication-controls.json
            wait-controls.json
          if-no-files-found: error
          retention-days: 90
          include-hidden-files: true
  fresh-two-polarity334-mim-rc:
    needs: source-controls
    if: github.event_name == 'workflow_dispatch' && inputs.native
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Require passed controls and exact source reservation before dependencies
        run: python3 scripts/cloud_tx_phase_reset334_avss18_rc.py --preflight
      - name: Restore the exact qualified Ubuntu22 native environment
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libfuse2 tcl8.6 tk8.6 libglu1-mesa libx11-6 libxext6 libxrender1 libxt6 tcl-dev tk-dev build-essential m4 autoconf libreadline-dev libx11-dev libxext-dev libxpm-dev libxt-dev libcairo2-dev libgl1-mesa-dev libglu1-mesa-dev
          python3 -m pip install networkx==3.4.2 numpy==2.1.3
          curl --fail --location --retry 4 https://github.com/librelane/librelane/releases/download/3.0.5/librelane-devshell-x86_64.AppImage -o "$RUNNER_TEMP/librelane.AppImage"
          echo "d6a349ec65be11456e96c4981d35f63ca34d3c85daf79a51e1ccb907bb5d7466  $RUNNER_TEMP/librelane.AppImage" | sha256sum --check
          chmod +x "$RUNNER_TEMP/librelane.AppImage"
          echo "CLOUD_APPIMAGE=$RUNNER_TEMP/librelane.AppImage" >> "$GITHUB_ENV"
      - name: Fresh native334 intrinsic and eight MIMs followed by both unchanged precision orders
        run: python3 scripts/cloud_tx_phase_reset334_avss18_rc.py
      - name: Preserve complete result and every rejected native stage
        if: always()
        run: |
          python3 - <<'PY'
          import base64,hashlib,json
          from pathlib import Path
          p=Path("hw/soc/out/cloud-tx-phase-reset334-avss18-rc/result.json")
          if not p.exists():
              p.parent.mkdir(parents=True,exist_ok=True)
              p.write_text(json.dumps(dict(status="FAIL_MISSING_REPORT",electrical_accepted=False,full_phy_accepted=False))+"\n")
          b=p.read_bytes()
          print("RESULT_SHA256",hashlib.sha256(b).hexdigest());print("RESULT_BYTES",len(b))
          if len(b)<=16_000_000:
              s=base64.b64encode(b).decode();parts=[s[i:i+4096]for i in range(0,len(s),4096)]
              for i,c in enumerate(parts):print(f"RESULT_BASE64 {i}/{len(parts)} {c}")
          else:print("COMPLETE_RESULT_RETAINED_IN_PUBLICATION_AND_FALLBACK",p)
          PY
      - name: Publish all original and new evidence using reserved-only release binding
        if: always()
        id: publish
        run: |
          set -euo pipefail
          python3 scripts/wait_cloud_tested_source_release.py --group tx-phase-reset334-avss18-rc
          root=hw/soc/out/cloud-tx-phase-reset334-avss18-rc
          group=tx-phase-reset334-avss18-rc
          stem="$group-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          cp "$root/result.json" "$stem.summary.json"
          python3 scripts/cloud_chunked_results.py --directory "$root" --stem "$stem"
          python3 - "$stem" "$group" "$root" <<'PYCODE'
          import json,pathlib,sys,os
          sys.path.insert(0,'scripts')
          import ensure_cloud_tested_source_release as guard
          import migrate_outputs_to_cloud as migration
          import publish_cloud_results as publisher
          stem,group,root_arg=sys.argv[1:]
          assert group=='tx-phase-reset334-avss18-rc'
          expected,source=guard.context(group,os.environ)
          assert stem==group+'-'+os.environ['GITHUB_RUN_ID']+'-'+os.environ['GITHUB_RUN_ATTEMPT']
          root=pathlib.Path(root_arg)
          part_file=pathlib.Path(stem+'.parts.json')
          manifest=json.loads(part_file.read_text())
          part_names=[p['name'] for p in manifest['parts']]
          assert part_names and len(part_names)==len(set(part_names))
          assert all(pathlib.Path(n).name==n and '\\' not in n and n not in ('.','..') for n in part_names)
          separate=sorted(str(p) for p in root.glob('*.json') if p.name!='result.json')
          paths=[stem+'.summary.json',str(part_file),*separate,*part_names]
          assert len(paths)==len(set(paths))
          assert len({pathlib.Path(p).name for p in paths})==len(paths)
          assert all(pathlib.Path(p).is_file() and not pathlib.Path(p).is_symlink() for p in paths)
          def readonly_release(tag):
              assert tag==expected
              info=guard.api('releases/tags/'+tag)
              guard.validate_release(info,guard.api('git/ref/tags/'+tag),tag,source)
              return info
          migration.release=readonly_release
          assert publisher.publish is migration.publish
          assert publisher.publish.__globals__['release'] is readonly_release
          readonly_release(expected)
          result=publisher.publish_results(group,paths)
          assert result['tag']==expected and len(result['assets'])==len(paths)
          assert [x['name'] for x in result['assets']]==[pathlib.Path(p).name for p in paths]
          readonly_release(expected)
          print(json.dumps(result,sort_keys=True),flush=True)
          PYCODE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && steps.publish.outcome != 'success'
        with:
          name: avss18-rc-complete-evidence
          path: hw/soc/out/cloud-tx-phase-reset334-avss18-rc/
          if-no-files-found: error
          retention-days: 90
          include-hidden-files: true
