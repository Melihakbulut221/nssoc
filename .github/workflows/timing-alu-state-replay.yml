name: timing-alu-state-replay
on:
  push:
    paths:
      - .github/workflows/timing-alu-state-replay.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: timing-alu-state-replay-${{ github.ref }}
  cancel-in-progress: false
jobs:
  replay:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Check complete diagnostic assignment and difference accounting
        run: |
          python3 -m pip install pytest==8.4.2
          python3 -m pytest -q sw/tests/test_alu_state_counterexample.py sw/tests/test_alu_mapped_state.py
      - name: Install AppImage runtime prerequisite
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libfuse2
      - name: Replay preserved failed assignment on unchanged mapped graphs
        run: |
          python3 scripts/replay_alu_state_counterexample.py \
            --output "$GITHUB_WORKSPACE/alu-state-replay-result" \
            --work "$RUNNER_TEMP/alu-state-replay-work"
      - name: Preserve compact original failure identity and diagnostic evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: alu-state-replay-${{ github.run_attempt }}
          path: alu-state-replay-result/
          include-hidden-files: true
          if-no-files-found: error
          compression-level: 1
          retention-days: 30
