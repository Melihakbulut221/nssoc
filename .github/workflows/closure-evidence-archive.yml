name: closure-evidence-archive
on:
  workflow_dispatch:
  push:
    branches: ['codex/complete-open-work']
    paths: ['.github/workflows/closure-evidence-archive.yml']
permissions:
  contents: read
  actions: read
concurrency:
  group: closure-evidence-archive
  cancel-in-progress: false
jobs:
  archive:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    permissions:
      contents: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        candidate: [critical-first-failure, alu-trace-corrected, alu-bit-benchmark]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Preserve exact completed bytes and verify both release download paths
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 scripts/archive_chip_run_artifacts.py
          --plan docs/evidence/closure-${{ matrix.candidate }}-archive-plan-20261003.json
          --output "${{ runner.temp }}/closure-${{ matrix.candidate }}"
      - name: Preserve publication receipt even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: closure-${{ matrix.candidate }}-archive-receipt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/closure-${{ matrix.candidate }}/result.json
          if-no-files-found: error
          retention-days: 30
