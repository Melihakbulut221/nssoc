# Activate once after independent review of 7f85c2f10ac86968d337553ad70a7463260ee6d8.
# SPDX-License-Identifier: Apache-2.0
name: cdr500-v58-mim-precision-cloud
on:
  push:
    branches: [codex/cdr500-floating-wire-diagnosis]
    paths: [.github/workflows/cdr500-v58-mim-precision-cloud.yml, scripts/cloud_cdr500_v58_mim_capture.py, scripts/cloud_cdr500_v58_mim_audit.py, scripts/cloud_cdr500_v58_mim_precision.py, scripts/audit_cdr500_v58_mim_intrinsic.py, scripts/cdr500-v58-mim-precision-methods.json, scripts/cdr500_v58_composition_derivation.py]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cdr500-v58-mim-precision-${{ github.ref }}
  cancel-in-progress: false
jobs:
  native:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Compile and verify protected methods
        run: |
          python3 -m py_compile scripts/cloud_cdr500_v58_mim_capture.py scripts/cloud_cdr500_v58_mim_audit.py scripts/cloud_cdr500_v58_mim_precision.py scripts/audit_cdr500_v58_mim_intrinsic.py
          PYTHONPATH=scripts python3 -c 'from cloud_cdr500_v58_mim_precision import check; from cdr500_v58_composition_derivation import controls; from pathlib import Path; check(); print(controls(Path("scripts/cloud_cdr_retimed_composition.py").read_text()))'
      - name: Restore pinned native runtime and producer dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libfuse2 tcl8.6 tk8.6 tcl-dev tk-dev build-essential m4 autoconf libreadline-dev libx11-dev libxext-dev libxpm-dev libxt-dev libcairo2-dev libgl1-mesa-dev libglu1-mesa-dev
          python3 -m pip install networkx==3.4.2
          curl --fail --location --retry 4 https://github.com/librelane/librelane/releases/download/3.0.5/librelane-devshell-x86_64.AppImage -o "$RUNNER_TEMP/librelane.AppImage"
          echo "d6a349ec65be11456e96c4981d35f63ca34d3c85daf79a51e1ccb907bb5d7466  $RUNNER_TEMP/librelane.AppImage" | sha256sum --check
          chmod +x "$RUNNER_TEMP/librelane.AppImage"
          echo "CLOUD_APPIMAGE=$RUNNER_TEMP/librelane.AppImage" >> "$GITHUB_ENV"
      - name: Fresh native MIM capture, two-order precision, raw controls and composition
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/cloud_cdr500_v58_mim_precision.py
      - name: Publish native pass or rejection
        if: always()
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PYCODE'
          import json,os,pathlib,subprocess,sys
          root=pathlib.Path('hw/soc/out/cloud-cdr500-v58-mim-precision');root.mkdir(parents=True,exist_ok=True)
          result=root/'result.json'
          if not result.exists():result.write_text(json.dumps(dict(status='FAIL_MISSING_REPORT',accepted=False,source_head=os.environ['GITHUB_SHA']))+'\n')
          group='cdr500-v58-mim-precision';stem=group+'-'+os.environ['GITHUB_RUN_ID']+'-'+os.environ['GITHUB_RUN_ATTEMPT']
          summary=pathlib.Path(stem+'.summary.json');summary.write_bytes(result.read_bytes())
          subprocess.run([sys.executable,'scripts/cloud_chunked_results.py','--directory',str(root),'--stem',stem],check=True)
          manifest=pathlib.Path(stem+'.parts.json');parts=json.loads(manifest.read_text())
          subprocess.run([sys.executable,'scripts/publish_cloud_results.py','--group',group,str(summary),str(manifest),*[p['name']for p in parts['parts']]],check=True)
          PYCODE
      - name: Retain evidence after publication failure
        if: always() && steps.publish.outcome == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cdr500-v58-mim-precision-${{ github.run_id }}
          path: hw/soc/out/cloud-cdr500-v58-mim-precision/
          retention-days: 30
