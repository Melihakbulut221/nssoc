name: tx-tree-assembled-wave-cloud
on:
  push:
    branches: [codex/complete-open-work]
    paths: [.github/workflows/tx-tree-assembled-wave-cloud.yml]
  workflow_dispatch:
    inputs:
      study:
        description: Original gates on complete assembled physical core and matched compact control
        type: choice
        options: [nominal, temperature_voltage, physical_faults, failing_corners, independent_corners, mos_corners, quarter_step, hot_low_quarter_step, hot_low_fine_steps]
        default: nominal
      solver_profile:
        description: Native default or tight trap/Gear2, unchanged electrical gates
        type: choice
        options: [default, tight_trap, tight_gear2]
        default: default
      pre_bias:
        description: Fixed native bias feed; TC candidate needs separate feed layout and RC qualification
        type: choice
        options: [native_res, native_res_tc]
        default: native_res
      placement_profile:
        description: Source-bound assembled core placement with independent physical and RC receipts
        type: choice
        options: [baseline, compact_vertical, compact_m5_supply, compact_edge_supply]
        default: baseline
permissions:
  contents: read
concurrency:
  group: tx-tree-assembled-wave-${{ github.ref }}-${{ inputs.study || 'nominal' }}-${{ inputs.placement_profile || 'baseline' }}-${{ inputs.pre_bias || 'native_res' }}-${{ inputs.solver_profile || 'default' }}
  cancel-in-progress: false
jobs:
  native-transient:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        streams: [4]
        prestage: [compact, wire]
        condition: ${{ fromJSON(inputs.study == 'temperature_voltage' && '["hot_low","cold_high"]' || inputs.study == 'failing_corners' && '["hot_low_res_bcs","hot_low_hbt_bcs","cold_high_res_wcs","cold_high_hbt_wcs"]' || inputs.study == 'independent_corners' && '["hbt_typ_res_bcs","hbt_typ_res_wcs","hbt_bcs_res_typ","hbt_bcs_res_bcs","hbt_bcs_res_wcs","hbt_wcs_res_typ","hbt_wcs_res_bcs","hbt_wcs_res_wcs","hot_low_res_bcs","hot_low_hbt_bcs","cold_high_res_wcs","cold_high_hbt_wcs"]' || inputs.study == 'mos_corners' && '["mos_ss","mos_ff","lv_ss_hv_ff","lv_ff_hv_ss","mos_sf","mos_fs"]' || inputs.study == 'hot_low_fine_steps' && '["hot_low_eighth_step","hot_low_sixteenth_step"]' || inputs.study == 'hot_low_quarter_step' && '["hot_low_quarter_step"]' || inputs.study == 'quarter_step' && '["quarter_step"]' || '["nominal"]') }}
        fault: ${{ fromJSON(inputs.study == 'physical_faults' && '["swap_pre_a_select","disable_pre_b_bias","swap_leaf_select"]' || '["none"]') }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Restore exact native simulator with hosted dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libsndfile1 libsamplerate0 libreadline8t64 libxaw7 libxt6 libxft2 libfontconfig1
          python3 -m pip install numpy==2.3.3 pytest==8.4.2
          curl --fail --location --retry 4 'https://deb.debian.org/debian/pool/main/n/ngspice/ngspice_47+ds-1~bpo13+1_amd64.deb' -o "$RUNNER_TEMP/ngspice.deb"
          echo "400d2ebaefc1dcaaaf9693ac4731535d910fa2c0544552736970aa9ebaad760b  $RUNNER_TEMP/ngspice.deb" | sha256sum --check
          dpkg-deb -x "$RUNNER_TEMP/ngspice.deb" "$RUNNER_TEMP/ngspice"
          echo "CLOUD_NGSPICE=$RUNNER_TEMP/ngspice/usr/bin/ngspice" >> "$GITHUB_ENV"
      - name: Reject source-bit corruption and incomplete output captures
        run: python3 -m pytest -q sw/tests/test_cloud_tx_original_bits.py sw/tests/test_cloud_tx_mux4.py sw/tests/test_cloud_result_publication.py sw/tests/test_cloud_tx_stream.py
      - name: Check actual native solver options before long capture
        if: inputs.solver_profile == 'tight_trap' || inputs.solver_profile == 'tight_gear2'
        env:
          NSSOC_SOLVER_PROFILE: ${{ inputs.solver_profile }}
        run: |
          python3 - <<'PYSMOKE'
          import os,sys,subprocess,pathlib,json
          sys.path.insert(0,'scripts')
          from run_cloud_tx_mux4 import solver_options,verify_solver_options
          profile=os.environ['NSSOC_SOLVER_PROFILE']
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'nssoc-solver-smoke'
          out.mkdir()
          deck='NSSOC native option readback preflight\nV1 a 0 1\nR1 a b 1000\nC1 b 0 1p\n'+solver_options(profile)+'\n.control\ntran 1p 1n\necho NSSOC_SOLVER_OPTIONS_BEGIN\noption\necho NSSOC_SOLVER_OPTIONS_END\nquit\n.endc\n.end\n'
          (out/'bench.cir').write_text(deck)
          p=subprocess.run([os.environ['CLOUD_NGSPICE'],'-n','-b','bench.cir'],cwd=out,text=True,capture_output=True)
          log=p.stdout+p.stderr
          print(log)
          assert p.returncode==0
          print(json.dumps(verify_solver_options(log,profile)))
          PYSMOKE
      - name: Run actual complete tree and full-wave engineering screen
        run: python3 scripts/run_cloud_tx_mux4.py --assembled-core '${{ matrix.prestage }}' --assembled-placement '${{ inputs.placement_profile || 'baseline' }}' --stream-raw --condition '${{ matrix.condition }}' --streams 4 --frontend damped_strong --clock-bias native_res --clock-reference stiff65 --final-drive double_taps_margin --solver-profile '${{ inputs.solver_profile || 'default' }}' --pre-bias '${{ inputs.pre_bias || 'native_res' }}' --output-bias native_res --fault '${{ matrix.fault }}'
      - name: Preserve all successful and failed native captures permanently
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          archive='tx-tree-assembled-${{ matrix.streams }}-${{ matrix.prestage }}-${{ matrix.condition }}-${{ matrix.fault }}-${{ github.run_id }}-${{ github.run_attempt }}.tar.gz'
          tar -czf "$archive" cloud-tx-mux4
          sha256sum "$archive" > "$archive.sha256"
          summary="${archive%.tar.gz}.summary.json"
          cp cloud-tx-mux4/result.json "$summary"
          python3 scripts/publish_cloud_results.py --group 'assembled-tree-${{ matrix.streams }}-${{ matrix.prestage }}-${{ matrix.condition }}-${{ matrix.fault }}' "$archive" "$archive.sha256" "$summary"
      - name: Retain capture if permanent publication fails
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tree-${{ matrix.streams }}-${{ matrix.prestage }}-${{ matrix.condition }}-${{ matrix.fault }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: tx-tree-assembled-*
          if-no-files-found: warn
          retention-days: 30
