name: TX phase assertion offset source controls
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tx-phase-assert-offset-source-${{ github.ref }}
  cancel-in-progress: false
jobs:
  source-controls:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Prove exact single resistor delta and reject source mutations
        shell: bash
        run: |
          set -euo pipefail
          if bash -o pipefail -c 'exit 7 | tee rejected-pipeline.txt'; then exit 1; fi
          python3 scripts/check_tx_phase_assert_offset_source.py | tee source-controls.json
          python3 - <<'PY'
          import json
          r=json.load(open('source-controls.json'))
          assert r['status']=='PASS_ASSERT_OFFSET244_SOURCE_ONLY_NOT_ELECTRICAL'
          assert len(r['negative_controls'])==14
          assert r['exact_single_resistor_delta'] and r['original244_byte_exact_after_declared_reversal']
          assert not any(r[k] for k in ('original244_accepted','native_execution','reset_hardware_qualified','layout_RC_included','PLL_connected','full_PHY_accepted'))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: assert-offset-source-controls
          path: source-controls.json
          if-no-files-found: error
          retention-days: 90
