name: tx-output8088-power128return64via3-composition-cloud
on:
  push:
    branches: [codex/complete-open-work]
    paths: [.github/workflows/tx-output8088-power128return64via3-composition-cloud.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tx-output8088-power128return64via3-composition-${{ github.ref }}
  cancel-in-progress: false
jobs:
  actual-whole-parent-composition:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Prepare native evidence-bound composition checker
        run: |
          echo 'c6db889f529688ca6069c0754e7727408c4ebad6025788a4e8071ac6caacbe4c  scripts/cloud_tx_output8088_power128return64via3_composition_launch.py' | sha256sum --check
          python3 -m py_compile scripts/cloud_tx_output8088_power128return64via3_composition_launch.py
          python3 -m pip install networkx==3.4.2
      - name: Wait for exact native RC then compose every8088 device and reject25 real corruptions
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/cloud_tx_output8088_power128return64via3_composition_launch.py
      - name: Publish physical success or failure evidence
        if: always()
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p hw/soc/out/cloud-tx-output8088-power128return64via3-composition
          if [ ! -f hw/soc/out/cloud-tx-output8088-power128return64via3-composition/result.json ]; then
            printf '%s\n' '{"status":"FAIL_MISSING_REPORT","accepted":false}' > hw/soc/out/cloud-tx-output8088-power128return64via3-composition/result.json
          fi
          stem="tx-output8088-power128return64via3-composition-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          cp hw/soc/out/cloud-tx-output8088-power128return64via3-composition/result.json "$stem.summary.json"
          python3 scripts/cloud_chunked_results.py --directory hw/soc/out/cloud-tx-output8088-power128return64via3-composition --stem "$stem"
          python3 - "$stem" <<'PYCODE'
          import json,subprocess,sys
          stem=sys.argv[1];manifest=stem+'.parts.json';m=json.load(open(manifest))
          subprocess.run([sys.executable,'scripts/publish_cloud_results.py','--group','tx-output8088-power128return64via3-composition',stem+'.summary.json',manifest,*[p['name']for p in m['parts']]],check=True)
          PYCODE
      - name: Retain evidence after publication failure
        if: always() && steps.publish.outcome == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tx-output8088-power128return64via3-composition-${{ github.run_id }}
          retention-days: 30
          path: hw/soc/out/cloud-tx-output8088-power128return64via3-composition/

