name: io-tap-mask-probe
on:
  push:
    paths:
      - .github/workflows/io-tap-mask-probe.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: io-tap-mask-probe
  cancel-in-progress: false
jobs:
  isolated-vss-mask-attribution:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      QT_QPA_PLATFORM: offscreen
      OMP_NUM_THREADS: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Pure source, capture and mutation controls
        run: |
          python3 -m pip install -r sw/requirements.txt
          python3 -m pytest -q sw/tests/test_io_tap_mask_probe.py
      - name: Bootstrap checksum-pinned runtime and unchanged native deck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libfuse2
          python3 scripts/bootstrap_flow.py
          python3 scripts/bootstrap_flow.py --check
          python3 hw/soc/flow/prepare_ihp_lvs.py
      - name: Gate with tiny native controls then attribute immutable Vss masks
        run: >-
          python3 scripts/run_io_tap_mask_probe.py
          --output hw/soc/out/github-io-tap-mask-probe
      - name: Preserve original input subset, masks and all failure diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: io-tap-mask-probe-${{ github.run_attempt }}
          path: hw/soc/out/github-io-tap-mask-probe/
          if-no-files-found: error
          retention-days: 30
          compression-level: 1
