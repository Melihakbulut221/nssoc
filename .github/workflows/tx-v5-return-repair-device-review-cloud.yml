# SPDX-License-Identifier: Apache-2.0
name: tx-v5-return-repair-device-review-cloud
on:
  push:
    branches: [codex/complete-open-work]
    paths: [.github/workflows/tx-v5-return-repair-device-review-cloud.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tx-v5-return-repair-device-review-${{ github.ref }}
  cancel-in-progress: false
jobs:
  native-readback:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify unchanged readback and DC diagnostic algorithms
        run: |
          python3 scripts/check_tx_v5_return_repair_device_review_sources.py
          python3 -m py_compile scripts/cloud_tx_v5_return_repair_stage_review.py scripts/cloud_tx_v5_return_repair_extrema_review.py scripts/cloud_tx_v5_return_repair_return_review.py
          python3 -m pip install numpy==2.3.3 scipy==1.16.2 networkx==3.4.2
      - name: Bind failed native HBTs to actual physical macros
        run: python3 scripts/cloud_tx_v5_return_repair_stage_review.py
      - name: Reproduce all604HBT metrics and measure exact worst-time terminal voltages
        run: python3 scripts/cloud_tx_v5_return_repair_extrema_review.py
      - name: Solve unchanged return graph with KCL energy and reciprocity checks
        run: python3 scripts/cloud_tx_v5_return_repair_return_review.py
      - name: Preserve diagnoses and any failures
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PYCODE'
          import json,os,subprocess,sys
          from pathlib import Path
          for kind in ('stage','extrema','return'):
              group='tx-v5-return-repair-'+kind+'-review'
              root=Path('hw/soc/out/cloud-'+group);root.mkdir(parents=True,exist_ok=True)
              report=root/'result.json'
              if not report.exists():report.write_text(json.dumps(dict(status='FAIL_MISSING_REPORT',accepted=False)))
              stem=group+'-'+os.environ['GITHUB_RUN_ID']+'-'+os.environ['GITHUB_RUN_ATTEMPT']
              Path(stem+'.summary.json').write_bytes(report.read_bytes())
              subprocess.run([sys.executable,'scripts/cloud_chunked_results.py','--directory',str(root),'--stem',stem],check=True)
              m=json.loads(Path(stem+'.parts.json').read_text())
              subprocess.run([sys.executable,'scripts/publish_cloud_results.py','--group',group,stem+'.summary.json',stem+'.parts.json',*[p['name']for p in m['parts']]],check=True)
          PYCODE
      - name: Retain reports if publication fails
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tx-v5-return-repair-device-review-${{ github.run_id }}
          path: hw/soc/out/cloud-tx-v5-return-repair-*-review/
          retention-days: 30
