name: native-recovery
on:
  push:
    paths:
      - .github/workflows/native-recovery.yml
      - hw/soc/rtl/soc_scrub.v
      - hw/soc/tb/tb_scrub_native_clear.v
      - hw/soc/tb/fixtures/*scrub*clear*.v
      - scripts/check_scrub_native.py
      - scripts/check_soc_native_boot.sh
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-recovery-${{ github.ref }}
  cancel-in-progress: false
jobs:
  native-boot:
    strategy:
      fail-fast: false
      matrix:
        profile: [base, full]
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    env:
      SOC_INTERFACE_PROFILE: ${{ matrix.profile }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: sw/requirements.txt
      - uses: YosysHQ/setup-oss-cad-suite@aefa8397bbf8fc6670a0a62af9805a89738f3cde # v3
        with:
          version: '2026-08-04'
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Prepare exact digital inputs
        run: |
          echo "OSS_CAD_SUITE=$(dirname "$(dirname "$(command -v yosys)")")" >> "$GITHUB_ENV"
          python3 -m pip install -r sw/requirements.txt
          make soc-prepare
      - name: Native recovery controls and full mapped boot
        run: bash scripts/check_soc_native_boot.sh
      - name: Retain pass or failure evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-recovery-${{ matrix.profile }}
          path: |
            hw/soc/out/native-boot/**/*.log
            hw/soc/out/native-boot/**/*.json
            hw/soc/out/native-boot/synthesis/soc_top.netlist.v
            hw/soc/out/native-boot/synthesis/area.rpt
            hw/soc/out/native-boot/rtl/test_soc.bin
            hw/soc/out/native-boot/rtl/app.elf
            hw/soc/out/native-boot/rtl/flash0.hex
          retention-days: 30
