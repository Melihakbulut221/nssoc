name: corrpre-banked-handoff-cloud
on:
  push:
    branches: [codex/complete-open-work]
    paths:
      - .github/workflows/corrpre-banked-handoff-cloud.yml
      - scripts/cloud_corrpre_banked_handoff.py
      - scripts/check_corrpre_banked_handoff.py
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: corrpre-banked-handoff-39016026619
  cancel-in-progress: false
jobs:
  controls:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: |
          python3 -m py_compile scripts/cloud_corrpre_banked_handoff.py
          python3 scripts/check_corrpre_banked_resume.py
          python3 scripts/check_corrpre_banked_handoff.py
  boot-to-placement:
    if: github.event_name == 'workflow_dispatch'
    needs: controls
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    permissions:
      actions: write
      contents: write
    outputs:
      next_run: ${{ steps.handoff.outputs.next_run }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Wait for exact live boot and validate actual source and native gates
        id: handoff
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/cloud_corrpre_banked_handoff.py --stage boot --run 39016026619
      - name: Preserve one-shot handoff and verified source evidence
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          root=cloud-corrpre-banked-handoff-boot
          mkdir -p "$root"
          stem="corrpre-banked-handoff-boot-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          python3 scripts/cloud_chunked_results.py --directory "$root" --stem "$stem"
          python3 - "$stem" <<'PYCODE'
          import json,subprocess,sys
          stem=sys.argv[1]; m=json.load(open(stem+'.parts.json'))
          subprocess.run([sys.executable,'scripts/publish_cloud_results.py','--group','corrpre-banked-handoff-boot',stem+'.parts.json',*[p['name'] for p in m['parts']]],check=True)
          PYCODE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: corrpre-banked-boot-handoff
          path: cloud-corrpre-banked-handoff-boot/
          retention-days: 30
  placement-to-repair:
    if: github.event_name == 'workflow_dispatch'
    needs: boot-to-placement
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    permissions:
      actions: write
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Wait for the exact dispatched CTS and hand off source-bound native repair
        env:
          GH_TOKEN: ${{ github.token }}
          PLACEMENT_RUN: ${{ needs.boot-to-placement.outputs.next_run }}
        run: python3 scripts/cloud_corrpre_banked_handoff.py --stage placement --run "$PLACEMENT_RUN"
      - name: Preserve exact placement handoff and every failure
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          root=cloud-corrpre-banked-handoff-placement
          mkdir -p "$root"
          stem="corrpre-banked-handoff-placement-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          python3 scripts/cloud_chunked_results.py --directory "$root" --stem "$stem"
          python3 - "$stem" <<'PYCODE'
          import json,subprocess,sys
          stem=sys.argv[1]; m=json.load(open(stem+'.parts.json'))
          subprocess.run([sys.executable,'scripts/publish_cloud_results.py','--group','corrpre-banked-handoff-placement',stem+'.parts.json',*[p['name'] for p in m['parts']]],check=True)
          PYCODE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: corrpre-banked-placement-handoff
          path: cloud-corrpre-banked-handoff-placement/
          retention-days: 30
