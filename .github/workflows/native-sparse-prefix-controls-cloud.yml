# SPDX-License-Identifier: Apache-2.0
name: native-sparse-prefix-controls-cloud
on:
  push:
    branches: [codex/complete-open-work]
    paths: [.github/workflows/native-sparse-prefix-controls-cloud.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-sparse-prefix-controls-${{ github.ref }}
  cancel-in-progress: false
jobs:
  storage-controls:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        filesystem: [ext4, btrfs]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Prepare isolated cloud fixture filesystem
        run: |
          base="$RUNNER_TEMP/sparse-prefix-${{ matrix.filesystem }}"
          mkdir "$base"
          if [ "${{ matrix.filesystem }}" = btrfs ]; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends btrfs-progs
            image="$RUNNER_TEMP/sparse-prefix-fixture.btrfs"
            truncate -s 1G "$image"
            mkfs.btrfs -f "$image"
            sudo mount -o loop,compress-force=zstd:3 "$image" "$base"
            sudo chown "$(id -u):$(id -g)" "$base"
          fi
          echo "SPARSE_PROOF_BASE=$base" >> "$GITHUB_ENV"
          findmnt --json -T "$base"
      - name: Verify complete byte reconstruction and reject every storage corruption
        run: |
          python3 -m py_compile scripts/cloud_native_sparse_prefix_store.py
          python3 scripts/cloud_native_sparse_prefix_store.py
      - name: Publish raw storage fixtures and all failure evidence
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          root="${SPARSE_PROOF_BASE:-$RUNNER_TEMP/sparse-prefix-${{ matrix.filesystem }}}/cloud-native-sparse-prefix-controls"
          mkdir -p "$root"
          if [ ! -f "$root/result.json" ]; then
            printf '%s\n' '{"status":"FAIL_MISSING_REPORT","native_activation_qualified":false,"full_phy_accepted":false}' > "$root/result.json"
          fi
          stem="native-sparse-prefix-controls-${{ matrix.filesystem }}-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          cp "$root/result.json" "$stem.summary.json"
          python3 scripts/cloud_chunked_results.py --directory "$root" --stem "$stem"
          python3 - "$stem" <<'PYCODE'
          import json,subprocess,sys
          stem=sys.argv[1];m=json.load(open(stem+'.parts.json'))
          subprocess.run([sys.executable,'scripts/publish_cloud_results.py','--group','native-sparse-prefix-controls-${{ matrix.filesystem }}',stem+'.summary.json',stem+'.parts.json',*[p['name']for p in m['parts']]],check=True)
          PYCODE
