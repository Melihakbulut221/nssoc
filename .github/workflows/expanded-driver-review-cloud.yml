name: expanded-driver-review-cloud
on:
  push:
    branches: [codex/complete-open-work]
    paths: [.github/workflows/expanded-driver-review-cloud.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: expanded-driver-review-${{ github.ref }}
  cancel-in-progress: false
jobs:
  source-bound-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify stage parser and classify source-bound setup/hold drivers
        run: |
          python3 scripts/review_cloud_expanded_drivers.py --controls-only
          python3 scripts/review_cloud_expanded_drivers.py
      - name: Preserve diagnosis including failures
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p cloud-expanded-driver-review
          if [ ! -f cloud-expanded-driver-review/result.json ]; then
            printf '%s\n' '{"status":"FAIL_MISSING_REPORT","accepted":false}' > cloud-expanded-driver-review/result.json
          fi
          cp cloud-expanded-driver-review/result.json "expanded-driver-review-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.summary.json"
          python3 scripts/publish_cloud_results.py --group expanded-driver-review "expanded-driver-review-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.summary.json"
