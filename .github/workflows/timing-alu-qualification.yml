name: timing-alu-qualification
on:
  push:
    paths:
      - .github/workflows/timing-alu-qualification.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: timing-alu-qualification-${{ github.ref }}
  cancel-in-progress: false
jobs:
  map:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0 # Verify producer methods against original Git blobs.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Mapping, boot and immutable-input negative guards
        run: |
          python3 -m pip install pytest==8.4.2
          python3 -m pytest -q sw/tests/test_alu_qualification.py sw/tests/test_alu_prefix_experiment.py
      - name: Revalidate completed producer and map exact original/candidate SRAMs
        run: |
          python3 scripts/run_cloud_alu_qualification.py map \
            --output "$GITHUB_WORKSPACE/alu-qualification-map" --work "$GITHUB_WORKSPACE/alu-map-work"
      - name: Preserve mapping, source contracts and any failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: alu-qualification-map-${{ github.run_attempt }}
          path: alu-qualification-map/
          include-hidden-files: true
          if-no-files-found: error
          compression-level: 1
          retention-days: 30
  boot:
    needs: map
    runs-on: ubuntu-22.04
    timeout-minutes: 360 # Hosted ceiling; native jobs have no elapsed watchdog.
    strategy:
      fail-fast: false
      matrix:
        variant: [original, candidate]
        memory: [vendor, independent]
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      VARIANT: ${{ matrix.variant }}
      MEMORY: ${{ matrix.memory }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Retrieve exact same-source completed mapping
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: alu-qualification-map-${{ github.run_attempt }}
          path: alu-mapped-input
      - name: Prove native cell compatibility and compile exact mapped core
        run: |
          python3 scripts/run_cloud_alu_qualification.py boot-prepare --variant "$VARIANT" --memory "$MEMORY" \
            --mapped "$GITHUB_WORKSPACE/alu-mapped-input" \
            --output "$GITHUB_WORKSPACE/alu-qualification-boot" --work "$GITHUB_WORKSPACE/alu-boot-work"
      - name: Preserve real compiled startup evidence before long simulation
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: alu-qualification-startup-${{ matrix.variant }}-${{ matrix.memory }}-${{ github.run_attempt }}
          path: alu-qualification-boot/
          include-hidden-files: true
          if-no-files-found: error
          compression-level: 1
          retention-days: 30
      - name: Stream four-state mapped MBIST and immutable-ROM boot progress
        run: |
          python3 scripts/run_cloud_alu_qualification.py boot-run --output "$GITHUB_WORKSPACE/alu-qualification-boot"
      - name: Preserve boot logs, benches, source pins and any failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: alu-qualification-boot-${{ matrix.variant }}-${{ matrix.memory }}-${{ github.run_attempt }}
          path: alu-qualification-boot/
          include-hidden-files: true
          if-no-files-found: error
          compression-level: 1
          retention-days: 30
