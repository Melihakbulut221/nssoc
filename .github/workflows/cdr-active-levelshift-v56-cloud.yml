name: cdr-active-levelshift-v56-cloud
on:
  push:
    branches: [codex/complete-open-work]
    paths:
      - .github/workflows/cdr-active-levelshift-v56-cloud.yml
      - scripts/cloud_cdr_active_levelshift_v56.py
      - scripts/cdr-active-levelshift-v56-method.json
      - hw/soc/analog/pcie/cdr_active_levelshift_v56.spice
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cdr-active-levelshift-v56
  cancel-in-progress: false
jobs:
  controls:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: |
          python3 -m pip install numpy==2.3.3
          python3 -m py_compile scripts/cloud_cdr_active_levelshift_v56.py
          PYTHONPATH=scripts python3 -c "from cloud_cdr_active_levelshift_v56 import source_check,controls; source_check(); print(controls())"
      - name: Verify only reference and gain-tail dimensions changed for parent bias compatibility
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path
          for path in ['scripts/cloud_cdr_active_levelshift_v53.py','hw/soc/analog/pcie/cdr_active_levelshift_v53.spice']:
              original=Path(path).read_text()
              expected=original.replace('v53','v56').replace('w=36u','w=53.335u').replace('w=5.4u','w=8u')
              assert Path(path.replace('v53','v56')).read_text()==expected
          sampler=Path('hw/soc/analog/pcie/rx_sampler_settling_v32.spice').read_text()
          reference='XREF iref iref avss sub sg13_lv_nmos w=8u l=.3u ng=1'
          assert sampler.count(reference)==1
          assert sampler.count('w=36u l=.3u ng=1')==8
          from decimal import Decimal
          assert Decimal('53.335') % Decimal('.005')==0
          print('PASS_ONLY_NATIVE_REFERENCE8UM_AND_GAIN_TAIL53_335UM_CHANGED_ORIGINAL_GATES_INTACT')
          print('NOT_PARENT_INTEGRATION: standalone reference emulates the existing sampler reference; final sampler must keep exactly one shared reference and original single IREF.')
          PYCODE
  native:
    needs: controls
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        case: [nominal, hot_low, cold_high, swap_output, bias_off]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Restore native simulator dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends tcl8.6 libsndfile1 libsamplerate0 libreadline8t64 libxaw7 libxt6 libxft2 libfontconfig1
          python3 -m pip install numpy==2.3.3
      - name: Test actual HBT MOS resistor level shifter with full source and load stress
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/cloud_cdr_active_levelshift_v56.py --case ${{ matrix.case }}
      - name: Preserve complete component evidence including all failures
        if: always()
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          root=cloud-cdr-active-levelshift-v56-${{ matrix.case }}
          mkdir -p "$root"
          if [ ! -f "$root/result.json" ]; then
            printf '%s\n' '{"status":"FAIL_MISSING_REPORT","full_phy_accepted":false}' > "$root/result.json"
          fi
          stem="cdr-active-levelshift-v56-${{ matrix.case }}-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          cp "$root/result.json" "$stem.summary.json"
          python3 scripts/cloud_chunked_results.py --directory "$root" --stem "$stem"
          python3 - "$stem" <<'PYCODE'
          import json,subprocess,sys
          stem=sys.argv[1];m=json.load(open(stem+'.parts.json'))
          subprocess.run([sys.executable,'scripts/publish_cloud_results.py','--group','cdr-active-levelshift-v56-${{ matrix.case }}',stem+'.summary.json',stem+'.parts.json',*[p['name']for p in m['parts']]],check=True)
          PYCODE
      - name: Retain evidence after publication failure
        if: always() && steps.publish.outcome == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cdr-active-levelshift-v56-${{ matrix.case }}-${{ github.run_id }}
          path: cloud-cdr-active-levelshift-v56-${{ matrix.case }}/
          retention-days: 30
