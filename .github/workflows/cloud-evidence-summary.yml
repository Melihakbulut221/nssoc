name: Derived per-bit trace of preserved N1 actual650 waveform
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  n1-wave-trace:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      ARTIFACT_ID: '13283214752'
      ARTIFACT_SHA256: ac342f4945a262a4c0fb2440634aa600b8d3f07c6c257c9d3d6e648a319b2402
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: /scripts/cdr_n1_wave_trace.py
      - name: Fetch and authenticate preserved native archive
        run: |
          set -euo pipefail
          df -h / /mnt || true
          W=/mnt/n1; sudo mkdir -p $W; sudo chown $USER $W
          gh api repos/${{ github.repository }}/actions/artifacts/$ARTIFACT_ID/zip > $W/n1.zip
          echo "$ARTIFACT_SHA256  $W/n1.zip" | sha256sum -c -
          unzip -l $W/n1.zip | grep -E "wave.raw|\.json$" | head -20
          member=$(unzip -Z1 $W/n1.zip | grep -E '(^|/)loaded-n1-nominal_late/wave.raw$')
          test "$(echo "$member" | wc -l)" = 1
          unzip -p $W/n1.zip "$member" > $W/wave.raw
          rm $W/n1.zip
          ls -l $W/wave.raw
      - run: python3 -m pip install --disable-pip-version-check --no-cache-dir numpy==2.3.3
      - name: Sample every saved vector at 16 phases per bit
        run: python3 -B scripts/cdr_n1_wave_trace.py /mnt/n1/wave.raw n1-wave-trace
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: n1-wave-trace-${{ github.run_id }}
          path: n1-wave-trace
          if-no-files-found: error
          retention-days: 90
