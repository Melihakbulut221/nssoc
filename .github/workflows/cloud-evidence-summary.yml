name: Compare official I/O GDS revisions natively
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install pinned native geometry reader
        run: python3 -m pip install klayout==0.30.9
      - name: Compare recursive polygons and labels of all pad macros
        run: python3 scripts/cloud_core_only_io_gds_revision.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: core-only-io-gds-revision-${{ github.run_id }}
          path: hw/soc/out/core-only-io-gds-revision/
          if-no-files-found: error
          retention-days: 90
