name: Classify actual rejected six-shortcut transient
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: cdr-wire-device-audit-${{ github.ref }}
  cancel-in-progress: false
env:
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  classify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/cdr-wire-shortcuts-device-audit-pins.json
      - name: Materialize exact classifier source
        run: |
          python3 -B - <<'PY'
          import json,subprocess
          from pathlib import Path
          m='scripts/cdr-wire-shortcuts-device-audit-pins.json'
          names=sorted(set(json.loads(Path(m).read_bytes())['files'])|{m})
          assert all(not n.startswith('/')and '..'not in Path(n).parts and not any(c in n for c in '*?[!\\\n\r')for n in names)
          subprocess.run(['git','sparse-checkout','set','--no-cone','--stdin'],input=''.join('/'+n+'\n'for n in names),text=True,check=True)
          PY
      - name: Check exact electrical boundary predicates
        run: python3 -B scripts/cloud_cdr_wire_shortcuts_device_audit.py --controls
      - name: Reproduce rejected measurements and identify failing devices
        run: python3 -B scripts/cloud_cdr_wire_shortcuts_device_audit.py --diagnose
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: wire-device-audit-${{ github.run_id }}
          path: wire-device-audit
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
