name: Measure actual divider attachment wire resistance and capacitance
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          filter: blob:none
          sparse-checkout: scripts/diagnose_nx5_wave.py
          sparse-checkout-cone-mode: false
      - run: python3 -m pip install numpy==2.3.3
      - run: python3 scripts/diagnose_nx5_wave.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: phy-divider-wire-network-${{ github.run_id }}
          path: diagnosis/
          if-no-files-found: error
          retention-days: 90
