  # hands the routed database to `routed-sta` (AuditedRCX and
  # AuditedRoutedSTA of hw/soc/pnr/replay_onehot_routed_extraction_flow.py:
  # nominal OpenRCX, standalone OpenSTA in three corners, derate guard,
  # original clocks, all propagated). Each is its own hosted job.