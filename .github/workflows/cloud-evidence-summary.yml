name: PCIe pipeline - packet-domain timing screen, unit regressions, SoC lint and traffic
on:
  workflow_dispatch:
    inputs:
      timing_sides: {type: string, default: '["baseline","change"]'}
      unit: {type: boolean, default: false}
      soc: {type: boolean, default: false}
      probe: {type: boolean, default: false}
      tests: {type: string, default: 'soc_pcie_replay_tx soc_pcie_flow_packets soc_pcie_buffered_flow_packets soc_pcie_reliable_packets'}
permissions:
  contents: read
  actions: read
env:
  BASELINE_REF: timing/pcie-boundary-skid
jobs:
  timing:
    if: inputs.timing_sides != '[]'
    runs-on: ubuntu-22.04
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        side: ${{ fromJSON(inputs.timing_sides) }}
    env:
      APPIMAGE_SHA: d6a349ec65be11456e96c4981d35f63ca34d3c85daf79a51e1ccb907bb5d7466
      PDK_RAW: https://raw.githubusercontent.com/IHP-GmbH/IHP-Open-PDK/c4b8b4e5e7a05f375cca3815d51b3a37721fbf5c/ihp-sg13g2/libs.ref/sg13g2_stdcell
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /hw/soc/rtl/pcie/
            /scripts/pcie_timing/
      - name: Select RTL
        run: |
          if [ "${{ matrix.side }}" = baseline ]; then
            git fetch -q --filter=blob:none https://github.com/${{ github.repository }}.git $BASELINE_REF
            git checkout FETCH_HEAD -- hw/soc/rtl/pcie
          fi
          git log --oneline -1; sha256sum hw/soc/rtl/pcie/soc_pcie_*.v | sha256sum
      - name: Retry transient download failures
        run: printf 'retry = 10\nretry-delay = 30\nretry-all-errors\nfail\n' > ~/.curlrc
      - uses: YosysHQ/setup-oss-cad-suite@aefa8397bbf8fc6670a0a62af9805a89738f3cde
        id: cad1
        continue-on-error: true
        with:
          version: '2026-08-04'
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - if: steps.cad1.outcome == 'failure'
        run: sleep 180
      - uses: YosysHQ/setup-oss-cad-suite@aefa8397bbf8fc6670a0a62af9805a89738f3cde
        id: cad2
        if: steps.cad1.outcome == 'failure'
        continue-on-error: true
        with:
          version: '2026-08-04'
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - if: steps.cad1.outcome == 'failure' && steps.cad2.outcome == 'failure'
        run: sleep 300
      - uses: YosysHQ/setup-oss-cad-suite@aefa8397bbf8fc6670a0a62af9805a89738f3cde
        if: steps.cad1.outcome == 'failure' && steps.cad2.outcome == 'failure'
        with:
          version: '2026-08-04'
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Liberty, LEF and OpenROAD
        run: |
          set -euo pipefail
          W=/mnt/s; sudo mkdir -p $W; sudo chown $USER $W
          curl -fsSL -o $W/typ.lib $PDK_RAW/lib/sg13g2_stdcell_typ_1p20V_25C.lib
          curl -fsSL -o $W/slow.lib $PDK_RAW/lib/sg13g2_stdcell_slow_1p08V_125C.lib
          curl -fsSL -o $W/tech.lef $PDK_RAW/lef/sg13g2_tech.lef
          curl -fsSL -o $W/cells.lef $PDK_RAW/lef/sg13g2_stdcell.lef
          sha256sum -c - <<EOF
          968b0cfdcefc49a88d9a5c48874769eaad9aba3509e1240b5e14a821bb07a3c4  $W/typ.lib
          ed1cff6e4d66d89d200e94c2213b8926a71c451218ca2df9b1157c98460e4b1d  $W/slow.lib
          e3470344dfac5347b176fb3f8e0f0548d17a66b8f433626a8987dcb2ae4828b6  $W/tech.lef
          c7575039af0b124e1834c407bfb9ac7a2db576d1e3533d98474dad3fbc2af589  $W/cells.lef
          EOF
          sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends libfuse2
          curl -fsSL -o $W/librelane.AppImage https://github.com/librelane/librelane/releases/download/3.0.5/librelane-devshell-x86_64.AppImage
          echo "$APPIMAGE_SHA  $W/librelane.AppImage" | sha256sum -c -; chmod +x $W/librelane.AppImage
      - name: Synthesis and two-corner STA of the packet domain
        run: |
          set -euo pipefail
          W=/mnt/s
          LEFS="$W/tech.lef $W/cells.lef" STA_TIMEOUT=6000 timeout 6600 bash scripts/pcie_timing/run.sh $W/typ.lib $W/slow.lib $PWD/out \
            env -u GH_TOKEN -u GITHUB_TOKEN $W/librelane.AppImage openroad -exit
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: pcie-timing-${{ matrix.side }}-${{ github.run_id }}
          path: |
            out/*.rpt
            out/*.txt
            out/*.log
            out/*.ys
            out/*.sdc
            out/*.tcl
          retention-days: 30
  unit:
    if: inputs.unit
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /hw/soc/rtl/
            /hw/soc/tb/cocotb/
            /hw/requirements.txt
      - name: Retry transient download failures
        run: printf 'retry = 10\nretry-delay = 30\nretry-all-errors\nfail\n' > ~/.curlrc
      - uses: YosysHQ/setup-oss-cad-suite@aefa8397bbf8fc6670a0a62af9805a89738f3cde
        id: cad1
        continue-on-error: true
        with:
          version: '2026-08-04'
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - if: steps.cad1.outcome == 'failure'
        run: sleep 180
      - uses: YosysHQ/setup-oss-cad-suite@aefa8397bbf8fc6670a0a62af9805a89738f3cde
        id: cad2
        if: steps.cad1.outcome == 'failure'
        continue-on-error: true
        with:
          version: '2026-08-04'
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - if: steps.cad1.outcome == 'failure' && steps.cad2.outcome == 'failure'
        run: sleep 300
      - uses: YosysHQ/setup-oss-cad-suite@aefa8397bbf8fc6670a0a62af9805a89738f3cde
        if: steps.cad1.outcome == 'failure' && steps.cad2.outcome == 'failure'
        with:
          version: '2026-08-04'
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Python test environment
        run: |
          python3 -m venv hw/.venv && hw/.venv/bin/pip install -q -r hw/requirements.txt
          git log --oneline -1; iverilog -V 2>&1 | head -1
      - name: Unit regressions
        shell: bash
        run: |
          set +e -uo pipefail
          mkdir -p out; fail=0
          for t in ${{ inputs.tests }}; do
            mk=hw/soc/tb/cocotb/Makefile.$t
            if [ ! -f $mk ]; then echo "MISSING $t"; fail=1; continue; fi
            ( cd hw/soc/tb/cocotb && PATH="$PWD/../../../.venv/bin:$PATH" timeout 3000 make -f Makefile.$t SIM_BUILD=/tmp/sb_$t COCOTB_RESULTS_FILE=$GITHUB_WORKSPACE/out/results_$t.xml > $GITHUB_WORKSPACE/out/$t.log 2>&1 ); rc=$?
            echo "TEST $t rc=$rc"; grep -E "TESTS=|PASS=|FAIL=|SKIP=" out/$t.log | tail -2
            [ $rc -eq 0 ] || { fail=1; tail -60 out/$t.log; }
          done
          echo "OVERALL fail=$fail"; exit $fail
      - name: Lint the PCIe packet subsystem
        run: |
          R=hw/soc/rtl/pcie
          verilator --lint-only -Wall -Wno-DECLFILENAME -Wno-UNUSEDSIGNAL -Wno-UNUSEDPARAM -Wno-PINCONNECTEMPTY --top-module soc_pcie_buffered_flow_packets $R/*.v 2>&1 | grep -E "%(Error|Warning)" | grep -E "replay_tx|buffered_flow|stream_skid|credit_tx|reliable_packets|flow_packets" | head -60 | tee out/lint.txt || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: pcie-pipeline-unit-${{ github.run_id }}
          path: out
          retention-days: 30
  soc:
    if: inputs.soc
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Retry transient download failures
        run: printf 'retry = 10\nretry-delay = 30\nretry-all-errors\nfail\n' > ~/.curlrc
      - uses: YosysHQ/setup-oss-cad-suite@aefa8397bbf8fc6670a0a62af9805a89738f3cde
        id: cad1
        continue-on-error: true
        with:
          version: '2026-08-04'
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - if: steps.cad1.outcome == 'failure'
        run: sleep 180
      - uses: YosysHQ/setup-oss-cad-suite@aefa8397bbf8fc6670a0a62af9805a89738f3cde
        id: cad2
        if: steps.cad1.outcome == 'failure'
        continue-on-error: true
        with:
          version: '2026-08-04'
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - if: steps.cad1.outcome == 'failure' && steps.cad2.outcome == 'failure'
        run: sleep 300
      - uses: YosysHQ/setup-oss-cad-suite@aefa8397bbf8fc6670a0a62af9805a89738f3cde
        if: steps.cad1.outcome == 'failure' && steps.cad2.outcome == 'failure'
        with:
          version: '2026-08-04'
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Prepare the pinned CPU and interface RTL
        run: |
          git log --oneline -1
          echo "OSS_CAD_SUITE=$(dirname "$(dirname "$(command -v yosys)")")" >> "$GITHUB_ENV"
          python3 -m pip install -q -r sw/requirements.txt
          python3 -m venv hw/.venv
          hw/.venv/bin/pip install -q -r hw/requirements.txt
          make soc-rtl-prepare INTERFACE_PYTHON="$PWD/hw/.venv/bin/python"
          make soc-interfaces-prepare SOC_INTERFACE_PROFILE=full INTERFACE_PYTHON="$PWD/hw/.venv/bin/python"
      - name: Base and full lint, joint PCIe/Ethernet traffic (asynchronous and synchronous packet clock)
        run: |
          set +e
          O=$PWD/out; mkdir -p $O
          python3 scripts/check_soc_lint.py --profile base --output hw/soc/out/pipe-lint-base > $O/lint-base.log 2>&1; echo "lint-base rc=$?"
          python3 scripts/check_soc_lint.py --profile full --output hw/soc/out/pipe-lint-full > $O/lint-full.log 2>&1; echo "lint-full rc=$?"
          cp -r hw/soc/out/pipe-lint-base $O/lint-base; cp -r hw/soc/out/pipe-lint-full $O/lint-full
          python3 scripts/check_pcie_ethernet_soc.py --out $O/joint-async --iverilog-dir $OSS_CAD_SUITE/bin --async-pcie > $O/joint-async.log 2>&1; echo "joint-async rc=$?"
          python3 scripts/check_pcie_ethernet_soc.py --out $O/joint-sync --iverilog-dir $OSS_CAD_SUITE/bin > $O/joint-sync.log 2>&1; echo "joint-sync rc=$?"
          for f in lint-base lint-full joint-async joint-sync; do
            python3 -c "import json,sys;d=json.load(open(sys.argv[1]));print(sys.argv[2],{k:d.get(k) for k in ('status','tests','delta','sources_unchanged','immutable_drift','own_unaccepted','unchanged','runtime_unchanged','asynchronous_pcie')})" $O/$f/result.json $f 2>/dev/null || { echo "$f no result"; tail -30 $O/$f.log; }
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: pcie-pipeline-soc-${{ github.run_id }}
          path: |
            out/*.log
            out/*/result.json
          retention-days: 30
  probe:
    if: inputs.probe
    runs-on: ubuntu-22.04
    timeout-minutes: 355
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: rfup_d70_ks, overrides: '{"PL_TARGET_DENSITY_PCT": 70}', prefix: '1', regfile: upstream, deep: '0'}
          - {name: deep_rfup_d70_ks, overrides: '{"PL_TARGET_DENSITY_PCT": 70}', prefix: '1', regfile: upstream, deep: '1'}
    env:
      GH_TOKEN: ${{ github.token }}
      APPIMAGE_SHA: d6a349ec65be11456e96c4981d35f63ca34d3c85daf79a51e1ccb907bb5d7466
      PACKAGE_SHA: 822dab7067d901fa79dabffffff784baf5c9965f0a5091eba67acdc48b9956f4
      SOC_INTERFACE_PROFILE: full
      SOC_CORE_REQ_REG: ${{ matrix.core_req || '0' }}
      SOC_CORE_WB_STAGE: ${{ matrix.core_wb || '0' }}
      SOC_SYNTH_PREFIX_ADDER: ${{ matrix.prefix || '0' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Implementation probe scripts from analysis/impl-probe (this branch's RTL)
        run: |
          git fetch -q --depth 1 https://github.com/${{ github.repository }}.git analysis/impl-probe
          git checkout FETCH_HEAD -- scripts/impl_probe.py hw/soc/flow/syn_soc_top.sh
          git log --oneline -1; sha256sum hw/soc/rtl/pcie/soc_pcie_*.v | sha256sum
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Retry transient download failures
        run: printf 'retry = 10\nretry-delay = 30\nretry-all-errors\nfail\n' > ~/.curlrc
      - uses: YosysHQ/setup-oss-cad-suite@aefa8397bbf8fc6670a0a62af9805a89738f3cde
        id: cad1
        continue-on-error: true
        with:
          version: '2026-08-04'
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - if: steps.cad1.outcome == 'failure'
        run: sleep 180
      - uses: YosysHQ/setup-oss-cad-suite@aefa8397bbf8fc6670a0a62af9805a89738f3cde
        id: cad2
        if: steps.cad1.outcome == 'failure'
        continue-on-error: true
        with:
          version: '2026-08-04'
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - if: steps.cad1.outcome == 'failure' && steps.cad2.outcome == 'failure'
        run: sleep 300
      - uses: YosysHQ/setup-oss-cad-suite@aefa8397bbf8fc6670a0a62af9805a89738f3cde
        if: steps.cad1.outcome == 'failure' && steps.cad2.outcome == 'failure'
        with:
          version: '2026-08-04'
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Prepare digital inputs, firmware and the native synthesis (same settings as the boot candidate)
        run: |
          set -euo pipefail
          export OSS_CAD_SUITE="$(dirname "$(dirname "$(command -v yosys)")")"
          echo "OSS_CAD_SUITE=$OSS_CAD_SUITE" >> "$GITHUB_ENV"
          python3 -m pip install -q -r sw/requirements.txt
          make soc-prepare > /tmp/soc-prepare.log 2>&1 || { tail -60 /tmp/soc-prepare.log; exit 1; }
          OUT=$PWD/hw/soc/out/impl-probe; mkdir -p $OUT
          export SOC_SRAM_MBIST=1
          python3 hw/soc/flow/prepare_ihp_native_boot.py > $OUT/prepare-models.log
          export PDK_ROOT="$PWD/hw/soc/tools/ihp-native-boot-c4b8b4e"
          eval "$(make --no-print-directory -f hw/soc/tools.soc.mk printvars)"
          unset BOOT_CORRUPT SW_DEFINES SOC_VVP_ARGS SOC_BOOT_ROM_DIR SOC_BOOT_ROM_IMAGE
          unset SOC_RAM_RDREG SOC_ROM_RDREG SOC_SCRUB_IVL SOC_DED_WORD SOC_STRAP SOC_TIMEOUT_CYCLES
          export UART_SCALER=0 SOC_PROBE=0 SOC_RAM_RANDOM=1 SOC_CLKGATE=1 SOC_APB_TIMEOUT=256
          export IBEX_REGFILE=secded IBEX_FAULT_PORT=1 SOC_MEM_HARDEN=1 SOC_ROM_HARDEN=1
          export SOC_BOOT_ROM=logic SOC_MEM_RDREG=1 SOC_REQ_REG=1 SOC_RF_SYNPRE=0 SOC_RF_CORRPRE=1 SOC_WAKE_GNT=1
          timeout 1800 bash hw/soc/flow/sim_soc.sh "$OUT/rtl" > "$OUT/rtl-driver.log" 2>&1 || { tail -40 "$OUT/rtl-driver.log"; exit 1; }
          export SOC_BOOT_ROM_IMAGE="$OUT/rtl/test_soc.bin" SOC_MEM=sram
          export IBEX_RF_SYNPRE=0 IBEX_RF_CORRPRE=1 SOC_ETH_SRAM=1 SOC_PCIE_PROFILE=packet-async
          # Measurement only: regfile=upstream drops the register file's inline
          # SECDED (the fault port is tied to zero by ibex_fault_port.py).
          if [ "${{ matrix.regfile || 'secded' }}" = upstream ]; then export IBEX_REGFILE=upstream IBEX_RF_CORRPRE=0; fi
          timeout 3600 bash hw/soc/flow/syn_soc_top.sh 20 "$OUT/synthesis" > "$OUT/synthesis-driver.log" 2>&1 || { tail -40 "$OUT/synthesis-driver.log"; exit 1; }
          grep -E 'regfile=|Parameter .CORRPRE = 1' "$OUT/synthesis/syn.log" "$OUT/synthesis-driver.log" | head -3 || true
          sha256sum $OUT/synthesis/soc_top.netlist.v $OUT/rtl/test_soc.bin
          grep -iE "Number of cells|Chip area" $OUT/synthesis/syn.log | tail -3 || true
      - name: LibreLane AppImage and the verified PDK from the post-route input package
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends libfuse2
          W=/mnt/s; sudo mkdir -p $W; sudo chown $USER $W
          curl -fsSL -o $W/librelane.AppImage https://github.com/librelane/librelane/releases/download/3.0.5/librelane-devshell-x86_64.AppImage
          echo "$APPIMAGE_SHA  $W/librelane.AppImage" | sha256sum -c -; chmod +x $W/librelane.AppImage
          for attempt in 1 2 3 4 5 6; do
            gh api repos/${{ github.repository }}/releases/assets/663146895 -H "Accept: application/octet-stream" > $W/pkg.tgz && echo "$PACKAGE_SHA  $W/pkg.tgz" | sha256sum -c - && break
            sleep 60
          done
          echo "$PACKAGE_SHA  $W/pkg.tgz" | sha256sum -c -
          mkdir -p $W/pkg && tar -xzf $W/pkg.tgz -C $W/pkg && rm $W/pkg.tgz
          P=$(dirname "$(find $W/pkg -name input-contract.json | head -1)")
          python3 - "$P" <<'PY'
          import hashlib,json,shutil,sys
          from pathlib import Path
          p=Path(sys.argv[1]);c=json.loads((p/'input-contract.json').read_text());n=0
          for name,row in c['input_files'].items():
              if not name.startswith('hw/soc/tools/ciel-corrpre/'):continue
              src=p/'files'/name;dst=Path(name)
              assert hashlib.sha256(src.read_bytes()).hexdigest()==row['sha256']
              if not dst.exists():dst.parent.mkdir(parents=True,exist_ok=True);shutil.copyfile(src,dst);n+=1
          print('restored PDK files',n)
          PY
      - name: Floorplan to antenna repair (no detailed routing), configuration overrides ${{ matrix.overrides }}
        run: |
          set -euo pipefail
          OUT=$PWD/hw/soc/out/impl-probe; W=/mnt/s
          python3 -B scripts/impl_probe.py prepare $OUT/synthesis/soc_top.mapped.json $OUT/synthesis/soc_top.netlist.v $OUT/prepared '${{ matrix.overrides }}'
          mkdir -p $OUT/run
          env -u GH_TOKEN -u GITHUB_TOKEN $W/librelane.AppImage python hw/soc/pnr/pcie_interface_flow.py --flow PacketInterfaces \
            --pdk-root $PWD/hw/soc/tools/ciel-corrpre --pdk ihp-sg13g2 --scl sg13g2_stdcell --force-run-dir $OUT/run \
            --from Yosys.JsonHeader --to OpenROAD.DetailedRouting --skip OpenROAD.DetailedRouting \
            --skip Yosys.Synthesis --skip Checker.YosysUnmappedCells --skip Checker.YosysSynthChecks --skip Checker.NetlistAssignStatements \
            --with-initial-state $OUT/prepared/state.json $OUT/prepared/config.json > $OUT/run.log 2>&1 || { echo "FLOW_FAILED"; tail -80 $OUT/run.log; }
          python3 -B scripts/impl_probe.py collect $OUT/run $OUT/metrics.json
      - name: Per-corner setup and hold on the post-global-route database
        run: |
          set -euo pipefail
          OUT=$PWD/hw/soc/out/impl-probe; W=/mnt/s
          python3 -B scripts/impl_probe.py sta_tcl $OUT/run $OUT/prepared $OUT/corner-sta.tcl
          env -u GH_TOKEN -u GITHUB_TOKEN $W/librelane.AppImage openroad -exit $OUT/corner-sta.tcl > $OUT/corner-sta.log 2>&1 || echo "CORNER_STA_FAILED"
          grep -a -E "NSSOC_CORNER|slack|Error|ERROR" $OUT/corner-sta.log | grep -av "^\s*$" | head -120 || true
      - name: Uncapped setup repair on the post-global-route database (measurement)
        if: matrix.deep == '1'
        run: |
          set +e
          OUT=$PWD/hw/soc/out/impl-probe; W=/mnt/s
          # The flow's repair_timing runs with -max_iterations 100 and stops with
          # RSZ-0062. Here the same database, libraries, SDC, LAYERS_RC and
          # global-route parasitics get repair_design and an uncapped setup
          # repair (wall-clock bound only), then the same per-corner reports.
          python3 - $OUT/corner-sta.tcl $OUT/deep-repair.tcl <<'PY'
          import sys
          s=open(sys.argv[1]).read();i=s.index('puts "NSSOC_CORNER_BEGIN')
          rep=('set_wire_rc -signal -layer Metal3\nset_wire_rc -clock -layer Metal4\n'
               'repair_design -verbose\nestimate_parasitics -global_routing\n'
               'repair_timing -verbose -setup -setup_margin 0 -repair_tns 100 -max_iterations 1000000 -max_buffer_percent 50\n'
               'estimate_parasitics -global_routing\nputs "NSSOC_DEEP_REPAIR_DONE"\n')
          open(sys.argv[2],'w').write(s[:i]+rep+s[i:].replace('NSSOC_CORNER_','NSSOC_DEEP_CORNER_'))
          PY
          timeout 12600 env -u GH_TOKEN -u GITHUB_TOKEN $W/librelane.AppImage openroad -exit $OUT/deep-repair.tcl > $OUT/deep-repair.log 2>&1; echo "DEEP_RC=$?"
          grep -a -E "NSSOC_DEEP|slack \(|RSZ-00(4|5|6)|^ +[0-9]+ +\|.*\| *-?[0-9.]+ *\|" $OUT/deep-repair.log | tail -60
      - name: Collect
        if: always()
        run: |
          OUT=hw/soc/out/impl-probe; mkdir -p out
          cp $OUT/deep-repair.log $OUT/deep-repair.tcl out/ 2>/dev/null || true
          cp $OUT/metrics.json $OUT/corner-sta.log $OUT/corner-sta.tcl $OUT/run.log $OUT/synthesis-driver.log $OUT/prepared/config.json out/ 2>/dev/null || true
          for d in $OUT/run/*stamidpnr* $OUT/run/*resizer*; do [ -d "$d" ] || continue; b=$(basename $d); mkdir -p out/$b; for c in nom_slow_1p08V_125C; do [ -f $d/$c/max.rpt ] && head -c 3000000 $d/$c/max.rpt > out/$b/$c.max.head.rpt; done; cp $d/*.log out/$b/ 2>/dev/null || true; done
          ls out | head -50
