name: Added antenna diode physical supply contact
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  route:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      APPIMAGE_EXTRACT_AND_RUN: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Recheck additive antenna audit controls
        run: python3 scripts/test_antenna_insertion_admission.py
      - name: Restore pinned runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libfuse2 tcl
          python3 scripts/bootstrap_flow.py
          echo "CLOUD_APPIMAGE=$GITHUB_WORKSPACE/hw/soc/tools/physical/librelane-3.0.5-x86_64.AppImage" >> "$GITHUB_ENV"
      - name: Check native physical diode power contact
        run: python3 scripts/cloud_antenna_power_contact.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: core-only-antenna-power-contact-${{ github.run_id }}
          path: hw/soc/out/core-only-antenna-power-contact/
          if-no-files-found: error
          retention-days: 90
