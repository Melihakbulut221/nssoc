name: Read exact remaining clock TM2 DRC markers
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  qualify:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts
      - run: python3 scripts/read_clock_tm2_markers.py
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: clock-tm2-markers-${{ github.run_id }}
          path: out/
          if-no-files-found: error
          retention-days: 90
