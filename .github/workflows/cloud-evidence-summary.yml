name: CDR lowz8 derived result recovery
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  recover:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Recover derived reports in cloud; preserve native archive there
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api repos/${{ github.repository }}/actions/artifacts/14078352603/zip > source.zip
          python3 - <<'PYCODE'
          import hashlib,json,pathlib,zipfile
          raw=pathlib.Path('source.zip').read_bytes()
          digest=hashlib.sha256(raw).hexdigest()
          assert digest=='fde50c43560df485df21d64b3a05405680c3ad5a7774b6f8a54e501bde0b0bb0'
          z=zipfile.ZipFile('source.zip');out=pathlib.Path('out');out.mkdir()
          records=[]
          for info in z.infolist():
              if pathlib.PurePosixPath(info.filename).name != 'result.json':continue
              parts=pathlib.PurePosixPath(info.filename)
              assert not parts.is_absolute() and '..' not in parts.parts
              data=z.read(info);json.loads(data)
              p=out/parts;p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(data)
              records.append(dict(path=info.filename,size=len(data),sha256=hashlib.sha256(data).hexdigest()))
          assert len(records)==1
          (out/'recovery-index.json').write_text(json.dumps(dict(source_run=43497945915,source_artifact=14078352603,source_sha256=digest,json_files=records,native_downloaded_to_user_machine=False),indent=2))
          print(json.dumps(records))
          PYCODE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cdr-lowz8-json-${{ github.run_id }}
          path: out
          if-no-files-found: error
          retention-days: 90
