# SPDX-License-Identifier: Apache-2.0
name: cloud-evidence-summary
on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [controls, readback]
        default: controls
        required: true
      approved_source:
        description: Exact independently reviewed source SHA for readonly collection
        type: string
        required: false
permissions:
  contents: read
env:
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  source-controls:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/workflows/cloud-evidence-summary.yml
            /scripts/mainchip_terminal_readback.py
            /scripts/check_mainchip_terminal_readback.py
            /scripts/mainchip-stale-wire-terminal-inputs.json
            /scripts/mainchip-stale-wire-terminal-source.json
            /docs/mainchip-two-drt-report-readback-20261031.md
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python3 -B scripts/mainchip_terminal_readback.py --controls
      - run: python3 -B scripts/check_mainchip_terminal_readback.py
  readback:
    needs: source-controls
    if: ${{ inputs.mode == 'readback' && inputs.approved_source == github.sha }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      MODE: ${{ inputs.mode }}
      APPROVED_SOURCE: ${{ inputs.approved_source }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/workflows/cloud-evidence-summary.yml
            /scripts/mainchip_terminal_readback.py
            /scripts/check_mainchip_terminal_readback.py
            /scripts/mainchip-stale-wire-terminal-inputs.json
            /scripts/mainchip-stale-wire-terminal-source.json
            /docs/mainchip-two-drt-report-readback-20261031.md
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Authenticate all 735 members and read exactly two DRT reports in cloud
        run: python3 -B scripts/mainchip_terminal_readback.py > terminal-readback-worker.stdout 2> terminal-readback-worker.stderr
      - name: Preserve complete result or failure and worker logs
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mainchip-drt-report-readback-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            terminal-readback/
            terminal-readback-worker.stdout
            terminal-readback-worker.stderr
          compression-level: 6
          if-no-files-found: error
          retention-days: 90
