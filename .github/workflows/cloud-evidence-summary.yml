name: Ibex separate execute stage - core tests, regressions, native boot and RTL-to-global-route timing probe
on:
  workflow_dispatch:
    inputs:
      probe_only:
        description: Run only the timing probe (skip the functional jobs)
        type: boolean
        default: false
      unit_only:
        description: Run only the unit job
        type: boolean
        default: false
      probe_variant:
        description: Run only this probe matrix entry (empty for all)
        type: string
        default: ''
      repair_iterations:
        description: repair_timing -max_iterations in the uncapped-repair step
        type: string
        default: '1000000'
      rvformal_only:
        description: Run only the riscv-formal comparison (skip everything else)
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
jobs:
  unit:
    if: ${{ !inputs.rvformal_only }}
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Retry transient download failures
        run: printf 'retry = 10\nretry-delay = 30\nretry-all-errors\nfail\n' > ~/.curlrc
      - uses: YosysHQ/setup-oss-cad-suite@aefa8397bbf8fc6670a0a62af9805a89738f3cde
        id: cad1
        continue-on-error: true
        with:
          version: '2026-08-04'
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - run: sleep 180
        if: ${{ (steps.cad1.outcome == 'failure') }}
      - uses: YosysHQ/setup-oss-cad-suite@aefa8397bbf8fc6670a0a62af9805a89738f3cde
        id: cad2
        if: ${{ (steps.cad1.outcome == 'failure') }}
        continue-on-error: true
        with:
          version: '2026-08-04'
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - run: sleep 300
        if: ${{ (steps.cad1.outcome == 'failure' && steps.cad2.outcome == 'failure') }}
      - uses: YosysHQ/setup-oss-cad-suite@aefa8397bbf8fc6670a0a62af9805a89738f3cde
        if: ${{ (steps.cad1.outcome == 'failure' && steps.cad2.outcome == 'failure') }}
        with:
          version: '2026-08-04'
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Prepare the pinned CPU RTL and apply the branch and execute-stage patches
        run: |
          set -euo pipefail
          python3 -m pip install -q -r sw/requirements.txt
          python3 -m venv hw/.venv && hw/.venv/bin/pip install -q -r hw/requirements.txt
          for a in 1 2 3 4; do make soc-rtl-prepare INTERFACE_PYTHON="$PWD/hw/.venv/bin/python" > /tmp/prep.log 2>&1 && break; tail -30 /tmp/prep.log; [ $a = 4 ] && exit 1; echo "prepare attempt $a failed; retrying"; sleep 60; done
          mkdir -p out
          python3 hw/soc/flow/ibex_branch_2cycle.py hw/soc/gen out/br2
          diff -u hw/soc/gen/ibex_id_stage.v out/br2/ibex_id_stage.v > out/ibex_id_stage.br2.diff || true
          cat out/ibex_id_stage.br2.diff
          grep -n "branch_decision_i" hw/soc/gen/ibex_id_stage.v > out/branch_decision_uses.txt; cat out/branch_decision_uses.txt
          mkdir -p out/gen && cp hw/soc/gen/*.v out/gen/ && cp hw/soc/genp/ibex_top.v out/gen/ibex_top.genp.v
          python3 hw/soc/flow/ibex_ex_stage.py hw/soc/gen out/ex
          diff -u hw/soc/gen/ibex_core.v out/ex/ibex_core.v > out/ibex_core.ex.diff || true
          python3 hw/soc/flow/ibex_rf_predecode.py hw/soc/gen out/pre-only
          python3 hw/soc/flow/ibex_ex_stage.py out/pre-only out/pre-ex
          diff -u out/pre-only/ibex_core.v out/pre-ex/ibex_core.v > out/ibex_core.pre-ex.diff || true
          wc -l out/*.diff
      - name: Execute-stage core tests (hazard classes, interrupt/debug sweeps, single step, mutations)
        run: |
          set -o pipefail
          python3 -m pytest -q -rA --durations=15 sw/tests/test_ibex_ex_stage.py 2>&1 | tee out/test_ibex_ex_stage.log
      - name: Core-level branch tests (writeback hazard, branch-target ALU alone, two-cycle branches, execute stage)
        if: always()
        run: python3 -m pytest -q -rA sw/tests/test_ibex_branch_stall.py
      - name: Register-file and memory knob tests (golden model, hazards, injected upsets, existing suites with the knobs)
        if: always()
        run: |
          set -euo pipefail
          python3 -m pytest -q sw/tests/test_regfile_execute_knobs.py
          python3 hw/soc/flow/ibex_rf_predecode.py hw/soc/gen out/pre
          for f in ibex_if_stage ibex_core; do diff -u hw/soc/gen/$f.v out/pre/$f.v > out/$f.pre.diff || true; done
          cat out/ibex_if_stage.pre.diff out/ibex_core.pre.diff
          O=$PWD/out; cd hw/soc/tb/cocotb
          export PYTHONPATH=$GITHUB_WORKSPACE/sw:$GITHUB_WORKSPACE
          P=ibex_register_file_ff
          for cfg in "base:" "chkdefer:-DSOC_RF_EXEC -P$P.CHKDEFER=1" "corrpre_chkdefer:-DSOC_RF_EXEC -P$P.CORRPRE=1 -P$P.CHKDEFER=1"; do
            n=${cfg%%:*}; make -f Makefile.ibex_regfile_secded SIM_BUILD=sb_rf_$n COCOTB_RESULTS_FILE=$O/regfile_$n.xml EXTRA_COMPILE_ARGS="${cfg#*:}" > $O/regfile_$n.log 2>&1 || { tail -40 $O/regfile_$n.log; exit 1; }
            echo "regfile suite $n: $(grep -oE 'TESTS=[0-9]+ PASS=[0-9]+ FAIL=[0-9]+' $O/regfile_$n.log | tail -1)"
          done
          for r in 0 1 2; do for c in "byte:ECC_BYTE=1 RO=0" "word:ECC_BYTE=0 RO=1"; do
            n=${c%%:*}; X=; [ $r = 2 ] && X=-DSOC_MEM_RAWREG; make -f Makefile.soc_mem RDREG=$r ${c#*:} EXTRA_COMPILE_ARGS="$X" SIM_BUILD=sb_mem_${r}_$n COCOTB_RESULTS_FILE=$O/mem_${r}_$n.xml > $O/mem_${r}_$n.log 2>&1 || { tail -40 $O/mem_${r}_$n.log; exit 1; }
            echo "soc_mem suite RDREG=$r $n: $(grep -oE 'TESTS=[0-9]+ PASS=[0-9]+ FAIL=[0-9]+ SKIP=[0-9]+' $O/mem_${r}_$n.log | tail -1)"
          done; done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ibex-ex-stage-unit-${{ github.run_id }}
          path: out
          retention-days: 30

  regress:
    if: ${{ !inputs.probe_only && !inputs.unit_only }}
    needs: unit
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: base}
          - {name: ex, ex: '1'}
          - {name: ex_exec, ex: '1', rf: '1', memreg: '2'}
          - {name: ex_exec_br2, ex: '1', rf: '1', memreg: '2', br2: '1'}
    env:
      SOC_INTERFACE_PROFILE: base
      IBEX_EX_STAGE: ${{ matrix.ex || '0' }}
      SOC_CORE_BT_ALU: ${{ matrix.btalu || '0' }}
      IBEX_BRANCH_2CYCLE: ${{ matrix.br2 || '0' }}
      # exec: deferred check bits, predecoded read address (with the
      # pre-mux correction it needs) and the raw-row memory register.
      SOC_RF_CHKDEFER: ${{ matrix.rf || '0' }}
      SOC_RF_PREDECODE: ${{ matrix.rf || '0' }}
      SOC_RF_CORRPRE: ${{ matrix.rf || '0' }}
      SOC_MEM_RDREG: ${{ matrix.memreg || '0' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Retry transient download failures
        run: printf 'retry = 10\nretry-delay = 30\nretry-all-errors\nfail\n' > ~/.curlrc
      - uses: YosysHQ/setup-oss-cad-suite@aefa8397bbf8fc6670a0a62af9805a89738f3cde
        id: cad1
        continue-on-error: true
        with:
          version: '2026-08-04'
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - run: sleep 180
        if: ${{ (steps.cad1.outcome == 'failure') }}
      - uses: YosysHQ/setup-oss-cad-suite@aefa8397bbf8fc6670a0a62af9805a89738f3cde
        id: cad2
        if: ${{ (steps.cad1.outcome == 'failure') }}
        continue-on-error: true
        with:
          version: '2026-08-04'
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - run: sleep 300
        if: ${{ (steps.cad1.outcome == 'failure' && steps.cad2.outcome == 'failure') }}
      - uses: YosysHQ/setup-oss-cad-suite@aefa8397bbf8fc6670a0a62af9805a89738f3cde
        if: ${{ (steps.cad1.outcome == 'failure' && steps.cad2.outcome == 'failure') }}
        with:
          version: '2026-08-04'
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Prepare processor, interfaces and firmware tools
        run: |
          set -euo pipefail
          echo "OSS_CAD_SUITE=$(dirname "$(dirname "$(command -v yosys)")")" >> "$GITHUB_ENV"
          python3 -m pip install -q -r sw/requirements.txt
          python3 -m venv hw/.venv && hw/.venv/bin/pip install -q -r hw/requirements.txt
          for a in 1 2 3 4; do make soc-prepare INTERFACE_PYTHON="$PWD/hw/.venv/bin/python" > /tmp/prep.log 2>&1 && break; tail -30 /tmp/prep.log; [ $a = 4 ] && exit 1; echo "prepare attempt $a failed; retrying"; sleep 60; done
      - name: Whole-SoC RTL boot, default configuration (make soc-sim)
        run: |
          set -o pipefail
          make soc-sim > soc-sim.log 2>&1; rc=$?; grep -E "^== |checks run|\[TB\]|cycles" soc-sim.log | tail -30; exit $rc
      - name: Boot regression, normal boot and both geometry fallbacks (make soc-boot-regression)
        run: make soc-boot-regression
      - name: Double fault, crash dump, reset and APB retention (make soc-crash-cocotb)
        run: |
          if [ "${{ matrix.name }}" = base ] || [ "${{ matrix.name }}" = ex ]; then make soc-crash-cocotb; exit; fi
          # The make target pins SOC_MEM_RDREG=1 SOC_RF_SYNPRE=1; the knobs
          # need SYNPRE=0. Same recipe, the knob's settings.
          B=$PWD/hw/soc/out/crash-cocotb
          SOC_REQ_REG=1 SW_DEFINES=-DCRASH_DUMP_DEMO SOC_VVP_ARGS=+allow_double_fault bash hw/soc/flow/sim_soc.sh $B
          bash scripts/check_soc_crash_cocotb.sh $B
      - name: Collect
        if: always()
        run: |
          mkdir -p out
          cp soc-sim.log out/ 2>/dev/null || true
          cp -r hw/soc/out/boot-regression out/ 2>/dev/null || true
          for d in hw/soc/out/crash-cocotb hw/soc/out/sim-soc; do
            [ -d "$d" ] || continue; mkdir -p out/$(basename $d); cp $d/*.log $d/*.xml $d/soc_param_override.v out/$(basename $d)/ 2>/dev/null || true; done
          find out -name '*.vvp' -delete
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ibex-ex-stage-regress-${{ matrix.name }}-${{ github.run_id }}
          path: out
          retention-days: 30

  native-boot:
    if: ${{ !inputs.probe_only && !inputs.unit_only }}
    needs: unit
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          # The MBIST boot (983,040 MBIST cycles before the firmware) needs
          # about 1.85 M gate-level cycles at MEM_RDREG = 2 and does not fit
          # the hosted job's wall clock; the same boot without MBIST does.
          - {name: ex_exec, ex: '1', rf: '1', memreg: '2', gate: corrpre-pcie}
          - {name: ex_exec_br2, ex: '1', rf: '1', memreg: '2', br2: '1', gate: corrpre-pcie}
          # The execute stage alone keeps one-cycle memory reads, so the
          # MBIST boot may fit the wall clock (1.64 M cycles took 9413 s with
          # two-cycle branches).
          - {name: ex_mbist, ex: '1'}
    env:
      SOC_INTERFACE_PROFILE: full
      IBEX_EX_STAGE: ${{ matrix.ex || '0' }}
      GATE: ${{ matrix.gate || 'corrpre-pcie-mbist' }}
      SOC_CORE_REQ_REG: '0'
      SOC_CORE_WB_STAGE: '0'
      SOC_CORE_BT_ALU: ${{ matrix.btalu || '0' }}
      IBEX_BRANCH_2CYCLE: ${{ matrix.br2 || '0' }}
      NATIVE_RF_CHKDEFER: ${{ matrix.rf || '0' }}
      NATIVE_RF_PREDECODE: ${{ matrix.rf || '0' }}
      NATIVE_MEM_RDREG: ${{ matrix.memreg || '1' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Retry transient download failures
        run: printf 'retry = 10\nretry-delay = 30\nretry-all-errors\nfail\n' > ~/.curlrc
      - uses: YosysHQ/setup-oss-cad-suite@aefa8397bbf8fc6670a0a62af9805a89738f3cde
        id: cad1
        continue-on-error: true
        with:
          version: '2026-08-04'
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - run: sleep 180
        if: ${{ (steps.cad1.outcome == 'failure') }}
      - uses: YosysHQ/setup-oss-cad-suite@aefa8397bbf8fc6670a0a62af9805a89738f3cde
        id: cad2
        if: ${{ (steps.cad1.outcome == 'failure') }}
        continue-on-error: true
        with:
          version: '2026-08-04'
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - run: sleep 300
        if: ${{ (steps.cad1.outcome == 'failure' && steps.cad2.outcome == 'failure') }}
      - uses: YosysHQ/setup-oss-cad-suite@aefa8397bbf8fc6670a0a62af9805a89738f3cde
        if: ${{ (steps.cad1.outcome == 'failure' && steps.cad2.outcome == 'failure') }}
        with:
          version: '2026-08-04'
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Prepare exact digital inputs
        run: |
          echo "OSS_CAD_SUITE=$(dirname "$(dirname "$(command -v yosys)")")" >> "$GITHUB_ENV"
          python3 -m pip install -q -r sw/requirements.txt
          for a in 1 2 3 4; do make soc-prepare > /tmp/prep.log 2>&1 && break; tail -30 /tmp/prep.log; [ $a = 4 ] && exit 1; echo "prepare attempt $a failed; retrying"; sleep 60; done
      - name: Native CORRPRE, PCIe, system MBIST and Ethernet MBIST gate-level boot
        run: bash scripts/check_soc_${GATE//-/_}_native_boot.sh
      - name: Show the selected core and the gate-level verdict
        if: always()
        run: |
          O=hw/soc/out/$GATE-native-boot
          cat $O/core-configuration.json || true
          grep -E "core_bt_alu|branch_2cycle|ex_stage=|chkdefer=|genp/gen-br2|genp/gen-pre|genp/gen-ex|Parameter .(CHKDEFER|RDPRE|MEM_RDREG)" $O/synthesis-driver.log $O/synthesis/syn.log | head -8 || true
          grep -E "^== |checks run|\[TB\]" $O/rtl-driver.log | tail -10 || true
          tail -30 $O/gates-driver.log || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ibex-ex-stage-native-boot-${{ matrix.name }}-${{ github.run_id }}
          path: |
            hw/soc/out/*-native-boot/**/*.log
            hw/soc/out/*-native-boot/**/*.json
            hw/soc/out/*-native-boot/rtl/soc_param_override.v
          retention-days: 30

  probe:
    needs: unit
    if: ${{ !inputs.unit_only && !inputs.rvformal_only }}
    runs-on: ubuntu-22.04
    timeout-minutes: 355
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: r4_base, overrides: '{"PL_TARGET_DENSITY_PCT": 70}', prefix: '1', deep: '1'}
          - {name: r4_ex, overrides: '{"PL_TARGET_DENSITY_PCT": 70}', prefix: '1', deep: '1', ex: '1'}
          - {name: r4_ex_exec, overrides: '{"PL_TARGET_DENSITY_PCT": 70}', prefix: '1', deep: '1', ex: '1', chkdefer: '1', memreg: '2', predecode: '1'}
          - {name: r4_ex_exec_br2, overrides: '{"PL_TARGET_DENSITY_PCT": 70}', prefix: '1', deep: '1', ex: '1', chkdefer: '1', memreg: '2', predecode: '1', br2: '1'}
    env:
      GH_TOKEN: ${{ github.token }}
      APPIMAGE_SHA: d6a349ec65be11456e96c4981d35f63ca34d3c85daf79a51e1ccb907bb5d7466
      PACKAGE_SHA: 822dab7067d901fa79dabffffff784baf5c9965f0a5091eba67acdc48b9956f4
      SOC_INTERFACE_PROFILE: full
      SOC_CORE_REQ_REG: '0'
      SOC_CORE_WB_STAGE: '0'
      SOC_SYNTH_PREFIX_ADDER: ${{ matrix.prefix || '0' }}
      SOC_CORE_BT_ALU: ${{ matrix.btalu || '0' }}
      IBEX_BRANCH_2CYCLE: ${{ matrix.br2 || '0' }}
      KNOB_CHKDEFER: ${{ matrix.chkdefer || '0' }}
      KNOB_PREDECODE: ${{ matrix.predecode || '0' }}
      KNOB_RDRAW: ${{ matrix.rdraw || '0' }}
      KNOB_MEMREG: ${{ matrix.memreg || '1' }}
      IBEX_EX_STAGE: ${{ matrix.ex || '0' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        if: ${{ (inputs.probe_variant == '' || inputs.probe_variant == matrix.name) }}
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        if: ${{ (inputs.probe_variant == '' || inputs.probe_variant == matrix.name) }}
        with:
          python-version: '3.12'
      - name: Retry transient download failures
        if: ${{ ((inputs.probe_variant == '' || inputs.probe_variant == matrix.name)) }}
        run: printf 'retry = 10\nretry-delay = 30\nretry-all-errors\nfail\n' > ~/.curlrc
      - uses: YosysHQ/setup-oss-cad-suite@aefa8397bbf8fc6670a0a62af9805a89738f3cde
        id: cad1
        if: ${{ ((inputs.probe_variant == '' || inputs.probe_variant == matrix.name)) }}
        continue-on-error: true
        with:
          version: '2026-08-04'
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - run: sleep 180
        if: ${{ ((inputs.probe_variant == '' || inputs.probe_variant == matrix.name)) && (steps.cad1.outcome == 'failure') }}
      - uses: YosysHQ/setup-oss-cad-suite@aefa8397bbf8fc6670a0a62af9805a89738f3cde
        id: cad2
        if: ${{ ((inputs.probe_variant == '' || inputs.probe_variant == matrix.name)) && (steps.cad1.outcome == 'failure') }}
        continue-on-error: true
        with:
          version: '2026-08-04'
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - run: sleep 300
        if: ${{ ((inputs.probe_variant == '' || inputs.probe_variant == matrix.name)) && (steps.cad1.outcome == 'failure' && steps.cad2.outcome == 'failure') }}
      - uses: YosysHQ/setup-oss-cad-suite@aefa8397bbf8fc6670a0a62af9805a89738f3cde
        if: ${{ ((inputs.probe_variant == '' || inputs.probe_variant == matrix.name)) && (steps.cad1.outcome == 'failure' && steps.cad2.outcome == 'failure') }}
        with:
          version: '2026-08-04'
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Prepare digital inputs, firmware and the native synthesis (same settings as the boot candidate)
        if: ${{ (inputs.probe_variant == '' || inputs.probe_variant == matrix.name) }}
        run: |
          set -euo pipefail
          export OSS_CAD_SUITE="$(dirname "$(dirname "$(command -v yosys)")")"
          echo "OSS_CAD_SUITE=$OSS_CAD_SUITE" >> "$GITHUB_ENV"
          python3 -m pip install -q -r sw/requirements.txt
          for a in 1 2 3 4; do make soc-prepare > /tmp/soc-prepare.log 2>&1 && break; tail -30 /tmp/soc-prepare.log; [ $a = 4 ] && exit 1; echo "prepare attempt $a failed; retrying"; sleep 60; done
          OUT=$PWD/hw/soc/out/impl-probe; mkdir -p $OUT
          export SOC_SRAM_MBIST=1
          python3 hw/soc/flow/prepare_ihp_native_boot.py > $OUT/prepare-models.log
          export PDK_ROOT="$PWD/hw/soc/tools/ihp-native-boot-c4b8b4e"
          eval "$(make --no-print-directory -f hw/soc/tools.soc.mk printvars)"
          unset BOOT_CORRUPT SW_DEFINES SOC_VVP_ARGS SOC_BOOT_ROM_DIR SOC_BOOT_ROM_IMAGE
          unset SOC_RAM_RDREG SOC_ROM_RDREG SOC_SCRUB_IVL SOC_DED_WORD SOC_STRAP SOC_TIMEOUT_CYCLES
          export UART_SCALER=0 SOC_PROBE=0 SOC_RAM_RANDOM=1 SOC_CLKGATE=1 SOC_APB_TIMEOUT=256
          export IBEX_REGFILE=secded IBEX_FAULT_PORT=1 SOC_MEM_HARDEN=1 SOC_ROM_HARDEN=1
          export SOC_BOOT_ROM=logic SOC_MEM_RDREG=1 SOC_REQ_REG=1 SOC_RF_SYNPRE=0 SOC_RF_CORRPRE=1 SOC_WAKE_GNT=1
          # docs/ibex-execute-timing.md knobs. RDRAW (measurement) replaces CORRPRE.
          CORR=1; [ "$KNOB_RDRAW" = 1 ] && CORR=0
          export SOC_MEM_RDREG=$KNOB_MEMREG SOC_RF_CORRPRE=$CORR SOC_RF_CHKDEFER=$KNOB_CHKDEFER SOC_RF_PREDECODE=$KNOB_PREDECODE SOC_RF_RDRAW=$KNOB_RDRAW
          timeout 1800 bash hw/soc/flow/sim_soc.sh "$OUT/rtl" > "$OUT/rtl-driver.log" 2>&1 || { tail -40 "$OUT/rtl-driver.log"; exit 1; }
          grep -E "^== |checks run|\[TB\] PASS" "$OUT/rtl-driver.log" | tail -12
          export SOC_BOOT_ROM_IMAGE="$OUT/rtl/test_soc.bin" SOC_MEM=sram
          export IBEX_RF_SYNPRE=0 IBEX_RF_CORRPRE=1 SOC_ETH_SRAM=1 SOC_PCIE_PROFILE=packet-async
          export IBEX_RF_CORRPRE=$CORR IBEX_RF_CHKDEFER=$KNOB_CHKDEFER IBEX_RF_PREDECODE=$KNOB_PREDECODE IBEX_RF_RDRAW=$KNOB_RDRAW
          # Measurement only: regfile=upstream drops the register file's inline
          # SECDED (the fault port is tied to zero by ibex_fault_port.py).
          if [ "${{ matrix.regfile || 'secded' }}" = upstream ]; then export IBEX_REGFILE=upstream IBEX_RF_CORRPRE=0; fi
          timeout 3600 bash hw/soc/flow/syn_soc_top.sh 20 "$OUT/synthesis" > "$OUT/synthesis-driver.log" 2>&1 || { tail -40 "$OUT/synthesis-driver.log"; exit 1; }
          grep -E 'regfile=|core_req_reg=|Parameter .(CORRPRE|CHKDEFER|RDPRE|RDRAW|MEM_RDREG|CORE_BT_ALU) =|genp/gen-(br2|pre|ex|pre-ex)' "$OUT/synthesis/syn.log" "$OUT/synthesis-driver.log" | sort -u | head -12 || true
          sha256sum $OUT/synthesis/soc_top.netlist.v $OUT/rtl/test_soc.bin
          grep -iE "Number of cells|Chip area" $OUT/synthesis/syn.log | tail -3 || true
      - name: LibreLane AppImage and the verified PDK from the post-route input package
        if: ${{ (inputs.probe_variant == '' || inputs.probe_variant == matrix.name) }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends libfuse2
          W=/mnt/s; sudo mkdir -p $W; sudo chown $USER $W
          curl -fsSL -o $W/librelane.AppImage https://github.com/librelane/librelane/releases/download/3.0.5/librelane-devshell-x86_64.AppImage
          echo "$APPIMAGE_SHA  $W/librelane.AppImage" | sha256sum -c -; chmod +x $W/librelane.AppImage
          for attempt in 1 2 3 4 5 6; do
            gh api repos/${{ github.repository }}/releases/assets/663146895 -H "Accept: application/octet-stream" > $W/pkg.tgz && echo "$PACKAGE_SHA  $W/pkg.tgz" | sha256sum -c - && break
            sleep 60
          done
          echo "$PACKAGE_SHA  $W/pkg.tgz" | sha256sum -c -
          mkdir -p $W/pkg && tar -xzf $W/pkg.tgz -C $W/pkg && rm $W/pkg.tgz
          P=$(dirname "$(find $W/pkg -name input-contract.json | head -1)")
          python3 - "$P" <<'PY'
          import hashlib,json,shutil,sys
          from pathlib import Path
          p=Path(sys.argv[1]);c=json.loads((p/'input-contract.json').read_text());n=0
          for name,row in c['input_files'].items():
              if not name.startswith('hw/soc/tools/ciel-corrpre/'):continue
              src=p/'files'/name;dst=Path(name)
              assert hashlib.sha256(src.read_bytes()).hexdigest()==row['sha256']
              if not dst.exists():dst.parent.mkdir(parents=True,exist_ok=True);shutil.copyfile(src,dst);n+=1
          print('restored PDK files',n)
          PY
      - name: Floorplan to antenna repair (no detailed routing), configuration overrides ${{ matrix.overrides }}
        if: ${{ (inputs.probe_variant == '' || inputs.probe_variant == matrix.name) }}
        run: |
          set -euo pipefail
          OUT=$PWD/hw/soc/out/impl-probe; W=/mnt/s
          python3 -B scripts/impl_probe.py prepare $OUT/synthesis/soc_top.mapped.json $OUT/synthesis/soc_top.netlist.v $OUT/prepared '${{ matrix.overrides }}'
          mkdir -p $OUT/run
          env -u GH_TOKEN -u GITHUB_TOKEN $W/librelane.AppImage python hw/soc/pnr/pcie_interface_flow.py --flow PacketInterfaces \
            --pdk-root $PWD/hw/soc/tools/ciel-corrpre --pdk ihp-sg13g2 --scl sg13g2_stdcell --force-run-dir $OUT/run \
            --from Yosys.JsonHeader --to OpenROAD.DetailedRouting --skip OpenROAD.DetailedRouting \
            --skip Yosys.Synthesis --skip Checker.YosysUnmappedCells --skip Checker.YosysSynthChecks --skip Checker.NetlistAssignStatements \
            --with-initial-state $OUT/prepared/state.json $OUT/prepared/config.json > $OUT/run.log 2>&1 || { echo "FLOW_FAILED"; tail -80 $OUT/run.log; }
          python3 -B scripts/impl_probe.py collect $OUT/run $OUT/metrics.json
      - name: Per-corner setup and hold on the post-global-route database
        if: ${{ (inputs.probe_variant == '' || inputs.probe_variant == matrix.name) }}
        run: |
          set -euo pipefail
          OUT=$PWD/hw/soc/out/impl-probe; W=/mnt/s
          python3 -B scripts/impl_probe.py sta_tcl $OUT/run $OUT/prepared $OUT/corner-sta.tcl
          env -u GH_TOKEN -u GITHUB_TOKEN $W/librelane.AppImage openroad -exit $OUT/corner-sta.tcl > $OUT/corner-sta.log 2>&1 || echo "CORNER_STA_FAILED"
          grep -a -E "NSSOC_CORNER|slack|Error|ERROR" $OUT/corner-sta.log | grep -av "^\s*$" | head -120 || true
      - name: Uncapped setup repair on the post-global-route database (measurement)
        if: ${{ (inputs.probe_variant == '' || inputs.probe_variant == matrix.name) && (matrix.deep == '1') }}
        run: |
          set +e
          OUT=$PWD/hw/soc/out/impl-probe; W=/mnt/s
          # The flow's repair_timing runs with -max_iterations 100 and stops with
          # RSZ-0062. Here the same database, libraries, SDC, LAYERS_RC and
          # global-route parasitics get repair_design and an uncapped setup
          # repair (wall-clock bound only), then the same per-corner reports.
          echo "repair_timing -max_iterations ${{ inputs.repair_iterations || '1000000' }}"
          python3 - $OUT/corner-sta.tcl $OUT/deep-repair.tcl <<'PY'
          import sys
          s=open(sys.argv[1]).read();i=s.index('puts "NSSOC_CORNER_BEGIN')
          rep=('set_wire_rc -signal -layer Metal3\nset_wire_rc -clock -layer Metal4\n'
               'repair_design -verbose\nestimate_parasitics -global_routing\n'
               'repair_timing -verbose -setup -setup_margin 0 -repair_tns 100 -max_iterations ${{ inputs.repair_iterations || '1000000' }} -max_buffer_percent 50\n'
               'estimate_parasitics -global_routing\nputs "NSSOC_DEEP_REPAIR_DONE"\n')
          open(sys.argv[2],'w').write(s[:i]+rep+s[i:].replace('NSSOC_CORNER_','NSSOC_DEEP_CORNER_'))
          PY
          timeout 12600 env -u GH_TOKEN -u GITHUB_TOKEN $W/librelane.AppImage openroad -exit $OUT/deep-repair.tcl > $OUT/deep-repair.log 2>&1; echo "DEEP_RC=$?"
          grep -a -E "NSSOC_DEEP|slack \(|RSZ-00(4|5|6)|^ +[0-9]+ +\|.*\| *-?[0-9.]+ *\|" $OUT/deep-repair.log | tail -60
      - name: Collect
        if: ${{ (inputs.probe_variant == '' || inputs.probe_variant == matrix.name) && (always()) }}
        run: |
          OUT=hw/soc/out/impl-probe; mkdir -p out
          cp $OUT/deep-repair.log $OUT/deep-repair.tcl out/ 2>/dev/null || true
          cp $OUT/metrics.json $OUT/corner-sta.log $OUT/corner-sta.tcl $OUT/run.log $OUT/synthesis-driver.log $OUT/rtl-driver.log $OUT/prepared/config.json out/ 2>/dev/null || true
          for d in $OUT/run/*stamidpnr* $OUT/run/*resizer*; do [ -d "$d" ] || continue; b=$(basename $d); mkdir -p out/$b; for c in nom_slow_1p08V_125C; do [ -f $d/$c/max.rpt ] && head -c 3000000 $d/$c/max.rpt > out/$b/$c.max.head.rpt; done; cp $d/*.log out/$b/ 2>/dev/null || true; done
          ls out | head -50
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ (inputs.probe_variant == '' || inputs.probe_variant == matrix.name) && (always()) }}
        with:
          name: impl-probe-${{ matrix.name }}-${{ github.run_id }}
          path: out
          retention-days: 30

  # riscv-formal (docs/63) on the RVFI build of the core, unpatched and with
  # the execute stage, upstream register file (docs/63 phase 1). The eight
  # M-extension instruction checks and liveness are left out: docs/63
  # section 8 found no verdict for the first six within 40 minutes each,
  # div/rem fail against riscv-formal's own unsigned model, and liveness is
  # bound by the 37-cycle divider at depth 50.
  rvformal:
    if: ${{ !inputs.probe_only && !inputs.unit_only }}
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: base, ex: '0'}
          - {name: ex, ex: '1'}
    env:
      IBEX_EX_STAGE: ${{ matrix.ex }}
      IBEX_REGFILE: upstream
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Retry transient download failures
        run: printf 'retry = 10\nretry-delay = 30\nretry-all-errors\nfail\n' > ~/.curlrc
      - uses: YosysHQ/setup-oss-cad-suite@aefa8397bbf8fc6670a0a62af9805a89738f3cde
        id: cad1
        continue-on-error: true
        with:
          version: '2026-08-04'
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - run: sleep 180
        if: ${{ (steps.cad1.outcome == 'failure') }}
      - uses: YosysHQ/setup-oss-cad-suite@aefa8397bbf8fc6670a0a62af9805a89738f3cde
        id: cad2
        if: ${{ (steps.cad1.outcome == 'failure') }}
        continue-on-error: true
        with:
          version: '2026-08-04'
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - run: sleep 300
        if: ${{ (steps.cad1.outcome == 'failure' && steps.cad2.outcome == 'failure') }}
      - uses: YosysHQ/setup-oss-cad-suite@aefa8397bbf8fc6670a0a62af9805a89738f3cde
        if: ${{ (steps.cad1.outcome == 'failure' && steps.cad2.outcome == 'failure') }}
        with:
          version: '2026-08-04'
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Pinned CPU RTL, its RVFI conversion and riscv-formal
        run: |
          set -euo pipefail
          echo "OSS_CAD_SUITE=$(dirname "$(dirname "$(command -v yosys)")")" >> "$GITHUB_ENV"
          export OSS_CAD_SUITE="$(dirname "$(dirname "$(command -v yosys)")")"
          python3 -m pip install -q -r sw/requirements.txt
          python3 -m venv hw/.venv && hw/.venv/bin/pip install -q -r hw/requirements.txt
          for a in 1 2 3 4; do make soc-rtl-prepare INTERFACE_PYTHON="$PWD/hw/.venv/bin/python" > /tmp/prep.log 2>&1 && break; tail -30 /tmp/prep.log; [ $a = 4 ] && exit 1; echo "prepare attempt $a failed; retrying"; sleep 60; done
          bash hw/soc/flow/sv2v_ibex.sh hw/soc/ext/ibex hw/soc/genrvfi hw/soc/tools/sv2v-Linux/sv2v RVFI
          make -f hw/soc/tools.soc.mk fetch-riscv-formal
          mkdir -p out
          bash hw/soc/flow/rvformal.sh setup 2>&1 | tee out/setup.log
          if [ "$IBEX_EX_STAGE" = 1 ]; then
            diff -u hw/soc/genrvfi/ibex_core.v hw/soc/genp/genrvfi-ex/ibex_core.v > out/ibex_core.rvfi-ex.diff || true
            grep -c exs_pc_next out/ibex_core.rvfi-ex.diff
          fi
      - name: Bounded checks and cover jobs
        run: |
          set +e
          R=hw/soc/out/rvformal-upstream/cores/ibex
          SKIP='^(insn_(mul|mulh|mulhsu|mulhu|div|divu|rem|remu)_ch0|liveness_ch0)$'
          export PATH="$(dirname "$(command -v sby)"):$PATH"
          for set in checks cover; do
            ( cd $R/$set && ls *.sby | sed 's/\.sby$//' | grep -v -E "$SKIP" |
              xargs -P "$(nproc)" -I{} timeout 2400 sby -f {}.sby > ../$set-run.log 2>&1 )
          done
          bash hw/soc/flow/rvformal.sh report | tee out/report.txt
      - name: Collect
        if: always()
        run: |
          R=hw/soc/out/rvformal-upstream/cores/ibex
          mkdir -p out
          for set in checks cover; do
            for d in $R/$set/*/; do n=$(basename $d); [ -f $d/status ] && echo "$set $n $(cat $d/status)"; done
          done > out/status.txt 2>/dev/null || true
          for d in $R/checks/*/; do [ -f $d/status ] && grep -q FAIL $d/status && { mkdir -p out/fail/$(basename $d); cp $d/logfile.txt $d/engine_*/trace*.vcd out/fail/$(basename $d)/ 2>/dev/null; }; done || true
          cp $R/*.cfg out/ 2>/dev/null || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ibex-ex-stage-rvformal-${{ matrix.name }}-${{ github.run_id }}
          path: out
          retention-days: 30
