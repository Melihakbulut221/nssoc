name: Compare registered receive queue count predicates
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cosim:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: sudo apt-get update -qq && sudo apt-get install -y iverilog
      - name: Compare count predicates alone and with mapped read/reset/commit options
        run: |
          set -euo pipefail
          bash scripts/check_pcie_rx_read_ahead.sh count-flags-alone 300000 SOC_PCIE_RX_COUNT_FLAGS
          bash scripts/check_pcie_rx_read_ahead.sh count-flags-combined 300000 SOC_PCIE_RX_COUNT_FLAGS SOC_PCIE_RX_READ2 SOC_PCIE_RESET_COPIES SOC_PCIE_RX_COMMIT_COPIES
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: rx-count-flags-${{ github.run_id }}
          path: |
            count-flags-alone/
            count-flags-combined/
          if-no-files-found: error
          retention-days: 90
