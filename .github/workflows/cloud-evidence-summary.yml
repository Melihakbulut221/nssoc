name: Engineering SRAM full chip reference collision preflight
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: /scripts/preflight_sram_reference_libraries.py
      - run: |
          set -euo pipefail
          gh api repos/${{ github.repository }}/actions/artifacts/14113411418/zip > dp.zip
          gh api repos/${{ github.repository }}/actions/artifacts/14114205202/zip > sp.zip
          python3 scripts/preflight_sram_reference_libraries.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sram-reference-library-preflight-${{ github.run_id }}
          path: out/*.json
          if-no-files-found: error
          retention-days: 90
