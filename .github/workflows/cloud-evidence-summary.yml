name: Core-only complementary interface profiles
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  interfaces:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Prepare pinned simulation tools
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends iverilog
          python3 -m venv hw/.venv
          hw/.venv/bin/pip install -r hw/requirements.txt
      - name: Verify every pin-level interface case across base and full
        run: hw/.venv/bin/python scripts/check_core_only_interface_profiles.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: core-only-interface-profiles-${{ github.run_id }}
          path: hw/soc/out/core-only-interface-profiles/
          if-no-files-found: error
          retention-days: 90
