name: Core-only mapped pad shell and native mailbox simulation
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  boot:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: YosysHQ/setup-oss-cad-suite@aefa8397bbf8fc6670a0a62af9805a89738f3cde
        with:
          version: '2026-08-04'
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends binutils-riscv64-linux-gnu
      - name: Map status mailbox and verify native pad shell
        run: python3 scripts/cloud_core_only_shell_map.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: core-only-shell-map-${{ github.run_id }}
          path: |
            hw/soc/out/core-only-shell-map/**/*.json
            hw/soc/out/core-only-shell-map/**/*.log
            hw/soc/out/core-only-shell-map/**/*.v
            hw/soc/out/core-only-shell-map/**/*.lib
            hw/soc/out/core-only-shell-map/**/*.ys
            hw/soc/out/core-only-native-io/**/*.json
            hw/soc/out/core-only-native-io/**/*.log
            hw/soc/out/core-only-native-io/**/*.v
          if-no-files-found: error
          retention-days: 90
