name: Exploratory four-state simulator compatibility
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compatibility:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          filter: blob:none
          sparse-checkout: |
            scripts
            hw/soc/tb
            hw/soc/flow
            hw/soc/pnr
      - uses: YosysHQ/setup-oss-cad-suite@aefa8397bbf8fc6670a0a62af9805a89738f3cde
        with:
          version: '2026-08-04'
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Build pinned CVC in ephemeral cloud storage
        run: |
          set -euo pipefail
          mkdir -p out
          sudo apt-get update -qq
          sudo apt-get install -y zlib1g-dev
          git init /tmp/cvc
          git -C /tmp/cvc remote add origin https://github.com/cambridgehackers/open-src-cvc.git
          git -C /tmp/cvc fetch --depth=1 origin 1c5e043ec33ef6f1fdbf38565501c944893a83cf
          git -C /tmp/cvc checkout --detach FETCH_HEAD
          test "$(git -C /tmp/cvc rev-parse HEAD)" = 1c5e043ec33ef6f1fdbf38565501c944893a83cf
          make -C /tmp/cvc/src -j2 cvc64 > out/cvc-build.log 2>&1
          # Source licence stays with the ephemeral build. No CVC binaries are redistributed.
      - name: Compare finite four-state probes with pinned Icarus
        run: python3 scripts/check_four_state_simulator_probe.py
      - name: Verify pinned native IHP cell and negative control
        run: |
          set -euo pipefail
          python3 hw/soc/flow/prepare_ihp_native_boot.py > out/native-prepare.log 2>&1
          python3 scripts/check_cvc_native_cell_probe.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: four-state-simulator-probe-${{ github.run_id }}
          path: |
            out/*.log
            out/*/*.log
            out/*.json
          retention-days: 30
