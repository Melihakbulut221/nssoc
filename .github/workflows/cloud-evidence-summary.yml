name: Four-diode legalization screen with all other cells fixed
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  diagnose:
    runs-on: ubuntu-22.04
    timeout-minutes: 55
    env:
      GH_TOKEN: ${{ github.token }}
      APPIMAGE_EXTRACT_AND_RUN: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/diagnose_four_diode_legalization.py
            /scripts/diagnose_four_diode_legalization.tcl
      - name: Restore exact runtime and failed native state in cloud
        run: |
          set -euo pipefail
          sudo mkdir -p /mnt/s; sudo chown "$USER" /mnt/s
          curl -fsSL --retry 5 -o /mnt/s/librelane.AppImage https://github.com/librelane/librelane/releases/download/3.0.5/librelane-devshell-x86_64.AppImage
          echo 'd6a349ec65be11456e96c4981d35f63ca34d3c85daf79a51e1ccb907bb5d7466  /mnt/s/librelane.AppImage' | sha256sum -c -
          chmod +x /mnt/s/librelane.AppImage
          gh api repos/${{ github.repository }}/actions/artifacts/14112241785/zip > native.zip
      - name: Try only four failed diodes without routing or relaxed legality
        run: env -u GH_TOKEN -u GITHUB_TOKEN python3 scripts/diagnose_four_diode_legalization.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: four-diode-derived-${{ github.run_id }}
          path: out/derived/*.json
          if-no-files-found: error
          retention-days: 90
      - name: Preserve all native results on cloud
        if: always()
        run: tar -czf four-diode-native.tgz -C out native
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: four-diode-native-${{ github.run_id }}
          path: four-diode-native.tgz
          if-no-files-found: error
          retention-days: 30
