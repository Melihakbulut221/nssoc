name: Extract rejected candidate critical path diagnostics in cloud
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  diagnostics:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: /scripts/diagnose_cut10j_electrical4_paths.py
      - run: |
          set -euo pipefail
          gh api repos/${{ github.repository }}/actions/artifacts/14089073072/zip > reports.zip
          python3 scripts/diagnose_cut10j_electrical4_paths.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: cut10j-electrical4-critical-paths-${{ github.run_id }}
          path: out/*.json
          if-no-files-found: error
          retention-days: 90
