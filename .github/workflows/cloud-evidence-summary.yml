name: CDR screen process verdict controls
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  controls:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          filter: blob:none
          sparse-checkout: |
            scripts
            sw/tests
      - run: python3 -m pip install --disable-pip-version-check numpy==2.3.3
      - run: python3 sw/tests/test_cdr_screen_process_verdict.py
