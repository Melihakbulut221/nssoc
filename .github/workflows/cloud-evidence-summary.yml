name: Qualify native SRAM with sequential standard-cell clock compositions
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  preflight:
    runs-on: ubuntu-22.04
    timeout-minutes: 355
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: YosysHQ/setup-oss-cad-suite@aefa8397bbf8fc6670a0a62af9805a89738f3cde
        with:
          version: '2026-08-04'
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Build pinned compiler and acquire unchanged IHP models
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends build-essential zlib1g-dev binutils-riscv64-linux-gnu
          git init cvc-source
          git -C cvc-source remote add origin https://github.com/cambridgehackers/open-src-cvc.git
          git -C cvc-source fetch --depth=1 origin 1c5e043ec33ef6f1fdbf38565501c944893a83cf
          git -C cvc-source checkout --detach FETCH_HEAD
          test "$(git -C cvc-source rev-parse HEAD)" = 1c5e043ec33ef6f1fdbf38565501c944893a83cf
          make -C cvc-source/src -j2 cvc64 > cvc-build.log 2>&1
          python3 hw/soc/flow/prepare_ihp_native_boot.py
      - name: Require all original four-state cell transitions and negative control
        run: python3 scripts/qualify_cvc_cells.py
      - name: Compare native and derived sequential clock compositions
        run: python3 scripts/qualify_clock_composition.py
      - name: Require native SRAM and standard-cell composition against independent scoreboard
        if: ${{ !cancelled() }}
        run: python3 scripts/qualify_native_sram_sequence.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: functional-nba-qualification-${{ github.run_id }}
          path: |
            clock-composition-qualification/**/*.json
            clock-composition-qualification/**/*.log
            cvc-cell-qualification/**/*.json
            cvc-cell-qualification/**/*.log
            sram-sequence-qualification/**/*.json
            sram-sequence-qualification/**/*.log
            cvc-build.log
          retention-days: 90
          if-no-files-found: error
