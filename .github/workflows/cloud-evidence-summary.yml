# SPDX-License-Identifier: Apache-2.0
name: Exact current CDR RC terminal readback
on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        description: Source controls or authenticated runner-only terminal readback
        required: true
        default: controls
        options: [controls, readback]
permissions:
  contents: read
  actions: read
concurrency:
  group: current-cdr-rc-terminal-readback-${{ github.ref }}
  cancel-in-progress: false
env:
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  source-controls:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Bind exact source and complete three-file manifest
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 -B - <<'PY'
          import hashlib
          from pathlib import Path
          p=Path('scripts/cdr-current-rc-terminal-readback-pins.json')
          assert hashlib.sha256(p.read_bytes()).hexdigest()=='e3955e9ab41eecbfae9baa09f2c2a4083bac34dd35fcacca79af5b95bc915245'
          PY
          python3 -B scripts/cloud_cdr_current_rc_terminal_readback.py --source-check
      - name: Exercise synthetic archive, source and reservation refusals
        run: |
          set -o pipefail
          python3 -B scripts/check_cdr_current_rc_terminal_readback.py 2>&1 | tee readback-source-controls.log
      - name: Always emit complete source control record
        if: always()
        run: |
          python3 -B - <<'PY'
          import base64,hashlib,json
          from pathlib import Path
          for name in ('readback-source-controls.json','readback-source-controls.log'):
              p=Path(name);raw=p.read_bytes() if p.is_file() else b''
              print('CDR_RC_READBACK_CONTROL '+json.dumps(dict(name=name,present=p.is_file(),bytes=len(raw),sha256=hashlib.sha256(raw).hexdigest(),base64=base64.b64encode(raw).decode()),sort_keys=True))
          PY
      - name: Keep complete source proof
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cdr-rc-terminal-source-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            readback-source-controls.json
            readback-source-controls.log
          if-no-files-found: error
          retention-days: 90
  readback:
    needs: source-controls
    if: ${{ inputs.mode == 'readback' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Recheck immutable source before reserved acquisition
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 -B - <<'PY'
          import hashlib
          from pathlib import Path
          assert hashlib.sha256(Path('scripts/cdr-current-rc-terminal-readback-pins.json').read_bytes()).hexdigest()=='e3955e9ab41eecbfae9baa09f2c2a4083bac34dd35fcacca79af5b95bc915245'
          PY
          python3 -B scripts/cloud_cdr_current_rc_terminal_readback.py --source-check
      - name: Authenticate complete RC capsule and original publication on runner
        run: |
          set -o pipefail
          python3 -B scripts/cloud_cdr_current_rc_terminal_readback.py 2>&1 | tee cdr-rc-terminal-driver.log
      - name: Always emit genuine readback outcome
        if: always()
        run: |
          python3 -B - <<'PY'
          from pathlib import Path
          p=Path('cloud-cdr-current-rc-terminal-readback/readback.json')
          if p.is_file():print(p.read_text())
          PY
      - name: Keep all output, partial failures and runner-only input bytes
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cdr-rc-terminal-readback-full-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            cloud-cdr-current-rc-terminal-readback
            cdr-rc-terminal-driver.log
            ${{ runner.temp }}/cdr-current-rc-terminal-readback-${{ github.run_id }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
          compression-level: 1
