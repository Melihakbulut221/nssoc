name: Read actual modified650 gate access geometry
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  binding:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python3 -m pip install --disable-pip-version-check --no-cache-dir numpy==2.3.3 klayout==0.30.4.post1
      - run: python3 -B scripts/read_select650_gate_access.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: select650-gate-access-${{ github.run_id }}
          path: select650-gate-access/
          if-no-files-found: error
          retention-days: 90
