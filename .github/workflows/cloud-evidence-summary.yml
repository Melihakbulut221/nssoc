name: RX local lane next-state full-module proof and traffic qualification
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qualify:
    strategy:
      fail-fast: false
      matrix:
        kind: [formal, traffic]
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts
            hw/soc/rtl/pcie
            hw/soc/tb
      - uses: YosysHQ/setup-oss-cad-suite@aefa8397bbf8fc6670a0a62af9805a89738f3cde
        with:
          version: '2026-08-04'
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Qualify exact candidate without relaxing reset or timing contract
        run: python3 scripts/qualify_rx_cursor_${{ matrix.kind }}.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: rx-cursor-${{ matrix.kind }}-${{ github.run_id }}
          path: |
            out-${{ matrix.kind }}/**/*.json
            out-${{ matrix.kind }}/**/*.log
            out-${{ matrix.kind }}/**/*.ys
          retention-days: 30
