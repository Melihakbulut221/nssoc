name: Strict SRAM independent MOS projection controls
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  controls:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          filter: blob:none
          sparse-checkout: |
            scripts
            hw/soc/flow
      - run: python3 -m pip install klayout==0.30.13
      - name: Restore independent reference only in the cloud
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api repos/${{ github.repository }}/actions/artifacts/14069436539/zip > reference.zip
      - name: Reject altered bodies, pins, models and dimensions; prove complete reference bijection
        run: python3 -u scripts/check_sram_independent_mos_projection.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: sram-independent-mos-projection-${{ github.run_id }}
          path: out
          if-no-files-found: error
          retention-days: 90
