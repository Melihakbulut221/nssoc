name: Verify 720 fanout diode source and export guards
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: |
          set -euo pipefail
          python3 -m py_compile scripts/rebind_signal_fanout_antenna_inventory.py scripts/test_signal_fanout_antenna_rebinding.py
          python3 scripts/test_signal_fanout_antenna_rebinding.py
