name: Inspect completed bounded DP full-macro mismatch
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/diagnose_dp_bounded_mismatch.py
            /scripts/diagnose_dp_bounded_mismatch.rb
      - run: |
          set -euo pipefail
          curl -fL --retry 5 https://www.klayout.org/downloads/Ubuntu-24/klayout_0.30.13-1_amd64.deb -o /tmp/klayout.deb
          echo '0bb6b913fd6a32581d50b08be744b522a2a477baa1ed7e253c97cc18ce248a24  /tmp/klayout.deb' | sha256sum -c -
          sudo apt-get update -qq
          sudo apt-get install -y /tmp/klayout.deb
      - run: gh api repos/${{ github.repository }}/actions/artifacts/14111500413/zip > native.zip
      - run: python3 scripts/diagnose_dp_bounded_mismatch.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dp-sram-top-mismatch-derived-${{ github.run_id }}
          path: out/*.json
          if-no-files-found: error
          retention-days: 90
