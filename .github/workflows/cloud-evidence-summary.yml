# SPDX-License-Identifier: Apache-2.0
name: PCIe epoch ingress source controls only
on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [controls]
        default: controls
        description: Source and refusal controls only; native simulation disabled
permissions:
  contents: read
  actions: read
defaults:
  run:
    shell: bash
concurrency:
  group: pcie-training-epoch-ingress-${{ github.ref }}
  cancel-in-progress: false
jobs:
  source-controls:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Assert actual source context and immutable methods
        env:
          MODE: ${{ inputs.mode }}
          METHOD_SHA: 31fbfa76b18cda4826966835304330822db467a333d7669c7bbf95d11608a4ac
        run: |
          set -euo pipefail
          test "$MODE" = controls
          test "$GITHUB_REF" = refs/heads/codex/pcie-training-epoch-ingress-v1
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          echo "$METHOD_SHA  scripts/pcie-training-epoch-ingress-methods.json" | sha256sum -c -
      - name: Source pins and source-only refusal tests
        run: |
          set -euo pipefail
          mkdir epoch-source-controls
          python3 -u scripts/check_pcie_training_epoch_ingress.py --source-controls 2>&1 | tee epoch-source-controls/pins.log
          python3 -u scripts/check_pcie_training_epoch_ingress_source.py 2>&1 | tee epoch-source-controls/controls.log
      - name: Preserve all source outputs, including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pcie-epoch-source-${{ github.run_id }}-${{ github.run_attempt }}
          path: epoch-source-controls/
          if-no-files-found: warn
          retention-days: 90
  preserve-job-log:
    needs: source-controls
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Preserve complete source job metadata and logs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir full-source-job-log
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs?per_page=100" > full-source-job-log/jobs.json
          python3 - <<'PY'
          import json,subprocess,pathlib,os
          out=pathlib.Path("full-source-job-log")
          data=json.loads((out/"jobs.json").read_bytes())
          assert data["total_count"]<=100
          jobs=[j for j in data["jobs"] if j["name"]=="source-controls"]
          assert len(jobs)==1 and jobs[0]["status"]=="completed"
          job=jobs[0]
          raw=subprocess.check_output(["gh","api","--allow-escape-sequences",f"repos/{os.environ['GITHUB_REPOSITORY']}/actions/jobs/{job['id']}/logs"])
          (out/(str(job["id"])+".log")).write_bytes(raw)
          (out/"source-binding.json").write_text(json.dumps(dict(source=os.environ["GITHUB_SHA"],run=os.environ["GITHUB_RUN_ID"],attempt=os.environ["GITHUB_RUN_ATTEMPT"],native_executed=False,source_job=job),indent=2)+"\n")
          PY
      - name: Upload unfiltered source job log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pcie-epoch-full-source-log-${{ github.run_id }}-${{ github.run_attempt }}
          path: full-source-job-log/
          if-no-files-found: warn
          retention-days: 90
