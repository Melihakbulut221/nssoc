name: Verify hosted PCIe suites
on: workflow_dispatch
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        suite: [gen12_record_cdc, pcie_shared_serial_front, pcie_training_epoch_ingress]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install simulator
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends iverilog
      - name: Run source-bound RTL cases
        env:
          SUITE: ${{ matrix.suite }}
        run: PY=python3 bash scripts/run_cocotb.sh "$SUITE"
      - name: Show terminal diagnosis
        if: always()
        env:
          SUITE: ${{ matrix.suite }}
        run: tail -80 "hw/soc/out/cocotb/$SUITE.log"
