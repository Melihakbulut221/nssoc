name: Slice completed diode-route timing evidence
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  slice:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/read_diode_route_timing_slice.py
      - run: |
          set -euo pipefail
          gh api repos/${{ github.repository }}/actions/artifacts/14120119428/zip > reports.zip
          python3 scripts/read_diode_route_timing_slice.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: diode-route-timing-slice-${{ github.run_id }}
          path: out
          if-no-files-found: error
          retention-days: 90
