name: Qualify namespaced SRAM integration on coherent completed CRC route
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  streamout:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      APPIMAGE_EXTRACT_AND_RUN: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/prepare_namespaced_chip_streamout.py
            /hw/soc/pnr/namespaced_sram_streamout_flow.py
            /hw/soc/pnr/interface_flow.py
      - name: Restore frozen native inputs only on cloud runner
        run: |
          set -euo pipefail
          sudo mkdir -p /mnt/s
          sudo chown "$USER" /mnt/s
          curl -fL --retry 5 https://github.com/librelane/librelane/releases/download/3.0.5/librelane-devshell-x86_64.AppImage -o /mnt/s/librelane.AppImage
          echo 'd6a349ec65be11456e96c4981d35f63ca34d3c85daf79a51e1ccb907bb5d7466  /mnt/s/librelane.AppImage' | sha256sum -c -
          chmod +x /mnt/s/librelane.AppImage
          gh api repos/${{ github.repository }}/releases/assets/663146895 -H 'Accept: application/octet-stream' > /mnt/s/pkg.tgz
          gh api repos/${{ github.repository }}/actions/artifacts/14111958544/zip > routed.zip
          gh api repos/${{ github.repository }}/actions/artifacts/14114456981/zip > library.zip
          env -u GH_TOKEN -u GITHUB_TOKEN /mnt/s/librelane.AppImage python scripts/prepare_namespaced_chip_streamout.py
          rm /mnt/s/pkg.tgz /mnt/s/routed.tgz routed.zip library.zip
      - name: Stream routed main chip without rerouting or netlist changes
        run: |
          set -euo pipefail
          OUT=$PWD/hw/soc/out/namespaced-streamout
          timeout 3600 env -u GH_TOKEN -u GITHUB_TOKEN /mnt/s/librelane.AppImage python hw/soc/pnr/namespaced_sram_streamout_flow.py --flow NamespacedSRAMStreamOut             --pdk-root $PWD/hw/soc/tools/ciel-corrpre --pdk ihp-sg13g2 --scl sg13g2_stdcell --force-run-dir $OUT/run             --with-initial-state $OUT/state.json $OUT/config.json > $OUT/streamout.log 2>&1
      - name: Collect reviewable results and preserve native layout separately
        if: always()
        run: |
          mkdir -p derived native
          OUT=hw/soc/out/namespaced-streamout
          cp $OUT/preflight.json $OUT/result.json $OUT/streamout.log derived/ 2>/dev/null || true
          if [ -d "$OUT" ]; then tar -czf native/streamout-native.tgz "$OUT" hw/soc/out/namespaced-sram-library; fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: namespaced-chip-streamout-derived-${{ github.run_id }}
          path: derived
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: namespaced-chip-streamout-native-${{ github.run_id }}
          path: native
          if-no-files-found: warn
          retention-days: 90
