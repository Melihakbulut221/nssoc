name: CDR isolated select buffer bias - frozen gates
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  divider-whatif:
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        variant: [bd10_lowz8_xor2_cdata3_sel15]
    env:
      GH_TOKEN: ${{ github.token }}
      ARTIFACT_ID: '13283214752'
      ARTIFACT_SHA256: ac342f4945a262a4c0fb2440634aa600b8d3f07c6c257c9d3d6e648a319b2402
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/cdr_n1_divider_whatif.py
            /scripts/cdr_mos650_full650_loaded.py
      - name: Restore the preserved N1 native tree at its original absolute path
        run: |
          set -euo pipefail
          gh api repos/${{ github.repository }}/actions/artifacts/14092472835/zip > buffer-topology.zip
          gh api repos/${{ github.repository }}/actions/artifacts/14110140623/zip > sampler-phase.zip
          W=/mnt/n1; sudo mkdir -p $W; sudo chown $USER $W
          gh api repos/${{ github.repository }}/actions/artifacts/$ARTIFACT_ID/zip > $W/n1.zip
          echo "$ARTIFACT_SHA256  $W/n1.zip" | sha256sum -c -
          mkdir -p mos650-gate-ac
          unzip -q $W/n1.zip -d mos650-gate-ac -x '*/wave.raw' '*/producer-*' '*/composition-n2/*' '*/composition-n4/*' '*/composition-n8/*' '*/composition-n16/*'
          rm $W/n1.zip
          ls mos650-gate-ac mos650-gate-ac/native mos650-gate-ac/native/loaded-n1-nominal_late
          grep -n "^\.lib\|^\.include\|pre_osdi" mos650-gate-ac/native/loaded-n1-nominal_late/bench.cir
      - run: python3 -m pip install --disable-pip-version-check --no-cache-dir numpy==2.3.3
      - name: Rerun with ${{ matrix.variant }} slave-stage values and the frozen gates
        run: python3 -B scripts/cdr_n1_divider_whatif.py mos650-gate-ac ${{ matrix.variant }} whatif-${{ matrix.variant }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: divider-whatif-${{ matrix.variant }}-${{ github.run_id }}
          path: whatif-${{ matrix.variant }}
          if-no-files-found: warn
          retention-days: 90
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: select-bias-native-${{ matrix.variant }}-${{ github.run_id }}
          path: |
            mos650-gate-ac/native
            mos650-gate-ac/derived/loaded-n1-nominal_late.json
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: cdr-select-bias-result-only-${{ matrix.variant }}-${{ github.run_id }}
          path: |
            whatif-${{ matrix.variant }}/result.json
            whatif-${{ matrix.variant }}/isolated-c-sampler-change.json
            whatif-${{ matrix.variant }}/isolated-select-bias-change.json
            whatif-${{ matrix.variant }}/candidate-current-density-binding.json
          if-no-files-found: error
          retention-days: 90
      - name: Require unchanged waveform and device gates
        run: |
          python3 - <<'PYGATE'
          import json
          from pathlib import Path
          d=json.loads(Path('whatif-${{ matrix.variant }}/result.json').read_text())
          assert d['returncode']==0 and d['passed'] and d['data_passed'] and d['devices_passed'] and d['phase_passed'], 'Rejected circuit-screen candidate; not layout acceptance'
          PYGATE
