name: Core-only additive antenna ECO detailed reroute
on:
  workflow_dispatch:
    inputs:
      insertion_artifact:
        required: true
        type: string
      insertion_digest:
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  route:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    env:
      GH_TOKEN: ${{ github.token }}
      APPIMAGE_EXTRACT_AND_RUN: '1'
      INSERTION_ARTIFACT: ${{ inputs.insertion_artifact }}
      INSERTION_DIGEST: ${{ inputs.insertion_digest }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Restore pinned runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libfuse2 tcl
          python3 scripts/bootstrap_flow.py
          echo "CLOUD_APPIMAGE=$GITHUB_WORKSPACE/hw/soc/tools/physical/librelane-3.0.5-x86_64.AppImage" >> "$GITHUB_ENV"
      - name: Route and audit exact additive antenna ECO
        run: python3 scripts/cloud_core_only_antenna_reroute.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: core-only-antenna-reroute-${{ github.run_id }}
          path: hw/soc/out/core-only-antenna-reroute/
          if-no-files-found: error
          retention-days: 90
