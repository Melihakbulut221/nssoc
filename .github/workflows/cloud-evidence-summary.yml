name: Native IHP simulator architecture qualification
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  native-model:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: ubuntu-24.04, arch: x64, asset: 500891773, sha: f9c8f52d7333341a1dcad3dc19b0ce229f1b30c5a30cdc8befcc6dd5c8ee2cbd}
          - {runner: ubuntu-24.04-arm, arch: arm64, asset: 500964614, sha: 8c6010f1cc37f2083a472778ef7e2e756409e377e547f62c11a16f5d96a8f982}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/check_scrub_native.py
            /hw/soc/flow/
            /hw/soc/pnr/ihp-native-boot.lock.json
            /hw/soc/rtl/soc_scrub.v
            /hw/soc/tb/tb_scrub_native_clear.v
            /hw/soc/tb/fixtures/
      - name: Download and verify exact original suite release for this architecture
        run: |
          set -euo pipefail
          gh api -H 'Accept: application/octet-stream' repos/YosysHQ/oss-cad-suite-build/releases/assets/${{ matrix.asset }} > /tmp/suite.tgz
          echo '${{ matrix.sha }}  /tmp/suite.tgz' | sha256sum -c -
          tar -xzf /tmp/suite.tgz -C /tmp
          rm /tmp/suite.tgz
      - name: Verify untouched native model inputs and original positive and negative controls
        run: |
          set -euo pipefail
          python3 hw/soc/flow/prepare_ihp_native_boot.py
          python3 scripts/check_scrub_native.py --tools /tmp/oss-cad-suite/bin --output hw/soc/out/native-architecture
      - name: Publish derived result only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-model-${{ matrix.arch }}-result
          path: |
            hw/soc/out/native-architecture/result.json
            hw/soc/out/native-architecture/native-cell/result.json
          if-no-files-found: error
