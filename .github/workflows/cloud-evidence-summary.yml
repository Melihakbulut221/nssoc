name: Inventory SRAM hierarchy before alignment without LVS replay
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: /scripts/inventory_sp_sram_hierarchy.py
      - run: python3 -m pip install klayout==0.30.13
      - run: gh api repos/${{ github.repository }}/actions/artifacts/14111284849/zip > native.zip
      - run: python3 scripts/inventory_sp_sram_hierarchy.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sp-sram-hierarchy-derived-${{ github.run_id }}
          path: out/*.json
          if-no-files-found: error
          retention-days: 90
