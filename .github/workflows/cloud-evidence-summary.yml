name: Diagnose normalized current DP SRAM LVS all frozen LVS source mapping and supply rules
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: /scripts/diagnose_normalized_dp_sram_lvs.py
      - run: |
          python3 -m pip install klayout==0.30.13
          gh api repos/${{ github.repository }}/actions/artifacts/14087058081/zip > native.zip
          python3 scripts/diagnose_normalized_dp_sram_lvs.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: normalized-dp-sram-device-diagnosis-${{ github.run_id }}
          path: out/*.json
          if-no-files-found: error
          retention-days: 90
