name: Verify actual load split diode provenance
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Check actual archived diode evidence
        run: |
          set -euo pipefail
          python3 scripts/test_loadsplit_antenna_rebinding.py
          python3 scripts/cloud_core_only_loadsplit_diode_evidence.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: loadsplit-diode-evidence-${{ github.run_id }}
          path: hw/soc/out/loadsplit-diode-evidence/
          if-no-files-found: error
          retention-days: 90
