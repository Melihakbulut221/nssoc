name: Exact SRAM candidate reader negative controls
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  controls:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/check_sram_reference_reader_controls.py
      - name: Restore exact native runtime and independently tested RES2 source
        run: |
          set -euo pipefail
          curl -fL --retry 5 https://www.klayout.org/downloads/Ubuntu-24/klayout_0.30.13-1_amd64.deb -o /tmp/klayout.deb
          echo '0bb6b913fd6a32581d50b08be744b522a2a477baa1ed7e253c97cc18ce248a24  /tmp/klayout.deb' | sha256sum -c -
          sudo apt-get update -qq
          sudo apt-get install -y /tmp/klayout.deb
          gh api repos/${{ github.repository }}/actions/artifacts/14096828657/zip > merge-controls.zip
          gh api repos/${{ github.repository }}/actions/artifacts/14096824374/zip > diagnostic.zip
          gh api repos/IHP-GmbH/IHP-Open-PDK/contents/ihp-sg13g2/libs.tech/klayout/tech/lvs/rule_decks/globals.lvs?ref=c4b8b4e5e7a05f375cca3815d51b3a37721fbf5c > globals.json
      - run: python3 scripts/check_sram_reference_reader_controls.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: strict-resistor-reader-controls-${{ github.run_id }}
          path: out
          if-no-files-found: error
          retention-days: 90
