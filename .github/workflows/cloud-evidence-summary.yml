name: New ACK mainchip supplemental functional boot with fresh monitor and model gates
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  preflight:
    runs-on: ubuntu-22.04
    timeout-minutes: 355
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: YosysHQ/setup-oss-cad-suite@aefa8397bbf8fc6670a0a62af9805a89738f3cde
        with:
          version: '2026-08-04'
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Build pinned compiler and acquire unchanged IHP models
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends build-essential zlib1g-dev binutils-riscv64-linux-gnu
          git init cvc-source
          git -C cvc-source remote add origin https://github.com/cambridgehackers/open-src-cvc.git
          git -C cvc-source fetch --depth=1 origin 1c5e043ec33ef6f1fdbf38565501c944893a83cf
          git -C cvc-source checkout --detach FETCH_HEAD
          test "$(git -C cvc-source rev-parse HEAD)" = 1c5e043ec33ef6f1fdbf38565501c944893a83cf
          make -C cvc-source/src -j2 cvc64 > cvc-build.log 2>&1
          python3 hw/soc/flow/prepare_ihp_native_boot.py
      - name: Fresh five-engine MBIST observer and exhaustive four-state qualification
        run: python3 scripts/diagnose_mbist_monitor_engines.py
      - name: Restore exact successful mapped candidate and prepare unchanged functional bench
        run: |
          set -euo pipefail
          python3 scripts/restore_predecode_chip_boot.py
          python3 hw/soc/flow/sim_logic_boot_gl.py --prepare-only --simulator iverilog --cycles 4000000 --timeout 14400 --pcie-profile packet-async --mbist-profile system-ethernet --nm /usr/bin/riscv64-linux-gnu-nm --synthesis hw/soc/out/corrpre-pcie-mbist-native-boot/synthesis --firmware hw/soc/out/corrpre-pcie-mbist-native-boot/rtl --pdk hw/soc/tools/ihp-native-boot-c4b8b4e/ihp-sg13g2 --output out/cvc-boot-preparation
      - name: Strict native reset data and X propagation probes plus mutations
        run: python3 scripts/probe_native_cvc.py
      - name: Exhaustive affected-cell four-state transition comparison
        run: python3 scripts/qualify_cvc_cells.py
      - name: Replay original 1P and 2P SRAM directed equivalence and mutations
        run: python3 scripts/qualify_cvc_sram.py
      - name: Replay SRAM standard-cell capture and proven equivalent comparisons
        run: python3 scripts/qualify_native_sram_sequence.py
      - name: Record known native composition disagreement and restrict diagnostic scope
        run: python3 scripts/gate_nba_boot_diagnostics.py
      - name: Supplemental whole-chip functional boot with unchanged firmware PCIe and MBIST gates
        run: python3 scripts/run_cvc_observed_chip_boot.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ack-delta-functional-boot-${{ github.run_id }}
          path: |
            cvc-probe/**/*.json
            cvc-probe/**/*.log
            cvc-probe/**/*.v
            cvc-cell-qualification/**/*.json
            cvc-cell-qualification/**/*.log
            cvc-cell-qualification/**/*.v
            out/**/*.json
            out/**/*.log
            sram-sequence-qualification/**/*.json
            sram-sequence-qualification/**/*.log
            cvc-sram-qualification/**/*.json
            cvc-sram-qualification/**/*.log
            mbist-monitor-probe/**/*.json
            mbist-monitor-probe/**/*.log
            mbist-monitor-probe/**/*.v
            cvc-build.log
            cvc-source/OSS-CVC-MODIFIED-ARTISTIC-LIC.TXT
            cvc-source/CHANGES.md
          retention-days: 90
          if-no-files-found: error
