name: Physical connectivity geometry guard qualification
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Exercise disconnected metal and wrong-layer controls
        run: |
          set -euo pipefail
          mkdir -p hw/soc/out/physical-connectivity-guard
          python3 -m py_compile scripts/audit_native_signal_geometry.py
          python3 scripts/audit_native_signal_geometry.py --self-test > hw/soc/out/physical-connectivity-guard/controls.json
          sha256sum scripts/audit_native_signal_geometry.py > hw/soc/out/physical-connectivity-guard/source.sha256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: physical-connectivity-guard-${{ github.run_id }}
          path: hw/soc/out/physical-connectivity-guard/
          if-no-files-found: error
          retention-days: 90
