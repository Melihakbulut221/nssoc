name: Current integration RTL packet mutation regression
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  packet-simulation:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          filter: blob:none
          sparse-checkout: |
            scripts
            hw/soc/rtl/pcie
            hw/soc/tb/cocotb
            hw/requirements.txt
            sw/tests
            sw/requirements.txt
      - name: Install simulation runtime
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends iverilog
          python3 -m venv .venv
          .venv/bin/pip install -r hw/requirements.txt -r sw/requirements.txt
      - name: Run complete packet regression without skipped cases
        run: |
          set -euo pipefail
          mkdir -p out
          .venv/bin/python -m pytest -q sw/tests/test_pcie_packet.py --junitxml=out/packet-pytest.xml | tee out/packet-pytest.log
          .venv/bin/python - <<'PYCHECK'
          import xml.etree.ElementTree as E
          root=E.parse('out/packet-pytest.xml').getroot();cases=list(root.iter('testcase'))
          assert len(cases)==8, len(cases)
          assert all(not any(c.find(t) is not None for t in ['skipped','failure','error']) for c in cases)
          PYCHECK
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: pcie-integration-packet-mutations-${{ github.run_id }}
          path: |
            out/**/*.json
            out/**/*.xml
            out/**/*.log
          if-no-files-found: error
          retention-days: 90
