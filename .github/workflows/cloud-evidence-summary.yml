name: Audit exact CDR geometry and passive extraction provenance
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: /scripts/audit_cdr_geometry_provenance.py
      - name: Read archived native geometry provenance on runner only
        run: |
          set -euo pipefail
          gh api repos/${{ github.repository }}/actions/artifacts/14121577984/zip > native.zip
          python3 scripts/audit_cdr_geometry_provenance.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cdr-geometry-provenance-${{ github.run_id }}
          path: out/geometry-provenance.json
          if-no-files-found: error
          retention-days: 90
