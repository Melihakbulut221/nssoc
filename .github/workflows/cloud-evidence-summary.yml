name: Verify exact sequential frozen-input archive restoration
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  restore:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: /scripts/verify_sequential_input_restore.py
      - run: |
          set -euo pipefail
          gh api repos/${{ github.repository }}/releases/assets/663146895 -H 'Accept: application/octet-stream' > pkg.tgz
          python3 scripts/verify_sequential_input_restore.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: sequential-input-restore-derived-${{ github.run_id }}
          path: out/*.json
          if-no-files-found: error
          retention-days: 90
