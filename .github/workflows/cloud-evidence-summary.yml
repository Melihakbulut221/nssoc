name: Actual direct clock metal resistance comparison
on:
  workflow_dispatch:
    inputs:
      approved_source:
        type: string
        required: true
permissions:
  contents: read
  actions: read
concurrency:
  group: clock-metal-resistance-${{ github.ref }}
  cancel-in-progress: false
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      APPROVED_SOURCE: ${{ inputs.approved_source }}
      PYTHONDONTWRITEBYTECODE: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      RESULT_TAG: cloud-results-${{ github.run_id }}-1-clock-metal-resistance
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/cdr-clock-access-resistance-pins.json
      - name: Materialize pinned source closure
        run: |
          python3 -B - <<'PY'
          import json,subprocess
          from pathlib import Path
          m='scripts/cdr-clock-access-resistance-pins.json'
          names=sorted(set(json.loads(Path(m).read_bytes())['files'])|{m})
          assert all(not n.startswith('/')and '..'not in Path(n).parts and not any(c in n for c in '*?[!\\\n\r')for n in names)
          subprocess.run(['git','sparse-checkout','set','--no-cone','--stdin'],input=''.join('/'+n+'\n'for n in names),text=True,check=True)
          PY
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python3 -m pip install --disable-pip-version-check --no-cache-dir numpy==2.3.3 scipy==1.16.2
      - name: Authenticate full RC archive and solve eight actual networks
        run: |
          set -o pipefail
          python3 -B scripts/cdr_clock_access_resistance.py 2>&1 | tee clock-access-resistance.log
      - name: Preserve derived success or failure permanently
        if: always()
        run: |
          python3 -B - <<'PY'
          import os,json,subprocess,hashlib
          from pathlib import Path
          repo=os.environ['GITHUB_REPOSITORY'];tag=os.environ['RESULT_TAG'];source=os.environ['GITHUB_SHA']
          rel=json.loads(subprocess.check_output(['gh','api','repos/'+repo+'/releases/tags/'+tag]))
          assert rel['target_commitish']==source and rel['prerelease'] and not rel['assets']
          p=Path('clock-access-resistance');p.mkdir(exist_ok=True)
          files=[*sorted(p.glob('*.json')),Path('clock-access-resistance.log')]
          files=[f for f in files if f.is_file()]
          index={f.name:dict(bytes=f.stat().st_size,sha256=hashlib.sha256(f.read_bytes()).hexdigest())for f in files}
          receipt=p/'derived-output-index.json';receipt.write_text(json.dumps(dict(source=source,run=int(os.environ['GITHUB_RUN_ID']),files=index),indent=2)+'\n')
          for f in files+[receipt]:subprocess.run(['gh','release','upload',tag,str(f),'--repo',repo],check=True)
          final=json.loads(subprocess.check_output(['gh','api','repos/'+repo+'/releases/tags/'+tag]))
          expected={f.name:dict(bytes=f.stat().st_size,sha256=hashlib.sha256(f.read_bytes()).hexdigest())for f in files+[receipt]}
          assert len(final['assets'])==len(expected)
          for a in final['assets']:assert a['size']==expected[a['name']]['bytes']and a['digest']=='sha256:'+expected[a['name']]['sha256']
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: clock-access-resistance-derived-${{ github.run_id }}
          path: |
            clock-access-resistance/*.json
            clock-access-resistance.log
          if-no-files-found: error
          retention-days: 90
