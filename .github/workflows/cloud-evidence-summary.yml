name: Replay interrupted Python group
on: workflow_dispatch
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      PDK_ROOT: ${{ github.workspace }}/hw/soc/tools/pdk
      INDEX: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: a7035af6ea019aeae50a11933c905ee19cbb2ba1
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Prepare project interpreters, simulator, PDK and generated sources
        run: |
          make setup
          python scripts/bootstrap_oss.py
          echo "$PWD/hw/soc/tools/oss-cad-suite/bin" >> "$GITHUB_PATH"
          python -m pip install 'ciel==2.4.0'
          pin=c4b8b4e5e7a05f375cca3815d51b3a37721fbf5c
          ciel fetch --pdk-root "$PDK_ROOT" --pdk-family ihp-sg13g2 -l all "$pin"
          ciel enable --pdk-root "$PDK_ROOT" --pdk-family ihp-sg13g2 "$pin"
          make soc-prepare
      - name: Regenerate sideband outputs and test interfaces and mutants
        run: |
          python scripts/generate_pcie_event_type_sideband_v1.py
          git diff --exit-code -- hw/soc/rtl/pcie
          make test PYTEST_ARGS="-v --tb=line sw/tests/test_pcie_gen3_event_packet_type_v1.py"
