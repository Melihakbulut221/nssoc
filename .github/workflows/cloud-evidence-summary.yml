name: Prove receive count predicates under arbitrary commit and remove
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  formal:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: sudo apt-get update -qq && sudo apt-get install -y yosys
      - run: python3 formal/queue_flags/prove.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: queue-flag-invariants-${{ github.run_id }}
          path: queue-flag-proof/
          if-no-files-found: error
          retention-days: 90
