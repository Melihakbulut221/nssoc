name: Restored native simulator exit status and rejection controls
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  restore:
    strategy:
      fail-fast: false
      matrix:
        mode: [normal, sigterm, sigkill]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      EXIT_CONTROL: ${{ matrix.mode }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/check_native_vvp_exit_status.py
            /hw/soc/flow/
            /hw/soc/pnr/ihp-native-boot.lock.json
      - name: Build pinned official CRIU and install native Icarus
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y iverilog build-essential pkg-config libprotobuf-dev uuid-dev python3-yaml libprotobuf-c-dev protobuf-c-compiler protobuf-compiler libnl-3-dev libcap-dev libnet1-dev libgnutls28-dev libnftables-dev libaio-dev python3-protobuf libbsd-dev
          mkdir /tmp/criu-source
          git -C /tmp/criu-source init
          git -C /tmp/criu-source remote add origin https://github.com/checkpoint-restore/criu.git
          git -C /tmp/criu-source fetch --depth 1 origin 3ce556b7e8291c1bfdca974962f6282d7802b69f
          git -C /tmp/criu-source checkout --detach FETCH_HEAD
          test "$(git -C /tmp/criu-source rev-parse HEAD)" = 3ce556b7e8291c1bfdca974962f6282d7802b69f
          make -C /tmp/criu-source -j2 criu
          sudo install -m755 /tmp/criu-source/criu/criu /usr/local/bin/criu
          criu --version
          gh api -H 'Accept: application/octet-stream' repos/YosysHQ/oss-cad-suite-build/releases/assets/500964614 > /tmp/suite.tgz
          echo '8c6010f1cc37f2083a472778ef7e2e756409e377e547f62c11a16f5d96a8f982  /tmp/suite.tgz' | sha256sum -c -
          tar -xzf /tmp/suite.tgz -C /tmp
          rm /tmp/suite.tgz
          python3 hw/soc/flow/prepare_ihp_native_boot.py
      - run: |
          set -euo pipefail
          gh api repos/Melihakbulut221/nssoc/actions/artifacts/14098718708/zip > native.zip
          echo '86ba2a4bc205323d37b1abfb847fb6d3966dec426a7c303fed570b469b173c00  native.zip' | sha256sum -c -
          unzip -q native.zip
          gh api repos/Melihakbulut221/nssoc/actions/artifacts/14098409951/zip > result.zip
          echo '90584a32cad911078701b19f67919a6e0edd2376151752b3fb60c1d76e8c5bd0  result.zip' | sha256sum -c -
          unzip -q result.zip
          python3 -u scripts/check_native_vvp_exit_status.py restore
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: vvp-exit-${{ matrix.mode }}-result
          path: out/restore-result.json
          if-no-files-found: error
