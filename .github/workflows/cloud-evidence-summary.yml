name: Antenna insertion admission fault controls
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Exercise additive antenna audit with intentional failures
        run: |
          set -o pipefail
          mkdir -p hw/soc/out/antenna-admission-controls
          python3 scripts/test_antenna_insertion_admission.py 2>&1 | tee hw/soc/out/antenna-admission-controls/test.log
          sha256sum scripts/audit_core_only_antenna_insertion.py scripts/test_antenna_insertion_admission.py > hw/soc/out/antenna-admission-controls/source-hashes.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: antenna-admission-controls-${{ github.run_id }}
          path: hw/soc/out/antenna-admission-controls/
          if-no-files-found: error
          retention-days: 90
