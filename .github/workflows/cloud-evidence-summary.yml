name: Validate upstream routed clock report label correction
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /hw/soc/pnr/replay_onehot_routed_extraction_flow.py
            /scripts/test_routed_clock_report_labels.py
      - run: python3 scripts/test_routed_clock_report_labels.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: routed-clock-report-label-controls-${{ github.run_id }}
          path: out/*.json
          if-no-files-found: error
          retention-days: 90
