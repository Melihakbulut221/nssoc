name: Diagnose preserved CDR native device violations and bit history
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: bd10_lowz8_xor2_acbuf15
            native: '14103992091'
            result: '14103877257'
            digest: f9e9332b631252c132227b877b48b7593d95af88317ae3ac7b482d4a0c5cd466
          - variant: bd10_lowz8_xor2_acbuf20
            native: '14102869980'
            result: '14103871330'
            digest: b39fb2fa31b2e955c00f7380e9a8b0d429f7b59847bbc63c5be589df5dbfee61
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/diagnose_cdr_native_failures.py
            /scripts/cdr_mos650_full650_loaded.py
            /scripts/cdr_n1_divider_whatif.py
      - run: python3 -m pip install --disable-pip-version-check --no-cache-dir numpy==2.3.3
      - name: Restore native waveforms only on cloud runner
        run: |
          set -euo pipefail
          gh api repos/${{ github.repository }}/actions/artifacts/${{ matrix.native }}/zip > native.zip
          gh api repos/${{ github.repository }}/actions/artifacts/${{ matrix.result }}/zip > result.zip
          echo '${{ matrix.digest }}  result.zip' | sha256sum -c -
          unzip -q result.zip result.json
      - run: python3 scripts/diagnose_cdr_native_failures.py ${{ matrix.variant }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: cdr-native-failure-derived-${{ matrix.variant }}-${{ github.run_id }}
          path: out/*.json
          if-no-files-found: error
          retention-days: 90
