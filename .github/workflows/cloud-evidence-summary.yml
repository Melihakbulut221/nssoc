name: Native namespaced SRAM macro LVS with unchanged contents
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - kind: dp
            artifact: '14110867794'
            limit: '512'
          - kind: sp
            artifact: '14111284849'
            limit: '2048'
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      GH_TOKEN: ${{ github.token }}
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/namespace_sram_macro.py
            /scripts/replay_dp_sram_namespaced.py
            /scripts/replay_sp_sram_namespaced.py
            /scripts/check_lvs_ports_bound512.rb
            /scripts/check_lvs_ports_bound2048.rb
            /hw/soc/flow/audit_klayout_lvs.py
      - run: |
          set -euo pipefail
          gh api repos/${{ github.repository }}/actions/artifacts/${{ matrix.artifact }}/zip > native.zip
          curl -fL --retry 5 https://www.klayout.org/downloads/Ubuntu-24/klayout_0.30.13-1_amd64.deb -o /tmp/klayout.deb
          echo '0bb6b913fd6a32581d50b08be744b522a2a477baa1ed7e253c97cc18ce248a24  /tmp/klayout.deb' | sha256sum -c -
          sudo apt-get update -qq
          sudo apt-get install -y /tmp/klayout.deb
          python3 -m pip install klayout==0.30.13
      - run: klayout -b -zz -r scripts/check_lvs_ports_bound${{ matrix.limit }}.rb
      - run: python3 scripts/replay_${{ matrix.kind }}_sram_namespaced.py
      - name: Require actual strict LVS pass
        run: |
          python3 - <<'CHECK'
          import json
          from pathlib import Path
          d=json.loads(Path('out/derived/bounded-result.json').read_text())
          assert d['status']=='DIAGNOSTIC_COMPARISON_COMPLETE' and d['returncode']==0 and d['audit_returncode']==0 and d['comparison_passed_within_diagnostic_scope']
          CHECK
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: namespaced-${{ matrix.kind }}-derived-${{ github.run_id }}
          path: |
            out/derived/*.json
            out/comparison-controls.json
          if-no-files-found: warn
          retention-days: 90
      - run: tar -czf namespaced-native.tgz -C out native
        if: always()
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: namespaced-${{ matrix.kind }}-native-${{ github.run_id }}
          path: namespaced-native.tgz
          if-no-files-found: warn
          retention-days: 90
