name: CDR lowz8 bit-pattern and clock-phase diagnosis
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          filter: blob:none
          sparse-checkout: scripts
      - run: python3 -m pip install numpy==2.3.3
      - name: Restore preserved native metadata and samples only in cloud
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api repos/${{ github.repository }}/actions/artifacts/14078587671/zip > native.zip
          gh api repos/${{ github.repository }}/actions/artifacts/14078352603/zip > capture.zip
      - name: Measure sampled per-phase and bit-pattern margins without changing gates
        run: python3 -u scripts/diagnose_cdr_lowz8_phase_pattern.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: cdr-lowz8-phase-pattern-${{ github.run_id }}
          path: out/*.json
          if-no-files-found: error
          retention-days: 90
