        if: always()
        run: |
          python3 -B - <<'PY'
          import os,subprocess,sys
          from pathlib import Path
          prepare=os.environ['PREPARE_ONLY']=='true';case=os.environ['LOADED_CASE']
          assert (prepare and case=='nominal_early')or(not prepare and case=='vi_bias_off')
          assert not prepare or case=='nominal_early'
          suffix='preparation' if prepare else case
          transport=Path('hw/soc/out')/('cloud-cdr-current-eight-drain-loaded-'+suffix+'-publication')
          assert not transport.is_symlink()
          if transport.exists():
              assert transport.is_dir()
              print('Existing publication transport retained; no publication retry or overwrite.')
          else:
              argv=[sys.executable,'-B','scripts/cloud_cdr_eight_drain_vi_bias_off_stage_v1.py','--case',case,'--publish-only']
              if prepare:argv.append('--prepare-only')
              subprocess.run(argv,check=True)
          PY
      - name: Always emit exact terminal and publication metadata
        if: always()
        run: |
          python3 -B - <<'PY'
          import base64,hashlib,json,os
          from pathlib import Path
          prepare=os.environ['PREPARE_ONLY']=='true';case=os.environ['LOADED_CASE']
          suffix='preparation' if prepare else case
          out=Path('cloud-cdr-current-eight-drain-loaded-evidence-'+suffix)
          transport=Path('hw/soc/out')/('cloud-cdr-current-eight-drain-loaded-'+suffix+'-publication')
          stem='cdr-current-eight-drain-loaded-'+suffix+'-'+os.environ['GITHUB_RUN_ID']+'-1'
          paths=[out/'result.json',out/'publication-source-check.json',out/'direct-publication-plan.json',
            transport/'publication.json',transport/(stem+'.summary.json'),transport/(stem+'.parts.json')]
          prerequisite=Path('hw/soc/out/cdr-eight-drain-vi-prerequisites')
          assert not prerequisite.is_symlink()
          if prerequisite.exists():
              assert prerequisite.is_dir()
              for p in sorted(prerequisite.rglob('*')):
                  assert not p.is_symlink()
                  if p.is_dir():continue
                  assert p.is_file()and p.name in ('run.json','jobs.json','source-controls.log','admission.json')
                  paths.append(p)
          for p in paths:
              assert not p.is_symlink()
              present=p.is_file();raw=p.read_bytes() if present else b''
              chunks=[raw[i:i+6000]for i in range(0,len(raw),6000)]
              print('WIDTH_CURRENT_NATIVE_INDEX '+json.dumps(dict(path=str(p),present=present,bytes=len(raw),sha256=hashlib.sha256(raw).hexdigest(),chunks=len(chunks)),sort_keys=True))
              for i,b in enumerate(chunks):
                  print('WIDTH_CURRENT_NATIVE_CHUNK '+json.dumps(dict(path=str(p),index=i,base64=base64.b64encode(b).decode()),sort_keys=True))
          PY
      - name: Preserve complete worker output and partial publication
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: single-vi-full-${{ github.run_id }}-${{ github.run_attempt }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
          compression-level: 1
          path: |
            hw/soc/out/cdr-eight-drain-vi-prerequisites
            hw/soc/out/cdr-storage-checkout
            ${{ runner.temp }}/cdr-storage-before-checkout.json
            cloud-cdr-current-eight-drain-loaded-evidence-vi_bias_off
            cloud-cdr-current-eight-drain-loaded-vi_bias_off
            hw/soc/out/cloud-cdr-current-eight-drain-loaded-vi_bias_off-publication

  preserve-native-job-logs:
    needs: [source-controls, prepare, vi-bias-off]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Preserve every terminal actual job log including failed cases
        run: |
          python3 -B - <<'PY'
          import hashlib,json,os,subprocess,traceback
          from pathlib import Path
          root=Path('all-job-logs');root.mkdir()
          e=os.environ;prefix='repos/'+e['GITHUB_REPOSITORY']+'/'
          assert e['GITHUB_REPOSITORY']=='Melihakbulut221/nssoc' and e['GITHUB_RUN_ATTEMPT']=='1'
          def read(path):return subprocess.check_output(['gh','api','--allow-escape-sequences',prefix+path])
          raw=read('actions/runs/'+e['GITHUB_RUN_ID']);run=json.loads(raw);(root/'run.json').write_bytes(raw)
          assert run['head_sha']==e['GITHUB_SHA'] and run['run_attempt']==1
          raw=read('actions/runs/'+e['GITHUB_RUN_ID']+'/attempts/1/jobs?per_page=100')
          jobs=json.loads(raw);(root/'jobs.json').write_bytes(raw)
          assert len(jobs['jobs'])==jobs['total_count']<=20
          rows=[];errors=[]
          for j in jobs['jobs']:
              if j['name']=='preserve-native-job-logs':continue
              assert j['status']=='completed' and j['head_sha']==e['GITHUB_SHA']
              if j['conclusion']=='skipped':continue
              try:
                  raw=read('actions/jobs/'+str(j['id'])+'/logs');assert raw
                  (root/('job-'+str(j['id'])+'.log')).write_bytes(raw)
                  rows.append(dict(id=j['id'],name=j['name'],conclusion=j['conclusion'],bytes=len(raw),sha256=hashlib.sha256(raw).hexdigest()))
              except BaseException as error:
                  errors.append(dict(id=j['id'],name=j['name'],error=repr(error),traceback=traceback.format_exc()))
          receipt=dict(source=e['GITHUB_SHA'],run=run['id'],attempt=1,records=rows,errors=errors,full_raw_logs=True,native_acquisition=False)
          (root/'receipt.json').write_text(json.dumps(receipt,sort_keys=True,indent=2)+'\n')
          print(json.dumps(receipt))
          assert not errors
          PY
      - name: Retain complete actual logs and any collector failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cdr-single-vi-all-job-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: all-job-logs
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
