name: Qualify upstream IHP diode correction
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-22.04
    container: debian:trixie
    timeout-minutes: 20
    steps:
      - name: Install runtime prerequisites
        run: |
          set -eu
          apt-get update -qq
          apt-get install -y --no-install-recommends ca-certificates git python3
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Compare original failure and upstream model at three temperatures
        run: python3 scripts/cloud_native_diode_upstream_qualification.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: native-diode-upstream-qualification-${{ github.run_id }}
          path: hw/soc/out/native-diode-upstream-qualification/
          if-no-files-found: error
          retention-days: 90
