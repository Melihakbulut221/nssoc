name: Generate actual clock conductor geometry candidate for full650 sampling delay
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: /scripts/widen_current650_clock_geometry.py
      - run: python3 -m pip install --disable-pip-version-check --no-cache-dir klayout==0.30.4.post1
      - run: python3 scripts/widen_current650_clock_geometry.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: current650-clock-geometry-derived-${{ github.run_id }}
          path: out/
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: current650-clock-geometry-native-${{ github.run_id }}
          path: native/
          if-no-files-found: error
          retention-days: 90
