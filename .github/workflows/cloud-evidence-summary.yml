name: Netlist neighbourhood of the D master latch in the preserved N1 bench
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  neighbourhood:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      ARTIFACT_ID: '13283214752'
      ARTIFACT_SHA256: ac342f4945a262a4c0fb2440634aa600b8d3f07c6c257c9d3d6e648a319b2402
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/cdr_netlist_neighbourhood.py
      - name: Extract only the N1 model and bench
        run: |
          set -euo pipefail
          W=/mnt/n1; sudo mkdir -p $W; sudo chown $USER $W
          gh api repos/${{ github.repository }}/actions/artifacts/$ARTIFACT_ID/zip > $W/n1.zip
          echo "$ARTIFACT_SHA256  $W/n1.zip" | sha256sum -c -
          mkdir -p out n1
          unzip -q $W/n1.zip -d n1 '*/composition-n1/model.cir' '*/loaded-n1-nominal_late/bench.cir' '*/derived/loaded-n1-nominal_late.json'
          rm $W/n1.zip
          find n1 -type f | tee out/files.txt
      - name: Trace xd0211/xd0212 and their nets
        run: |
          set -euo pipefail
          M=$(find n1 -path '*composition-n1/model.cir' | head -1)
          python3 -B scripts/cdr_netlist_neighbourhood.py "$M" 2 XD0211,XD0212 > out/dlatch.txt
          wc -l out/dlatch.txt; head -150 out/dlatch.txt
          B=$(find n1 -path '*loaded-n1-nominal_late/bench.cir' | head -1); grep -v "^[RrCc]" "$B" | head -200 > out/bench-cards.txt
          J=$(find n1 -name 'loaded-n1-nominal_late.json' | head -1); python3 -c "import json,sys;d=json.load(open(sys.argv[1]));print(json.dumps({k:(v if len(json.dumps(v))<4000 else '...') for k,v in d.items()},indent=1)[:20000])" "$J" > out/derived-head.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: dlatch-neighbourhood-${{ github.run_id }}
          path: out
          retention-days: 90
