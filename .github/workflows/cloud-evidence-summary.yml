name: Check load split diode provenance logic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify rejected evidence controls
        run: |
          set -euo pipefail
          python3 scripts/test_loadsplit_antenna_rebinding.py
          python3 scripts/test_regression_antenna_rebinding.py
