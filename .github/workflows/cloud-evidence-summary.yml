name: Full DP256x16 RC extraction recovery with resource telemetry
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  macro-extraction:
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    strategy:
      fail-fast: false
      matrix:
        mode: [RC]
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          filter: blob:none
          sparse-checkout: scripts
      - name: Install the declared extractor and KLayout versions
        run: |
          set -euo pipefail
          mkdir -p out native
          curl -fL --retry 5 https://www.klayout.org/downloads/Ubuntu-24/klayout_0.30.13-1_amd64.deb -o /tmp/klayout.deb
          echo '0bb6b913fd6a32581d50b08be744b522a2a477baa1ed7e253c97cc18ce248a24  /tmp/klayout.deb' | sha256sum -c -
          sha256sum /tmp/klayout.deb > out/klayout-deb.sha256.log
          sudo apt-get update -qq
          sudo apt-get install -y /tmp/klayout.deb
          python3 -m pip install --report out/pip-install.json klayout-pex==0.9.0 klayout==0.30.13
          python3 -m pip freeze > out/python-packages.log
          klayout -v > out/klayout-version.log
          kpex extract --help > out/kpex-help.log
      - name: Restore hash-locked SRAM geometry only in the cloud
        run: |
          set -euo pipefail
          curl -fL --retry 5 https://raw.githubusercontent.com/Melihakbulut221/nssoc/e62d81aecf7f8e1c6af1e2c6c7c6ed4c0aa6065f/docs/evidence/sram-repaired-core-physical-20260926.tar.xz -o native/physical.tar.xz
          echo '3fd7b918f112b88146b92c861d0146b4ae7404682ceab27186d4a0f95a72a275  native/physical.tar.xz' | sha256sum -c -
      - name: Extract the full macro with the selected coupled-capacitance mode
        run: |
          set -euo pipefail
          python3 -u scripts/screen_sram_kpex09_macro.py "${{ matrix.mode }}" &
          worker=$!
          (
            while kill -0 "$worker" 2>/dev/null; do
              date -u '+RESOURCE_SAMPLE %Y-%m-%dT%H:%M:%SZ'
              free -m
              df -m . /tmp
              ps -eo pid,ppid,rss,pcpu,comm --sort=-rss | head -12 || true
              if [ -f out/RC.log ]; then tail -8 out/RC.log; fi
              sleep 60
            done
          ) &
          monitor=$!
          set +e
          wait "$worker"
          rc=$?
          kill "$monitor" 2>/dev/null
          wait "$monitor" 2>/dev/null
          set -e
          echo "EXTRACTION_EXIT=$rc"
          exit "$rc"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: sram-kpex09-macro-derived-${{ matrix.mode }}-${{ github.run_id }}
          path: out
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: sram-kpex09-macro-native-${{ matrix.mode }}-${{ github.run_id }}
          path: |
            native/CC
            native/RC
            native/DP8TSRAMDP256x16.gds
          if-no-files-found: warn
          retention-days: 90
