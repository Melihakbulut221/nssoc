name: ARM native VVP cross-runner checkpoint equivalence capability
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  dump:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: /scripts/check_native_vvp_checkpoint.py
      - name: Build pinned official CRIU and install native Icarus
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y iverilog build-essential pkg-config libprotobuf-dev uuid-dev python3-yaml libprotobuf-c-dev protobuf-c-compiler protobuf-compiler libnl-3-dev libcap-dev libnet1-dev libgnutls28-dev libnftables-dev libaio-dev python3-protobuf libbsd-dev
          mkdir /tmp/criu-source
          git -C /tmp/criu-source init
          git -C /tmp/criu-source remote add origin https://github.com/checkpoint-restore/criu.git
          git -C /tmp/criu-source fetch --depth 1 origin 3ce556b7e8291c1bfdca974962f6282d7802b69f
          git -C /tmp/criu-source checkout --detach FETCH_HEAD
          test "$(git -C /tmp/criu-source rev-parse HEAD)" = 3ce556b7e8291c1bfdca974962f6282d7802b69f
          make -C /tmp/criu-source -j2 criu
          sudo install -m755 /tmp/criu-source/criu/criu /usr/local/bin/criu
          criu --version
      - run: python3 -u scripts/check_native_vvp_checkpoint.py dump
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: vvp-checkpoint-dump-result
          path: out/dump-result.json
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: vvp-checkpoint-native
          path: checkpoint.tgz
          if-no-files-found: error
  restore:
    needs: dump
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: /scripts/check_native_vvp_checkpoint.py
      - name: Build pinned official CRIU and install native Icarus
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y iverilog build-essential pkg-config libprotobuf-dev uuid-dev python3-yaml libprotobuf-c-dev protobuf-c-compiler protobuf-compiler libnl-3-dev libcap-dev libnet1-dev libgnutls28-dev libnftables-dev libaio-dev python3-protobuf libbsd-dev
          mkdir /tmp/criu-source
          git -C /tmp/criu-source init
          git -C /tmp/criu-source remote add origin https://github.com/checkpoint-restore/criu.git
          git -C /tmp/criu-source fetch --depth 1 origin 3ce556b7e8291c1bfdca974962f6282d7802b69f
          git -C /tmp/criu-source checkout --detach FETCH_HEAD
          test "$(git -C /tmp/criu-source rev-parse HEAD)" = 3ce556b7e8291c1bfdca974962f6282d7802b69f
          make -C /tmp/criu-source -j2 criu
          sudo install -m755 /tmp/criu-source/criu/criu /usr/local/bin/criu
          criu --version
      - run: |
          gh run download "$GITHUB_RUN_ID" -n vvp-checkpoint-native -D .
          gh run download "$GITHUB_RUN_ID" -n vvp-checkpoint-dump-result -D .
          python3 -u scripts/check_native_vvp_checkpoint.py restore
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: vvp-checkpoint-restore-result
          path: out/restore-result.json
          if-no-files-found: error
