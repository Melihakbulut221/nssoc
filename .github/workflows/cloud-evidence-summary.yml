name: Locate physical CDR parent placement and routing sources
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Collect exact placement source references
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,subprocess
          out=Path('placement-source-audit');out.mkdir()
          paths=subprocess.check_output(['rg','-l','pd_child_','--glob','*.py','hw/soc/flow','scripts','docs/evidence'],text=True).splitlines()
          assert paths
          report={}
          for name in paths:
              p=Path(name);b=p.read_bytes();lines=b.decode().splitlines()
              selected=set()
              for i,line in enumerate(lines):
                  if 'pd_child_'in line:
                      selected.update(range(max(0,i-4),min(len(lines),i+6)))
              report[name]=dict(sha256=hashlib.sha256(b).hexdigest(),lines=[dict(line=i+1,text=lines[i])for i in sorted(selected)])
          (out/'sources.json').write_text(json.dumps(report,indent=2))
          (out/'context.json').write_text(json.dumps(dict(head=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),physical_change=False)))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cdr-placement-source-audit-${{ github.run_id }}
          path: placement-source-audit/
          retention-days: 90
          if-no-files-found: error
