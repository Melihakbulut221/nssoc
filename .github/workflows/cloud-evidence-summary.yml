name: Recover SRAM tool launcher diagnostic only
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: /scripts/recover_sram_launcher_error.py
      - run: |
          gh api repos/${{ github.repository }}/actions/artifacts/14085975326/zip > native.zip
          python3 scripts/recover_sram_launcher_error.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sram-launcher-diagnostic-${{ github.run_id }}
          path: out/*.json
          if-no-files-found: error
