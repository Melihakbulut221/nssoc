name: Native cascode clock buffer topology screen; not physical PHY acceptance
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  screen:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONDONTWRITEBYTECODE: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/cdr_mos650_gate_ac.py
            /scripts/cdr_mos650_full650_loaded.py
            /scripts/cdr-mos650-gate-ac-inputs.json
            /scripts/screen_cdr_clock_buffer.py
            /scripts/cdr_cascode_clock_buffer_candidate.inc
            /docs/evidence/cdr-via2-m3-loaded-runtime-inputs/
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python3 -m pip install --disable-pip-version-check --no-cache-dir numpy==2.3.3
      - name: Preserve native models and compare direct versus cascode-buffered clock loads
        run: python3 -B scripts/screen_cdr_clock_buffer.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: cdr-clock-buffer-derived-${{ github.run_id }}
          path: clock-buffer-screen/derived/
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: cdr-clock-buffer-native-${{ github.run_id }}
          path: clock-buffer-screen/
          if-no-files-found: error
          retention-days: 90
