name: Core-only hierarchical corepad comparison with original core
on:
  workflow_dispatch:
    inputs:
      artifact_id:
        description: Independently verified parent timing artifact ID
        required: true
        type: string
      artifact_digest:
        description: Independently verified parent timing SHA256
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  qualify:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
      APPIMAGE_EXTRACT_AND_RUN: '1'
      NSSOC_PARENT_TIMING_ARTIFACT_ID: ${{ inputs.artifact_id }}
      NSSOC_PARENT_TIMING_ARTIFACT_DIGEST: ${{ inputs.artifact_digest }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Prepare pinned native runtime
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libfuse2 tcl
          python3 -m py_compile scripts/cloud_core_only_hierarchical_corepad_comparison.py
          python3 scripts/bootstrap_flow.py
          echo "CLOUD_APPIMAGE=$GITHUB_WORKSPACE/hw/soc/tools/physical/librelane-3.0.5-x86_64.AppImage" >> "$GITHUB_ENV"
      - name: Measure actual core paths with buffered parent
        run: python3 scripts/cloud_core_only_hierarchical_corepad_comparison.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: core-only-hierarchical-corepad-comparison-${{ github.run_id }}
          path: hw/soc/out/core-only-hierarchical-corepad-comparison/
          if-no-files-found: error
          retention-days: 90
