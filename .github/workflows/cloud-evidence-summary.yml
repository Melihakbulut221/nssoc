name: PCIe boundary register slices - SoC base and full lint before and after
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  soc:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        side: [baseline, change]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: ${{ matrix.side == 'baseline' && 'codex/complete-open-work' || github.ref }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: YosysHQ/setup-oss-cad-suite@aefa8397bbf8fc6670a0a62af9805a89738f3cde
        with:
          version: '2026-08-04'
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Prepare the pinned CPU and interface RTL
        run: |
          git log --oneline -1
          echo "OSS_CAD_SUITE=$(dirname "$(dirname "$(command -v yosys)")")" >> "$GITHUB_ENV"
          python3 -m pip install -q -r sw/requirements.txt
          python3 -m venv hw/.venv
          hw/.venv/bin/pip install -q -r hw/requirements.txt
          make soc-rtl-prepare INTERFACE_PYTHON="$PWD/hw/.venv/bin/python"
          make soc-interfaces-prepare SOC_INTERFACE_PROFILE=full INTERFACE_PYTHON="$PWD/hw/.venv/bin/python"
      - name: Base and full lint, joint PCIe/Ethernet traffic (asynchronous and synchronous packet clock)
        run: |
          set +e
          O=$PWD/out; mkdir -p $O
          python3 scripts/check_soc_lint.py --profile base --output hw/soc/out/skid-lint-base > $O/lint-base.log 2>&1; echo "lint-base rc=$?"
          python3 scripts/check_soc_lint.py --profile full --output hw/soc/out/skid-lint-full > $O/lint-full.log 2>&1; echo "lint-full rc=$?"
          cp -r hw/soc/out/skid-lint-base $O/lint-base; cp -r hw/soc/out/skid-lint-full $O/lint-full
          for f in lint-base lint-full; do
            python3 -c "import json,sys;d=json.load(open(sys.argv[1]));print(sys.argv[2],{k:d.get(k) for k in ('status','tests','delta','sources_unchanged','immutable_drift','own_unaccepted','unchanged','runtime_unchanged','asynchronous_pcie')})" $O/$f/result.json $f 2>/dev/null || { echo "$f no result"; tail -30 $O/$f.log; }
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: pcie-skid-soc-${{ matrix.side }}-${{ github.run_id }}
          path: |
            out/*.log
            out/*/result.json
          retention-days: 30
