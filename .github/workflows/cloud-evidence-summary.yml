name: Map failed collector loaded devices to actual matched schematic instances
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
env:
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  source-controls:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/cloud_cdr_collector_device_map.py
            /scripts/cdr-collector-device-map-inputs.json
            /scripts/cdr-collector-device-map-pins.json
            /docs/cdr-collector-device-map.md
            /.github/workflows/cloud-evidence-summary.yml
      - name: Reject incomplete and mismatched device correspondence fixtures
        run: python3 -B scripts/cloud_cdr_collector_device_map.py --controls
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: collector-device-map-controls-${{ github.run_id }}
          path: collector-device-map
          retention-days: 90
          if-no-files-found: error
  native-correspondence:
    needs: source-controls
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/cloud_cdr_collector_device_map.py
            /scripts/cdr-collector-device-map-inputs.json
            /scripts/cdr-collector-device-map-pins.json
            /docs/cdr-collector-device-map.md
            /.github/workflows/cloud-evidence-summary.yml
      - name: Install version matched native KLayout reader
        run: python3 -m pip install --disable-pip-version-check --no-cache-dir klayout==0.30.4.post1
      - name: Read complete native LVS pairings and cross-check actual loaded terminal identities
        run: python3 -B scripts/cloud_cdr_collector_device_map.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: collector-device-map-derived-${{ github.run_id }}
          path: collector-device-map
          retention-days: 90
          if-no-files-found: error
