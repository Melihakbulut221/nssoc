name: Mainchip original class counterpart scope
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Source controls or read-only derived-data classification
        type: choice
        options: [controls, classify]
        default: controls
permissions:
  contents: read
concurrency:
  group: mainchip-counterpart-scope-${{ github.ref }}
  cancel-in-progress: false
jobs:
  source-controls:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/mainchip_drt_counterpart_scope.py
            /scripts/check_mainchip_drt_counterpart_scope.py
            /scripts/mainchip-drt-counterpart-scope-inputs.json
            /docs/mainchip-drt-counterpart-scope.md
            /.github/workflows/cloud-evidence-summary.yml
      - name: Exact source identity and byte pins
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$GITHUB_RUN_ATTEMPT" = "1"
          python3 -B -c 'import sys; sys.path.insert(0,"scripts"); import mainchip_drt_counterpart_scope as c; c.source_guard(); print("SOURCE_PINS_VERIFIED")'
      - name: Offline original class, membership, multiplicity and refusal controls
        run: python3 -B scripts/check_mainchip_drt_counterpart_scope.py
  classify:
    if: ${{ inputs.mode == 'classify' }}
    needs: source-controls
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/mainchip_drt_counterpart_scope.py
            /scripts/check_mainchip_drt_counterpart_scope.py
            /scripts/mainchip-drt-counterpart-scope-inputs.json
            /docs/mainchip-drt-counterpart-scope.md
            /.github/workflows/cloud-evidence-summary.yml
      - name: Join compact obstacle evidence to original classes in the cloud
        run: python3 -B scripts/mainchip_drt_counterpart_scope.py --output cloud-counterpart-result
      - name: Preserve every derived input, output and failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mainchip-counterpart-${{ github.run_id }}-${{ github.run_attempt }}
          path: cloud-counterpart-result
          if-no-files-found: error
          retention-days: 90
