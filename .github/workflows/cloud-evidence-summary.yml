name: Full hierarchical transistor chip LVS with engineering SRAM interiors
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  lvs:
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    env:
      GH_TOKEN: ${{ github.token }}
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/full_chip_transistor_compare.rb
            /scripts/run_full_chip_transistor_lvs.py
            /scripts/check_lvs_ports_bound2048.rb
            /hw/soc/flow/audit_klayout_lvs.py
      - name: Restore verified native inputs only on cloud runner
        run: |
          set -euo pipefail
          gh api repos/${{ github.repository }}/actions/artifacts/14114996311/zip > macro.zip
          gh api repos/${{ github.repository }}/actions/artifacts/14115684311/zip > reference.zip
          gh api repos/${{ github.repository }}/actions/artifacts/14116226453/zip > layout.zip
          gh api repos/${{ github.repository }}/actions/artifacts/14116294182/zip > sources.zip
          curl -fL --retry 5 https://www.klayout.org/downloads/Ubuntu-24/klayout_0.30.13-1_amd64.deb -o /tmp/klayout.deb
          echo '0bb6b913fd6a32581d50b08be744b522a2a477baa1ed7e253c97cc18ce248a24  /tmp/klayout.deb' | sha256sum -c -
          sudo apt-get update -qq
          sudo apt-get install -y /tmp/klayout.deb
          python3 -m pip install klayout==0.30.13
      - name: Native comparison fault controls
        run: klayout -b -zz -r scripts/check_lvs_ports_bound2048.rb
      - name: Full chip extraction comparison and strict audit
        run: python3 scripts/run_full_chip_transistor_lvs.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: full-chip-transistor-lvs-derived-${{ github.run_id }}
          path: |
            out/derived
            out/comparison-controls.json
          if-no-files-found: error
          retention-days: 90
      - name: Preserve native comparison database in cloud
        if: always()
        run: tar -czf full-chip-lvs-native.tgz -C out native
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: full-chip-transistor-lvs-native-${{ github.run_id }}
          path: full-chip-lvs-native.tgz
          if-no-files-found: error
          retention-days: 90
