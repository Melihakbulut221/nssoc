name: Build verified collision-free SRAM GDS and CDL library
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  bundle:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/namespace_sram_macro.py
            /scripts/build_namespaced_sram_library.py
      - run: python3 -m pip install --disable-pip-version-check --no-cache-dir klayout==0.30.13
      - run: |
          set -euo pipefail
          gh api repos/${{ github.repository }}/actions/artifacts/14114996311/zip > dp-native.zip
          gh api repos/${{ github.repository }}/actions/artifacts/14114806722/zip > dp-derived.zip
          gh api repos/${{ github.repository }}/actions/artifacts/14114621580/zip > sp-native.zip
          gh api repos/${{ github.repository }}/actions/artifacts/14114671499/zip > sp-derived.zip
          python3 scripts/build_namespaced_sram_library.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: namespaced-sram-library-derived-${{ github.run_id }}
          path: out/*.json
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: namespaced-sram-library-native-${{ github.run_id }}
          path: bundle
          if-no-files-found: error
          retention-days: 90
