name: 52-cell detailed route and extracted timing
on: workflow_dispatch
permissions:
  contents: read
jobs:
  deck:
    strategy:
      fail-fast: false
      matrix:
        trial: [sized]
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    env:
      PDK_ROOT: ${{ github.workspace }}/hw/soc/tools/pdk
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/bootstrap_flow.py
            /hw/soc/flow/
            /hw/soc/sta/
            /cloud52/
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Prepare pinned CAD and public PDK
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libfuse2t64
          python -m pip install 'ciel==2.4.0'
          pin=c4b8b4e5e7a05f375cca3815d51b3a37721fbf5c
          ciel fetch --pdk-root "$PDK_ROOT" --pdk-family ihp-sg13g2 -l all "$pin"
          ciel enable --pdk-root "$PDK_ROOT" --pdk-family ihp-sg13g2 "$pin"
          python scripts/bootstrap_flow.py --destination "$RUNNER_TEMP/librelane.AppImage"
      - name: Check authenticated physical checkpoint
        run: |
          (cd "$RUNNER_TEMP" && ./librelane.AppImage --appimage-extract > /dev/null)
          shell=/nix/store/ycav2pkclnif0d8yhyhl1a1kl133bx1j-devshell/bin/devshell
          mkdir "$RUNNER_TEMP/physical"
          cd "$RUNNER_TEMP/physical"
          xz -dc "$GITHUB_WORKSPACE/cloud52/input.odb.xz" > input.odb
          sha256sum -c "$GITHUB_WORKSPACE/cloud52/input.sha256"
          cp "$GITHUB_WORKSPACE/cloud52/"*.tcl .
          sed '/^source .*prune_orphan/,$d' route.tcl | sed '/^read_current_odb/,$d;s@/work/input.odb@/work/routed.odb@' > repair2.tcl
          echo 'read_current_odb' >> repair2.tcl
          echo 'set_thread_count 12' >> repair2.tcl
          sed -n '/^if {\[check_antennas\]}/,$p' route.tcl >> repair2.tcl
          cat >> sta.tcl <<'TCL'
          foreach corner {nom_fast_1p32V_m40C nom_typ_1p20V_25C nom_slow_1p08V_125C} {
              foreach delay {min max} {
                  report_checks -corner $corner -path_delay $delay -slack_max 0 -group_path_count 200000 -endpoint_path_count 1 -unique_paths_to_endpoint -digits 6 -format end > /work/$corner-$delay.rpt
              }
          }
          TCL
          for step in route extract sta repair2 extract sta; do
            docker run --rm -e TRIAL="${{ matrix.trial }}" -e STEP_DIR=/work -v "$RUNNER_TEMP/squashfs-root/nix:/nix:ro" -v "$GITHUB_WORKSPACE:/repo:ro" -v "$PWD:/work" -w /work debian:trixie-slim "$shell" openroad -exit "/work/$step.tcl"
            if [ "$step" = sta ]; then
              sha256sum routed.odb nominal.spef
              python "$GITHUB_WORKSPACE/hw/soc/flow/audit_estimated_spef.py" nominal.spef --allow-coupling --output audit.json
              cat audit.json
              for report in nom_*.rpt; do echo "$report violated endpoints: $(grep -c '(VIOLATED)' "$report" || true)"; done
            fi
          done
