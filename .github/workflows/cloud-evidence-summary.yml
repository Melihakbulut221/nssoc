name: Preserve iteration ODB snapshots during full64 native routing
on:
  workflow_dispatch:
    inputs:
      execute:
        description: Execute one full64 native route after independent controls
        type: boolean
        default: false
      control_run:
        description: Independently successful same-source source-controls run
        type: string
        default: '0'
permissions:
  contents: read
  actions: read
env:
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  source-controls:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/mainchip_full_route_stage.py
            /scripts/mainchip_full_route_snapshots.py
            /scripts/mainchip_full64_snapshot_inner.py
            /scripts/cloud_mainchip_full64_snapshots.py
            /scripts/check_mainchip_full_route_snapshots.py
            /scripts/check_mainchip_full_route_stage.py
            /scripts/mainchip_full64_route_inner.py
            /scripts/cloud_mainchip_full64_route.py
            /scripts/mainchip_full64_output_preservation.py
            /scripts/check_mainchip_full64_native.py
            /scripts/mainchip-bounded-route-baseline.tcl
            /scripts/prepare_scoped_restoration_sources.py
            /docs/mainchip-full64-route.md
            /docs/mainchip-full64-iteration-snapshots.md
            /scripts/mainchip-full64-pins.json
            /scripts/mainchip-full64-snapshot-pins.json
            /.github/workflows/cloud-evidence-summary.yml
      - name: Authenticate every own source before execution
        run: |
          python3 -B - <<'PY'
          import hashlib,json,pathlib,subprocess
          root=pathlib.Path(".")
          m=json.loads((root/"scripts/mainchip-full64-snapshot-pins.json").read_bytes())
          subprocess.run(["git","diff","--exit-code","HEAD","--","scripts/mainchip-full64-snapshot-pins.json",*m],check=True)
          for n,p in m.items():
              f=root/n
              assert f.is_file()and not f.is_symlink()
              b=f.read_bytes();assert dict(bytes=len(b),sha256=hashlib.sha256(b).hexdigest())==p,n
              if n.endswith(".py"):compile(b,n,"exec")
          PY
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 7a0776718ec37a106b7dfde0cbd477c6a2a5522f
          path: original
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: /scripts/mainchip-bounded-route-host-pins.json
      - name: Authenticate original source and exact derived scope inputs
        run: python3 -B scripts/prepare_scoped_restoration_sources.py
      - name: Full64 lifecycle and native dispatch/preservation controls
        run: |
          python3 -B scripts/check_mainchip_full_route_stage.py
          python3 -B scripts/check_mainchip_full64_native.py
          python3 -B scripts/check_mainchip_full_route_snapshots.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: full64-native-controls-${{ github.run_id }}
          path: |
            full64-controls
            full64-native-controls
            full64-snapshot-controls
            scoped-restoration-controls
          retention-days: 90
          if-no-files-found: error
  native-routing:
    if: inputs.execute
    needs: source-controls
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      CONTROL_RUN: ${{ inputs.control_run }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/mainchip_full_route_stage.py
            /scripts/mainchip_full_route_snapshots.py
            /scripts/mainchip_full64_snapshot_inner.py
            /scripts/cloud_mainchip_full64_snapshots.py
            /scripts/check_mainchip_full_route_snapshots.py
            /scripts/check_mainchip_full_route_stage.py
            /scripts/mainchip_full64_route_inner.py
            /scripts/cloud_mainchip_full64_route.py
            /scripts/mainchip_full64_output_preservation.py
            /scripts/check_mainchip_full64_native.py
            /scripts/mainchip-bounded-route-baseline.tcl
            /scripts/prepare_scoped_restoration_sources.py
            /docs/mainchip-full64-route.md
            /docs/mainchip-full64-iteration-snapshots.md
            /scripts/mainchip-full64-pins.json
            /scripts/mainchip-full64-snapshot-pins.json
            /.github/workflows/cloud-evidence-summary.yml
      - name: Authenticate every own source before execution
        run: |
          python3 -B - <<'PY'
          import hashlib,json,pathlib,subprocess
          root=pathlib.Path(".")
          m=json.loads((root/"scripts/mainchip-full64-snapshot-pins.json").read_bytes())
          subprocess.run(["git","diff","--exit-code","HEAD","--","scripts/mainchip-full64-snapshot-pins.json",*m],check=True)
          for n,p in m.items():
              f=root/n
              assert f.is_file()and not f.is_symlink()
              b=f.read_bytes();assert dict(bytes=len(b),sha256=hashlib.sha256(b).hexdigest())==p,n
              if n.endswith(".py"):compile(b,n,"exec")
          PY
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 7a0776718ec37a106b7dfde0cbd477c6a2a5522f
          path: original
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: /scripts/mainchip-bounded-route-host-pins.json
      - name: Authenticate original source and exact derived scope inputs
        run: python3 -B scripts/prepare_scoped_restoration_sources.py
      - name: Execute and preserve actual full64 route
        run: python3 -B scripts/cloud_mainchip_full64_snapshots.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: full64-native-derived-${{ github.run_id }}
          path: full64-native-evidence
          retention-days: 90
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: full64-native-workspace-${{ github.run_id }}
          path: ${{ runner.temp }}/mainchip-bulk-postdrt-antenna-${{ github.run_id }}-1/out
          retention-days: 30
          if-no-files-found: warn
