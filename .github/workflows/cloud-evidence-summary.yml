name: Cut10 actual SRAM and PCIe parameter equivalence
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sram:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          filter: blob:none
          sparse-checkout: |
            scripts
            hw/soc/rtl/dft
      - run: sudo apt-get update -qq && sudo apt-get install -y yosys
      - run: python3 -u scripts/check_sram_bool_equivalence.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: cut10-actual-sram-equivalence-${{ github.run_id }}
          path: |
            out/*.log
            out/*.ys
            out/result.json
          if-no-files-found: error
          retention-days: 90
  pcie:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        configuration: [default, cut10]
        direction: [forward, reverse]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          filter: blob:none
          sparse-checkout: |
            scripts
            hw/soc/rtl/pcie
      - run: sudo apt-get update -qq && sudo apt-get install -y yosys iverilog
      - run: python3 -u scripts/check_pcie_rx_completer_equivalence.py ${{ matrix.configuration }} ${{ matrix.direction }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: cut10-actual-pcie-equivalence-${{ matrix.configuration }}-${{ matrix.direction }}-${{ github.run_id }}
          path: |
            out/*.log
            out/*.ys
            out/result.json
            out/selector-controls.json
            out/reference-normalization.json
          if-no-files-found: error
          retention-days: 90
