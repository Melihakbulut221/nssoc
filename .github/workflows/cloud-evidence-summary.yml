name: Full-chip KLayout LVS of a routed main-chip database
on:
  workflow_dispatch:
    inputs:
      routed_artifact: {description: 'artifact id holding routed.odb', type: string, default: '13493489102'}
      variants: {description: 'JSON list of variants', type: string, default: '["full", "sram_blackbox"]'}
      audit_artifact: {description: 'audit-only: artifact id holding soc_top.lvsdb.gz and deck.log', type: string, default: ''}
permissions:
  contents: read
  actions: read
jobs:
  audit:
    if: inputs.audit_artifact != ''
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      APPIMAGE_SHA: d6a349ec65be11456e96c4981d35f63ca34d3c85daf79a51e1ccb907bb5d7466
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: /hw/soc/flow/audit_klayout_lvs.py
      - name: Audit a preserved LVS database
        run: |
          set +e
          W=/mnt/l; sudo mkdir -p $W/o; sudo chown -R $USER $W
          sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends libfuse2
          curl -fsSL -o $W/librelane.AppImage https://github.com/librelane/librelane/releases/download/3.0.5/librelane-devshell-x86_64.AppImage
          echo "$APPIMAGE_SHA  $W/librelane.AppImage" | sha256sum -c - || exit 1; chmod +x $W/librelane.AppImage
          APP="env -u GH_TOKEN -u GITHUB_TOKEN $W/librelane.AppImage"
          gh api repos/${{ github.repository }}/actions/artifacts/${{ inputs.audit_artifact }}/zip > $W/a.zip
          cd $W/o && unzip -q -o ../a.zip && gunzip -f soc_top.lvsdb.gz && cd -
          $APP python hw/soc/flow/audit_klayout_lvs.py $W/o/soc_top.lvsdb --top soc_top --deck-log $W/o/deck.log --output $W/o/audit.json; echo "AUDIT_RC=$?"
          python3 - $W/o/audit.json <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1]))
          for k,v in d.items():
              s=json.dumps(v)
              print(k,':',s[:3000])
          PY
          mkdir -p out && cp $W/o/audit.json out/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: mainchip-lvs-audit-${{ github.run_id }}
          path: out
          retention-days: 30
  lvs:
    if: inputs.audit_artifact == ''
    runs-on: ubuntu-22.04
    timeout-minutes: 355
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJSON(inputs.variants) }}
    env:
      GH_TOKEN: ${{ github.token }}
      IMAGE: openroad/ubuntu24.04-dev@sha256:468fcd7f156dd350a648b0a3038ea16a5a25fde2e1b527f03d052108fea5ff3a
      ENGINE_PART: '687863984'
      ENGINE_SHA: 2a343c7491353a60e7b06aa134d4b67e3ef2e846a8341164dacffe88f5f7ec2f
      APPIMAGE_SHA: d6a349ec65be11456e96c4981d35f63ca34d3c85daf79a51e1ccb907bb5d7466
      PDK_COMMIT: c4b8b4e5e7a05f375cca3815d51b3a37721fbf5c
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /hw/soc/flow/transistor_schematic.py
            /hw/soc/flow/audit_klayout_lvs.py
            /hw/soc/flow/prepare_ihp_lvs.py
            /hw/soc/flow/prepare_ihp_drc.py
            /hw/soc/pnr/ihp-lvs.lock.json
            /hw/soc/pnr/ihp-drc.lock.json
            /hw/soc/flow/check_ihp_drc.py
            /hw/soc/flow/check_ihp_drc_partitioned.py
            /hw/soc/flow/check_ihp_density_coverage.py
            /hw/soc/flow/fill_chip_windows.py
            /hw/soc/flow/audit_fill_preservation.py
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Tools, PDK views and the routed database
        run: |
          set -euo pipefail
          W=/mnt/l; sudo mkdir -p $W/e $W/o $W/b; sudo chown -R $USER $W
          sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends libfuse2
          curl -fsSL -o $W/librelane.AppImage https://github.com/librelane/librelane/releases/download/3.0.5/librelane-devshell-x86_64.AppImage
          echo "$APPIMAGE_SHA  $W/librelane.AppImage" | sha256sum -c -; chmod +x $W/librelane.AppImage
          gh api repos/${{ github.repository }}/actions/artifacts/${{ inputs.routed_artifact }}/zip > $W/in.zip
          unzip -p $W/in.zip routed.odb > $W/o/routed.odb; rm $W/in.zip; sha256sum $W/o/routed.odb
          docker pull -q "$IMAGE"
          gh api repos/${{ github.repository }}/releases/assets/$ENGINE_PART -H "Accept: application/octet-stream" > $W/engine.tgz
          tar -xzf $W/engine.tgz -C $W/e; rm $W/engine.tgz
          E=$(find $W/e -type f -name openroad -exec sha256sum {} + | awk -v s=$ENGINE_SHA '$1==s{print $2}' | head -1); test -n "$E"; cp "$E" $W/b/openroad; chmod +x $W/b/openroad
          git clone -q --filter=blob:none --no-checkout https://github.com/IHP-GmbH/IHP-Open-PDK.git $W/pdk
          cd $W/pdk && git sparse-checkout set --no-cone \
            /ihp-sg13g2/libs.ref/sg13g2_stdcell/cdl/ /ihp-sg13g2/libs.ref/sg13g2_stdcell/gds/ /ihp-sg13g2/libs.ref/sg13g2_stdcell/lef/ /ihp-sg13g2/libs.ref/sg13g2_stdcell/verilog/ \
            '/ihp-sg13g2/libs.ref/sg13g2_sram/cdl/RM_IHPSG13_1P_2048x64*' '/ihp-sg13g2/libs.ref/sg13g2_sram/cdl/RM_IHPSG13_2P_256x16*' \
            '/ihp-sg13g2/libs.ref/sg13g2_sram/gds/RM_IHPSG13_1P_2048x64*' '/ihp-sg13g2/libs.ref/sg13g2_sram/gds/RM_IHPSG13_2P_256x16*' \
            '/ihp-sg13g2/libs.ref/sg13g2_sram/lef/RM_IHPSG13_1P_2048x64*' '/ihp-sg13g2/libs.ref/sg13g2_sram/lef/RM_IHPSG13_2P_256x16*' \
            /ihp-sg13g2/libs.tech/klayout/tech/
          git checkout -q $PDK_COMMIT; git log --oneline -1
          find $W/pdk/ihp-sg13g2/libs.ref -type f | sed "s|$W/pdk/||" | sort | head -40; du -sh $W/pdk/ihp-sg13g2
      - name: Export DEF and powered Verilog with the routing engine
        run: |
          set -euo pipefail
          W=/mnt/l
          cat > $W/o/export.tcl <<'TCL'
          read_db /v/o/routed.odb
          set b [ord::get_db_block]
          puts "NSSOC_EXPORT insts=[llength [$b getInsts]] nets=[llength [$b getNets]]"
          set un 0
          foreach i [$b getInsts] {
            foreach t [$i getITerms] {
              set s [[$t getMTerm] getSigType]
              if {($s eq "POWER" || $s eq "GROUND") && [$t getNet] eq "NULL"} {incr un}
            }
          }
          puts "NSSOC_UNBOUND_PG $un"
          # Logical PG binding only (row rails supply the cells physically); the
          # diodes added by the antenna repair have unbound VDD/VSS terminals.
          add_global_connection -net VPWR -inst_pattern .* -pin_pattern {^VDD$} -power
          add_global_connection -net VGND -inst_pattern .* -pin_pattern {^VSS$} -ground
          global_connect
          write_def /v/o/soc_top.def
          write_verilog -include_pwr_gnd /v/o/soc_top.pwr.v
          TCL
          docker run --rm -v $W:/v "$IMAGE" /v/b/openroad -no_init -exit /v/o/export.tcl | tail -3
          ls -la $W/o
      - name: Stream out GDS (LibreLane KLayout stream_out)
        run: |
          set -euo pipefail
          W=/mnt/l; P=$W/pdk/ihp-sg13g2/libs.ref; T=$W/pdk/ihp-sg13g2/libs.tech/klayout/tech
          APP="env -u GH_TOKEN -u GITHUB_TOKEN $W/librelane.AppImage"
          LL=$($APP python -c 'import librelane,os;print(os.path.dirname(librelane.__file__))' | tail -1); echo "LL=$LL"
          S1=$P/sg13g2_sram; ls $S1/*/
          $APP python $LL/scripts/klayout/stream_out.py $W/o/soc_top.def -o $W/o/soc_top.gds -t soc_top \
            -T $T/sg13g2.lyt -P $T/sg13g2.lyp -M $T/sg13g2.map \
            -l $P/sg13g2_stdcell/lef/sg13g2_tech.lef -l $P/sg13g2_stdcell/lef/sg13g2_stdcell.lef \
            -l $S1/lef/RM_IHPSG13_1P_2048x64_c2_bm_bist.lef -l $S1/lef/RM_IHPSG13_2P_256x16_c2_bm_bist.lef \
            -w $P/sg13g2_stdcell/gds/sg13g2_stdcell.gds \
            -w $S1/gds/RM_IHPSG13_1P_2048x64_c2_bm_bist.gds -w $S1/gds/RM_IHPSG13_2P_256x16_c2_bm_bist.gds 2>&1 | tail -20
          ls -la $W/o/soc_top.gds
      - name: Transistor schematic and the pinned IHP LVS deck
        if: startsWith(matrix.variant, 'drc') == false && startsWith(matrix.variant, 'fill') == false
        run: |
          set -euo pipefail
          W=/mnt/l; P=$W/pdk/ihp-sg13g2/libs.ref; S1=$P/sg13g2_sram
          APP="env -u GH_TOKEN -u GITHUB_TOKEN $W/librelane.AppImage"
          $APP python hw/soc/flow/transistor_schematic.py $W/o/soc_top.pwr.v --top soc_top \
            --cdl $P/sg13g2_stdcell/cdl/sg13g2_stdcell.cdl --cdl $S1/cdl/RM_IHPSG13_1P_2048x64_c2_bm_bist.cdl --cdl $S1/cdl/RM_IHPSG13_2P_256x16_c2_bm_bist.cdl \
            --standard-cell-verilog $P/sg13g2_stdcell/verilog/sg13g2_stdcell.v --output $W/o/sch 2>&1 | tail -15
          ls -la $W/o/sch
          python3 hw/soc/flow/prepare_ihp_lvs.py | tail -2
          D=hw/soc/tools/ihp-lvs-5e6d592/ihp-sg13g2/libs.tech/klayout/tech/lvs
          if [ "${{ matrix.variant }}" = sram_blackbox ]; then
            # Vendor SRAM CDL does not match its own GDS (IHP issue #239). Blank the
            # macros on both sides so the top-level connectivity gets a verdict.
            python3 - "$D/sg13g2.lvs" <<'PY'
          import re,sys
          p=sys.argv[1];s=open(p).read()
          anchor='  # === Aligns the extracted netlist vs. the schematic ===\n'
          assert s.count(anchor)==1, 'alignment anchor not found'
          s=s.replace(anchor,'  blank_circuit("RM_IHPSG13_*")\n'+anchor)
          open(p,'w').write(s);print('blank_circuit inserted before alignment')
          PY
          fi
          echo "DECK=$D/sg13g2.lvs" >> $GITHUB_ENV
      - name: KLayout LVS (deep mode)
        if: startsWith(matrix.variant, 'drc') == false && startsWith(matrix.variant, 'fill') == false
        run: |
          set +e
          W=/mnt/l; APP="env -u GH_TOKEN -u GITHUB_TOKEN $W/librelane.AppImage"
          SCH=$(ls $W/o/sch/*.cir | head -1); echo "schematic $SCH"
          start=$(date +%s)
          timeout 17000 $APP klayout -b -zz -r $DECK -rd input=$W/o/soc_top.gds -rd schematic=$SCH -rd topcell=soc_top -rd run_mode=deep \
            -rd report=$W/o/soc_top.lvsdb -rd log=$W/o/deck.log -rd target_netlist=$W/o/extracted.cir > $W/o/klayout.log 2>&1
          echo "KLAYOUT_RC=$? elapsed=$(( $(date +%s)-start ))"
          tail -30 $W/o/deck.log
          $APP python hw/soc/flow/audit_klayout_lvs.py $W/o/soc_top.lvsdb --top soc_top --deck-log $W/o/deck.log --output $W/o/audit.json; echo "AUDIT_RC=$?"
          python3 -c "import json;d=json.load(open('$W/o/audit.json'));print(json.dumps({k:v for k,v in d.items() if not isinstance(v,(list,dict)) or len(json.dumps(v))<2000},indent=1)[:6000])" || true
      - name: Metal fill with the pinned generator (tiled gdsfill, chip bundle config)
        if: startsWith(matrix.variant, 'fill')
        run: |
          set -euo pipefail
          W=/mnt/l; APP="env -u GH_TOKEN -u GITHUB_TOKEN $W/librelane.AppImage"
          gh api repos/${{ github.repository }}/releases/assets/597158300 -H "Accept: application/octet-stream" > $W/fill.tar.xz
          echo "1b456a580d1f4d7f6c5105b41a588e73dd74ef23aed66624284e1280f296166e  $W/fill.tar.xz" | sha256sum -c -
          mkdir -p $W/fb && tar -xJf $W/fill.tar.xz -C $W/fb && rm $W/fill.tar.xz
          TOOL=$(find $W/fb -type f -path '*tool/gdsfill' | head -1); CFG=$(find $W/fb -maxdepth 3 -type f -name config.yaml | head -1)
          test -n "$TOOL" && test -n "$CFG"; chmod +x $TOOL; sha256sum $TOOL $CFG; cat $CFG
          # The density deck normalises by prBoundary when present, else by the layout extent.
          NB=$($APP python -c "import klayout.db as d,sys;l=d.Layout();l.read(sys.argv[1]);t=l.top_cell();print(d.Region(t.begin_shapes_rec(l.layer(189,0))).count(), d.Region(t.begin_shapes_rec(l.layer(39,4))).count(), t.dbbox())" $W/o/soc_top.gds | tail -1)
          echo "prBoundary/EdgeSeal/bbox: $NB"
          EXT=""; [ "$(echo $NB | cut -d' ' -f1)" = 0 ] && EXT=--allow-layout-extent
          start=$(date +%s)
          $APP python hw/soc/flow/fill_chip_windows.py $W/o/soc_top.gds $W/o/fill --tool $TOOL --config $CFG \
            --audit hw/soc/flow/audit_fill_preservation.py --tile-size 500 $EXT > $W/o/fill.log 2>&1 || { tail -40 $W/o/fill.log; exit 1; }
          echo "fill elapsed=$(( $(date +%s)-start ))"; tail -5 $W/o/fill.log
          python3 -c "import json;p=json.load(open('$W/o/fill/progress.json'));g=json.load(open('$W/o/fill/final-geometry.json'));print(p['status'],p['expected_tiles'],len(p['completed_tiles']),g['status'],g['errors'][:5])"
          cp $W/o/fill/checkpoint.gds $W/o/soc_top.filled.gds; ls -la $W/o/soc_top.filled.gds
      - name: KLayout DRC with the pinned IHP deck (no cell or region excluded)
        if: startsWith(matrix.variant, 'drc') || startsWith(matrix.variant, 'fill')
        run: |
          set +e
          W=/mnt/l
          # The full-chip main deck peaks above the 16 GB of a hosted runner; add swap.
          sudo fallocate -l 32G /mnt/swapfile && sudo chmod 600 /mnt/swapfile && sudo mkswap /mnt/swapfile >/dev/null && sudo swapon /mnt/swapfile; free -g
          printf '#!/bin/sh\nexec env -u GH_TOKEN -u GITHUB_TOKEN %s klayout "$@"\n' $W/librelane.AppImage | sudo tee /usr/local/bin/klayout > /dev/null; sudo chmod +x /usr/local/bin/klayout
          klayout -v
          start=$(date +%s)
          ( while true; do echo "MEM $(date +%H:%M:%S) $(free -m | awk '/Mem:/{m=$3"/"$2} /Swap:/{s=$3} END{print m" MB used, swap "s" MB"}') $(ps -eo rss,comm --sort=-rss | head -2 | tail -1)"; sleep 120; done ) &
          if [ "${{ matrix.variant }}" = drc_density ] || [ "${{ matrix.variant }}" = fill_density ]; then
            G=$W/o/soc_top.gds; [ "${{ matrix.variant }}" = fill_density ] && G=$W/o/soc_top.filled.gds
            timeout 19000 python3 hw/soc/flow/check_ihp_drc.py $G --top soc_top --tag mainchip-${{ matrix.variant }} --deck density --threads 1 > $W/o/drc.log 2>&1
            RC=$?; echo "density rc=$RC"
            (cd hw/soc/flow && python3 -c "import json,sys;from check_ihp_density_coverage import validate_density_coverage as v;o='../out/mainchip-${{ matrix.variant }}';r=v(o+'/drc.lyrdb',o+'/run.log','soc_top',0);print(json.dumps({k:r[k] for k in ('status','markers','executed_rule_count','categories')},indent=1))") || echo "coverage check failed"
          elif [ "${{ matrix.variant }}" = drc_main ]; then
            timeout 19000 python3 hw/soc/flow/check_ihp_drc_partitioned.py $W/o/soc_top.gds --top soc_top --tag mainchip-drc-main --threads 1 --timeout-seconds 9000 > $W/o/drc.log 2>&1
          else
            timeout 19000 python3 hw/soc/flow/check_ihp_drc.py $W/o/soc_top.gds --top soc_top --tag mainchip-drc-antenna --deck antenna --threads 4 > $W/o/drc.log 2>&1
          fi
          echo "DRC_RC=$? elapsed=$(( $(date +%s)-start ))"; tail -30 $W/o/drc.log
          for f in hw/soc/out/mainchip-*/result.json; do echo "== $f"; python3 -c "import json,sys;d=json.load(open(sys.argv[1]));print(json.dumps({k:v for k,v in d.items() if len(json.dumps(v))<3000},indent=1)[:8000])" $f; done
          mkdir -p out && cp -r hw/soc/out/mainchip-* out/ 2>/dev/null; find out -name '*.lyrdb' -size +50M -delete
      - name: Collect
        if: always()
        run: |
          W=/mnt/l; mkdir -p out; cp $W/o/drc.log out/ 2>/dev/null || true; cp $W/o/deck.log $W/o/klayout.log $W/o/audit.json out/ 2>/dev/null || true
          ls -la $W/o/sch 2>/dev/null | head; cp $W/o/sch/*.json out/ 2>/dev/null || true
          cp $W/o/fill.log $W/o/fill/*.json out/ 2>/dev/null || true
          [ -f $W/o/soc_top.filled.gds ] && gzip -c $W/o/soc_top.filled.gds > out/soc_top.filled.gds.gz || true
          [ -f $W/o/soc_top.lvsdb ] && gzip -c $W/o/soc_top.lvsdb | head -c 900000000 > out/soc_top.lvsdb.gz || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: mainchip-lvs-${{ matrix.variant }}-${{ github.run_id }}
          path: out
          retention-days: 30
