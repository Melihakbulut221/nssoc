name: Interface routing checkpoint physical decks
on: workflow_dispatch
permissions:
  contents: read
jobs:
  deck:
    strategy:
      fail-fast: false
      matrix:
        check: [xor, magic-drc, lvs]
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    env:
      PDK_ROOT: ${{ github.workspace }}/hw/soc/tools/pdk
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/bootstrap_flow.py
            /hw/soc/pnr/
            /hw/soc/flow/check_interface_route_snapshot.py
            /docs/evidence/qspi-first-detail-20261125.odb.xz
            /docs/evidence/qspi-first-detail-nominal-rc-20261125.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Prepare pinned CAD and public PDK
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libfuse2t64
          python -m pip install 'ciel==2.4.0'
          pin=c4b8b4e5e7a05f375cca3815d51b3a37721fbf5c
          ciel fetch --pdk-root "$PDK_ROOT" --pdk-family ihp-sg13g2 -l all "$pin"
          ciel enable --pdk-root "$PDK_ROOT" --pdk-family ihp-sg13g2 "$pin"
          python scripts/bootstrap_flow.py --destination "$RUNNER_TEMP/librelane.AppImage"
      - name: Check authenticated physical checkpoint
        run: |
          (cd "$RUNNER_TEMP" && ./librelane.AppImage --appimage-extract > /dev/null)
          shell=/nix/store/ycav2pkclnif0d8yhyhl1a1kl133bx1j-devshell/bin/devshell
          docker run --rm -v "$RUNNER_TEMP/squashfs-root/nix:/nix:ro" \
            -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE:ro" -v "$RUNNER_TEMP:$RUNNER_TEMP" \
            -w "$GITHUB_WORKSPACE" debian:trixie-slim "$shell" python hw/soc/flow/check_interface_route_snapshot.py "${{ matrix.check }}" \
            --archive docs/evidence/qspi-first-detail-20261125.odb.xz \
            --receipt docs/evidence/qspi-first-detail-nominal-rc-20261125.json \
            --pdk-root "$PDK_ROOT" --out "$RUNNER_TEMP/deck"
      - name: Print native verdict and report inventory
        if: always()
        run: |
          if test -f "$RUNNER_TEMP/deck/result.json"; then cat "$RUNNER_TEMP/deck/result.json"; fi
          if test -d "$RUNNER_TEMP/deck/flow"; then
            find "$RUNNER_TEMP/deck/flow" -type f \( -name '*.rpt' -o -name '*.lyrdb' -o -name '*lvs*.json' \) -printf '%s %p\n'
          fi
