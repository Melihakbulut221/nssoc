name: Correctly scope completed cut10 native boot evidence
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  recover:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          filter: blob:none
          sparse-checkout: |
            scripts
            hw/soc/flow
      - run: gh api repos/${{ github.repository }}/actions/artifacts/14080163511/zip > native.zip
      - run: python3 scripts/review_cut10_completed_native_boot.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: cut10-corrected-native-boot-${{ github.run_id }}
          path: out/*.json
          if-no-files-found: error
          retention-days: 90
