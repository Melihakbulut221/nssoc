name: Full chip native transistor connectivity and SRAM width fault controls
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  controls:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        case: [inspect]
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/check_full_chip_native_faults.py
      - run: |
          set -euo pipefail
          gh api repos/${{ github.repository }}/actions/artifacts/14117582646/zip > native.zip
          python3 -m pip install klayout==0.30.13
      - run: python3 scripts/check_full_chip_native_faults.py ${{ matrix.case }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: full-chip-native-fault-${{ matrix.case }}-${{ github.run_id }}
          path: out/derived
          if-no-files-found: error
          retention-days: 90
