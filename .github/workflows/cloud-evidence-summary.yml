name: Identify residual109 hold endpoints after combined SRAM and feedback repair
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  extract:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: /scripts/derive_rx_hold_paths.py
      - run: python3 scripts/derive_rx_hold_paths.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: rx-combined-residual-hold-census-${{ github.run_id }}
          path: out/
          if-no-files-found: error
          retention-days: 90
