name: Resume detailed routing from a preserved full64 iteration snapshot with the original late-iteration schedule
on:
  workflow_dispatch:
    inputs:
      snapshot_iter: {type: string, default: '20'}
      iterations: {type: string, default: '3'}
      threads: {type: string, default: '4'}
      engine: {type: string, default: fixedguard}
      mode: {description: 'end_iter (restart schedule), steps (original late rows via step_dr), check (DRC and antenna only) antenna (diode repair then incremental route) or relayer (TopMetal2 guides of listed nets to Metal5, then incremental route)', type: string, default: steps}
      clip_add: {type: string, default: '6'}
      from_row: {type: string, default: '20'}
      budget_s: {type: string, default: '15000'}
      input_artifact: {description: 'optional artifact id of a previous routed.odb (overrides snapshot)', type: string, default: ''}
      unfix: {description: 'true: re-encode the nets in unfix-nets.txt from FIXED to ROUTED before routing', type: string, default: 'false'}
      unfix_clocks: {description: 'space-separated clock nets also allowed to be re-encoded', type: string, default: ''}
      antenna_mode: {description: 'repair_antennas flag: -jumper_only or -diode_only', type: string, default: '-diode_only'}
permissions:
  contents: read
  actions: read
jobs:
  drt-resume:
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    env:
      GH_TOKEN: ${{ github.token }}
      IMAGE: openroad/ubuntu24.04-dev@sha256:468fcd7f156dd350a648b0a3038ea16a5a25fde2e1b527f03d052108fea5ff3a
      ENGINE_PART: ${{ inputs.engine == 'fixedguard' && '687863984' || '706643321' }}
      ENGINE_SHA: ${{ inputs.engine == 'fixedguard' && '2a343c7491353a60e7b06aa134d4b67e3ef2e846a8341164dacffe88f5f7ec2f' || 'e12b1c70296c119c31ed5b1a7f739904d06b3c86cd703eebee25dbcc9c357431' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /step-schedule.txt
            /unfix_nets.py
            /unfix-nets.txt
            /net_wires.py
            /at_point.py
            /relayer_nets.py
            /relayer-nets.txt
      - name: Acquire engine and the starting database
        run: |
          set -euo pipefail
          W=/mnt/r; sudo mkdir -p $W/e $W/o; sudo chown -R $USER $W
          docker pull -q "$IMAGE"
          gh api repos/${{ github.repository }}/releases/assets/$ENGINE_PART -H "Accept: application/octet-stream" > $W/engine.tgz
          tar -xzf $W/engine.tgz -C $W/e
          E=$(find $W/e -type f -name openroad -exec sha256sum {} + | awk -v s=$ENGINE_SHA '$1==s{print $2}' | head -1); test -n "$E"
          mkdir -p $W/b; cp "$E" $W/b/openroad; chmod +x $W/b/openroad
          if [ -n "${{ inputs.input_artifact }}" ]; then
            gh api repos/${{ github.repository }}/actions/artifacts/${{ inputs.input_artifact }}/zip > $W/in.zip
            unzip -p $W/in.zip routed.odb > $W/o/start.odb; rm $W/in.zip
          else
            gh api repos/${{ github.repository }}/releases/assets/707566269 -H "Accept: application/octet-stream" > $W/parts.json
            for id in 707566395 707567241 707568207 707569294 707570169 707571252 707572038; do gh api repos/${{ github.repository }}/releases/assets/$id -H "Accept: application/octet-stream" >> $W/capsule.tgz; done
            python3 -c "import json,hashlib;p=json.load(open('$W/parts.json'));h=hashlib.file_digest(open('$W/capsule.tgz','rb'),'sha256').hexdigest();assert h==p['archive']['sha256'],h;print('capsule ok')"
            m=$(tar -tzf $W/capsule.tgz | grep -E "/drt_iter${{ inputs.snapshot_iter }}\.odb$"); echo "$m"
            tar -xzf $W/capsule.tgz -C $W "$m"; mv "$W/$m" $W/o/start.odb; rm $W/capsule.tgz
          fi
          sha256sum $W/o/start.odb; ls -l $W/o/start.odb
      - name: Check, route and check again with progress in the log
        run: |
          set -euo pipefail
          W=/mnt/r
          if [ "${{ inputs.unfix }}" = true ]; then
            cp unfix_nets.py unfix-nets.txt $W/o/
            docker run --rm -e NSSOC_UNFIX_CLOCKS="${{ inputs.unfix_clocks }}" -v $W:/v "$IMAGE" /v/b/openroad -no_init -exit -python /v/o/unfix_nets.py /v/o/start.odb /v/o/unfix-nets.txt /v/o/start-unfixed.odb /v/o/unfix-report.json 2>&1 | tail -20
            test -s $W/o/start-unfixed.odb; mv $W/o/start-unfixed.odb $W/o/start.odb
          fi
          printf 'read_db /v/o/start.odb\nset_thread_count 4\ndrt::check_drc -output_file /v/o/start.rpt -marker_name CHK\n' > $W/o/check0.tcl
          if [ "${{ inputs.mode }}" = check ]; then
            printf 'read_db /v/o/start.odb\nset_thread_count 4\ncheck_antennas -report_file /v/o/antenna.rpt -verbose\nputs "NSSOC_ANTENNA nets=[ant::antenna_violation_count]"\n' > $W/o/ant.tcl
            docker run --rm -v $W:/v "$IMAGE" bash -c "/v/b/openroad -no_init -exit /v/o/check0.tcl > /v/o/check0.log 2>&1; echo START_CHECK_DRC markers=\$(grep -c 'violation type' /v/o/start.rpt || true); /v/b/openroad -no_init -exit /v/o/ant.tcl 2>&1 | tee /v/o/ant.log | grep -E 'NSSOC_ANTENNA|Found|violat|ERROR' | tail -20"
            cp net_wires.py at_point.py $W/o/
            docker run --rm -v $W:/v "$IMAGE" /v/b/openroad -no_init -exit -python /v/o/at_point.py /v/o/start.odb 91.32 129.6 2>&1 | grep NSSOC_ | head -40
            docker run --rm -v $W:/v "$IMAGE" /v/b/openroad -no_init -exit -python /v/o/net_wires.py /v/o/start.odb /v/o/net-wires.json 2>&1 | grep -E "NSSOC_|Error" | head -30
            mkdir -p out && cp $W/o/*.log $W/o/*.rpt $W/o/*.json out/ 2>/dev/null || true
            exit 0
          fi
          if [ "${{ inputs.mode }}" = relayer ]; then
            cp relayer_nets.py relayer-nets.txt $W/o/
            docker run --rm -v $W:/v "$IMAGE" /v/b/openroad -no_init -exit -python /v/o/relayer_nets.py /v/o/start.odb /v/o/relayer-nets.txt /v/o/start-relayer.odb /v/o/relayer-report.json 2>&1 | grep -E "NSSOC|Error|refusing" | head
            test -s $W/o/start-relayer.odb; mv $W/o/start-relayer.odb $W/o/start.odb
            cat > $W/o/route.tcl <<'TCL'
          read_db /v/o/start.odb
          set_routing_layers -signal Metal2-TopMetal2 -clock Metal4-TopMetal2
          set_thread_count $::env(THREADS)
          detailed_route -droute_end_iter $::env(ITERS) -or_seed 42 -verbose 1
          write_db /v/o/routed.odb
          check_antennas -report_file /v/o/antenna-after.rpt -verbose
          TCL
          fi
          if [ "${{ inputs.mode }}" = antenna ]; then
            cat > $W/o/route.tcl <<'TCL'
          read_db /v/o/start.odb
          set_routing_layers -signal Metal2-TopMetal2 -clock Metal4-TopMetal2
          set_thread_count $::env(THREADS)
          check_antennas -report_file /v/o/antenna-before.rpt
          # The antenna wire builder treats a net whose net-level wire type is
          # FIXED as unrouted and fails to rebuild its existing wire (ANT-0016).
          # Mark those nets ROUTED for the repair only and restore them after.
          set marked {}
          foreach net [[ord::get_db_block] getNets] {
            if {[$net getWireType] == "FIXED" && [$net getWire] != "NULL"} {
              lappend marked $net
              $net setWireType ROUTED
            }
          }
          puts "NSSOC_ANTENNA_MARKED [llength $marked]"
          # repair_antennas names new diodes ANTENNA_0, ANTENNA_1, ... per session,
          # which collides with the diodes already in this database (dbInst::create
          # returns NULL and setDiodeLoc crashes). Park existing names, repair, move
          # the new diodes above the highest existing index, then restore the old names.
          set block [ord::get_db_block]
          set parked {}
          set top -1
          foreach inst [$block getInsts] {
            set n [$inst getName]
            if {[regexp {^ANTENNA_([0-9]+)$} $n -> k]} {
              lappend parked [list $inst $n]
              if {$k > $top} {set top $k}
              $inst rename "NSSOC_PARKED_$k"
            }
          }
          puts "NSSOC_ANTENNA_PARKED [llength $parked] top=$top"
          set inserted [repair_antennas $::env(ANTENNA_MODE)]
          puts "NSSOC_ANTENNA_REPAIR inserted=$inserted"
          set added 0
          foreach inst [$block getInsts] {
            if {[regexp {^ANTENNA_([0-9]+)$} [$inst getName] -> k]} {
              $inst rename "ANTENNA_[expr {$top + 1 + $k}]"
              incr added
            }
          }
          foreach p $parked { [lindex $p 0] rename [lindex $p 1] }
          # New diodes come without PG terminals bound; bind them logically (row rails
          # supply them physically) so the powered netlist and LVS see them.
          add_global_connection -net VPWR -inst_pattern {^ANTENNA_.*} -pin_pattern {^VDD$} -power
          add_global_connection -net VGND -inst_pattern {^ANTENNA_.*} -pin_pattern {^VSS$} -ground
          global_connect
          puts "NSSOC_ANTENNA_NEW_DIODES $added"
          if {$inserted} {
            detailed_route -droute_end_iter $::env(ITERS) -or_seed 42 -verbose 1
          }
          foreach net $marked { $net setWireType FIXED }
          write_db /v/o/routed.odb
          check_antennas -report_file /v/o/antenna-after.rpt -verbose
          TCL
          fi
          if [ "${{ inputs.mode }}" = steps ]; then
            cp step-schedule.txt $W/o/
            cat > $W/o/route.tcl <<'TCL'
          read_db /v/o/start.odb
          set_routing_layers -signal Metal2-TopMetal2 -clock Metal4-TopMetal2
          set_thread_count $::env(THREADS)
          detailed_route -single_step_dr -droute_end_iter 64 -or_seed 42 -verbose 1
          set t0 [clock seconds]
          set f [open /v/o/step-schedule.txt]
          while {[gets $f line] >= 0} {
            lassign $line row size offset maze drc marker fixed decay mode
            if {$row > 0 && $row < $::env(FROM_ROW)} continue
            if {$mode == 1} {set mode 3} else {set size [expr {$size + $::env(CLIP_ADD)}]}
            puts "NSSOC_STEP row=$row size=$size offset=$offset mode=$mode"
            drt::step_dr $size $offset $maze $drc $marker $fixed $decay $mode 0
            puts "NSSOC_STEP_DONE row=$row drvs=[drt::detailed_route_num_drvs] elapsed=[expr {[clock seconds]-$t0}]"
            if {($row > 0 && [drt::detailed_route_num_drvs] == 0) || [clock seconds]-$t0 > $::env(BUDGET_S)} break
          }
          close $f
          drt::step_end
          write_db /v/o/routed.odb
          TCL
          elif [ "${{ inputs.mode }}" = end_iter ]; then
            printf 'read_db /v/o/start.odb\nset_routing_layers -signal Metal2-TopMetal2 -clock Metal4-TopMetal2\nset_thread_count ${{ inputs.threads }}\ndetailed_route -droute_end_iter ${{ inputs.iterations }} -or_seed 42 -verbose 1 -output_drc /v/o/route.drc\nwrite_db /v/o/routed.odb\n' > $W/o/route.tcl
          fi
          printf 'read_db /v/o/routed.odb\nset_thread_count 4\ndrt::check_drc -output_file /v/o/end.rpt -marker_name CHK\n' > $W/o/check1.tcl
          cat > $W/o/run.sh <<'SH'
          set -e
          /v/b/openroad -no_init -exit /v/o/check0.tcl > /v/o/check0.log 2>&1 || echo CHECK0_FAILED
          echo "START_CHECK_DRC markers=$(grep -c 'violation type' /v/o/start.rpt || true)"
          ( /v/b/openroad -no_init -exit /v/o/route.tcl 2>&1 || echo ROUTE_FAILED ) | tee /v/o/route.log | grep --line-buffered -E "Start .* iteration|Number of violations|peak = |NSSOC_STEP|NSSOC_ANTENNA|ANT-000|ROUTE_FAILED|ERROR" || true
          /v/b/openroad -no_init -exit /v/o/check1.tcl > /v/o/check1.log 2>&1 || echo CHECK1_FAILED
          echo "END_CHECK_DRC markers=$(grep -c 'violation type' /v/o/end.rpt || true)"
          grep -o "violation type: [A-Za-z ]*" /v/o/end.rpt | sort | uniq -c || true
          SH
          docker run --rm -e ANTENNA_MODE=${{ inputs.antenna_mode }} -e ITERS=${{ inputs.iterations }} -e THREADS=${{ inputs.threads }} -e CLIP_ADD=${{ inputs.clip_add }} -e FROM_ROW=${{ inputs.from_row }} -e BUDGET_S=${{ inputs.budget_s }} -v $W:/v "$IMAGE" bash /v/o/run.sh
          mkdir -p out && cp $W/o/routed.odb $W/o/*.log $W/o/*.rpt $W/o/*.json out/ 2>/dev/null || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: drt-resume-${{ github.run_id }}
          path: out
          if-no-files-found: warn
          retention-days: 30
