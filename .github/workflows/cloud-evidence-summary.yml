name: Core-only provisional chip database assembly
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  repair:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      APPIMAGE_EXTRACT_AND_RUN: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Prepare pinned physical runtime
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libfuse2 tcl
          python3 scripts/qualify_core_only_timing_guards.py
          python3 scripts/qualify_core_only_postcts_handoff.py
          python3 -m py_compile scripts/cloud_core_only_chip_assembly.py scripts/assemble_core_only_chip_native.py
          python3 scripts/bootstrap_flow.py
          echo "CLOUD_APPIMAGE=$GITHUB_WORKSPACE/hw/soc/tools/physical/librelane-3.0.5-x86_64.AppImage" >> "$GITHUB_ENV"
      - name: Assemble current core boundary, mapped shell and native pads
        run: python3 scripts/cloud_core_only_chip_assembly.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: core-only-chip-assembly-native-${{ github.run_id }}
          path: hw/soc/out/core-only-chip-assembly/
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: core-only-chip-assembly-summary-${{ github.run_id }}
          path: hw/soc/out/core-only-chip-assembly/result.json
          if-no-files-found: error
          retention-days: 90
