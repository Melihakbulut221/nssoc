name: Replay interrupted Python group
on: workflow_dispatch
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        part: [failures, tail0, tail1, tail2, tail3, tail4, tail5, tail6, tail7]
    env:
      PDK_ROOT: ${{ github.workspace }}/hw/soc/tools/pdk
      INDEX: '1'
      PART: ${{ matrix.part }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: a58c2711c3d2fec6c88d2bdc74a8db45a932604d
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Prepare project interpreters, simulator, PDK and generated sources
        run: |
          make setup
          python scripts/bootstrap_oss.py
          echo "$PWD/hw/soc/tools/oss-cad-suite/bin" >> "$GITHUB_PATH"
          python -m pip install 'ciel==2.4.0'
          pin=c4b8b4e5e7a05f375cca3815d51b3a37721fbf5c
          ciel fetch --pdk-root "$PDK_ROOT" --pdk-family ihp-sg13g2 -l all "$pin"
          ciel enable --pdk-root "$PDK_ROOT" --pdk-family ihp-sg13g2 "$pin"
          make soc-prepare
      - name: Run a disjoint share of the complete collected test tree
        shell: bash
        run: |
          .venv/bin/python -m pytest --collect-only -q > "$RUNNER_TEMP/collected"
          .venv/bin/python - <<'PY'
          import hashlib, os, pathlib, subprocess
          temp = pathlib.Path(os.environ["RUNNER_TEMP"])
          nodes = [s for s in (temp/"collected").read_text().splitlines() if "::" in s and pathlib.Path(s.split("::",1)[0]).is_file()]
          assert nodes and len(nodes) == len(set(nodes))
          files = sorted({n.split("::",1)[0] for n in nodes})
          index = int(os.environ["INDEX"])
          assigned = files[index::12]
          mirror = "sw/tests/test_mirror_redaction_is_idempotent.py"
          assert assigned.count(mirror) == 1
          assert hashlib.sha256("\n".join(nodes).encode()).hexdigest() == "366d8ce1d519d595229b98fe4a8a8ecebff749607ccdf9d510e2b3f60a7c43b4"
          old = [n for f in assigned if f != mirror for n in nodes if n.split("::",1)[0] == f]
          part = os.environ["PART"]
          subset = [old[i] for i in [*range(11),220]] if part == "failures" else old[504+int(part[4:])::8]
          assert subset
          import shlex
          print("Assigned node IDs", *subset, sep="\n", flush=True)
          subprocess.run(["make","test","PYTEST_ARGS=-v --tb=line -rfs -o tmp_path_retention_policy=failed " + shlex.join(subset)], check=True)
          PY
