name: Compare baseline and rejected A-C buffer current screens
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: /scripts/diagnose_cdr_buffer_settling.py
      - run: python3 -m pip install numpy==2.3.3
      - name: Restore metadata and native samples only on cloud runner
        run: |
          set -euo pipefail
          gh api repos/${{ github.repository }}/actions/artifacts/14078587671/zip > native.zip
          gh api repos/${{ github.repository }}/actions/artifacts/14096157243/zip > bd10_lowz8_xor2.zip
          gh api repos/${{ github.repository }}/actions/artifacts/14103722468/zip > bd10_lowz8_xor2_acbuf15.zip
          gh api repos/${{ github.repository }}/actions/artifacts/14104256551/zip > bd10_lowz8_xor2_acbuf20.zip
      - run: python3 scripts/diagnose_cdr_buffer_settling.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: cdr-ac-buffer-settling-${{ github.run_id }}
          path: out/*.json
          if-no-files-found: error
          retention-days: 90
