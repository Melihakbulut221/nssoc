name: Derived zero-delay CVC alias model preflight against untouched Icarus
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: YosysHQ/setup-oss-cad-suite@aefa8397bbf8fc6670a0a62af9805a89738f3cde
        with:
          version: '2026-08-04'
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Build pinned compiler and acquire unchanged IHP models
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends build-essential zlib1g-dev
          git init cvc-source
          git -C cvc-source remote add origin https://github.com/cambridgehackers/open-src-cvc.git
          git -C cvc-source fetch --depth=1 origin 1c5e043ec33ef6f1fdbf38565501c944893a83cf
          git -C cvc-source checkout --detach FETCH_HEAD
          test "$(git -C cvc-source rev-parse HEAD)" = 1c5e043ec33ef6f1fdbf38565501c944893a83cf
          make -C cvc-source/src -j2 cvc64 > cvc-build.log 2>&1
          python3 hw/soc/flow/prepare_ihp_native_boot.py
      - name: Strict native reset data and X propagation probes plus mutations
        run: python3 scripts/probe_native_cvc.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: cvc-functional-alias-preflight-${{ github.run_id }}
          path: |
            cvc-probe/**/*.json
            cvc-probe/**/*.log
            cvc-probe/**/*.v
            cvc-build.log
            cvc-source/OSS-CVC-MODIFIED-ARTISTIC-LIC.TXT
            cvc-source/CHANGES.md
          retention-days: 90
          if-no-files-found: error
