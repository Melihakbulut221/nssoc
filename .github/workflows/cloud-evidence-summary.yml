name: Diagnose failed guide worker engine compilation
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/cloud_mainchip_guide_build_diagnosis.py
      - name: Authenticate entire failed build archive in cloud and retain complete text logs
        run: python3 -B scripts/cloud_mainchip_guide_build_diagnosis.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: engine-build-derived-${{ github.run_id }}
          path: engine-build-derived
          if-no-files-found: error
          retention-days: 90
