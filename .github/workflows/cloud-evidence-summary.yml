name: Combine measured setup and hold repairs on one exact native candidate
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  measure:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      APPIMAGE_EXTRACT_AND_RUN: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify report output contract before provisioning CAD
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path
          driver=Path("scripts/run_combined_nearzero_repair.py").read_text()
          flow=Path("hw/soc/pnr/combined_nearzero_repair_flow.py").read_text()
          assert 'OUT=ROOT/"combined-nearzero-repair";OUT.mkdir()' in driver
          assert 'combined-nearzero-repair/targets.json' in flow
          PYCODE
      - name: Prepare pinned runtime
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libfuse2
          python3 scripts/bootstrap_flow.py
          echo "CLOUD_APPIMAGE=$GITHUB_WORKSPACE/hw/soc/tools/physical/librelane-3.0.5-x86_64.AppImage" >> "$GITHUB_ENV"
      - name: Exact measured output branches and global STA
        run: python3 scripts/run_combined_nearzero_repair.py
      - name: Collect derived reports
        if: always()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import shutil
          root=Path("combined-nearzero-repair");out=Path("combined-nearzero-repair-derived")
          for p in root.rglob("*"):
              rel=p.relative_to(root)
              if p.is_file() and (str(rel) in ("result.json","native.log") or (rel.parts[0]=="run" and p.suffix in (".rpt",".json"))):
                  q=out/rel;q.parent.mkdir(parents=True,exist_ok=True);shutil.copyfile(p,q)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: rx-lane-combined-nearzero-repair-derived-${{ github.run_id }}
          path: combined-nearzero-repair-derived/
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: rx-lane-combined-nearzero-repair-native-${{ github.run_id }}
          path: combined-nearzero-repair/run/
          if-no-files-found: error
          retention-days: 90
