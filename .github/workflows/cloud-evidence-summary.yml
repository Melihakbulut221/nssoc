name: Native VVP cross-runner checkpoint equivalence capability
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  dump:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: /scripts/check_native_vvp_checkpoint.py
      - run: sudo apt-get update -qq && sudo apt-get install -y criu iverilog
      - run: python3 -u scripts/check_native_vvp_checkpoint.py dump
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: vvp-checkpoint-dump-result
          path: out/dump-result.json
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: vvp-checkpoint-native
          path: checkpoint.tgz
          if-no-files-found: error
  restore:
    needs: dump
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: /scripts/check_native_vvp_checkpoint.py
      - run: sudo apt-get update -qq && sudo apt-get install -y criu iverilog
      - run: |
          gh run download "$GITHUB_RUN_ID" -n vvp-checkpoint-native -D .
          gh run download "$GITHUB_RUN_ID" -n vvp-checkpoint-dump-result -D .
          python3 -u scripts/check_native_vvp_checkpoint.py restore
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: vvp-checkpoint-restore-result
          path: out/restore-result.json
          if-no-files-found: error
