{
  "name": "Fresh final RX6 antenna audit without repair",
  "on": {
    "workflow_dispatch": {}
  },
  "permissions": {
    "contents": "read",
    "actions": "read"
  },
  "jobs": {
    "audit": {
      "runs-on": "ubuntu-22.04",
      "timeout-minutes": 90,
      "env": {
        "GH_TOKEN": "${{ github.token }}",
        "APPIMAGE_SHA": "d6a349ec65be11456e96c4981d35f63ca34d3c85daf79a51e1ccb907bb5d7466",
        "PACKAGE_SHA": "822dab7067d901fa79dabffffff784baf5c9965f0a5091eba67acdc48b9956f4",
        "APPIMAGE_EXTRACT_AND_RUN": "1"
      },
      "steps": [
        {
          "uses": "actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683",
          "with": {
            "persist-credentials": false
          }
        },
        {
          "name": "Restore pinned tools and PDK",
          "run": "set -euo pipefail\nsudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends libfuse2 || echo \"Using AppImage extract-and-run fallback\"\nW=/mnt/s; sudo mkdir -p $W; sudo chown $USER $W\ncurl -fsSL --retry 5 -o $W/librelane.AppImage https://github.com/librelane/librelane/releases/download/3.0.5/librelane-devshell-x86_64.AppImage\necho \"$APPIMAGE_SHA  $W/librelane.AppImage\" | sha256sum -c -; chmod +x $W/librelane.AppImage\nfor attempt in 1 2 3 4 5 6; do\n  gh api repos/${{ github.repository }}/releases/assets/663146895 -H \"Accept: application/octet-stream\" > $W/pkg.tgz && echo \"$PACKAGE_SHA  $W/pkg.tgz\" | sha256sum -c - && break\n  sleep 60\ndone\necho \"$PACKAGE_SHA  $W/pkg.tgz\" | sha256sum -c -\nmkdir -p $W/pkg && tar -xzf $W/pkg.tgz -C $W/pkg && rm $W/pkg.tgz\nP=$(dirname \"$(find $W/pkg -name input-contract.json | head -1)\")\npython3 - \"$P\" <<'PY'\nimport hashlib,json,shutil,sys\nfrom pathlib import Path\np=Path(sys.argv[1]);c=json.loads((p/'input-contract.json').read_text());n=0\nfor name,row in c['input_files'].items():\n    if not name.startswith('hw/soc/tools/'):continue\n    src=p/'files'/name;dst=Path(name)\n    assert hashlib.sha256(src.read_bytes()).hexdigest()==row['sha256']\n    if not dst.exists():dst.parent.mkdir(parents=True,exist_ok=True);shutil.copyfile(src,dst);n+=1\nprint('restored PDK and tool files',n)\nPY\nrm -rf $W/pkg\n"
        },
        {
          "name": "Recompute final antenna counts without repair",
          "run": "set -euo pipefail\nW=/mnt/s; OUT=$PWD/hw/soc/out/impl-probe\nmkdir -p $W/h\ngh api repos/${{ github.repository }}/actions/artifacts/14105679819/zip > $W/h/routed.zip\necho '623d7be7b8438522b6b0f81fdec45801006997892ec07953b4687ed88b53d85a  /mnt/s/h/routed.zip' | sha256sum -c -\nunzip -q $W/h/routed.zip -d $W/h\ntar -xzf $W/h/routed.tgz -C /\nrm -rf $W/h\npython3 - <<'PYPREP'\nimport json,pathlib\np=pathlib.Path('hw/soc/out/impl-probe');s=json.loads((p/'routed-state.json').read_text())\nassert s['metrics']['antenna__violating__nets']==1\nassert s['metrics']['antenna__violating__pins']==2\nassert s['metrics']['route__drc_errors']==0\ns['metrics']={}\n(p/'fresh-antenna-state.json').write_text(json.dumps(s,indent=2))\nPYPREP\nmkdir -p out\nset +e\ntimeout 3600 env -u GH_TOKEN -u GITHUB_TOKEN $W/librelane.AppImage python hw/soc/pnr/final_rx6_antenna_audit_flow.py --flow FinalAntennaAudit --pdk-root $PWD/hw/soc/tools/ciel-corrpre --pdk ihp-sg13g2 --scl sg13g2_stdcell --force-run-dir $OUT/final-ant --with-initial-state $OUT/fresh-antenna-state.json $OUT/prepared/config-routed.json > out/check.log 2>&1\nrc=$?\nset -e\ntail -60 out/check.log\nexit $rc\n"
        },
        {
          "name": "Collect derived reports only",
          "if": "always()",
          "run": "mkdir -p out\npython3 - <<'PYCOL'\nfrom pathlib import Path\nimport shutil\np=Path('hw/soc/out/impl-probe/final-ant')\nfor pattern in ['*/fresh-check-proof.json','*/state_out.json','*/reports/antenna.rpt','*/reports/antenna_summary.rpt','*/*.log']:\n for src in p.glob(pattern):\n  dst=Path('out')/src.relative_to(p);dst.parent.mkdir(parents=True,exist_ok=True);shutil.copyfile(src,dst)\nPYCOL\n"
        },
        {
          "uses": "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02",
          "if": "always()",
          "with": {
            "name": "rx6-final-antenna-derived-${{ github.run_id }}",
            "path": "out",
            "retention-days": 30
          }
        }
      ]
    }
  }
}
