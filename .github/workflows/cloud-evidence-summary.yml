name: Verify six-buffer extraction imports and diode rebinding
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python3 scripts/test_regression_antenna_rebinding.py
      - run: |
          python3 -m py_compile scripts/cloud_core_only_regression_antenna_extraction.py scripts/cloud_core_only_critical_clean_extraction_base.py
          PYTHONPATH=scripts python3 -c "import cloud_core_only_regression_antenna_extraction as m; assert m.RUN == 44545302944; assert m.flow.EXPECTED_INSTANCES == 106664"
