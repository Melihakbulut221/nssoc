name: Matched upstream pad native transistor LVS
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-22.04
    timeout-minutes: 75
    env:
      APPIMAGE_EXTRACT_AND_RUN: '1'
      QT_QPA_PLATFORM: offscreen
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Prepare pinned native runtime
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libfuse2
          python3 scripts/bootstrap_flow.py
          echo "CLOUD_APPIMAGE=$GITHUB_WORKSPACE/hw/soc/tools/physical/librelane-3.0.5-x86_64.AppImage" >> "$GITHUB_ENV"
      - name: Verify isolated official inverter in deep and flat modes with strict controls
        run: python3 scripts/cloud_core_only_upstream_inverter_lvs.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: core-only-upstream-inverter-lvs-${{ github.run_id }}
          path: hw/soc/out/core-only-upstream-inverter-lvs/
          if-no-files-found: error
          retention-days: 90
