name: Compact650 fresh MIM aware native RC
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  extract:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ github.token }}
      APPROVED_SOURCE: ${{ github.sha }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends tcl8.6 tk8.6 libx11-6 libxext6 libxrender1 libxt6 libcairo2 libglu1-mesa libgl1
          python3 -m pip install --disable-pip-version-check --no-cache-dir numpy==2.3.3 klayout==0.30.4.post1 networkx==3.5
      - run: python3 -B scripts/extract_current_select650_mim_rc.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: select650-current-mim-rc-${{ github.run_id }}
          path: |
            mos650-metal-rc/derived/
            mos650-metal-rc/native/mim-precise/
            mos650-metal-rc/native/mim-precise_reversed/
            !mos650-metal-rc/native/**/magic-cloud/
          if-no-files-found: error
          retention-days: 90
