name: Recover independent SRAM schematic reference in cloud
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reference:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          filter: blob:none
          sparse-checkout: scripts
      - run: python3 -u scripts/recover_sram_reference.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: sram-reference-derived-${{ github.run_id }}
          path: out
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: sram-reference-native-${{ github.run_id }}
          path: native/reference.spice
          if-no-files-found: warn
          retention-days: 90
