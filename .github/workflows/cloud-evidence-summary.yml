name: CDR sampler and phase-detector topology diagnosis
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  divider-whatif:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      ARTIFACT_ID: '13283214752'
      ARTIFACT_SHA256: ac342f4945a262a4c0fb2440634aa600b8d3f07c6c257c9d3d6e648a319b2402
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/cdr_netlist_neighbourhood.py
            /scripts/cdr_stage_topology.py
      - name: Compile the diagnostic before native download
        run: python3 -m py_compile scripts/cdr_stage_topology.py scripts/cdr_netlist_neighbourhood.py
      - name: Restore the preserved N1 native tree at its original absolute path
        run: |
          set -euo pipefail
          W=/mnt/n1; sudo mkdir -p $W; sudo chown $USER $W
          gh api repos/${{ github.repository }}/actions/artifacts/$ARTIFACT_ID/zip > $W/n1.zip
          echo "$ARTIFACT_SHA256  $W/n1.zip" | sha256sum -c -
          mkdir -p mos650-gate-ac
          unzip -q $W/n1.zip -d mos650-gate-ac -x '*/wave.raw' '*/producer-*' '*/composition-n2/*' '*/composition-n4/*' '*/composition-n8/*' '*/composition-n16/*'
          rm $W/n1.zip
          ls mos650-gate-ac mos650-gate-ac/native mos650-gate-ac/native/loaded-n1-nominal_late
          grep -n "^\.lib\|^\.include\|pre_osdi" mos650-gate-ac/native/loaded-n1-nominal_late/bench.cir
      - name: Derive primitive connectivity and original measurement binding
        run: python3 -B scripts/cdr_stage_topology.py mos650-gate-ac out
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: cdr-stage-topology-${{ github.run_id }}
          path: out/*.json
          if-no-files-found: error
          retention-days: 90
