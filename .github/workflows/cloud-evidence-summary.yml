# SPDX-License-Identifier: Apache-2.0
name: cloud-evidence-summary
on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [controls, analysis]
        default: controls
        required: true
      approved_source:
        description: Exact reviewed source for derived-text analysis only
        type: string
        required: false
permissions:
  contents: read
env:
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  source-controls:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/workflows/cloud-evidence-summary.yml
            /scripts/mainchip_terminal_readback.py
            /scripts/check_mainchip_terminal_readback.py
            /scripts/mainchip_drt_report_analysis.py
            /scripts/check_mainchip_drt_report_analysis.py
            /scripts/mainchip-drt-report-analysis-inputs.json
            /scripts/mainchip-drt-report-analysis-source.json
            /docs/mainchip-drt-text-analysis-20261031.md
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python3 -B scripts/mainchip_drt_report_analysis.py --controls
      - run: python3 -B scripts/check_mainchip_terminal_readback.py
      - run: python3 -B scripts/check_mainchip_drt_report_analysis.py
  analysis:
    needs: source-controls
    if: ${{ inputs.mode == 'analysis' && inputs.approved_source == github.sha }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      MODE: ${{ inputs.mode }}
      APPROVED_SOURCE: ${{ inputs.approved_source }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/workflows/cloud-evidence-summary.yml
            /scripts/mainchip_terminal_readback.py
            /scripts/check_mainchip_terminal_readback.py
            /scripts/mainchip_drt_report_analysis.py
            /scripts/check_mainchip_drt_report_analysis.py
            /scripts/mainchip-drt-report-analysis-inputs.json
            /scripts/mainchip-drt-report-analysis-source.json
            /docs/mainchip-drt-text-analysis-20261031.md
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Read only four authenticated derived text inputs and classify exact records
        run: python3 -B scripts/mainchip_drt_report_analysis.py > drt-analysis-worker.stdout 2> drt-analysis-worker.stderr
      - name: Preserve complete derived output or failure and worker logs
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mainchip-drt-analysis-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            drt-report-analysis/
            drt-analysis-worker.stdout
            drt-analysis-worker.stderr
          compression-level: 6
          if-no-files-found: error
          retention-days: 90
