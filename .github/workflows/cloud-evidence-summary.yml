name: Inspect exact packed comparator shared-net metal geometry
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: /scripts/inspect_packed_shared_geometry.py
      - run: python3 -m pip install --disable-pip-version-check --no-cache-dir klayout==0.30.4.post1
      - run: python3 scripts/inspect_packed_shared_geometry.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: packed650-shared-geometry-${{ github.run_id }}
          path: out/
          if-no-files-found: error
          retention-days: 90
