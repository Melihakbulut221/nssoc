name: Native full chip transistor reference reader qualification
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  reader:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/check_chip_reference_native.rb
            /scripts/qualify_chip_reference_native.py
      - name: Restore frozen native reader and reference only on cloud runner
        run: |
          set -euo pipefail
          gh api repos/${{ github.repository }}/actions/artifacts/14114996311/zip > macro.zip
          gh api repos/${{ github.repository }}/actions/artifacts/14114621580/zip > sp-macro.zip
          gh api repos/${{ github.repository }}/actions/artifacts/14115684311/zip > reference.zip
          curl -fL --retry 5 https://www.klayout.org/downloads/Ubuntu-24/klayout_0.30.13-1_amd64.deb -o /tmp/klayout.deb
          echo '0bb6b913fd6a32581d50b08be744b522a2a477baa1ed7e253c97cc18ce248a24  /tmp/klayout.deb' | sha256sum -c -
          sudo apt-get update -qq
          sudo apt-get install -y /tmp/klayout.deb
      - name: Read full independent schematic with frozen LVS reader
        run: python3 scripts/qualify_chip_reference_native.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: native-reference-reader-derived-${{ github.run_id }}
          path: out/derived
          if-no-files-found: error
          retention-days: 90
