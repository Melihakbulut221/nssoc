name: Replay CRC select actual RTL equivalence and semantic mutation rejection
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prove:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts
            hw/soc/rtl/pcie
      - uses: YosysHQ/setup-oss-cad-suite@aefa8397bbf8fc6670a0a62af9805a89738f3cde
        with:
          version: '2026-08-04'
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Record supported Yosys runtime
        run: yosys -V
      - name: Prove real replay state and outputs without blackboxes
        run: python3 scripts/prove_replay_crc_select.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: replay-crc-select-equivalence-${{ github.run_id }}
          path: |
            out/*.log
            out/*.ys
            out/*.json
          retention-days: 30
