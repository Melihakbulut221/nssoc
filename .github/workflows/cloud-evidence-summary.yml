name: Independent archived SRAM RC connectivity and capacitance conservation
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          filter: blob:none
          sparse-checkout: |
            scripts
            hw/soc/flow
      - run: python3 -m pip install klayout==0.30.13
      - name: Provision bounded swap for native full-macro graph audit
        run: |
          set -euo pipefail
          available=$(df -B1 --output=avail /mnt | tail -1 | tr -d ' ')
          test "$available" -gt 34359738368
          sudo fallocate -l 16G /mnt/nssoc-rc-audit.swap
          sudo chmod 600 /mnt/nssoc-rc-audit.swap
          sudo mkswap /mnt/nssoc-rc-audit.swap
          sudo swapon /mnt/nssoc-rc-audit.swap
      - name: Restore exact native archives in cloud only
        run: |
          set -euo pipefail
          gh api repos/${{ github.repository }}/actions/artifacts/14082854262/zip > cc.zip
          gh api repos/${{ github.repository }}/actions/artifacts/14069436539/zip > reference.zip
          gh api repos/${{ github.repository }}/actions/artifacts/14099637041/zip > rc.zip
      - run: python3 scripts/audit_sram_kpex09_full_rc_reference.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: independent-full-sram-rc-${{ github.run_id }}
          path: out/*.json
          if-no-files-found: error
          retention-days: 90
