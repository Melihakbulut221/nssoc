name: Measure equivalent OR4 resize on residual replay input path
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  repair:
    runs-on: ubuntu-22.04
    timeout-minutes: 95
    env:
      GH_TOKEN: ${{ github.token }}
      APPIMAGE_EXTRACT_AND_RUN: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: /scripts/measure_eop_input_eco.py
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Prepare pinned runtime
        run: |
          set -euo pipefail
          sudo mkdir -p /mnt/s
          sudo chown "$USER" /mnt/s
          curl -fsSL --retry 5 -o /mnt/s/librelane.AppImage https://github.com/librelane/librelane/releases/download/3.0.5/librelane-devshell-x86_64.AppImage
          echo 'd6a349ec65be11456e96c4981d35f63ca34d3c85daf79a51e1ccb907bb5d7466  /mnt/s/librelane.AppImage' | sha256sum -c -
          chmod +x /mnt/s/librelane.AppImage
      - name: Measure original and equivalent OR4 resized databases in three corners
        run: python3 scripts/measure_eop_input_eco.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: eop-input-or4-eco-derived-${{ github.run_id }}
          path: |
            out/*.json
            out/control/*.log
            out/control/*.rpt
            out/or4_2/*.log
            out/or4_2/*.rpt
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: eop-input-or4-eco-native-${{ github.run_id }}
          path: out/native/
          if-no-files-found: error
          retention-days: 90
