name: Authenticate compact staging timing evidence
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  summary:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: python3 scripts/summarize_staging_timing.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dllp-nor-timing-compact-${{ github.run_id }}
          path: compact/
          if-no-files-found: error
          retention-days: 90
