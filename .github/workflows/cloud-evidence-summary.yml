name: Current-parent actual MOS geometry and native mapping
on:
  workflow_dispatch:
    inputs:
      approved_source:
        description: Exact reviewed source SHA
        type: string
        required: true
permissions:
  contents: read
  actions: read
concurrency:
  group: current-domain-geometry-${{ github.ref }}
  cancel-in-progress: false
env:
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  native-geometry:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      APPROVED_SOURCE: ${{ inputs.approved_source }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/cdr-current-domain-geometry-methods.json
      - name: Materialize exact geometry source closure
        run: |
          python3 -B - <<'PY'
          import json,subprocess
          from pathlib import Path
          m='scripts/cdr-current-domain-geometry-methods.json'
          names=sorted(set(json.loads(Path(m).read_bytes())['files'])|{m})
          assert all(not n.startswith('/')and '..'not in Path(n).parts for n in names)
          subprocess.run(['git','sparse-checkout','set','--no-cone','--stdin'],input=''.join('/'+n+'\n'for n in names),text=True,check=True)
          PY
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python3 -m pip install --disable-pip-version-check --no-cache-dir klayout==0.30.4.post1
      - name: Authenticate actual current GDS and map all50 MOS native terminals
        run: python3 -B scripts/cdr_current_domain_geometry.py --execute
      - name: Preserve complete geometry inspection success or failure
        if: always()
        run: python3 -B scripts/cdr_current_domain_geometry.py --publish
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: current-domain-geometry-derived-${{ github.run_id }}
          path: cloud-domain-geometry/derived
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: current-domain-geometry-native-${{ github.run_id }}
          path: |
            cloud-domain-geometry
            domain-geometry-publication
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 90
