name: Extract exact mapped CSR register and retirement net names
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: python3 scripts/restore_predecode_chip_boot.py
      - run: python3 scripts/inventory_mapped_boot_signals.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: mapped-observer-inventory-${{ github.run_id }}
          path: observer-inventory/
          if-no-files-found: error
          retention-days: 90
