name: Inspect stopped five driver route recovery files
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/inspect_five_driver_route_recovery.py
      - run: python3 scripts/inspect_five_driver_route_recovery.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: five-driver-recovery-inventory-${{ github.run_id }}
          path: out/*.json
          if-no-files-found: error
          retention-days: 90
