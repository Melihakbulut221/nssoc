name: Native boot scope and failure-verdict controls
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scope-controls:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python3 -m pip install -r sw/requirements.txt
      - name: Existing native boot guards and scope-negative controls
        run: python3 -m pytest -q -rA sw/tests/test_logic_boot_gl.py --junitxml=scope-controls.xml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: native-boot-scope-controls-${{ github.run_id }}
          path: scope-controls.xml
          if-no-files-found: error
