name: Native diode DC boundary diagnostics
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  probe:
    runs-on: ubuntu-22.04
    container: debian:trixie
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Install native runtime dependencies
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends ca-certificates git gh python3 libreadline-dev libsuitesparse-dev libfftw3-dev
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Sample stock and derivative candidate around native branch boundary
        run: python3 scripts/cloud_native_diode_dc_boundary.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: native-diode-dc-boundary-${{ github.run_id }}
          path: hw/soc/out/native-diode-dc-boundary/
          if-no-files-found: error
          retention-days: 90
