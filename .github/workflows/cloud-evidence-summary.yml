name: Resume detailed routing from a preserved full64 iteration snapshot
on:
  workflow_dispatch:
    inputs:
      snapshot_iter: {type: string, default: '20'}
      iterations: {type: string, default: '3'}
      threads: {type: string, default: '4'}
      engine: {type: string, default: fixedguard}
      input_artifact: {description: 'optional artifact id of a previous routed.odb (overrides snapshot)', type: string, default: ''}
permissions:
  contents: read
  actions: read
jobs:
  drt-resume:
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    env:
      GH_TOKEN: ${{ github.token }}
      IMAGE: openroad/ubuntu24.04-dev@sha256:468fcd7f156dd350a648b0a3038ea16a5a25fde2e1b527f03d052108fea5ff3a
      ENGINE_PART: ${{ inputs.engine == 'fixedguard' && '687863984' || '706643321' }}
      ENGINE_SHA: ${{ inputs.engine == 'fixedguard' && '2a343c7491353a60e7b06aa134d4b67e3ef2e846a8341164dacffe88f5f7ec2f' || 'e12b1c70296c119c31ed5b1a7f739904d06b3c86cd703eebee25dbcc9c357431' }}
    steps:
      - name: Acquire engine and the starting database
        run: |
          set -euo pipefail
          W=/mnt/r; sudo mkdir -p $W/e $W/o; sudo chown -R $USER $W
          docker pull -q "$IMAGE"
          gh api repos/${{ github.repository }}/releases/assets/$ENGINE_PART -H "Accept: application/octet-stream" > $W/engine.tgz
          tar -xzf $W/engine.tgz -C $W/e
          E=$(find $W/e -type f -name openroad -exec sha256sum {} + | awk -v s=$ENGINE_SHA '$1==s{print $2}' | head -1); test -n "$E"
          mkdir -p $W/b; cp "$E" $W/b/openroad; chmod +x $W/b/openroad
          if [ -n "${{ inputs.input_artifact }}" ]; then
            gh api repos/${{ github.repository }}/actions/artifacts/${{ inputs.input_artifact }}/zip > $W/in.zip
            unzip -p $W/in.zip routed.odb > $W/o/start.odb; rm $W/in.zip
          else
            gh api repos/${{ github.repository }}/releases/assets/707566269 -H "Accept: application/octet-stream" > $W/parts.json
            for id in 707566395 707567241 707568207 707569294 707570169 707571252 707572038; do gh api repos/${{ github.repository }}/releases/assets/$id -H "Accept: application/octet-stream" >> $W/capsule.tgz; done
            python3 -c "import json,hashlib;p=json.load(open('$W/parts.json'));h=hashlib.file_digest(open('$W/capsule.tgz','rb'),'sha256').hexdigest();assert h==p['archive']['sha256'],h;print('capsule ok')"
            m=$(tar -tzf $W/capsule.tgz | grep -E "/drt_iter${{ inputs.snapshot_iter }}\.odb$"); echo "$m"
            tar -xzf $W/capsule.tgz -C $W "$m"; mv "$W/$m" $W/o/start.odb; rm $W/capsule.tgz
          fi
          sha256sum $W/o/start.odb; ls -l $W/o/start.odb
      - name: Check, route and check again with progress in the log
        run: |
          set -euo pipefail
          W=/mnt/r
          printf 'read_db /v/o/start.odb\nset_thread_count 4\ndrt::check_drc -output_file /v/o/start.rpt -marker_name CHK\n' > $W/o/check0.tcl
          printf 'read_db /v/o/start.odb\nset_routing_layers -signal Metal2-TopMetal2 -clock Metal4-TopMetal2\nset_thread_count ${{ inputs.threads }}\ndetailed_route -droute_end_iter ${{ inputs.iterations }} -or_seed 42 -verbose 1 -output_drc /v/o/route.drc\nwrite_db /v/o/routed.odb\n' > $W/o/route.tcl
          printf 'read_db /v/o/routed.odb\nset_thread_count 4\ndrt::check_drc -output_file /v/o/end.rpt -marker_name CHK\n' > $W/o/check1.tcl
          cat > $W/o/run.sh <<'SH'
          set -e
          /v/b/openroad -no_init -exit /v/o/check0.tcl > /v/o/check0.log 2>&1 || echo CHECK0_FAILED
          echo "START_CHECK_DRC markers=$(grep -c 'violation type' /v/o/start.rpt || true)"
          ( /v/b/openroad -no_init -exit /v/o/route.tcl 2>&1 || echo ROUTE_FAILED ) | tee /v/o/route.log | grep --line-buffered -E "Start .* iteration|Number of violations|peak = |ROUTE_FAILED|ERROR" || true
          /v/b/openroad -no_init -exit /v/o/check1.tcl > /v/o/check1.log 2>&1 || echo CHECK1_FAILED
          echo "END_CHECK_DRC markers=$(grep -c 'violation type' /v/o/end.rpt || true)"
          grep -o "violation type: [A-Za-z ]*" /v/o/end.rpt | sort | uniq -c || true
          SH
          docker run --rm -v $W:/v "$IMAGE" bash /v/o/run.sh
          mkdir -p out && cp $W/o/routed.odb $W/o/*.log $W/o/*.rpt out/ 2>/dev/null || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: drt-resume-${{ github.run_id }}
          path: out
          if-no-files-found: warn
          retention-days: 30
