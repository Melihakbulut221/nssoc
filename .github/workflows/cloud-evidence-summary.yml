name: Pinned PLL simulator solver capability diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  capability:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: /scripts/inspect_pll_solver_capability.py
      - name: Restore exact existing runtime
        run: |
          set -euo pipefail
          gh api repos/${{ github.repository }}/releases/assets/650315768 -H 'Accept: application/octet-stream' > runtime.tgz
          echo 'cd993e4d1eb02f900488450bb1ac3880c67a5e5c34fbac06565c7db85667a821  runtime.tgz' | sha256sum -c -
          mkdir rt
          tar -xzf runtime.tgz -C rt
          E=$(find rt -type f -name patched-ngspice | head -1)
          test -n "$E"
          cp "$E" engine
          chmod +x engine
          python3 scripts/inspect_pll_solver_capability.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: pll-solver-capability-derived-${{ github.run_id }}
          path: out/*.json
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: pll-solver-capability-native-${{ github.run_id }}
          path: native
          if-no-files-found: error
          retention-days: 30
