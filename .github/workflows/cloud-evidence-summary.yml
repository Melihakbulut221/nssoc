name: Extract fresh paired650 MIM-aware RC with both native orders
on:
  workflow_dispatch:
    inputs:
      execute:
        type: boolean
        default: false
      approved_source:
        type: string
        required: true
permissions:
  contents: read
  actions: read
concurrency:
  group: cdr-mos650-mim-rc-${{ github.ref }}
  cancel-in-progress: false
env:
  PYTHONDONTWRITEBYTECODE: '1'
  APPROVED_SOURCE: ${{ inputs.approved_source }}
jobs:
  source-controls:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: /scripts/cdr-mos650-metal-rc-pins.json
      - name: Materialize exact source closure
        run: |
          python3 -B - <<'PY'
          import json,subprocess
          from pathlib import Path
          m='scripts/cdr-mos650-metal-rc-pins.json'
          names=sorted(set(json.loads(Path(m).read_bytes())['files'])|{m})
          assert all(not n.startswith('/')and '..'not in Path(n).parts and not any(c in n for c in '*?[!\\\n\r')for n in names)
          subprocess.run(['git','sparse-checkout','set','--no-cone','--stdin'],input=''.join('/'+n+'\n'for n in names),text=True,check=True)
          PY
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify exact frozen numerical methods and observed650 topology census
        run: python3 -B scripts/cdr_mos650_metal_rc.py --controls
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: mos650-controls-${{ github.run_id }}
          path: mos650-metal-rc/derived
          if-no-files-found: error
          retention-days: 90
  native-metal-rc:
    if: ${{ inputs.execute }}
    needs: source-controls
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: /scripts/cdr-mos650-metal-rc-pins.json
      - name: Materialize exact source closure
        run: |
          python3 -B - <<'PY'
          import json,subprocess
          from pathlib import Path
          m='scripts/cdr-mos650-metal-rc-pins.json'
          names=sorted(set(json.loads(Path(m).read_bytes())['files'])|{m})
          assert all(not n.startswith('/')and '..'not in Path(n).parts and not any(c in n for c in '*?[!\\\n\r')for n in names)
          subprocess.run(['git','sparse-checkout','set','--no-cone','--stdin'],input=''.join('/'+n+'\n'for n in names),text=True,check=True)
          PY
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install pinned numerical audit library
        run: python3 -m pip install --disable-pip-version-check --no-cache-dir networkx==3.5 klayout==0.30.4.post1
      - name: Install native Tcl and Magic runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y tcl8.6 tk8.6 libreadline-dev libx11-dev libxext-dev libxpm-dev libxt-dev libcairo2-dev libgl1-mesa-dev libglu1-mesa-dev
      - name: Extract actual MIM geometry RC in both native orders and reject raw faults
        id: native
        run: python3 -B scripts/cdr_mos650_metal_rc.py --extract
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: paired650-metal-rc-derived-${{ github.run_id }}
          path: mos650-metal-rc/derived
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: paired650-metal-rc-native-${{ github.run_id }}
          path: |
            mos650-metal-rc
            paired-terminal-anchors
          if-no-files-found: warn
          retention-days: 90
