name: Section difference of handoff before and restored snapshots
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  snapshot-diff:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      ARTIFACT_ID: '13300276627'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: /scripts/handoff_snapshot_diff.py
      - name: Fetch handoff workspace of handoff run
        run: |
          set -euo pipefail
          W=/mnt/h; sudo mkdir -p $W; sudo chown $USER $W
          gh api repos/${{ github.repository }}/actions/artifacts/$ARTIFACT_ID/zip > $W/w.zip
          sha256sum $W/w.zip
          unzip -Z1 $W/w.zip > $W/members.txt; wc -l $W/members.txt
          grep -E "handoff-topology-(before|after)\.json$" $W/members.txt
          unzip -q $W/w.zip -d $W/x $(grep -E "handoff-topology-(before|after)\.json$" $W/members.txt)
      - name: Diff every snapshot section except nets
        run: |
          mkdir -p diff
          python3 -B scripts/handoff_snapshot_diff.py /mnt/h/x diff/handoff-snapshot-diff.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: handoff-snapshot-diff-${{ github.run_id }}
          path: diff
          if-no-files-found: warn
          retention-days: 90
