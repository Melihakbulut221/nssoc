name: Core-only native IHP functional pad test
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-io:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Compile and execute native pad and negative-enable cases
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends iverilog
          python3 scripts/qualify_core_only_native_io.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: core-only-native-io-${{ github.run_id }}
          path: hw/soc/out/core-only-native-io/
          if-no-files-found: error
          retention-days: 90
