name: CDR lowz8 exact divider and MIM topology
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          filter: blob:none
          sparse-checkout: scripts
      - name: Restore preserved actual model in cloud only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api repos/${{ github.repository }}/actions/artifacts/14078587671/zip > native.zip
      - run: python3 -u scripts/inspect_cdr_lowz8_divider_topology.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: cdr-lowz8-divider-topology-${{ github.run_id }}
          path: out/*.json
          if-no-files-found: error
          retention-days: 90
