name: Publish independently replayed prepared source evidence
on:
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Authenticate native producer package and publish immutable new release
        run: python3 -B scripts/cloud_publish_prepared_sources.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: prepared-source-publication-derived-${{ github.run_id }}
          path: prepared-source-publication/derived/
          if-no-files-found: error
          retention-days: 90
