name: Frozen physical checker complete source closure
on:
  workflow_dispatch:
    inputs:
      approved_source:
        type: string
        required: true
permissions:
  contents: read
  actions: read
concurrency:
  group: cdr-physical-source-closure-${{ github.ref }}
  cancel-in-progress: false
env:
  PYTHONDONTWRITEBYTECODE: '1'
  APPROVED_SOURCE: ${{ inputs.approved_source }}
jobs:
  source-controls:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/cdr-via2-m3-physical-closure-pins.json
      - name: Materialize exact protected Python analog and lock source closure
        run: |
          python3 -B - <<'PY'
          import json,os,subprocess
          from pathlib import Path
          name='scripts/cdr-via2-m3-physical-closure-pins.json'
          manifest=json.loads(Path(name).read_bytes())
          assert manifest['native_execution_authorized'] is False
          assert os.environ['APPROVED_SOURCE']==os.environ['GITHUB_SHA']
          names=sorted(set(manifest['files'])|{name})
          assert all(not n.startswith('/')and '..'not in Path(n).parts and not any(c in n for c in '*?[!\\\n\r')for n in names)
          subprocess.run(['git','sparse-checkout','set','--no-cone','--stdin'],input=''.join('/'+n+'\n'for n in names),text=True,check=True)
          PY
      - name: Acquire and verify immutable tool archive without executing it
        run: |
          curl --fail --location --retry 2 --output "$RUNNER_TEMP/physical-source-closure.AppImage" https://github.com/librelane/librelane/releases/download/3.0.5/librelane-devshell-x86_64.AppImage
          python3 -B - <<'PY'
          import hashlib,os
          from pathlib import Path
          p=Path(os.environ['RUNNER_TEMP'])/'physical-source-closure.AppImage'
          with p.open('rb')as f:assert hashlib.file_digest(f,'sha256').hexdigest()=='d6a349ec65be11456e96c4981d35f63ca34d3c85daf79a51e1ccb907bb5d7466'
          assert not p.is_symlink()
          PY
      - name: Prepare exact immutable98 deck source files no native runtime
        run: |
          python3 -B scripts/check_cdr_via2_m3_physical_source_closure.py --prepare-decks > physical-closure-preparation.stdout 2> physical-closure-preparation.stderr
      - name: Exercise unchanged checker import and first native boundary with real source closure
        env:
          CLOUD_APPIMAGE: ${{ runner.temp }}/physical-source-closure.AppImage
        run: |
          python3 -B scripts/check_cdr_via2_m3_physical_source_closure.py > physical-closure-controls.stdout 2> physical-closure-controls.stderr
      - name: Always emit full derived source closure records only
        if: always()
        run: |
          python3 -B - <<'PY'
          import base64,hashlib,json
          from pathlib import Path
          names=['physical-closure-preparation.stdout','physical-closure-preparation.stderr','physical-closure-controls.stdout','physical-closure-controls.stderr','hw/soc/out/cdr-via2-m3-physical-source-closure-controls/deck-source-preparation.json','hw/soc/out/cdr-via2-m3-physical-source-closure-controls/result.json']
          for name in names:
              p=Path(name)
              if not p.is_file():continue
              b=p.read_bytes();b.decode('utf-8','strict');chunks=[b[i:i+24000]for i in range(0,len(b),24000)]or[b'']
              print('PHYSICAL_CLOSURE_CONTROL_INDEX '+json.dumps(dict(path=name,bytes=len(b),sha256=hashlib.sha256(b).hexdigest(),chunks=len(chunks)),sort_keys=True))
              for i,part in enumerate(chunks):print('PHYSICAL_CLOSURE_CONTROL_CHUNK '+json.dumps(dict(path=name,index=i,base64=base64.b64encode(part).decode()),sort_keys=True))
          PY
      - name: Preserve full fixture output and failures in cloud
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cdr-physical-source-closure-controls-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            hw/soc/out/cdr-via2-m3-physical-source-closure-controls
            physical-closure-preparation.stdout
            physical-closure-preparation.stderr
            physical-closure-controls.stdout
            physical-closure-controls.stderr
          if-no-files-found: error
          retention-days: 90
  preserve-job-log:
    needs: source-controls
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Preserve full actual source job log and metadata
        run: |
          python3 -B - <<'PY'
          import hashlib,json,os,subprocess
          from pathlib import Path
          root=Path('job-logs');root.mkdir()
          e=os.environ
          assert e['GITHUB_REPOSITORY']=='Melihakbulut221/nssoc' and e['GITHUB_RUN_ATTEMPT']=='1'
          prefix='repos/'+e['GITHUB_REPOSITORY']+'/'
          def read(path,name):
              b=subprocess.check_output(['gh','api',prefix+path]);(root/name).write_bytes(b);return json.loads(b)
          run=read('actions/runs/'+e['GITHUB_RUN_ID'],'run.json')
          assert run['head_sha']==e['GITHUB_SHA'] and run['run_attempt']==1
          jobs=read('actions/runs/'+e['GITHUB_RUN_ID']+'/attempts/1/jobs?per_page=100','jobs.json')
          selected=[j for j in jobs['jobs'] if j['name']=='source-controls'];assert len(selected)==1
          j=selected[0];assert j['status']=='completed' and j['head_sha']==e['GITHUB_SHA']
          read('actions/jobs/'+str(j['id']),'job.json')
          b=subprocess.check_output(['gh','api','--allow-escape-sequences',prefix+'actions/jobs/'+str(j['id'])+'/logs'])
          assert b;(root/'job.log').write_bytes(b)
          receipt=dict(source=e['GITHUB_SHA'],run_id=int(e['GITHUB_RUN_ID']),attempt=1,
            job_id=j['id'],job_conclusion=j['conclusion'],full_raw_job_log=True,
            log_bytes=len(b),log_sha256=hashlib.sha256(b).hexdigest(),native_acquisition=False)
          (root/'receipt.json').write_text(json.dumps(receipt,sort_keys=True,indent=2)+'\n')
          print(json.dumps(receipt,sort_keys=True))
          PY
      - name: Preserve complete actual logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cdr-physical-closure-source-job-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: job-logs
          if-no-files-found: error
          retention-days: 90
