name: Full hosted RTL verification
on: workflow_dispatch
permissions:
  contents: read
jobs:
  rtl:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install the pinned simulation dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends iverilog
          python3 -m venv hw/.venv
          hw/.venv/bin/pip install -r hw/requirements.txt
      - name: Prepare processor and interface RTL
        run: make soc-rtl-prepare INTERFACE_PYTHON="$PWD/hw/.venv/bin/python"
      - name: Run full RTL regression
        run: make rtl-test
