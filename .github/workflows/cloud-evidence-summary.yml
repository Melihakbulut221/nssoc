name: Independent complete SRAM schematic inventory
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          filter: blob:none
          sparse-checkout: |
            scripts
            hw/soc/flow
      - name: Install the pinned netlist reader
        run: python3 -m pip install klayout==0.30.13
      - name: Restore hash-locked independent schematic only in cloud
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api repos/${{ github.repository }}/actions/artifacts/14069436539/zip > reference.zip
      - name: Inventory all flattened MOS devices and body ports
        run: python3 -u scripts/audit_sram_reference_macro_inventory.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: sram-independent-macro-inventory-${{ github.run_id }}
          path: out
          if-no-files-found: error
          retention-days: 90
