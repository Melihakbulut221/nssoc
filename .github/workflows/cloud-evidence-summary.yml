name: Reaudit completed full chip LVS without rerunning extraction
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/reaudit_full_chip_lvs.py
            /hw/soc/flow/audit_klayout_lvs.py
      - run: |
          set -euo pipefail
          gh api repos/${{ github.repository }}/actions/artifacts/14117582646/zip > native.zip
          gh api repos/${{ github.repository }}/actions/artifacts/14117572707/zip > previous-derived.zip
          python3 -m pip install klayout==0.30.13
      - run: python3 scripts/reaudit_full_chip_lvs.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: full-chip-lvs-reaudit-derived-${{ github.run_id }}
          path: out/derived
          if-no-files-found: error
          retention-days: 90
