# c5r3k 1 us acquisition bench on the extracted c5r3k PLL849 deck. Same steps
# as the analysis/pll-divider-currents bench (variant original: no deck patch),
# with the deck taken from the c5r3k preparation release (run 42403338623)
# instead of asset 668392118. The frozen gate is independent_analysis from
# codex/complete-open-work after its SHA-256 check. 3.125e-13 is the deck's own
# step; 5e-13 runs alongside as an earlier, coarser cross-check.
name: Full cold PLL acquisition after same-runner throughput admission
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  temperature-controls:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: /scripts/pll_c5r3k_temperature_screen.py
      - run: python3 scripts/pll_c5r3k_temperature_screen.py selftest
  pll-c5r3k-bench:
    needs: temperature-controls
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    strategy:
      fail-fast: false
      matrix:
        include:
          - {variant: original, stop: '1e-06', step: '3.125e-13', temperature: -40}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/measure_pll_thread_throughput.py
            /scripts/pll_c5r3k_bench.py
            /scripts/pll-c5r3k-bench-probes.json
            /scripts/pll_c5r3k_temperature_screen.py
      - name: Restore the c5r3k preparation deck, models and runtime
        run: |
          set -euo pipefail
          base=https://github.com/Melihakbulut221/nssoc/releases/download/cloud-results-42403338623-1-pll-c5r3k-preparation
          curl --fail --location --retry 4 "$base/pll-c5r3k-preparation-42403338623-1.tar.gz.part0000" -o /tmp/prep.tgz
          echo "9624f52ea28ce3aa92c2232b135c7162912756f565913079d8c09863adbf0dde  /tmp/prep.tgz" | sha256sum -c -
          mkdir -p /tmp/prep && tar -xzf /tmp/prep.tgz -C /tmp/prep
          P=/tmp/prep/cloud-pll-c5r3k-preparation
          grep -q '"status": "PASS_WHOLE_PLL_LOADED_DECK_AND2737_TERMINAL_INSTRUMENTATION_REQUIRES_NATIVE_EXECUTION"' $P/result.json
          mkdir -p cloud-pll-snapshot case
          cp -r $P/model-sources/models $P/model-sources/frontend cloud-pll-snapshot/
          cp $P/candidate-circuit.cir case/
          cp $P/composition/pll845-mim-wire.spice case/parent865.spice
          sha256sum case/candidate-circuit.cir case/parent865.spice
          gh api repos/${{ github.repository }}/releases/assets/650315768 -H "Accept: application/octet-stream" > /tmp/runtime.tgz
          echo "cd993e4d1eb02f900488450bb1ac3880c67a5e5c34fbac06565c7db85667a821  /tmp/runtime.tgz" | sha256sum -c -
          mkdir -p /tmp/rt && tar -xzf /tmp/runtime.tgz -C /tmp/rt
          E=$(find /tmp/rt -type f -name patched-ngspice | head -1); test -n "$E"; cp "$E" engine; chmod +x engine
          echo "103134f6e3bf71771a7f9c94cc43fd5ea2f9d51490116718814aa344e9c51509  engine" | sha256sum -c -
          grep -n "^\.lib\|^\.include\|pre_osdi" case/candidate-circuit.cir
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 415db81024b44298c0d3fbf1a6b90be3a08e923f
          path: frozen
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/*.py
      - run: python3 -m pip install --disable-pip-version-check --no-cache-dir numpy==2.3.3
      - name: Measure same-runner throughput before committing full duration
        timeout-minutes: 20
        run: |
          set -euo pipefail
          NSSOC_PLL_THREADS=4 NSSOC_PLL_STOP=5e-08 NSSOC_PLL_MAXSTEP=3.125e-13 python3 -B scripts/pll_c5r3k_bench.py prepare case scripts/pll-c5r3k-bench-probes.json original
          python3 scripts/pll_c5r3k_temperature_screen.py prepare case/probe-circuit.cir -40 case/admission-temperature.json
          python3 scripts/measure_pll_thread_throughput.py -40 4
          grep -q 'Using KLU as Direct Linear Solver' case/ngspice.log
          python3 - <<'PYADMIT'
          import json
          r=json.load(open('performance/throughput.json'))
          assert r['status']=='COMPLETE_THROUGHPUT_SAMPLE_ONLY' and r['elapsed_s']<=900, 'Host too slow for planned full-duration budget; no acquisition claim'
          PYADMIT
          mkdir admission-native
          cp case/probe-circuit.cir case/ngspice.log case/admission-temperature.json admission-native/
          mv case/probe.raw case/op.raw admission-native/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: pll-cold-admission-derived-${{ github.run_id }}
          path: performance/*.json
          if-no-files-found: error
          retention-days: 90
      - name: Run the temperature-only screen at the original duration and step
        run: |
          set -euo pipefail
          NSSOC_PLL_THREADS=4 NSSOC_PLL_STOP=${{ matrix.stop }} NSSOC_PLL_MAXSTEP=${{ matrix.step }} python3 -B scripts/pll_c5r3k_bench.py prepare case scripts/pll-c5r3k-bench-probes.json ${{ matrix.variant }}; cat case/variant-patch.json
          python3 scripts/pll_c5r3k_temperature_screen.py prepare case/probe-circuit.cir ${{ matrix.temperature }} pll-c5r3k-bench/temperature-change.json
          cd case && SPICE_SCRIPTS=$PWD OMP_NUM_THREADS=4 timeout 19500 ../engine -n -b probe.cir > ngspice.log 2>&1 || { echo "ngspice rc=$?"; tail -40 ngspice.log; exit 1; }
          tail -5 ngspice.log; ls -l probe.raw
          cd ..
          python3 scripts/pll_c5r3k_temperature_screen.py verify case/ngspice.log ${{ matrix.temperature }} pll-c5r3k-bench/temperature-readback.json
      - name: Reproduce the acquisition metrics
        run: python3 -B scripts/pll_c5r3k_bench.py analyze case scripts/pll-c5r3k-bench-probes.json pll-c5r3k-bench
      - name: Apply the frozen acquisition gate (independent_analysis, unchanged)
        if: always()
        run: |
          python3 -B scripts/pll_c5r3k_bench.py gate case frozen/scripts pll-c5r3k-bench
          PYTHONPATH=scripts python3 - <<'PYVERIFY'
          import json
          from pathlib import Path
          from pll_c5r3k_bench import read_raw
          data,names=read_raw(Path('case/probe.raw'))
          assert abs(float(data[-1,0])-1e-6)<=3.125e-13, 'Incomplete full acquisition interval'
          r=json.load(open('pll-c5r3k-bench/frozen-gate.json'))
          assert r['passed'] is True, 'Frozen acquisition gate rejected waveform'
          PYVERIFY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: pll-c5r3k-temperature-${{ matrix.temperature }}-${{ github.run_id }}
          path: |
            pll-c5r3k-bench
            case/ngspice.log
            case/variant-patch.json
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: pll-cold-full-gate-derived-${{ github.run_id }}
          path: pll-c5r3k-bench/frozen-gate.json
          if-no-files-found: warn
          retention-days: 90
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: pll-cold-full-native-${{ github.run_id }}
          path: |
            case
            admission-native
          if-no-files-found: error
          retention-days: 30
