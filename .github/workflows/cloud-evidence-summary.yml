name: Select actual47 route repair owners from original report20
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  classify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/cloud_mainchip_route47_plan.py
            /scripts/mainchip-route47-inputs.json
            /scripts/mainchip-route47-pins.json
            /docs/mainchip-route47-plan.md
            /.github/workflows/cloud-evidence-summary.yml
      - run: python3 -B scripts/cloud_mainchip_route47_plan.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: route47-plan-${{ github.run_id }}
          path: route47-plan
          if-no-files-found: error
          retention-days: 90
