name: SRAM boolean-condition old-source equivalence
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  equivalence:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          filter: blob:none
          sparse-checkout: |
            scripts
            hw/soc/rtl/dft
      - run: sudo apt-get update -qq && sudo apt-get install -y yosys
      - name: Prove all declared configurations and reject known faults
        run: python3 -u scripts/check_sram_bool_equivalence.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: sram-bool-equivalence-${{ github.run_id }}
          path: |
            out/*.log
            out/*.ys
            out/result.json
          if-no-files-found: error
          retention-days: 90
