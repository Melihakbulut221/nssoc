name: Ibex execute path and PCIe pipeline combined - core tests, regressions, native boot, PCIe timing screen and RTL-to-global-route probes
on:
  workflow_dispatch:
    inputs:
      probe_only:
        description: Run only the timing probe (skip the functional jobs)
        type: boolean
        default: false
      unit_only:
        description: Run only the unit job
        type: boolean
        default: false
      probe_variant:
        description: Run only these probe matrix entries (space-separated names; empty for all, none for no probe)
        type: string
        default: ''
      repair_iterations:
        description: repair_timing -max_iterations in the uncapped-repair step
        type: string
        default: '1000000'
      path_nets:
        description: After the repair, also report the ten worst paths per group at the slow corner with net names
        type: boolean
        default: false
      rvformal_only:
        description: Run only the riscv-formal comparison (skip everything else)
        type: boolean
        default: false
      rvformal_hang_only:
        description: In the riscv-formal job, run only the hang check at several bounds
        type: boolean
        default: false
      variant:
        description: Run only these regress and native-boot matrix entries (space-separated names; empty for all); non-empty also skips riscv-formal
        type: string
        default: ''
      drt_iters:
        description: Detailed-routing optimisation iterations (DRT_OPT_ITERS) of the routed measurement (probe entries r_*)
        type: string
        default: '16'
      pcie_jobs:
        description: Jobs to run, space-separated from timing, unit, soc (PCIe pipeline) and eth (Ethernet FIFO and BUSSTAT knobs); add only to skip every Ibex job
        type: string
        default: ''
      pcie_timing_sides:
        description: Sides of the PCIe packet-domain timing screen (JSON list of baseline and change)
        type: string
        default: '["baseline","change"]'
      route_run:
        description: Run id holding routed-db artifacts; when set, routed-sta extracts those and the route job is skipped
        type: string
        default: ''
      sta_variant:
        description: With route_run, the routed variants to extract (space separated)
        type: string
        default: ''
      pcie_tests:
        description: cocotb suites of the PCIe unit job
        type: string
        default: 'soc_pcie_replay_tx soc_pcie_flow_packets soc_pcie_buffered_flow_packets soc_pcie_reliable_packets'
permissions:
  contents: read
  actions: read
env:
  # The PCIe timing screen's baseline side (timing/pcie-pipeline).
  BASELINE_REF: timing/pcie-boundary-skid
jobs:
  native-boot:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          # The MBIST boot (983,040 MBIST cycles before the firmware) needs
          # about 1.85 M gate-level cycles at MEM_RDREG = 2 and does not fit
          # the hosted job's wall clock; the same boot without MBIST does.
          # The data request register with its PMP verdict (docs/ibex-ex-stage.md
          # section 7) on the best execute-path combination.
          # docs/combined-timing.md: the same with the Ethernet FIFO read
          # register and the BUSSTAT pending-event register.
          - {name: ex_exec_pmpreg_cut10, ex: '1', rf: '1', memreg: '2', pmpreg: '1', ethrd: '1', evpend: '1', mbistpipe: '1', rxread2: '1', ireqreg: '1', rstcopy: '1', ethwr: '1', rpinbank: '1', txword: '1', rpahead: '1', creditpick: '1', seqrx: '1', rxcommit: '1', gate: corrpre-pcie}
          # The system and Ethernet MBIST gate-level boot with every knob of
          # docs/combined-timing.md on the execute stage alone (one-cycle
          # memory reads, the configuration whose MBIST boot fits the job).
          # The registered RAM self-test compare adds 327,680 self-test cycles and the
          # execute stage about 8%; the 2,000,000-cycle default ended at check 24 of 28.
          # The execute stage alone keeps one-cycle memory reads, so the
          # MBIST boot may fit the wall clock (1.64 M cycles took 9413 s with
          # two-cycle branches).
    env:
      RUN: ${{ inputs.variant == '' || contains(format(' {0} ', inputs.variant), format(' {0} ', matrix.name)) }}
      SOC_ETH_FIFO_RDREG: ${{ matrix.ethrd || '0' }}
      SOC_BUSSTAT_EVPEND: ${{ matrix.evpend || '0' }}
      SOC_SRAM_MBIST_PIPE: ${{ matrix.mbistpipe || '0' }}
      NATIVE_BOOT_SECONDS: '18000'
      NATIVE_BOOT_CYCLES: ${{ matrix.cycles || '2000000' }}
      SOC_PCIE_RX_STAGED_COMMIT: ${{ matrix.rxstaged || '0' }}
      SOC_PCIE_RX_READ_AHEAD: ${{ matrix.rxahead || '0' }}
      SOC_BUS_WDATA_OWN: ${{ matrix.wdataown || '0' }}
      SOC_PCIE_RX_READ2: ${{ matrix.rxread2 || '0' }}
      SOC_BUS_IREQ_REG: ${{ matrix.ireqreg || '0' }}
      SOC_PCIE_RESET_COPIES: ${{ matrix.rstcopy || '0' }}
      SOC_ETH_FIFO_WRREG: ${{ matrix.ethwr || '0' }}
      SOC_PCIE_REPLAY_INBANK: ${{ matrix.rpinbank || '0' }}
      SOC_PCIE_TX_WORD_REG: ${{ matrix.txword || '0' }}
      SOC_PCIE_REPLAY_AHEAD: ${{ matrix.rpahead || '0' }}
      SOC_PCIE_CREDIT_PICK: ${{ matrix.creditpick || '0' }}
      SOC_PCIE_SEQ_RX_REG: ${{ matrix.seqrx || '0' }}
      SOC_PCIE_RX_COMMIT_COPIES: ${{ matrix.rxcommit || '0' }}
      SOC_INTERFACE_PROFILE: full
      IBEX_EX_STAGE: ${{ matrix.ex || '0' }}
      IBEX_PMP_REQ_REG: ${{ matrix.pmpreg || '0' }}
      GATE: ${{ matrix.gate || 'corrpre-pcie-mbist' }}
      SOC_CORE_REQ_REG: '0'
      SOC_CORE_WB_STAGE: '0'
      SOC_CORE_BT_ALU: ${{ matrix.btalu || '0' }}
      IBEX_BRANCH_2CYCLE: ${{ matrix.br2 || '0' }}
      NATIVE_RF_CHKDEFER: ${{ matrix.rf || '0' }}
      NATIVE_RF_PREDECODE: ${{ matrix.rf || '0' }}
      NATIVE_MEM_RDREG: ${{ matrix.memreg || '1' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        if: ${{ env.RUN == 'true' }}
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        if: ${{ env.RUN == 'true' }}
        with:
          python-version: '3.12'
      - name: Retry transient download failures
        if: ${{ env.RUN == 'true' }}
        run: printf 'retry = 10\nretry-delay = 30\nretry-all-errors\nfail\n' > ~/.curlrc
      - uses: YosysHQ/setup-oss-cad-suite@aefa8397bbf8fc6670a0a62af9805a89738f3cde
        if: ${{ env.RUN == 'true' }}
        id: cad1
        continue-on-error: true
        with:
          version: '2026-08-04'
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - run: sleep 180
        if: ${{ env.RUN == 'true' && ((steps.cad1.outcome == 'failure')) }}
      - uses: YosysHQ/setup-oss-cad-suite@aefa8397bbf8fc6670a0a62af9805a89738f3cde
        id: cad2
        if: ${{ env.RUN == 'true' && ((steps.cad1.outcome == 'failure')) }}
        continue-on-error: true
        with:
          version: '2026-08-04'
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - run: sleep 300
        if: ${{ env.RUN == 'true' && ((steps.cad1.outcome == 'failure' && steps.cad2.outcome == 'failure')) }}
      - uses: YosysHQ/setup-oss-cad-suite@aefa8397bbf8fc6670a0a62af9805a89738f3cde
        if: ${{ env.RUN == 'true' && ((steps.cad1.outcome == 'failure' && steps.cad2.outcome == 'failure')) }}
        with:
          version: '2026-08-04'
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Prepare exact digital inputs
        if: ${{ env.RUN == 'true' }}
        run: |
          echo "OSS_CAD_SUITE=$(dirname "$(dirname "$(command -v yosys)")")" >> "$GITHUB_ENV"
          python3 -m pip install -q -r sw/requirements.txt
          for a in 1 2 3 4; do make soc-prepare > /tmp/prep.log 2>&1 && break; tail -30 /tmp/prep.log; [ $a = 4 ] && exit 1; echo "prepare attempt $a failed; retrying"; sleep 60; done
      - name: Native CORRPRE PCIe-idle boot; system MBIST not selected
        if: ${{ env.RUN == 'true' }}
        run: |
          bash -n scripts/check_soc_corrpre_pcie_native_boot.sh
          bash scripts/check_soc_${GATE//-/_}_native_boot.sh
      - name: Show the selected core and the gate-level verdict
        if: ${{ env.RUN == 'true' && (always()) }}
        run: |
          O=hw/soc/out/$GATE-native-boot
          cat $O/core-configuration.json || true
          grep -E "core_bt_alu|branch_2cycle|ex_stage=|pmp_req_reg=|chkdefer=|genp/gen-br2|genp/gen-pre|genp/gen-ex|genp/gen-pmp|Parameter .(CHKDEFER|RDPRE|MEM_RDREG)" $O/synthesis-driver.log $O/synthesis/syn.log | head -10 || true
          grep -E "^== |checks run|\[TB\]" $O/rtl-driver.log | tail -10 || true
          tail -30 $O/gates-driver.log || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ env.RUN == 'true' && (always()) }}
        with:
          name: ibex-ex-stage-native-boot-${{ matrix.name }}-${{ github.run_id }}
          path: |
            hw/soc/out/*-native-boot/**/*.log
            hw/soc/out/*-native-boot/**/*.json
            hw/soc/out/*-native-boot/rtl/soc_param_override.v
          retention-days: 30

      - name: Preserve native build for cloud-only recovery
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-boot-recovery-${{ github.run_id }}
          path: hw/soc/out/corrpre-pcie-native-boot/
          retention-days: 30
