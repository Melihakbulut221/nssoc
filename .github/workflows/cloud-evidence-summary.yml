name: Certify peer-ready output using proved invariant and exact source identity
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  certificate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          filter: blob:none
          sparse-checkout: |
            scripts
            hw/soc/rtl/pcie
            sw/tests/fixtures/pcie_credit_tx
      - run: python3 scripts/qualify_pcie_peer_ready_certificate.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: peer-ready-certificate-${{ github.run_id }}
          path: peer-ready-certificate/
          if-no-files-found: error
          retention-days: 90
