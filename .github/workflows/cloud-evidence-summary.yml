name: Retry write-enable driver native sizing and placement screen
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  placement:
    runs-on: ubuntu-22.04
    timeout-minutes: 55
    env:
      GH_TOKEN: ${{ github.token }}
      APPIMAGE_EXTRACT_AND_RUN: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/run_retry_driver_buf4_placement.py
            /scripts/retry_driver_buf4_placement.tcl
            /scripts/verify_retry_driver_buf4.py
            /scripts/prepare_retry_driver_buf4.py
            /scripts/restore_retry_driver_placement.py
            /scripts/check_saved_retry_placement.tcl
      - name: Restore pinned runtime and native database in cloud
        run: |
          set -euo pipefail
          sudo mkdir -p /mnt/s; sudo chown "$USER" /mnt/s
          curl -fsSL --retry 5 -o /mnt/s/librelane.AppImage https://github.com/librelane/librelane/releases/download/3.0.5/librelane-devshell-x86_64.AppImage
          echo 'd6a349ec65be11456e96c4981d35f63ca34d3c85daf79a51e1ccb907bb5d7466  /mnt/s/librelane.AppImage' | sha256sum -c -
          chmod +x /mnt/s/librelane.AppImage
          gh api repos/${{ github.repository }}/actions/artifacts/14120090635/zip > native.zip
      - name: Inspect existing placement without rerunning or editing it
        run: |
          set -euo pipefail
          python3 scripts/restore_retry_driver_placement.py
          env -u GH_TOKEN -u GITHUB_TOKEN /mnt/s/librelane.AppImage openroad -exit scripts/check_saved_retry_placement.tcl
          env -u GH_TOKEN -u GITHUB_TOKEN /mnt/s/librelane.AppImage openroad -exit -python scripts/verify_retry_driver_buf4.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: retry-buf4-placement-derived-${{ github.run_id }}
          path: out/derived
          if-no-files-found: error
          retention-days: 90
