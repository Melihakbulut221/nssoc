name: Replay predecode identical-area native placement screen
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  place:
    runs-on: ubuntu-22.04
    timeout-minutes: 95
    env:
      GH_TOKEN: ${{ github.token }}
      APPIMAGE_EXTRACT_AND_RUN: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          sparse-checkout: scripts
      - name: Restore pinned runtime and exact mapped candidates only in cloud
        run: |
          set -euo pipefail
          sudo mkdir -p /mnt/s
          sudo chown "$USER" /mnt/s
          curl -fsSL --retry 5 -o /mnt/s/librelane.AppImage https://github.com/librelane/librelane/releases/download/3.0.5/librelane-devshell-x86_64.AppImage
          echo 'd6a349ec65be11456e96c4981d35f63ca34d3c85daf79a51e1ccb907bb5d7466  /mnt/s/librelane.AppImage' | sha256sum -c -
          chmod +x /mnt/s/librelane.AppImage
          gh api repos/${{ github.repository }}/actions/artifacts/14121339687/zip > mapping-native.zip
      - name: Place both candidates with identical boundaries and report all corners
        run: python3 scripts/place_replay_write_predecode.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: replay-predecode-placement-${{ github.run_id }}
          path: |
            out/*.json
            out/baseline/*.log
            out/baseline/*.rpt
            out/predecode/*.log
            out/predecode/*.rpt
          retention-days: 30
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: replay-predecode-placement-native-${{ github.run_id }}
          path: out/native
          retention-days: 30
