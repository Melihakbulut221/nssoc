name: Admit actual queue count candidate through complete legacy and new evidence gates
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  admission:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
      SOC_PCIE_RX_COUNT_FLAGS: '1'
      SOC_PCIE_RX_READ2: '1'
      SOC_PCIE_RESET_COPIES: '1'
      SOC_PCIE_RX_COMMIT_COPIES: '1'
      SOC_PCIE_RX_CURSOR_LOCAL_RESET: '1'
      SOC_PCIE_RX_LOCAL_LANE_NEXT: '1'
      SOC_PCIE_RX_DLLP_LAST_COMPARE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: python3 scripts/require_rx_cursor_qualification.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: queue-count-admission-${{ github.run_id }}
          path: out/*qualification*.json
          if-no-files-found: error
          retention-days: 90
