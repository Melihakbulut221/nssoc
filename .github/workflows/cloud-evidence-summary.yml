name: Full native MBIST continuation from verified 1.90M cycle checkpoint
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  restore:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 240
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/resume_full_native_boot.py
            /hw/soc/flow/
            /hw/soc/pnr/ihp-native-boot.lock.json
      - name: Build pinned official CRIU and install native Icarus
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y iverilog build-essential pkg-config libprotobuf-dev uuid-dev python3-yaml libprotobuf-c-dev protobuf-c-compiler protobuf-compiler libnl-3-dev libcap-dev libnet1-dev libgnutls28-dev libnftables-dev libaio-dev python3-protobuf libbsd-dev
          mkdir /tmp/criu-source
          git -C /tmp/criu-source init
          git -C /tmp/criu-source remote add origin https://github.com/checkpoint-restore/criu.git
          git -C /tmp/criu-source fetch --depth 1 origin 3ce556b7e8291c1bfdca974962f6282d7802b69f
          git -C /tmp/criu-source checkout --detach FETCH_HEAD
          test "$(git -C /tmp/criu-source rev-parse HEAD)" = 3ce556b7e8291c1bfdca974962f6282d7802b69f
          make -C /tmp/criu-source -j2 criu
          sudo install -m755 /tmp/criu-source/criu/criu /usr/local/bin/criu
          criu --version
          gh api -H 'Accept: application/octet-stream' repos/YosysHQ/oss-cad-suite-build/releases/assets/500964614 > /tmp/suite.tgz
          echo '8c6010f1cc37f2083a472778ef7e2e756409e377e547f62c11a16f5d96a8f982  /tmp/suite.tgz' | sha256sum -c -
          tar -xzf /tmp/suite.tgz -C /tmp
          rm /tmp/suite.tgz
          python3 hw/soc/flow/prepare_ihp_native_boot.py
      - run: |
          set -euo pipefail
          gh api repos/Melihakbulut221/nssoc/actions/artifacts/14111635745/zip > native.zip
          echo '4118593a84fc58be234b22d1fe177626dba8a2a6f973ff10e5effca36b9472a9  native.zip' | sha256sum -c -
          unzip -q native.zip
          gh api repos/Melihakbulut221/nssoc/actions/artifacts/14110894168/zip > result.zip
          echo '93d10bd767f486fdc5718cec80d4de1cdd2c1fd453c805bda68e31874bdaf79d  result.zip' | sha256sum -c -
          unzip -q result.zip
          python3 -u scripts/resume_full_native_boot.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: full-native-continuation-result-${{ github.run_id }}
          path: |
            out/resume-result.json
            out/native-boot.log
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && hashFiles('next-checkpoint.tgz') != ''
        with:
          name: full-native-continuation-checkpoint-${{ github.run_id }}
          path: next-checkpoint.tgz
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && hashFiles('out-native/criu-restore.log') != ''
        with:
          name: full-native-criu-restore-log-${{ github.run_id }}
          path: out-native/criu-restore.log
          if-no-files-found: error
          retention-days: 30
