name: Prove direct PCIe peer-ready reset and transition invariant
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      REFERENCE_SHA: e69f70857c984ef5c86001cf5427a417d35665942a449f8cc25ec0b237c5cb70
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          filter: blob:none
          sparse-checkout: |
            scripts
            hw/soc/rtl/pcie
            hw/soc/tb
            sw/tests/fixtures/pcie_credit_tx
      - name: Install formal and four-state simulators
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends yosys iverilog
      - name: Prove direct reset base and temporal invariant with reset fault controls
        run: python3 scripts/prove_pcie_peer_ready_invariant.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: pcie-peer-ready-invariant-${{ github.run_id }}
          path: |
            peer-ready-invariant/**/*.json
            peer-ready-invariant/**/*.log
            peer-ready-invariant/**/*.ys
            peer-ready-invariant/**/*.v
            peer-ready-invariant/**/*.vcd
          if-no-files-found: error
          retention-days: 90
