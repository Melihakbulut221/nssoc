name: First-divider current probes on the unchanged RHI120-C8 PLL deck
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pll-divider-currents:
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    strategy:
      fail-fast: false
      matrix:
        variant: [cp8_int2k1, cp8_int1k]
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/pll_divider_currents.py
            /scripts/pll-divider-probes.json
      - name: Restore preserved preparation deck, models and runtime
        run: |
          set -euo pipefail
          gh api repos/${{ github.repository }}/releases/assets/668392118 -H "Accept: application/octet-stream" > /tmp/prep.tgz
          echo "a7b33b0742783e477c5c7472c8f3a984e1ffce7eeb9280d358b7a6c1ee026c41  /tmp/prep.tgz" | sha256sum -c -
          mkdir -p /tmp/prep && tar -xzf /tmp/prep.tgz -C /tmp/prep
          P=/tmp/prep/cloud-pll-rhi120-c8-preparation
          mkdir -p cloud-pll-snapshot case
          cp -r $P/model-sources/models $P/model-sources/frontend cloud-pll-snapshot/
          cp $P/candidate-circuit.cir case/
          cp $P/composition/pll845-mim-wire.spice case/parent865.spice
          gh api repos/${{ github.repository }}/releases/assets/650315768 -H "Accept: application/octet-stream" > /tmp/runtime.tgz
          echo "cd993e4d1eb02f900488450bb1ac3880c67a5e5c34fbac06565c7db85667a821  /tmp/runtime.tgz" | sha256sum -c -
          mkdir -p /tmp/rt && tar -xzf /tmp/runtime.tgz -C /tmp/rt
          E=$(find /tmp/rt -type f -name patched-ngspice | head -1); test -n "$E"; cp "$E" engine; chmod +x engine
          echo "103134f6e3bf71771a7f9c94cc43fd5ea2f9d51490116718814aa344e9c51509  engine" | sha256sum -c -
          grep -n "^\.lib\|^\.include\|pre_osdi" case/candidate-circuit.cir
          ls cloud-pll-snapshot/models | head; pwd
      - run: python3 -m pip install --disable-pip-version-check --no-cache-dir numpy==2.3.3
      - name: Rewrite only the save list and run the 1 us transient
        run: |
          set -euo pipefail
          NSSOC_PLL_STOP=1.5e-06 NSSOC_PLL_MAXSTEP=1e-12 python3 -B scripts/pll_divider_currents.py prepare case scripts/pll-divider-probes.json ${{ matrix.variant }}; cat case/variant-patch.json
          cd case && SPICE_SCRIPTS=$PWD OMP_NUM_THREADS=1 timeout 20400 ../engine -n -b probe.cir > ngspice.log 2>&1 || { echo "ngspice rc=$?"; tail -40 ngspice.log; exit 1; }
          tail -5 ngspice.log; ls -l probe.raw
      - name: Reproduce the original acquisition metrics and report divider currents
        run: python3 -B scripts/pll_divider_currents.py analyze case scripts/pll-divider-probes.json pll-divider
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: pll-divider-currents-${{ matrix.variant }}-${{ github.run_id }}
          path: |
            pll-divider
            case/ngspice.log
            case/variant-patch.json
          if-no-files-found: warn
          retention-days: 90
