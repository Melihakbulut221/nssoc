name: Indexed antenna netlist export qualification
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  qualify:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Check parser faults and authenticated native export
        run: |
          python3 scripts/test_antenna_netlist_export.py
          python3 scripts/cloud_antenna_export_indexed.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: antenna-export-indexed-${{ github.run_id }}
          path: hw/soc/out/antenna-export-indexed/
          if-no-files-found: error
          retention-days: 90
