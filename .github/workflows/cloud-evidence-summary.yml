name: Inspect exact mapped fetch boundary names
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  inventory:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: python3 scripts/restore_predecode_chip_boot.py
      - run: python3 scripts/inspect_fetch_nets.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: exact-fetch-net-inventory-${{ github.run_id }}
          path: fetch-net-inventory/result.json
          if-no-files-found: error
          retention-days: 90
