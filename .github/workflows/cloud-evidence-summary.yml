name: Compare shared conductor effective resistance before loaded PHY result
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_${{ github.token }}: TOKEN
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/compare_shared_resistance.py
            /scripts/cdr_shared_resistance.py
            /scripts/cdr_mos650_spice_syntax.py
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python3 -m pip install --disable-pip-version-check --no-cache-dir numpy==2.3.3 scipy==1.16.2
      - run: python3 -B scripts/compare_shared_resistance.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: shared650-resistance-comparison-${{ github.run_id }}
          path: resistance-comparison/
          retention-days: 90
          if-no-files-found: error
