name: Compare verified SRAM and routed input physical polygons
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: /scripts/compare_sram_current_chip_geometry.py
      - run: python3 -m pip install klayout==0.30.13
      - name: Restore exact native inputs in cloud only
        run: |
          set -euo pipefail
          gh api repos/${{ github.repository }}/releases/assets/663146895 -H 'Accept: application/octet-stream' > pkg.tgz
          gh api repos/${{ github.repository }}/actions/artifacts/14082854262/zip > cc.zip
      - run: python3 scripts/compare_sram_current_chip_geometry.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: sram-current-chip-polygon-comparison-${{ github.run_id }}
          path: out/*.json
          if-no-files-found: error
          retention-days: 90
