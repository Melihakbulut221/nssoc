name: Verify current PCIe functional mutation controls
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  controls:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install simulation runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y iverilog
          python -m pip install cocotb==2.0.1
      - name: Verify real baseline and five mutants for both interfaces
        run: |
          set -euo pipefail
          python scripts/check_pcie_tlp_controls.py --out hw/soc/out/pcie-tlp-controls
          python scripts/check_pcie_tlp_controls.py --top soc_pcie_tlp_stream --out hw/soc/out/pcie-stream-controls
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: current-pcie-mutation-controls-${{ github.run_id }}
          path: |
            hw/soc/out/pcie-tlp-controls/
            hw/soc/out/pcie-stream-controls/
          if-no-files-found: error
          retention-days: 90
