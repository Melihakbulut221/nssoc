# Branch analysis/pll-layout-c5r3k reuses this dispatchable workflow name for
# the first c5r3k layout step: native generation and strict DRC/LVS of the
# four changed PLL child macros (scripts/cloud_pll_c5r3k_children.py). Results
# are kept as workflow artifacts; nothing is published as a release.
name: cloud-evidence-summary
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  c5r3k-child-physical:
    strategy:
      fail-fast: false
      matrix:
        macro: [pump, vco, div1, integrator]
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Restore exact native CAD runtime
        run: |
          python3 -m py_compile scripts/cloud_pll_c5r3k_children.py hw/soc/flow/make_pcie_pump_filter13_c5r3k_v1.py hw/soc/flow/make_pcie_clock_vco_v6_c5r3k_v1.py hw/soc/flow/make_pcie_clock_div4_load3p2_c5r3k_v1.py hw/soc/flow/make_pcie_pll_integrator_c5r3k_v1.py hw/soc/flow/check_pcie_pll_integrator_c5r3k_v1.py
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libfuse2 tcl8.6 tk8.6
          python3 -m pip install networkx==3.4.2 numpy==2.1.3
          PYTHONPATH=scripts python3 -c "import pcie_pll_native_fixture_v1"
          curl --fail --location --retry 4 https://github.com/librelane/librelane/releases/download/3.0.5/librelane-devshell-x86_64.AppImage -o "$RUNNER_TEMP/librelane.AppImage"
          echo "d6a349ec65be11456e96c4981d35f63ca34d3c85daf79a51e1ccb907bb5d7466  $RUNNER_TEMP/librelane.AppImage" | sha256sum --check
          chmod +x "$RUNNER_TEMP/librelane.AppImage"
          echo "CLOUD_APPIMAGE=$RUNNER_TEMP/librelane.AppImage" >> "$GITHUB_ENV"
      - name: Generate the c5r3k macro and require native DRC, deep and flat LVS and fault controls
        run: python3 scripts/cloud_pll_c5r3k_children.py --macro ${{ matrix.macro }}
      - name: Keep every report, log and generated view
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pll-c5r3k-${{ matrix.macro }}-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 30
          if-no-files-found: warn
          path: hw/soc/out/cloud-pll-c5r3k-children/
