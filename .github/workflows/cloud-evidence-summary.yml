name: Frozen three-corner retry buffer Boolean equivalence
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  equivalence:
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
      APPIMAGE_EXTRACT_AND_RUN: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/qualify_retry_buffer_liberty.py
      - name: Restore pinned runtime and original input contract
        run: |
          set -euo pipefail
          sudo mkdir -p /mnt/s; sudo chown "$USER" /mnt/s
          curl -fsSL --retry 5 -o /mnt/s/librelane.AppImage https://github.com/librelane/librelane/releases/download/3.0.5/librelane-devshell-x86_64.AppImage
          echo 'd6a349ec65be11456e96c4981d35f63ca34d3c85daf79a51e1ccb907bb5d7466  /mnt/s/librelane.AppImage' | sha256sum -c -
          chmod +x /mnt/s/librelane.AppImage
          gh api repos/${{ github.repository }}/releases/assets/663146895 -H 'Accept: application/octet-stream' > /mnt/s/pkg.tgz
      - name: Prove buffer identity and reject inversion in each frozen corner
        run: python3 scripts/qualify_retry_buffer_liberty.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: retry-buffer-equivalence-${{ github.run_id }}
          path: out/derived
          if-no-files-found: error
          retention-days: 90
