name: Ibex execute path and PCIe pipeline combined - core tests, regressions, native boot, PCIe timing screen and RTL-to-global-route probes
on:
  workflow_dispatch:
    inputs:
      probe_only:
        description: Run only the timing probe (skip the functional jobs)
        type: boolean
        default: false
      unit_only:
        description: Run only the unit job
        type: boolean
        default: false
      probe_variant:
        description: Run only these probe matrix entries (space-separated names; empty for all, none for no probe)
        type: string
        default: ''
      repair_iterations:
        description: repair_timing -max_iterations in the uncapped-repair step
        type: string
        default: '1000000'
      path_nets:
        description: After the repair, also report the ten worst paths per group at the slow corner with net names
        type: boolean
        default: false
      rvformal_only:
        description: Run only the riscv-formal comparison (skip everything else)
        type: boolean
        default: false
      rvformal_hang_only:
        description: In the riscv-formal job, run only the hang check at several bounds
        type: boolean
        default: false
      variant:
        description: Run only these regress and native-boot matrix entries (space-separated names; empty for all); non-empty also skips riscv-formal
        type: string
        default: ''
      drt_iters:
        description: Detailed-routing optimisation iterations (DRT_OPT_ITERS) of the routed measurement (probe entries r_*)
        type: string
        default: '15'
      pcie_jobs:
        description: Jobs to run, space-separated from timing, unit, soc (PCIe pipeline) and eth (Ethernet FIFO and BUSSTAT knobs); add only to skip every Ibex job
        type: string
        default: ''
      pcie_timing_sides:
        description: Sides of the PCIe packet-domain timing screen (JSON list of baseline and change)
        type: string
        default: '["baseline","change"]'
      route_run:
        description: Run id holding routed-db artifacts; when set, routed-sta extracts those and the route job is skipped
        type: string
        default: ''
      sta_variant:
        description: With route_run, the routed variants to extract (space separated)
        type: string
        default: ''
      pcie_tests:
        description: cocotb suites of the PCIe unit job
        type: string
        default: 'soc_pcie_replay_tx soc_pcie_flow_packets soc_pcie_buffered_flow_packets soc_pcie_reliable_packets'
permissions:
  contents: read
  actions: read
env:
  # The PCIe timing screen's baseline side (timing/pcie-pipeline).
  BASELINE_REF: timing/pcie-boundary-skid
jobs:
  unit:
    if: ${{ !inputs.rvformal_only && !contains(inputs.pcie_jobs, 'only') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Retry transient download failures
        run: printf 'retry = 10\nretry-delay = 30\nretry-all-errors\nfail\n' > ~/.curlrc
      - uses: YosysHQ/setup-oss-cad-suite@aefa8397bbf8fc6670a0a62af9805a89738f3cde
        id: cad1
        continue-on-error: true
        with:
          version: '2026-08-04'
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - run: sleep 180
        if: ${{ (steps.cad1.outcome == 'failure') }}
      - uses: YosysHQ/setup-oss-cad-suite@aefa8397bbf8fc6670a0a62af9805a89738f3cde
        id: cad2
        if: ${{ (steps.cad1.outcome == 'failure') }}
        continue-on-error: true
        with:
          version: '2026-08-04'
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - run: sleep 300
        if: ${{ (steps.cad1.outcome == 'failure' && steps.cad2.outcome == 'failure') }}
      - uses: YosysHQ/setup-oss-cad-suite@aefa8397bbf8fc6670a0a62af9805a89738f3cde
        if: ${{ (steps.cad1.outcome == 'failure' && steps.cad2.outcome == 'failure') }}
        with:
          version: '2026-08-04'
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Prepare the pinned CPU RTL and apply the branch and execute-stage patches
        run: |
          set -euo pipefail
          python3 -m pip install -q -r sw/requirements.txt
          python3 -m venv hw/.venv && hw/.venv/bin/pip install -q -r hw/requirements.txt
          for a in 1 2 3 4; do make soc-rtl-prepare INTERFACE_PYTHON="$PWD/hw/.venv/bin/python" > /tmp/prep.log 2>&1 && break; tail -30 /tmp/prep.log; [ $a = 4 ] && exit 1; echo "prepare attempt $a failed; retrying"; sleep 60; done
          mkdir -p out
          python3 hw/soc/flow/ibex_branch_2cycle.py hw/soc/gen out/br2
          diff -u hw/soc/gen/ibex_id_stage.v out/br2/ibex_id_stage.v > out/ibex_id_stage.br2.diff || true
          cat out/ibex_id_stage.br2.diff
          grep -n "branch_decision_i" hw/soc/gen/ibex_id_stage.v > out/branch_decision_uses.txt; cat out/branch_decision_uses.txt
          mkdir -p out/gen && cp hw/soc/gen/*.v out/gen/ && cp hw/soc/genp/ibex_top.v out/gen/ibex_top.genp.v
          python3 hw/soc/flow/ibex_ex_stage.py hw/soc/gen out/ex
          diff -u hw/soc/gen/ibex_core.v out/ex/ibex_core.v > out/ibex_core.ex.diff || true
          python3 hw/soc/flow/ibex_rf_predecode.py hw/soc/gen out/pre-only
          python3 hw/soc/flow/ibex_ex_stage.py out/pre-only out/pre-ex
          diff -u out/pre-only/ibex_core.v out/pre-ex/ibex_core.v > out/ibex_core.pre-ex.diff || true
          python3 hw/soc/flow/ibex_pmp_req_reg.py hw/soc/gen out/pmp
          diff -u hw/soc/gen/ibex_core.v out/pmp/ibex_core.v > out/ibex_core.pmp.diff || true
          python3 hw/soc/flow/ibex_pmp_req_reg.py out/pre-ex out/pre-ex-pmp
          diff -u out/pre-ex/ibex_core.v out/pre-ex-pmp/ibex_core.v > out/ibex_core.pre-ex-pmp.diff || true
          wc -l out/*.diff
      - name: Execute-stage core tests (hazard classes, interrupt/debug sweeps, single step, mutations)
        run: |
          set -o pipefail
          python3 -m pytest -q -rA --durations=15 sw/tests/test_ibex_ex_stage.py 2>&1 | tee out/test_ibex_ex_stage.log
      - name: Core-level branch tests (writeback hazard, branch-target ALU alone, two-cycle branches, execute stage)
        if: always()
        run: python3 -m pytest -q -rA sw/tests/test_ibex_branch_stall.py
      - name: Register-file and memory knob tests (golden model, hazards, injected upsets, existing suites with the knobs)
        if: always()
        run: |
          set -euo pipefail
          python3 -m pytest -q sw/tests/test_regfile_execute_knobs.py
          python3 hw/soc/flow/ibex_rf_predecode.py hw/soc/gen out/pre
          for f in ibex_if_stage ibex_core; do diff -u hw/soc/gen/$f.v out/pre/$f.v > out/$f.pre.diff || true; done
          cat out/ibex_if_stage.pre.diff out/ibex_core.pre.diff
          O=$PWD/out; cd hw/soc/tb/cocotb
          export PYTHONPATH=$GITHUB_WORKSPACE/sw:$GITHUB_WORKSPACE
          P=ibex_register_file_ff
          for cfg in "base:" "chkdefer:-DSOC_RF_EXEC -P$P.CHKDEFER=1" "corrpre_chkdefer:-DSOC_RF_EXEC -P$P.CORRPRE=1 -P$P.CHKDEFER=1"; do
            n=${cfg%%:*}; make -f Makefile.ibex_regfile_secded SIM_BUILD=sb_rf_$n COCOTB_RESULTS_FILE=$O/regfile_$n.xml EXTRA_COMPILE_ARGS="${cfg#*:}" > $O/regfile_$n.log 2>&1 || { tail -40 $O/regfile_$n.log; exit 1; }
            echo "regfile suite $n: $(grep -oE 'TESTS=[0-9]+ PASS=[0-9]+ FAIL=[0-9]+' $O/regfile_$n.log | tail -1)"
          done
          for r in 0 1 2; do for c in "byte:ECC_BYTE=1 RO=0" "word:ECC_BYTE=0 RO=1"; do
            n=${c%%:*}; X=; [ $r = 2 ] && X=-DSOC_MEM_RAWREG; make -f Makefile.soc_mem RDREG=$r ${c#*:} EXTRA_COMPILE_ARGS="$X" SIM_BUILD=sb_mem_${r}_$n COCOTB_RESULTS_FILE=$O/mem_${r}_$n.xml > $O/mem_${r}_$n.log 2>&1 || { tail -40 $O/mem_${r}_$n.log; exit 1; }
            echo "soc_mem suite RDREG=$r $n: $(grep -oE 'TESTS=[0-9]+ PASS=[0-9]+ FAIL=[0-9]+ SKIP=[0-9]+' $O/mem_${r}_$n.log | tail -1)"
          done; done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ibex-ex-stage-unit-${{ github.run_id }}
          path: out
          retention-days: 30

  regress:
    if: ${{ !inputs.probe_only && !inputs.unit_only && !contains(inputs.pcie_jobs, 'only') }}
    needs: unit
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: base}
          - {name: ex, ex: '1'}
          - {name: ex_exec, ex: '1', rf: '1', memreg: '2'}
          - {name: ex_exec_br2, ex: '1', rf: '1', memreg: '2', br2: '1'}
          - {name: ex_exec_pmpreg, ex: '1', rf: '1', memreg: '2', pmpreg: '1'}
          # docs/combined-timing.md: the same with the Ethernet FIFO read
          # register and the BUSSTAT pending-event register.
          - {name: ex_exec_pmpreg_cut, ex: '1', rf: '1', memreg: '2', pmpreg: '1', ethrd: '1', evpend: '1'}
          # docs/combined-timing.md section 10: plus the RAM self-test compare
          # register and the staged receive-queue commit.
          - {name: ex_exec_pmpreg_cut2, ex: '1', rf: '1', memreg: '2', pmpreg: '1', ethrd: '1', evpend: '1', mbistpipe: '1', rxstaged: '1'}
          # Section 12: the receive queue's read-ahead registers and the fabric's
          # own write-data register instead of the staged commit.
          - {name: ex_exec_pmpreg_cut4, ex: '1', rf: '1', memreg: '2', pmpreg: '1', ethrd: '1', evpend: '1', mbistpipe: '1', rxahead: '1', wdataown: '1'}
    env:
      RUN: ${{ inputs.variant == '' || contains(format(' {0} ', inputs.variant), format(' {0} ', matrix.name)) }}
      SOC_ETH_FIFO_RDREG: ${{ matrix.ethrd || '0' }}
      SOC_BUSSTAT_EVPEND: ${{ matrix.evpend || '0' }}
      SOC_SRAM_MBIST_PIPE: ${{ matrix.mbistpipe || '0' }}
      SOC_PCIE_RX_STAGED_COMMIT: ${{ matrix.rxstaged || '0' }}
      SOC_PCIE_RX_READ_AHEAD: ${{ matrix.rxahead || '0' }}
      SOC_BUS_WDATA_OWN: ${{ matrix.wdataown || '0' }}
      SOC_INTERFACE_PROFILE: base
      IBEX_EX_STAGE: ${{ matrix.ex || '0' }}
      IBEX_PMP_REQ_REG: ${{ matrix.pmpreg || '0' }}
      SOC_CORE_BT_ALU: ${{ matrix.btalu || '0' }}
      IBEX_BRANCH_2CYCLE: ${{ matrix.br2 || '0' }}
      # exec: deferred check bits, predecoded read address (with the
      # pre-mux correction it needs) and the raw-row memory register.
      SOC_RF_CHKDEFER: ${{ matrix.rf || '0' }}
      SOC_RF_PREDECODE: ${{ matrix.rf || '0' }}
      SOC_RF_CORRPRE: ${{ matrix.rf || '0' }}
      SOC_MEM_RDREG: ${{ matrix.memreg || '0' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        if: ${{ env.RUN == 'true' }}
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        if: ${{ env.RUN == 'true' }}
        with:
          python-version: '3.12'
      - name: Retry transient download failures
        if: ${{ env.RUN == 'true' }}
        run: printf 'retry = 10\nretry-delay = 30\nretry-all-errors\nfail\n' > ~/.curlrc
      - uses: YosysHQ/setup-oss-cad-suite@aefa8397bbf8fc6670a0a62af9805a89738f3cde
        if: ${{ env.RUN == 'true' }}
        id: cad1
        continue-on-error: true
        with:
          version: '2026-08-04'
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - run: sleep 180
        if: ${{ env.RUN == 'true' && ((steps.cad1.outcome == 'failure')) }}
      - uses: YosysHQ/setup-oss-cad-suite@aefa8397bbf8fc6670a0a62af9805a89738f3cde
        id: cad2
        if: ${{ env.RUN == 'true' && ((steps.cad1.outcome == 'failure')) }}
        continue-on-error: true
        with:
          version: '2026-08-04'
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - run: sleep 300
        if: ${{ env.RUN == 'true' && ((steps.cad1.outcome == 'failure' && steps.cad2.outcome == 'failure')) }}
      - uses: YosysHQ/setup-oss-cad-suite@aefa8397bbf8fc6670a0a62af9805a89738f3cde
        if: ${{ env.RUN == 'true' && ((steps.cad1.outcome == 'failure' && steps.cad2.outcome == 'failure')) }}
        with:
          version: '2026-08-04'
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Prepare processor, interfaces and firmware tools
        if: ${{ env.RUN == 'true' }}
        run: |
          set -euo pipefail
          echo "OSS_CAD_SUITE=$(dirname "$(dirname "$(command -v yosys)")")" >> "$GITHUB_ENV"
          python3 -m pip install -q -r sw/requirements.txt
          python3 -m venv hw/.venv && hw/.venv/bin/pip install -q -r hw/requirements.txt
          for a in 1 2 3 4; do make soc-prepare INTERFACE_PYTHON="$PWD/hw/.venv/bin/python" > /tmp/prep.log 2>&1 && break; tail -30 /tmp/prep.log; [ $a = 4 ] && exit 1; echo "prepare attempt $a failed; retrying"; sleep 60; done
      - name: Whole-SoC RTL boot, default configuration (make soc-sim)
        if: ${{ env.RUN == 'true' }}
        run: |
          set -o pipefail
          make soc-sim > soc-sim.log 2>&1; rc=$?; grep -E "^== |checks run|\[TB\]|cycles" soc-sim.log | tail -30; exit $rc
      - name: Boot regression, normal boot and both geometry fallbacks (make soc-boot-regression)
        if: ${{ env.RUN == 'true' }}
        run: make soc-boot-regression
      - name: Double fault, crash dump, reset and APB retention (make soc-crash-cocotb)
        if: ${{ env.RUN == 'true' }}
        run: |
          if [ "${{ matrix.name }}" = base ] || [ "${{ matrix.name }}" = ex ]; then make soc-crash-cocotb; exit; fi
          # The make target pins SOC_MEM_RDREG=1 SOC_RF_SYNPRE=1; the knobs
          # need SYNPRE=0. Same recipe, the knob's settings.
          B=$PWD/hw/soc/out/crash-cocotb
          SOC_REQ_REG=1 SW_DEFINES=-DCRASH_DUMP_DEMO SOC_VVP_ARGS=+allow_double_fault bash hw/soc/flow/sim_soc.sh $B
          bash scripts/check_soc_crash_cocotb.sh $B
      - name: Collect
        if: ${{ env.RUN == 'true' && (always()) }}
        run: |
          mkdir -p out
          cp soc-sim.log out/ 2>/dev/null || true
          cp -r hw/soc/out/boot-regression out/ 2>/dev/null || true
          for d in hw/soc/out/crash-cocotb hw/soc/out/sim-soc; do
            [ -d "$d" ] || continue; mkdir -p out/$(basename $d); cp $d/*.log $d/*.xml $d/soc_param_override.v out/$(basename $d)/ 2>/dev/null || true; done
          find out -name '*.vvp' -delete
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ env.RUN == 'true' && (always()) }}
        with:
          name: ibex-ex-stage-regress-${{ matrix.name }}-${{ github.run_id }}
          path: out
          retention-days: 30

  native-boot:
    if: ${{ !inputs.probe_only && !inputs.unit_only && !contains(inputs.pcie_jobs, 'only') }}
    needs: unit
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          # The MBIST boot (983,040 MBIST cycles before the firmware) needs
          # about 1.85 M gate-level cycles at MEM_RDREG = 2 and does not fit
          # the hosted job's wall clock; the same boot without MBIST does.
          - {name: ex_exec, ex: '1', rf: '1', memreg: '2', gate: corrpre-pcie}
          - {name: ex_exec_br2, ex: '1', rf: '1', memreg: '2', br2: '1', gate: corrpre-pcie}
          # The data request register with its PMP verdict (docs/ibex-ex-stage.md
          # section 7) on the best execute-path combination.
          - {name: ex_exec_pmpreg, ex: '1', rf: '1', memreg: '2', pmpreg: '1', gate: corrpre-pcie}
          # docs/combined-timing.md: the same with the Ethernet FIFO read
          # register and the BUSSTAT pending-event register.
          - {name: ex_exec_pmpreg_cut, ex: '1', rf: '1', memreg: '2', pmpreg: '1', ethrd: '1', evpend: '1', gate: corrpre-pcie}
          - {name: ex_exec_pmpreg_cut2, ex: '1', rf: '1', memreg: '2', pmpreg: '1', ethrd: '1', evpend: '1', mbistpipe: '1', rxstaged: '1', gate: corrpre-pcie}
          - {name: ex_exec_pmpreg_cut4, ex: '1', rf: '1', memreg: '2', pmpreg: '1', ethrd: '1', evpend: '1', mbistpipe: '1', rxahead: '1', wdataown: '1', gate: corrpre-pcie}
          # The system and Ethernet MBIST gate-level boot with every knob of
          # docs/combined-timing.md on the execute stage alone (one-cycle
          # memory reads, the configuration whose MBIST boot fits the job).
          # The registered RAM self-test compare adds 327,680 self-test cycles and the
          # execute stage about 8%; the 2,000,000-cycle default ended at check 24 of 28.
          - {name: ex_mbist_cut2, ex: '1', ethrd: '1', evpend: '1', mbistpipe: '1', rxstaged: '1', cycles: '2600000'}
          # The execute stage alone keeps one-cycle memory reads, so the
          # MBIST boot may fit the wall clock (1.64 M cycles took 9413 s with
          # two-cycle branches).
          - {name: ex_mbist, ex: '1'}
    env:
      RUN: ${{ inputs.variant == '' || contains(format(' {0} ', inputs.variant), format(' {0} ', matrix.name)) }}
      SOC_ETH_FIFO_RDREG: ${{ matrix.ethrd || '0' }}
      SOC_BUSSTAT_EVPEND: ${{ matrix.evpend || '0' }}
      SOC_SRAM_MBIST_PIPE: ${{ matrix.mbistpipe || '0' }}
      NATIVE_BOOT_CYCLES: ${{ matrix.cycles || '2000000' }}
      SOC_PCIE_RX_STAGED_COMMIT: ${{ matrix.rxstaged || '0' }}
      SOC_PCIE_RX_READ_AHEAD: ${{ matrix.rxahead || '0' }}
      SOC_BUS_WDATA_OWN: ${{ matrix.wdataown || '0' }}
      SOC_INTERFACE_PROFILE: full
      IBEX_EX_STAGE: ${{ matrix.ex || '0' }}
      IBEX_PMP_REQ_REG: ${{ matrix.pmpreg || '0' }}
      GATE: ${{ matrix.gate || 'corrpre-pcie-mbist' }}
      SOC_CORE_REQ_REG: '0'
      SOC_CORE_WB_STAGE: '0'
      SOC_CORE_BT_ALU: ${{ matrix.btalu || '0' }}
      IBEX_BRANCH_2CYCLE: ${{ matrix.br2 || '0' }}
      NATIVE_RF_CHKDEFER: ${{ matrix.rf || '0' }}
      NATIVE_RF_PREDECODE: ${{ matrix.rf || '0' }}
      NATIVE_MEM_RDREG: ${{ matrix.memreg || '1' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        if: ${{ env.RUN == 'true' }}
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        if: ${{ env.RUN == 'true' }}
        with:
          python-version: '3.12'
      - name: Retry transient download failures
        if: ${{ env.RUN == 'true' }}
        run: printf 'retry = 10\nretry-delay = 30\nretry-all-errors\nfail\n' > ~/.curlrc
      - uses: YosysHQ/setup-oss-cad-suite@aefa8397bbf8fc6670a0a62af9805a89738f3cde
        if: ${{ env.RUN == 'true' }}
        id: cad1
        continue-on-error: true
        with:
          version: '2026-08-04'
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - run: sleep 180
        if: ${{ env.RUN == 'true' && ((steps.cad1.outcome == 'failure')) }}
      - uses: YosysHQ/setup-oss-cad-suite@aefa8397bbf8fc6670a0a62af9805a89738f3cde
        id: cad2
        if: ${{ env.RUN == 'true' && ((steps.cad1.outcome == 'failure')) }}
        continue-on-error: true
        with:
          version: '2026-08-04'
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - run: sleep 300
        if: ${{ env.RUN == 'true' && ((steps.cad1.outcome == 'failure' && steps.cad2.outcome == 'failure')) }}
      - uses: YosysHQ/setup-oss-cad-suite@aefa8397bbf8fc6670a0a62af9805a89738f3cde
        if: ${{ env.RUN == 'true' && ((steps.cad1.outcome == 'failure' && steps.cad2.outcome == 'failure')) }}
        with:
          version: '2026-08-04'
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Prepare exact digital inputs
        if: ${{ env.RUN == 'true' }}
        run: |
          echo "OSS_CAD_SUITE=$(dirname "$(dirname "$(command -v yosys)")")" >> "$GITHUB_ENV"
          python3 -m pip install -q -r sw/requirements.txt
          for a in 1 2 3 4; do make soc-prepare > /tmp/prep.log 2>&1 && break; tail -30 /tmp/prep.log; [ $a = 4 ] && exit 1; echo "prepare attempt $a failed; retrying"; sleep 60; done
      - name: Native CORRPRE, PCIe, system MBIST and Ethernet MBIST gate-level boot
        if: ${{ env.RUN == 'true' }}
        run: bash scripts/check_soc_${GATE//-/_}_native_boot.sh
      - name: Show the selected core and the gate-level verdict
        if: ${{ env.RUN == 'true' && (always()) }}
        run: |
          O=hw/soc/out/$GATE-native-boot
          cat $O/core-configuration.json || true
          grep -E "core_bt_alu|branch_2cycle|ex_stage=|pmp_req_reg=|chkdefer=|genp/gen-br2|genp/gen-pre|genp/gen-ex|genp/gen-pmp|Parameter .(CHKDEFER|RDPRE|MEM_RDREG)" $O/synthesis-driver.log $O/synthesis/syn.log | head -10 || true
          grep -E "^== |checks run|\[TB\]" $O/rtl-driver.log | tail -10 || true
          tail -30 $O/gates-driver.log || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ env.RUN == 'true' && (always()) }}
        with:
          name: ibex-ex-stage-native-boot-${{ matrix.name }}-${{ github.run_id }}
          path: |
            hw/soc/out/*-native-boot/**/*.log
            hw/soc/out/*-native-boot/**/*.json
            hw/soc/out/*-native-boot/rtl/soc_param_override.v
          retention-days: 30

  probe:
    needs: unit
    if: ${{ !inputs.unit_only && !inputs.rvformal_only && !contains(inputs.pcie_jobs, 'only') }}
    runs-on: ubuntu-22.04
    timeout-minutes: 355
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: r4_base, overrides: '{"PL_TARGET_DENSITY_PCT": 70}', prefix: '1', deep: '1'}
          - {name: r4_ex, overrides: '{"PL_TARGET_DENSITY_PCT": 70}', prefix: '1', deep: '1', ex: '1'}
          - {name: r4_ex_exec, overrides: '{"PL_TARGET_DENSITY_PCT": 70}', prefix: '1', deep: '1', ex: '1', chkdefer: '1', memreg: '2', predecode: '1'}
          - {name: r4_ex_exec_br2, overrides: '{"PL_TARGET_DENSITY_PCT": 70}', prefix: '1', deep: '1', ex: '1', chkdefer: '1', memreg: '2', predecode: '1', br2: '1'}
          - {name: r4_ex_exec_pmpreg, overrides: '{"PL_TARGET_DENSITY_PCT": 70}', prefix: '1', deep: '1', ex: '1', chkdefer: '1', memreg: '2', predecode: '1', pmpreg: '1'}
          # timing/combined: the best Ibex knobs (execute stage, CHKDEFER,
          # predecode, MEM_RDREG = 2, the data request register) with this
          # branch's pipelined PCIe RTL, at two densities, with the PCIe path trace.
          - {name: c_ex_exec_pmpreg_d70, overrides: '{"PL_TARGET_DENSITY_PCT": 70}', prefix: '1', deep: '1', ex: '1', chkdefer: '1', memreg: '2', predecode: '1', pmpreg: '1', pcie_trace: '1'}
          - {name: c_ex_exec_pmpreg_d68, overrides: '{"PL_TARGET_DENSITY_PCT": 68}', prefix: '1', deep: '1', ex: '1', chkdefer: '1', memreg: '2', predecode: '1', pmpreg: '1', pcie_trace: '1'}
          # docs/combined-timing.md: the same plus the Ethernet FIFO read
          # register (SOC_ETH_FIFO_RDREG) and the BUSSTAT pending-event
          # register (SOC_BUSSTAT_EVPEND); then the same netlist with
          # timing-driven global placement (routability-driven is already
          # the flow's default). Everything else is identical.
          - {name: c_cut_d70, overrides: '{"PL_TARGET_DENSITY_PCT": 70}', prefix: '1', deep: '1', ex: '1', chkdefer: '1', memreg: '2', predecode: '1', pmpreg: '1', pcie_trace: '1', ethrd: '1', evpend: '1'}
          - {name: c_cut_d68, overrides: '{"PL_TARGET_DENSITY_PCT": 68}', prefix: '1', deep: '1', ex: '1', chkdefer: '1', memreg: '2', predecode: '1', pmpreg: '1', pcie_trace: '1', ethrd: '1', evpend: '1'}
          - {name: c_cut_td_d70, overrides: '{"PL_TARGET_DENSITY_PCT": 70, "PL_TIMING_DRIVEN": true}', prefix: '1', deep: '1', ex: '1', chkdefer: '1', memreg: '2', predecode: '1', pmpreg: '1', pcie_trace: '1', ethrd: '1', evpend: '1'}
          - {name: c_cut_td_d68, overrides: '{"PL_TARGET_DENSITY_PCT": 68, "PL_TIMING_DRIVEN": true}', prefix: '1', deep: '1', ex: '1', chkdefer: '1', memreg: '2', predecode: '1', pmpreg: '1', pcie_trace: '1', ethrd: '1', evpend: '1'}
          # Routed measurement (docs/combined-timing.md section 9): the same
          # as c_cut_td_*, and the repaired database continues in the jobs
          # route (detailed routing) and routed-sta (OpenRCX, OpenSTA).
          - {name: r_cut_td_d70, overrides: '{"PL_TARGET_DENSITY_PCT": 70, "PL_TIMING_DRIVEN": true}', prefix: '1', deep: '1', ex: '1', chkdefer: '1', memreg: '2', predecode: '1', pmpreg: '1', pcie_trace: '1', ethrd: '1', evpend: '1', route: '1'}
          - {name: r_cut_td_d68, overrides: '{"PL_TARGET_DENSITY_PCT": 68, "PL_TIMING_DRIVEN": true}', prefix: '1', deep: '1', ex: '1', chkdefer: '1', memreg: '2', predecode: '1', pmpreg: '1', pcie_trace: '1', ethrd: '1', evpend: '1', route: '1'}
          # Section 10: the routed configuration plus the RAM self-test compare
          # register and the staged receive-queue commit.
          - {name: r_cut2_td_d68, overrides: '{"PL_TARGET_DENSITY_PCT": 68, "PL_TIMING_DRIVEN": true}', prefix: '1', deep: '1', ex: '1', chkdefer: '1', memreg: '2', predecode: '1', pmpreg: '1', pcie_trace: '1', ethrd: '1', evpend: '1', mbistpipe: '1', rxstaged: '1', route: '1'}
          - {name: r_cut2_td_d70, overrides: '{"PL_TARGET_DENSITY_PCT": 70, "PL_TIMING_DRIVEN": true}', prefix: '1', deep: '1', ex: '1', chkdefer: '1', memreg: '2', predecode: '1', pmpreg: '1', pcie_trace: '1', ethrd: '1', evpend: '1', mbistpipe: '1', rxstaged: '1', route: '1'}
          # Section 11: the same knobs at d68 after the round-three changes
          # (registered expected word, one-hot queue write position), with
          # and without the staged receive-queue commit.
          - {name: r_cut3_td_d68, overrides: '{"PL_TARGET_DENSITY_PCT": 68, "PL_TIMING_DRIVEN": true}', prefix: '1', deep: '1', ex: '1', chkdefer: '1', memreg: '2', predecode: '1', pmpreg: '1', pcie_trace: '1', ethrd: '1', evpend: '1', mbistpipe: '1', rxstaged: '1', route: '1'}
          - {name: r_cut3n_td_d68, overrides: '{"PL_TARGET_DENSITY_PCT": 68, "PL_TIMING_DRIVEN": true}', prefix: '1', deep: '1', ex: '1', chkdefer: '1', memreg: '2', predecode: '1', pmpreg: '1', pcie_trace: '1', ethrd: '1', evpend: '1', mbistpipe: '1', rxstaged: '0', route: '1'}
          # Same as r_cut3n_td_d68 with no extra hold-repair margin during placement and global route
          # (flow setting; post-route hold is still reported on the extracted parasitics).
          - {name: r_cut3h_td_d68, overrides: '{"PL_TARGET_DENSITY_PCT": 68, "PL_TIMING_DRIVEN": true, "PL_RESIZER_HOLD_SLACK_MARGIN": 0.0, "GRT_RESIZER_HOLD_SLACK_MARGIN": 0.0}', prefix: '1', deep: '1', ex: '1', chkdefer: '1', memreg: '2', predecode: '1', pmpreg: '1', pcie_trace: '1', ethrd: '1', evpend: '1', mbistpipe: '1', rxstaged: '0', route: '1'}
          # Section 12: r_cut3h_td_d68 plus the receive queue's read-ahead registers
          # and the fabric's own write-data register; after routing, the job
          # route-hold repairs hold on the extracted routed wires and routes again.
          - {name: r_cut4h_td_d68, overrides: '{"PL_TARGET_DENSITY_PCT": 68, "PL_TIMING_DRIVEN": true, "PL_RESIZER_HOLD_SLACK_MARGIN": 0.0, "GRT_RESIZER_HOLD_SLACK_MARGIN": 0.0}', prefix: '1', deep: '1', ex: '1', chkdefer: '1', memreg: '2', predecode: '1', pmpreg: '1', pcie_trace: '1', ethrd: '1', evpend: '1', mbistpipe: '1', rxstaged: '0', rxahead: '1', wdataown: '1', route: '1'}
          # Intermediate pre-route hold margins (flow defaults 0.1 / 0.05; 0 / 0 left -0.07 ns fast-corner hold after routing).
          - {name: r_cut3m_td_d68, overrides: '{"PL_TARGET_DENSITY_PCT": 68, "PL_TIMING_DRIVEN": true, "PL_RESIZER_HOLD_SLACK_MARGIN": 0.05, "GRT_RESIZER_HOLD_SLACK_MARGIN": 0.03}', prefix: '1', deep: '1', ex: '1', chkdefer: '1', memreg: '2', predecode: '1', pmpreg: '1', pcie_trace: '1', ethrd: '1', evpend: '1', mbistpipe: '1', rxstaged: '0', route: '1'}
          - {name: r_cut4m_td_d68, overrides: '{"PL_TARGET_DENSITY_PCT": 68, "PL_TIMING_DRIVEN": true, "PL_RESIZER_HOLD_SLACK_MARGIN": 0.05, "GRT_RESIZER_HOLD_SLACK_MARGIN": 0.03}', prefix: '1', deep: '1', ex: '1', chkdefer: '1', memreg: '2', predecode: '1', pmpreg: '1', pcie_trace: '1', ethrd: '1', evpend: '1', mbistpipe: '1', rxstaged: '0', rxahead: '1', wdataown: '1', route: '1'}
          # timing/pcie-pipeline's probe (its default probe_matrix): upstream
          # register file, no Ibex knobs, the PCIe path trace. pcie_rtl_ref
          # (optional) takes hw/soc/rtl/pcie from another ref instead.
          - {name: pcie_rfup_d70_ks, overrides: '{"PL_TARGET_DENSITY_PCT": 70}', prefix: '1', regfile: upstream, pcie_trace: '1'}
          - {name: pcie_deep_rfup_d70_ks, overrides: '{"PL_TARGET_DENSITY_PCT": 70}', prefix: '1', regfile: upstream, deep: '1', pcie_trace: '1'}
    env:
      GH_TOKEN: ${{ github.token }}
      APPIMAGE_SHA: d6a349ec65be11456e96c4981d35f63ca34d3c85daf79a51e1ccb907bb5d7466
      PACKAGE_SHA: 822dab7067d901fa79dabffffff784baf5c9965f0a5091eba67acdc48b9956f4
      SOC_INTERFACE_PROFILE: full
      SOC_CORE_REQ_REG: '0'
      SOC_CORE_WB_STAGE: '0'
      SOC_SYNTH_PREFIX_ADDER: ${{ matrix.prefix || '0' }}
      SOC_CORE_BT_ALU: ${{ matrix.btalu || '0' }}
      IBEX_BRANCH_2CYCLE: ${{ matrix.br2 || '0' }}
      KNOB_CHKDEFER: ${{ matrix.chkdefer || '0' }}
      KNOB_PREDECODE: ${{ matrix.predecode || '0' }}
      KNOB_RDRAW: ${{ matrix.rdraw || '0' }}
      KNOB_MEMREG: ${{ matrix.memreg || '1' }}
      IBEX_EX_STAGE: ${{ matrix.ex || '0' }}
      IBEX_PMP_REQ_REG: ${{ matrix.pmpreg || '0' }}
      SOC_ETH_FIFO_RDREG: ${{ matrix.ethrd || '0' }}
      SOC_BUSSTAT_EVPEND: ${{ matrix.evpend || '0' }}
      SOC_SRAM_MBIST_PIPE: ${{ matrix.mbistpipe || '0' }}
      SOC_PCIE_RX_STAGED_COMMIT: ${{ matrix.rxstaged || '0' }}
      SOC_PCIE_RX_READ_AHEAD: ${{ matrix.rxahead || '0' }}
      SOC_BUS_WDATA_OWN: ${{ matrix.wdataown || '0' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        if: ${{ (inputs.probe_variant == '' || contains(format(' {0} ', inputs.probe_variant), format(' {0} ', matrix.name))) }}
        with:
          persist-credentials: false
      - name: PCIe RTL from another ref (matrix pcie_rtl_ref; this branch's pipelined PCIe RTL otherwise)
        if: ${{ (inputs.probe_variant == '' || contains(format(' {0} ', inputs.probe_variant), format(' {0} ', matrix.name))) && matrix.pcie_rtl_ref }}
        run: |
          git fetch -q https://github.com/${{ github.repository }}.git ${{ matrix.pcie_rtl_ref }}
          git checkout FETCH_HEAD -- hw/soc/rtl/pcie
          echo "PCIe RTL from ${{ matrix.pcie_rtl_ref }}"; sha256sum hw/soc/rtl/pcie/soc_pcie_*.v | sha256sum
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        if: ${{ (inputs.probe_variant == '' || contains(format(' {0} ', inputs.probe_variant), format(' {0} ', matrix.name))) }}
        with:
          python-version: '3.12'
      - name: Retry transient download failures
        if: ${{ ((inputs.probe_variant == '' || contains(format(' {0} ', inputs.probe_variant), format(' {0} ', matrix.name)))) }}
        run: printf 'retry = 10\nretry-delay = 30\nretry-all-errors\nfail\n' > ~/.curlrc
      - uses: YosysHQ/setup-oss-cad-suite@aefa8397bbf8fc6670a0a62af9805a89738f3cde
        id: cad1
        if: ${{ ((inputs.probe_variant == '' || contains(format(' {0} ', inputs.probe_variant), format(' {0} ', matrix.name)))) }}
        continue-on-error: true
        with:
          version: '2026-08-04'
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - run: sleep 180
        if: ${{ ((inputs.probe_variant == '' || contains(format(' {0} ', inputs.probe_variant), format(' {0} ', matrix.name)))) && (steps.cad1.outcome == 'failure') }}
      - uses: YosysHQ/setup-oss-cad-suite@aefa8397bbf8fc6670a0a62af9805a89738f3cde
        id: cad2
        if: ${{ ((inputs.probe_variant == '' || contains(format(' {0} ', inputs.probe_variant), format(' {0} ', matrix.name)))) && (steps.cad1.outcome == 'failure') }}
        continue-on-error: true
        with:
          version: '2026-08-04'
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - run: sleep 300
        if: ${{ ((inputs.probe_variant == '' || contains(format(' {0} ', inputs.probe_variant), format(' {0} ', matrix.name)))) && (steps.cad1.outcome == 'failure' && steps.cad2.outcome == 'failure') }}
      - uses: YosysHQ/setup-oss-cad-suite@aefa8397bbf8fc6670a0a62af9805a89738f3cde
        if: ${{ ((inputs.probe_variant == '' || contains(format(' {0} ', inputs.probe_variant), format(' {0} ', matrix.name)))) && (steps.cad1.outcome == 'failure' && steps.cad2.outcome == 'failure') }}
        with:
          version: '2026-08-04'
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Prepare digital inputs, firmware and the native synthesis (same settings as the boot candidate)
        if: ${{ (inputs.probe_variant == '' || contains(format(' {0} ', inputs.probe_variant), format(' {0} ', matrix.name))) }}
        run: |
          set -euo pipefail
          export OSS_CAD_SUITE="$(dirname "$(dirname "$(command -v yosys)")")"
          echo "OSS_CAD_SUITE=$OSS_CAD_SUITE" >> "$GITHUB_ENV"
          python3 -m pip install -q -r sw/requirements.txt
          for a in 1 2 3 4; do make soc-prepare > /tmp/soc-prepare.log 2>&1 && break; tail -30 /tmp/soc-prepare.log; [ $a = 4 ] && exit 1; echo "prepare attempt $a failed; retrying"; sleep 60; done
          OUT=$PWD/hw/soc/out/impl-probe; mkdir -p $OUT
          export SOC_SRAM_MBIST=1
          python3 hw/soc/flow/prepare_ihp_native_boot.py > $OUT/prepare-models.log
          export PDK_ROOT="$PWD/hw/soc/tools/ihp-native-boot-c4b8b4e"
          eval "$(make --no-print-directory -f hw/soc/tools.soc.mk printvars)"
          unset BOOT_CORRUPT SW_DEFINES SOC_VVP_ARGS SOC_BOOT_ROM_DIR SOC_BOOT_ROM_IMAGE
          unset SOC_RAM_RDREG SOC_ROM_RDREG SOC_SCRUB_IVL SOC_DED_WORD SOC_STRAP SOC_TIMEOUT_CYCLES
          export UART_SCALER=0 SOC_PROBE=0 SOC_RAM_RANDOM=1 SOC_CLKGATE=1 SOC_APB_TIMEOUT=256
          export IBEX_REGFILE=secded IBEX_FAULT_PORT=1 SOC_MEM_HARDEN=1 SOC_ROM_HARDEN=1
          export SOC_BOOT_ROM=logic SOC_MEM_RDREG=1 SOC_REQ_REG=1 SOC_RF_SYNPRE=0 SOC_RF_CORRPRE=1 SOC_WAKE_GNT=1
          # docs/ibex-execute-timing.md knobs. RDRAW (measurement) replaces CORRPRE.
          CORR=1; [ "$KNOB_RDRAW" = 1 ] && CORR=0
          export SOC_MEM_RDREG=$KNOB_MEMREG SOC_RF_CORRPRE=$CORR SOC_RF_CHKDEFER=$KNOB_CHKDEFER SOC_RF_PREDECODE=$KNOB_PREDECODE SOC_RF_RDRAW=$KNOB_RDRAW
          timeout 1800 bash hw/soc/flow/sim_soc.sh "$OUT/rtl" > "$OUT/rtl-driver.log" 2>&1 || { tail -40 "$OUT/rtl-driver.log"; exit 1; }
          grep -E "^== |checks run|\[TB\] PASS" "$OUT/rtl-driver.log" | tail -12
          export SOC_BOOT_ROM_IMAGE="$OUT/rtl/test_soc.bin" SOC_MEM=sram
          export IBEX_RF_SYNPRE=0 IBEX_RF_CORRPRE=1 SOC_ETH_SRAM=1 SOC_PCIE_PROFILE=packet-async
          export IBEX_RF_CORRPRE=$CORR IBEX_RF_CHKDEFER=$KNOB_CHKDEFER IBEX_RF_PREDECODE=$KNOB_PREDECODE IBEX_RF_RDRAW=$KNOB_RDRAW
          # Measurement only: regfile=upstream drops the register file's inline
          # SECDED (the fault port is tied to zero by ibex_fault_port.py).
          if [ "${{ matrix.regfile || 'secded' }}" = upstream ]; then export IBEX_REGFILE=upstream IBEX_RF_CORRPRE=0; fi
          timeout 3600 bash hw/soc/flow/syn_soc_top.sh 20 "$OUT/synthesis" > "$OUT/synthesis-driver.log" 2>&1 || { tail -40 "$OUT/synthesis-driver.log"; exit 1; }
          grep -E 'regfile=|core_req_reg=|eth_fifo_rdreg=|Parameter .(CORRPRE|CHKDEFER|RDPRE|RDRAW|MEM_RDREG|CORE_BT_ALU|RAM_PIPELINE) =|pmp_req_reg=|genp/gen-(br2|pre|ex|pre-ex|pmp|ex-pmp|pre-pmp|pre-ex-pmp)/' "$OUT/synthesis/syn.log" "$OUT/synthesis-driver.log" | sort -u | head -12 || true
          sha256sum $OUT/synthesis/soc_top.netlist.v $OUT/rtl/test_soc.bin
          grep -iE "Number of cells|Chip area" $OUT/synthesis/syn.log | tail -3 || true
      - name: LibreLane AppImage and the verified PDK from the post-route input package
        if: ${{ (inputs.probe_variant == '' || contains(format(' {0} ', inputs.probe_variant), format(' {0} ', matrix.name))) }}
        run: |
          set -euo pipefail
          for a in 1 2 3 4 5 6; do sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends libfuse2 && break; [ $a = 6 ] && exit 1; echo "apt attempt $a failed; retrying"; sleep 90; done
          W=/mnt/s; sudo mkdir -p $W; sudo chown $USER $W
          curl -fsSL -o $W/librelane.AppImage https://github.com/librelane/librelane/releases/download/3.0.5/librelane-devshell-x86_64.AppImage
          echo "$APPIMAGE_SHA  $W/librelane.AppImage" | sha256sum -c -; chmod +x $W/librelane.AppImage
          for attempt in 1 2 3 4 5 6; do
            gh api repos/${{ github.repository }}/releases/assets/663146895 -H "Accept: application/octet-stream" > $W/pkg.tgz && echo "$PACKAGE_SHA  $W/pkg.tgz" | sha256sum -c - && break
            sleep 60
          done
          echo "$PACKAGE_SHA  $W/pkg.tgz" | sha256sum -c -
          mkdir -p $W/pkg && tar -xzf $W/pkg.tgz -C $W/pkg && rm $W/pkg.tgz
          P=$(dirname "$(find $W/pkg -name input-contract.json | head -1)")
          python3 - "$P" <<'PY'
          import hashlib,json,shutil,sys
          from pathlib import Path
          p=Path(sys.argv[1]);c=json.loads((p/'input-contract.json').read_text());n=0
          for name,row in c['input_files'].items():
              if not name.startswith('hw/soc/tools/ciel-corrpre/'):continue
              src=p/'files'/name;dst=Path(name)
              assert hashlib.sha256(src.read_bytes()).hexdigest()==row['sha256']
              if not dst.exists():dst.parent.mkdir(parents=True,exist_ok=True);shutil.copyfile(src,dst);n+=1
          print('restored PDK files',n)
          PY
      - name: Floorplan to antenna repair (no detailed routing), configuration overrides ${{ matrix.overrides }}
        if: ${{ (inputs.probe_variant == '' || contains(format(' {0} ', inputs.probe_variant), format(' {0} ', matrix.name))) }}
        run: |
          set -euo pipefail
          OUT=$PWD/hw/soc/out/impl-probe; W=/mnt/s
          python3 -B scripts/impl_probe.py prepare $OUT/synthesis/soc_top.mapped.json $OUT/synthesis/soc_top.netlist.v $OUT/prepared '${{ matrix.overrides }}'
          mkdir -p $OUT/run
          env -u GH_TOKEN -u GITHUB_TOKEN $W/librelane.AppImage python hw/soc/pnr/pcie_interface_flow.py --flow PacketInterfaces \
            --pdk-root $PWD/hw/soc/tools/ciel-corrpre --pdk ihp-sg13g2 --scl sg13g2_stdcell --force-run-dir $OUT/run \
            --from Yosys.JsonHeader --to OpenROAD.DetailedRouting --skip OpenROAD.DetailedRouting \
            --skip Yosys.Synthesis --skip Checker.YosysUnmappedCells --skip Checker.YosysSynthChecks --skip Checker.NetlistAssignStatements \
            --with-initial-state $OUT/prepared/state.json $OUT/prepared/config.json > $OUT/run.log 2>&1 || { echo "FLOW_FAILED"; tail -80 $OUT/run.log; }
          python3 -B scripts/impl_probe.py collect $OUT/run $OUT/metrics.json
          # The placement commands actually run (timing- and routability-driven flags).
          grep -a -E "^\+ global_placement" $OUT/run.log | sed 's/  */ /g' | head -4 || true
      - name: Per-corner setup and hold on the post-global-route database
        if: ${{ (inputs.probe_variant == '' || contains(format(' {0} ', inputs.probe_variant), format(' {0} ', matrix.name))) }}
        run: |
          set -euo pipefail
          OUT=$PWD/hw/soc/out/impl-probe; W=/mnt/s
          python3 -B scripts/impl_probe.py sta_tcl $OUT/run $OUT/prepared $OUT/corner-sta.tcl
          if [ "${{ matrix.pcie_trace || '0' }}" = 1 ]; then
            # Path tracing (timing/pcie-pipeline): the 300 worst slow-corner
            # pcie_clk_i endpoints with full paths, after the per-corner reports
            # (the deep repair's script is derived from this one and repeats it).
            printf '%s\n' 'puts "NSSOC_CORNER_TRACE_BEGIN"' \
              'report_checks -corner nom_slow_1p08V_125C -path_delay max -path_group pcie_clk_i -group_path_count 300 -endpoint_path_count 1 -fields {cap slew fanout} -digits 3' \
              'puts "NSSOC_CORNER_TRACE_END"' >> $OUT/corner-sta.tcl
          fi
          env -u GH_TOKEN -u GITHUB_TOKEN $W/librelane.AppImage openroad -exit $OUT/corner-sta.tcl > $OUT/corner-sta.log 2>&1 || echo "CORNER_STA_FAILED"
          grep -a -E "NSSOC_CORNER|slack|Error|ERROR" $OUT/corner-sta.log | grep -av "^\s*$" | head -120 || true
      - name: Tie the capped slow-corner pcie_clk_i paths to RTL registers
        if: ${{ (inputs.probe_variant == '' || contains(format(' {0} ', inputs.probe_variant), format(' {0} ', matrix.name))) && (matrix.pcie_trace == '1') }}
        run: |
          OUT=$PWD/hw/soc/out/impl-probe
          sed -n '/^NSSOC_CORNER_TRACE_BEGIN/,/^NSSOC_CORNER_TRACE_END/p' $OUT/corner-sta.log > $OUT/capped-pcie-slow.rpt
          python3 -B scripts/pcie_timing/trace_paths.py $OUT/synthesis/soc_top.mapped.json $OUT/capped-pcie-slow.rpt $OUT/capped-trace 10 $OUT/flop-map.tsv || echo "TRACE_FAILED"
          mkdir -p capped; cp $OUT/capped-trace.* $OUT/capped-pcie-slow.rpt $OUT/corner-sta.log capped/ 2>/dev/null || true
          gzip -c $OUT/flop-map.tsv > capped/flop-map.tsv.gz 2>/dev/null || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ (inputs.probe_variant == '' || contains(format(' {0} ', inputs.probe_variant), format(' {0} ', matrix.name))) && (matrix.pcie_trace == '1') }}
        with:
          name: impl-probe-capped-${{ matrix.name }}-${{ github.run_id }}
          path: capped
          retention-days: 30
      - name: Uncapped setup repair on the post-global-route database (measurement)
        if: ${{ (inputs.probe_variant == '' || contains(format(' {0} ', inputs.probe_variant), format(' {0} ', matrix.name))) && (matrix.deep == '1') }}
        run: |
          set +e
          OUT=$PWD/hw/soc/out/impl-probe; W=/mnt/s
          # The flow's repair_timing runs with -max_iterations 100 and stops with
          # RSZ-0062. Here the same database, libraries, SDC, LAYERS_RC and
          # global-route parasitics get repair_design and an uncapped setup
          # repair (wall-clock bound only), then the same per-corner reports.
          echo "repair_timing -max_iterations ${{ inputs.repair_iterations || '1000000' }}"
          python3 - $OUT/corner-sta.tcl $OUT/deep-repair.tcl <<'PY'
          import sys
          s=open(sys.argv[1]).read();i=s.index('puts "NSSOC_CORNER_BEGIN')
          rep=('set_wire_rc -signal -layer Metal3\nset_wire_rc -clock -layer Metal4\n'
               'repair_design -verbose\nestimate_parasitics -global_routing\n'
               'repair_timing -verbose -setup -setup_margin 0 -repair_tns 100 -max_iterations ${{ inputs.repair_iterations || '1000000' }} -max_buffer_percent 50\n'
               'estimate_parasitics -global_routing\nputs "NSSOC_DEEP_REPAIR_DONE"\n')
          if '${{ matrix.route || '0' }}' == '1':
              # The routed measurement continues from the repaired database.
              rep+='write_db '+sys.argv[2].rsplit('/',1)[0]+'/deep-repaired.odb\nputs "NSSOC_DEEP_DB_WRITTEN"\n'
          tail=s[i:].replace('NSSOC_CORNER_','NSSOC_DEEP_CORNER_')
          if '${{ inputs.path_nets }}' == 'true':
              tail+=('puts "NSSOC_NETS_BEGIN"\n'
                     'report_checks -corner nom_slow_1p08V_125C -path_delay max -group_path_count 10 -fields {net fanout} -digits 3\n'
                     'puts "NSSOC_NETS_END"\n'
                     # Flip-flop instance -> output net, to name the $auto endpoints.
                     'set err {}\n'
                     'catch { foreach c [get_cells -filter {ref_name =~ sg13g2_df*}] { foreach p [get_pins -quiet -of_objects $c -filter {direction == output}] { set n [get_nets -quiet -of_objects $p]; if {[llength $n]} { puts "NSSOC_FF [get_full_name $c] [get_full_name $n]" } } } } err\n'
                     'puts "NSSOC_FFMAP_END $err"\n')
          open(sys.argv[2],'w').write(s[:i]+rep+tail)
          PY
          timeout 12600 env -u GH_TOKEN -u GITHUB_TOKEN $W/librelane.AppImage openroad -exit $OUT/deep-repair.tcl > $OUT/deep-repair.log 2>&1; echo "DEEP_RC=$?"
          grep -a -E "NSSOC_DEEP|slack \(|RSZ-00(4|5|6)|^ +[0-9]+ +\|.*\| *-?[0-9.]+ *\|" $OUT/deep-repair.log | tail -60
          if [ "${{ matrix.pcie_trace || '0' }}" = 1 ]; then
            sed -n '/^NSSOC_DEEP_CORNER_TRACE_BEGIN/,/^NSSOC_DEEP_CORNER_TRACE_END/p' $OUT/deep-repair.log > $OUT/deep-pcie-slow.rpt
            python3 -B scripts/pcie_timing/trace_paths.py $OUT/synthesis/soc_top.mapped.json $OUT/deep-pcie-slow.rpt $OUT/deep-trace 10 || echo "TRACE_FAILED"
          fi
          if [ -f $OUT/flop-map.tsv ] && grep -q NSSOC_NETS_BEGIN $OUT/deep-repair.log; then
            # The worst paths of every group after the repair, named by RTL register.
            python3 -B scripts/name_slow_paths.py $OUT/deep-repair.log $OUT/flop-map.tsv > $OUT/deep-named-paths.txt || echo "NAMING_FAILED"
            cat $OUT/deep-named-paths.txt || true
          fi
      - name: Hand the repaired database to the routing job
        if: ${{ (inputs.probe_variant == '' || contains(format(' {0} ', inputs.probe_variant), format(' {0} ', matrix.name))) && matrix.route == '1' }}
        run: |
          set -euo pipefail
          OUT=$PWD/hw/soc/out/impl-probe; mkdir -p handoff
          grep -a "NSSOC_DEEP_DB_WRITTEN" $OUT/deep-repair.log
          X=; [ -f $OUT/flop-map.tsv ] && X=$OUT/flop-map.tsv
          python3 -B scripts/routed_handoff.py pack $OUT/run $OUT/route-initial.json handoff/handoff.tgz --odb $OUT/deep-repaired.odb \
            $OUT/prepared $OUT/synthesis/soc_top.netlist.v $OUT/run/resolved.json $X | tail -8
          ls -la handoff
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ (inputs.probe_variant == '' || contains(format(' {0} ', inputs.probe_variant), format(' {0} ', matrix.name))) && matrix.route == '1' }}
        with:
          name: route-handoff-${{ matrix.name }}-${{ github.run_id }}
          path: handoff
          retention-days: 7
      - name: Collect
        if: ${{ (inputs.probe_variant == '' || contains(format(' {0} ', inputs.probe_variant), format(' {0} ', matrix.name))) && (always()) }}
        run: |
          OUT=hw/soc/out/impl-probe; mkdir -p out
          cp $OUT/deep-repair.log $OUT/deep-repair.tcl out/ 2>/dev/null || true
          cp $OUT/capped-trace.* $OUT/deep-trace.* $OUT/capped-pcie-slow.rpt $OUT/deep-pcie-slow.rpt $OUT/deep-named-paths.txt out/ 2>/dev/null || true
          gzip -c $OUT/flop-map.tsv > out/flop-map.tsv.gz 2>/dev/null || true
          cp $OUT/metrics.json $OUT/corner-sta.log $OUT/corner-sta.tcl $OUT/run.log $OUT/synthesis-driver.log $OUT/rtl-driver.log $OUT/prepared/config.json out/ 2>/dev/null || true
          for d in $OUT/run/*stamidpnr* $OUT/run/*resizer*; do [ -d "$d" ] || continue; b=$(basename $d); mkdir -p out/$b; for c in nom_slow_1p08V_125C; do [ -f $d/$c/max.rpt ] && head -c 3000000 $d/$c/max.rpt > out/$b/$c.max.head.rpt; done; cp $d/*.log out/$b/ 2>/dev/null || true; done
          ls out | head -50
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ (inputs.probe_variant == '' || contains(format(' {0} ', inputs.probe_variant), format(' {0} ', matrix.name))) && (always()) }}
        with:
          name: impl-probe-${{ matrix.name }}-${{ github.run_id }}
          path: out
          retention-days: 30

  # ---- Routed measurement (docs/combined-timing.md section 9). The probe
  # entry r_* hands its repaired post-global-route database to `route`
  # (legalize, global route, detailed route bounded by DRT_OPT_ITERS), which
  # hands the routed database to `routed-sta` (AuditedRCX and
  # AuditedRoutedSTA of hw/soc/pnr/replay_onehot_routed_extraction_flow.py:
  # nominal OpenRCX, standalone OpenSTA in three corners, derate guard,
  # original clocks, all propagated). Each is its own hosted job.
  route:
    needs: probe
    if: ${{ always() && inputs.route_run == '' && !inputs.unit_only && !inputs.rvformal_only && !contains(inputs.pcie_jobs, 'only') }}
    runs-on: ubuntu-22.04
    timeout-minutes: 355
    strategy:
      fail-fast: false
      matrix:
        name: [r_cut_td_d70, r_cut_td_d68, r_cut2_td_d68, r_cut2_td_d70, r_cut3_td_d68, r_cut3n_td_d68, r_cut3h_td_d68, r_cut4h_td_d68, r_cut3m_td_d68, r_cut4m_td_d68]
    env:
      GH_TOKEN: ${{ github.token }}
      APPIMAGE_SHA: d6a349ec65be11456e96c4981d35f63ca34d3c85daf79a51e1ccb907bb5d7466
      PACKAGE_SHA: 822dab7067d901fa79dabffffff784baf5c9965f0a5091eba67acdc48b9956f4
      RUN: ${{ inputs.probe_variant == '' || contains(format(' {0} ', inputs.probe_variant), format(' {0} ', matrix.name)) }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        if: env.RUN == 'true'
        with:
          persist-credentials: false
      - name: LibreLane AppImage, the verified PDK and the repaired database
        if: env.RUN == 'true'
        run: |
          set -euo pipefail
          for a in 1 2 3 4 5 6; do sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends libfuse2 && break; [ $a = 6 ] && exit 1; echo "apt attempt $a failed; retrying"; sleep 90; done
          W=/mnt/s; sudo mkdir -p $W; sudo chown $USER $W
          curl -fsSL --retry 5 -o $W/librelane.AppImage https://github.com/librelane/librelane/releases/download/3.0.5/librelane-devshell-x86_64.AppImage
          echo "$APPIMAGE_SHA  $W/librelane.AppImage" | sha256sum -c -; chmod +x $W/librelane.AppImage
          for attempt in 1 2 3 4 5 6; do
            gh api repos/${{ github.repository }}/releases/assets/663146895 -H "Accept: application/octet-stream" > $W/pkg.tgz && echo "$PACKAGE_SHA  $W/pkg.tgz" | sha256sum -c - && break
            sleep 60
          done
          echo "$PACKAGE_SHA  $W/pkg.tgz" | sha256sum -c -
          mkdir -p $W/pkg && tar -xzf $W/pkg.tgz -C $W/pkg && rm $W/pkg.tgz
          P=$(dirname "$(find $W/pkg -name input-contract.json | head -1)")
          python3 - "$P" <<'PY'
          import hashlib,json,shutil,sys
          from pathlib import Path
          p=Path(sys.argv[1]);c=json.loads((p/'input-contract.json').read_text());n=0
          for name,row in c['input_files'].items():
              if not name.startswith('hw/soc/tools/'):continue
              src=p/'files'/name;dst=Path(name)
              assert hashlib.sha256(src.read_bytes()).hexdigest()==row['sha256']
              if not dst.exists():dst.parent.mkdir(parents=True,exist_ok=True);shutil.copyfile(src,dst);n+=1
          print('restored PDK and tool files',n)
          PY
          rm -rf $W/pkg
      - name: Detailed routing of the repaired database (DRT_OPT_ITERS ${{ inputs.drt_iters || '15' }})
        if: env.RUN == 'true'
        run: |
          set -euo pipefail
          W=/mnt/s; OUT=$PWD/hw/soc/out/impl-probe
          gh run download ${{ github.run_id }} -n route-handoff-${{ matrix.name }}-${{ github.run_id }} -D $W/h
          tar -xzf $W/h/handoff.tgz -C /; rm -rf $W/h
          python3 - $OUT/prepared/config.json $OUT/prepared/config-routed.json <<'PY'
          import json,sys
          c=json.load(open(sys.argv[1]))
          # Timing measurement only: no antenna-diode repair inside detailed routing
          # (it re-routes and its diode legalization failed with DPL-0036).
          c.update(DRT_OPT_ITERS=int('${{ inputs.drt_iters || '15' }}'), STA_THREADS=1, DRT_ANTENNA_REPAIR_ITERS=0)
          open(sys.argv[2],'w').write(json.dumps(c,indent=2)+'\n')
          PY
          set +e
          mkdir -p $OUT/route
          timeout 19200 env -u GH_TOKEN -u GITHUB_TOKEN $W/librelane.AppImage python hw/soc/pnr/routed_measure_flow.py --flow RoutedMeasureRoute \
            --pdk-root $PWD/hw/soc/tools/ciel-corrpre --pdk ihp-sg13g2 --scl sg13g2_stdcell --force-run-dir $OUT/route \
            --with-initial-state $OUT/route-initial.json $OUT/prepared/config-routed.json > $OUT/route.log 2>&1; rc=$?
          set -e
          echo "ROUTE_RC=$rc"; tail -40 $OUT/route.log
          grep -a -E "Number of violations|DRT-0199|DRT-0198|Completing|elapsed" $OUT/route/*detailedrouting*/*.log | tail -40 || true
          [ $rc = 0 ]
          mkdir -p routed
          X=; [ -f $OUT/flop-map.tsv ] && X=$OUT/flop-map.tsv
          python3 -B scripts/routed_handoff.py pack $OUT/route $OUT/routed-state.json routed/routed.tgz \
            $OUT/prepared $OUT/synthesis/soc_top.netlist.v $X | tail -8
          ls -la routed
      - name: Collect
        if: always() && env.RUN == 'true'
        run: |
          OUT=hw/soc/out/impl-probe; mkdir -p out
          cp $OUT/route.log $OUT/routed-state.json out/ 2>/dev/null || true
          for d in $OUT/route/*; do [ -d "$d" ] || continue; b=$(basename $d); mkdir -p out/$b; cp $d/*.log $d/state_out.json $d/*.rpt out/$b/ 2>/dev/null || true; done
          find $OUT/route -name '*.drc' -size -50M -exec cp {} out/ \; 2>/dev/null || true
          ls -la out | head -40
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && env.RUN == 'true'
        with:
          name: route-${{ matrix.name }}-${{ github.run_id }}
          path: out
          retention-days: 30
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: env.RUN == 'true'
        with:
          name: routed-db-${{ matrix.name }}-${{ github.run_id }}
          path: routed
          retention-days: 14

  # ---- Post-route hold repair (docs/combined-timing.md section 12). A
  # routed database (from this run's route job, or from route_run's with
  # sta_variant naming the entry) gets PostRouteHold of
  # hw/soc/pnr/routed_measure_flow.py (RoutedHoldRepair: extraction of the
  # routed wires, setup-protected hold repair in every corner, legalization
  # of the new buffers with the original instances held, incremental global
  # route) and detailed routing again. routed-sta extracts and times the
  # result like every other routed variant. r_cut3hh_td_d68 is the routed
  # r_cut3h_td_d68 database with the repair alone.
  route-hold:
    needs: route
    if: ${{ always() && !inputs.unit_only && !inputs.rvformal_only && !contains(inputs.pcie_jobs, 'only') }}
    runs-on: ubuntu-22.04
    timeout-minutes: 355
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: r_cut4h_td_d68, src: r_cut4h_td_d68}
          - {name: r_cut3hh_td_d68, src: r_cut3h_td_d68}
    env:
      GH_TOKEN: ${{ github.token }}
      APPIMAGE_SHA: d6a349ec65be11456e96c4981d35f63ca34d3c85daf79a51e1ccb907bb5d7466
      PACKAGE_SHA: 822dab7067d901fa79dabffffff784baf5c9965f0a5091eba67acdc48b9956f4
      RUN: ${{ (inputs.route_run == '' && (inputs.probe_variant == '' || (contains(format(' {0} ', inputs.probe_variant), format(' {0} ', matrix.name)) && contains(format(' {0} ', inputs.probe_variant), format(' {0} ', matrix.src))))) || (inputs.route_run != '' && contains(format(' {0} ', inputs.sta_variant), format(' {0} ', matrix.name))) }}
      APPIMAGE_EXTRACT_AND_RUN: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        if: env.RUN == 'true'
        with:
          persist-credentials: false
      - name: LibreLane AppImage, the verified PDK and the routed database
        if: env.RUN == 'true'
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends libfuse2 || echo "libfuse2 unavailable; the AppImage extracts and runs without FUSE"
          W=/mnt/s; sudo mkdir -p $W; sudo chown $USER $W
          curl -fsSL --retry 5 -o $W/librelane.AppImage https://github.com/librelane/librelane/releases/download/3.0.5/librelane-devshell-x86_64.AppImage
          echo "$APPIMAGE_SHA  $W/librelane.AppImage" | sha256sum -c -; chmod +x $W/librelane.AppImage
          for attempt in 1 2 3 4 5 6; do
            gh api repos/${{ github.repository }}/releases/assets/663146895 -H "Accept: application/octet-stream" > $W/pkg.tgz && echo "$PACKAGE_SHA  $W/pkg.tgz" | sha256sum -c - && break
            sleep 60
          done
          echo "$PACKAGE_SHA  $W/pkg.tgz" | sha256sum -c -
          mkdir -p $W/pkg && tar -xzf $W/pkg.tgz -C $W/pkg && rm $W/pkg.tgz
          P=$(dirname "$(find $W/pkg -name input-contract.json | head -1)")
          python3 - "$P" <<'PY'
          import hashlib,json,shutil,sys
          from pathlib import Path
          p=Path(sys.argv[1]);c=json.loads((p/'input-contract.json').read_text());n=0
          for name,row in c['input_files'].items():
              if not name.startswith('hw/soc/tools/'):continue
              src=p/'files'/name;dst=Path(name)
              assert hashlib.sha256(src.read_bytes()).hexdigest()==row['sha256']
              if not dst.exists():dst.parent.mkdir(parents=True,exist_ok=True);shutil.copyfile(src,dst);n+=1
          print('restored PDK and tool files',n)
          PY
          rm -rf $W/pkg
      - name: Post-route hold repair on the extracted routed wires, then detailed routing of the changed nets
        if: env.RUN == 'true'
        run: |
          set -euo pipefail
          W=/mnt/s; OUT=$PWD/hw/soc/out/impl-probe
          R=${{ inputs.route_run || github.run_id }}
          gh run download $R -n routed-db-${{ matrix.src }}-$R -D $W/h
          tar -xzf $W/h/routed.tgz -C /; rm -rf $W/h
          python3 - $OUT/routed-state.json <<'PY'
          import json,sys
          s=json.load(open(sys.argv[1]))
          print({k:v for k,v in s['metrics'].items() if k.startswith('route__drc') or k.startswith('timing__hold__ws')})
          PY
          set +e
          mkdir -p $OUT/hold
          timeout 19200 env -u GH_TOKEN -u GITHUB_TOKEN $W/librelane.AppImage python hw/soc/pnr/routed_measure_flow.py --flow RoutedHoldRepair \
            --pdk-root $PWD/hw/soc/tools/ciel-corrpre --pdk ihp-sg13g2 --scl sg13g2_stdcell --force-run-dir $OUT/hold \
            --with-initial-state $OUT/routed-state.json $OUT/prepared/config-routed.json > $OUT/hold.log 2>&1; rc=$?
          set -e
          echo "HOLD_RC=$rc"; tail -40 $OUT/hold.log
          grep -a -h -E "NSSOC_HOLD|^(worst slack|wns|tns)|RSZ-00|Inserted [0-9]+ hold|Placement Analysis|total displacement" $OUT/hold/*postroutehold*/*.log | head -120 || true
          grep -a -h -E "NSSOC_WIRE|NSSOC_NONORTHOGONAL" $OUT/hold/*removenonorthogonalwires*/*.log | head -50 || true
          grep -a -h -E "Number of violations|DRT-0199|DRT-0198|DRT-1010|Completing|elapsed" $OUT/hold/*detailedrouting*/*.log | tail -30 || true
          [ $rc = 0 ]
          mkdir -p routed
          X=; [ -f $OUT/flop-map.tsv ] && X=$OUT/flop-map.tsv
          python3 -B scripts/routed_handoff.py pack $OUT/hold $OUT/routed-state.json routed/routed.tgz \
            $OUT/prepared $OUT/synthesis/soc_top.netlist.v $X | tail -8
          ls -la routed
      - name: Collect
        if: always() && env.RUN == 'true'
        run: |
          OUT=hw/soc/out/impl-probe; mkdir -p out
          cp $OUT/hold.log $OUT/routed-state.json out/ 2>/dev/null || true
          for d in $OUT/hold/*; do [ -d "$d" ] || continue; b=$(basename $d); mkdir -p out/$b; cp $d/*.log $d/state_out.json $d/*.rpt out/$b/ 2>/dev/null || true; done
          find $OUT/hold -name '*.drc' -size -50M -exec cp {} out/ \; 2>/dev/null || true
          ls -la out | head -40
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && env.RUN == 'true'
        with:
          name: route-hold-${{ matrix.name }}-${{ github.run_id }}
          path: out
          retention-days: 30
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: env.RUN == 'true'
        with:
          name: routed-hold-db-${{ matrix.name }}-${{ github.run_id }}
          path: routed
          retention-days: 14

  routed-sta:
    needs: [route, route-hold]
    if: ${{ always() && !inputs.unit_only && !inputs.rvformal_only && !contains(inputs.pcie_jobs, 'only') }}
    runs-on: ubuntu-22.04
    timeout-minutes: 355
    strategy:
      fail-fast: false
      matrix:
        # r_cut4h_td_d68 and r_cut3hh_td_d68 are the route-hold job's databases.
        name: [r_cut_td_d70, r_cut_td_d68, r_cut2_td_d68, r_cut2_td_d70, r_cut3_td_d68, r_cut3n_td_d68, r_cut3h_td_d68, r_cut4h_td_d68, r_cut3hh_td_d68, r_cut3m_td_d68, r_cut4m_td_d68]
    env:
      GH_TOKEN: ${{ github.token }}
      APPIMAGE_SHA: d6a349ec65be11456e96c4981d35f63ca34d3c85daf79a51e1ccb907bb5d7466
      PACKAGE_SHA: 822dab7067d901fa79dabffffff784baf5c9965f0a5091eba67acdc48b9956f4
      RUN: ${{ (inputs.route_run == '' && (inputs.probe_variant == '' || contains(format(' {0} ', inputs.probe_variant), format(' {0} ', matrix.name)))) || (inputs.route_run != '' && contains(format(' {0} ', inputs.sta_variant), format(' {0} ', matrix.name))) }}
      # The AppImage runs without FUSE, so a mirror outage cannot block extraction.
      APPIMAGE_EXTRACT_AND_RUN: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        if: env.RUN == 'true'
        with:
          persist-credentials: false
      - name: LibreLane AppImage, the verified PDK and the routed database
        if: env.RUN == 'true'
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends libfuse2 || echo "libfuse2 unavailable; the AppImage extracts and runs without FUSE"
          W=/mnt/s; sudo mkdir -p $W; sudo chown $USER $W
          curl -fsSL --retry 5 -o $W/librelane.AppImage https://github.com/librelane/librelane/releases/download/3.0.5/librelane-devshell-x86_64.AppImage
          echo "$APPIMAGE_SHA  $W/librelane.AppImage" | sha256sum -c -; chmod +x $W/librelane.AppImage
          for attempt in 1 2 3 4 5 6; do
            gh api repos/${{ github.repository }}/releases/assets/663146895 -H "Accept: application/octet-stream" > $W/pkg.tgz && echo "$PACKAGE_SHA  $W/pkg.tgz" | sha256sum -c - && break
            sleep 60
          done
          echo "$PACKAGE_SHA  $W/pkg.tgz" | sha256sum -c -
          mkdir -p $W/pkg && tar -xzf $W/pkg.tgz -C $W/pkg && rm $W/pkg.tgz
          P=$(dirname "$(find $W/pkg -name input-contract.json | head -1)")
          python3 - "$P" <<'PY'
          import hashlib,json,shutil,sys
          from pathlib import Path
          p=Path(sys.argv[1]);c=json.loads((p/'input-contract.json').read_text());n=0
          for name,row in c['input_files'].items():
              if not name.startswith('hw/soc/tools/'):continue
              src=p/'files'/name;dst=Path(name)
              assert hashlib.sha256(src.read_bytes()).hexdigest()==row['sha256']
              if not dst.exists():dst.parent.mkdir(parents=True,exist_ok=True);shutil.copyfile(src,dst);n+=1
          print('restored PDK and tool files',n)
          PY
          rm -rf $W/pkg
      - name: Nominal OpenRCX and three-corner standalone OpenSTA (AuditedRCX, AuditedRoutedSTA)
        if: env.RUN == 'true'
        run: |
          set -euo pipefail
          W=/mnt/s; OUT=$PWD/hw/soc/out/impl-probe
          # The post-route hold variants come from this run's route-hold job.
          case "${{ matrix.name }}" in
            r_cut4h_td_d68|r_cut3hh_td_d68) A=routed-hold-db; R=${{ github.run_id }} ;;
            *) A=routed-db; R=${{ inputs.route_run || github.run_id }} ;;
          esac
          gh run download $R -n $A-${{ matrix.name }}-$R -D $W/h
          tar -xzf $W/h/routed.tgz -C /; rm -rf $W/h
          python3 - $OUT/prepared/config-routed.json $OUT/routed-state.json <<'PY'
          import json,sys
          c=json.load(open(sys.argv[1]));s=json.load(open(sys.argv[2]))
          print({k:c.get(k) for k in ('STA_CORNERS','STA_THREADS','RCX_RULESETS','DRT_OPT_ITERS')})
          print({k:v for k,v in s.items() if k!='metrics'})
          print({k:v for k,v in s['metrics'].items() if k.startswith('route__')})
          PY
          set +e
          mkdir -p $OUT/rcx
          timeout 19800 env -u GH_TOKEN -u GITHUB_TOKEN $W/librelane.AppImage python hw/soc/pnr/replay_onehot_routed_extraction_flow.py --flow ReplayOnehotRoutedExtraction \
            --pdk-root $PWD/hw/soc/tools/ciel-corrpre --pdk ihp-sg13g2 --scl sg13g2_stdcell --force-run-dir $OUT/rcx \
            --with-initial-state $OUT/routed-state.json $OUT/prepared/config-routed.json > $OUT/rcx.log 2>&1; rc=$?
          set -e
          echo "RCX_STA_RC=$rc"; tail -40 $OUT/rcx.log
          [ $rc = 0 ]
          X=$OUT/flop-map.tsv; [ -f $X ] || X=none
          python3 -B scripts/routed_sta_summary.py $OUT/rcx $OUT/routed-state.json $X $OUT/routed-summary.json | tee $OUT/routed-summary.txt
      - name: Collect
        if: always() && env.RUN == 'true'
        run: |
          OUT=hw/soc/out/impl-probe; mkdir -p out
          cp $OUT/rcx.log $OUT/routed-summary.json $OUT/routed-summary.txt $OUT/routed-state.json out/ 2>/dev/null || true
          for c in nom_slow_1p08V_125C nom_typ_1p20V_25C nom_fast_1p32V_m40C; do
            d=$(find $OUT/rcx -maxdepth 2 -type d -name $c | head -1); [ -n "$d" ] || continue
            mkdir -p out/$c; for f in sta.log checks.rpt violator_list.rpt clock.rpt ws.max.rpt ws.min.rpt skew.max.rpt skew.min.rpt unpropagated.rpt; do [ -f $d/$f ] && cp $d/$f out/$c/; done
            [ -f $d/max.rpt ] && head -c 20000000 $d/max.rpt > out/$c/max.head.rpt; [ -f $d/min.rpt ] && head -c 20000000 $d/min.rpt > out/$c/min.head.rpt
          done
          for d in $OUT/rcx/*; do [ -d "$d" ] || continue; b=$(basename $d); mkdir -p out/$b; cp $d/*.log $d/*.json out/$b/ 2>/dev/null || true; done
          ls -la out | head -40
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && env.RUN == 'true'
        with:
          name: routed-sta-${{ matrix.name }}-${{ github.run_id }}
          path: out
          retention-days: 30

  # riscv-formal (docs/63) on the RVFI build of the core, unpatched and with
  # the execute stage, upstream register file (docs/63 phase 1). The eight
  # M-extension instruction checks and liveness are left out: docs/63
  # section 8 found no verdict for the first six within 40 minutes each,
  # div/rem fail against riscv-formal's own unsigned model, and liveness is
  # bound by the 37-cycle divider at depth 50.
  rvformal:
    if: ${{ !inputs.probe_only && !inputs.unit_only && !contains(inputs.pcie_jobs, 'only') && inputs.variant == '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: base, ex: '0'}
          - {name: ex, ex: '1'}
    env:
      IBEX_EX_STAGE: ${{ matrix.ex }}
      IBEX_REGFILE: upstream
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Retry transient download failures
        run: printf 'retry = 10\nretry-delay = 30\nretry-all-errors\nfail\n' > ~/.curlrc
      - uses: YosysHQ/setup-oss-cad-suite@aefa8397bbf8fc6670a0a62af9805a89738f3cde
        id: cad1
        continue-on-error: true
        with:
          version: '2026-08-04'
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - run: sleep 180
        if: ${{ (steps.cad1.outcome == 'failure') }}
      - uses: YosysHQ/setup-oss-cad-suite@aefa8397bbf8fc6670a0a62af9805a89738f3cde
        id: cad2
        if: ${{ (steps.cad1.outcome == 'failure') }}
        continue-on-error: true
        with:
          version: '2026-08-04'
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - run: sleep 300
        if: ${{ (steps.cad1.outcome == 'failure' && steps.cad2.outcome == 'failure') }}
      - uses: YosysHQ/setup-oss-cad-suite@aefa8397bbf8fc6670a0a62af9805a89738f3cde
        if: ${{ (steps.cad1.outcome == 'failure' && steps.cad2.outcome == 'failure') }}
        with:
          version: '2026-08-04'
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Pinned CPU RTL, its RVFI conversion and riscv-formal
        run: |
          set -euo pipefail
          echo "OSS_CAD_SUITE=$(dirname "$(dirname "$(command -v yosys)")")" >> "$GITHUB_ENV"
          export OSS_CAD_SUITE="$(dirname "$(dirname "$(command -v yosys)")")"
          python3 -m pip install -q -r sw/requirements.txt
          python3 -m venv hw/.venv && hw/.venv/bin/pip install -q -r hw/requirements.txt
          for a in 1 2 3 4; do make soc-rtl-prepare INTERFACE_PYTHON="$PWD/hw/.venv/bin/python" > /tmp/prep.log 2>&1 && break; tail -30 /tmp/prep.log; [ $a = 4 ] && exit 1; echo "prepare attempt $a failed; retrying"; sleep 60; done
          bash hw/soc/flow/sv2v_ibex.sh hw/soc/ext/ibex hw/soc/genrvfi hw/soc/tools/sv2v-Linux/sv2v RVFI
          make -f hw/soc/tools.soc.mk fetch-riscv-formal
          mkdir -p out
          bash hw/soc/flow/rvformal.sh setup 2>&1 | tee out/setup.log
          if [ "$IBEX_EX_STAGE" = 1 ]; then
            diff -u hw/soc/genrvfi/ibex_core.v hw/soc/genp/genrvfi-ex/ibex_core.v > out/ibex_core.rvfi-ex.diff || true
            grep -c exs_pc_next out/ibex_core.rvfi-ex.diff
          fi
      - name: Bounded checks and cover jobs
        if: ${{ !inputs.rvformal_hang_only }}
        run: |
          set +e
          R=hw/soc/out/rvformal-upstream/cores/ibex
          SKIP='^(insn_(mul|mulh|mulhsu|mulhu|div|divu|rem|remu)_ch0|liveness_ch0)$'
          export PATH="$(dirname "$(command -v sby)"):$PATH"
          for set in checks cover; do
            ( cd $R/$set && ls *.sby | sed 's/\.sby$//' | grep -v -E "$SKIP" |
              xargs -P "$(nproc)" -I{} timeout 2400 sby -f {}.sby > ../$set-run.log 2>&1 )
          done
          bash hw/soc/flow/rvformal.sh report | tee out/report.txt
      - name: hang at deeper bounds (the extra stage adds a cycle to every redirect before the first retirement)
        run: |
          set +e
          export PATH="$(dirname "$(command -v sby)"):$PATH"
          for d in 26 28 30 32 34 36 38 40; do
            RVF_OUT=$PWD/hw/soc/out/rvformal-hang$d RVF_HANG_DEPTH=$d bash hw/soc/flow/rvformal.sh setup > out/setup-hang$d.log 2>&1
            for set in checks cover; do
              ( cd hw/soc/out/rvformal-hang$d/cores/ibex/$set && timeout 2400 sby -f hang.sby > /dev/null 2>&1 )
              echo "hang depth $d $set: $(cat hw/soc/out/rvformal-hang$d/cores/ibex/$set/hang/status 2>/dev/null || echo 'NO STATUS')"
            done
          done | tee out/hang-depths.txt
      - name: Collect
        if: always()
        run: |
          R=hw/soc/out/rvformal-upstream/cores/ibex
          mkdir -p out
          for set in checks cover; do
            for d in $R/$set/*/; do n=$(basename $d); [ -f $d/status ] && echo "$set $n $(cat $d/status)"; done
          done > out/status.txt 2>/dev/null || true
          for d in $R/checks/*/; do [ -f $d/status ] && grep -q FAIL $d/status && { mkdir -p out/fail/$(basename $d); cp $d/logfile.txt $d/engine_*/trace*.vcd out/fail/$(basename $d)/ 2>/dev/null; }; done || true
          cp $R/*.cfg out/ 2>/dev/null || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ibex-ex-stage-rvformal-${{ matrix.name }}-${{ github.run_id }}
          path: out
          retention-days: 30

  # ---- timing/pcie-pipeline: packet-domain timing screen, PCIe unit
  # regressions, SoC lint and joint PCIe/Ethernet traffic. Run on request
  # (inputs.pcie_jobs). Its implementation probe is the probe job above
  # (entries pcie_*; pcie_rtl_ref selects other PCIe RTL).
  pcie-timing:
    if: ${{ contains(inputs.pcie_jobs, 'timing') }}
    runs-on: ubuntu-22.04
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        side: ${{ fromJSON(inputs.pcie_timing_sides) }}
    env:
      APPIMAGE_SHA: d6a349ec65be11456e96c4981d35f63ca34d3c85daf79a51e1ccb907bb5d7466
      PDK_RAW: https://raw.githubusercontent.com/IHP-GmbH/IHP-Open-PDK/c4b8b4e5e7a05f375cca3815d51b3a37721fbf5c/ihp-sg13g2/libs.ref/sg13g2_stdcell
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /hw/soc/rtl/pcie/
            /scripts/pcie_timing/
      - name: Select RTL
        run: |
          if [ "${{ matrix.side }}" = baseline ]; then
            git fetch -q --filter=blob:none https://github.com/${{ github.repository }}.git $BASELINE_REF
            git checkout FETCH_HEAD -- hw/soc/rtl/pcie
          fi
          git log --oneline -1; sha256sum hw/soc/rtl/pcie/soc_pcie_*.v | sha256sum
      - name: Retry transient download failures
        run: printf 'retry = 10\nretry-delay = 30\nretry-all-errors\nfail\n' > ~/.curlrc
      - uses: YosysHQ/setup-oss-cad-suite@aefa8397bbf8fc6670a0a62af9805a89738f3cde
        id: cad1
        continue-on-error: true
        with:
          version: '2026-08-04'
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - if: steps.cad1.outcome == 'failure'
        run: sleep 180
      - uses: YosysHQ/setup-oss-cad-suite@aefa8397bbf8fc6670a0a62af9805a89738f3cde
        id: cad2
        if: steps.cad1.outcome == 'failure'
        continue-on-error: true
        with:
          version: '2026-08-04'
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - if: steps.cad1.outcome == 'failure' && steps.cad2.outcome == 'failure'
        run: sleep 300
      - uses: YosysHQ/setup-oss-cad-suite@aefa8397bbf8fc6670a0a62af9805a89738f3cde
        if: steps.cad1.outcome == 'failure' && steps.cad2.outcome == 'failure'
        with:
          version: '2026-08-04'
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Liberty, LEF and OpenROAD
        run: |
          set -euo pipefail
          W=/mnt/s; sudo mkdir -p $W; sudo chown $USER $W
          curl -fsSL -o $W/typ.lib $PDK_RAW/lib/sg13g2_stdcell_typ_1p20V_25C.lib
          curl -fsSL -o $W/slow.lib $PDK_RAW/lib/sg13g2_stdcell_slow_1p08V_125C.lib
          curl -fsSL -o $W/tech.lef $PDK_RAW/lef/sg13g2_tech.lef
          curl -fsSL -o $W/cells.lef $PDK_RAW/lef/sg13g2_stdcell.lef
          sha256sum -c - <<EOF
          968b0cfdcefc49a88d9a5c48874769eaad9aba3509e1240b5e14a821bb07a3c4  $W/typ.lib
          ed1cff6e4d66d89d200e94c2213b8926a71c451218ca2df9b1157c98460e4b1d  $W/slow.lib
          e3470344dfac5347b176fb3f8e0f0548d17a66b8f433626a8987dcb2ae4828b6  $W/tech.lef
          c7575039af0b124e1834c407bfb9ac7a2db576d1e3533d98474dad3fbc2af589  $W/cells.lef
          EOF
          for a in 1 2 3 4 5 6; do sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends libfuse2 && break; [ $a = 6 ] && exit 1; echo "apt attempt $a failed; retrying"; sleep 90; done
          curl -fsSL -o $W/librelane.AppImage https://github.com/librelane/librelane/releases/download/3.0.5/librelane-devshell-x86_64.AppImage
          echo "$APPIMAGE_SHA  $W/librelane.AppImage" | sha256sum -c -; chmod +x $W/librelane.AppImage
      - name: Synthesis and two-corner STA of the packet domain
        run: |
          set -euo pipefail
          W=/mnt/s
          LEFS="$W/tech.lef $W/cells.lef" STA_TIMEOUT=6000 timeout 6600 bash scripts/pcie_timing/run.sh $W/typ.lib $W/slow.lib $PWD/out \
            env -u GH_TOKEN -u GITHUB_TOKEN $W/librelane.AppImage openroad -exit
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: pcie-timing-${{ matrix.side }}-${{ github.run_id }}
          path: |
            out/*.rpt
            out/*.txt
            out/*.log
            out/*.ys
            out/*.sdc
            out/*.tcl
          retention-days: 30
  pcie-unit:
    if: ${{ contains(inputs.pcie_jobs, 'unit') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /hw/soc/rtl/
            /hw/soc/tb/cocotb/
            /hw/soc/tb/tb_pcie_rx_credit_read_ahead.v
            /scripts/check_pcie_rx_read_ahead.sh
            /hw/requirements.txt
      - name: Retry transient download failures
        run: printf 'retry = 10\nretry-delay = 30\nretry-all-errors\nfail\n' > ~/.curlrc
      - uses: YosysHQ/setup-oss-cad-suite@aefa8397bbf8fc6670a0a62af9805a89738f3cde
        id: cad1
        continue-on-error: true
        with:
          version: '2026-08-04'
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - if: steps.cad1.outcome == 'failure'
        run: sleep 180
      - uses: YosysHQ/setup-oss-cad-suite@aefa8397bbf8fc6670a0a62af9805a89738f3cde
        id: cad2
        if: steps.cad1.outcome == 'failure'
        continue-on-error: true
        with:
          version: '2026-08-04'
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - if: steps.cad1.outcome == 'failure' && steps.cad2.outcome == 'failure'
        run: sleep 300
      - uses: YosysHQ/setup-oss-cad-suite@aefa8397bbf8fc6670a0a62af9805a89738f3cde
        if: steps.cad1.outcome == 'failure' && steps.cad2.outcome == 'failure'
        with:
          version: '2026-08-04'
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Python test environment
        run: |
          python3 -m venv hw/.venv && hw/.venv/bin/pip install -q -r hw/requirements.txt
          git log --oneline -1; iverilog -V 2>&1 | head -1
      - name: Unit regressions
        shell: bash
        run: |
          set +e -uo pipefail
          mkdir -p out; fail=0
          for t in ${{ inputs.pcie_tests }}; do
            mk=hw/soc/tb/cocotb/Makefile.$t
            if [ ! -f $mk ]; then echo "MISSING $t"; fail=1; continue; fi
            ( cd hw/soc/tb/cocotb && PATH="$PWD/../../../.venv/bin:$PATH" timeout 3000 make -f Makefile.$t SIM_BUILD=/tmp/sb_$t COCOTB_RESULTS_FILE=$GITHUB_WORKSPACE/out/results_$t.xml > $GITHUB_WORKSPACE/out/$t.log 2>&1 ); rc=$?
            echo "TEST $t rc=$rc"; grep -E "TESTS=|PASS=|FAIL=|SKIP=" out/$t.log | tail -2
            [ $rc -eq 0 ] || { fail=1; tail -60 out/$t.log; }
          done
          # docs/combined-timing.md: the receive queue's staged commit (section
          # 10) and its read-ahead registers (section 12) are cycle-identical
          # at its ports; the same suites must pass with each.
          for k in staged:SOC_PCIE_RX_STAGED_COMMIT ahead:SOC_PCIE_RX_READ_AHEAD; do
            n=${k%%:*}; d=${k#*:}
            for t in soc_pcie_rx_credit soc_pcie_buffered_flow_packets; do
              ( cd hw/soc/tb/cocotb && PATH="$PWD/../../../.venv/bin:$PATH" timeout 3000 make -f Makefile.$t SIM_BUILD=/tmp/sb_${n}_$t COCOTB_RESULTS_FILE=$GITHUB_WORKSPACE/out/results_${n}_$t.xml EXTRA_COMPILE_ARGS=-D$d > $GITHUB_WORKSPACE/out/${n}_$t.log 2>&1 ); rc=$?
              echo "TEST $t with $d rc=$rc"; grep -E "TESTS=|PASS=|FAIL=|SKIP=" out/${n}_$t.log | tail -2
              grep -q -- "-D$d" out/${n}_$t.log || echo "NOTE: -D$d not seen in the $t build log"
              [ $rc -eq 0 ] || { fail=1; tail -60 out/${n}_$t.log; }
            done
          done
          # Random co-simulation of the read-ahead build against the default.
          bash scripts/check_pcie_rx_read_ahead.sh $GITHUB_WORKSPACE/out/read-ahead-cosim 300000 > out/read-ahead-cosim.log 2>&1; rc=$?
          cat out/read-ahead-cosim.log; [ $rc -eq 0 ] || fail=1
          echo "OVERALL fail=$fail"; exit $fail
      - name: Lint the PCIe packet subsystem
        run: |
          R=hw/soc/rtl/pcie
          verilator --lint-only -Wall -Wno-DECLFILENAME -Wno-UNUSEDSIGNAL -Wno-UNUSEDPARAM -Wno-PINCONNECTEMPTY --top-module soc_pcie_buffered_flow_packets $R/*.v 2>&1 | grep -E "%(Error|Warning)" | grep -E "replay_tx|buffered_flow|stream_skid|credit_tx|reliable_packets|flow_packets" | head -60 | tee out/lint.txt || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: pcie-pipeline-unit-${{ github.run_id }}
          path: out
          retention-days: 30
  pcie-soc:
    if: ${{ contains(inputs.pcie_jobs, 'soc') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Retry transient download failures
        run: printf 'retry = 10\nretry-delay = 30\nretry-all-errors\nfail\n' > ~/.curlrc
      - uses: YosysHQ/setup-oss-cad-suite@aefa8397bbf8fc6670a0a62af9805a89738f3cde
        id: cad1
        continue-on-error: true
        with:
          version: '2026-08-04'
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - if: steps.cad1.outcome == 'failure'
        run: sleep 180
      - uses: YosysHQ/setup-oss-cad-suite@aefa8397bbf8fc6670a0a62af9805a89738f3cde
        id: cad2
        if: steps.cad1.outcome == 'failure'
        continue-on-error: true
        with:
          version: '2026-08-04'
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - if: steps.cad1.outcome == 'failure' && steps.cad2.outcome == 'failure'
        run: sleep 300
      - uses: YosysHQ/setup-oss-cad-suite@aefa8397bbf8fc6670a0a62af9805a89738f3cde
        if: steps.cad1.outcome == 'failure' && steps.cad2.outcome == 'failure'
        with:
          version: '2026-08-04'
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Prepare the pinned CPU and interface RTL
        run: |
          git log --oneline -1
          echo "OSS_CAD_SUITE=$(dirname "$(dirname "$(command -v yosys)")")" >> "$GITHUB_ENV"
          python3 -m pip install -q -r sw/requirements.txt
          python3 -m venv hw/.venv
          hw/.venv/bin/pip install -q -r hw/requirements.txt
          make soc-rtl-prepare INTERFACE_PYTHON="$PWD/hw/.venv/bin/python"
          make soc-interfaces-prepare SOC_INTERFACE_PROFILE=full INTERFACE_PYTHON="$PWD/hw/.venv/bin/python"
      - name: Base and full lint, joint PCIe/Ethernet traffic (asynchronous and synchronous packet clock)
        run: |
          set +e
          O=$PWD/out; mkdir -p $O
          python3 scripts/check_soc_lint.py --profile base --output hw/soc/out/pipe-lint-base > $O/lint-base.log 2>&1; echo "lint-base rc=$?"
          python3 scripts/check_soc_lint.py --profile full --output hw/soc/out/pipe-lint-full > $O/lint-full.log 2>&1; echo "lint-full rc=$?"
          cp -r hw/soc/out/pipe-lint-base $O/lint-base; cp -r hw/soc/out/pipe-lint-full $O/lint-full
          python3 scripts/check_pcie_ethernet_soc.py --out $O/joint-async --iverilog-dir $OSS_CAD_SUITE/bin --async-pcie > $O/joint-async.log 2>&1; echo "joint-async rc=$?"
          python3 scripts/check_pcie_ethernet_soc.py --out $O/joint-sync --iverilog-dir $OSS_CAD_SUITE/bin > $O/joint-sync.log 2>&1; echo "joint-sync rc=$?"
          for f in lint-base lint-full joint-async joint-sync; do
            python3 -c "import json,sys;d=json.load(open(sys.argv[1]));print(sys.argv[2],{k:d.get(k) for k in ('status','tests','delta','sources_unchanged','immutable_drift','own_unaccepted','unchanged','runtime_unchanged','asynchronous_pcie')})" $O/$f/result.json $f 2>/dev/null || { echo "$f no result"; tail -30 $O/$f.log; }
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: pcie-pipeline-soc-${{ github.run_id }}
          path: |
            out/*.log
            out/*/result.json
          retention-days: 30

  # ---- docs/combined-timing.md: the Ethernet FIFO read register
  # (SOC_ETH_FIFO_RDREG) and the BUSSTAT pending-event register
  # (SOC_BUSSTAT_EVPEND), each with the knob off (the reference) and on.
  # Run on request (inputs.pcie_jobs contains eth).
  eth-knobs:
    if: ${{ contains(inputs.pcie_jobs, 'eth') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    strategy:
      fail-fast: false
      matrix:
        part: [busstat, eth-rtl, eth-mbist, eth-gl-0, eth-gl-1, joint, joint-cut4, soc-mbist]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Retry transient download failures
        run: printf 'retry = 10\nretry-delay = 30\nretry-all-errors\nfail\n' > ~/.curlrc
      - uses: YosysHQ/setup-oss-cad-suite@aefa8397bbf8fc6670a0a62af9805a89738f3cde
        id: cad1
        continue-on-error: true
        with:
          version: '2026-08-04'
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - if: steps.cad1.outcome == 'failure'
        run: sleep 180
      - uses: YosysHQ/setup-oss-cad-suite@aefa8397bbf8fc6670a0a62af9805a89738f3cde
        id: cad2
        if: steps.cad1.outcome == 'failure'
        continue-on-error: true
        with:
          version: '2026-08-04'
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - if: steps.cad1.outcome == 'failure' && steps.cad2.outcome == 'failure'
        run: sleep 300
      - uses: YosysHQ/setup-oss-cad-suite@aefa8397bbf8fc6670a0a62af9805a89738f3cde
        if: steps.cad1.outcome == 'failure' && steps.cad2.outcome == 'failure'
        with:
          version: '2026-08-04'
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Interface bundles and the locked native SRAM models
        run: |
          set -euo pipefail
          export OSS_CAD_SUITE="$(dirname "$(dirname "$(command -v yosys)")")"
          echo "OSS_CAD_SUITE=$OSS_CAD_SUITE" >> "$GITHUB_ENV"
          python3 -m pip install -q -r sw/requirements.txt
          # The cocotb embed needs a venv on a real CPython, not the OSS CAD Suite wrapper.
          "$pythonLocation/bin/python3" -m venv hw/.venv && hw/.venv/bin/pip install -q -r hw/requirements.txt
          for a in 1 2 3 4; do make soc-interfaces-prepare SOC_INTERFACE_PROFILE=full INTERFACE_PYTHON="$PWD/hw/.venv/bin/python" > /tmp/prep.log 2>&1 && break; tail -30 /tmp/prep.log; [ $a = 4 ] && exit 1; echo "prepare attempt $a failed; retrying"; sleep 60; done
          for a in 1 2 3; do python3 hw/soc/flow/prepare_ihp_native_boot.py > /tmp/pdk.log 2>&1 && break; tail -5 /tmp/pdk.log; [ $a = 3 ] && exit 1; sleep 60; done; tail -2 /tmp/pdk.log
          iverilog -V 2>&1 | head -1; sha256sum hw/soc/gen/interfaces*.bundle.vh
          # OSS CAD Suite's vvp wrapper forces its bundled Python into the
          # cocotb embed; launch the native vvp as check_pcie_ethernet_soc.py does.
          python3 -c "import sys; sys.path.insert(0, 'scripts'); from cocotb_icarus_runtime import prepare_runtime; print(prepare_runtime(sys.argv[1], sys.argv[2])[0])" "$OSS_CAD_SUITE/bin" /tmp/icarus-rt > /tmp/icarus-rt.txt
          echo "ICARUS_RT=$(cat /tmp/icarus-rt.txt)" >> "$GITHUB_ENV"; cat /tmp/icarus-rt.txt
      - name: BUSSTAT cocotb suite and formal (B1-B7, and B8 the reference-counter equivalence with the knob)
        if: matrix.part == 'busstat'
        run: |
          set -uo pipefail
          O=$PWD/out; mkdir -p $O; fail=0
          export PYTHONPATH=$GITHUB_WORKSPACE/sw:$GITHUB_WORKSPACE
          for cfg in "off:" "evpend:-DSOC_BUSSTAT_EVPEND"; do
            n=${cfg%%:*}
            ( cd hw/soc/tb/cocotb && make -f Makefile.soc_busstat SIM_BUILD=/tmp/sb_bs_$n COCOTB_RESULTS_FILE=$O/busstat_$n.xml EXTRA_COMPILE_ARGS="${cfg#*:}" > $O/busstat_$n.log 2>&1 ) || fail=1
            echo "busstat cocotb $n: $(grep -oE 'TESTS=[0-9]+ PASS=[0-9]+ FAIL=[0-9]+' $O/busstat_$n.log | tail -1)"
          done
          F=$O/formal; mkdir -p $F
          for n in off evpend; do
            mkdir -p $F/$n; cp hw/soc/rtl/soc_busstat.v hw/soc/formal/soc_busstat_props.v $F/$n/
            sed 's#\.\./rtl/soc_busstat\.v#soc_busstat.v#' hw/soc/formal/soc_busstat.sby > $F/$n/soc_busstat.sby
            [ $n = evpend ] && sed -i 's/^read_verilog -formal soc_busstat.v/read_verilog -formal -DSOC_BUSSTAT_EVPEND soc_busstat.v/' $F/$n/soc_busstat.sby
            grep -n '^read_verilog' $F/$n/soc_busstat.sby
            for t in bmc prove prove_w16 cover prove_to prove_to_w16; do
              ( cd $F/$n && timeout 1800 sby -f soc_busstat.sby $t > $t.log 2>&1 ); rc=$?
              echo "busstat formal $n $t: rc=$rc $(cat $F/$n/soc_busstat_$t/status 2>/dev/null)"; [ $rc = 0 ] || fail=1
            done
          done
          exit $fail
      - name: Ethernet MAC cocotb suite, inferred FIFO memory and the SRAM wrapper with vendor models, knob off and on
        if: matrix.part == 'eth-rtl'
        run: |
          set -uo pipefail
          O=$PWD/out; mkdir -p $O; fail=0
          export PYTHONPATH=$GITHUB_WORKSPACE/sw:$GITHUB_WORKSPACE
          M=$PWD/hw/soc/tools/ihp-native-boot-c4b8b4e/ihp-sg13g2/libs.ref/sg13g2_sram/verilog
          D=$PWD/hw/soc/rtl/dft
          SRAM="$D/soc_eth_fifo_sram.v $D/soc_sram_mbist.v $D/soc_sram_zero_check.v $M/RM_IHPSG13_2P_256x16_c2_bm_bist.v $M/RM_IHPSG13_2P_core_behavioral_bm_bist_ideal.v $M/RM_IHPSG13_2P_core_behavioral_ideal.v"
          for cfg in "mem_off||" "mem_rdreg||-DSOC_ETH_FIFO_RDREG" "sram_off|$SRAM|-DSOC_ETH_MBIST -DFUNCTIONAL" "sram_rdreg|$SRAM|-DSOC_ETH_MBIST -DFUNCTIONAL -DSOC_ETH_FIFO_RDREG"; do
            IFS='|' read -r n src args <<< "$cfg"
            start=$(date +%s)
            ( cd hw/soc/tb/cocotb && timeout 9000 env -u PYTHONHOME -u PYTHONEXECUTABLE PATH="$GITHUB_WORKSPACE/hw/.venv/bin:$PATH" make -f Makefile.soc_eth ICARUS_BIN_DIR=$ICARUS_RT PYTHON_BIN=$GITHUB_WORKSPACE/hw/.venv/bin/python3 SIM_BUILD=/tmp/sb_eth_$n COCOTB_RESULTS_FILE=$O/eth_$n.xml ETH_EXTRA_SOURCES="$src" EXTRA_COMPILE_ARGS="$args" > $O/eth_$n.log 2>&1 ) || fail=1
            echo "soc_eth cocotb $n: $(grep -oE 'TESTS=[0-9]+ PASS=[0-9]+ FAIL=[0-9]+' $O/eth_$n.log | tail -1) in $(( $(date +%s) - start )) s"
          done
          exit $fail
      - name: Ethernet SRAM wrapper self-test, faults and cross-port data (scripts/check_eth_mbist.py), knob off and on
        if: matrix.part == 'eth-mbist'
        run: |
          mkdir -p out
          set -uo pipefail
          fail=0
          for n in off rdreg; do
            X=; [ $n = rdreg ] && X=--fifo-rdreg
            python3 scripts/check_eth_mbist.py --pdk hw/soc/tools/ihp-native-boot-c4b8b4e/ihp-sg13g2 --tools "$OSS_CAD_SUITE/bin" --output hw/soc/out/eth-mbist-$n $X > out/eth-mbist-$n.log 2>&1 || fail=1
            tail -1 out/eth-mbist-$n.log; cp hw/soc/out/eth-mbist-$n/result.json out/eth-mbist-$n.json 2>/dev/null || true
          done
          exit $fail
      - name: Gate-level Ethernet MAC with the mapped SRAM wrapper (hw/soc/flow/test_eth_sram.sh, SOC_ETH_MBIST=1), knob ${{ matrix.part }}
        if: startsWith(matrix.part, 'eth-gl-')
        run: |
          mkdir -p out
          set -uo pipefail
          fail=0
          export PDK_ROOT=$PWD/hw/soc/tools/ihp-native-boot-c4b8b4e GL_IVERILOG=$ICARUS_RT/iverilog
          P=${{ matrix.part }}
          for n in ${P#eth-gl-}; do
            start=$(date +%s)
            SOC_ETH_MBIST=1 SOC_ETH_FIFO_RDREG=$n timeout 19000 env -u PYTHONHOME -u PYTHONEXECUTABLE bash hw/soc/flow/test_eth_sram.sh hw/soc/out/eth-sram-gl-$n > out/eth-sram-gl-$n.log 2>&1 || { fail=1; tail -30 out/eth-sram-gl-$n.log; tail -40 hw/soc/out/eth-sram-gl-$n/test.log 2>/dev/null; }
            tail -1 out/eth-sram-gl-$n.log; echo "  in $(( $(date +%s) - start )) s"
            grep -E "RM_IHPSG13_2P|Number of cells|Chip area|sg13g2_df" hw/soc/out/eth-sram-gl-$n/synth.log | tail -6 || true
            cp hw/soc/out/eth-sram-gl-$n/evidence.json out/eth-sram-gl-$n.json 2>/dev/null || true
            cp hw/soc/out/eth-sram-gl-$n/test.log out/eth-sram-gl-$n.test.log 2>/dev/null || true
          done
          exit $fail
      - name: Joint PCIe and Ethernet SoC traffic with both knobs (actual Ibex; inferred and vendor-SRAM FIFOs)
        if: matrix.part == 'joint' || matrix.part == 'joint-cut4'
        run: |
          mkdir -p out
          set -uo pipefail
          O=$PWD/out; fail=0
          make soc-rtl-prepare INTERFACE_PYTHON="$PWD/hw/.venv/bin/python" > /tmp/rtl-prep.log 2>&1 || { tail -30 /tmp/rtl-prep.log; exit 1; }
          K="--define SOC_ETH_FIFO_RDREG --define SOC_BUSSTAT_EVPEND"
          P=hw/soc/tools/ihp-native-boot-c4b8b4e/ihp-sg13g2
          K2="$K --define SOC_PCIE_RX_STAGED_COMMIT --define SOC_SRAM_MBIST_PIPE"
          CFGS=("knobs-async|--async-pcie $K" "knobs-sync|$K" "sram-off-async|--async-pcie --eth-mbist-pdk $P" "sram-knobs-async|--async-pcie --eth-mbist-pdk $P $K" "cut2-async|--async-pcie $K2" "cut2-sync|$K2" "sram-cut2-async|--async-pcie --eth-mbist-pdk $P $K2")
          # Section 12: the read-ahead receive queue and the fabric's own write-data register.
          K4="$K --define SOC_SRAM_MBIST_PIPE --define SOC_PCIE_RX_READ_AHEAD --define SOC_BUS_WDATA_OWN"
          [ "${{ matrix.part }}" = joint-cut4 ] && CFGS=("cut4-async|--async-pcie $K4" "cut4-sync|$K4" "sram-cut4-async|--async-pcie --eth-mbist-pdk $P $K4")
          for cfg in "${CFGS[@]}"; do
            IFS='|' read -r n args <<< "$cfg"
            start=$(date +%s)
            # shellcheck disable=SC2086
            python3 scripts/check_pcie_ethernet_soc.py --out $O/joint-$n --iverilog-dir $OSS_CAD_SUITE/bin $args > $O/joint-$n.log 2>&1 || fail=1
            python3 -c "import json,sys;d=json.load(open(sys.argv[1]));print(sys.argv[2],{k:d.get(k) for k in ('status','tests','defines','ethernet_vendor_sram','asynchronous_pcie')})" $O/joint-$n/result.json $n 2>/dev/null || { echo "$n no result"; tail -30 $O/joint-$n.log; }
            echo "  in $(( $(date +%s) - start )) s"
          done
          exit $fail
      - name: SoC system and Ethernet MBIST integration (scripts/check_soc_mbist_integration.py), knobs off and on
        if: matrix.part == 'soc-mbist'
        run: |
          mkdir -p out
          set -uo pipefail
          fail=0
          for a in 1 2 3 4; do make soc-prepare INTERFACE_PYTHON="$PWD/hw/.venv/bin/python" > /tmp/soc-prep.log 2>&1 && break; tail -30 /tmp/soc-prep.log; [ $a = 4 ] && exit 1; sleep 60; done
          P=hw/soc/tools/ihp-native-boot-c4b8b4e/ihp-sg13g2
          K="--define SOC_SRAM_MBIST_PIPE --define SOC_ETH_FIFO_RDREG --define SOC_BUSSTAT_EVPEND"
          for cfg in "off|" "knobs|$K"; do
            IFS='|' read -r n args <<< "$cfg"
            start=$(date +%s)
            # shellcheck disable=SC2086
            python3 scripts/check_soc_mbist_integration.py --pdk $P --output hw/soc/out/soc-mbist-$n --iverilog $OSS_CAD_SUITE/bin/iverilog --vvp $OSS_CAD_SUITE/bin/vvp --eth-mbist $args > out/soc-mbist-$n.log 2>&1 || fail=1
            tail -3 out/soc-mbist-$n.log; echo "  in $(( $(date +%s) - start )) s"
            cp hw/soc/out/soc-mbist-$n/result.json out/soc-mbist-$n.json 2>/dev/null || true
            grep -h "MBIST completed" hw/soc/out/soc-mbist-$n/*.log 2>/dev/null | head -3 || true
          done
          exit $fail
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: eth-knobs-${{ matrix.part }}-${{ github.run_id }}
          path: |
            out/*.log
            out/*.xml
            out/*.json
            out/formal/*/*.log
            out/joint-*/result.json
            out/joint-*/run.log
            out/joint-*/results.xml
          retention-days: 30
