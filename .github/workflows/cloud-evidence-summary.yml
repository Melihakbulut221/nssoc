name: Core-only native extracted script qualification
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  guards:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      APPIMAGE_EXTRACT_AND_RUN: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Qualify guards and native flow imports
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends tcl libfuse2
          python3 scripts/qualify_core_only_extracted_guards.py
          python3 scripts/bootstrap_flow.py
          APP="$GITHUB_WORKSPACE/hw/soc/tools/physical/librelane-3.0.5-x86_64.AppImage"
          "$APP" python hw/soc/pnr/core_only_detailed_route_flow.py --help > hw/soc/out/core-only-extracted-guards/native-route-help.txt
          "$APP" python hw/soc/pnr/core_only_routed_extraction_flow.py --help > hw/soc/out/core-only-extracted-guards/native-extraction-help.txt
          "$APP" python scripts/qualify_core_only_native_adapters.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: core-only-extracted-guards-${{ github.run_id }}
          path: hw/soc/out/core-only-extracted-guards/
          if-no-files-found: error
          retention-days: 90
