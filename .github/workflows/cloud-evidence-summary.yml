name: Replay write predecode actual RTL equivalence
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prove:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts
            hw/soc/rtl/pcie
      - name: Install actual Yosys
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y yosys
          yosys -V
      - name: Prove real replay state and outputs without blackboxes
        run: python3 scripts/prove_replay_write_predecode.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: replay-write-predecode-equivalence-${{ github.run_id }}
          path: |
            out/*.log
            out/*.ys
            out/*.json
          retention-days: 30
