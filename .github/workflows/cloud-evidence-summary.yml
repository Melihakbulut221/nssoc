name: Core-only routed netlist native boot and system MBIST
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  boot:
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: YosysHQ/setup-oss-cad-suite@aefa8397bbf8fc6670a0a62af9805a89738f3cde
        with:
          version: '2026-08-04'
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends binutils-riscv64-linux-gnu
      - name: Authenticate routed netlist and run native core boot
        run: |
          python3 -m py_compile scripts/cloud_core_only_routed_boot.py
          python3 scripts/cloud_core_only_routed_boot.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: core-only-routed-boot-${{ github.run_id }}
          path: |
            hw/soc/out/core-only-routed-boot/**/*.json
            hw/soc/out/core-only-routed-boot/**/*.log
            hw/soc/out/core-only-routed-boot/**/*.v
          if-no-files-found: error
          retention-days: 90
