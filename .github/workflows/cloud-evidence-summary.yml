name: Exact PLL terminal passive incidence for noninvasive current observation
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  readback:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python3 -m pip install numpy==2.3.3
      - run: python3 -B scripts/pll_terminal_incidence.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: pll-terminal-incidence-derived-${{ github.run_id }}
          path: pll-terminal-incidence/readback.json
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: pll-terminal-incidence-native-${{ github.run_id }}
          path: pll-terminal-incidence/
          if-no-files-found: error
          retention-days: 90
