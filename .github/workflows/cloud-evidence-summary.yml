# SPDX-License-Identifier: Apache-2.0
name: Source-only mainchip endpoint obstacle observer controls
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: mainchip-drt-obstacle-controls-${{ github.ref }}
  cancel-in-progress: false
env:
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  source-controls:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/mainchip-drt-obstacle-readback-source.json
      - name: Materialize complete unchanged native dependency and new source closure
        run: |
          python3 -B - <<'PY'
          import json,subprocess
          from pathlib import Path
          manifest='scripts/mainchip-drt-obstacle-readback-source.json'
          m=json.loads(Path(manifest).read_bytes())
          names=sorted(set(m['files'])|set(m['inherited_files'])|{manifest})
          assert all(not n.startswith('/')and '..'not in Path(n).parts and not any(c in n for c in '*?[!\\\n\r')for n in names)
          subprocess.run(['git','sparse-checkout','set','--no-cone','--stdin'],input=''.join('/'+n+'\n'for n in names),text=True,check=True)
          PY
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Bind exact current source and disabled native execution
        run: |
          python3 -B scripts/mainchip_drt_obstacle_contract.py
          python3 -B - <<'PY'
          import ast,json
          from pathlib import Path
          m=json.loads(Path('scripts/mainchip-drt-obstacle-readback-source.json').read_bytes())
          assert m['native_readonly_authorized'] is False and m['native_routing_authorized'] is False
          for n in m['files']:
              if n.endswith('.py'):ast.parse(Path(n).read_text())
          PY
      - name: Run unchanged archive controls and textual manifest controls
        run: |
          python3 -B scripts/check_mainchip_terminal_readback.py
          python3 -B scripts/check_mainchip_drt_report_analysis.py
      - name: Run exact DBU census endpoint and complete pin synthetic controls
        run: python3 -B scripts/check_mainchip_drt_obstacle.py
  preserve-job-log:
    needs: source-controls
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Preserve full actual source job log and metadata
        run: |
          python3 -B - <<'PY'
          import hashlib,json,os,subprocess
          from pathlib import Path
          root=Path('job-logs');root.mkdir()
          e=os.environ
          assert e['GITHUB_REPOSITORY']=='Melihakbulut221/nssoc' and e['GITHUB_RUN_ATTEMPT']=='1'
          prefix='repos/'+e['GITHUB_REPOSITORY']+'/'
          def read(path,name):
              b=subprocess.check_output(['gh','api',prefix+path]);(root/name).write_bytes(b);return json.loads(b)
          run=read('actions/runs/'+e['GITHUB_RUN_ID'],'run.json')
          assert run['head_sha']==e['GITHUB_SHA'] and run['run_attempt']==1
          jobs=read('actions/runs/'+e['GITHUB_RUN_ID']+'/attempts/1/jobs?per_page=100','jobs.json')
          selected=[j for j in jobs['jobs'] if j['name']=='source-controls'];assert len(selected)==1
          j=selected[0];assert j['status']=='completed' and j['head_sha']==e['GITHUB_SHA']
          read('actions/jobs/'+str(j['id']),'job.json')
          b=subprocess.check_output(['gh','api','--allow-escape-sequences',prefix+'actions/jobs/'+str(j['id'])+'/logs'])
          assert b;(root/'job.log').write_bytes(b)
          receipt=dict(source=e['GITHUB_SHA'],run_id=int(e['GITHUB_RUN_ID']),attempt=1,
            job_id=j['id'],job_conclusion=j['conclusion'],full_raw_job_log=True,
            log_bytes=len(b),log_sha256=hashlib.sha256(b).hexdigest(),native_acquisition=False)
          (root/'receipt.json').write_text(json.dumps(receipt,sort_keys=True,indent=2)+'\n')
          print(json.dumps(receipt,sort_keys=True))
          PY
      - name: Preserve complete actual logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mainchip-drt-obstacle-source-job-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: job-logs
          if-no-files-found: error
          retention-days: 90

