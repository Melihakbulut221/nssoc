name: Validate native buf2 taper and feedback delay cell functions
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: sudo apt-get update -qq && sudo apt-get install -y iverilog
      - run: python3 scripts/prove_delay_eco_cells.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: taper-feedback-cell-functions-${{ github.run_id }}
          path: eco-cell-proof/
          if-no-files-found: error
          retention-days: 90
