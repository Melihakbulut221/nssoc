name: Verify current prepared source structural gates without weakening stale-hash checks
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  guards:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: YosysHQ/setup-oss-cad-suite@aefa8397bbf8fc6670a0a62af9805a89738f3cde
        with:
          version: '2026-08-04'
          github-token: ${{ github.token }}
      - run: python3 -m pip install --disable-pip-version-check -r sw/requirements.txt -r hw/requirements.txt
      - run: python3 -B scripts/cloud_check_current_prepared_sources.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: current-prepared-guards-${{ github.run_id }}
          path: prepared-current-guards/
          if-no-files-found: error
          retention-days: 90
