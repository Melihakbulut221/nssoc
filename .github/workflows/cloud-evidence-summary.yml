name: Qualify system-only MBIST boot observer
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: YosysHQ/setup-oss-cad-suite@aefa8397bbf8fc6670a0a62af9805a89738f3cde
        with:
          version: '2026-08-04'
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - run: python3 -m pip install pytest==8.4.2
      - run: python3 -m pytest -q sw/tests/test_logic_boot_gl.py
      - run: python3 scripts/qualify_system_mbist_monitor.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: system-mbist-observer-${{ github.run_id }}
          path: out/system-mbist-monitor/
          if-no-files-found: error
          retention-days: 90
