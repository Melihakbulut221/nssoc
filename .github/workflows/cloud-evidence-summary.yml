name: Collect authenticated electrical violation reports for targeted repair
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  collect:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python3 scripts/cloud_core_only_combined_electrical_reports.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: core-only-combined-electrical-reports-${{ github.run_id }}
          path: hw/soc/out/core-only-combined-electrical-reports/
          if-no-files-found: error
          retention-days: 90
