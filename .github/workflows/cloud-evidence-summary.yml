name: Verify full mirror regeneration
on: workflow_dispatch
permissions:
  contents: read
jobs:
  mirror:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Run both full tracked-tree generations
        run: |
          df -h .
          python -m pip install -r sw/requirements.txt
          python -m pytest -q -rs sw/tests/test_mirror_redaction_is_idempotent.py
          df -h .
