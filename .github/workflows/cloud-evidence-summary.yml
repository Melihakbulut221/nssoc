name: Visible-neighbour DRT experiment on the full64 47-net-cleared database
on:
  workflow_dispatch:
    inputs:
      iterations:
        type: string
        default: '4'
permissions:
  contents: read
  actions: read
jobs:
  visible-neighbors:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      GH_TOKEN: ${{ github.token }}
      IMAGE: openroad/ubuntu24.04-dev@sha256:468fcd7f156dd350a648b0a3038ea16a5a25fde2e1b527f03d052108fea5ff3a
      ENGINE_PART: '706643321'
      ENGINE_PART_SHA: 69b0c127830daeefb6de5731e88ca858627814e407970dd8e176868110e1215c
      ENGINE_SHA: e12b1c70296c119c31ed5b1a7f739904d06b3c86cd703eebee25dbcc9c357431
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: /scripts/drt_visible_neighbors.py
      - name: Acquire pinned engine, image and full64 capsule members
        run: |
          set -euo pipefail
          W=/mnt/v; sudo mkdir -p $W/e $W/c $W/o; sudo chown -R $USER $W
          cp scripts/drt_visible_neighbors.py $W/o/
          docker pull -q "$IMAGE"
          gh api repos/${{ github.repository }}/releases/assets/$ENGINE_PART -H "Accept: application/octet-stream" > $W/engine.tgz
          echo "$ENGINE_PART_SHA  $W/engine.tgz" | sha256sum -c -
          tar -xzf $W/engine.tgz -C $W/e
          E=$(find $W/e -type f -name openroad -exec sha256sum {} + | awk -v s=$ENGINE_SHA '$1==s{print $2}' | head -1)
          test -n "$E"; cp "$E" $W/openroad; chmod +x $W/openroad
          gh api repos/${{ github.repository }}/releases/assets/708614943 -H "Accept: application/octet-stream" > $W/parts.json
          for id in 708615066 708616238 708617161; do gh api repos/${{ github.repository }}/releases/assets/$id -H "Accept: application/octet-stream" >> $W/capsule.tgz; done
          python3 -c "import json,hashlib;p=json.load(open('$W/parts.json'));h=hashlib.sha256(open('$W/capsule.tgz','rb').read()).hexdigest();assert h==p['archive']['sha256'],h"
          tar -tzf $W/capsule.tgz | grep -E "/narrow47-cleared.odb$|narrow47-original-classes.json$|narrow47-native-selection.json$" > $W/members.txt
          cat $W/members.txt
          tar -xzf $W/capsule.tgz -C $W/c $(cat $W/members.txt); rm $W/capsule.tgz
          cp $(find $W/c -name narrow47-cleared.odb) $W/o/cleared.odb
          cp $(find $W/c -name narrow47-original-classes.json) $W/o/classes.json
          cp $(find $W/c -name narrow47-native-selection.json) $W/o/selection.json
      - name: Restore original classes, route with visible neighbours, measure
        run: |
          set -euo pipefail
          W=/mnt/v; N=${{ inputs.iterations }}
          cat > $W/o/route.tcl <<TCL
          read_db /v/o/visible.odb
          set_routing_layers -signal Metal2-TopMetal2 -clock Metal4-TopMetal2
          set_thread_count 4
          detailed_route -droute_end_iter $N -or_seed 42 -verbose 1 -output_drc /v/o/route.drc
          write_db /v/o/routed.odb
          TCL
          printf 'read_db /v/o/routed.odb\nset_thread_count 4\ndrt::check_drc -output_file /v/o/check.rpt -marker_name CHK\n' > $W/o/check.tcl
          cat > $W/o/run.sh <<'SH'
          set -e
          cd /v/o
          PHASE=prepare SRC=/v/o/cleared.odb DST=/v/o/visible.odb CLASSES=/v/o/classes.json CENSUS=/v/o/census-before.json /v/openroad -no_init -exit -python /v/o/drt_visible_neighbors.py
          /v/openroad -no_init -exit /v/o/route.tcl > /v/o/route.log 2>&1 || echo ROUTE_FAILED
          grep -E "Number of violations|elapsed time = .*peak|Start .* iteration" /v/o/route.log | tail -20
          /v/openroad -no_init -exit /v/o/check.tcl > /v/o/check.log 2>&1 || echo CHECK_FAILED
          echo "CHECK_DRC markers=$(grep -c 'violation type' /v/o/check.rpt || true)"
          grep -o "violation type: [A-Za-z ]*" /v/o/check.rpt | sort | uniq -c || true
          PHASE=census SRC=/v/o/routed.odb DST=- CENSUS=/v/o/census-after.json /v/openroad -no_init -exit -python /v/o/drt_visible_neighbors.py
          python3 - <<'PY'
          import json
          a=json.load(open('/v/o/census-before.json'));b=json.load(open('/v/o/census-after.json'));sel=set(json.load(open('/v/o/selection.json'))['selected'])
          ch=[n for n in a if a[n][1]!=b[n][1]];cls=[n for n in a if a[n][0]!=b[n][0]]
          print('WIRES_CHANGED',len(ch),'of',len(a),'selected_changed',len(set(ch)&sel),'fixed_changed',sum(1 for n in ch if a[n][0]=='FIXED'),'class_changed',len(cls))
          json.dump(dict(changed=sorted(ch)[:5000],count=len(ch)),open('/v/o/changed.json','w'))
          PY
          SH
          docker run --rm -v $W:/v "$IMAGE" bash /v/o/run.sh | tee $W/o/summary.txt
          mkdir -p visible && cp $W/o/summary.txt $W/o/route.log $W/o/check.rpt $W/o/check.log $W/o/changed.json visible/ 2>/dev/null || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: drt-visible-neighbors-${{ github.run_id }}
          path: visible
          if-no-files-found: warn
          retention-days: 90
