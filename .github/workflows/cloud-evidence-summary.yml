name: Replay predecode actual CPU PCIe Ethernet SRAM integration
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  joint:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: YosysHQ/setup-oss-cad-suite@aefa8397bbf8fc6670a0a62af9805a89738f3cde
        with:
          version: '2026-08-04'
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Prepare qualified CPU RTL and vendor functional SRAM models
        run: |
          set -euo pipefail
          echo "CAD_BIN=$(dirname "$(command -v iverilog)")" >> "$GITHUB_ENV"
          python3 -m pip install -r sw/requirements.txt
          python3 -m venv hw/.venv
          hw/.venv/bin/pip install -r hw/requirements.txt
          make soc-rtl-prepare INTERFACE_PYTHON="$PWD/hw/.venv/bin/python"
          python3 hw/soc/flow/prepare_ihp_native_boot.py
      - name: Run actual concurrent CPU PCIe GMII traffic and FIFO POR MBIST
        run: |
          set -euo pipefail
          mkdir -p out
          flags=(--async-pcie)
          for d in SOC_ETH_FIFO_RDREG SOC_BUSSTAT_EVPEND SOC_SRAM_MBIST_PIPE SOC_PCIE_RX_READ2 SOC_BUS_IREQ_REG SOC_PCIE_RESET_COPIES SOC_ETH_FIFO_WRREG SOC_PCIE_REPLAY_INBANK SOC_PCIE_TX_WORD_REG SOC_PCIE_REPLAY_AHEAD SOC_PCIE_CREDIT_PICK SOC_PCIE_SEQ_RX_REG SOC_PCIE_RX_COMMIT_COPIES SOC_PCIE_REPLAY_WRITE_PREDECODE; do
            flags+=(--define "$d")
          done
          for mode in inferred vendor; do
            memory=()
            if [ "$mode" = vendor ]; then memory=(--eth-mbist-pdk hw/soc/tools/ihp-native-boot-c4b8b4e/ihp-sg13g2); fi
            hw/.venv/bin/python scripts/check_pcie_ethernet_soc.py --out "out/$mode" --iverilog-dir "$CAD_BIN" "${flags[@]}" "${memory[@]}" > "out/$mode.log" 2>&1 || { tail -60 "out/$mode.log"; exit 1; }
          done
          python3 - <<'PYGATE'
          import json,pathlib
          for mode in ['inferred','vendor']:
              d=json.loads(pathlib.Path('out',mode,'result.json').read_text())
              assert d['status']=='PASS' and d['tests']=={'passed':2,'failed':0,'skipped':0}
              assert d['unchanged'] and d['runtime_unchanged'] and d['asynchronous_pcie']
              assert 'SOC_PCIE_REPLAY_WRITE_PREDECODE' in d['defines']
              assert d['ethernet_sram_instances']==(16 if mode=='vendor' else 0)
          PYGATE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: replay-predecode-joint-${{ github.run_id }}
          path: |
            out/*.log
            out/*/result.json
            out/*/results.xml
            out/*/run.log
          retention-days: 30
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: replay-predecode-joint-inputs-native-${{ github.run_id }}
          path: out/*/inputs.tar.gz
          retention-days: 30
