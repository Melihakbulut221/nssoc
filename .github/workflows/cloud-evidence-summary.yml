name: PCIe source-semantics-preserving mutual equivalence
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  equivalence:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    strategy:
      fail-fast: false
      matrix:
        configuration: [default, cut10]
        direction: [forward, reverse]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          filter: blob:none
          sparse-checkout: |
            hw/soc/rtl/pcie
            scripts
      - name: Retry transient download failures
        run: printf 'retry = 10\nretry-delay = 30\nretry-all-errors\nfail\n' > ~/.curlrc
      - uses: YosysHQ/setup-oss-cad-suite@aefa8397bbf8fc6670a0a62af9805a89738f3cde
        id: cad1
        continue-on-error: true
        with:
          version: '2026-08-04'
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - if: steps.cad1.outcome == 'failure'
        run: sleep 180
      - uses: YosysHQ/setup-oss-cad-suite@aefa8397bbf8fc6670a0a62af9805a89738f3cde
        id: cad2
        if: steps.cad1.outcome == 'failure'
        continue-on-error: true
        with:
          version: '2026-08-04'
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - if: steps.cad1.outcome == 'failure' && steps.cad2.outcome == 'failure'
        run: sleep 300
      - uses: YosysHQ/setup-oss-cad-suite@aefa8397bbf8fc6670a0a62af9805a89738f3cde
        if: steps.cad1.outcome == 'failure' && steps.cad2.outcome == 'failure'
        with:
          version: '2026-08-04'
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Prove width-only changes against the preceding RTL
        run: python3 -u scripts/check_pcie_width_equivalence.py "${{ matrix.configuration }}" "${{ matrix.direction }}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: pcie-width-reference-x-${{ matrix.configuration }}-${{ matrix.direction }}-${{ github.run_id }}
          path: |
            out/*.log
            out/*.ys
            out/result.json
            out/selector-controls.json
            out/reference-normalization.json
          if-no-files-found: error
          retention-days: 90
