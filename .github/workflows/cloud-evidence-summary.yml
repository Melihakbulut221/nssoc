name: Prove CRC flag invariant and compose full-module equivalence
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  formal:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: sudo apt-get update -qq && sudo apt-get install -y yosys
      - run: python3 formal/lcrc_upper_compare/prove_composition.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: lcrc-composition-${{ github.run_id }}
          path: lcrc-composition/
          if-no-files-found: error
          retention-days: 90
