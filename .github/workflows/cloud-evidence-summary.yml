name: Original MBIST monitor cross-engine diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts
            hw/soc/tb
      - uses: YosysHQ/setup-oss-cad-suite@aefa8397bbf8fc6670a0a62af9805a89738f3cde
        with:
          version: '2026-08-04'
          github-token: ${{ github.token }}
      - name: Build exact CVC compiler
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends build-essential zlib1g-dev
          git init cvc-source
          git -C cvc-source remote add origin https://github.com/cambridgehackers/open-src-cvc.git
          git -C cvc-source fetch --depth=1 origin 1c5e043ec33ef6f1fdbf38565501c944893a83cf
          git -C cvc-source checkout --detach FETCH_HEAD
          test "$(git -C cvc-source rev-parse HEAD)" = 1c5e043ec33ef6f1fdbf38565501c944893a83cf
          make -C cvc-source/src -j2 cvc64 > cvc-build.log 2>&1
      - run: python3 scripts/diagnose_mbist_monitor_engines.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: mbist-monitor-engines-${{ github.run_id }}
          path: |
            mbist-monitor-probe/
            cvc-build.log
          if-no-files-found: error
          retention-days: 90
