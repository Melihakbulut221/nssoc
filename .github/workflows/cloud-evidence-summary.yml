name: Core-only whole-SoC lint evidence
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      SOC_INTERFACE_PROFILE: full
      SOC_RELEASE_PROFILE: core-only
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: YosysHQ/setup-oss-cad-suite@aefa8397bbf8fc6670a0a62af9805a89738f3cde
        with:
          version: '2026-08-04'
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Prepare full retained interfaces and pinned core
        run: |
          set -euo pipefail
          echo "OSS_CAD_SUITE=$(dirname "$(dirname "$(command -v yosys)")")" >> "$GITHUB_ENV"
          python3 -m venv .venv
          .venv/bin/pip install -r sw/requirements.txt -r hw/requirements.txt
          make soc-rtl-prepare INTERFACE_PYTHON="$PWD/.venv/bin/python"
      - name: Reject inconsistent release selections
        run: |
          set -euo pipefail
          mkdir -p hw/soc/out/core-only-lint-controls
          if .venv/bin/python scripts/check_soc_lint.py --release-profile core-only --eth-mbist >hw/soc/out/core-only-lint-controls/eth.log 2>&1; then
            echo "Unexpected Ethernet MBIST acceptance"; exit 1
          fi
          grep -F 'core-only forbids Ethernet MBIST' hw/soc/out/core-only-lint-controls/eth.log
          if SOC_PCIE_PROFILE=on .venv/bin/python scripts/check_soc_lint.py --release-profile core-only >hw/soc/out/core-only-lint-controls/pcie.log 2>&1; then
            echo "Unexpected PCIe acceptance"; exit 1
          fi
          grep -F 'core-only forbids PCIe' hw/soc/out/core-only-lint-controls/pcie.log
      - name: Compile actual core-only array profile against explicit warning policy
        run: .venv/bin/python scripts/check_soc_lint.py --profile full --release-profile core-only --output hw/soc/out/core-only-lint-array
      - name: Restore authenticated compiled loader
        run: .venv/bin/python scripts/prepare_core_only_lint_rom.py
      - name: Compile actual SRAM MBIST SYNPRE and fixed-ROM release profile
        run: .venv/bin/python scripts/check_soc_lint.py --profile full --release-profile core-only --memory sram-logic --mbist --rom-image hw/soc/out/core-only-lint-rom/test_soc.bin --output hw/soc/out/core-only-lint-physical
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: core-only-lint-${{ github.run_id }}
          path: |
            hw/soc/out/core-only-lint-array/
            hw/soc/out/core-only-lint-controls/
            hw/soc/out/core-only-lint-rom/
            hw/soc/out/core-only-lint-physical/
          if-no-files-found: error
          retention-days: 90
