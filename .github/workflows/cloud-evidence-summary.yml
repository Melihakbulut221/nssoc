name: SP matrix and top immutable hierarchy inventory
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: /scripts/diagnose_sp_matrix_top.py
      - run: python3 -m pip install --disable-pip-version-check --no-cache-dir klayout==0.30.13
      - run: gh api repos/${{ github.repository }}/actions/artifacts/14113282480/zip > native.zip
      - run: python3 scripts/diagnose_sp_matrix_top.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sp-matrix-top-derived-${{ github.run_id }}
          path: out/*.json
          if-no-files-found: error
          retention-days: 90
