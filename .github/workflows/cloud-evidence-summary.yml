name: Classify native replay Verilog parser failure
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Inspect bounded parser context on cloud runner
        run: |
          gh api repos/${{ github.repository }}/actions/artifacts/14121339687/zip > native.zip
          python3 - <<'PYAUDIT'
          import zipfile,hashlib,json,pathlib
          b=pathlib.Path('native.zip').read_bytes();assert hashlib.sha256(b).hexdigest()=='0e5355f3d4b464f6140577ae29150b1896515f1272d5446bce2f763e26b8698e'
          z=zipfile.ZipFile('native.zip');s=z.read('baseline.v').decode();assert hashlib.sha256(s.encode()).hexdigest()=='94d9fdf2d76a62596c71a62683133d35cac34d33baa7616fd4251957646c55e7'
          lines=s.splitlines();d={'error_line':4463,'bounded_native_parser_context':{str(i+1):lines[i] for i in range(4457,4468)},'line_count':len(lines)}
          pathlib.Path('parser-context.json').write_text(json.dumps(d,indent=2))
          PYAUDIT
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: replay-parser-context-${{ github.run_id }}
          path: parser-context.json
          retention-days: 30
