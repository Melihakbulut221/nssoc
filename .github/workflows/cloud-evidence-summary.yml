name: Independent SRAM macro body connection context
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          filter: blob:none
          sparse-checkout: |
            scripts
            hw/soc/flow
      - name: Restore the exact extracted circuits in the cloud
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api repos/${{ github.repository }}/actions/artifacts/14069436539/zip > reference.zip
      - name: Check topology and every collapsed capacitance pair with fault injection
        run: python3 -u scripts/audit_sram_reference_body_context.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: sram-reference-body-${{ github.run_id }}
          path: out
          if-no-files-found: error
          retention-days: 90
