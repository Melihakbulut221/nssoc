name: Compare exact flash image bytes with mapped-source ELF
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  diagnose:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Acquire unchanged pinned source prerequisites
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends binutils-riscv64-linux-gnu
          python3 hw/soc/flow/prepare_ihp_native_boot.py
      - name: Restore exact mapped-source firmware
        run: python3 scripts/restore_predecode_chip_boot.py
      - name: Authenticate failed trace and disassemble unchanged startup
        run: python3 scripts/inspect_boot_pairing.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: boot-flash-image-pairing-${{ github.run_id }}
          path: boot-pairing-audit/
          if-no-files-found: error
          retention-days: 90
