name: Read exact new chip CTS worst paths and clock diagnostics
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  reports:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: /scripts/read_predecode_cts_reports.py
      - run: python3 scripts/read_predecode_cts_reports.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: predecode-cts-reports-${{ github.run_id }}
          path: out/
          if-no-files-found: error
          retention-days: 90
