name: DP SRAM full macro native identity and physical fault controls with strict contents comparison
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  diagnose:
    strategy:
      fail-fast: false
      matrix:
        mutation: [identity, resistor_width, resistor_layer, mos_gate_open]
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      GH_TOKEN: ${{ github.token }}
      QT_QPA_PLATFORM: offscreen
      NSSOC_MUTATION: ${{ matrix.mutation }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/replay_dp_sram_bounded.py
            /scripts/check_lvs_bounded_search.rb
            /hw/soc/flow/audit_klayout_lvs.py
      - name: Restore exact native archive and runtime in cloud
        run: |
          set -euo pipefail
          gh api repos/${{ github.repository }}/actions/artifacts/14110867794/zip > native.zip
          curl -fL --retry 5 https://www.klayout.org/downloads/Ubuntu-24/klayout_0.30.13-1_amd64.deb -o /tmp/klayout.deb
          echo '0bb6b913fd6a32581d50b08be744b522a2a477baa1ed7e253c97cc18ce248a24  /tmp/klayout.deb' | sha256sum -c -
          sudo apt-get update -qq
          sudo apt-get install -y /tmp/klayout.deb
          python3 -m pip install klayout==0.30.13
      - name: Verify unchanged rejection of graph and parameter faults
        run: klayout -b -zz -r scripts/check_lvs_bounded_search.rb
      - name: Diagnose preserved full-macro comparison with bounded search
        run: python3 scripts/replay_dp_sram_bounded.py
      - name: Require actual native identity pass or actual mutation rejection
        run: |
          python3 - <<'PYCHECK'
          import json,os
          from pathlib import Path
          result=json.loads(Path('out/derived/bounded-result.json').read_text())
          audit=json.loads(Path('out/derived/audit.json').read_text())
          case=os.environ['NSSOC_MUTATION']
          assert result['status']=='DIAGNOSTIC_COMPARISON_COMPLETE' and result['returncode']==0
          actual=result['comparison_passed_within_diagnostic_scope']
          assert actual==(case=='identity'), (case,actual,audit['reasons'])
          assert result['audit_returncode']==(0 if case=='identity' else 1)
          if case!='identity':assert any(row['status']=='NoMatch' for row in audit['circuits'])
          Path('out/derived/full-macro-control-result.json').write_text(json.dumps({'status':'PASS','case':case,'actual_native_comparison_passed':actual,'manufacturing_approval':False},indent=2))
          PYCHECK
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: dp-sram-full-control-derived-${{ matrix.mutation }}-${{ github.run_id }}
          path: |
            out/derived/*.json
            out/comparison-controls.json
          if-no-files-found: error
          retention-days: 90
      - name: Preserve native diagnostic evidence on cloud
        if: always()
        run: |
          if [ -d out/native ]; then tar -czf bounded-native.tgz -C out native; fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: dp-sram-full-control-native-${{ matrix.mutation }}-${{ github.run_id }}
          path: bounded-native.tgz
          if-no-files-found: warn
          retention-days: 30
