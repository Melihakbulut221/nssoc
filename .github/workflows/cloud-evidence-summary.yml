name: Extract fresh select650 native metal and via RC
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  binding:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python3 -m pip install --disable-pip-version-check --no-cache-dir numpy==2.3.3 klayout==0.30.4.post1
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends tcl8.6 tk8.6 libx11-6 libxext6 libxrender1 libxt6 libcairo2
          python3 -m pip install --disable-pip-version-check --no-cache-dir networkx==3.5
      - run: python3 -B scripts/extract_select650_metal_rc.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: select650-metal-rc-${{ github.run_id }}
          path: |
            select650-metal-rc/derived/
            select650-metal-rc/native/wire-stage/wire/
          if-no-files-found: error
          retention-days: 90
