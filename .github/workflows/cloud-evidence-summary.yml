name: Compose current width2 physical650 intrinsic and parasitic models
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  compose:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      APPROVED_SOURCE: ${{ github.sha }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python3 -m pip install --disable-pip-version-check --no-cache-dir numpy==2.3.3 klayout==0.30.4.post1
      - run: python3 -B scripts/compose_current_select650.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: current-select650-composition-${{ github.run_id }}
          path: |
            paired650-full-composition/derived/
            paired650-full-composition/native/composition-*/
          if-no-files-found: error
          retention-days: 90
