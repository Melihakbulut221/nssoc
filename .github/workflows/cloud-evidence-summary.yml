name: Authenticated queue credit CRC timing path diagnosis
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  diagnose:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify archive and inspect remaining native paths
        run: python3 scripts/diagnose_credit_crc_paths.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: queue-credit-crc-path-diagnosis-${{ github.run_id }}
          path: path-diagnosis/
          if-no-files-found: error
          retention-days: 90
