name: Recheck actual queue register mapping without repeating synthesis
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  recheck:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      SOC_PCIE_CREDIT_DATA_SIGN_REG: '1'
      SOC_PCIE_CRC_UPPER_COMPARE_REG: '1'
      SOC_PCIE_RX_COUNT_FLAGS: '1'

      SOC_PCIE_RX_CURSOR_LOCAL_RESET: '1'
      SOC_PCIE_RX_LOCAL_LANE_NEXT: '1'
      SOC_PCIE_ACK_STALE_PREFIX: '1'
      SOC_PCIE_RX_DLLP_LAST_COMPARE: '1'
      SOC_ETH_FIFO_RDREG: '1'
      SOC_BUSSTAT_EVPEND: '1'
      SOC_SRAM_MBIST_PIPE: '1'
      SOC_PCIE_RX_READ2: '1'
      SOC_BUS_IREQ_REG: '1'
      SOC_PCIE_RESET_COPIES: '1'
      SOC_ETH_FIFO_WRREG: '1'
      SOC_PCIE_REPLAY_INBANK: '1'
      SOC_PCIE_TX_WORD_REG: '1'
      SOC_PCIE_REPLAY_AHEAD: '1'
      SOC_PCIE_CREDIT_PICK: '1'
      SOC_PCIE_SEQ_RX_REG: '1'
      SOC_PCIE_RX_COMMIT_COPIES: '1'
      SOC_PCIE_REPLAY_WRITE_PREDECODE: '1'
      SOC_PCIE_REPLAY_EOP_CACHE: '1'
      SOC_PCIE_REPLAY_CRC_SELECT: '1'
      SOC_SYNTH_PREFIX_ADDER: '1'
      IBEX_EX_STAGE: '1'
      IBEX_PMP_REQ_REG: '1'
      NATIVE_RF_CHKDEFER: '1'
      NATIVE_RF_PREDECODE: '1'
      SOC_INTERFACE_PROFILE: 'full'
      NATIVE_MEM_RDREG: '2'
      SOC_CORE_REQ_REG: '0'
      SOC_CORE_WB_STAGE: '0'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: YosysHQ/setup-oss-cad-suite@aefa8397bbf8fc6670a0a62af9805a89738f3cde
        with:
          version: '2026-08-04'
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - run: python3 scripts/recheck_queue_count_mapping.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: queue-count-rechecked-mapping-${{ github.run_id }}
          path: out/*.json
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: queue-count-rechecked-native-${{ github.run_id }}
          path: native/build.tgz
          if-no-files-found: error
          retention-days: 90
