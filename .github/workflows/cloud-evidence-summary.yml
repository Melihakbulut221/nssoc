name: Cut10 routed source contract recovery
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  recover:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          filter: blob:none
          sparse-checkout: scripts
      - name: Restore exact routed archive only in cloud
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api repos/${{ github.repository }}/actions/artifacts/14068260482/zip > routed.zip
      - name: Recover compile configuration and source hashes only
        run: python3 -u scripts/inspect_cut10_routed_source_contract.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: cut10-source-contract-${{ github.run_id }}
          path: out
          if-no-files-found: error
          retention-days: 90
