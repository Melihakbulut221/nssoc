name: Generate current650 compact band candidate with native contact guards
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: python3 -m pip install klayout==0.30.4.post1
      - run: python3 scripts/compact_current650.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: current650-placement-audit-${{ github.run_id }}
          path: |
            current650-placement-audit/
          if-no-files-found: error
          retention-days: 90
