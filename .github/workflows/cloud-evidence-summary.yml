name: Diagnostic RC and STA of resized antenna-rejected route
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  qualify:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    env:
      GH_TOKEN: ${{ github.token }}
      APPIMAGE_EXTRACT_AND_RUN: '1'
      NSSOC_ROUTE_ARTIFACT_ID: '14470750161'
      NSSOC_ROUTE_ARTIFACT_DIGEST: 'sha256:649654de02cb1931abd888d8ffbb038f5cb743e89aa8dfe4a7ee484805fb8415'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Prepare pinned native runtime
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libfuse2 tcl
          python3 -m py_compile scripts/cloud_core_only_critical_route_diagnostic.py
          python3 scripts/test_antenna_insertion_admission.py
          python3 scripts/test_antenna_netlist_export.py
          python3 scripts/bootstrap_flow.py
          echo "CLOUD_APPIMAGE=$GITHUB_WORKSPACE/hw/soc/tools/physical/librelane-3.0.5-x86_64.AppImage" >> "$GITHUB_ENV"
      - name: Export fresh routed views, extract nominal RC and run three-corner STA
        run: python3 scripts/cloud_core_only_critical_route_diagnostic.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: core-only-critical-route-diagnostic-${{ github.run_id }}
          path: hw/soc/out/core-only-critical-route-diagnostic/
          if-no-files-found: error
          retention-days: 90
