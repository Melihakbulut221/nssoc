name: Inspect existing repaired new RX reset critical paths
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: python3 -B scripts/cloud_audit_reset_critical.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: new-rx-reset-critical-audit-${{ github.run_id }}
          path: reset-critical-audit/
          if-no-files-found: error
          retention-days: 90
