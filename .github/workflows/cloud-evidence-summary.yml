name: Replay registered write predecode qualification
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install simulation and SAT tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y iverilog yosys
          python3 -m venv hw/.venv
          hw/.venv/bin/pip install -r hw/requirements.txt
      - name: Qualify same-cycle byte enables and reject wrong address decoding
        run: |
          mkdir -p out
          python3 scripts/qualify_replay_write_predecode.py
      - name: Compare all outputs against original replay implementation
        run: |
          set -euo pipefail
          bash scripts/check_pcie_replay_ahead.sh out/cosim 300000 SOC_PCIE_REPLAY_WRITE_PREDECODE
          bash scripts/check_pcie_replay_ahead.sh out/cosim-knobs 300000 SOC_PCIE_REPLAY_WRITE_PREDECODE SOC_PCIE_REPLAY_AHEAD SOC_PCIE_REPLAY_INBANK SOC_PCIE_RESET_COPIES
      - name: Reject an actual compiled wrong-byte-select RTL mutation
        run: |
          set -euo pipefail
          RTL=hw/soc/rtl/pcie/soc_pcie_replay_tx.v
          cp "$RTL" out/original-replay.v
          trap 'cp out/original-replay.v "$RTL"' EXIT
          python3 - <<'PYMUT'
          from pathlib import Path
          p=Path('hw/soc/rtl/pcie/soc_pcie_replay_tx.v');s=p.read_text()
          old="write_low<=16'b1 << capture_address[3:0];"
          new="write_low<=16'b1 << (capture_address[3:0] ^ 4'd1);"
          assert s.count(old)==1;p.write_text(s.replace(old,new))
          PYMUT
          if bash scripts/check_pcie_replay_ahead.sh out/mutation 2000 SOC_PCIE_REPLAY_WRITE_PREDECODE; then
            echo 'Wrong-byte RTL mutation was not rejected'; exit 1
          fi
          python3 - <<'PYMUT'
          import pathlib,json
          paths=list(pathlib.Path('out/mutation').glob('*.log'));assert len(paths)==6
          for p in paths:
              s=p.read_text();assert 'MISMATCH byte write strobe' in s and 'write strobe differs' in s,p
          pathlib.Path('out/compiled-mutation.json').write_text(json.dumps({'status':'PASS','actual_compiled_wrong_select_detected_in_seeds':6}))
          PYMUT
      - name: Existing independent replay and packet scoreboards
        run: |
          set -euo pipefail
          export PATH="$PWD/hw/.venv/bin:$PATH"
          O=$PWD/out
          for top in soc_pcie_replay_tx soc_pcie_reliable_packets soc_pcie_flow_packets soc_pcie_buffered_flow_packets; do
            make -C hw/soc/tb/cocotb -f Makefile.$top SIM_BUILD="$O/sim-$top" COCOTB_RESULTS_FILE="$O/$top.xml" EXTRA_COMPILE_ARGS=-DSOC_PCIE_REPLAY_WRITE_PREDECODE > "$O/$top.log" 2>&1 || { tail -60 "$O/$top.log"; exit 1; }
          done
          python3 - <<'PYTEST'
          import pathlib, xml.etree.ElementTree as E
          paths=list(pathlib.Path('out').glob('*.xml')); assert len(paths)==4
          for p in paths:
              cases=list(E.parse(p).iter('testcase')); assert cases
              assert all(t.find(k) is None for t in cases for k in ('failure','error','skipped')), p
              print(p,len(cases),'PASS')
          PYTEST
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: replay-write-predecode-${{ github.run_id }}
          path: |
            out/*.json
            out/*.log
            out/*.xml
            out/cosim/*.log
            out/cosim-knobs/*.log
            out/mutation/*.log
          retention-days: 30
