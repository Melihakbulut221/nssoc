name: Optimize complete current CDR macro connectivity for compact placement
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: /scripts/audit_cdr_native_cap_records.py
      - run: python3 -m pip install --disable-pip-version-check --no-cache-dir klayout==0.30.4.post1
      - run: |
          set -euo pipefail
          gh api repos/${{ github.repository }}/releases/assets/707281704 -H 'Accept: application/octet-stream' > metal.tgz
          gh api repos/${{ github.repository }}/releases/assets/706980601 -H 'Accept: application/octet-stream' > geometry.tgz
          python3 scripts/audit_cdr_native_cap_records.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cdr-native-cap-records-${{ github.run_id }}
          path: out/capacitor-native-records.json
          if-no-files-found: error
          retention-days: 90
