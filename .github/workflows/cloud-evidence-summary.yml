name: Core-only native IHP pad placement
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  pad-placement:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Place current native pad ring and verify geometry readback
        run: |
          set -euo pipefail
          python3 -m pip install klayout==0.30.9
          python3 scripts/cloud_core_only_io_floorplan.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: core-only-io-floorplan-${{ github.run_id }}
          path: hw/soc/out/core-only-io-floorplan/
          if-no-files-found: error
          retention-days: 90
