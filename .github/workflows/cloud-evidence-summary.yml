name: Build release without PCIe and Ethernet
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      GH_TOKEN: ${{ github.token }}
      SOC_RELEASE_PROFILE: core-only
      SOC_PCIE_PROFILE: off
      SOC_ETH_SRAM: '0'

      SOC_BUSSTAT_EVPEND: '1'
      SOC_SRAM_MBIST_PIPE: '1'
      SOC_BUS_IREQ_REG: '1'
      SOC_SYNTH_PREFIX_ADDER: '1'
      IBEX_EX_STAGE: '1'
      IBEX_PMP_REQ_REG: '1'
      NATIVE_RF_CHKDEFER: '1'
      NATIVE_RF_PREDECODE: '1'
      SOC_INTERFACE_PROFILE: 'full'
      NATIVE_MEM_RDREG: '2'
      SOC_CORE_REQ_REG: '0'
      SOC_CORE_WB_STAGE: '0'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: YosysHQ/setup-oss-cad-suite@aefa8397bbf8fc6670a0a62af9805a89738f3cde
        with:
          version: '2026-08-04'
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Prepare pinned source and tool inputs
        run: |
          set -euo pipefail
          echo "OSS_CAD_SUITE=$(dirname "$(dirname "$(command -v yosys)")")" >> "$GITHUB_ENV"
          python3 -m pip install -r sw/requirements.txt
          make soc-prepare
          bash -n scripts/prepare_core_only_mainchip.sh hw/soc/flow/syn_soc_top.sh hw/soc/flow/sim_soc.sh
          python3 -m pytest -q sw/tests/test_logic_boot_gl.py sw/tests/test_native_boot_preparation.py
      - name: Fresh firmware RTL boot and complete core-only synthesis
        run: python3 scripts/build_core_only_mainchip.py
      - name: Preserve native source even on failed measurement
        if: always()
        run: |
          mkdir -p native out
          if [ -d hw/soc/out/core-only-mainchip ]; then
            tar -czf native/build.tgz hw/soc/out/core-only-mainchip
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: core-only-mainchip-source-native-${{ github.run_id }}
          path: native/build.tgz
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: core-only-mainchip-mapping-${{ github.run_id }}
          path: |
            out/mapping.json
          if-no-files-found: error
          retention-days: 90
