name: Map exact ACK classification cone to pinned SG13G2 libraries
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts
            hw/soc/rtl/pcie
      - uses: YosysHQ/setup-oss-cad-suite@aefa8397bbf8fc6670a0a62af9805a89738f3cde
        with:
          version: '2026-08-04'
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - run: python3 scripts/measure_ack_stale_prefix.py
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ack-prefix-mapped-${{ github.run_id }}
          path: |
            out-ack-map/*.json
            out-ack-map/*.log
            out-ack-map/*.ys
            out-ack-map/*.v
          if-no-files-found: error
          retention-days: 90
