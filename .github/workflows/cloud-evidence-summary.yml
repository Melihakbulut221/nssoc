name: Verify current-parent MOS-only model-domain partition
on:
  workflow_dispatch:
    inputs:
      approved_source:
        description: Exact proposal source to verify
        required: true
        type: string
permissions:
  contents: read
env:
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  source-controls:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: /scripts/cdr-current-domain-partition-methods.json
      - name: Bind actual source and materialize full proposal closure
        env:
          APPROVED_SOURCE: ${{ inputs.approved_source }}
        run: |
          test "$APPROVED_SOURCE" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 -B - <<'PY'
          import json,subprocess
          from pathlib import Path
          m='scripts/cdr-current-domain-partition-methods.json'
          names=set(json.loads(Path(m).read_bytes())['files'])|{m}
          assert all(not p.startswith('/')and '..'not in Path(p).parts for p in names)
          subprocess.run(['git','sparse-checkout','set','--no-cone','--stdin'],input=''.join('/'+p+'\n'for p in sorted(names)),text=True,check=True)
          PY
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify all50-to200 proposals and actual-source renderer refusal cases
        run: |
          set -o pipefail
          python3 -B scripts/cdr_current_domain_partition.py --controls --out current-domain-controls 2>&1 | tee current-domain-controls.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: current-domain-controls-${{ github.run_id }}
          path: |
            current-domain-controls
            current-domain-controls.log
          if-no-files-found: error
          retention-days: 90
