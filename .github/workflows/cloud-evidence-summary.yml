# SPDX-License-Identifier: Apache-2.0
name: Exact failed observer artifact diagnostic readback
on:
  workflow_dispatch:
    inputs:
      approved_source:
        type: string
        required: true
permissions:
  contents: read
  actions: read
concurrency:
  group: mainchip-obstacle-failure-readback-${{ github.ref }}
  cancel-in-progress: false
env:
  PYTHONDONTWRITEBYTECODE: '1'
  APPROVED_SOURCE: ${{ inputs.approved_source }}
jobs:
  readback:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/mainchip-obstacle-failure-readback-source.json
      - name: Materialize only exact readback sources
        run: |
          python3 -B - <<'PY'
          import json,subprocess
          from pathlib import Path
          name='scripts/mainchip-obstacle-failure-readback-source.json'
          m=json.loads(Path(name).read_bytes())
          assert m['native_execution_authorized'] is False and m['artifact_readback_authorized'] is True
          names=sorted(set(m['files'])|{name})
          assert all(not n.startswith('/')and '..'not in Path(n).parts and not any(c in n for c in '*?[!\\\n\r')for n in names)
          subprocess.run(['git','sparse-checkout','set','--no-cone','--stdin'],input=''.join('/'+n+'\n'for n in names),text=True,check=True)
          PY
      - name: Run nine bounded archive and transport controls before artifact acquisition
        run: python3 -B scripts/mainchip_obstacle_failure_readback.py --controls
      - name: Authenticate all68 artifact members and preserve known derived diagnostics only
        run: python3 -B scripts/mainchip_obstacle_failure_readback.py > obstacle-failure-worker.stdout 2> obstacle-failure-worker.stderr
      - name: Always stream complete available derived evidence and failure streams
        if: always()
        run: |
          python3 -B - <<'PY'
          import base64,hashlib,json
          from pathlib import Path
          root=Path('obstacle-failure-evidence')
          paths=list(root.rglob('*'))if root.is_dir()else[]
          paths += [Path('obstacle-failure-worker.stdout'),Path('obstacle-failure-worker.stderr')]
          for path in sorted(paths):
              if not path.is_file():continue
              assert not path.is_symlink()
              name=path.relative_to(root).as_posix()if path.is_relative_to(root)else path.name
              raw=path.read_bytes();raw.decode('utf-8','strict')
              chunks=[raw[i:i+24000]for i in range(0,len(raw),24000)]or[b'']
              print('OBSTACLE_FAILURE_INDEX '+json.dumps(dict(path=name,bytes=len(raw),sha256=hashlib.sha256(raw).hexdigest(),chunks=len(chunks)),sort_keys=True))
              for i,part in enumerate(chunks):print('OBSTACLE_FAILURE_CHUNK '+json.dumps(dict(path=name,index=i,base64=base64.b64encode(part).decode()),sort_keys=True))
          PY
      - name: Preserve full available derived readback and failures in cloud
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mainchip-obstacle-failure-readback-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            obstacle-failure-evidence/
            obstacle-failure-cloud-only/
            obstacle-failure-worker.stdout
            obstacle-failure-worker.stderr
          if-no-files-found: error
          retention-days: 90
  preserve-job-log:
    needs: readback
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Preserve full actual source job log and metadata
        run: |
          python3 -B - <<'PY'
          import hashlib,json,os,subprocess
          from pathlib import Path
          root=Path('job-logs');root.mkdir()
          e=os.environ
          assert e['GITHUB_REPOSITORY']=='Melihakbulut221/nssoc' and e['GITHUB_RUN_ATTEMPT']=='1'
          prefix='repos/'+e['GITHUB_REPOSITORY']+'/'
          def read(path,name):
              b=subprocess.check_output(['gh','api',prefix+path]);(root/name).write_bytes(b);return json.loads(b)
          run=read('actions/runs/'+e['GITHUB_RUN_ID'],'run.json')
          assert run['head_sha']==e['GITHUB_SHA'] and run['run_attempt']==1
          jobs=read('actions/runs/'+e['GITHUB_RUN_ID']+'/attempts/1/jobs?per_page=100','jobs.json')
          selected=[j for j in jobs['jobs'] if j['name']=='readback'];assert len(selected)==1
          j=selected[0];assert j['status']=='completed' and j['head_sha']==e['GITHUB_SHA']
          read('actions/jobs/'+str(j['id']),'job.json')
          b=subprocess.check_output(['gh','api','--allow-escape-sequences',prefix+'actions/jobs/'+str(j['id'])+'/logs'])
          assert b;(root/'job.log').write_bytes(b)
          receipt=dict(source=e['GITHUB_SHA'],run_id=int(e['GITHUB_RUN_ID']),attempt=1,
            job_id=j['id'],job_conclusion=j['conclusion'],full_raw_job_log=True,
            log_bytes=len(b),log_sha256=hashlib.sha256(b).hexdigest(),native_acquisition=False)
          (root/'receipt.json').write_text(json.dumps(receipt,sort_keys=True,indent=2)+'\n')
          print(json.dumps(receipt,sort_keys=True))
          PY
      - name: Preserve complete actual logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mainchip-obstacle-failure-job-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: job-logs
          if-no-files-found: error
          retention-days: 90
