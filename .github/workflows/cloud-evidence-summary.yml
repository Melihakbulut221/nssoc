name: Read SRAM search-limit diagnostics without native object loading
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: /scripts/diagnose_dp_search_messages.py
      - run: gh api repos/${{ github.repository }}/actions/artifacts/14111500413/zip > native.zip
      - run: python3 scripts/diagnose_dp_search_messages.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dp-sram-search-messages-derived-${{ github.run_id }}
          path: out/*.json
          if-no-files-found: error
          retention-days: 90
