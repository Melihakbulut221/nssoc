name: Inspect remaining SRAM top ports and primitive inventory
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: /scripts/diagnose_dp_matrix_top.py
      - run: |
          gh api repos/${{ github.repository }}/actions/artifacts/14113100183/zip > native.zip
          python3 -m pip install klayout==0.30.13
      - run: python3 -X faulthandler scripts/diagnose_dp_matrix_top.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: success()
        with:
          name: dp-matrix-top-derived-${{ github.run_id }}
          path: out/*.json
          if-no-files-found: error
          retention-days: 90
