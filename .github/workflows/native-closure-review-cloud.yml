name: native-closure-review-cloud
on:
  push:
    branches: [codex/complete-open-work]
    paths: [.github/workflows/native-closure-review-cloud.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-closure-review-${{ github.ref }}
  cancel-in-progress: false
jobs:
  native-reports:
    strategy:
      fail-fast: false
      matrix:
        case: [tx, mainchip]
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Compile read-only report reviewer
        run: python3 -m py_compile scripts/cloud_native_closure_review.py
      - name: Read exact saved native route logs and states
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/cloud_native_closure_review.py --case ${{ matrix.case }}
      - name: Preserve physical results and failures
        if: always()
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          root=hw/soc/out/cloud-native-closure-review-${{ matrix.case }}
          mkdir -p "$root"
          if [ ! -f "$root/result.json" ]; then
            printf '%s\n' '{"status":"FAIL_MISSING_REPORT","accepted":false}' > "$root/result.json"
          fi
          stem="native-closure-review-${{ matrix.case }}-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          cp "$root/result.json" "$stem.summary.json"
          python3 scripts/cloud_chunked_results.py --directory "$root" --stem "$stem"
          python3 - "$stem" <<'PYCODE'
          import json,subprocess,sys
          stem=sys.argv[1];manifest=stem+'.parts.json';m=json.load(open(manifest))
          subprocess.run([sys.executable,'scripts/publish_cloud_results.py','--group','native-closure-review-${{ matrix.case }}',stem+'.summary.json',manifest,*[p['name']for p in m['parts']]],check=True)
          PYCODE
      - name: Retain evidence after publication failure
        if: always() && steps.publish.outcome == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-closure-review-${{ matrix.case }}-${{ github.run_id }}
          path: hw/soc/out/cloud-native-closure-review-${{ matrix.case }}/
          retention-days: 30

