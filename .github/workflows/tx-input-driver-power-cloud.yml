name: tx-input-driver-power-cloud
on:
  push:
    branches: [codex/complete-open-work]
    paths: [.github/workflows/tx-input-driver-power-cloud.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tx-input-driver-power-${{ github.ref }}
  cancel-in-progress: false
jobs:
  full-driver-assembly:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Restore exact native CAD runtime
        run: |
          python3 -m py_compile scripts/cloud_tx_input_driver_power.py
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libfuse2 tcl8.6 tk8.6
          python3 -m pip install networkx==3.4.2 numpy==2.1.3
          PYTHONPATH=scripts python3 -c "import pcie_pll_native_fixture_v1"
          curl --fail --location --retry 4 https://github.com/librelane/librelane/releases/download/3.0.5/librelane-devshell-x86_64.AppImage -o "$RUNNER_TEMP/librelane.AppImage"
          echo "d6a349ec65be11456e96c4981d35f63ca34d3c85daf79a51e1ccb907bb5d7466  $RUNNER_TEMP/librelane.AppImage" | sha256sum --check
          chmod +x "$RUNNER_TEMP/librelane.AppImage"
          echo "CLOUD_APPIMAGE=$RUNNER_TEMP/librelane.AppImage" >> "$GITHUB_ENV"
      - name: Verify actual wider metal and2x2 upper vias with all original physical fault controls
        run: python3 scripts/cloud_tx_input_driver_power.py
      - name: Preserve every physical gate and fault including failed geometry
        if: always()
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p hw/soc/out/cloud-tx-input-driver-power
          if [ ! -f hw/soc/out/cloud-tx-input-driver-power/result.json ]; then
            printf '%s\n' '{"status":"FAIL_MISSING_REPORT","accepted":false}' > hw/soc/out/cloud-tx-input-driver-power/result.json
          fi
          stem="tx-input-driver-power-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          cp hw/soc/out/cloud-tx-input-driver-power/result.json "$stem.summary.json"
          python3 scripts/cloud_chunked_results.py --directory hw/soc/out/cloud-tx-input-driver-power --stem "$stem"
          python3 - "$stem" <<'PYCODE'
          import json,subprocess,sys
          stem=sys.argv[1];manifest=stem+'.parts.json';m=json.load(open(manifest))
          subprocess.run([sys.executable,'scripts/publish_cloud_results.py','--group','tx-input-driver-power',stem+'.summary.json',manifest,*[p['name']for p in m['parts']]],check=True)
          PYCODE
      - name: Retain evidence after publication failure
        if: always() && steps.publish.outcome == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tx-input-driver-power-${{ github.run_id }}
          retention-days: 30
          path: hw/soc/out/cloud-tx-input-driver-power/
