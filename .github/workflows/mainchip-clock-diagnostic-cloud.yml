# SPDX-License-Identifier: Apache-2.0
name: mainchip-clock-diagnostic-cloud
on:
  workflow_dispatch:
    inputs:
      execute:
        type: boolean
        default: false
        required: true
        description: Read the saved failed clock audit without routing or accepting it
permissions:
  contents: read
  actions: read
concurrency:
  group: mainchip-clock-diagnostic-${{ github.ref }}
  cancel-in-progress: false
jobs:
  controls:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Exact new admission and all original timing and physical decision controls
        run: |
          python3 scripts/check_mainchip_route12_postroute_sources.py
          python3 scripts/check_mainchip_postroute_inputs_sources.py
          python3 scripts/cloud_mainchip_saved_postroute.py --controls
          python3 scripts/cloud_mainchip_clock_diagnostic.py --controls > cloud-mainchip-saved-postroute-controls/clock-diagnostic.json
          cat cloud-mainchip-saved-postroute-controls/clock-diagnostic.json
          PYTHONPATH=scripts python3 - <<'PYCODE'
          import json,mainchip_saved_postroute_publisher_base as p
          print(json.dumps(p.controls(),indent=2))
          PYCODE
          python3 scripts/check_mainchip_saved_postroute_publication.py > cloud-mainchip-saved-postroute-controls/publication-wrapper.json
          cat cloud-mainchip-saved-postroute-controls/publication-wrapper.json
          python3 scripts/wait_cloud_tested_source_release.py --controls > cloud-mainchip-saved-postroute-controls/reservation-wait.json
          cat cloud-mainchip-saved-postroute-controls/reservation-wait.json
      - name: Actual unchanged native flow step contract
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libfuse2
          python3 scripts/bootstrap_flow.py
          app="$GITHUB_WORKSPACE/hw/soc/tools/physical/librelane-3.0.5-x86_64.AppImage"
          "$app" python scripts/check_onehot_routed_extraction_native.py
          PYTHONPATH=hw/soc/pnr "$app" python - <<'PYCODE'
          from mainchip_completed_postroute_flow import MainchipCompletedPostroute
          from librelane.steps import OpenROAD,Odb
          from librelane.state import DesignFormat
          from replay_onehot_routed_extraction_flow import AuditedRCX,AuditedRoutedSTA
          assert MainchipCompletedPostroute.Steps==[OpenROAD.CheckAntennas,Odb.ReportDisconnectedPins,AuditedRCX,AuditedRoutedSTA]
          assert AuditedRCX.inputs==[DesignFormat.DEF]
          print('PASS_ACTUAL_NATIVE_POSTROUTE_STEP_CONTRACT_NO_ROUTE_EXECUTED')
          PYCODE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: clock-diagnostic-controls-${{ github.run_id }}
          path: cloud-mainchip-saved-postroute-controls/
          retention-days: 30
  native:
    if: inputs.execute
    needs: controls
    runs-on: ubuntu-22.04
    timeout-minutes: 350
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Wait for externally reserved exact tested-source evidence release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/wait_cloud_tested_source_release.py --group mainchip-route12-clock-diagnostic
      - name: Restore exact original native CAD runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libfuse2
          python3 scripts/bootstrap_flow.py
          echo "CLOUD_APPIMAGE=$GITHUB_WORKSPACE/hw/soc/tools/physical/librelane-3.0.5-x86_64.AppImage" >> "$GITHUB_ENV"
      - name: Diagnose exact original failed all-clock gate without changing routing
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/cloud_mainchip_clock_diagnostic.py
      - name: Preserve complete output or failure
        if: always()
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/cloud_mainchip_clock_diagnostic.py --publish
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && steps.publish.outcome == 'failure'
        with:
          name: clock-diagnostic-native-${{ github.run_id }}
          path: |
            cloud-mainchip-clock-diagnostic/
          retention-days: 30
