name: pll-filter-parent-cloud
on:
  push:
    branches: [codex/complete-open-work]
    paths: [.github/workflows/pll-filter-parent-cloud.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pll-filter-parent-${{ github.ref }}
  cancel-in-progress: false
jobs:
  actual845-parent-nine-um:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Restore exact native CAD runtime
        run: |
          python3 -m py_compile scripts/run_cloud_pll_filter_parent.py
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libfuse2 tcl8.6
          curl --fail --location --retry 4 https://github.com/librelane/librelane/releases/download/3.0.5/librelane-devshell-x86_64.AppImage -o "$RUNNER_TEMP/librelane.AppImage"
          echo "d6a349ec65be11456e96c4981d35f63ca34d3c85daf79a51e1ccb907bb5d7466  $RUNNER_TEMP/librelane.AppImage" | sha256sum --check
          chmod +x "$RUNNER_TEMP/librelane.AppImage"
          echo "CLOUD_APPIMAGE=$RUNNER_TEMP/librelane.AppImage" >> "$GITHUB_ENV"
      - name: Integrate real capacitor preserving every other macro and run parent DRC LVS and faults
        run: python3 scripts/run_cloud_pll_filter_parent.py
      - name: Publish physical success or failure evidence
        if: always()
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p hw/soc/out/cloud-pll-filter-parent
          if [ ! -f hw/soc/out/cloud-pll-filter-parent/result.json ]; then
            printf '%s\n' '{"status":"FAIL_MISSING_REPORT","accepted":false}' > hw/soc/out/cloud-pll-filter-parent/result.json
          fi
          stem="pll-filter-parent-9-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          cp hw/soc/out/cloud-pll-filter-parent/result.json "$stem.summary.json"
          python3 scripts/cloud_chunked_results.py --directory hw/soc/out/cloud-pll-filter-parent --stem "$stem"
          python3 - "$stem" <<'PYCODE'
          import json,subprocess,sys
          stem=sys.argv[1];manifest=stem+'.parts.json';m=json.load(open(manifest))
          subprocess.run([sys.executable,'scripts/publish_cloud_results.py','--group','pll-filter-parent-9',stem+'.summary.json',manifest,*[p['name']for p in m['parts']]],check=True)
          PYCODE
      - name: Retain evidence after publication failure
        if: always() && steps.publish.outcome == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pll-filter-parent-9-${{ github.run_id }}
          retention-days: 30
          path: hw/soc/out/cloud-pll-filter-parent/
