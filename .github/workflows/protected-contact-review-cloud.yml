name: protected-contact-review-cloud
on:
  push:
    branches: [codex/complete-open-work]
    paths: [.github/workflows/protected-contact-review-cloud.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: protected-contact-review-${{ github.ref }}
  cancel-in-progress: false
jobs:
  source-bound-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Restore exact geometry evidence and identify every contact
        run: python3 scripts/review_cloud_protected_contacts.py
      - name: Preserve diagnosis including failures
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p cloud-protected-contact-review
          if [ ! -f cloud-protected-contact-review/result.json ]; then
            printf '%s\n' '{"status":"FAIL_MISSING_REPORT","accepted":false}' > cloud-protected-contact-review/result.json
          fi
          cp cloud-protected-contact-review/result.json "protected-contact-review-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.summary.json"
          python3 scripts/publish_cloud_results.py --group protected-contact-review "protected-contact-review-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.summary.json"
