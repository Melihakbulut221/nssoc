name: lcrc-word-onehot-timing-cloud
on:
  push:
    branches: [codex/complete-open-work]
    paths: [.github/workflows/lcrc-word-onehot-timing-cloud.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: lcrc-word-onehot-timing-${{ github.ref }}
  cancel-in-progress: false
jobs:
  source-diagnosis:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Build pinned current native STA runtime in the cloud
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake tcl-dev swig bison flex automake autoconf libtool autotools-dev libeigen3-dev libfmt-dev libgtest-dev zlib1g-dev
          git init "$RUNNER_TEMP/cudd"
          git -C "$RUNNER_TEMP/cudd" remote add origin https://github.com/cuddorg/cudd.git
          git -C "$RUNNER_TEMP/cudd" fetch --depth 1 origin f54f533303640afd5dbe47a05ebeabb3066f2a25
          git -C "$RUNNER_TEMP/cudd" checkout --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/cudd" rev-parse HEAD)" = f54f533303640afd5dbe47a05ebeabb3066f2a25
          (
            cd "$RUNNER_TEMP/cudd"
            autoreconf -fi
            ./configure --prefix="$RUNNER_TEMP/cudd-install"
            make -j2
            make install
          )
          git init "$RUNNER_TEMP/opensta"
          git -C "$RUNNER_TEMP/opensta" remote add origin https://github.com/The-OpenROAD-Project/OpenSTA.git
          git -C "$RUNNER_TEMP/opensta" fetch --depth 1 origin f2b334cf92b75c4091cb521de4607b0cf54c7b1b
          git -C "$RUNNER_TEMP/opensta" checkout --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/opensta" rev-parse HEAD)" = f2b334cf92b75c4091cb521de4607b0cf54c7b1b
          cmake -S "$RUNNER_TEMP/opensta" -B "$RUNNER_TEMP/opensta/build" -DCMAKE_BUILD_TYPE=Release -DCUDD_DIR="$RUNNER_TEMP/cudd-install"
          cmake --build "$RUNNER_TEMP/opensta/build" --parallel 2
          echo "$RUNNER_TEMP/opensta/build" >> "$GITHUB_PATH"
          echo "OPENSTA_SOURCE_COMMIT=f2b334cf92b75c4091cb521de4607b0cf54c7b1b" >> "$GITHUB_ENV"
          echo "CUDD_SOURCE_COMMIT=f54f533303640afd5dbe47a05ebeabb3066f2a25" >> "$GITHUB_ENV"
      - uses: YosysHQ/setup-oss-cad-suite@aefa8397bbf8fc6670a0a62af9805a89738f3cde
        with:
          version: '2026-08-04'
          github-token: ${{ github.token }}
      - name: Measure exact proved mapped netlists at all three library corners
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -m py_compile scripts/cloud_lcrc_word_onehot_timing.py
          python3 scripts/cloud_lcrc_word_onehot_timing.py
      - name: Preserve original-source receipt and complete native trial
        if: always()
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          root=cloud-lcrc-word-onehot-timing
          mkdir -p "$root"
          if [ ! -f "$root/result.json" ]; then
            printf '%s\n' '{"status":"FAIL_MISSING_REPORT","accepted":false}' > "$root/result.json"
          fi
          stem="lcrc-word-onehot-timing-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          cp "$root/result.json" "$stem.summary.json"
          python3 scripts/cloud_chunked_results.py --directory "$root" --stem "$stem"
          python3 - "$stem" <<'PYCODE'
          import json,subprocess,sys
          stem=sys.argv[1];manifest=stem+'.parts.json';m=json.load(open(manifest))
          subprocess.run([sys.executable,'scripts/publish_cloud_results.py','--group','lcrc-word-onehot-timing',stem+'.summary.json',manifest,*[p['name']for p in m['parts']]],check=True)
          PYCODE
      - name: Retain evidence after publication failure
        if: always() && steps.publish.outcome == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: lcrc-word-onehot-timing-${{ github.run_id }}
          path: cloud-lcrc-word-onehot-timing/
          retention-days: 30
