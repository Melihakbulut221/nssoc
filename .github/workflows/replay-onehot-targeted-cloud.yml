name: replay-onehot-targeted-cloud
on:
  push:
    branches: [codex/complete-open-work]
    paths: [.github/workflows/replay-onehot-targeted-cloud.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: replay-onehot-targeted-${{ github.ref }}
  cancel-in-progress: false
jobs:
  native-physical:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: YosysHQ/setup-oss-cad-suite@aefa8397bbf8fc6670a0a62af9805a89738f3cde
        with:
          version: '2026-08-04'
          github-token: ${{ github.token }}
      - name: Prepare pinned native physical runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libfuse2
          python3 scripts/bootstrap_flow.py
          echo "CLOUD_APPIMAGE=$GITHUB_WORKSPACE/hw/soc/tools/physical/librelane-3.0.5-x86_64.AppImage" >> "$GITHUB_ENV"
      - name: Rebuild exact critical buffer branches and verify native timing and logic
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -m py_compile scripts/cloud_replay_onehot_targeted.py
          python3 scripts/cloud_replay_onehot_targeted.py
      - name: Preserve original-source receipt and complete native trial
        if: always()
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          root=hw/soc/out/cloud-replay-onehot-targeted
          mkdir -p "$root"
          if [ ! -f "$root/result.json" ]; then
            printf '%s\n' '{"status":"FAIL_MISSING_REPORT","accepted":false}' > "$root/result.json"
          fi
          stem="replay-onehot-targeted-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          cp "$root/result.json" "$stem.summary.json"
          python3 scripts/cloud_chunked_results.py --directory "$root" --stem "$stem"
          python3 - "$stem" <<'PYCODE'
          import json,subprocess,sys
          stem=sys.argv[1];manifest=stem+'.parts.json';m=json.load(open(manifest))
          subprocess.run([sys.executable,'scripts/publish_cloud_results.py','--group','replay-onehot-targeted',stem+'.summary.json',manifest,*[p['name']for p in m['parts']]],check=True)
          PYCODE
      - name: Retain evidence after publication failure
        if: always() && steps.publish.outcome == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: replay-onehot-targeted-${{ github.run_id }}
          path: hw/soc/out/cloud-replay-onehot-targeted/
          retention-days: 30
